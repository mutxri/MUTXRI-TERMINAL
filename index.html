<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUTXRI CAPITAL</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="tickerfix.js"></script>
<style>
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}

  /* ===== TOP BAR ===== */
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line2);flex:0 0 auto}
  .logo{font-family:'Sofia Sans Semi Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--acc);letter-spacing:1px;white-space:nowrap}
  .logo small{color:var(--tx3);font-weight:400;font-size:9px;letter-spacing:2px;display:block}
  .exch-tabs{display:flex;gap:2px}
  .exch-tab{padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--tx2);cursor:pointer;border:1px solid var(--line);border-radius:2px;background:var(--bg3);letter-spacing:.05em}
  .exch-tab:hover{color:var(--tx);border-color:var(--line2)}
  .exch-tab.active{background:var(--acc);color:#00110b;font-weight:700;border-color:var(--acc)}
  .search{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--line2);border-radius:2px;padding:4px 8px;flex:0 1 220px}
  .search input{background:none;border:none;outline:none;color:var(--tx);font-family:var(--mono);font-size:11px;width:100%}
  .clock{font-family:var(--mono);font-size:10px;color:var(--tx3);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ===== TICKER TAPE ===== */
  .tape{display:flex;overflow:hidden;background:var(--bg3);border-bottom:1px solid var(--line);flex:0 0 auto;height:26px;align-items:center}
  .tape-inner{display:flex;gap:22px;padding:0 12px;white-space:nowrap;animation:scroll 60s linear infinite;font-family:var(--mono);font-size:11px}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .tape-item{display:inline-flex;gap:6px;align-items:center}
  .tape-item .sym{color:var(--tx);font-weight:700}
  .tape-item .pr{color:var(--tx2)}
  .tape-item .chg.up{color:var(--up)} .tape-item .chg.down{color:var(--down)}

  /* ===== MAIN 3-PANEL ===== */
  main{flex:1;display:flex;min-height:0}
  .col-left{flex:0 0 280px;background:var(--bg2);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
  .col-center{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .col-right{flex:0 0 340px;background:var(--bg2);border-left:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}

  /* ===== LEFT: WATCHLIST ===== */
  .wl-head{padding:8px 12px;font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .wl-list{flex:1;overflow-y:auto}
  .wl-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-family:var(--mono);font-size:11px}
  .wl-row:hover{background:var(--bg3)}
  .wl-row .sym{color:var(--acc);font-weight:700;min-width:52px}
  .wl-row .nm{color:var(--tx3);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;padding:0 8px}
  .wl-row .pr{color:var(--tx);text-align:right}
  .wl-row .chg{text-align:right;min-width:58px}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)}

  /* ===== CENTER: PANEL STAGE ===== */
  .center-tabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--bg2);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
  .center-tabs::-webkit-scrollbar{display:none}
  .ctab{padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--tx2);cursor:pointer;border:1px solid var(--line);border-radius:2px 2px 0 0;background:var(--bg3);white-space:nowrap;letter-spacing:.04em}
  .ctab:hover{color:var(--tx)}
  .ctab.active{background:var(--bg);color:var(--acc);border-bottom-color:var(--bg);font-weight:700}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}

  /* ===== BOTTOM STATUS ===== */
  footer{display:flex;align-items:center;gap:16px;padding:6px 14px;background:var(--bg2);border-top:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--tx3);flex:0 0 auto}
  footer .ok{color:var(--up)} footer .warn{color:#eab308}
  footer span{white-space:nowrap}
  .cmd{flex:1;display:flex;gap:6px;align-items:center}
  .cmd b{color:var(--acc)}
  .cmd input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--mono);font-size:11px}
</style>
</head>
<body>

<header>
  <div class="logo">MUTXRI<small>CAPITAL</small></div>
  <div class="exch-tabs" id="exchTabs">
    <div class="exch-tab active" data-ex="JSE">JSE</div>
    <div class="exch-tab" data-ex="EGX">EGX</div>
    <div class="exch-tab" data-ex="NGX">NGX</div>
    <div class="exch-tab" data-ex="NSE">NSE</div>
  </div>
  <div class="search"><input id="q" placeholder="search ticker…" autocomplete="off"></div>
  <div class="acct" id="acctBox" style="display:flex;align-items:center;gap:8px">
    <button id="acctBtn" onclick="toggleAuth()" style="background:var(--bg3);border:1px solid var(--line2);color:var(--acc);font-family:inherit;font-size:10px;padding:4px 10px;border-radius:2px;cursor:pointer">SIGN IN</button>
  </div>
  <div class="clock"><span class="dot"></span><span id="clock">—</span></div>
</header>

<div class="tape"><div class="tape-inner" id="tape"></div></div>

<main>
  <div class="col-left">
    <div class="wl-head"><span id="wlEx">JSE · 367</span><span id="wlState">LIVE</span></div>
    <div class="wl-list" id="wlList"></div>
  </div>

  <div class="col-center">
    <div class="center-tabs" id="centerTabs"></div>
    <div class="stage"><iframe id="stageFrame" src="/features/panels/afri_heatmap.html"></iframe></div>
  </div>

  <div class="col-right">
    <div class="wl-head"><span>MARKET</span><span>—</span></div>
    <div style="flex:1;overflow-y:auto;padding:12px;font-family:var(--mono);font-size:11px;color:var(--tx2)" id="rightInfo">
      Select a stock from the watchlist.<br><br>
      Tabs above: HEATMAP · SCREENER · REG · GLCO · BND · FX · TAS · RATINGS
    </div>
  </div>
</main>

<!-- Auth modal -->
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:24px;width:320px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <b style="color:var(--acc);letter-spacing:.1em" id="authTitle">SIGN IN</b>
      <span onclick="toggleAuth()" style="cursor:pointer;color:var(--tx3)">✕</span>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button onclick="authMode('login')" id="authTabLogin" style="flex:1;background:var(--bg3);border:1px solid var(--acc);color:var(--acc);font-family:inherit;font-size:10px;padding:5px;border-radius:2px;cursor:pointer">LOGIN</button>
      <button onclick="authMode('signup')" id="authTabSignup" style="flex:1;background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);font-family:inherit;font-size:10px;padding:5px;border-radius:2px;cursor:pointer">SIGN UP</button>
    </div>
    <div id="authNameRow" style="display:none;margin-bottom:10px">
      <input id="authName" placeholder="name (optional)" style="width:100%;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:inherit;font-size:11px;padding:7px;border-radius:2px;box-sizing:border-box">
    </div>
    <input id="authEmail" placeholder="email" style="width:100%;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:inherit;font-size:11px;padding:7px;border-radius:2px;box-sizing:border-box;margin-bottom:10px">
    <input id="authPass" type="password" placeholder="password (min 6)" style="width:100%;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:inherit;font-size:11px;padding:7px;border-radius:2px;box-sizing:border-box;margin-bottom:14px">
    <button onclick="authSubmit()" style="width:100%;background:var(--acc);color:#000;font-family:inherit;font-size:11px;font-weight:bold;padding:8px;border:none;border-radius:2px;cursor:pointer">GO</button>
    <div id="authMsg" style="color:var(--warn);font-size:10px;margin-top:10px;min-height:14px"></div>
  </div>
</div>

<footer>
  <span class="ok" id="feedState">● LIVE</span>
  <span>JSE/EGX live · NGX/NSE EOD</span>
  <a href="docs.html" style="color:var(--acc);font-size:10px;text-decoration:none;border:1px solid rgba(51,226,154,.35);padding:2px 8px;border-radius:2px">DOCS</a>
  <a href="LINKS.html" style="color:var(--acc);font-size:10px;text-decoration:none;border:1px solid rgba(51,226,154,.35);padding:2px 8px;border-radius:2px">LINKS</a>
  <div class="cmd"><b>`</b><input id="cmd" placeholder="command (HELP)" spellcheck="false"></div>
</footer>

<script>
// ===== BACKEND CONFIG (GitHub Pages deployment) =====
// Empty string = local/snapshot mode. Set to deployed backend URL (NO trailing
// slash) to route all /api/* calls to the live server.
const API_BASE = "https://75f1f98fe76c2e.lhr.life";
const __origFetch = window.fetch;
window.fetch = function(url, opts){
  const u = String(url);
  const isApi = u.indexOf('/api/') === 0;
  if(isApi && API_BASE){
    return __origFetch(API_BASE + u, opts);
  }
  return __origFetch(url, opts);
};
window.API_BASE = API_BASE;
// ===== END BACKEND CONFIG =====


// ===== Email accounts (auth) =====
let authMode_ = 'login';
function toggleAuth(){
  const m = document.getElementById('authModal');
  const on = m.style.display === 'flex';
  m.style.display = on ? 'none' : 'flex';
  if(!on){ authMode('login'); document.getElementById('authMsg').textContent=''; }
}
function authMode(mode){
  authMode_ = mode;
  document.getElementById('authTitle').textContent = mode === 'login' ? 'SIGN IN' : 'CREATE ACCOUNT';
  document.getElementById('authNameRow').style.display = mode === 'signup' ? 'block' : 'none';
  const tl = document.getElementById('authTabLogin'), ts = document.getElementById('authTabSignup');
  tl.style.borderColor = mode === 'login' ? 'var(--acc)' : 'var(--line2)';
  tl.style.color = mode === 'login' ? 'var(--acc)' : 'var(--tx2)';
  ts.style.borderColor = mode === 'signup' ? 'var(--acc)' : 'var(--line2)';
  ts.style.color = mode === 'signup' ? 'var(--acc)' : 'var(--tx2)';
  document.getElementById('authMsg').textContent = '';
}
function authApi(action, params){
  const url = window.API_BASE ? window.API_BASE + '/api/auth/' + action + '?' + new URLSearchParams(params) : '/api/auth/' + action + '?' + new URLSearchParams(params);
  return fetch(url).then(r => r.json());
}
function authSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const name = document.getElementById('authName').value.trim();
  const msg = document.getElementById('authMsg');
  if(!email || !pass){ msg.textContent = 'email and password required'; return; }
  const params = {email, password: pass};
  if(authMode_ === 'signup'){ params.name = name; }
  authApi(authMode_, params).then(res => {
    if(res.ok){
      localStorage.setItem('mutxri_token', res.token);
      localStorage.setItem('mutxri_email', res.email);
      setSignedIn(res.email, res.name);
      toggleAuth();
    } else {
      msg.textContent = res.error || 'failed';
    }
  }).catch(() => { msg.textContent = 'auth service unavailable (static mode)'; });
}
function signOut(){
  const token = localStorage.getItem('mutxri_token');
  if(token) authApi('logout', {token}).catch(()=>{});
  localStorage.removeItem('mutxri_token');
  localStorage.removeItem('mutxri_email');
  const b = document.getElementById('acctBtn');
  b.textContent = 'SIGN IN';
  b.style.color = 'var(--acc)';
  b.onclick = toggleAuth;
}
function setSignedIn(email, name){
  const b = document.getElementById('acctBtn');
  b.textContent = (name || email.split('@')[0]).toUpperCase();
  b.style.color = 'var(--acc)';
  b.onclick = signOut;
}
// restore session on load
(function(){
  const token = localStorage.getItem('mutxri_token');
  if(token){
    const url = window.API_BASE ? window.API_BASE + '/api/auth/me?token=' + token : '/api/auth/me?token=' + token;
    fetch(url).then(r => r.json()).then(res => {
      if(res.ok) setSignedIn(res.email, res.name);
      else { localStorage.removeItem('mutxri_token'); }
    }).catch(()=>{});
  }
})();
// ===== END auth =====


const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let currentEx = 'JSE';
let listing = {};

// ===== Clock =====
setInterval(() => {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('en-GB', {hour12:false});
}, 1000);

// ===== Tabs (Claude's panels, untouched, embedded) =====
const PANELS = [
  {id:'heatmap', label:'HEATMAP', url:'/features/panels/afri_heatmap.html'},
  {id:'screener',label:'SCREENER', url:'/features/panels/afri_screener.html'},
  {id:'financials',label:'FINANCIALS', url:'/features/panels/afri_financials.html'},
  {id:'reg',     label:'REG',      url:'/features/panels/afri_reg.html'},
  {id:'glco',    label:'GLCO',     url:'/features/panels/afri_glco.html'},
  {id:'bnd',     label:'BND',      url:'/features/panels/afri_bnd.html'},
  {id:'fx',      label:'FX',       url:'/features/panels/afri_fx.html'},
  {id:'tas',     label:'TAS',      url:'/features/panels/afri_tas.html'},
  {id:'ratings', label:'RATINGS',  url:'/features/panels/afri_ratings.html'},
];
PANELS.forEach((p, i) => {
  const t = document.createElement('div');
  t.className = 'ctab' + (i === 0 ? ' active' : '');
  t.textContent = p.label;
  t.onclick = () => {
    document.querySelectorAll('.ctab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('stageFrame').src = p.url;
  };
  $('centerTabs').appendChild(t);
});

// ===== Load listing =====
async function loadListing(ex){
  try{
    const r = await fetch('static_data/listing_' + ex + '.json');
    const d = await r.json();
    listing[ex] = d.stocks || [];
    $('wlEx').textContent = ex + ' · ' + listing[ex].length;
    renderWatchlist($('q').value);
    buildTape(ex);            // tape now shows the new exchange immediately
    primeQuotes(ex);          // then refresh with live quotes
  }catch(e){ console.error('listing fail', e); }
}

function stockTicker(s){
  return s.ticker || s.short || s.code || (s.sym || '').split('.')[0] || (s.name || '').split(' ')[0].toUpperCase();
}

function renderWatchlist(filter){
  const list = listing[currentEx] || [];
  const f = (filter || '').toUpperCase();
  const rows = f ? list.filter(s => stockTicker(s).includes(f) || (s.name||'').toUpperCase().includes(f)) : list.filter(s => s.instrument !== 'structured');
  const el = $('wlList');
  el.innerHTML = rows.slice(0, 300).map(s => {
    // JSE/EGX: quote from cache; NGX/NSE: EOD data embedded in the listing
    const q = quotes[s.sym] || {};
    const price = q.price != null ? q.price : s.price;
    const chg = q.changePct != null ? q.changePct : s.chgPct;
    const vol = q.volume != null ? q.volume : s.volume;
    const cur = s.currency || (q.currency || '');
    const pr = price != null ? Number(price).toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
    const cls = chg === null || chg === undefined ? '' : (chg >= 0 ? 'up' : 'down');
    const sign = chg === null || chg === undefined ? '' : TickerFix.fmtPct(chg);
    const sym = stockTicker(s);
    const volTxt = vol != null ? Number(vol).toLocaleString() : '';
    return `<div class="wl-row" onclick="openStock('${esc(s.sym || s.ticker || s.name || '')}')">
      <span class="sym">${esc(sym)}</span>
      <span class="nm">${esc(s.name||'')}</span>
      <span class="pr">${pr} <small style="color:var(--tx3)">${esc(cur)}</small></span>
      <span class="chg ${cls}">${sign}</span>
      <span class="pr" style="font-size:9px;color:var(--tx3);min-width:70px;text-align:right">${volTxt}</span>
    </div>`;
  }).join('') || '<div style="padding:20px;color:var(--tx3);font-family:var(--mono);font-size:11px">no stocks</div>';
}

// ===== Quotes =====
let quotes = {};
async function primeQuotes(ex){
  const syms = (listing[ex]||[]).filter(s => s.sym).slice(0, 80).map(s => s.sym);
  if(!syms.length) return;
  try{
    const r = await fetch('/api/quotes?symbols=' + syms.join(','));
    const d = await r.json();
    Object.assign(quotes, d);
    renderWatchlist($('q').value);
    buildTape(ex);
  }catch(e){ console.error('quotes fail', e); }
}

// ===== Ticker tape =====
function buildTape(ex){
  // live-quotes version: refresh with fetched quotes
  buildTapeFromListing(ex);
}

// ===== Exchange tabs =====
document.querySelectorAll('.exch-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.exch-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentEx = t.dataset.ex;
    if(!listing[currentEx]) {
      // immediate tape from the new exchange's own data, then refresh
      buildTapeFromListing(currentEx);
      renderWatchlist($('q').value);
      loadListing(currentEx);
    } else {
      buildTapeFromListing(currentEx);
      renderWatchlist($('q').value);
      primeQuotes(currentEx);
    }
  };
});

// ===== Tape helpers =====
function tapeItem(s){
  const q = quotes[s.sym] || {};
  const price = q.price != null ? q.price : s.price;
  const chg = q.changePct != null ? q.changePct : s.chgPct;
  if(price == null) return '';
  const tkr = stockTicker(s);
  const cls = TickerFix.pctClass(chg);
  const sign = chg >= 0 ? '+' : '';
  return `<span class="tape-item"><span class="sym">${esc(tkr)}</span><span class="pr">${Number(price).toLocaleString(undefined,{maximumFractionDigits:2})}</span><span class="chg ${cls}">${TickerFix.fmtPct(chg)}</span></span>`;
}
function buildTapeFromListing(ex){
  // instant: use the listing's own price data (EOD) - no network wait
  // only real common stocks (skip structured notes, prefs, bonds, ETFs)
  const syms = (listing[ex]||[]).filter(s => (s.instrument !== 'structured') && (s.sym || s.ticker)).slice(0, 40);
  const items = syms.map(tapeItem).filter(Boolean).join('');
  $('tape').innerHTML = items + items;
  // real indices on top (EGX 30, JSE Top 40, JSE All-Share + NGX/NSE baskets)
  TickerFix.fetchJSONSafe('static_data/indices.json').then(res => {
    if(!res.ok) return;
    const d = res.data;
    if(!d || !d.entries || !d.entries.length) return;
    const ix = d.entries.map(e => {
      const cls = e.changePct >= 0 ? 'up' : 'down';
      const sign = e.changePct >= 0 ? '+' : '';
      const pct = e.changePct != null ? TickerFix.fmtPct(e.changePct) : '—';
      const price = e.price != null ? e.price.toLocaleString(undefined,{maximumFractionDigits:2}) : '';
      const tag = e.kind === 'basket' ? ' (basket)' : '';
      return `<span class="tape-item" style="color:var(--tx2)"><b style="color:var(--acc)">${esc(e.label)}${esc(tag)}</b> <span style="color:#fff">${esc(price)}</span> <span class="${cls}">${esc(pct)}</span></span>`;
    }).join('');
    $('tape').innerHTML = ix + (items + items);
  }).catch(() => {});
}

// ===== Search =====
$('q').addEventListener('input', e => renderWatchlist(e.target.value));

// ===== Command bar =====
$('cmd').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const v = $('cmd').value.trim().toUpperCase();
  $('cmd').value = '';
  if(!v) return;
  const parts = v.split(' ');
  const code = parts[parts.length - 1];
  const idx = PANELS.findIndex(p => p.id === code.toLowerCase() || p.label === code);
  if(idx >= 0){
    document.querySelectorAll('.ctab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.ctab')[idx].classList.add('active');
    $('stageFrame').src = PANELS[idx].url;
  } else if(v === 'HELP'){
    $('rightInfo').innerHTML = PANELS.map(p => `<div style="padding:4px 0"><b style="color:var(--acc)">${p.label}</b> <span style="color:var(--tx3)">→ ${p.url.split('/').pop()}</span></div>`).join('') +
      '<div style="padding:8px 0;color:var(--tx3)">Type a panel code (HEATMAP, SCREEN, REG, GLCO, BND, FX, TAS, RATINGS) then Enter.</div>';
  } else {
    $('rightInfo').innerHTML = `<div style="color:var(--down)">unknown: ${esc(v)}</div>`;
  }
});

function openStock(sym){
  if(!sym) return;
  const ex = currentEx;
  const stock = (listing[ex]||[]).find(s => (s.sym||s.ticker||s.name) === sym || (s.sym||'') === sym);
  $('rightInfo').innerHTML = `<div style="padding:6px 0;color:var(--acc);font-weight:700">${esc(sym)}</div>
    <div style="padding:4px 0;color:var(--tx3)">Loading…</div>`;
  fetch('/api/chart?symbol=' + encodeURIComponent(sym) + '&range=1y&interval=1d')
    .then(r => r.json())
    .then(d => {
      if(d.error){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--down);font-family:var(--mono);font-size:11px">${esc(d.error)}</div>`; return; }
      if(d.noData){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx2);font-family:var(--mono);font-size:11px">
        <div style="color:var(--acc);font-weight:700;margin-bottom:6px">${esc(sym)} · ${esc(d.name||'')}</div>
        <div style="color:var(--tx3);line-height:1.6">${esc(d.message||'No market data available for this security.')}</div></div>`; return; }
      currentChartSym = sym;
      try{ renderStockInfo(d); }catch(e){ console.error('info fail', e); }
      try{ renderChart(d, sym); }catch(e){ console.error('chart fail', e); }
      try{ loadMetrics(sym, ex, stock && stock.name); }catch(e){ console.error('metrics fail', e); }
    })
    .catch(e => $('rightInfo').innerHTML = `<div style="color:var(--down)">${esc(String(e))}</div>`);
}

function loadMetrics(sym, ex, name){
  const params = new URLSearchParams({symbol: sym, exchange: ex||'', name: name||''});
  fetch('/api/metrics?' + params.toString())
    .then(r => r.json())
    .then(d => {
      if(d.error || !d.stock_price) return;
      let html = '<div style="padding:10px 12px;border-top:1px solid var(--line)">';
      html += `<div style="color:var(--acc);font-weight:700;font-size:11px;letter-spacing:.08em;padding-bottom:6px">FULL METRICS</div>`;

      // --- company description ---
      if(d.description){
        html += `<div style="font-size:11px;color:var(--tx2);line-height:1.55;padding:4px 0 8px">${esc(d.description)}</div>`;
      }

      const groups = [
        ['IDENTITY', [['Exchange', d.exchange], ['Country', d.country], ['Currency', d.currency], ['Sector', d.sector], ['Industry', d.industry], ['Founded', d.founded], ['Employees', d.employees != null ? Number(d.employees).toLocaleString() : null], ['Revenue', d.revenue != null ? fmtMoney(d.revenue) : null], ['ISIN', d.isin]]],
        ['PRICE', [['Stock Price', d.stock_price], ['Open', d.open_price], ['High', d.high_price], ['Low', d.low_price], ['Previous Close', d.previous_close], ['Volume', d.volume != null ? Number(d.volume).toLocaleString() : null], ['Avg Volume (20d)', d.avg_volume != null ? Number(d.avg_volume).toLocaleString() : null], ['Dollar Volume', d.dollar_volume != null ? Number(d.dollar_volume).toLocaleString(undefined,{maximumFractionDigits:0}) : null], ['Price Date', d.stock_price_date ? new Date(d.stock_price_date).toISOString().slice(0,10) : null]]],
        ['PRICE CHANGE', [['1D', d.price_change_1D], ['1W', d.price_change_1W], ['1M', d.price_change_1M], ['3M', d.price_change_3M], ['6M', d.price_change_6M], ['YTD', d.price_change_YTD], ['1Y', d.price_change_1Y], ['3Y', d.price_change_3Y], ['5Y', d.price_change_5Y], ['10Y', d.price_change_10Y], ['15Y', d.price_change_15Y], ['20Y', d.price_change_20Y]]],
        ['TOTAL RETURN', [['1W', d.total_return_1W], ['1M', d.total_return_1M], ['3M', d.total_return_3M], ['6M', d.total_return_6M], ['YTD', d.total_return_YTD], ['1Y', d.total_return_1Y], ['3Y', d.total_return_3Y], ['5Y', d.total_return_5Y], ['10Y', d.total_return_10Y], ['15Y', d.total_return_15Y], ['20Y', d.total_return_20Y]]],
        ['CAGR', [['1Y', d.return_cagr_1Y], ['3Y', d.return_cagr_3Y], ['5Y', d.return_cagr_5Y], ['10Y', d.return_cagr_10Y], ['15Y', d.return_cagr_15Y], ['20Y', d.return_cagr_20Y]]],
        ['RANGES', [['52W High', d.fifty_two_week_high], ['52W High Date', d.fifty_two_week_high_date ? new Date(d.fifty_two_week_high_date).toISOString().slice(0,10) : null], ['52W Low', d.fifty_two_week_low], ['52W Low Date', d.fifty_two_week_low_date ? new Date(d.fifty_two_week_low_date).toISOString().slice(0,10) : null], ['Change vs 52W High', d.price_change_52w_high], ['Change vs 52W Low', d.price_change_52w_low], ['Position in Range', d.position_in_range], ['All-Time High', d.all_time_high], ['ATH Date', d.all_time_high_date ? new Date(d.all_time_high_date).toISOString().slice(0,10) : null], ['ATH Change', d.all_time_high_change], ['All-Time Low', d.all_time_low], ['ATL Date', d.all_time_low_date ? new Date(d.all_time_low_date).toISOString().slice(0,10) : null], ['ATL Change', d.all_time_low_change]]],
        ['TECHNICAL', [['RSI (14)', d.rsi_14], ['Weekly RSI', d.rsi_weekly], ['Monthly RSI', d.rsi_monthly], ['ATR (14)', d.atr_14], ['Beta (5Y)', d.beta_5y], ['20-Day MA', d.ma_20], ['50-Day MA', d.ma_50], ['150-Day MA', d.ma_150], ['200-Day MA', d.ma_200], ['Price vs 20D MA', d.price_change_20d_ma], ['Price vs 50D MA', d.price_change_50d_ma], ['Price vs 150D MA', d.price_change_150d_ma], ['Price vs 200D MA', d.price_change_200d_ma], ['50 vs 200 MA', d.ma_50_vs_200]]],
        ['VALUATION (real)', [['PE Ratio', d.pe_ratio], ['Earnings Yield', d.earnings_yield], ['Gross Margin', d.gross_margin], ['Operating Margin', d.operating_margin], ['Profit Margin', d.profit_margin], ['FCF Margin', d.fcf_margin], ['ROA', d.return_on_assets], ['ROE', d.return_on_equity], ['Debt/Equity', d.debt_to_equity]]],
        ['DIVIDENDS', [['Yield', d.dividend_yield], ['DPS', d.dividend_per_share], ['Last Dividend', d.last_dividend], ['Growth', d.dividend_growth], ['Payment Years', d.dividend_payment_years]]],
      ];

      // financial statements section (income statement / balance sheet / cash flow)
      if(d.statements && d.statements.data){
        const s = d.statements.data;
        const period = (d.statements.period||'') + ' ' + (d.statements.year||'');
        const rows = [
          ['Revenue', s.revenue], ['Gross Profit', s.gross_profit], ['Operating Profit', s.operating_profit],
          ['Profit After Tax', s.profit_after_tax], ['EPS', s.eps], ['Total Assets', s.total_assets],
          ['Total Liabilities', s.total_liabilities], ['Shareholders Equity', s.shareholders_equity],
          ['Cash & Equivalents', s.cash_and_equivalents], ['Operating Cash Flow', s.operating_cash_flow],
          ['Investing Cash Flow', s.investing_cash_flow], ['Financing Cash Flow', s.financing_cash_flow],
          ['Dividends Paid', s.dividends_paid], ['Free Float', s.free_float ? s.free_float + '%' : null],
        ];
        const real = rows.filter(([,v]) => v !== null && v !== undefined);
        if(real.length){
          html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">FINANCIAL STATEMENTS <span style="color:var(--tx3);font-weight:400">· ${esc(period)} · ${esc(d.currency||'')}</span></div>`;
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--mono);font-size:10px">';
          real.forEach(([k, v]) => {
            const val = typeof v === 'number' ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v);
            html += `<span style="color:var(--tx3)">${esc(k)}</span><span style="text-align:right;color:var(--tx)">${esc(val)}</span>`;
          });
          html += '</div>';
          if(d.statements.url){
            html += `<div style="padding:4px 0 0;font-size:9px"><a href="${esc(d.statements.url)}" target="_blank" style="color:var(--acc2)">view filing ↗</a></div>`;
          }
        }
      }

      groups.forEach(([title, rows]) => {
        const real = rows.filter(([,v]) => v !== null && v !== undefined);
        if(!real.length) return;
        html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">${title}</div>`;
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--mono);font-size:10px">';
        real.forEach(([k, v]) => {
          const val = typeof v === 'number' ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v);
          html += `<span style="color:var(--tx3)">${esc(k)}</span><span style="text-align:right;color:var(--tx)">${esc(val)}</span>`;
        });
        html += '</div>';
      });

      // ownership
      if(d.ownership && d.ownership.shareholders){
        html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">MAJOR SHAREHOLDERS · ${esc(d.ownership.company||'')}</div>`;
        d.ownership.shareholders.forEach(sh => {
          html += `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px"><span style="color:var(--tx2)">${esc(sh.holder)}</span><span style="color:var(--acc);font-family:var(--mono)">${esc(sh.stake)}</span></div>`;
        });
        html += `<div style="padding:4px 0 0;color:var(--tx3);font-size:8px">${esc(d.ownership.source||'')}</div>`;
      }
      html += '</div>';
      $('rightInfo').insertAdjacentHTML('beforeend', html);
    })
    .catch(() => {});
}

let currentChartSym = null;
let currentChartData = null;
let chartObj = null;
let chartType = 'candle';

function fmtMoney(v){
  // consistent money display: 12.3B / 950.0M / 4.3T - honest dash when missing
  if(v == null || v === '' || isNaN(v)) return '—';
  const f = Number(v);
  const sign = f < 0 ? '-' : '';
  const a = Math.abs(f);
  if(a >= 1e12) return sign + (a/1e12).toFixed(1) + 'T';
  if(a >= 1e9) return sign + (a/1e9).toFixed(1) + 'B';
  if(a >= 1e6) return sign + (a/1e6).toFixed(1) + 'M';
  if(a >= 1e3) return sign + (a/1e3).toFixed(1) + 'K';
  return sign + a.toFixed(1);
}

function renderStockInfo(d){
  const price = d.regularMarketPrice != null ? d.regularMarketPrice.toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
  const prev = d.chartPreviousClose;
  const chg = (price !== '—' && prev) ? ((d.regularMarketPrice - prev) / prev * 100) : null;
  const chgTxt = chg === null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
  const chgCls = chg === null ? '' : (chg >= 0 ? 'up' : 'down');
  const bars = d.bars || [];
  const last = bars.length ? bars[bars.length-1] : null;
  const html = `
    <div style="padding:8px 12px;border-bottom:1px solid var(--line)">
      <div style="color:var(--acc);font-weight:700;font-size:15px">${esc(currentChartSym)}</div>
      <div style="color:var(--tx2);font-size:11px;padding:2px 0">${esc(d.name||'')}</div>
      <div style="font-size:20px;font-weight:700;padding:4px 0">${price} <span style="font-size:11px;color:var(--tx3)">${esc(d.currency||'')}</span></div>
      <div class="chg ${chgCls}" style="font-size:12px">${chgTxt}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:8px 0 2px;font-family:var(--mono);font-size:10px">
        <span style="color:var(--tx3)">OPEN</span><span style="text-align:right">${last && last.open != null ? last.open.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">HIGH</span><span style="text-align:right">${last && last.high != null ? last.high.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">LOW</span><span style="text-align:right">${last && last.low != null ? last.low.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">PREV CLOSE</span><span style="text-align:right">${prev != null ? prev.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">VOLUME</span><span style="text-align:right">${d.regularMarketVolume != null ? d.regularMarketVolume.toLocaleString() : (last && last.volume ? last.volume.toLocaleString() : '—')}</span>
        <span style="color:var(--tx3)">52W HIGH</span><span style="text-align:right">${d.fiftyTwoWeekHigh != null ? d.fiftyTwoWeekHigh.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">52W LOW</span><span style="text-align:right">${d.fiftyTwoWeekLow != null ? d.fiftyTwoWeekLow.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">STATE</span><span style="text-align:right">${esc(d.marketState||'?')}</span>
      </div>
      <div style="display:flex;gap:4px;padding:8px 0 4px;align-items:center;white-space:nowrap;overflow-x:auto">
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartRange('1d')">1D</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartRange('1mo')">1M</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartRange('1y')">1Y</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartRange('10y')">10Y</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartRange('max')">ALL</button>
        <span style="width:8px"></span>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartType('candle')">CANDLE</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartType('line')">LINE</button>
        <button class="ctab" style="padding:3px 7px;border-radius:2px;font-size:10px" onclick="setChartType('area')">AREA</button>
      </div>
    </div>
    <div id="chartBox" style="height:260px;position:relative"></div>`;
  $('rightInfo').innerHTML = html;
}

function setChartType(t){
  chartType = t;
  if(currentChartData) renderChart(currentChartData, currentChartSym);
}

// ===== Chart timeframes: 1D 5D 1M 3M 6M YTD 1Y 3Y 5Y =====
let currentChartRange = '1y';
const RANGE_INTERVALS = {
  '1d':  ['1d',  '5m'],
  '1mo': ['1mo', '1h'],
  '1y':  ['1y',  '1d'],
  '10y': ['10y', '1d'],
  'max': ['max', '1mo'],   // all available history (monthly bars, back to ~2000)
};
function setChartRange(r){
  if(!currentChartSym) return;
  currentChartRange = r;
  const [rng, ivl] = RANGE_INTERVALS[r] || ['1y', '1d'];
  fetch('/api/chart?symbol=' + encodeURIComponent(currentChartSym) + '&range=' + rng + '&interval=' + ivl)
    .then(res => res.json())
    .then(d => {
      if(d.error || !d.bars || !d.bars.length){ return; }
      // kwayisi/NGX-NSE history: filter bars to the selected range window
      if(d.kwayisi){
        const now = Date.now() / 1000;
        const DAY = 86400;
        // NSE/NGX have EOD period returns (1W/1M/3M/6M/1Y/YTD) - no intraday
        const windows = {'1d': 7, '1mo': 30, '1y': 365, '10y': 365, 'max': 365};
        const win = windows[r] || 365;
        d.bars = d.bars.filter(b => now - b.time <= win * DAY);
        if(!d.bars.length) d.bars = d.bars.slice(-1);
      }
      currentChartData = d;
      renderChart(d, currentChartSym);
      // highlight the active range button
      document.querySelectorAll('.ctab').forEach(b => b.style.outline = '');
      const btn = [...document.querySelectorAll('.ctab')].find(b => b.textContent === r.toUpperCase() || (r === '1mo' && b.textContent === '1M'));
      if(btn) btn.style.outline = '1px solid var(--acc)';
    })
    .catch(() => {});
}

function renderChart(d, sym){
  const bars = d.bars || [];
  if(!bars.length){ return; }
  const box = document.getElementById('chartBox');
  if(!box) return;
  if(chartObj){ chartObj.remove(); chartObj = null; }
  currentChartData = d;
  const MINT = '#33e29a', RED = '#f87171';
  const cw = box.clientWidth || box.parentElement?.clientWidth || 320;
  const ch = box.clientHeight || 260;
  chartObj = LightweightCharts.createChart(box, {
    layout:{background:{color:'transparent'},textColor:'#9a9a9a',fontFamily:'Oxygen Mono, monospace',fontSize:10},
    grid:{vertLines:{color:'rgba(38,38,38,.5)'},horzLines:{color:'rgba(38,38,38,.5)'}},
    rightPriceScale:{borderColor:'#262626'},
    timeScale:{borderColor:'#262626',timeVisible:false,rightOffset:4},
    crosshair:{mode:1},
    localization:{priceFormatter:p=>p.toFixed(2)},
    width: Math.max(cw, 120),
    height: Math.max(ch, 120),
  });
  let series;
  if(chartType === 'candle'){
    series = chartObj.addCandlestickSeries({
      upColor:MINT, downColor:RED, borderUpColor:MINT, borderDownColor:RED,
      wickUpColor:MINT, wickDownColor:RED, priceLineColor:MINT,
    });
    series.setData(bars.map(b=>({time:b.time, open:b.open, high:b.high, low:b.low, close:b.close})));
  } else if(chartType === 'line'){
    series = chartObj.addLineSeries({ color:MINT, lineWidth:2, priceLineColor:MINT });
    series.setData(bars.map(b=>({time:b.time, value:b.close})));
  } else {
    series = chartObj.addAreaSeries({
      lineColor:MINT, topColor:'rgba(51,226,154,.22)', bottomColor:'rgba(51,226,154,0)',
      lineWidth:2, priceLineColor:MINT,
    });
    series.setData(bars.map(b=>({time:b.time, value:b.close})));
  }
  if(chartType !== 'candle'){
    const vol = chartObj.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'vol' });
    chartObj.priceScale('vol').applyOptions({scaleMargins:{top:0.82,bottom:0}});
    vol.setData(bars.map(b=>({time:b.time, value:b.volume, color:b.close >= b.open ? 'rgba(51,226,154,.35)' : 'rgba(248,113,113,.35)'})));
  }
  chartObj.timeScale().fitContent();
}

// ===== Init =====

// honest feed state: LIVE only when a backend is configured
(function(){
  const live = !!window.API_BASE;
  const fs = document.getElementById('feedState');
  if(fs){
    fs.textContent = live ? '\u25cf LIVE' : '\u25cf SNAPSHOT';
    fs.style.color = live ? 'var(--acc)' : 'var(--warn)';
  }
})();
loadListing('JSE');
</script>
