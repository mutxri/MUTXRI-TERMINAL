<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUTXRI TERMINAL — Signed-up users</title>
<style>
  body{background:#000;color:#e8e8e8;font-family:ui-monospace,Consolas,'Courier New',monospace;padding:32px;max-width:760px;margin:0 auto;}
  h1{color:#33e29a;font-size:15px;letter-spacing:.12em;}
  .sub{color:#6a6a6a;font-size:11px;margin:6px 0 20px;}
  input{background:#141414;border:1px solid #262626;color:#e8e8e8;font-family:inherit;font-size:13px;padding:9px;width:300px;border-radius:4px;outline:none;}
  input:focus{border-color:#33e29a;}
  button{background:#33e29a;border:0;color:#000;font-family:inherit;font-weight:700;padding:9px 18px;border-radius:4px;cursor:pointer;font-size:12px;letter-spacing:.08em;margin-left:8px;}
  .err{color:#ff5f56;font-size:12px;margin-top:12px;}
  .ok{color:#33e29a;font-size:12px;margin-top:12px;}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #1a1a1a;}
  th{color:#33e29a;font-weight:400;letter-spacing:.08em;font-size:11px;}
  td{color:#cfcfcf;word-break:break-all;}
</style>
</head>
<body>
<h1>MUTXRI TERMINAL — SIGNED-UP USERS</h1>
<div class="sub">Admin view. Enter the ADMIN_KEY from your Render environment.</div>
<div>
  <input type="password" id="key" placeholder="ADMIN KEY" autocomplete="off" onkeydown="if(event.key==='Enter')loadUsers()">
  <button onclick="loadUsers()">LOAD</button>
</div>
<div class="ok" id="msg"></div>
<div class="err" id="err"></div>
<table id="tbl" style="display:none">
  <thead><tr><th>EMAIL</th><th>NAME</th><th>SIGN-IN</th><th>SIGNED UP</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
function fmt(ts){
  if(!ts) return "-";
  try{ return new Date(ts * 1000).toLocaleString(); }catch(e){ return String(ts); }
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function loadUsers(){
  var key = document.getElementById("key").value.trim();
  var msg = document.getElementById("msg"), err = document.getElementById("err");
  msg.textContent = ""; err.textContent = "";
  if(!key){ err.textContent = "Enter the admin key."; return; }
  fetch("/api/admin/users", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({key: key})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"bad response"}; }); })
    .then(function(d){
      if(d && d.ok){
        var rows = document.getElementById("rows");
        rows.innerHTML = "";
        (d.users || []).forEach(function(u){
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + esc(u.email) + "</td><td>" + esc(u.name) + "</td><td>" + esc(u.oauth || "email") + "</td><td>" + esc(fmt(u.created)) + "</td>";
          rows.appendChild(tr);
        });
        document.getElementById("tbl").style.display = "";
        msg.textContent = d.count + " account(s)";
      } else {
        err.textContent = (d && d.error) ? d.error : "Request failed.";
      }
    })
    .catch(function(){ err.textContent = "Could not reach the server."; });
}
</script>
</body>
</html>
