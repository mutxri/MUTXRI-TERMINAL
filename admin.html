<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUTXRI TERMINAL — Who signed in</title>
<style>
  body{background:#000;color:#e8e8e8;font-family:ui-monospace,Consolas,'Courier New',monospace;padding:32px;max-width:820px;margin:0 auto;}
  h1{color:#33e29a;font-size:15px;letter-spacing:.12em;}
  .sub{color:#6a6a6a;font-size:11px;margin:6px 0 20px;line-height:1.6;}
  input{background:#141414;border:1px solid #262626;color:#e8e8e8;font-family:inherit;font-size:13px;padding:9px;width:300px;border-radius:4px;outline:none;}
  input:focus{border-color:#33e29a;}
  button{background:#33e29a;border:0;color:#000;font-family:inherit;font-weight:700;padding:9px 18px;border-radius:4px;cursor:pointer;font-size:12px;letter-spacing:.08em;margin-left:8px;}
  .err{color:#ff5f56;font-size:12px;margin-top:12px;}
  .ok{color:#33e29a;font-size:12px;margin-top:12px;}
  .stats{display:flex;gap:28px;flex-wrap:wrap;margin:22px 0 4px;}
  .stat{border-left:2px solid #33e29a;padding-left:10px;}
  .stat b{display:block;color:#fff;font-size:20px;font-weight:700;line-height:1.2;}
  .stat span{color:#6a6a6a;font-size:10px;letter-spacing:.1em;}
  table{width:100%;border-collapse:collapse;margin-top:18px;font-size:12px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #1a1a1a;}
  th{color:#33e29a;font-weight:400;letter-spacing:.08em;font-size:11px;}
  td{color:#cfcfcf;word-break:break-all;}
  .tag{font-size:10px;letter-spacing:.08em;border:1px solid #2a2a2a;border-radius:3px;padding:1px 5px;color:#9a9a9a;}
  .tag.owner{border-color:#33e29a;color:#33e29a;}
</style>
</head>
<body>
<h1>MUTXRI TERMINAL — WHO SIGNED IN</h1>
<div class="sub" id="sub">Enter the ADMIN_KEY from your Render environment.</div>
<div id="keyrow">
  <input type="password" id="key" placeholder="ADMIN KEY" autocomplete="off" onkeydown="if(event.key==='Enter')loadOverview()">
  <button onclick="loadOverview()">LOAD</button>
</div>
<div class="stats" id="stats" style="display:none"></div>
<div class="ok" id="msg"></div>
<div class="err" id="err"></div>
<table id="tbl" style="display:none">
  <thead><tr><th>EMAIL</th><th>NAME</th><th>SIGNED IN WITH</th><th>SIGNED UP</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
// A session token may arrive in the URL FRAGMENT (#token=...). Fragments are
// never sent to a server, so the owner's session never lands in access logs or
// Referer headers and never leaves the browser.
var TOKEN = "";
(function(){
  var m = /(?:^|[#&])token=([A-Za-z0-9._-]+)/.exec(location.hash || "");
  if (m) {
    TOKEN = m[1];
    try { history.replaceState(null, "", location.pathname); } catch(e) {}
  }
})();
var CURRENT_KEY = "";
function fmt(ts){
  if(!ts) return "-";
  try{ return new Date(ts * 1000).toLocaleString(); }catch(e){ return String(ts); }
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function delUser(email){
  if(!confirm("Remove " + email + "?")) return;
  fetch("/api/admin/users", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({key: CURRENT_KEY, token: TOKEN, delete: email})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok && d.deleted){ loadOverview(); }
      else { document.getElementById("err").textContent = (d && d.error) ? d.error : "Remove failed."; }
    })
    .catch(function(){ document.getElementById("err").textContent = "Could not reach the server."; });
}
function loadOverview(){
  var keyEl = document.getElementById("key");
  var key = keyEl ? keyEl.value.trim() : "";
  var msg = document.getElementById("msg"), err = document.getElementById("err");
  msg.textContent = ""; err.textContent = "";
  if(!key && !TOKEN){ err.textContent = "Enter the admin key."; return; }
  CURRENT_KEY = key;
  fetch("/api/admin/overview", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({key: key, token: TOKEN})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"bad response"}; }); })
    .then(function(d){
      if(!d || !d.ok){ err.textContent = (d && d.error) ? d.error : "Request failed."; return; }
      // stats
      var stats = document.getElementById("stats");
      var prov = d.by_provider || {};
      var provTxt = Object.keys(prov).map(function(k){ return esc(k) + " " + prov[k]; }).join("  ·  ") || "-";
      stats.innerHTML =
        '<div class="stat"><b>' + (d.count || 0) + '</b><span>ACCOUNTS</span></div>' +
        '<div class="stat"><b>' + esc(provTxt) + '</b><span>SIGN-IN METHOD</span></div>' +
        '<div class="stat"><b>' + esc(fmt(d.newest_created)) + '</b><span>NEWEST SIGN-UP</span></div>' +
        '<div class="stat"><b>' + esc(d.store || "?") + '</b><span>STORE</span></div>';
      stats.style.display = "";
      // rows
      var rows = document.getElementById("rows");
      rows.innerHTML = "";
      (d.users || []).forEach(function(u){
        var tr = document.createElement("tr");
        var em = esc(u.email), own = (u.owner ? ' <span class="tag owner">OWNER</span>' : '');
        tr.innerHTML = "<td>" + em + own + "</td><td>" + esc(u.name) + "</td>" +
          '<td><span class="tag">' + esc(u.oauth || "email") + "</span></td><td>" + esc(fmt(u.created)) + "</td>" +
          "<td><a href='#' onclick='delUser(\"" + em.replace(/"/g, "&quot;") + "\");return false;' style='color:#ff5f56;text-decoration:none;font-size:11px'>remove</a></td>";
        rows.appendChild(tr);
      });
      document.getElementById("tbl").style.display = "";
      msg.textContent = (d.count || 0) + " account(s)";
    })
    .catch(function(){ err.textContent = "Could not reach the server."; });
}
// Owner arriving with their terminal session: no key needed.
if (TOKEN) {
  var kr = document.getElementById("keyrow");
  if (kr) kr.style.display = "none";
  document.getElementById("sub").textContent = "Signed in as the terminal owner. Showing every account.";
  loadOverview();
}
</script>
</body>
</html>
