<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TV test</title>
<style>body{background:#000;margin:0;color:#9a9a9a;font-family:monospace}</style>
</head><body>
<div id="w" class="tradingview-widget-container" style="width:800px;height:400px">
  <div id="tv" class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
    "autosize": true,
    "symbol": "JNB:SBK",
    "interval": "D",
    "timezone": "Africa/Johannesburg",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "allow_symbol_change": false,
    "hide_top_toolbar": true,
    "hide_legend": false,
    "support_host": "https://www.tradingview.com"
  }
  </script>
</div>
<script>
setTimeout(() => {
  const f = document.querySelector('#tv iframe');
  document.title = f ? ('IFRAME ' + f.src.slice(0, 80)) : 'NO IFRAME';
}, 8000);
</script>
</body></html>
