<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>NSE widget test</title>
<style>body{background:#000;margin:0;color:#9a9a9a;font-family:monospace;padding:20px}
.msg{font-size:12px;margin-bottom:10px;color:#33e29a}</style>
</head><body>
<div class="msg">NAIROBI:EABL - waiting for widget...</div>
<div id="w" class="tradingview-widget-container" style="width:780px;height:380px">
  <div id="tv" class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
    "autosize": true,
    "symbol": "NAIROBI:EABL",
    "interval": "D",
    "timezone": "Africa/Nairobi",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "allow_symbol_change": false,
    "hide_top_toolbar": true,
    "hide_legend": false,
    "support_host": "https://www.tradingview.com",
    "disabled_features": ["header_symbol_search", "enable_symbol_change_restriction_on_widgets"]
  }
  </script>
</div>
<script>
setTimeout(() => {
  const f = document.querySelector('#tv iframe');
  const msg = document.querySelector('.msg');
  if (f) {
    msg.textContent = 'IFRAME LOADED: ' + f.src.slice(0, 90);
  } else {
    msg.textContent = 'NO IFRAME - widget failed to render';
  }
}, 10000);
</script>
</body></html>
