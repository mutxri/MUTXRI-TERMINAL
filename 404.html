<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MUTXRI TERMINAL</title>
<script>
// redirect case-mismatched / old terminal URLs to the canonical terminal,
// everything else to the landing page.
var p = location.pathname;
var lower = p.toLowerCase();
if (lower.indexOf('/mutxri-terminal') === 0 || lower.indexOf('/terminal') === 0) {
  location.replace('/terminal/');
} else {
  location.replace('/');
}
</script>
</head>
<body style="background:#000;color:#33e29a;font-family:monospace;padding:40px">
MUTXRI TERMINAL — redirecting...
</body>
</html>
