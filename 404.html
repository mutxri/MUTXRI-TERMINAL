<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<!-- This file is served BOTH as GitHub Pages' 404 document (with a 404 status,
     which Google never indexes) AND directly at /404.html, where it answers 200
     and would otherwise be indexable as an empty redirect stub. noindex keeps
     the error page out of the index without affecting the redirect itself. -->
<title>MUTXRI TERMINAL</title>
<script>
// redirect case-mismatched / old terminal URLs to the canonical terminal,
// everything else to the landing page.
var p = location.pathname;
var lower = p.toLowerCase();
if (lower.indexOf('/mutxri-terminal') === 0 || lower.indexOf('/terminal') === 0) {
  location.replace('/terminal/');
} else {
  location.replace('/');
}
</script>
</head>
<body style="background:#000;color:#33e29a;font-family:monospace;padding:40px">
MUTXRI TERMINAL — redirecting...
</body>
</html>
