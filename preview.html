<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - PREVIEW: a display-only view of the terminal.

  This page is a picture made of HTML with one deliberate exception: the CHART
  window carries a search field, so a visitor can type a ticker or a company
  name and see that security's candles. Nothing else on the page responds to a
  mouse or a keyboard: no other field, no button, no link, no tab, no select and
  no collapsible section. It exists so the landing page can show what the
  terminal looks like without handing the visitor a working application.

  TWO PARAMETERS, nothing else:
    ?ex=NSE|JSE|NGX|EGX   picks the board
    ?view=NAME            picks which static panel is drawn under the header

  With no ?view= the page draws THE DESK: seven windows tiled in one grid the
  way a desk terminal tiles its wall, so the visitor sees a whole workspace
  rather than one panel. MARKET is the large window at the left (breadth, the
  session's most traded names in full detail, then the top gainers, top losers
  and most active lists); CHART is the candle window beside it, the largest of
  the read-out windows, carrying a search field, a wick and a body per session,
  a price axis on the right and dates along the foot; COMPARE and MACRO are the
  two tall windows below it (four securities on one chart, one coloured line
  each, every line rebased to 100 at the start of the window the four share,
  with the total return per series in the legend and a metric table under it;
  and the policy rate, inflation, GDP, the exchange rate, the fiscal balance
  and the debt ratios); FOCUS is the quote window at the top right. WATCHLIST
  and HEATMAP are the read-out windows under MARKET. Each window wears the
  shell's chrome: 1px borders, a mono caps
  title bar with the mint underline, tabular numerals and the same up and down
  colours. Each ?view= draws ONE panel instead, still a picture and still inert:
    watchlist   the board ordered by volume: ticker, name, price, change, volume
    chart       the candle chart alone, larger, 40 to 60 recent sessions
    financials  one liquid name's stored income statement, every period, with
                its source file named in the caption
    screener    the board ordered by change percent, with sector
    info        the company profile facts on file for one name
    news        the exchange's wire items: date, headline, source
    corpactions the exchange's dated corporate actions: date, security, type,
                and the detail as the file states it
    trade       a paper blotter, or an honest empty state when no paper book
                exists in this browser

  DEPLOY LAYOUT: this file ships to the SITE ROOT (mutxriterminal.com/preview.html)
  and the data ships under /terminal/, so every path below is written from the
  root and starts with terminal/. A path of ../static_data would 404 in
  production even though it resolves in the source tree.

  DATA READ (all static, all published):
    terminal/static_data/market_<EX>.json              quotes, breadth, tape,
                                                       the COMPARE columns and
                                                       the HEATMAP tile sizes
    terminal/static_data/heatmap_<EX>.json             treemap names, change %
    terminal/static_data/macro_rates.json              policy rate, 91-day bill
    terminal/static_data/macro.json                    inflation, GDP, GDP growth
    terminal/static_data/macro_fiscal.json             fiscal balance, gross debt
    terminal/static_data/fx.json                       the exchange rate
    terminal/static_data/screener_<EX>.json            fallback board (price,
                                                       change, volume, sector)
    terminal/static_data/ex_<EX>_indices.json          index levels for the tape
    terminal/static_data/history/<KEY>.json            daily OHLC bars -> candles
    terminal/static_data/financials/<KEY>__income.json stored statement rows
    terminal/static_data/company_info.json             descriptive company facts
    terminal/static_data/<ex>_news.json                dated wire items
    terminal/static_data/nse_corporate_actions.json    NSE dated actions
    terminal/static_data/ngx_corporate_actions.json    NGX dated actions
    terminal/static_data/jse_announcements.json        JSE SENS announcements
    terminal/static_data/egx_announcements.json        EGX announcements

  SOURCE ORDER:
    MARKET and FOCUS both read the board the WATCHLIST reads. market_<EX>.json
    is asked for first because it carries the whole quote; if it is absent or
    empty the same board is taken from screener_<EX>.json, which carries price,
    change and volume but no previous close, open, high, low or market cap, and
    those cells then print the house empty marker. The empty state names both
    files and is only reached when neither one answers.

  HONESTY:
    - the exchange's own as-of string is printed in full in the top bar, and the
      MARKET window states the session date beside the priced count
    - a security with no published price prints "no quote" and no number, and a
      missing change, level or market cap prints the house empty marker "-" in
      muted grey. Nothing is estimated and nothing is filled in from a neighbour
    - candles use open, high, low and close. A history file that carries only
      closes says so on one line and no candle is drawn from a repeated close
    - if the chart library does not load, the CHART window says so and draws no
      candle, rather than leaving an empty frame that looks like a flat series
    - a nameless or dateless row in a table prints undated or "-", never a guess

  Vanilla JS around ONE library, and it is the product's own: the CHART window is
  drawn by the same TradingView Lightweight Charts 5.0.4 build
  features/panels/mx_chart.html loads, from the same CDN, configured the same
  way, so the candles, the grid, the axes and the last price marker are the
  terminal's drawing rather than a second implementation of it. Godel tokens
  (mint #33e29a on black, Oxygen Mono, uppercase labels, tabular numerals), no
  build step. Every affordance that would suggest the page is usable has been
  left out on purpose, apart from the CHART search field the owner asked for.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - PREVIEW</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html,body{height:100%;}
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;display:none;}

  :root{
    --bg:#000;--bg2:#070707;--bg3:#0d0d0d;--bg4:#141414;
    --line:#161616;--line2:#242424;--tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;--warn:#e0a340;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
    --rowh:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:13px;
    overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;}

  .pg{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- top bar ---------- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-bottom:1px solid var(--line2);background:var(--bg2);}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--tx);white-space:nowrap;}
  .brand b{color:var(--acc);font-weight:700;}
  .top-ex{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--acc);white-space:nowrap;}
  .top-ex i{font-style:normal;color:var(--tx3);letter-spacing:.04em;}
  .top-asof{flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:10px;color:var(--tx2);
    letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}

  /* ---------- ticker tape ---------- */
  .tape{flex:0 0 auto;height:34px;border-bottom:1px solid var(--line2);background:#040404;
    overflow:hidden;position:relative;pointer-events:none;}
  .tape:after{content:"";position:absolute;top:0;right:0;bottom:0;width:44px;
    background:linear-gradient(90deg,rgba(4,4,4,0),#040404);}
  .tape:before{content:"";position:absolute;top:0;left:0;bottom:0;width:30px;z-index:1;
    background:linear-gradient(90deg,#040404,rgba(4,4,4,0));}
  .tape-in{display:flex;align-items:center;height:100%;width:max-content;
    animation:tape 140s linear infinite;}
  @keyframes tape{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){ .tape-in{animation:none;} }
  .tape-i{display:flex;align-items:baseline;gap:7px;padding:0 12px;height:100%;
    border-right:1px solid var(--line);white-space:nowrap;}
  .tape-i b{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx);}
  .tape-i .px{font-family:var(--mono);font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;}
  .tape-i .ch{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;}

  /* ---------- layout: the desk ---------- */
  /* Seven tiles in ONE grid, tiled edge to edge with no gap. The tracks are
     sized in fr so the same proportions hold at any frame size. MARKET keeps
     the large window at the left, FOCUS the quote window at the top right,
     COMPARE and MACRO the two tall windows under CHART, and WATCHLIST and
     HEATMAP the two read-out windows under MARKET. CHART is the largest of the
     read-out windows, wide enough to carry legible candles: a wick and a
     body per session, round values on a price axis at the right, dates along
     the foot, and the one control on this page, a search field in its header.

        +---------------+---------+--------+
        |               |         | FOCUS  |
        |     MARKET    |  CHART  |        |
        |               |         +--------+
        |               +---------+        |
        |               | COMPARE |  MACRO |
        +-------+-------+         |        |
        |WATCH  |HEATMAP|         |        |
        +-------+-------+---------+--------+

     at 1600x870 that resolves to the pixel boxes: MARKET 740x580,
     COMPARE 460x540, MACRO 400x540, CHART 460x330, FOCUS 400x330,
     WATCHLIST 370x290, HEATMAP 370x290. No uncovered pixel, no overlap: the
     tiles abut and each carries its own 1px border as the seam. */
  .grid{flex:1 1 auto;min-height:0;display:grid;padding:0;min-width:0;}
  .grid.desk{display:grid;gap:0;padding:0;
    grid-template-columns:370fr 370fr 460fr 400fr;
    grid-template-rows:330fr 250fr 290fr;
    grid-template-areas:
      "mkt mkt chart focus"
      "mkt mkt cmp macro"
      "watch hmap cmp macro";}
  .w-watch{grid-area:watch;} .w-mkt{grid-area:mkt;} .w-focus{grid-area:focus;}
  .w-cmp{grid-area:cmp;} .w-hm{grid-area:hmap;} .w-mc{grid-area:macro;}
  .w-chart{grid-area:chart;}
  .win{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);
    border:1px solid var(--line2);border-radius:0;overflow:hidden;}

  .whead{flex:0 0 auto;display:flex;align-items:stretch;gap:0;height:27px;padding:0 5px;
    background:#050505;border-bottom:1px solid var(--line2);}
  .dg{align-self:center;color:var(--tx3);font-size:10px;padding:0 3px;opacity:.55;}
  .wtab{align-self:stretch;display:flex;align-items:center;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.16em;color:var(--tx);padding:0 5px;white-space:nowrap;}
  .wtab.on{box-shadow:inset 0 -2px 0 var(--acc);}
  .wtab i{font-style:normal;color:var(--tx3);letter-spacing:.06em;padding-left:5px;}
  .wmeta{align-self:center;margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
    color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;}
  .wx{align-self:center;font-family:var(--mono);font-size:10px;color:var(--tx3);opacity:.5;padding:0 2px;}
  .wbody{flex:1 1 auto;min-height:0;overflow:hidden;}

  .card{border:1px solid var(--line2);border-radius:3px;background:var(--bg2);min-width:0;}
  .card-h{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:7px 11px;border-bottom:1px solid var(--line);}
  .card-h .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;color:var(--tx3);text-transform:uppercase;white-space:nowrap;}
  .card-h .r{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--tx2);
    min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- WATCHLIST window ---------- */
  /* One dense line per security: ticker, name, last, change percent, volume,
     under a column head. The line is 17px so a 385x290 window carries 14 rows
     of five fields rather than 14 rows of three. */
  .wl-h{display:grid;grid-template-columns:56px minmax(0,1fr) 56px 50px 52px;gap:0 6px;
    height:15px;align-items:center;padding:0 7px;background:var(--bg3);
    border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:7px;
    letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;}
  .wr{display:grid;grid-template-columns:56px minmax(0,1fr) 56px 50px 52px;gap:0 6px;
    align-items:center;height:17px;padding:0 7px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:9px;font-variant-numeric:tabular-nums;}
  .wr .wt{color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wr .wn{font-family:var(--ui);font-size:8.5px;color:var(--tx3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .wr .wp{text-align:right;color:var(--tx);white-space:nowrap;}
  .wr .wc{text-align:right;white-space:nowrap;}
  .wr .wv{text-align:right;color:var(--tx2);white-space:nowrap;}

  /* ---------- MARKET window ---------- */
  .mk-top{padding:6px 10px 5px;border-bottom:1px solid var(--line);}
  .mk-ex{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;color:#7ef0c0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-ex span{color:var(--tx3);font-weight:400;}
  .mk-sub{font-family:var(--mono);font-size:8.5px;color:var(--tx3);letter-spacing:.04em;padding:2px 0 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-br{display:flex;gap:10px;padding:4px 0 0;font-family:var(--mono);font-size:10px;
    font-variant-numeric:tabular-nums;}
  .mk-br .tone{margin-left:auto;font-size:8.5px;letter-spacing:.1em;align-self:center;}
  /* the security table: one line per name carrying ticker, name, last, change,
     change percent, volume, market cap and sector, under a column head */
  .mk-det{display:flex;flex-direction:column;min-height:0;}
  .mk-dh,.mk-dr{display:grid;
    grid-template-columns:64px minmax(0,1.35fr) 62px 54px 52px 64px 56px minmax(0,.85fr);
    gap:0 7px;align-items:center;}
  .mk-dh{height:15px;padding:0 10px;background:var(--bg3);border-bottom:1px solid var(--line2);
    font-family:var(--mono);font-size:7px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;}
  .mk-dr{height:20px;padding:0 10px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:9.5px;font-variant-numeric:tabular-nums;}
  .mk-dr .t{color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-dr .n{font-family:var(--ui);font-size:9px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-dr .s{font-family:var(--ui);font-size:8.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-dr .r{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px;padding:0 10px 4px;
    min-height:0;}
  .mcol{min-width:0;overflow:hidden;}
  .msec{font-family:var(--mono);font-size:8px;letter-spacing:.12em;font-weight:700;color:var(--tx3);
    padding:5px 0 3px;border-bottom:1px solid var(--line2);}
  .mrow{display:grid;grid-template-columns:54px minmax(0,1fr) 54px 48px;gap:0 6px;height:17px;
    align-items:center;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:9px;font-variant-numeric:tabular-nums;}
  .mrow .mt{color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mrow .mp{text-align:right;color:var(--tx2);white-space:nowrap;}
  .mrow .mc{text-align:right;white-space:nowrap;}
  .mrow .mv{text-align:right;color:var(--tx3);white-space:nowrap;}

  /* ---------- FOCUS window ---------- */
  .fx-top{padding:7px 10px 5px;border-bottom:1px solid var(--line);}
  .fx-sym{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx);}
  .fx-sym span{color:var(--acc);font-weight:400;font-size:9px;letter-spacing:.08em;padding-left:5px;}
  .fx-nm{font-family:var(--ui);font-size:9px;color:var(--tx3);line-height:1.3;padding-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-px{font-family:var(--mono);font-size:21px;line-height:1.15;color:var(--tx);padding-top:4px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .fx-ch{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;padding-top:1px;}
  .fx-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;padding:3px 10px 5px;}
  .fx-kv span{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:var(--tx3);
    padding:1.5px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
  .fx-kv b{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--tx);text-align:right;
    font-variant-numeric:tabular-nums;padding:1.5px 0;border-bottom:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-line{height:34px;padding:0 4px;pointer-events:none;}
  .fx-line svg{display:block;width:100%;height:100%;pointer-events:none;}
  .fx-range{font-family:var(--mono);font-size:7.5px;color:var(--tx3);letter-spacing:.03em;
    padding:1px 10px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- COMPARE: four securities on one rebased chart ---------- */
  /* The four are drawn the way the terminal's own COMPARE draws them: one
     header line naming them in their series colours, ONE plot carrying one
     coloured line per security on common axes, a caption naming the window all
     four share, a legend printing each series total return over that window,
     and a metric table reading the published quote fields across the four.
     Every line is rebased to 100 at the first session of the window, so a line
     is percent return rather than a price and four currencies compare. */
  .cmp-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  #cmpBody{display:flex;flex-direction:column;}
  /* the header names the four in their series colours, wrapping only between
     one security and the next so a name is never broken in half */
  .cmp-head{flex:0 0 auto;padding:4px 8px 3px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:7.5px;line-height:1.5;letter-spacing:.02em;
    color:var(--tx2);overflow:hidden;}
  .cmp-head .hs{display:inline-block;white-space:nowrap;vertical-align:bottom;}
  .cmp-head .hs b{font-weight:700;letter-spacing:.06em;}
  .cmp-head .hs i{font-style:normal;color:inherit;opacity:.6;letter-spacing:.06em;padding-left:3px;}
  .cmp-head .vs{color:var(--tx3);padding:0 4px;letter-spacing:.04em;}
  /* the plot: a fixed box clipped to itself, so a line can never stretch the
     window it sits in. No candle, no bar, no wick: polylines only. */
  .cmp-plot{flex:1 1 auto;min-height:96px;position:relative;overflow:hidden;background:#030303;}
  .cmp-plot svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
    pointer-events:none;}
  .cmp-plot .no{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:8px;line-height:1.5;color:var(--tx3);
    text-align:center;padding:0 12px;letter-spacing:.02em;}
  .cmp-cap{flex:0 0 auto;padding:3px 8px 4px;font-family:var(--mono);font-size:7px;
    line-height:1.5;letter-spacing:.01em;color:var(--tx3);border-bottom:1px solid var(--line);}
  .cmp-cap b{color:var(--tx2);font-weight:400;}
  .cmp-leg{flex:0 0 auto;display:flex;align-items:center;gap:0 11px;height:16px;padding:0 8px;
    border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:8px;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
  .cmp-leg .li{display:flex;align-items:center;gap:4px;min-width:0;}
  .cmp-leg .sw{display:block;width:9px;height:2px;flex:0 0 auto;}
  .cmp-leg b{font-weight:700;letter-spacing:.05em;}
  .cmp-leg em{font-style:normal;letter-spacing:.02em;}
  /* the metric table: METRIC on the left, one column per security headed by
     its ticker and its currency */
  .cmp-tab{flex:0 0 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .cmp-hd,.cmp-tr{display:grid;grid-template-columns:72px repeat(var(--cc,4),minmax(0,1fr));
    gap:0 6px;align-items:center;padding:0 8px;}
  .cmp-hd{height:16px;background:var(--bg3);border-bottom:1px solid var(--line2);}
  .cmp-hd .k{font-family:var(--mono);font-size:7px;letter-spacing:.1em;color:var(--tx3);}
  .cmp-hd .c{display:flex;align-items:baseline;justify-content:flex-end;gap:3px;
    font-family:var(--mono);font-size:6.5px;letter-spacing:.05em;color:var(--tx3);
    white-space:nowrap;overflow:hidden;}
  .cmp-hd .c b{font-weight:700;font-size:7.5px;letter-spacing:.05em;}
  .cmp-hd .c i.nh{color:var(--warn);opacity:.85;padding-left:3px;letter-spacing:.02em;}
  .cmp-tr{height:15px;border-bottom:1px solid var(--line);}
  .cmp-tr .k{font-family:var(--mono);font-size:7px;letter-spacing:.08em;color:var(--tx3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmp-tr .v{font-family:var(--mono);font-size:8px;font-variant-numeric:tabular-nums;color:var(--tx);
    text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmp-tr .v u{text-decoration:none;font-size:6.5px;color:var(--tx3);padding-left:2px;letter-spacing:.04em;}
  .cmp-tr .v.n{font-family:var(--ui);font-size:8px;color:var(--tx2);}

  /* ---------- MACRO: one indicator per row, with value, period and unit --- */
  #mcBody{display:flex;flex-direction:column;}
  .mc-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .mc-r{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;gap:0 6px;flex:0 0 auto;
    align-items:center;height:18px;padding:0 8px;border-bottom:1px solid var(--line);}
  .mc-r .k{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--tx2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-r .k i{font-style:normal;font-family:var(--ui);font-size:7.5px;letter-spacing:.02em;
    color:var(--tx3);padding-left:5px;}
  .mc-r .v{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--tx);
    text-align:right;white-space:nowrap;}
  .mc-r .v em{font-style:normal;font-size:7px;color:var(--tx3);letter-spacing:.02em;padding-left:3px;}
  .mc-r .p{font-family:var(--mono);font-size:7.5px;color:var(--tx3);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- HEATMAP: static treemap blocks, no hover, no click ---------- */
  #hmBody{display:flex;flex-direction:column;}
  .hm-plot{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#000;}
  .hm-t{position:absolute;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border:1px solid #000;}
  .hm-t b{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.02em;color:#f2fbf6;
    line-height:1.05;white-space:nowrap;}
  .hm-t i{font-style:normal;font-family:var(--mono);font-size:7.5px;font-variant-numeric:tabular-nums;
    color:rgba(242,251,246,.74);line-height:1.05;white-space:nowrap;}
  .tile-cap{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:2px 7px;border-top:1px solid var(--line);font-family:var(--mono);font-size:7px;
    letter-spacing:.03em;color:var(--tx3);white-space:nowrap;overflow:hidden;}
  .tile-cap b{color:var(--tx2);font-weight:400;}

  /* ---------- CHART window: the terminal's chart panel, compact ----------- */
  /* The band is the product's own chart bar at desk scale (title with the
     exchange, the search field, the symbol and the quote strip) and the body is
     its chart box, drawn by the same Lightweight Charts build the terminal
     ships, configured the same way. */
  #chBodyChart{display:flex;flex-direction:column;min-height:0;}
  .cht-t{display:flex;align-items:center;gap:5px;font-family:var(--ui);font-size:9.5px;letter-spacing:.08em;
    color:var(--tx2);text-transform:uppercase;white-space:nowrap;padding:0 5px 0 3px;}
  .cht-t b{color:var(--acc);font-weight:700;}
  .cht-t .cht-dot{color:var(--tx3);}
  .cht-sw{display:flex;align-items:center;flex:1 1 104px;min-width:80px;padding:0 5px;}
  .cht-q{width:100%;height:17px;background:#000;border:1px solid var(--line2);color:var(--tx);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:0 6px;border-radius:3px;
    outline:none;caret-color:var(--acc);appearance:none;-webkit-appearance:none;box-shadow:none;
    user-select:text;-webkit-user-select:text;}
  .cht-q:focus{border-color:var(--acc);}
  .cht-q::placeholder{color:var(--tx3);font-size:7.5px;letter-spacing:.08em;}
  .cht-sym{display:flex;align-items:baseline;gap:6px;min-width:0;flex:0 1 auto;align-self:center;
    padding:0 4px;}
  .cht-sym .tk{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--tx);
    letter-spacing:.02em;white-space:nowrap;}
  .cht-sym .nm{font-family:var(--ui);font-size:9.5px;color:var(--tx3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:190px;}
  .cht-qbar{flex:0 0 auto;display:flex;align-items:center;height:19px;padding:0 8px;
    border-bottom:1px solid var(--line);background:#000;}
  .cht-quote{display:flex;align-items:baseline;gap:12px;margin-left:auto;
    font-family:var(--mono);}
  .cht-quote .q{display:flex;align-items:baseline;gap:4px;}
  .cht-quote .k{font-size:7px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;}
  .cht-quote .v{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);
    white-space:nowrap;}
  .cht-quote .v.big{font-size:13px;}
  .cht-box{flex:1 1 auto;min-height:0;position:relative;background:#000;overflow:hidden;}
  .cht-legend{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:17px;padding:0 8px;
    border-top:1px solid var(--line);font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;
    color:var(--tx3);white-space:nowrap;overflow:hidden;}
  .cht-legend b{color:var(--tx2);font-weight:400;}
  .cht-legend .cht-msg{margin-left:auto;color:var(--warn);font-size:8px;overflow:hidden;
    text-overflow:ellipsis;max-width:56%;}
  .cht-legend .cht-msg:empty{display:none;}
  .cht-none{padding:18px 14px;font-family:var(--mono);font-size:9.5px;line-height:1.8;color:var(--tx3);
    letter-spacing:.02em;}
  .cht-none .np{font-size:11px;letter-spacing:.06em;color:var(--warn);padding-bottom:5px;
    text-transform:uppercase;}

  /* ---------- chart, shared by ?view=chart ---------- */
  .chart-wrap{flex:1 1 auto;min-height:0;padding:0 8px;pointer-events:none;cursor:default;}
  .chart-wrap svg{display:block;width:100%;height:100%;pointer-events:none;}
  .chart-note{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;line-height:1.6;color:var(--tx3);
    letter-spacing:.03em;padding:4px 11px 8px;}
  .chart-note b{color:var(--tx2);font-weight:400;}
  .chart-note .warn{color:var(--warn);}

  .tk{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm{font-family:var(--ui);font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .num{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--tx);white-space:nowrap;}
  .num.dim{color:var(--tx3);}
  .cur{font-family:var(--mono);font-size:8px;color:var(--tx3);letter-spacing:.06em;padding-left:4px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--tx3);}
  .nq{font-family:var(--mono);font-size:10px;color:var(--warn);letter-spacing:.04em;}

  /* ---------- foot ---------- */
  .foot{display:none !important;flex:0 0 auto;align-items:center;gap:10px;padding:6px 14px;
    border-top:1px solid var(--line2);background:var(--bg2);font-family:var(--mono);
    font-size:9px;letter-spacing:.04em;color:var(--tx3);white-space:nowrap;overflow:hidden;}
  .foot .sep{color:var(--line2);}
  .foot .sp{flex:1 1 auto;}

  /* ---------- static display views (preview.html?view=...) ---------- */
  /* every rule here builds a picture: no control, no hover state, no pointer */
  .grid.one{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"main";}
  .grid[hidden]{display:none;}
  .grid.one>.card{grid-area:main;min-height:0;}
  .vcard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .vbody{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;}

  .vrow{display:grid;align-items:center;gap:10px;height:24px;padding:0 11px;
    border-bottom:1px solid var(--line);}
  .vrow.hd{height:20px;background:var(--bg3);border-bottom:1px solid var(--line2);}
  .vrow.hd span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--tx3);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vrow .num{text-align:right;}
  .vw{grid-template-columns:78px minmax(0,1fr) 118px 84px 72px 96px;}
  .vs{grid-template-columns:78px minmax(0,1fr) 168px 112px 76px;}
  .vt{grid-template-columns:78px 76px 108px 108px 118px;}
  .vc{grid-template-columns:88px 116px 108px minmax(0,1fr);align-items:start;height:34px;}
  .vc .sec{min-width:0;}
  .vc .sec b{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;
    color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .sec span{display:block;font-family:var(--ui);font-size:9px;color:var(--tx3);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .d{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.03em;padding-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .ty{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--tx2);padding-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .dt{font-family:var(--ui);font-size:10px;line-height:1.3;color:var(--tx);padding-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .fcap{flex:0 0 auto;padding:6px 11px 5px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:8.5px;line-height:1.5;color:var(--tx3);letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fcap b{color:var(--tx2);font-weight:400;}

  .fintab{width:100%;border-collapse:collapse;table-layout:fixed;}
  .finwrap{flex:1 1 auto;min-height:0;overflow:hidden;}
  .fintab th{font-family:var(--mono);font-size:8px;font-weight:400;letter-spacing:.08em;
    text-transform:uppercase;color:var(--tx2);text-align:right;padding:4px 8px;
    border-bottom:1px solid var(--line2);background:var(--bg3);height:28px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fintab th span{font-size:7px;color:var(--tx3);letter-spacing:.08em;padding-left:3px;}
  .fintab th:first-child{text-align:left;width:36%;}
  .fintab td{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;color:var(--tx);
    text-align:right;padding:0 8px;height:var(--frow,17px);border-bottom:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fintab td:first-child{text-align:left;font-family:var(--ui);font-size:10.5px;color:var(--tx2);}
  .fintab td.abs{color:var(--tx3);}
  .fintab tr.tot td:first-child{color:var(--tx);}

  .nw{display:grid;grid-template-columns:88px minmax(0,1fr) 150px;gap:10px;padding:5px 11px;
    border-bottom:1px solid var(--line);align-items:start;}
  .nw-d{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.03em;padding-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nw-h{font-family:var(--ui);font-size:11px;line-height:1.35;color:var(--tx);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nw-s{font-family:var(--mono);font-size:9px;color:var(--tx2);text-align:right;padding-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .inf{flex:0 0 auto;display:grid;grid-template-columns:136px minmax(0,1fr);gap:0 14px;padding:8px 12px 4px;}
  .inf .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--tx3);
    text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--line);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .inf .v{font-family:var(--ui);font-size:11px;color:var(--tx);padding:4px 0;
    border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inftxt{flex:0 0 auto;padding:8px 12px;font-family:var(--ui);font-size:11px;line-height:1.55;
    color:var(--tx2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}

  .vempty{padding:12px;font-family:var(--mono);font-size:9.5px;line-height:1.7;color:var(--tx3);
    letter-spacing:.03em;}
  .vempty b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tx2);
    text-transform:uppercase;margin-bottom:4px;font-weight:700;}
  .vempty .warn{color:var(--warn);}
  .vchart{flex:1 1 auto;min-height:0;}

  @media (max-width:1100px){
    .mrow{grid-template-columns:44px minmax(0,1fr) 50px 44px;gap:0 5px;}
    .mk-dh,.mk-dr{grid-template-columns:46px minmax(0,1.3fr) 58px 50px 48px 58px 50px minmax(0,.8fr);gap:0 5px;}
    .fx-px{font-size:18px;}
    .cmp-hd,.cmp-tr{grid-template-columns:60px repeat(var(--cc,4),minmax(0,1fr));gap:0 4px;}
    .wr{grid-template-columns:40px minmax(0,1fr) 52px 46px 48px;gap:0 5px;}
    .wl-h{grid-template-columns:40px minmax(0,1fr) 52px 46px 48px;gap:0 5px;}
  }
  @media (max-width:860px){
    .top{height:40px;gap:9px;padding:0 10px;}
    .brand{font-size:10px;letter-spacing:.12em;}
    .top-ex i{display:none;}
    .top-asof{font-size:9px;}
    .tape{height:30px;}
    /* five windows only on a narrow frame: MARKET across the top, then
       COMPARE and MACRO, then WATCHLIST and CHART beside HEATMAP */
    .grid.desk{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-rows:1.5fr 1fr 1fr;
      grid-template-areas:
        "mkt mkt"
        "cmp macro"
        "watch chart";}
    .w-focus,.w-hm{display:none;}
    .whead{height:23px;}
    .wtab{font-size:8px;letter-spacing:.1em;padding:0 4px;}
    .wmeta{font-size:7px;}
    .cht-q{width:96px;height:15px;font-size:8.5px;}
    .cht-nm{display:none;}
    .dg{display:none;}
    .wr{grid-template-columns:40px minmax(0,1fr) 52px 46px 48px;gap:0 4px;padding:0 6px;height:16px;}
    .wl-h{padding:0 6px;}
    .mk-top{padding:5px 7px 4px;}
    .mk-ex{font-size:10px;}
    .mk-sub{font-size:7.5px;}
    .mk-br{font-size:8.5px;gap:7px;}
    .mk-body{padding:0 7px 4px;}
    .mk-dh,.mk-dr{padding:0 7px;grid-template-columns:44px minmax(0,1.2fr) 56px 48px 46px 54px;}
    .mk-dr .s,.mk-dh span:nth-child(7),.mk-dh span:nth-child(8){display:none;}
    .msec{font-size:7.5px;padding:4px 0 2px;}
    .mrow{grid-template-columns:40px minmax(0,1fr) 46px 44px;font-size:8.5px;gap:0 4px;}
    .chart-note{font-size:8.5px;padding:3px 8px 6px;line-height:1.5;}
    .tk{font-size:10px;} .nm{font-size:9.5px;} .num{font-size:10px;}
    .foot{font-size:8px;padding:5px 8px;gap:6px;}
  }
  @media (max-width:420px){
    .brand{font-size:9px;letter-spacing:.08em;}
    .top-ex{font-size:10px;}
    .top-asof{font-size:8px;}
    .grid.desk{grid-template-columns:minmax(0,1fr);grid-template-rows:1.6fr 1fr 1fr;
      grid-template-areas:"mkt" "cmp" "watch";}
    .w-chart,.w-macro{display:none;}
    .mk-ex{font-size:9px;}
  }
  /* A short frame: the FOCUS quote keeps every one of its fields and gives up
     the room the sparkline was taking, rather than dropping a line of the
     quote. The range note stays, so the window still says what history it had. */
  @media (max-height:900px){
    .fx-kv span,.fx-kv b{padding:1.5px 0;}
    .fx-line{height:34px;}
    .fx-px{font-size:18px;padding-top:2px;}
  }
  @media (max-height:660px){
    .fx-line{display:none;}
    .fx-kv span,.fx-kv b{padding:1px 0;font-size:8px;}
    .cht-nm{display:none;}
  }
  @media (max-width:900px){
    .vw{grid-template-columns:62px minmax(0,1fr) 92px 64px 78px;}
    .vw .c-lvl{display:none;}
    .vs{grid-template-columns:62px minmax(0,1fr) 92px 88px 62px;}
    .vt{grid-template-columns:62px 62px 84px 84px 96px;}
    .vc{grid-template-columns:58px 106px 68px minmax(0,1fr);height:32px;gap:7px;padding:0 8px;}
    .vc .d,.vc .ty{font-size:7.5px;}
    .vc .dt{font-size:9px;}
    .vc .sec b{font-size:9px;}
    .vc .sec span{font-size:7.5px;}
    .vrow{gap:7px;padding:0 8px;height:22px;}
    .vrow.hd{height:19px;}
    .vrow.hd span{font-size:7.5px;letter-spacing:.06em;}
    .nw{grid-template-columns:66px minmax(0,1fr) 112px;gap:7px;padding:4px 8px;}
    .nw-h{font-size:10px;}
    .nw-d,.nw-s{font-size:8px;}
    .fintab th{font-size:6.5px;padding:4px 4px;letter-spacing:.02em;}
    .fintab td{padding:0 4px;font-size:8.5px;}
    .fintab td:first-child{font-size:9px;}
    .fcap{font-size:7.5px;padding:4px 8px;}
    .inf{grid-template-columns:104px minmax(0,1fr);gap:0 9px;padding:6px 8px 2px;}
    .inf .k{font-size:7.5px;} .inf .v{font-size:10px;padding:3px 0;}
    .inftxt{font-size:9.5px;padding:6px 8px;-webkit-line-clamp:3;}
  }
/* captions off: a panel shows data, it does not explain itself */
[id$="Cap"],[id="mcMeta"],[id="hmCap"],.win .cap,.win .wcap,.win .wfoot,.win .note,.win .vempty-note{display:none !important;}
.win .wbody > span:last-child{display:none !important;}
.wmeta{display:none !important;}
#mkMetaMark{display:none !important;}
#mcBody > span,.win [id="mcBody"] > span{display:none !important;}
.tile-cap{display:none !important;}
#topAsOf{display:none !important;}
.mk-sub,.fx-range,.cmp-cap{display:none !important;}
</style>
</head>
<body>

<div class="pg" id="pg">

  <div class="top">
    <div class="brand">MUTXRI <b>TERMINAL</b></div>
    <div class="top-ex"><span id="exName">NSE</span><i id="exFull"></i></div>
    <div class="top-asof" id="topAsOf">session as-of not stated</div>
  </div>

  <div class="tape"><div class="tape-in" id="tapeIn"></div></div>

  <!-- THE DESK: seven tiles in one grid. MARKET is the large centre window,
       CHART the candle window at the top right of the middle columns with the
       only field on the page in its header, FOCUS the quote window at the top
       right, COMPARE and MACRO the two tall windows below CHART, and WATCHLIST
       and HEATMAP the read-out windows under MARKET. Each tile carries the
       shell's chrome (drag glyph, mono caps title with the mint underline,
       close glyph) and nothing in any of them can be typed into except the
       CHART search field, and nothing else can be clicked, focused or hovered. -->
  <div class="grid desk" id="gridHero">

      <section class="win w-mkt">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">MARKET</span><span class="wmeta" id="mkMetaMark"></span><span class="wx">X</span></div>
        <div class="wbody" id="mkBody"></div>
      </section>

      <section class="win w-focus">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">FOCUS</span><span class="wmeta" id="fxMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="fxBody"></div>
      </section>

      <section class="win w-cmp">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">COMPARE</span><span class="wmeta" id="cmpMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="cmpBody"></div>
      </section>

      <section class="win w-hm">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">HEATMAP</span><span class="wmeta" id="hmMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="hmBody"></div>
      </section>

      <section class="win w-mc">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">MACRO</span><span class="wmeta" id="mcMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="mcBody"></div>
      </section>

      <section class="win w-watch">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">WATCHLIST</span><span class="wmeta" id="wlMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="wlBody"></div>
      </section>

      <section class="win w-chart">
        <div class="whead">
          <span class="dg">&#10287;</span>
          <span class="cht-t"><b>CHART</b><span class="cht-dot">&middot;</span><span id="chtEx">-</span></span>
          <span class="cht-sw"><input class="cht-q" id="chtQ" type="text" autocomplete="off" spellcheck="false" placeholder="SEARCH A SECURITY" aria-label="Search a security to chart" /></span>
          <span class="cht-sym"><span class="tk" id="chtSym">no security</span><span class="nm" id="chtNm"></span></span>
          <span class="wx">X</span>
        </div>
        <div class="wbody" id="chBodyChart">
          <div class="cht-qbar"><span class="cht-quote" id="chtQuote"></span></div>
          <div class="cht-box" id="chtChart"></div>
          <div class="cht-legend"><span id="chtLegend">-</span><span class="cht-msg" id="chtMsg"></span></div>
        </div>
      </section>

  </div>

  <div class="grid one" id="gridView" hidden>
    <div class="card vcard">
      <div class="card-h"><span class="l" id="vTitle">-</span><span class="r" id="vMeta">-</span></div>
      <div class="vbody" id="vbody"></div>
    </div>
  </div>

  <!-- The footer strip is not part of the display. It stays in the tree with an
       empty body so the CSS rule that hides it is the only thing it carries;
       no status line, no file path and no basis note is printed under the desk. -->
  <div class="foot" id="foot" aria-hidden="true"></div>

</div>

<script src="https://unpkg.com/lightweight-charts@5.0.4/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  // Panel headers carry counts and names, not date stamps.
  function noDates(x) {
    return String(x == null ? "" : x)
      .replace(/\s*\d{4}-\d{2}-\d{2}/g, "")
      .replace(/\s*\d{2}\/\d{2}\/\d{4}/g, "")
      .replace(/\s{2,}/g, " ")
      .replace(/[\s]*(?:to|from|-|,)+\s*$/gi, "")
      .replace(/[\s,-]+$/, "");
  }
  "use strict";

  var EXS = {
    NSE: { full: "Nairobi Securities Exchange", cur: "KES", sym: "SCOM", country: "Kenya", iso: "KE" },
    JSE: { full: "Johannesburg Stock Exchange", cur: "ZAc", sym: "NPN", country: "South Africa", iso: "ZA" },
    NGX: { full: "Nigerian Exchange",           cur: "NGN", sym: "GTCO", country: "Nigeria", iso: "NG" },
    EGX: { full: "Egyptian Exchange",           cur: "EGP", sym: "HRHO", country: "Egypt", iso: "EG" }
  };

  var Q = new URLSearchParams(location.search);
  var EX = String(Q.get("ex") || "NSE").toUpperCase();
  if (!EXS[EX]) EX = "NSE";
  var CFG = EXS[EX];

  var MB = null;      // the board: market_<EX>.json, else screener_<EX>.json
  var IX = null;      // ex_<EX>_indices.json
  var HIST = null;    // history/<KEY>.json
  var HKEY = "";      // the history key that answered
  var HROW = null;    // the market row the candles belong to
  var BOARD_FILE = "";   // the file the board came from
  var BOARD_FULL = false; // true when the board carried the whole quote
  var HM = null;         // heatmap_<EX>.json
  var HM_LOADED = false; // true once that request has answered or failed
  var MC = null;         // { rates, cpi, fisc, fx } from the macro files
  var MC_LOADED = false; // true once those requests have answered or failed
  var HDONE = null;      // the security whose history is loaded for the desk

  function $(id){ return document.getElementById(id); }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(v){
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function fmtPx(n){
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(p){
    return (p >= 0 ? "+" : "") + Number(p).toFixed(2) + "%";
  }
  function fmtInt(n){ return Math.round(n).toLocaleString("en-US"); }
  // a published market cap string is printed as published; a numeric one is
  // scaled to the same shape so a column of them scans
  function compact(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "string") return v;
    var n = Number(v);
    if (!isFinite(n)) return null;
    var u = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]];
    for (var i = 0; i < u.length; i++){
      if (n >= u[i][0]) return (n / u[i][0]).toFixed(2) + u[i][1];
    }
    return n.toFixed(2);
  }
  function cls(v){
    if (v === null || v === undefined) return "flat";
    return v > 0 ? "up" : (v < 0 ? "down" : "flat");
  }
  function get(u){
    return fetch(u, { cache: "default" }).then(function(r){
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  // the session date out of either stamp the tree uses
  function asDate(s){
    if (s == null) return null;
    var t = String(s).trim();
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
    if (m) return { iso: m[1] + "-" + m[2] + "-" + m[3], ms: Date.parse(m[1] + "-" + m[2] + "-" + m[3] + "T00:00:00Z") };
    m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(t);
    if (m){
      var iso = m[3] + "-" + m[2] + "-" + m[1];
      return { iso: iso, ms: Date.parse(iso + "T00:00:00Z") };
    }
    return null;
  }

  // ---- the rows ----------------------------------------------------------
  // the board as published, with the session's most traded first so the tape
  // and the table open on names that actually traded
  function allRows(){ return (MB && MB.stocks) ? MB.stocks.slice() : []; }
  function ranked(){
    var rows = allRows();
    rows.sort(function(a, b){
      var va = num(a.volume), vb = num(b.volume);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      return vb - va;
    });
    return rows;
  }
  function priced(){
    return ranked().filter(function(r){ return num(r.price) !== null; });
  }

  // ---- ticker tape -------------------------------------------------------
  function tapeItem(r, dup){
    var p = num(r.price), c = num(r.chgPct);
    return '<span class="tape-i' + (dup ? " dup" : "") + '"' + (dup ? ' aria-hidden="true"' : "") + '>' +
             '<b>' + esc(r.ticker || r.sym || "") + '</b>' +
             '<span class="px">' + fmtPx(p) + '</span>' +
             '<span class="ch ' + cls(c) + '">' + (c === null ? "-" : fmtPct(c)) + '</span>' +
           '</span>';
  }
  function renderTape(){
    var want = window.innerWidth >= 900 ? 16 : 12;
    var list = priced().slice(0, want);
    var el = $("tapeIn");

    // the exchange's own index levels lead the tape, the way the shell does it
    var head = "";
    if (IX && IX.length){
      for (var x = 0; x < IX.length; x++){
        var ix = IX[x] || {};
        var lvl = num(ix.price);
        var chTxt = "-", chCls = "flat";
        if (typeof ix.change === "string" && ix.change.trim()){
          chTxt = ix.change.trim();
          chCls = chTxt.charAt(0) === "-" ? "down" : (chTxt.charAt(0) === "+" ? "up" : "flat");
        } else if (num(ix.change) !== null){
          var cv = num(ix.change), cp = num(ix.changePct);
          chTxt = (cv > 0 ? "+" : "") + fmtPx(cv) + (cp === null ? "" : " (" + fmtPct(cp) + ")");
          chCls = cls(cv);
        } else if (num(ix.changePct) !== null){
          chTxt = fmtPct(num(ix.changePct));
          chCls = cls(num(ix.changePct));
        }
        head += '<span class="tape-i">' +
          '<b>' + esc(ix.name || ix.ticker || "") + '</b>' +
          '<span class="px">' + (lvl === null ? '<span class="nq">withheld</span>' : fmtPx(lvl)) + '</span>' +
          '<span class="ch ' + (lvl === null ? "flat" : chCls) + '">' + (lvl === null ? "-" : esc(chTxt)) + '</span>' +
        '</span>';
      }
    }

    if (!list.length && !head){ el.innerHTML = ""; return; }
    var a = head, b = head;
    for (var i = 0; i < list.length; i++){ a += tapeItem(list[i], false); b += tapeItem(list[i], true); }
    el.innerHTML = a + b;
  }

  // ---- chart -------------------------------------------------------------
  function histKeys(row){
    var tick = String((row && row.ticker) || "").toUpperCase();
    var sym = String((row && row.sym) || "").toUpperCase();
    var bare = sym.split(".")[0];
    var out = [];
    function push(k){
      k = String(k || "").toUpperCase();
      if (k && out.indexOf(k) < 0) out.push(k);
    }
    if (EX === "NSE" || EX === "NGX"){ push(EX + "_" + tick); push(EX + "_" + bare); return out; }
    if (EX === "EGX"){ push(tick + ".CA"); push(sym); push(tick); return out; }
    push(sym);
    push(tick + ".JO");
    push(tick);
    return out;
  }

  // One drawing routine, used twice: by the fixed hero card above (the default
  // composite) and by ?view=chart, which asks for more sessions, fatter bodies
  // and intermediate dates labelled. Every number comes from HIST; nothing is
  // smoothed, filled or invented.
  function drawCandles(opt){
    var wrap = opt.wrap, svg = opt.svg, headEl = opt.head || null, noteEl = opt.note || null;
    var lite = !!opt.lite;                        // the desk tile: candles only
    var W = Math.max(180, wrap.clientWidth), H = Math.max(60, wrap.clientHeight);
    var bars = (HIST && HIST.bars) ? HIST.bars : [];
    var symTxt = HROW ? String(HROW.ticker || HROW.sym || "") : CFG.sym;

    if (!bars.length){
      svg.innerHTML = "";
      if (headEl) headEl.textContent = symTxt + " no history on file";
      if (noteEl) noteEl.textContent = "No daily history file answered for " + symTxt + " on " + EX + ", so no price series is drawn.";
      return;
    }

    var winN = opt.winN || (W >= 1100 ? 45 : (W >= 700 ? 40 : 30));
    var win = bars.slice(-winN).filter(function(b){ return b && b.t; });

    var full = [], closesOnly = 0;
    for (var i = 0; i < win.length; i++){
      var b = win[i];
      var o = num(b.o), h = num(b.h), l = num(b.l), c = num(b.c);
      if (c === null) continue;
      if (o === null || h === null || l === null){ closesOnly++; continue; }
      full.push({ t: String(b.t).slice(0, 10), o: o, h: h, l: l, c: c });
    }

    var head = symTxt + " &middot; " + EX + " &middot; " + esc((HIST && HIST.currency) || CFG.cur);
    if (headEl) headEl.innerHTML = head + " &middot; " + (full.length || win.length) + " sessions";

    var note = "";
    if (!full.length){
      svg.innerHTML = "";
      if (noteEl) noteEl.innerHTML = '<span class="warn">The history file for ' + esc(symTxt) +
        ' gives only a close for the window, so open, high and low are not available and no candles are drawn.</span>';
      return;
    }

    // the honest note: the window, its first and last date, its range, and how
    // far the last bar sits behind the exchange's own session
    var lo = full[0].l, hi = full[0].h, loDate = full[0].t, hiDate = full[0].t;
    for (var j = 1; j < full.length; j++){
      if (full[j].l < lo) lo = full[j].l;
      if (full[j].h > hi) hi = full[j].h;
    }
    loDate = full[0].t;
    hiDate = full[full.length - 1].t;
    note = "<b>" + full.length + " daily sessions</b> " + esc(loDate) + " to <b>" + esc(hiDate) +
           "</b> &middot; range <b>" + fmtPx(lo) + "</b> to <b>" + fmtPx(hi) + "</b>";
    if (closesOnly) note += " &middot; " + closesOnly + " bars in the window carry only a close and are not drawn";

    var sAsOf = asDate(MB && MB.asOf), sBar = asDate(hiDate);
    if (sAsOf && sBar && isFinite(sAsOf.ms) && isFinite(sBar.ms)){
      var lag = Math.round((sAsOf.ms - sBar.ms) / 86400000);
      if (lag > 1) note += ' &middot; <span class="warn">last bar ' + esc(hiDate) + ', ' + lag +
        ' days before the ' + esc(sAsOf.iso) + ' session</span>';
    }
    noteEl && (noteEl.innerHTML = note);

    // ---- geometry ----
    var padL = 4, padR = 62, padT = 10, padB = 16;
    if (lite){ padR = 4; padT = 6; padB = 5; }
    var plotW = Math.max(40, W - padL - padR), plotH = Math.max(30, H - padT - padB);
    var slot = plotW / full.length;
    var bodyW = Math.max(3, Math.min(opt.bodyCap || 26, slot * (opt.bodyFrac || 0.62)));
    var span = hi - lo;
    var padY = span > 0 ? span * 0.08 : (Math.abs(hi) > 0 ? Math.abs(hi) * 0.02 : 1);
    var yMin = lo - padY, yMax = hi + padY;
    function Y(v){ return padT + (yMax - v) / (yMax - yMin) * plotH; }
    // one number format for the whole axis: a price axis that switches between
    // 1,060 and 999.76 tick by tick reads as two different scales
    var axisInt = Math.max(Math.abs(yMax), Math.abs(yMin)) >= 1000;
    function axisLabel(v){
      return axisInt ? Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }) : fmtPx(v);
    }

    var parts = [];
    // horizontal grid and the price labels on the right; these are the range.
    // The desk tile leaves them out: at that size the labels would be the only
    // thing you could read, and the caption carries the numbers instead.
    var ticks = 4;
    for (var t = 0; !lite && t <= ticks; t++){
      var v = yMax - (yMax - yMin) * (t / ticks);
      var y = Y(v);
      parts.push('<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) +
                 '" y2="' + y.toFixed(1) + '" stroke="#141414" stroke-width="1"/>');
      parts.push('<text x="' + (W - padR + 6) + '" y="' + (y + 3).toFixed(1) +
                 '" fill="#6a6a6a" font-family="Oxygen Mono, monospace" font-size="9">' +
                 axisLabel(v) + '</text>');
    }

    // candles: wick high to low, body open to close, mint up and red down
    for (var k = 0; k < full.length; k++){
      var d = full[k];
      var up = d.c >= d.o;
      var col = up ? "#33e29a" : "#f87171";
      var cx = padL + slot * (k + 0.5);
      var yo = Y(d.o), yc = Y(d.c), yh = Y(d.h), yl = Y(d.l);
      var top = Math.min(yo, yc), bot = Math.max(yo, yc);
      if (bot - top < 1) bot = top + 1;
      parts.push('<line x1="' + cx.toFixed(1) + '" y1="' + yh.toFixed(1) + '" x2="' + cx.toFixed(1) +
                 '" y2="' + yl.toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>');
      parts.push('<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + top.toFixed(1) +
                 '" width="' + bodyW.toFixed(1) + '" height="' + (bot - top).toFixed(1) +
                 '" fill="' + col + '"/>');
    }

    // first and last date shown; the standalone chart also labels two interior
    // dates so the reader can place the middle of the window
    if (opt.dateTicks){
      var marks = [0.25, 0.5, 0.75];
      for (var q = 0; q < marks.length; q++){
        var idx = Math.min(full.length - 1, Math.max(0, Math.round((full.length - 1) * marks[q])));
        var mx = padL + slot * (idx + 0.5);
        parts.push('<text x="' + mx.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" fill="#6a6a6a" ' +
                   'font-family="Oxygen Mono, monospace" font-size="9">' + esc(full[idx].t) + '</text>');
      }
    }
    if (!lite){
      parts.push('<text x="' + padL + '" y="' + (H - 4) + '" fill="#6a6a6a" font-family="Oxygen Mono, monospace" font-size="9">' +
                 esc(loDate) + '</text>');
      parts.push('<text x="' + (W - padR) + '" y="' + (H - 4) + '" text-anchor="end" fill="#6a6a6a" ' +
                 'font-family="Oxygen Mono, monospace" font-size="9">' + esc(hiDate) + '</text>');
    }

    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.innerHTML = parts.join("");
  }

  // ---- the desk ----------------------------------------------------------
  // Seven windows in one grid: MARKET the large window, CHART the candle
  // window with the page's one control in its header, COMPARE and MACRO the
  // two beside and below it, FOCUS the quote window at the top right, and
  // WATCHLIST and HEATMAP the read-out windows under MARKET. Every block below
  // is painted from the published files and nothing on the desk responds to a
  // pointer or a key except the CHART search field.

  // Each window is drawn inside its own guard. One window that cannot be drawn
  // says so in its own frame; it never leaves the seven beside it blank, which
  // is what one uncaught exception in the centre window used to do.
  function tryDraw(fn){ try { fn(); return true; } catch(e){ try{console.error("TRYDRAW", e && (e.stack||e.message||e));}catch(_){} return false; } }
  function guardDraw(id, label, fn){
    var ok = tryDraw(fn);
    if (ok) return;
    var host = $(id);
    if (host && !String(host.textContent).trim()){
      host.innerHTML = '<div class="vempty"><b>' + esc(label) +
        '</b>This window could not be drawn from the published file.</div>';
    }
  }

  // No dates anywhere on this page. The owner has asked for this four times.
  // A sweeper runs after every render and on every DOM change, so no panel can
  // reintroduce one by writing a fresh node. Chart axes are canvas, untouched.
  function stripDatesFromText(){
    try {
      var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
      var n, iso = /\d{4}-\d{2}-\d{2}/g, dmy = /\d{2}\/\d{2}\/\d{4}/g;
      var changed = 0;
      while ((n = walk.nextNode())){
        var t = n.nodeValue;
        if (!t) continue;
        if (t.indexOf("-20") < 0 && t.indexOf("/20") < 0) continue;
        var c = t.replace(iso, "").replace(dmy, "");
        c = c.replace(/\s{2,}/g, " ").replace(/[\s,\-]+$/, "").replace(/^[\s,\-]+/, "");
        if (c !== t){ n.nodeValue = c; changed++; }
      }
      return changed;
    } catch(e){ return 0; }
  }
  function sweepSoon(){ setTimeout(stripDatesFromText, 60); setTimeout(stripDatesFromText, 400); setTimeout(stripDatesFromText, 1500); }

  try {
    var dateObserver = new MutationObserver(function(){ stripDatesFromText(); });
    dateObserver.observe(document.body, {childList:true, subtree:true, characterData:true});
  } catch(e){}
  function renderDesk(){
    sweepSoon();
    tryDraw(renderChrome);
    tryDraw(renderTape);
    guardDraw("wlBody", "Watchlist", renderWatch);
    guardDraw("mkBody", "Market", renderMarket);
    guardDraw("fxBody", "Focus", renderFocus);
    guardDraw("cmpBody", "Compare", renderCompare);
    guardDraw("hmBody", "Heatmap", renderHeatmap);
    guardDraw("mcBody", "Macro", renderMacro);
    tryDraw(chtBoot);
    guardDraw("chBodyChart", "Chart", chtPaint);
    tryDraw(loadDeskHistory);
    tryDraw(function(){ if (MB && MB.stocks) loadCompareHistory(); });
  }

  // drop rows from the bottom of a window until its content fits, so a short
  // frame clips nothing and a tall one wastes no space. The drop count is
  // worked out from the measured row height, not one row per pass, because a
  // board like the JSE can be 300 rows deep.
  // A row is removed from ITS OWN parent: in the MARKET window that parent is
  // the section (.sec-gain and friends), not the window body, and asking the
  // body to remove a node it does not own throws NotFoundError and blanked the
  // window on any frame short enough to need a trim.
  function trimToFit(host, sel, keep){
    var nodes = host.querySelectorAll(sel);
    if (!nodes.length) return;
    var over = host.scrollHeight - host.clientHeight;
    if (over <= 1) return;
    var h = nodes[0].getBoundingClientRect().height || 1;
    var drop = Math.ceil(over / h);
    var want = Math.max(keep || 1, nodes.length - drop);
    var guard = 0;
    while (host.querySelectorAll(sel).length > want && guard++ < 4000){
      var cur = host.querySelectorAll(sel);
      var last = cur[cur.length - 1];
      if (!last || !last.parentNode) return;
      last.parentNode.removeChild(last);
    }
  }

  // Rows leave the sections from the bottom, the deepest section first, until
  // the window fits: that keeps the three mover lists level instead of
  // emptying one of them. No section is ever left as a heading with nothing
  // under it, and the full-detail security table keeps at least six lines.
  function trimMarket(host){
    var secs = [".sec-gain", ".sec-lose", ".sec-act", ".sec-board"];
    var guard = 0;
    while (host.scrollHeight - host.clientHeight > 1 && guard++ < 800){
      var best = null, bestN = 3;
      for (var i = 0; i < secs.length; i++){
        var sec = host.querySelector(secs[i]);
        if (!sec) continue;
        var n = sec.querySelectorAll(".mrow").length;
        if (n > bestN){ best = sec; bestN = n; }
      }
      if (best){
        var rows = best.querySelectorAll(".mrow");
        rows[rows.length - 1].parentNode.removeChild(rows[rows.length - 1]);
        continue;
      }
      var det = host.querySelector("#mkDet");
      var d = det ? det.querySelectorAll(".mk-dr") : [];
      if (d.length > 6){
        d[d.length - 1].parentNode.removeChild(d[d.length - 1]);
        continue;
      }
      return;
    }
  }

  function mkSession(){
    var a = (MB && MB.asOf) ? asDate(MB.asOf) : null;
    return (a && a.iso) ? a.iso : "";
  }

  // ---- WATCHLIST window: the board, most traded first ---------------------
  // One dense line per security under a column head: ticker, name, last,
  // change percent and volume. The line is 17px, so the window carries 14
  // rows of five fields. Rows are generated to a high cap and the ones that
  // do not fit are dropped from the bottom, so the window is always full.
  function renderWatch(){
    var host = $("wlBody");
    if (!MB || !MB.stocks){
      host.innerHTML = '<div class="vempty"><b>No snapshot</b>Nothing is published for ' + esc(EX) + '.</div>';
      return;
    }
    var rows = ranked();
    var out = ['<div class="wl-h"><span>TICKER</span><span>NAME</span>' +
      '<span style="text-align:right">LAST</span>' +
      '<span style="text-align:right">CHG %</span>' +
      '<span style="text-align:right">VOL</span></div>'];
    for (var i = 0; i < rows.length; i++){
      var r = rows[i], p = num(r.price), c = num(r.chgPct), v = num(r.volume);
      var tick = String(r.ticker || r.sym || "");
      out.push('<div class="wr">' +
        '<span class="wt">' + esc(tick || "-") + '</span>' +
        '<span class="wn">' + esc(r.name || "") + '</span>' +
        '<span class="wp">' + (p === null ? '<span class="nq">-</span>' : fmtPx(p)) + '</span>' +
        '<span class="wc ' + cls(c) + '">' + pctCell(c) + '</span>' +
        '<span class="wv">' + (v === null ? "-" : compact(v)) + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    trimToFit(host, ".wr", 6);
  }

  // ---- MARKET window: the board in full detail, then movers ---------------
  // The window carries what a trader reads off a market screen: breadth for
  // the session, then one line per security with ticker, name, last, change,
  // change percent, volume, market cap and sector, then the three mover lists
  // underneath. Every field is a published field of market_<EX>.json; the one
  // derived figure is the change in price, and it is printed only when the
  // row's own percent agrees with it (levelOf). An absent field prints "-".
  function renderMarket(){
    var host = $("mkBody");
    var all = allRows();
    if (!all.length){
      host.innerHTML = '<div class="vempty"><b>No snapshot</b>Neither terminal/static_data/market_' +
        esc(EX) + '.json nor terminal/static_data/screener_' + esc(EX) +
        '.json carries a security for ' + esc(EX) + '.</div>';
      $("mkMetaMark").textContent = "";
      return;
    }
    var priced = all.filter(function(r){ return num(r.price) !== null; });
    var adv = 0, dec = 0, unc = 0;
    for (var i = 0; i < all.length; i++){
      var c = num(all[i].chgPct);
      if (c === null) continue;
      if (c > 0) adv++; else if (c < 0) dec++; else unc++;
    }
    var ratio = dec ? adv / dec : (adv ? 9 : 1);
    var tone = ratio >= 1.5 ? "RISK-ON" : (ratio <= 0.67 ? "RISK-OFF" : "MIXED");
    var toneCls = ratio >= 1.5 ? "up" : (ratio <= 0.67 ? "down" : "flat");
    var curs = {};
    for (var q = 0; q < all.length; q++){ curs[curOf(all[q])] = 1; }
    var cur = Object.keys(curs).sort()[0] || CFG.cur;
    var session = mkSession();

    var withChg = priced.filter(function(r){ return num(r.chgPct) !== null; });
    var gain = withChg.slice().sort(function(a, b){ return num(b.chgPct) - num(a.chgPct); });
    var lose = withChg.slice().sort(function(a, b){ return num(a.chgPct) - num(b.chgPct); });
    var active = priced.slice().sort(function(a, b){ return (num(b.volume) || 0) - (num(a.volume) || 0); });

    function tkOf(s){ return String(s.ticker || s.sym || ""); }
    function chgCell(s){
      var lv = levelOf(s);
      return lv === null ? '<span class="flat">-</span>'
        : '<span class="' + cls(lv) + '">' + (lv > 0 ? "+" : "") + fmtPx(lv) + '</span>';
    }
    // one full-detail line for the security table
    function detRow(s){
      var p = num(s.price), pc = num(s.chgPct), v = num(s.volume), cap = compact(s.marketCap);
      return '<div class="mk-dr">' +
        '<span class="t">' + esc(tkOf(s) || "-") + '</span>' +

        '<span class="r">' + chgCell(s) + '</span>' +
        '<span class="r ' + cls(pc) + '">' + pctCell(pc) + '</span>' +
        '<span class="r">' + (v === null ? "-" : compact(v)) + '</span>' +
        '<span class="r">' + (cap === null ? "-" : esc(cap)) + '</span>' +
        '<span class="s">' + esc(String(s.sector || "-")) + '</span>' +
      '</div>';
    }
    // one compact line for the three mover columns
    function mover(s){
      var ch = num(s.chgPct), v = num(s.volume);
      return '<div class="mrow"><span class="mt">' + esc(tkOf(s) || "-") + '</span>' +
        '<span class="mp">' + (num(s.price) === null ? "-" : fmtPx(num(s.price))) + '</span>' +
        '<span class="mc ' + cls(ch) + '">' + pctCell(ch) + '</span>' +
        '<span class="mv">' + (v === null ? "-" : compact(v)) + '</span></div>';
    }

    var html = '<div class="mk-top">' +
      '<div class="mk-ex">' + esc(EX) + ' <span>&middot; ' + esc(CFG.full) + '</span></div>' +
      '<div class="mk-sub">' + esc(CFG.country) + ' &middot; ' +
        esc(cur) + (session ? ' &middot; EOD ' + esc(session) : "") + '</div>' +
      '<div class="mk-br"><span class="up">&#9650; ' + adv + '</span>' +
        '<span class="down">&#9660; ' + dec + '</span>' +
        '<span class="flat">- ' + unc + '</span>' +
        '<span class="tone ' + toneCls + '">' + tone + '</span></div>' +
    '</div>';

    // the security table: the session's most traded names, in full detail
    var det = active.slice(0, 14);
    html += '<div class="mk-det" id="mkDet">' +
      '<div class="mk-dh"><span>TICKER</span><span>NAME</span><span class="r">LAST</span>' +
      '<span class="r">CHG</span><span class="r">CHG %</span><span class="r">VOL</span>' +
      '<span class="r">MKT CAP</span><span>SECTOR</span></div>' +
      det.map(detRow).join("") + '</div>';

    var N = 18;
    html += '<div class="mk-body">';
    var sections = 0;
    if (gain.length){
      html += '<div class="mcol"><div class="msec">TOP GAINERS</div><div class="sec-gain">' +
        gain.slice(0, N).map(mover).join("") + '</div></div>';
      sections++;

      html += '<div class="mcol"><div class="msec">TOP LOSERS</div><div class="sec-lose">' +
        lose.slice(0, N).map(mover).join("") + '</div></div>';
      sections++;
    }
    if (active.length){
      html += '<div class="mcol"><div class="msec">MOST ACTIVE</div><div class="sec-act">' +
        active.slice(0, N).map(mover).join("") + '</div></div>';
      sections++;
    }
    // a board with no published change still gets one ranked table of real
    // securities, with its price and its (absent) change shown as absent
    if (!sections){
      html += '<div class="mcol"><div class="msec">THE BOARD BY VOLUME</div><div class="sec-board">' +
        active.slice(0, N).map(mover).join("") + '</div></div>';
    }
    html += '</div>';

    host.innerHTML = html;
    trimMarket(host);
    $("mkMetaMark").textContent = noDates((BOARD_FULL ? "quotes" : "screener file") + " - " + priced.length + " priced");
  }

  // ---- FOCUS window: one security, its quote and its recent line ----------
  // The preference is the exchange's lead name, then the most traded security
  // that carries a price, then the first row of the board: FOCUS names a
  // security whenever the board carries one, and prints absent cells as absent.
  function focusRow(){
    var rows = priced();
    var pref = String(CFG.sym).toUpperCase();
    for (var i = 0; i < rows.length; i++){
      if (String(rows[i].ticker || rows[i].sym || "").toUpperCase() === pref) return rows[i];
    }
    if (rows.length) return rows[0];
    var all = allRows();
    return all.length ? all[0] : null;
  }
  function renderFocus(){
    var host = $("fxBody");
    var r = focusRow();
    if (!r){
      host.innerHTML = '<div class="vempty"><b>Focus</b>No security is published for ' + esc(EX) +
        ', so there is no quote to draw.</div>';
      $("fxMeta").textContent = EX;
      return;
    }
    var p = num(r.price), c = num(r.chgPct), lvl = levelOf(r);
    var cur = curOf(r);
    function kv(k, v){ return '<span>' + k + '</span><b>' + (v === null || v === "" ? "-" : esc(v)) + '</b>'; }
    var vol = num(r.volume), cap = compact(r.marketCap);
    var asof = r.asOf ? String(r.asOf).slice(0, 10) : "";
    var chgTxt = (lvl === null ? null : (lvl > 0 ? "+" : "") + fmtPx(lvl));
    host.innerHTML =
      '<div class="fx-top">' +
        '<div class="fx-sym">' + esc(String(r.ticker || r.sym || "")) + '<span>' + esc(EX) + '</span></div>' +
        '<div class="fx-nm">' + esc(r.name || "") + '</div>' +
        '<div class="fx-px">' + (p === null ? '<span class="nq">no quote</span>' : fmtPx(p)) + '</div>' +
        '<div class="fx-ch"><span class="' + cls(c) + '">' + pctCell(c) + '</span>' +
          (lvl === null ? ' <span class="flat">-</span>' : ' <span class="' + cls(lvl) + '">' + chgTxt + '</span>') +
          '<span class="cur">' + esc(cur) + '</span></div>' +
      '</div>' +
      '<div class="fx-kv">' +
        kv("LAST", p === null ? null : fmtPx(p)) +
        kv("CHG", chgTxt) +
        kv("CHG %", c === null ? null : fmtPct(c)) +
        kv("PREV", num(r.prevClose) === null ? null : fmtPx(num(r.prevClose))) +
        kv("OPEN", num(r.open) === null ? null : fmtPx(num(r.open))) +
        kv("HIGH", num(r.high) === null ? null : fmtPx(num(r.high))) +
        kv("LOW", num(r.low) === null ? null : fmtPx(num(r.low))) +
        kv("VOL", vol === null ? null : fmtInt(vol)) +
        kv("MKT CAP", cap) +
        kv("CUR", cur) +
        kv("SECTOR", r.sector || null) +
        kv("AS OF", asof || null) +
      '</div>' +
      '<div class="fx-line" id="fxLine"><svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg></div>' +
      '<div class="fx-range" id="fxRange">no price history on file</div>';
    $("fxMeta").textContent = EX + (r.sector ? " - " + r.sector : "");
  }
  function drawFocusLine(){
    var box = $("fxLine");
    if (!box) return;
    var svg = box.querySelector("svg");
    var bars = (HIST && HIST.bars) ? HIST.bars.slice(-30) : [];
    var pts = [];
    for (var i = 0; i < bars.length; i++){
      var c = num(bars[i] && bars[i].c);
      if (c !== null) pts.push({ c: c, t: String(bars[i].t).slice(0, 10) });
    }
    if (!pts.length){
      svg.innerHTML = "";
      $("fxRange").textContent = "no price history on file";
      return;
    }
    var W = Math.max(40, box.clientWidth), H = Math.max(20, box.clientHeight);
    var lo = pts[0].c, hi = pts[0].c;
    for (var j = 1; j < pts.length; j++){ if (pts[j].c < lo) lo = pts[j].c; if (pts[j].c > hi) hi = pts[j].c; }
    var span = hi - lo || Math.abs(hi) * 0.01 || 1;
    var pad = 3;
    var d = "";
    for (var k = 0; k < pts.length; k++){
      var x = pad + (W - pad * 2) * (pts.length === 1 ? 0.5 : k / (pts.length - 1));
      var y = pad + (H - pad * 2) * (1 - (pts[k].c - lo) / span);
      d += (k ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    var last = pts[pts.length - 1];
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#33e29a" stroke-width="1.2"/>' +
      '<circle cx="' + (pad + (W - pad * 2)).toFixed(1) + '" cy="' +
      (pad + (H - pad * 2) * (1 - (last.c - lo) / span)).toFixed(1) + '" r="1.6" fill="#33e29a"/>';
    $("fxRange").textContent = pts[0].t + " to " + last.t + " - " + pts.length + " sessions";
  }
  function loadDeskHistory(){
    var r = focusRow();
    if (!r){ tryDraw(drawFocusLine); return Promise.resolve(null); }
    if (HDONE === r){
      tryDraw(drawFocusLine);
      return Promise.resolve(HIST);
    }
    function done(){ HDONE = r; tryDraw(drawFocusLine); }
    return loadHistoryFor(r).then(done).catch(done);
  }

  // ---- COMPARE window: four securities on one rebased chart ---------------
  // The four are the session's four most traded priced securities on the board
  // the WATCHLIST reads, drawn the way the terminal's own COMPARE draws them:
  // a header line naming them in their series colours, ONE plot carrying one
  // coloured line per security on common axes, a caption naming the window all
  // four share, a legend printing each series total return over that window,
  // and a metric table reading the published quote fields across the four.
  //
  // Every line is REBASED to 100 at the first session of the window, so a line
  // is percent return rather than a price. That is the whole point: the four
  // need not share a currency, and a return is unit free.
  //
  // The window is the set of sessions every plotted series actually carries,
  // cut to its most recent CMP_PTS dates: an honest common window, stated with
  // its point count in the caption, rather than four lines each starting from
  // a different day. A security with no history file draws no line at all, its
  // legend entry says so and the caption names only what plotted. Nothing is
  // interpolated, carried forward or filled from a neighbour.
  var CMP_COL = ["#33e29a", "#5aa9ff", "#e0a340", "#b07cff"];  // mint, blue, amber, violet
  var CMP_PTS = 260;    // most recent common sessions the plot carries
  var CMP_HIST = {};    // ticker -> { key, bars } or null
  var CMP_DONE = "";    // signature of the four whose history is now loaded
  var CMP_DRAWN = [];   // [{ sym, key, pts, ret }] per series that plotted

  function cmpTicks(four){
    var out = [];
    for (var i = 0; i < four.length; i++) out.push(String(four[i].ticker || four[i].sym || "").toUpperCase());
    return out;
  }
  function cmpSig(four){ return cmpTicks(four).join("|"); }

  // date -> published close, one entry per dated bar. A bar with no date or no
  // usable close is skipped; the close is the file's own close, never derived.
  function cmpCloses(bars){
    var map = {}, dates = [], arr = bars || [];
    for (var i = 0; i < arr.length; i++){
      var b = arr[i] || {};
      var t = String(b.t == null ? "" : b.t).slice(0, 10);
      var c = num(b.c);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(t) || c === null || c <= 0) continue;
      if (Object.prototype.hasOwnProperty.call(map, t)) continue;
      map[t] = c; dates.push(t);
    }
    dates.sort();
    return { map: map, dates: dates };
  }

  // the sessions every series in the list carries, most recent last
  function cmpCommon(series){
    var common = [];
    if (!series.length) return common;
    common = series[0].dates.slice();
    for (var i = 1; i < series.length; i++){
      var m = series[i].map;
      common = common.filter(function(d){
        return Object.prototype.hasOwnProperty.call(m, d);
      });
    }
    common.sort();
    if (common.length > CMP_PTS) common = common.slice(common.length - CMP_PTS);
    return common;
  }

  function fmtRet(v){
    if (v === null || v === undefined || !isFinite(v)) return "-";
    return (v >= 0 ? "+" : "") + Number(v).toFixed(1) + "%";
  }

  // One history request per security, walked down the same keys the CHART
  // window uses. Held in CMP_HIST so a resize does not re-ask for a file.
  function loadCompareHistory(){
    var four = priced().slice(0, 4);
    if (!four.length) return Promise.resolve([]);
    var sig = cmpSig(four);
    if (CMP_DONE === sig){ tryDraw(drawCompareLines); return Promise.resolve(CMP_HIST); }
    var jobs = four.map(function(r){
      var tick = String(r.ticker || r.sym || "").toUpperCase();
      if (Object.prototype.hasOwnProperty.call(CMP_HIST, tick)) return Promise.resolve(CMP_HIST[tick]);
      var keys = histKeys(r), p = Promise.resolve(null);
      keys.forEach(function(k){
        p = p.then(function(hit){
          if (hit) return hit;
          return get("terminal/static_data/history/" + encodeURIComponent(k) + ".json")
            .then(function(d){
              return (d && d.bars && d.bars.length) ? { key: k, bars: d.bars } : null;
            })
            .catch(function(){ return null; });
        });
      });
      return p.then(function(hit){ CMP_HIST[tick] = hit; return hit; });
    });
    return Promise.all(jobs).then(function(res){
      CMP_DONE = sig;
      tryDraw(drawCompareLines);
      return res;
    });
  }

  // The plot: four polylines, no candle and no bar anywhere in it. Each series
  // is divided by its own close at the first session of the window and
  // multiplied by 100, so every line starts at exactly 100 and the y axis is a
  // rebased index whose 100 line is the window's opening level.
  function drawCompareLines(){
    var host = $("cmpBody");
    var four = priced().slice(0, 4);
    CMP_DRAWN = [];
    if (!host || !four.length) return CMP_DRAWN;

    var plot = $("cmpPlot"), svg = $("cmpSvg"), cap = $("cmpCaption"), leg = $("cmpLeg");
    if (!plot || !svg) return CMP_DRAWN;

    var series = [], missing = [], i, k;
    for (i = 0; i < four.length; i++){
      var tick = String(four[i].ticker || four[i].sym || "");
      var hit = CMP_HIST[tick.toUpperCase()] || null;
      var cl = (hit && hit.bars && hit.bars.length) ? cmpCloses(hit.bars) : null;
      if (!cl || !cl.dates.length){ missing.push({ tick: tick, col: CMP_COL[i % 4], idx: i }); continue; }
