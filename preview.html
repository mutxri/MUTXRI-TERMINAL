<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - PREVIEW: a display-only view of the terminal.

  This page is a picture made of HTML. There is no search field, no button, no
  link, no tab, no select and no collapsible section anywhere on it, and nothing
  on it responds to a mouse or a keyboard. It exists so the landing page can show
  what the terminal looks like without handing the visitor a working application.

  TWO PARAMETERS, nothing else:
    ?ex=NSE|JSE|NGX|EGX   picks the board
    ?view=NAME            picks which static panel is drawn under the header

  With no ?view= the page draws THE DESK: the terminal's own START HERE
  workspace, as a picture. WATCHLIST runs down the left, MARKET is the large
  centre window (breadth, top gainers, top losers, most active), and FOCUS sits
  above NEWS in the right column. Each window wears the shell's chrome: 1px
  borders, a mono caps title bar with the mint underline, tabular numerals and
  the same up and down colours. Each ?view= draws ONE panel instead, still a
  picture and still inert:
    watchlist   the board ordered by volume: ticker, name, price, change, volume
    chart       the candle chart alone, larger, 40 to 60 recent sessions
    financials  one liquid name's stored income statement, every period, with
                its source file named in the caption
    screener    the board ordered by change percent, with sector
    info        the company profile facts on file for one name
    news        the exchange's wire items: date, headline, source
    corpactions the exchange's dated corporate actions: date, security, type,
                and the detail as the file states it
    trade       a paper blotter, or an honest empty state when no paper book
                exists in this browser

  DEPLOY LAYOUT: this file ships to the SITE ROOT (mutxriterminal.com/preview.html)
  and the data ships under /terminal/, so every path below is written from the
  root and starts with terminal/. A path of ../static_data would 404 in
  production even though it resolves in the source tree.

  DATA READ (all static, all published):
    terminal/static_data/market_<EX>.json              quotes, breadth, tape
    terminal/static_data/history/<KEY>.json            daily OHLC bars -> candles
    terminal/static_data/financials/<KEY>__income.json stored statement rows
    terminal/static_data/company_info.json             descriptive company facts
    terminal/static_data/<ex>_news.json                dated wire items
    terminal/static_data/nse_corporate_actions.json    NSE dated actions
    terminal/static_data/ngx_corporate_actions.json    NGX dated actions
    terminal/static_data/jse_announcements.json        JSE SENS announcements
    terminal/static_data/egx_announcements.json        EGX announcements

  HONESTY:
    - the exchange's own as-of string is printed in full in the top bar, and the
      MARKET window states the session date beside the priced count
    - a security with no published price prints "no quote" and no number, and a
      missing change, level or market cap prints the house empty marker "-" in
      muted grey. Nothing is estimated and nothing is filled in from a neighbour
    - candles use open, high, low and close. A history file that carries only
      closes says so on one line and no candle is drawn from a repeated close
    - a nameless or dateless row in a table prints undated or "-", never a guess

  Vanilla JS, Godel tokens (mint #33e29a on black, Oxygen Mono, uppercase labels,
  tabular numerals), no libraries, no build step. Every affordance that would
  suggest the page is usable has been left out on purpose.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - PREVIEW</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html,body{height:100%;}
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;display:none;}

  :root{
    --bg:#000;--bg2:#070707;--bg3:#0d0d0d;--bg4:#141414;
    --line:#161616;--line2:#242424;--tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;--warn:#e0a340;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
    --rowh:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:13px;
    overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;}

  .pg{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- top bar ---------- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-bottom:1px solid var(--line2);background:var(--bg2);}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--tx);white-space:nowrap;}
  .brand b{color:var(--acc);font-weight:700;}
  .top-ex{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--acc);white-space:nowrap;}
  .top-ex i{font-style:normal;color:var(--tx3);letter-spacing:.04em;}
  .top-asof{flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:10px;color:var(--tx2);
    letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
  .disp{flex:0 0 auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--tx3);
    border:1px solid var(--line2);border-radius:2px;padding:4px 8px;white-space:nowrap;}

  /* ---------- ticker tape ---------- */
  .tape{flex:0 0 auto;height:34px;border-bottom:1px solid var(--line2);background:#040404;
    overflow:hidden;position:relative;pointer-events:none;}
  .tape:after{content:"";position:absolute;top:0;right:0;bottom:0;width:44px;
    background:linear-gradient(90deg,rgba(4,4,4,0),#040404);}
  .tape:before{content:"";position:absolute;top:0;left:0;bottom:0;width:30px;z-index:1;
    background:linear-gradient(90deg,#040404,rgba(4,4,4,0));}
  .tape-in{display:flex;align-items:center;height:100%;width:max-content;
    animation:tape 140s linear infinite;}
  @keyframes tape{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){ .tape-in{animation:none;} }
  .tape-i{display:flex;align-items:baseline;gap:7px;padding:0 12px;height:100%;
    border-right:1px solid var(--line);white-space:nowrap;}
  .tape-i b{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx);}
  .tape-i .px{font-family:var(--mono);font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;}
  .tape-i .ch{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;}

  /* ---------- layout: the desk ---------- */
  /* START HERE proportions: WATCHLIST down the left, MARKET large in the
     centre, the right column split FOCUS over NEWS. Every window is the
     shell's own chrome: 1px line2 border, black body, a mono caps title bar
     carrying the drag glyph, the mint underline and the close glyph. */
  .grid{flex:1 1 auto;min-height:0;display:grid;gap:6px;padding:6px;min-width:0;}
  .grid.desk{grid-template-columns:minmax(146px,.21fr) minmax(0,1fr) minmax(152px,.245fr);
    grid-template-rows:minmax(0,1fr);}
  .win{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);
    border:1px solid var(--line2);border-radius:3px;overflow:hidden;}
  .rcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;}
  .w-focus{flex:0 0 44%;min-height:0;}
  .w-news{flex:1 1 auto;min-height:0;}

  .whead{flex:0 0 auto;display:flex;align-items:stretch;gap:0;height:27px;padding:0 5px;
    background:#050505;border-bottom:1px solid var(--line2);}
  .dg{align-self:center;color:var(--tx3);font-size:10px;padding:0 3px;opacity:.55;}
  .wtab{align-self:stretch;display:flex;align-items:center;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.16em;color:var(--tx);padding:0 5px;white-space:nowrap;}
  .wtab.on{box-shadow:inset 0 -2px 0 var(--acc);}
  .wtab i{font-style:normal;color:var(--tx3);letter-spacing:.06em;padding-left:5px;}
  .wmeta{align-self:center;margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
    color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;}
  .wx{align-self:center;font-family:var(--mono);font-size:10px;color:var(--tx3);opacity:.5;padding:0 2px;}
  .wbody{flex:1 1 auto;min-height:0;overflow:hidden;}

  .card{border:1px solid var(--line2);border-radius:3px;background:var(--bg2);min-width:0;}
  .card-h{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:7px 11px;border-bottom:1px solid var(--line);}
  .card-h .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;color:var(--tx3);text-transform:uppercase;white-space:nowrap;}
  .card-h .r{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--tx2);
    min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- WATCHLIST window ---------- */
  .wr{display:grid;grid-template-columns:19px minmax(0,1fr) auto;gap:1px 7px;align-items:center;
    padding:4px 8px;border-bottom:1px solid var(--line);}
  .wmono{grid-row:1/span 2;width:17px;height:17px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line2);border-radius:3px;background:var(--bg3);color:var(--acc);
    font-family:var(--mono);font-size:8px;font-weight:700;}
  .wmain{min-width:0;}
  .wmain b{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.02em;
    color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wmain i{display:block;font-style:normal;font-family:var(--ui);font-size:8px;line-height:1.2;
    color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wprice{text-align:right;}
  .wprice b{display:block;font-family:var(--mono);font-size:10px;color:var(--tx);font-variant-numeric:tabular-nums;}
  .wprice i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;font-variant-numeric:tabular-nums;}

  /* ---------- MARKET window ---------- */
  .mk-top{padding:7px 10px 6px;border-bottom:1px solid var(--line);}
  .mk-ex{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;color:#7ef0c0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-ex span{color:var(--tx3);font-weight:400;}
  .mk-sub{font-family:var(--mono);font-size:8.5px;color:var(--tx3);letter-spacing:.04em;padding:2px 0 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk-br{display:flex;gap:10px;padding:5px 0 0;font-family:var(--mono);font-size:10px;
    font-variant-numeric:tabular-nums;}
  .mk-br .tone{margin-left:auto;font-size:8.5px;letter-spacing:.1em;align-self:center;}
  .mk-body{padding:2px 10px 6px;}
  .msec{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;font-weight:700;color:var(--tx3);
    padding:6px 0 3px;border-bottom:1px solid var(--line2);}
  .mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:1px 8px;padding:3px 0;
    font-family:var(--mono);font-size:9.5px;align-items:baseline;font-variant-numeric:tabular-nums;}
  .mrow .mt{color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mrow .mn{font-family:var(--ui);font-size:9px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mrow .mp{text-align:right;color:var(--tx2);white-space:nowrap;}
  .mrow .mc{text-align:right;white-space:nowrap;}

  /* ---------- FOCUS window ---------- */
  .fx-top{padding:7px 10px 5px;border-bottom:1px solid var(--line);}
  .fx-sym{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx);}
  .fx-sym span{color:var(--acc);font-weight:400;font-size:9px;letter-spacing:.08em;padding-left:5px;}
  .fx-nm{font-family:var(--ui);font-size:9px;color:var(--tx3);line-height:1.3;padding-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-px{font-family:var(--mono);font-size:21px;line-height:1.15;color:var(--tx);padding-top:4px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .fx-ch{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;padding-top:1px;}
  .fx-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;padding:3px 10px 5px;}
  .fx-kv span{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:var(--tx3);
    padding:2.5px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
  .fx-kv b{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--tx);text-align:right;
    font-variant-numeric:tabular-nums;padding:2.5px 0;border-bottom:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-line{height:46px;padding:0 4px;pointer-events:none;}
  .fx-line svg{display:block;width:100%;height:100%;pointer-events:none;}
  .fx-range{font-family:var(--mono);font-size:7.5px;color:var(--tx3);letter-spacing:.03em;
    padding:1px 10px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- NEWS window ---------- */
  .nr{padding:4px 9px;border-bottom:1px solid var(--line);}
  .nr-d{font-family:var(--mono);font-size:7.5px;letter-spacing:.04em;color:var(--tx3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nr-h{font-family:var(--ui);font-size:9.5px;line-height:1.32;color:var(--tx);padding-top:1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* ---------- chart, shared by ?view=chart ---------- */
  .chart-wrap{flex:1 1 auto;min-height:0;padding:0 8px;pointer-events:none;cursor:default;}
  .chart-wrap svg{display:block;width:100%;height:100%;pointer-events:none;}
  .chart-note{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;line-height:1.6;color:var(--tx3);
    letter-spacing:.03em;padding:4px 11px 8px;}
  .chart-note b{color:var(--tx2);font-weight:400;}
  .chart-note .warn{color:var(--warn);}

  .tk{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm{font-family:var(--ui);font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .num{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--tx);white-space:nowrap;}
  .num.dim{color:var(--tx3);}
  .cur{font-family:var(--mono);font-size:8px;color:var(--tx3);letter-spacing:.06em;padding-left:4px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--tx3);}
  .nq{font-family:var(--mono);font-size:10px;color:var(--warn);letter-spacing:.04em;}

  /* ---------- foot ---------- */
  .foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px;
    border-top:1px solid var(--line2);background:var(--bg2);font-family:var(--mono);
    font-size:9px;letter-spacing:.04em;color:var(--tx3);white-space:nowrap;overflow:hidden;}
  .foot .sep{color:var(--line2);}
  .foot .sp{flex:1 1 auto;}

  /* ---------- static display views (preview.html?view=...) ---------- */
  /* every rule here builds a picture: no control, no hover state, no pointer */
  .grid.one{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"main";}
  .grid[hidden]{display:none;}
  .grid.one>.card{grid-area:main;min-height:0;}
  .vcard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .vbody{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;}

  .vrow{display:grid;align-items:center;gap:10px;height:24px;padding:0 11px;
    border-bottom:1px solid var(--line);}
  .vrow.hd{height:20px;background:var(--bg3);border-bottom:1px solid var(--line2);}
  .vrow.hd span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--tx3);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vrow .num{text-align:right;}
  .vw{grid-template-columns:78px minmax(0,1fr) 118px 84px 72px 96px;}
  .vs{grid-template-columns:78px minmax(0,1fr) 168px 112px 76px;}
  .vt{grid-template-columns:78px 76px 108px 108px 118px;}
  .vc{grid-template-columns:88px 116px 108px minmax(0,1fr);align-items:start;height:34px;}
  .vc .sec{min-width:0;}
  .vc .sec b{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;
    color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .sec span{display:block;font-family:var(--ui);font-size:9px;color:var(--tx3);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .d{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.03em;padding-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .ty{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--tx2);padding-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc .dt{font-family:var(--ui);font-size:10px;line-height:1.3;color:var(--tx);padding-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .fcap{flex:0 0 auto;padding:6px 11px 5px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:8.5px;line-height:1.5;color:var(--tx3);letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fcap b{color:var(--tx2);font-weight:400;}

  .fintab{width:100%;border-collapse:collapse;table-layout:fixed;}
  .finwrap{flex:1 1 auto;min-height:0;overflow:hidden;}
  .fintab th{font-family:var(--mono);font-size:8px;font-weight:400;letter-spacing:.08em;
    text-transform:uppercase;color:var(--tx2);text-align:right;padding:4px 8px;
    border-bottom:1px solid var(--line2);background:var(--bg3);height:28px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fintab th span{font-size:7px;color:var(--tx3);letter-spacing:.08em;padding-left:3px;}
  .fintab th:first-child{text-align:left;width:36%;}
  .fintab td{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;color:var(--tx);
    text-align:right;padding:0 8px;height:var(--frow,17px);border-bottom:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fintab td:first-child{text-align:left;font-family:var(--ui);font-size:10.5px;color:var(--tx2);}
  .fintab td.abs{color:var(--tx3);}
  .fintab tr.tot td:first-child{color:var(--tx);}

  .nw{display:grid;grid-template-columns:88px minmax(0,1fr) 150px;gap:10px;padding:5px 11px;
    border-bottom:1px solid var(--line);align-items:start;}
  .nw-d{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.03em;padding-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nw-h{font-family:var(--ui);font-size:11px;line-height:1.35;color:var(--tx);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nw-s{font-family:var(--mono);font-size:9px;color:var(--tx2);text-align:right;padding-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .inf{flex:0 0 auto;display:grid;grid-template-columns:136px minmax(0,1fr);gap:0 14px;padding:8px 12px 4px;}
  .inf .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--tx3);
    text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--line);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .inf .v{font-family:var(--ui);font-size:11px;color:var(--tx);padding:4px 0;
    border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inftxt{flex:0 0 auto;padding:8px 12px;font-family:var(--ui);font-size:11px;line-height:1.55;
    color:var(--tx2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}

  .vempty{padding:12px;font-family:var(--mono);font-size:9.5px;line-height:1.7;color:var(--tx3);
    letter-spacing:.03em;}
  .vempty b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tx2);
    text-transform:uppercase;margin-bottom:4px;font-weight:700;}
  .vempty .warn{color:var(--warn);}
  .vchart{flex:1 1 auto;min-height:0;}

  @media (max-width:1100px){
    .grid.desk{grid-template-columns:minmax(126px,.22fr) minmax(0,1fr) minmax(132px,.25fr);}
    .mrow{grid-template-columns:46px minmax(0,1fr) auto auto;gap:1px 6px;}
    .fx-px{font-size:18px;}
  }
  @media (max-width:860px){
    .top{height:40px;gap:9px;padding:0 10px;}
    .brand{font-size:10px;letter-spacing:.12em;}
    .top-ex i{display:none;}
    .top-asof{font-size:9px;}
    .disp{font-size:8px;padding:3px 6px;}
    .tape{height:30px;}
    .grid{gap:5px;padding:5px;}
    .grid.desk{grid-template-columns:minmax(104px,.30fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
    .rcol{display:none;}
    .whead{height:23px;}
    .wtab{font-size:8px;letter-spacing:.1em;padding:0 4px;}
    .wmeta{font-size:7px;}
    .dg{display:none;}
    .wr{padding:3px 6px;gap:1px 5px;grid-template-columns:15px minmax(0,1fr) auto;}
    .wmono{width:14px;height:14px;font-size:7px;}
    .wmain b{font-size:9px;} .wmain i{font-size:7px;} .wprice b{font-size:9px;} .wprice i{font-size:8px;}
    .mk-top{padding:5px 7px 4px;}
    .mk-ex{font-size:10px;}
    .mk-sub{font-size:7.5px;}
    .mk-br{font-size:8.5px;gap:7px;}
    .mk-body{padding:1px 7px 4px;}
    .msec{font-size:7.5px;padding:4px 0 2px;}
    .mrow{grid-template-columns:40px minmax(0,1fr) auto auto;font-size:8.5px;gap:1px 5px;padding:2px 0;}
    .mrow .mn{font-size:8px;}
    .chart-note{font-size:8.5px;padding:3px 8px 6px;line-height:1.5;}
    .tk{font-size:10px;} .nm{font-size:9.5px;} .num{font-size:10px;}
    .foot{font-size:8px;padding:5px 8px;gap:6px;}
  }
  @media (max-width:420px){
    .brand{font-size:9px;letter-spacing:.08em;}
    .top-ex{font-size:10px;}
    .top-asof{font-size:8px;}
    .disp{display:none;}
    .grid.desk{grid-template-columns:minmax(0,1fr);}
    .w-watch{display:none;}
    .mk-ex{font-size:9px;}
  }
  @media (max-width:900px){
    .vw{grid-template-columns:62px minmax(0,1fr) 92px 64px 78px;}
    .vw .c-lvl{display:none;}
    .vs{grid-template-columns:62px minmax(0,1fr) 92px 88px 62px;}
    .vt{grid-template-columns:62px 62px 84px 84px 96px;}
    .vc{grid-template-columns:58px 106px 68px minmax(0,1fr);height:32px;gap:7px;padding:0 8px;}
    .vc .d,.vc .ty{font-size:7.5px;}
    .vc .dt{font-size:9px;}
    .vc .sec b{font-size:9px;}
    .vc .sec span{font-size:7.5px;}
    .vrow{gap:7px;padding:0 8px;height:22px;}
    .vrow.hd{height:19px;}
    .vrow.hd span{font-size:7.5px;letter-spacing:.06em;}
    .nw{grid-template-columns:66px minmax(0,1fr) 112px;gap:7px;padding:4px 8px;}
    .nw-h{font-size:10px;}
    .nw-d,.nw-s{font-size:8px;}
    .fintab th{font-size:6.5px;padding:4px 4px;letter-spacing:.02em;}
    .fintab td{padding:0 4px;font-size:8.5px;}
    .fintab td:first-child{font-size:9px;}
    .fcap{font-size:7.5px;padding:4px 8px;}
    .inf{grid-template-columns:104px minmax(0,1fr);gap:0 9px;padding:6px 8px 2px;}
    .inf .k{font-size:7.5px;} .inf .v{font-size:10px;padding:3px 0;}
    .inftxt{font-size:9.5px;padding:6px 8px;-webkit-line-clamp:3;}
  }
</style>

<body>

<div class="pg" id="pg">

  <div class="top">
    <div class="brand">MUTXRI <b>TERMINAL</b></div>
    <div class="top-ex"><span id="exName">NSE</span><i id="exFull"></i></div>
    <div class="top-asof" id="topAsOf">session as-of not stated</div>
    <div class="disp">DISPLAY ONLY</div>
  </div>

  <div class="tape"><div class="tape-in" id="tapeIn"></div></div>

  <!-- THE DESK: the terminal's START HERE workspace, drawn as a picture.
       WATCHLIST runs down the left, MARKET is the large centre window, FOCUS
       sits above NEWS in the right column. Each window carries the shell's own
       chrome (drag glyph, mono caps title with the mint underline, close glyph)
       and nothing in any of them can be typed into, clicked or focused. -->
  <div class="grid desk" id="gridHero">

    <section class="win w-watch">
      <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">WATCHLIST</span><span class="wmeta" id="wlMeta"></span><span class="wx">X</span></div>
      <div class="wbody" id="wlBody"></div>
    </section>

    <section class="win w-mkt">
      <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">MARKET</span><span class="wmeta" id="mkMetaMark"></span><span class="wx">X</span></div>
      <div class="wbody" id="mkBody"></div>
    </section>

    <div class="rcol">
      <section class="win w-focus">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">FOCUS</span><span class="wmeta" id="fxMeta"></span><span class="wx">X</span></div>
        <div class="wbody" id="fxBody"></div>
      </section>
      <section class="win w-news">
        <div class="whead"><span class="dg">&#10287;</span><span class="wtab on">NEWS</span><span class="wmeta" id="nwMetaMark"></span><span class="wx">X</span></div>
        <div class="wbody" id="nwBody"></div>
      </section>
    </div>

  </div>

  <div class="grid one" id="gridView" hidden>
    <div class="card vcard">
      <div class="card-h"><span class="l" id="vTitle">-</span><span class="r" id="vMeta">-</span></div>
      <div class="vbody" id="vbody"></div>
    </div>
  </div>

  <div class="foot" id="foot">
    <span>Display only: no search, no selection, no controls.</span>
    <span class="sep">|</span>
    <span id="footSrc">terminal/static_data/market_NSE.json</span>
    <span class="sp"></span>
    <span id="footBasis">every figure read from the published snapshot at render time</span>
  </div>

</div>

<script>
(function () {
  "use strict";

  var EXS = {
    NSE: { full: "Nairobi Securities Exchange", cur: "KES", sym: "SCOM", country: "Kenya" },
    JSE: { full: "Johannesburg Stock Exchange", cur: "ZAc", sym: "NPN", country: "South Africa" },
    NGX: { full: "Nigerian Exchange",           cur: "NGN", sym: "GTCO", country: "Nigeria" },
    EGX: { full: "Egyptian Exchange",           cur: "EGP", sym: "HRHO", country: "Egypt" }
  };

  var Q = new URLSearchParams(location.search);
  var EX = String(Q.get("ex") || "NSE").toUpperCase();
  if (!EXS[EX]) EX = "NSE";
  var CFG = EXS[EX];

  var MB = null;      // market_<EX>.json
  var IX = null;      // ex_<EX>_indices.json
  var HIST = null;    // history/<KEY>.json
  var HKEY = "";      // the history key that answered
  var HROW = null;    // the market row the candles belong to

  function $(id){ return document.getElementById(id); }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(v){
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function fmtPx(n){
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(p){
    return (p >= 0 ? "+" : "") + Number(p).toFixed(2) + "%";
  }
  function fmtInt(n){ return Math.round(n).toLocaleString("en-US"); }
  // a published market cap string is printed as published; a numeric one is
  // scaled to the same shape so a column of them scans
  function compact(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "string") return v;
    var n = Number(v);
    if (!isFinite(n)) return null;
    var u = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]];
    for (var i = 0; i < u.length; i++){
      if (n >= u[i][0]) return (n / u[i][0]).toFixed(2) + u[i][1];
    }
    return n.toFixed(2);
  }
  function cls(v){
    if (v === null || v === undefined) return "flat";
    return v > 0 ? "up" : (v < 0 ? "down" : "flat");
  }
  function get(u){
    return fetch(u, { cache: "default" }).then(function(r){
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  // the session date out of either stamp the tree uses
  function asDate(s){
    if (s == null) return null;
    var t = String(s).trim();
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
    if (m) return { iso: m[1] + "-" + m[2] + "-" + m[3], ms: Date.parse(m[1] + "-" + m[2] + "-" + m[3] + "T00:00:00Z") };
    m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(t);
    if (m){
      var iso = m[3] + "-" + m[2] + "-" + m[1];
      return { iso: iso, ms: Date.parse(iso + "T00:00:00Z") };
    }
    return null;
  }

  // ---- the rows ----------------------------------------------------------
  // the board as published, with the session's most traded first so the tape
  // and the table open on names that actually traded
  function allRows(){ return (MB && MB.stocks) ? MB.stocks.slice() : []; }
  function ranked(){
    var rows = allRows();
    rows.sort(function(a, b){
      var va = num(a.volume), vb = num(b.volume);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      return vb - va;
    });
    return rows;
  }
  function priced(){
    return ranked().filter(function(r){ return num(r.price) !== null; });
  }

  // ---- ticker tape -------------------------------------------------------
  function tapeItem(r, dup){
    var p = num(r.price), c = num(r.chgPct);
    return '<span class="tape-i' + (dup ? " dup" : "") + '"' + (dup ? ' aria-hidden="true"' : "") + '>' +
             '<b>' + esc(r.ticker || r.sym || "") + '</b>' +
             '<span class="px">' + fmtPx(p) + '</span>' +
             '<span class="ch ' + cls(c) + '">' + (c === null ? "-" : fmtPct(c)) + '</span>' +
           '</span>';
  }
  function renderTape(){
    var want = window.innerWidth >= 900 ? 16 : 12;
    var list = priced().slice(0, want);
    var el = $("tapeIn");

    // the exchange's own index levels lead the tape, the way the shell does it
    var head = "";
    if (IX && IX.length){
      for (var x = 0; x < IX.length; x++){
        var ix = IX[x] || {};
        var lvl = num(ix.price);
        var chTxt = "-", chCls = "flat";
        if (typeof ix.change === "string" && ix.change.trim()){
          chTxt = ix.change.trim();
          chCls = chTxt.charAt(0) === "-" ? "down" : (chTxt.charAt(0) === "+" ? "up" : "flat");
        } else if (num(ix.change) !== null){
          var cv = num(ix.change), cp = num(ix.changePct);
          chTxt = (cv > 0 ? "+" : "") + fmtPx(cv) + (cp === null ? "" : " (" + fmtPct(cp) + ")");
          chCls = cls(cv);
        } else if (num(ix.changePct) !== null){
          chTxt = fmtPct(num(ix.changePct));
          chCls = cls(num(ix.changePct));
        }
        head += '<span class="tape-i">' +
          '<b>' + esc(ix.name || ix.ticker || "") + '</b>' +
          '<span class="px">' + (lvl === null ? '<span class="nq">withheld</span>' : fmtPx(lvl)) + '</span>' +
          '<span class="ch ' + (lvl === null ? "flat" : chCls) + '">' + (lvl === null ? "-" : esc(chTxt)) + '</span>' +
        '</span>';
      }
    }

    if (!list.length && !head){ el.innerHTML = ""; return; }
    var a = head, b = head;
    for (var i = 0; i < list.length; i++){ a += tapeItem(list[i], false); b += tapeItem(list[i], true); }
    el.innerHTML = a + b;
  }

  // ---- chart -------------------------------------------------------------
  function histKeys(row){
    var tick = String((row && row.ticker) || "").toUpperCase();
    var sym = String((row && row.sym) || "").toUpperCase();
    var bare = sym.split(".")[0];
    var out = [];
    function push(k){
      k = String(k || "").toUpperCase();
      if (k && out.indexOf(k) < 0) out.push(k);
    }
    if (EX === "NSE" || EX === "NGX"){ push(EX + "_" + tick); push(EX + "_" + bare); return out; }
    if (EX === "EGX"){ push(tick + ".CA"); push(sym); push(tick); return out; }
    push(sym);
    push(tick + ".JO");
    push(tick);
    return out;
  }

  // One drawing routine, used twice: by the fixed hero card above (the default
  // composite) and by ?view=chart, which asks for more sessions, fatter bodies
  // and intermediate dates labelled. Every number comes from HIST; nothing is
  // smoothed, filled or invented.
  function drawCandles(opt){
    var wrap = opt.wrap, svg = opt.svg, headEl = opt.head, noteEl = opt.note;
    var W = Math.max(180, wrap.clientWidth), H = Math.max(60, wrap.clientHeight);
    var bars = (HIST && HIST.bars) ? HIST.bars : [];
    var symTxt = HROW ? String(HROW.ticker || HROW.sym || "") : CFG.sym;

    if (!bars.length){
      svg.innerHTML = "";
      headEl.textContent = symTxt + " no history on file";
      noteEl.textContent = "No daily history file answered for " + symTxt + " on " + EX + ", so no price series is drawn.";
      return;
    }

    var winN = opt.winN || (W >= 1100 ? 45 : (W >= 700 ? 40 : 30));
    var win = bars.slice(-winN).filter(function(b){ return b && b.t; });

    var full = [], closesOnly = 0;
    for (var i = 0; i < win.length; i++){
      var b = win[i];
      var o = num(b.o), h = num(b.h), l = num(b.l), c = num(b.c);
      if (c === null) continue;
      if (o === null || h === null || l === null){ closesOnly++; continue; }
      full.push({ t: String(b.t).slice(0, 10), o: o, h: h, l: l, c: c });
    }

    var head = symTxt + " &middot; " + EX + " &middot; " + esc((HIST && HIST.currency) || CFG.cur);
    headEl.innerHTML = head + " &middot; " + (full.length || win.length) + " sessions";

    var note = "";
    if (!full.length){
      svg.innerHTML = "";
      noteEl.innerHTML = '<span class="warn">The history file for ' + esc(symTxt) +
        ' gives only a close for the window, so open, high and low are not available and no candles are drawn.</span>';
      return;
    }

    // the honest note: the window, its first and last date, its range, and how
    // far the last bar sits behind the exchange's own session
    var lo = full[0].l, hi = full[0].h, loDate = full[0].t, hiDate = full[0].t;
    for (var j = 1; j < full.length; j++){
      if (full[j].l < lo) lo = full[j].l;
      if (full[j].h > hi) hi = full[j].h;
    }
    loDate = full[0].t;
    hiDate = full[full.length - 1].t;
    note = "<b>" + full.length + " daily sessions</b> " + esc(loDate) + " to <b>" + esc(hiDate) +
           "</b> &middot; range <b>" + fmtPx(lo) + "</b> to <b>" + fmtPx(hi) + "</b>";
    if (closesOnly) note += " &middot; " + closesOnly + " bars in the window carry only a close and are not drawn";

    var sAsOf = asDate(MB && MB.asOf), sBar = asDate(hiDate);
    if (sAsOf && sBar && isFinite(sAsOf.ms) && isFinite(sBar.ms)){
      var lag = Math.round((sAsOf.ms - sBar.ms) / 86400000);
      if (lag > 1) note += ' &middot; <span class="warn">last bar ' + esc(hiDate) + ', ' + lag +
        ' days before the ' + esc(sAsOf.iso) + ' session</span>';
    }
    noteEl.innerHTML = note;

    // ---- geometry ----
    var padL = 4, padR = 62, padT = 10, padB = 16;
    var plotW = Math.max(40, W - padL - padR), plotH = Math.max(30, H - padT - padB);
    var slot = plotW / full.length;
    var bodyW = Math.max(3, Math.min(opt.bodyCap || 26, slot * (opt.bodyFrac || 0.62)));
    var span = hi - lo;
    var padY = span > 0 ? span * 0.08 : (Math.abs(hi) > 0 ? Math.abs(hi) * 0.02 : 1);
    var yMin = lo - padY, yMax = hi + padY;
    function Y(v){ return padT + (yMax - v) / (yMax - yMin) * plotH; }
    // one number format for the whole axis: a price axis that switches between
    // 1,060 and 999.76 tick by tick reads as two different scales
    var axisInt = Math.max(Math.abs(yMax), Math.abs(yMin)) >= 1000;
    function axisLabel(v){
      return axisInt ? Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }) : fmtPx(v);
    }

    var parts = [];
    // horizontal grid and the price labels on the right; these are the range
    var ticks = 4;
    for (var t = 0; t <= ticks; t++){
      var v = yMax - (yMax - yMin) * (t / ticks);
      var y = Y(v);
      parts.push('<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) +
                 '" y2="' + y.toFixed(1) + '" stroke="#141414" stroke-width="1"/>');
      parts.push('<text x="' + (W - padR + 6) + '" y="' + (y + 3).toFixed(1) +
                 '" fill="#6a6a6a" font-family="Oxygen Mono, monospace" font-size="9">' +
                 axisLabel(v) + '</text>');
    }

    // candles: wick high to low, body open to close, mint up and red down
    for (var k = 0; k < full.length; k++){
      var d = full[k];
      var up = d.c >= d.o;
      var col = up ? "#33e29a" : "#f87171";
      var cx = padL + slot * (k + 0.5);
      var yo = Y(d.o), yc = Y(d.c), yh = Y(d.h), yl = Y(d.l);
      var top = Math.min(yo, yc), bot = Math.max(yo, yc);
      if (bot - top < 1) bot = top + 1;
      parts.push('<line x1="' + cx.toFixed(1) + '" y1="' + yh.toFixed(1) + '" x2="' + cx.toFixed(1) +
                 '" y2="' + yl.toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>');
      parts.push('<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + top.toFixed(1) +
                 '" width="' + bodyW.toFixed(1) + '" height="' + (bot - top).toFixed(1) +
                 '" fill="' + col + '"/>');
    }

    // first and last date shown; the standalone chart also labels two interior
    // dates so the reader can place the middle of the window
    if (opt.dateTicks){
      var marks = [0.25, 0.5, 0.75];
      for (var q = 0; q < marks.length; q++){
        var idx = Math.min(full.length - 1, Math.max(0, Math.round((full.length - 1) * marks[q])));
        var mx = padL + slot * (idx + 0.5);
        parts.push('<text x="' + mx.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" fill="#6a6a6a" ' +
                   'font-family="Oxygen Mono, monospace" font-size="9">' + esc(full[idx].t) + '</text>');
      }
    }
    parts.push('<text x="' + padL + '" y="' + (H - 4) + '" fill="#6a6a6a" font-family="Oxygen Mono, monospace" font-size="9">' +
               esc(loDate) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 4) + '" text-anchor="end" fill="#6a6a6a" ' +
               'font-family="Oxygen Mono, monospace" font-size="9">' + esc(hiDate) + '</text>');

    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.innerHTML = parts.join("");
  }

  // ---- the desk ----------------------------------------------------------
  // Four windows, the START HERE workspace: WATCHLIST left, MARKET centre,
  // FOCUS over NEWS on the right. Every block below is painted from the
  // published files and nothing on the desk responds to a pointer or a key.

  function renderDesk(){
    renderChrome();
    renderTape();
    renderWatch();
    renderMarket();
    renderFocus();
    loadDeskHistory();
    loadDeskNews();
  }

  // drop rows from the bottom of a window until its content fits, so a short
  // frame clips nothing and a tall one wastes no space. The drop count is
  // worked out from the measured row height, not one row per pass, because a
  // board like the JSE can be 300 rows deep.
  function trimToFit(host, sel, keep){
    var nodes = host.querySelectorAll(sel);
    if (!nodes.length) return;
    var over = host.scrollHeight - host.clientHeight;
    if (over <= 1) return;
    var h = nodes[0].getBoundingClientRect().height || 1;
    var drop = Math.ceil(over / h);
    var want = Math.max(keep || 1, nodes.length - drop);
    var guard = 0;
    while (host.querySelectorAll(sel).length > want && guard++ < 4000){
      var cur = host.querySelectorAll(sel);
      host.removeChild(cur[cur.length - 1]);
    }
  }

  function mkSession(){
    var a = (MB && MB.asOf) ? asDate(MB.asOf) : null;
    return (a && a.iso) ? a.iso : "";
  }

  // ---- WATCHLIST window: the board, most traded first ---------------------
  function renderWatch(){
    var host = $("wlBody");
    if (!MB || !MB.stocks){
      host.innerHTML = '<div class="vempty"><b>No snapshot</b>Nothing is published for ' + esc(EX) + '.</div>';
      return;
    }
    var rows = ranked();
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var r = rows[i], p = num(r.price), c = num(r.chgPct);
      var tick = String(r.ticker || r.sym || "");
      var mark = tick ? tick.charAt(0) : "-";
      out.push('<div class="wr">' +
        '<span class="wmono">' + esc(mark) + '</span>' +
        '<span class="wmain"><b>' + esc(tick) + '</b><i>' + esc(r.name || "") + '</i></span>' +
        '<span class="wprice">' +
          '<b>' + (p === null ? '<span class="nq">-</span>' : fmtPx(p)) + '</b>' +
          '<i class="' + cls(c) + '">' + pctCell(c) + '</i>' +
        '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    trimToFit(host, ".wr", 4);
  }

  // ---- MARKET window: breadth, then gainers, losers, most active ----------
  function renderMarket(){
    var host = $("mkBody");
    if (!MB || !MB.stocks){
      host.innerHTML = '<div class="vempty"><b>No snapshot</b>Nothing is published for ' + esc(EX) + '.</div>';
      return;
    }
    var all = allRows();
    var priced = all.filter(function(r){ return num(r.price) !== null; });
    var adv = 0, dec = 0, unc = 0;
    for (var i = 0; i < all.length; i++){
      var c = num(all[i].chgPct);
      if (c === null) continue;
      if (c > 0) adv++; else if (c < 0) dec++; else unc++;
    }
    var ratio = dec ? adv / dec : (adv ? 9 : 1);
    var tone = ratio >= 1.5 ? "RISK-ON" : (ratio <= 0.67 ? "RISK-OFF" : "MIXED");
    var toneCls = ratio >= 1.5 ? "up" : (ratio <= 0.67 ? "down" : "flat");
    var curs = {};
    for (var q = 0; q < all.length; q++){ curs[curOf(all[q])] = 1; }
    var cur = Object.keys(curs).sort()[0] || CFG.cur;
    var session = mkSession();

    function mover(s){
      var ch = num(s.chgPct);
      return '<div class="mrow"><span class="mt">' + esc(String(s.ticker || s.sym || "")) + '</span>' +
        '<span class="mn">' + esc(String(s.name || "").slice(0, 26)) + '</span>' +

    function volumeRow(s){

      return '<div class="mrow"><span class="mt">' + esc(String(s.ticker || s.sym || "")) + '</span>' +
        '<span class="mn">' + esc(String(s.name || "").slice(0, 26)) + '</span>' +
        '<span class="mp">' + (num(s.price) === null ? "-" : fmtPx(num(s.price))) + '</span>' +
        '<span class="mc ' + cls(ch) + '">' + (v === null ? "-" : fmtInt(v)) + '</span></div>';
    }

    var withChg = priced.filter(function(r){ return num(r.chgPct) !== null; });
    var gain = withChg.slice().sort(function(a, b){ return num(b.chgPct) - num(a.chgPct); });
    var lose = withChg.slice().sort(function(a, b){ return num(a.chgPct) - num(b.chgPct); });
    var active = priced.slice().sort(function(a, b){ return (num(b.volume) || 0) - (num(a.volume) || 0); });

    var html = '<div class="mk-top">' +
      '<div class="mk-ex">' + esc(EX) + ' <span>&middot; ' + esc(CFG.full) + '</span></div>' +
      '<div class="mk-sub">' + esc(CFG.country) + ' &middot; ' + priced.length + ' priced &middot; ' +
        esc(cur) + (session ? ' &middot; EOD ' + esc(session) : "") + '</div>' +
      '<div class="mk-br"><span class="up">&#9650; ' + adv + '</span>' +
        '<span class="down">&#9660; ' + dec + '</span>' +
        '<span class="flat">- ' + unc + '</span>' +
        '<span class="tone ' + toneCls + '">' + tone + '</span></div>' +
    '</div><div class="mk-body">';

    html += '<div class="msec">TOP GAINERS</div><div class="sec-gain">' + gain.slice(0, 6).map(mover).join("") + '</div>';
    html += '<div class="msec">TOP LOSERS</div><div class="sec-lose">' + lose.slice(0, 6).map(mover).join("") + '</div>';
    html += '<div class="msec">MOST ACTIVE</div><div class="sec-act">' + active.slice(0, 6).map(volumeRow).join("") + '</div>';
    html += '</div>';

    host.innerHTML = html;
    trimToFit(host, ".sec-act .mrow", 2);
    trimToFit(host, ".sec-lose .mrow", 2);
    trimToFit(host, ".sec-gain .mrow", 2);
    trimToFit(host, ".sec-act .mrow", 1);
    trimToFit(host, ".sec-lose .mrow", 1);
  }

  function drawFocusLine(){
    var box = $("fxLine");
    if (!box) return;
    var svg = box.querySelector("svg");
    var bars = (HIST && HIST.bars) ? HIST.bars.slice(-30) : [];
    var pts = [];
    for (var i = 0; i < bars.length; i++){
      var c = num(bars[i] && bars[i].c);
      if (c !== null) pts.push({ c: c, t: String(bars[i].t).slice(0, 10) });
    }
    if (!pts.length){
      svg.innerHTML = "";
      $("fxRange").textContent = "no price history on file";
      return;
    }
    var W = Math.max(40, box.clientWidth), H = Math.max(20, box.clientHeight);
    var lo = pts[0].c, hi = pts[0].c;
    for (var j = 1; j < pts.length; j++){ if (pts[j].c < lo) lo = pts[j].c; if (pts[j].c > hi) hi = pts[j].c; }
    var span = hi - lo || Math.abs(hi) * 0.01 || 1;
    var pad = 3;
    var d = "";
    for (var k = 0; k < pts.length; k++){
      var x = pad + (W - pad * 2) * (pts.length === 1 ? 0.5 : k / (pts.length - 1));
      var y = pad + (H - pad * 2) * (1 - (pts[k].c - lo) / span);
      d += (k ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    var last = pts[pts.length - 1];
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#33e29a" stroke-width="1.2"/>' +
      '<circle cx="' + (pad + (W - pad * 2)).toFixed(1) + '" cy="' +
      (pad + (H - pad * 2) * (1 - (last.c - lo) / span)).toFixed(1) + '" r="1.6" fill="#33e29a"/>';
    $("fxRange").textContent = pts[0].t + " to " + last.t + " · " + pts.length + " sessions";
  }
  function loadDeskHistory(){
    var r = focusRow();
    if (!r){ drawFocusLine(); return; }

  function loadDeskNews(){

  function paintDeskNews(list){
    var host = $("nwBody");
    if (!list.length){
      host.innerHTML = '<div class="vempty"><b>NEWS</b>No wire file answered for ' + esc(EX) + '.</div>';

      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });
    var out = [];
    for (var i = 0; i < items.length && i < 14; i++){

  // ---- header, foot ------------------------------------------------------

  // ---- history -----------------------------------------------------------
  // One security per exchange, named up front, so the page makes exactly one
  // history request. The key that answers is the key the chart panel would use:
  // EX_<ticker> on the NSE and NGX, <sym> on the JSE, <ticker>.CA on the EGX.
  // If no file answers, the chart says so rather than drawing something else.
  function loadHistoryFor(row){
    if (!row) return Promise.resolve(null);
    var keys = histKeys(row), kc = Promise.resolve(null);
    keys.forEach(function(k){
      kc = kc.then(function(hit){
        if (hit) return hit;
        return get("terminal/static_data/history/" + encodeURIComponent(k) + ".json")
          .then(function(d){
            if (d && d.bars && d.bars.length){ HKEY = k; HROW = row; return d; }
            return null;
          })
          .catch(function(){ return null; });
      });
    });
    return kc.then(function(d){ HIST = d || null; return HIST; });
  }
  function loadHistory(){
    var rows = allRows();
    var pref = String(CFG.sym).toUpperCase();
    var row = null;
    for (var i = 0; i < rows.length; i++){
      if (String(rows[i].ticker || "").toUpperCase() === pref){ row = rows[i]; break; }
    }
    if (!row){
      var p = priced();
      row = p.length ? p[0] : null;
    }
    return loadHistoryFor(row);
  }
  // the standalone chart walks down the volume ranking until one security has a
  // history file, and names whichever one answered. It never draws a series
  // under another security's name.
  function loadHistoryAny(){
    var rows = priced();
    var pref = String(CFG.sym).toUpperCase();
    var order = rows.slice().sort(function(a, b){
      var aw = String(a.ticker || "").toUpperCase() === pref ? 0 : 1;
      var bw = String(b.ticker || "").toUpperCase() === pref ? 0 : 1;
      return aw - bw;
    }).slice(0, 14);
    var i = 0;
    function step(){
      if (i >= order.length) return Promise.resolve(null);
      var row = order[i++];
      return loadHistoryFor(row).then(function(d){ return d ? d : step(); });
    }
    return step();
  }

  // ---- static display views ------------------------------------------------
  // ?view= chooses the single panel drawn under the header. Every view is a
  // picture built from divs, spans, one table and one SVG. There is no input,
  // select, textarea, button or link in any of them, and no element that
  // reports cursor:pointer: nothing here can be typed into, clicked, tabbed to
  // or dragged. Figures come straight out of the published files; anything
  // missing prints the house empty marker and never a zero or an estimate.
  var VIEWS = ["watchlist", "chart", "financials", "screener", "info", "news", "corpactions", "trade"];
  var VIEW = String(Q.get("view") || "").toLowerCase();
  if (VIEWS.indexOf(VIEW) < 0) VIEW = "";

  var CACHE = { fin: null, news: null, ci: null, ca: null };

  function curOf(r){ return String((r && r.currency) || CFG.cur).toUpperCase(); }

  // a level change is printed only when the row's own percent agrees with it,
  // the same guard the default table uses
  function levelOf(r){
    var p = num(r.price), prev = num(r.prevClose), c = num(r.chgPct);
    if (p === null || prev === null || c === null || prev === 0) return null;
    var calc = (p - prev) / prev * 100;
    return Math.abs(calc - c) <= 0.02 ? p - prev : null;
  }
  function pxCell(r){
    var p = num(r.price);
    if (p === null) return '<span class="nq">no quote</span>';
    var cur = curOf(r);
    return fmtPx(p) + (cur !== CFG.cur.toUpperCase() ? '<span class="cur">' + esc(cur) + '</span>' : "");
  }
  function pctCell(c){ return c === null ? "-" : fmtPct(c); }
  function lvlCell(l){
    return '<span class="num c-lvl ' + cls(l) + '">' + (l === null ? "-" : (l > 0 ? "+" : "") + fmtPx(l)) + '</span>';
  }
  function fitRows(host, rowH, reserve){
    var h = host.clientHeight || 240;
    return Math.max(3, Math.floor((h - (reserve || 20)) / rowH));
  }
  function setView(title, meta){
    $("vTitle").textContent = title || "";
    $("vMeta").textContent = meta || "";
  }
  function setFoot(src, basis){
    if (src) $("footSrc").textContent = src;
    if (basis) $("footBasis").textContent = basis;
  }
  function viewError(title, msg){
    $("vMeta").textContent = EX;
    $("vbody").innerHTML = '<div class="vempty"><b>' + esc(title) + '</b>' + esc(msg) + '</div>';
  }
  function renderView(){
    if (VIEW === "chart") return viewChart();
    if (VIEW === "financials") return viewFinancials();
    if (VIEW === "screener") return viewScreener();
    if (VIEW === "info") return viewInfo();
    if (VIEW === "news") return viewNews();
    if (VIEW === "corpactions") return viewCorpActions();
    if (VIEW === "trade") return viewTrade();
    return viewWatchlist();
  }

  function viewChart(){

  // ---- financials: one stored income statement -----------------------------
  // Statement lines only: ratio rows are left out (this is a statement view, not
  // a ratio block) and a grouped line is printed as its stored total, so every
  // figure on screen is one figure from the file, never a sum of my own.
  function finKeys(row){
    var t = String((row && row.ticker) || "").toUpperCase();
    var s = String((row && row.sym) || "").toUpperCase();
    var out = [];
    function push(k){
      k = String(k || "").toUpperCase();
      if (k && out.indexOf(k) < 0) out.push(k);
    }
    push(s); push(t); push(s.split(".")[0]); push(t + ".JO"); push(t + ".CA");
    return out;
  }
  var FIN_RANK = [
    [/^revenue/i, 0], [/^turnover/i, 0], [/^direct costs/i, 1], [/^cost of sales/i, 1],
    [/^cost of revenue/i, 1], [/^gross profit/i, 2], [/^operating expenses/i, 3],
    [/^other operating/i, 4], [/^ebitda/i, 5], [/^operating profit/i, 6],
    [/^net finance/i, 7], [/^finance/i, 7], [/^share of/i, 8], [/^profit before/i, 9],
    [/^income tax/i, 10], [/^tax/i, 10],
    [/^profit for/i, 11], [/^total profit/i, 11], [/^net profit/i, 11], [/^profit/i, 11],
    [/^eps/i, 12], [/earnings per share/i, 12]
  ];
  function finRank(lbl){
    for (var i = 0; i < FIN_RANK.length; i++){ if (FIN_RANK[i][0].test(lbl)) return FIN_RANK[i][1]; }
    return 9.5;   // an unclassified line sits with the pre-tax block
  }
  function statementRows(rows){
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var r = rows[i] || {}, lbl = String(r.label || "").trim();
      if (!lbl) continue;
      if (r.isGroupHeader) continue;                                       // its total carries it
      if (r.group && r.group !== "Ungrouped" && !r.isGroupTotal) continue;  // component lines
      if (lbl === "Ungrouped" || lbl === "Group Total") continue;           // stored placeholders
      if (/\(%\)$/.test(lbl) || /\bmargin\b/i.test(lbl)) continue;          // ratio block
      if (/^roe\b/i.test(lbl) || /^roa\b/i.test(lbl) || /^debt to equity/i.test(lbl)) continue;
      out.push({ label: lbl, values: r.values || [], tot: !!r.isGroupTotal || !!r.isStatementTotal, rank: finRank(lbl) });
    }
    out.sort(function(a, b){ return a.rank - b.rank; });   // stable within a rank
    return out;
  }
  // a statement figure, in the house compact form, negative sign kept
  function fmtFin(v){
    var n = Number(v);
    if (!isFinite(n)) return "-";
    var s = n < 0 ? "-" : "", a = Math.abs(n), o;
    if (a >= 1e12) o = (a / 1e12).toFixed(1) + "T";
    else if (a >= 1e9) o = (a / 1e9).toFixed(1) + "B";
    else if (a >= 1e6) o = (a / 1e6).toFixed(1) + "M";
    else if (a >= 1e3) o = (a / 1e3).toFixed(1) + "K";
    else o = a.toFixed(2);
    return s + o;
  }
  function finCell(v){
    if (v === null || v === undefined || v === "") return '<td class="abs">-</td>';
    var n = Number(v);
    if (!isFinite(n)) return '<td class="abs">-</td>';
    return '<td>' + esc(fmtFin(n)) + '</td>';
  }
  function loadStatement(rows){
    var order = rows.slice(0, 12), i = 0;
    function step(){
      if (i >= order.length) return Promise.resolve(null);
      var row = order[i++];
      var keys = finKeys(row), j = 0;
      function tryKey(){
        if (j >= keys.length) return step();
        var k = keys[j++];
        return get("terminal/static_data/financials/" + encodeURIComponent(k) + "__income.json")
          .then(function(d){
            if (d && (d.rows || []).length && d.available !== false){
              return { row: row, file: k + "__income.json", data: d };
            }
            return tryKey();
          })
          .catch(function(){ return tryKey(); });
      }
      return tryKey();
    }
    return step();
  }
  function drawStatement(hit){
    var d = hit.data, row = hit.row;
    var lines = statementRows(d.rows || []);
    var periods = (d.periods || []).slice();
    var cur = String(d.currency || curOf(row)).toUpperCase();
    if (!lines.length || !periods.length){
      viewError("Statement not on file", "The stored income statement for " + (row.ticker || row.sym) + " holds no line items.");
      return;
    }
    var name = String(row.name || d.name || "").trim();
    var cap = '<div class="fcap"><b>' + esc(name) + (row.ticker ? " &middot; " + esc(row.ticker) : "") +
      " &middot; " + esc(EX) + '</b> &middot; income statement &middot; source terminal/static_data/financials/' +
      esc(hit.file) + " &middot; " + lines.length + " statement lines of " + (d.rows || []).length +
      " stored rows &middot; figures in " + esc(cur) + '</div>';

    var head = '<tr><th>Line item &middot; ' + esc(cur) + '</th>';
    for (var p = 0; p < periods.length; p++){
      head += '<th>' + esc(periods[p]) + '<span>· ' + esc(cur) + '</span></th>';
    }
    head += '</tr>';

    var body = '';
    for (var i = 0; i < lines.length; i++){
      var ln = lines[i];
      body += '<tr' + (ln.tot ? ' class="tot"' : '') + '><td>' + esc(ln.label) + '</td>';
      for (var c = 0; c < periods.length; c++){ body += finCell(ln.values[c]); }
      body += '</tr>';
    }

    var host = $("vbody");
    host.innerHTML = cap + '<div class="finwrap"><table class="fintab"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    // the rows keep every line item: if they do not fit the frame at a legible
    // height the table shrinks to the floor and the caption still names the file
    var tab = host.querySelector(".fintab");
    var avail = (host.clientHeight || 280) - (cap ? 24 : 0) - 30;
    var rowH = Math.floor(avail / (lines.length + 1));
    rowH = Math.max(12, Math.min(19, rowH));
    if (tab) tab.style.setProperty("--frow", rowH + "px");

    setView("Income statement", name + " · " + EX + " · " + hits(d));
    setFoot("terminal/static_data/financials/" + hit.file,
      "as stored in the file" + (d.asOf ? " on " + d.asOf : "") + "; an absent cell prints -, nothing is estimated");
  }
  function hits(d){ return ((d.periods || []).length) + " periods"; }
  function viewFinancials(){
    setView("Income statement", EX + " " + CFG.full);
    if (CACHE.fin) { drawStatement(CACHE.fin); return Promise.resolve(); }
    return loadStatement(ranked()).then(function(hit){
      if (!hit){
        viewError("No statement on file", "No income statement file answered for the most traded names on " + EX + ".");
        setFoot("terminal/static_data/financials/", "no income statement file answered");
        return;
      }
      CACHE.fin = hit;
      drawStatement(hit);
    }).catch(function(){
      viewError("No statement on file", "The stored income statements could not be read for " + EX + ".");
    });
  }

  // ---- info: the descriptive facts on file ---------------------------------
  var INFO_FIELDS = [
    ["Sector", "sector"], ["Currency", "currency"], ["Country", "country"],
    ["Founded", "founded"], ["Listed", "listed"], ["Year end", "year_end"],
    ["Transfer secretary", "transfer_secretary"], ["Indices", "indices"]
  ];
  function ciFor(CI, row){
    if (!CI) return null;
    var t = String(row.ticker || "").toUpperCase();
    var s = String(row.sym || "").toUpperCase();
    var bare = s.split(".")[0];
    var cands = [t, s, bare, t + ".JO", t + ".CA", t + ".ZAc",
      EX + ":" + t.toLowerCase(), EX.toLowerCase() + "-" + t.toLowerCase(),
      EX.toLowerCase() + ":ke-" + t.toLowerCase(), "ke-" + t.toLowerCase(), "ng-" + t.toLowerCase()];
    for (var i = 0; i < cands.length; i++){
      var v = CI[cands[i]];
      if (v && typeof v === "object") return v;
    }
    return null;
  }
  function viewInfo(){
    setView("Company profile", EX + " " + CFG.full);
    var rows = ranked();
    var pref = String(CFG.sym).toUpperCase();
    var order = rows.slice().sort(function(a, b){
      return (String(a.ticker || "").toUpperCase() === pref ? 0 : 1) -
             (String(b.ticker || "").toUpperCase() === pref ? 0 : 1);
    }).slice(0, 30);
    function paint(CI){
      var pick = null, info = null;
      for (var i = 0; i < order.length && !pick; i++){
        var cand = ciFor(CI, order[i]);
        if (cand){ info = cand; pick = order[i]; }
      }
      if (!pick){ pick = order[0] || null; info = null; }
      if (!pick){ viewError("No security", "The market snapshot for " + EX + " holds no rows."); return; }

      var name = String(info && info.name || pick.name || pick.ticker || "");
      var f = [];
      function line(k, v){
        v = (v === null || v === undefined) ? "" : String(v).trim();
        if (!v) return;
        f.push('<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>');
      }
      line("Name", name);
      line("Ticker", pick.ticker || pick.sym);
      line("Exchange", EX + " " + CFG.full);
      for (var q = 0; q < INFO_FIELDS.length; q++){
        var key = INFO_FIELDS[q][1], sub = info ? info[key] : null;
        if (!sub && key === "sector") sub = pick.sector;
        if (!sub && key === "currency") sub = curOf(pick);
        if (!sub && key === "country") sub = pick.country;
        line(INFO_FIELDS[q][0], sub);
      }
      if (info && info.source) line("Entry source", info.source);

      var html = '<div class="inf">' + f.join("") + '</div>';
      if (info && info.description) html += '<div class="inftxt">' + esc(info.description) + '</div>';
      $("vbody").innerHTML = html;
      $("vMeta").textContent = name + (pick.ticker ? " · " + pick.ticker : "") + " · " + EX;
      setFoot("terminal/static_data/company_info.json" + (info ? "" : " (no entry)"),
        info ? "descriptive fields only; anything not on file is left out" : "no company profile entry on file for this security");
    }
    if (CACHE.ci){ paint(CACHE.ci); return Promise.resolve(); }
    return get("terminal/static_data/company_info.json").then(function(CI){
      CACHE.ci = CI || {};
      paint(CACHE.ci);
    }).catch(function(){
      viewError("Profile unavailable", "The company profile file could not be read.");
    });
  }

  // ---- news: dated wire items, headlines as text ---------------------------
  function tsISO(it){
    var t = num(it && it.ts);
    if (t === null || t < 100000000) return "";
    var d = new Date(t * 1000);
    if (isNaN(d.getTime())) return "";
    var y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, dd = d.getUTCDate();
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd;
  }
  function paintNews(list){
    var host = $("vbody"), rowH = 30;
    var items = list.slice();
    items.sort(function(a, b){
      var x = num(a.ts), y = num(b.ts);
      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });
    var n = Math.min(fitRows(host, rowH, 26), items.length);
    var out = [];
    var firstD = "", lastD = "";
    for (var i = 0; i < n; i++){
      var it = items[i] || {};
      var iso = tsISO(it);
      var shown = iso || (it.date ? String(it.date).trim() : "");
      if (!shown) shown = "undated";
      if (!firstD) firstD = shown;
      lastD = shown;
      out.push('<div class="nw">' +
        '<span class="nw-d">' + esc(shown) + '</span>' +
        '<span class="nw-h">' + esc(it.title || "untitled item") + '</span>' +
        '<span class="nw-s">' + esc(it.publisher || "source not stated") + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("") ||
      '<div class="vempty"><b>No wire items</b>No item is published in the file for ' + esc(EX) + '.</div>';
    setView("News", EX + " " + CFG.full);
    $("vMeta").textContent = n + " items · " + firstD + " to " + lastD;
    setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json",
      n + " of " + items.length + " wire items, newest first, dated from the item timestamp");
  }
  function viewNews(){
    setView("News", EX + " " + CFG.full);
    if (CACHE.news){ paintNews(CACHE.news); return Promise.resolve(); }
    return get("terminal/static_data/" + EX.toLowerCase() + "_news.json").then(function(list){
      if (!list || !list.length){
        viewError("No wire file", "No published news file answered for " + EX + ".");
        setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json", "no items on file");
        return;
      }
      CACHE.news = list;
      paintNews(list);
    }).catch(function(){
      viewError("No wire file", "The news file for " + EX + " could not be read.");
      setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json", "no items on file");
    });
  }

  // ---- corporate actions: a dated table, one row per action ----------------
  // Each exchange publishes a different shape, so a row is read field by field:
  // the date as printed, the security, the action type the file states, and the
  // detail in the issuer's own words. A file that carries announcements without
  // an action type prints Announcement; nothing is classified by guesswork, no
  // amount, ratio or date is derived, and an undated row says undated.
  var CA_FILES = {
    NSE: "nse_corporate_actions.json",
    NGX: "ngx_corporate_actions.json",
    JSE: "jse_announcements.json",
    EGX: "egx_announcements.json"
  };
  var CA_KEEP = /corporate action|directors dealing|general meeting|board meeting|disclosure|court order|completion board|announcement|dividend|book closure|bonus|rights|split|capital/i;
  var CA_DROP = /financial statement|statemets|earnings|results/i;

  function caDate(s){
    var raw = String(s == null ? "" : s).trim();
    if (!raw) return { iso: "", ms: null, raw: "" };
    var a = asDate(raw);
    if (a) return { iso: a.iso, ms: a.ms, raw: raw };
    var ms = Date.parse(raw);
    if (!isNaN(ms)){
      var d = new Date(ms);
      var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
      return { iso: y + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd, ms: ms, raw: raw };
    }
    return { iso: "", ms: null, raw: raw };
  }
  function caRows(list){
    var out = [];
    for (var i = 0; i < list.length; i++){
      var it = list[i];
      if (!it || typeof it !== "object") continue;
      var kind = String(it.kind == null ? "" : it.kind).trim();
      if (kind && (!CA_KEEP.test(kind) || CA_DROP.test(kind))) continue;
      var dt = caDate(it.date);
      out.push({
        date: dt.iso || dt.raw,
        ms: dt.ms,
        tick: String(it.ticker == null ? "" : it.ticker).trim(),
        name: String(it.name || it.company || "").trim(),
        type: kind || "Announcement",
        detail: String(it.text || it.title || "").trim()
      });
    }
    out.sort(function(a, b){
      if (a.ms === null && b.ms === null) return 0;
      if (a.ms === null) return 1;
      if (b.ms === null) return -1;
      return b.ms - a.ms;
    });
    return out;
  }
  function paintCorpActions(list, file){
    var host = $("vbody"), rowH = 34;
    var rows = caRows(list);
    if (!rows.length){
      viewError("No corporate actions", "The file for " + EX + " carries no corporate-action row.");
      setFoot("terminal/static_data/" + file, "0 corporate-action rows in the file");
      return;
    }
    var n = Math.min(fitRows(host, rowH, 26), rows.length);
    var out = ['<div class="vrow vc hd"><span>Date</span><span>Security</span>' +
               '<span>Action type</span><span>Detail</span></div>'];
    for (var i = 0; i < n; i++){
      var r = rows[i];
      out.push('<div class="vrow vc">' +
        '<span class="d">' + esc(r.date || "undated") + '</span>' +
        '<span class="sec"><b>' + esc(r.tick || "-") + '</b><span>' + esc(r.name || "") + '</span></span>' +
        '<span class="ty">' + esc(r.type) + '</span>' +
        '<span class="dt">' + (r.detail ? esc(r.detail) : '<span style="color:#6a6a6a">-</span>') + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    var a = rows[0].date || "undated", b2 = rows[n - 1].date || "undated";
    setView("Corporate actions", EX + " " + CFG.full);
    $("vMeta").textContent = n + " actions · " + a + " to " + b2;
    setFoot("terminal/static_data/" + file, n + " of " + rows.length + " corporate-action rows, newest first");
  }
  function viewCorpActions(){
    setView("Corporate actions", EX + " " + CFG.full);
    var file = CA_FILES[EX];
    if (!file){
      viewError("No corporate-actions file", "No corporate-actions file is published for " + EX + ".");
      setFoot("terminal/static_data/", "no corporate-actions file for " + EX);
      return Promise.resolve();
    }
    if (CACHE.ca){ paintCorpActions(CACHE.ca.list, file); return Promise.resolve(); }
    return get("terminal/static_data/" + file).then(function(list){
      if (!list || !list.length){
        viewError("No corporate actions", "The file for " + EX + " holds no rows.");
        setFoot("terminal/static_data/" + file, "no rows on file");
        return;
      }
      CACHE.ca = { list: list };
      paintCorpActions(list, file);
    }).catch(function(){
      viewError("No corporate actions", "terminal/static_data/" + file + " could not be read.");
      setFoot("terminal/static_data/" + file, "no rows on file");
    });
  }

  // ---- trade: a static paper blotter --------------------------------------
  // The paper account lives in the visitor's own browser (the trade panel's
  // mx_paper_v1 key). This page only reads it. If it holds no position for this
  // exchange the blotter says so; no example trade is ever drawn.
  function viewTrade(){
    setView("Paper trading", EX + " paper blotter");
    var host = $("vbody");
    var book = null;
    try{
      var all = JSON.parse(localStorage.getItem("mx_paper_v1") || "{}");
      book = (all && all[EX]) || null;
    }catch(e){ book = null; }
    var pos = (book && book.positions) || {};
    var keys = Object.keys(pos).filter(function(k){
      var q = num(pos[k] && pos[k].qty);
      return q !== null && q !== 0;
    });
    var head = '<div class="vrow vt hd"><span>Ticker</span><span class="num">Quantity</span>' +
               '<span class="num">Entry</span><span class="num">Current</span>' +
               '<span class="num">Unrealised</span></div>';
    if (!keys.length){
      host.innerHTML = head + '<div class="vempty"><b>No open positions</b>' +
        'This paper account is held in this browser (mx_paper_v1) and holds no ' + esc(EX) +
        ' position, so there is nothing to value. Nothing is drawn here that was not traded.</div>';
      setFoot("browser storage mx_paper_v1", "no paper position for " + EX + " in this browser");
      return;
    }
    var idx = {};
    var rows = allRows();
    for (var i = 0; i < rows.length; i++){
      var t = String(rows[i].ticker || "").toUpperCase();
      if (t && !idx[t]) idx[t] = rows[i];
      var s2 = String(rows[i].sym || "").toUpperCase();
      if (s2 && !idx[s2]) idx[s2] = rows[i];
    }
    var out = [head], rowH = 24, shown = 0, total = 0;
    var n = fitRows(host, rowH);
    keys.sort();
    for (var k = 0; k < keys.length; k++){
      var sym = keys[k], p = pos[sym] || {};
      var qty = num(p.qty), entry = num(p.avg);
      var mrow = idx[String(sym).toUpperCase()] || null;
      var now = mrow ? num(mrow.price) : null;
      var un = (qty !== null && entry !== null && now !== null)
        ? (qty > 0 ? (now - entry) * qty : (entry - now) * -qty) : null;
      if (un !== null) total += un;
      if (shown >= n) continue;
      shown++;
      out.push('<div class="vrow vt">' +
        '<span class="tk">' + esc(sym) + '</span>' +
        '<span class="num">' + (qty === null ? "-" : fmtInt(qty)) + '</span>' +
        '<span class="num">' + (entry === null ? "-" : fmtPx(entry)) + '</span>' +
        '<span class="num">' + (now === null ? '<span class="nq">no quote</span>' : fmtPx(now)) + '</span>' +
        '<span class="num ' + cls(un) + '">' + (un === null ? "-" : (un > 0 ? "+" : "") + fmtPx(un)) + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    setFoot("browser storage mx_paper_v1",
      shown + " of " + keys.length + " open positions; current price from terminal/static_data/market_" + EX + ".json");
  }

  // ---- boot --------------------------------------------------------------
  function boot(){
    $("exName").textContent = EX;
    $("exFull").textContent = " " + CFG.full;
    $("topAsOf").textContent = "loading the published snapshot";
    $("mkMetaMark").textContent = "";

    // ?view= swaps the desk for one panel; the header and the tape stay
    var hero = !VIEW;
    if (!hero){
      $("gridHero").hidden = true;
      $("gridView").hidden = false;
    }

    return Promise.all([
      get("terminal/static_data/market_" + EX + ".json").catch(function(){ return null; }),
      get("terminal/static_data/ex_" + EX + "_indices.json").catch(function(){ return null; })
    ])
    .then(function(res){
      MB = res[0]; IX = res[1];
      if (!MB || !MB.stocks){
        $("topAsOf").textContent = "session as-of not stated";
        if (!hero){
          viewError("Snapshot unavailable", "No market snapshot answered for " + EX + ", so there is nothing to draw.");
          return null;
        }
        $("wlBody").innerHTML = '<div class="vempty"><b>No snapshot</b>No market snapshot answered for ' + esc(EX) + '.</div>';
        $("mkBody").innerHTML = '<div class="vempty"><b>No snapshot</b>No market snapshot answered for ' + esc(EX) + '.</div>';
        $("fxBody").innerHTML = '<div class="vempty"><b>No snapshot</b>No market snapshot answered for ' + esc(EX) + '.</div>';
        $("nwBody").innerHTML = '<div class="vempty"><b>No snapshot</b>No market snapshot answered for ' + esc(EX) + '.</div>';
        return null;
      }
      if (!hero) { renderChrome(); renderTape(); return renderView(); }
      renderDesk();
      // one more pass once the webfont settles, so each window trims against
      // its real row height instead of the fallback metrics
      requestAnimationFrame(function(){ renderWatch(); renderMarket(); drawFocusLine(); paintDeskNews(CACHE.news || []); });
      if (document.fonts && document.fonts.ready){
        document.fonts.ready.then(function(){
          renderWatch(); renderMarket(); drawFocusLine();
          if (CACHE.news) paintDeskNews(CACHE.news);
        }).catch(function(){});
      }
      return null;
    }).catch(function(){
      if (VIEW){ viewError("Could not read the snapshot", "Nothing is drawn rather than something guessed."); return; }
      $("mkBody").innerHTML = '<div class="vempty"><b>No snapshot</b>The snapshot could not be read, so nothing is drawn.</div>';
    });
  }

  var rt = null;
  window.addEventListener("resize", function(){
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){
      if (!MB) return;
      renderTape();
      if (VIEW){ renderView(); return; }
      renderWatch();
      renderMarket();
      drawFocusLine();
      if (CACHE.news) paintDeskNews(CACHE.news);
    }, 140);
  });

  boot();
})();
</script>
</body>
</html>
