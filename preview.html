      series.push({ tick: tick, col: CMP_COL[i % 4], key: hit.key, map: cl.map, dates: cl.dates });
    }

    var common = cmpCommon(series);
    var legendParts = [];

    // a security with no history file draws no line, and its own column in the
    // metric table says why, in place of nothing being said at all
    function markMissing(){
      for (var m = 0; m < missing.length; m++){
        var cell = document.getElementById("cmpHd" + missing[m].idx);
        if (cell && !cell.querySelector(".nh")){
          var tag = document.createElement("i");
          tag.className = "nh";
          tag.textContent = "no history";
          cell.appendChild(tag);
        }
      }
    }

    if (!common.length){
      svg.innerHTML = "";
      var why = series.length ? "No session is carried by every plotted series, so no rebased line is drawn."
        : "No history file answered for any of the four, so no line is drawn.";
      plot.innerHTML = '<svg id="cmpSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>' +
        '<div class="no">' + why + '</div>';
      if (cap) cap.innerHTML = esc(why + " Nothing is interpolated and no figure is invented to fill the plot.");
      if (leg){
        for (i = 0; i < missing.length; i++){
          legendParts.push('<span class="li"><i class="sw" style="background:' + missing[i].col +
            ';opacity:.35"></i><b style="color:' + missing[i].col + '">' + esc(missing[i].tick) +
            '</b><em>no history</em></span>');
        }
        leg.innerHTML = legendParts.join("");
      }
      markMissing();
      return CMP_DRAWN;
    }

    var lo = Infinity, hi = -Infinity;
    var n = common.length;
    for (i = 0; i < series.length; i++){
      var s = series[i], base = s.map[common[0]], vals = [];
      for (k = 0; k < common.length; k++){
        var v = s.map[common[k]] / base * 100;
        vals.push(v);
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
      s.vals = vals;
      s.ret = (vals[vals.length - 1] / 100 - 1) * 100;
      CMP_DRAWN.push({ sym: s.tick, key: s.key, pts: vals.length, ret: s.ret });
    }
    if (!isFinite(lo) || !isFinite(hi)) return CMP_DRAWN;

    for (i = 0; i < series.length; i++){
      legendParts.push('<span class="li"><i class="sw" style="background:' + series[i].col +
        '"></i><b style="color:' + series[i].col + '">' + esc(series[i].tick) + '</b>' +
        '<em class="' + cls(series[i].ret) + '">' + fmtRet(series[i].ret) + '</em></span>');
    }
    for (i = 0; i < missing.length; i++){
      legendParts.push('<span class="li"><i class="sw" style="background:' + missing[i].col +
        ';opacity:.35"></i><b style="color:' + missing[i].col + '">' + esc(missing[i].tick) +
        '</b><em>no history</em></span>');
    }
    if (leg) leg.innerHTML = legendParts.join("");
    markMissing();

    if (cap){
      var names = [];
      for (i = 0; i < series.length; i++) names.push(series[i].tick);
      var txt = n + " sessions shared by " + names.join(", ") + ", " + common[0] + " to " + common[n - 1] +
        ". Each series is rebased to 100 at the first session of the window, so a line is percent return, not price." +
        " Currencies differ across markets, but a return is unit free.";
      if (missing.length){
        var mn = [];
        for (i = 0; i < missing.length; i++) mn.push(missing[i].tick);
        txt += " No line is drawn for " + mn.join(", ") +
          ": no history file answered for it, so the window and the returns above are the other " +
          (series.length === 1 ? "series alone" : series.length + " alone") + ".";
      }
      cap.textContent = txt;
    }

    // the metric rows give up their room before the chart does, and the plot
    // is measured and painted only after that, so nothing is ever clipped
    trimToFit(host, ".cmp-tr", 2);

    var W = Math.max(120, plot.clientWidth || 520), H = Math.max(60, plot.clientHeight || 170);
    var pl = 4, pr = 4, pt = 5, pb = 5;
    var plotW = Math.max(20, W - pl - pr), plotH = Math.max(20, H - pt - pb);
    var span = hi - lo, pad = span > 0 ? span * 0.06 : Math.max(1, Math.abs(hi) * 0.02);
    var yMin = lo - pad, yMax = hi + pad;
    function CX(j){ return n > 1 ? pl + plotW * (j / (n - 1)) : pl + plotW / 2; }
    function CY(val){ return pt + (yMax - val) / (yMax - yMin) * plotH; }

    var parts = [];
    // the 100 line: where every series opened the window, so a reader can see
    // at a glance which of the four is above its own starting level
    var y100 = CY(100);
    parts.push('<line x1="' + pl.toFixed(1) + '" y1="' + y100.toFixed(1) + '" x2="' +
      (pl + plotW).toFixed(1) + '" y2="' + y100.toFixed(1) +
      '" stroke="#222" stroke-width="1" stroke-dasharray="2 3"/>');
    var labY = Math.max(8, Math.min(H - 2, y100 - 2));
    parts.push('<text x="' + (pl + 2).toFixed(1) + '" y="' + labY.toFixed(1) +
      '" fill="#4a4a4a" font-family="Oxygen Mono, monospace" font-size="6">100</text>');
    for (i = 0; i < series.length; i++){
      var ser = series[i], pts = [];
      for (k = 0; k < n; k++) pts.push(CX(k).toFixed(1) + "," + CY(ser.vals[k]).toFixed(1));
      parts.push('<polyline fill="none" stroke="' + ser.col + '" stroke-width="1.2" ' +
        'stroke-linejoin="round" stroke-linecap="round" data-sym="' + esc(ser.tick) +
        '" data-pts="' + n + '" data-ret="' + ser.ret.toFixed(2) + '" points="' + pts.join(" ") + '"/>');
    }
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("data-win", common[0] + "|" + common[n - 1] + "|" + n);
    svg.innerHTML = parts.join("");

    return CMP_DRAWN;
  }

  function renderCompare(){
    var host = $("cmpBody");
    var all = priced();
    var four = all.slice(0, 4);
    if (!four.length){
      host.innerHTML = '<div class="vempty"><b>Nothing to compare</b>No priced security is published for ' +
        esc(EX) + ' in terminal/static_data/market_' + esc(EX) +
        '.json, so there is no line to draw.</div>';
      $("cmpMeta").textContent = "";
      return;
    }
    var n = four.length, i;

    // 1. the header: the four named in their series colours
    var head = '<div class="cmp-head">';
    for (i = 0; i < n; i++){
      var r0 = four[i];
      if (i) head += '<span class="vs">vs</span>';
      head += '<span class="hs" style="color:' + CMP_COL[i % 4] + '"><b>' +
        esc(String(r0.ticker || r0.sym || "")) + '</b> ' +
        esc(String(r0.name || "").slice(0, 46)) + '<i>' + esc(EX) + '</i></span>';
    }
    head += '</div>';

    // 2. the metric table: METRIC on the left, one column per security headed
    // by its ticker and its currency. Every cell is a published field of
    // market_<EX>.json; an absent one prints the house marker.
    var hd = '<div class="cmp-hd"><span class="k">METRIC</span>';
    var price = "", chg = "", pct = "", vol = "", turn = "", cap = "", sec = "";
    for (i = 0; i < n; i++){
      var r = four[i];
      var cur = curOf(r);
      var p = num(r.price), lv = levelOf(r), c = num(r.chgPct);
      hd += '<span class="c" id="cmpHd' + i + '"><b style="color:' + CMP_COL[i % 4] + '">' +
        esc(String(r.ticker || r.sym || "")) + '</b><i>' + esc(cur) + '</i></span>';
      price += '<span class="v">' + (p === null ? "-" : fmtPx(p) + '<u>' + esc(cur) + '</u>') + '</span>';
      chg   += '<span class="v ' + cls(lv) + '">' +
        (lv === null ? "-" : (lv > 0 ? "+" : "") + fmtPx(lv) + '<u>' + esc(cur) + '</u>') + '</span>';
      pct   += '<span class="v ' + cls(c) + '">' + pctCell(c) + '</span>';
      vol   += '<span class="v">' + (num(r.volume) === null ? "-" : compact(num(r.volume))) + '</span>';
      turn  += '<span class="v">' + (num(r.turnover) === null ? "-" : compact(num(r.turnover)) + '<u>' + esc(cur) + '</u>') + '</span>';
      cap   += '<span class="v">' + (compact(r.marketCap) === null ? "-" : esc(compact(r.marketCap)) + '<u>' + esc(cur) + '</u>') + '</span>';
      sec   += '<span class="v n">' + esc(String(r.sector || "-").slice(0, 18)) + '</span>';
    }
    hd += '</div>';
    function tr(label, cells){
      return '<div class="cmp-tr"><span class="k">' + label + '</span>' + cells + '</div>';
    }
    var tab = hd + tr("PRICE", price) + tr("CHANGE", chg) + tr("CHANGE %", pct) +
      tr("VOLUME", vol) + tr("TURNOVER", turn) + tr("MKT CAP", cap) + tr("SECTOR", sec);

    host.style.setProperty("--cc", n);
    host.innerHTML = head +
      '<div class="cmp-plot" id="cmpPlot"><svg id="cmpSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg></div>' +
      '<div class="cmp-cap" id="cmpCaption">Reading the published closes for the four.</div>' +
      '<div class="cmp-leg" id="cmpLeg"></div>' +
      '<div class="cmp-tab" id="cmpTab">' + tab + '</div>';

    // 3. if the frame is too short, metric rows go before the chart does
    trimToFit(host, ".cmp-tr", 2);

    // 4. the plot, legend and caption, once the three files have answered.
    // Drawing is a separate step so a failure in it cannot cost the table.
    if (CMP_DONE === cmpSig(four)) tryDraw(drawCompareLines);
    $("cmpMeta").textContent = noDates(n + " of " + all.length + " by volume");
  }

  // ---- MACRO window: the indicators the published files carry -------------
  // One row per indicator the files actually carry for this exchange's country:
  // the policy rate and its instrument from macro_rates.json, the 91-day bill
  // where that file carries one, inflation, GDP growth and the GDP level from
  // macro.json, the exchange rate from fx.json, and the fiscal balance and
  // gross debt from macro_fiscal.json. Each row prints the value, the period
  // the value belongs to and its unit. An indicator a file does not carry is
  // left out, never zeroed and never carried over from another country.
  var MC_FILES = [
    ["rates", "terminal/static_data/macro_rates.json"],
    ["cpi",   "terminal/static_data/macro.json"],
    ["fisc",  "terminal/static_data/macro_fiscal.json"],
    ["fx",    "terminal/static_data/fx.json"]
  ];
  function loadMacro(){
    var jobs = MC_FILES.map(function(f){
      return get(f[1]).then(function(d){ return [f[0], d || null]; })
        .catch(function(){ return [f[0], null]; });
    });
    return Promise.all(jobs).then(function(res){
      var out = {};
      for (var i = 0; i < res.length; i++) out[res[i][0]] = res[i][1];
      MC = out; MC_LOADED = true;
      return MC;
    });
  }
  function mcCountry(list){
    if (!list) return null;
    var arr = list.countries || [];
    for (var i = 0; i < arr.length; i++){
      var c = arr[i] || {};
      if (String(c.exchange || "").toUpperCase() === EX) return c;
      if (String(c.iso2 || "").toUpperCase() === CFG.iso) return c;
    }
    return null;
  }
  function mcNum(v){
    var n = num(v);
    if (n === null) return null;
    if (Math.abs(n) >= 1e9) return compact(n);
    return n.toLocaleString("en-US", { maximumFractionDigits: 3 });
  }
  function mcYear(s){
    var m = /(\d{4})/.exec(String(s == null ? "" : s));
    return m ? m[1] : "";
  }
  function mcFx(){
    if (!MC || !MC.fx) return null;
    var arr = (MC.fx.fx_rates && MC.fx.fx_rates.rates) || MC.fx.rates || [];
    var want = String(CFG.cur).toUpperCase();
    if (want === "ZAC") want = "ZAR";     // the file quotes the rand, not the cent
    for (var i = 0; i < arr.length; i++){
      if (String(arr[i].code || "").toUpperCase() !== want) continue;
      var cur = arr[i].current || {};
      var mk = cur.market || {};
      if (num(mk.value) !== null) return { v: num(mk.value), src: "market" };
      if (cur.official && num(cur.official.value) !== null) return { v: num(cur.official.value), src: "official" };
      return null;
    }
    return null;
  }
  // the official reference rate, where the file carries one, printed beside
  // the market rate so the two are never confused
  function mcFxOfficial(){
    if (!MC || !MC.fx) return null;
    var arr = (MC.fx.fx_rates && MC.fx.fx_rates.rates) || MC.fx.rates || [];
    var want = String(CFG.cur).toUpperCase();
    if (want === "ZAC") want = "ZAR";
    for (var i = 0; i < arr.length; i++){
      if (String(arr[i].code || "").toUpperCase() !== want) continue;
      var off = (arr[i].current || {}).official || {};
      if (num(off.value) === null) return null;
      return { v: num(off.value), series: String(off.series || "official reference"), as: off.as_of };
    }
    return null;
  }
  function renderMacro(){
    var host = $("mcBody");
    if (!MC_LOADED){
      host.innerHTML = '<div class="vempty"><b>Macro</b>Reading the published macro files.</div>';
      $("mcMeta").textContent = "";
      return;
    }
    var R = [];
    function add(label, sub, val, unit, period, c){
      if (val === null || val === undefined || val === "") return;
      R.push({ l: label, s: sub || "", v: String(val), u: unit || "", p: period || "-", c: c || "" });
    }
    // the unit as the file states it, with "per cent" printed as the sign
    function mcUnit(u){
      var s = String(u || "");
      if (!s) return "";
      if (s.toLowerCase().indexOf("per cent") >= 0 || s === "percent" || s === "%") return "%";
      return s;
    }
    var cr = mcCountry(MC.rates);
    if (cr && cr.policy_rate){
      // a central bank that publishes a corridor publishes two rates and no
      // single policy rate, so both ends are printed as the file states them
      var pr = cr.policy_rate;
      var cor = (pr.corridor && pr.rates) ? pr.rates : null;
      var dep = cor ? num(cor.overnight_deposit_rate) : null;
      var lend = cor ? num(cor.overnight_lending_rate) : null;
      if (dep !== null && lend !== null){
        add("POLICY RATE", "overnight deposit / lending", mcNum(dep) + " / " + mcNum(lend),
          mcUnit(pr.unit), mcYear(pr.as_of) || "latest", "");
      } else {
        add("POLICY RATE", String(pr.name || cr.central_bank || ""), mcNum(pr.value), mcUnit(pr.unit),
          mcYear(pr.as_of) || "latest", "");
      }
    }
    if (cr && cr.facilities){
      var fac = cr.facilities;
      var fkeys = ["discount_window", "repo", "cash_reserve_requirement"];
      var flabel = { discount_window: "DISCOUNT WINDOW", repo: "REPO RATE", cash_reserve_requirement: "CASH RESERVE" };
      for (var fi = 0; fi < fkeys.length; fi++){
        var f = fac[fkeys[fi]];
        if (!f || num(f.value) === null) continue;
        add(flabel[fkeys[fi]], String(f.name || ""), mcNum(f.value), mcUnit(f.unit),
          mcYear(f.as_of) || "-", "");
      }
    }
    if (cr && cr.market_rates && cr.market_rates.t_bill_91d){
      var tb = cr.market_rates.t_bill_91d;
      add("91-DAY BILL", String(tb.name || "Treasury bill"), mcNum(tb.value), mcUnit(tb.unit),
        mcYear(tb.as_of) || "latest", "");
    }
    var cc = mcCountry(MC.cpi);
    if (cc){
      add("INFLATION", "consumer prices, annual", mcNum(cc.inflation), "%",
        cc.inflation_year ? String(cc.inflation_year) : "-", "");
      if (num(cc.inflation_prior) !== null){
        add("INFLATION, PRIOR", "the year before", mcNum(cc.inflation_prior), "%",
          cc.inflation_prior_year ? String(cc.inflation_prior_year) : "-", "");
      }
    }
    var gg = (MC.cpi && MC.cpi.gdp) ? mcCountry(MC.cpi.gdp) : null;
    if (gg){
      add("GDP GROWTH", "real, annual", mcNum(gg.gdp_growth), "%",
        gg.gdp_growth_year ? String(gg.gdp_growth_year) : "-", cls(num(gg.gdp_growth)));
      add("GDP", "current prices", mcNum(gg.gdp), "USD",
        gg.gdp_year ? String(gg.gdp_year) : "-", "");
      if (num(gg.gdp_per_capita) !== null){
        add("GDP PER CAPITA", "current prices", mcNum(gg.gdp_per_capita), "USD",
          gg.gdp_per_capita_year ? String(gg.gdp_per_capita_year) : "-", "");
      }
    }
    var fx = mcFx();
    if (fx) add("EXCHANGE RATE", "USD in " + CFG.cur + ", " + fx.src, mcNum(fx.v), "per USD", "latest", "");
    var fxo = mcFxOfficial();
    if (fxo) add("FX, OFFICIAL", fxo.series, mcNum(fxo.v), "per USD", mcYear(fxo.as) || "-", "");
    var cf = mcCountry(MC.fisc);
    if (cf){
      var fb = cf.fiscal_balance;
      if (fb && num(fb.value) !== null){
        add("FISCAL BALANCE", fb.coverage || "general government", mcNum(fb.value),
          mcUnit(fb.unit), fb.year ? String(fb.year) : (mcYear(fb.period) || "-"), cls(num(fb.value)));
      }
      var pb = cf.primary_balance;
      if (pb && num(pb.value) !== null){
        add("PRIMARY BALANCE", "general government", mcNum(pb.value), mcUnit(pb.unit),
          pb.year ? String(pb.year) : "-", cls(num(pb.value)));
      }
      var rv = cf.revenue_pct_gdp;
      if (rv && num(rv.value) !== null){
        add("REVENUE", "general government", mcNum(rv.value), mcUnit(rv.unit),
          rv.year ? String(rv.year) : "-", "");
      }
      var ex2 = cf.expenditure_pct_gdp;
      if (ex2 && num(ex2.value) !== null){
        add("EXPENDITURE", "general government", mcNum(ex2.value), mcUnit(ex2.unit),
          ex2.year ? String(ex2.year) : "-", "");
      }
      var ip = cf.interest_paid_pct_gdp;
      if (ip && num(ip.value) !== null){
        add("INTEREST PAID", "on public debt", mcNum(ip.value), mcUnit(ip.unit),
          ip.year ? String(ip.year) : "-", "");
      }
      var dr = cf.debt_ratio;
      if (dr && num(dr.value) !== null){
        add("GROSS DEBT", "general government, gross", mcNum(dr.value), mcUnit(dr.unit),
          dr.year ? String(dr.year) : "-", "");
      }
      var nd = cf.net_debt_ratio;
      if (nd && num(nd.value) !== null){
        add("NET DEBT", "general government, net", mcNum(nd.value), mcUnit(nd.unit),
          nd.year ? String(nd.year) : "-", "");
      }
      var cd = cf.central_government_debt_ratio;
      if (cd && num(cd.value) !== null){
        add("CENTRAL GOV DEBT", "central government, gross", mcNum(cd.value), mcUnit(cd.unit),
          cd.year ? String(cd.year) : "-", "");
      }
      var dl = cf.debt_local_currency;
      if (dl && dl.latest && num(dl.latest.value) !== null){
        add("DEBT STOCK", "public debt in " + String(dl.currency || CFG.cur),
          compact(num(dl.latest.value)), String(dl.currency || CFG.cur),
          String(dl.latest.fiscal_year || mcYear(dl.latest.year) || "-"), "");
      }
      var fn = cf.fiscal_balance_national;
      if (fn && num(fn.value) !== null){
        add("DEFICIT, CASH BASIS", String(fn.measure || "central government"),
          mcNum(fn.value), mcUnit(fn.unit), String(fn.period || "-"), cls(num(fn.value)));
      }
    }
    // the last few published meetings, so the window shows where the rate has
    // been rather than only where it is
    if (cr && cr.decisions && cr.decisions.length){
      var dc = cr.decisions.slice(-4).reverse();
      for (var di = 0; di < dc.length; di++){
        var d2 = dc[di] || {};
        if (num(d2.rate_after) === null) continue;
        add("MPC DECISION", String(d2.meeting_date || ""), mcNum(d2.rate_after), "%", "", "");
      }
    }
    if (!R.length){
      host.innerHTML = '<div class="vempty"><b>No macro rows</b>terminal/static_data/macro_rates.json, ' +
        'macro.json, macro_fiscal.json and fx.json carry no indicator for ' + esc(CFG.country) +
        ', so no row is drawn and nothing is filled in.</div>';
      $("mcMeta").textContent = "";
      return;
    }
    var src = [];
    if (MC.rates) src.push("macro_rates.json");
    if (MC.cpi) src.push("macro.json");
    if (MC.fisc) src.push("macro_fiscal.json");
    if (MC.fx) src.push("fx.json");
    var html = R.map(function(r){
      return '<div class="mc-r"><span class="k">' + esc(r.l) +
        (r.s ? '<i>' + esc(r.s) + '</i>' : '') + '</span>' +
        '<span class="v ' + r.c + '">' + esc(r.v) + (r.u ? '<em>' + esc(r.u) + '</em>' : '') + '</span>' +
        '<span class="p">' + esc(r.p) + '</span></div>';
    }).join("");
    host.innerHTML = '<div class="mc-body">' + html + '</div>' +
      '<div class="tile-cap"><span>' + src.map(esc).join(" &middot; ") + '</span></div>';
    var body = host.querySelector(".mc-body");
    if (body) trimToFit(body, ".mc-r", 6);
    $("mcMeta").textContent = noDates(host.querySelectorAll(".mc-r").length + " indicators");
  }

  // ---- HEATMAP window: a static treemap of the exchange -------------------
  // Tile area is the published market cap from market_<EX>.json, joined to
  // heatmap_<EX>.json by ticker or code; tile colour is the change percent the
  // heatmap file carries. Blocks only: no hover state, no cursor change, no
  // click, no scroll. A name the board publishes no market cap for is not
  // tiled, and the caption says how many of the file's names were tiled.
  function loadHeatmap(){
    return get("terminal/static_data/heatmap_" + EX + ".json")
      .then(function(d){ HM = d || null; HM_LOADED = true; return HM; })
      .catch(function(){ HM = null; HM_LOADED = true; return null; });
  }
  // a market cap is published as a number on one exchange and as a written
  // size ("1.36B", "17.47M") on the others; the tile size reads either, and the
  // figure printed on screen is always the published one, never this scale
  function capNum(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).replace(/[,\s]/g, "").replace(/[^0-9.KMBTkmbt]/g, "");
    var m = /^([0-9]*\.?[0-9]+)([KMBTkmbt])?$/.exec(s);
    if (!m) return null;
    var n = parseFloat(m[1]);
    if (!isFinite(n)) return null;
    var mult = { k: 1e3, m: 1e6, b: 1e9, t: 1e12 }[String(m[2] || "").toLowerCase()] || 1;
    return n * mult;
  }
  function capIndex(){
    var idx = {}, rows = allRows();
    for (var i = 0; i < rows.length; i++){
      var r = rows[i], c = capNum(r.marketCap);
      if (c === null) continue;
      var t = String(r.ticker || "").toUpperCase();
      var s = String(r.sym || "").toUpperCase();
      var bare = s ? s.split(".")[0] : "";
      if (t) idx[t] = c;
      if (s) idx[s] = c;
      if (bare && idx[bare] === undefined) idx[bare] = c;
    }
    return idx;
  }
  function hmShade(c){
    if (c === null) return "background:#161616";
    var a = Math.min(Math.abs(c), 5) / 5;
    var al = (0.12 + a * 0.34).toFixed(3);
    if (c > 0) return "background:rgba(51,226,154," + al + ")";
    if (c < 0) return "background:rgba(248,113,113," + al + ")";
    return "background:#151515";
  }
  function worstRatio(row, area, side){
    if (!(area > 0) || !(side > 0)) return Infinity;
    var thick = area / side, worst = 1;
    for (var i = 0; i < row.length; i++){
      var len = row[i].a / thick;
      if (!(len > 0)) return Infinity;
      var r = Math.max(thick / len, len / thick);
      if (r > worst) worst = r;
    }
    return worst;
  }
  // classic squarified treemap: rows are laid along the short side while that
  // improves the worst aspect ratio. Edges are rounded once so neighbouring
  // tiles share a boundary and the plot is covered with no gap.
  function squarify(items, W, H){
    var out = [], total = 0, i;
    for (i = 0; i < items.length; i++) total += items[i].cap;
    if (!(total > 0) || W <= 8 || H <= 8) return out;
    var scale = (W * H) / total;
    var queue = items.map(function(d){ return { d: d, a: d.cap * scale }; });
    var x = 0, y = 0, w = W, h = H, guard = 0;
    while (queue.length && guard++ < 400){
      var col = w >= h;                     // a strip off the long side
      var side = col ? h : w;
      var row = [queue.shift()], area = row[0].a;
      var worst = worstRatio(row, area, side);
      while (queue.length){
        var a2 = area + queue[0].a;
        var wr = worstRatio(row.concat([queue[0]]), a2, side);
        if (wr > worst) break;
        row.push(queue.shift()); area = a2; worst = wr;
      }
      var thick = area / side;
      var edge = col ? y : x;
      var edgePx = Math.round(edge);
      for (i = 0; i < row.length; i++){
        var len = side * (row[i].a / area);
        var nextPx = Math.round(edge + len);
        if (col){
          out.push({ d: row[i].d, x: Math.round(x), y: edgePx,
                     w: Math.round(x + thick) - Math.round(x), h: nextPx - edgePx });
        } else {
          out.push({ d: row[i].d, x: edgePx, y: Math.round(y),
                     w: nextPx - edgePx, h: Math.round(y + thick) - Math.round(y) });
        }
        edge += len;
        edgePx = nextPx;
      }
      if (col){ x += thick; w -= thick; } else { y += thick; h -= thick; }
      if (w <= 1 || h <= 1) break;
    }
    return out;
  }
  function renderHeatmap(){
    var host = $("hmBody");
    if (!HM_LOADED){
      host.innerHTML = '<div class="vempty"><b>Heatmap</b>Reading terminal/static_data/heatmap_' +
        esc(EX) + '.json.</div>';
      $("hmMeta").textContent = "";
      return;
    }
    if (!HM || !HM.stocks || !HM.stocks.length){
      host.innerHTML = '<div class="vempty"><b>No heatmap file</b>terminal/static_data/heatmap_' + esc(EX) +
        '.json did not answer for ' + esc(EX) + ', so no tile is drawn and nothing is filled in ' +
        'from a neighbouring name.</div>';
      $("hmMeta").textContent = "";
      return;
    }
    var caps = capIndex(), list = [], i;
    for (i = 0; i < HM.stocks.length; i++){
      var s = HM.stocks[i] || {};
      var keys = [String(s.sym || "").toUpperCase(), String(s.code || "").toUpperCase(),
                  String(s.short || "").toUpperCase()];
      var cap = null;
      for (var k = 0; k < keys.length && cap === null; k++){
        if (keys[k] && caps[keys[k]] !== undefined) cap = caps[keys[k]];
      }
      if (cap === null) continue;
      list.push({ tick: String(s.short || s.code || s.sym || ""), cap: cap, chg: num(s.chgPct) });
    }
    if (!list.length){
      host.innerHTML = '<div class="vempty"><b>No market cap</b>heatmap_' + esc(EX) + '.json and market_' +
        esc(EX) + '.json share no name with a published market cap, so no tile can be sized and ' +
        'none is drawn.</div>';
      $("hmMeta").textContent = "";
      return;
    }
    list.sort(function(a, b){ return b.cap - a.cap; });
    host.innerHTML = '<div class="hm-plot" id="hmPlot"></div><div class="tile-cap" id="hmCap"></div>';
    var plot = $("hmPlot");
    var W = plot.clientWidth, H = plot.clientHeight;
    if (W < 40 || H < 30) return;
    var want = Math.max(12, Math.min(60, Math.floor((W * H) / 2400)));
    var take = list.slice(0, want);
    var boxes = squarify(take, W, H), out = [];
    for (i = 0; i < boxes.length; i++){
      var box = boxes[i], t = box.d;
      // keep every tile inside the plot: rounding at the last strip can push a
      // tile a pixel or two past the edge, and a clipped tile reads as a bug
      box.x = Math.max(0, box.x);
      box.y = Math.max(0, box.y);
      box.w = Math.min(box.w, W - box.x);
      box.h = Math.min(box.h, H - box.y);
      if (box.w < 2 || box.h < 2) continue;
      var lbl = (box.w >= 26 && box.h >= 12) ? '<b>' + esc(t.tick.slice(0, 6)) + '</b>' : "";
      var sub = (box.w >= 34 && box.h >= 26 && t.chg !== null)
        ? '<i>' + (t.chg > 0 ? "+" : "") + t.chg.toFixed(1) + '%</i>' : "";
      out.push('<span class="hm-t" style="left:' + box.x + 'px;top:' + box.y + 'px;width:' +
        box.w + 'px;height:' + box.h + 'px;' + hmShade(t.chg) + '">' + lbl + sub + '</span>');
    }
    plot.innerHTML = out.join("");
    $("hmCap").innerHTML = '<span><b>' + take.length + '</b> largest of ' + list.length +
      ' names with a published market cap</span><span>size by cap, colour by change</span>';
    $("hmMeta").textContent = noDates(take.length + " of " + HM.stocks.length + " names");
  }

  // ---- CHART window: one security, searched, drawn by the product's renderer -
  // The one control on this page lives in this window's band: a search field
  // that takes a ticker or part of a company name. What is typed is resolved
  // against the same board the MARKET window reads, ticker first and then the
  // company name, case insensitively, and the first match is drawn. Typing
  // alone is enough to change the chart; Enter confirms what is already there.
  // A query that matches nothing leaves the security already drawn in place and
  // says so on one line at the foot of the window, so the chart never carries
  // one security's candles under another security's name.
  //
  // The renderer is the terminal's own: TradingView Lightweight Charts 5.0.4
  // from the same CDN build features/panels/mx_chart.html loads, configured with
  // that panel's own options (transparent pane, #9a9a9a 10px mono labels,
  // rgba(38,38,38,.5) grid, #262626 axis borders, barSpacing 9, right offset 1,
  // magnet crosshair, mint and red candles, a dashed mint line and badge at the
  // last price, a volume pane below the price). The candles, the grid, the price
  // scale on the right, the time scale along the foot and the last price marker
  // are therefore the product's own drawing, not a second implementation of it.
  //
  // The band mirrors the panel's own bar (title with the exchange, the search
  // field, the symbol and the quote strip); the toolbar, the tool rail and the
  // range row are buttons, and this page carries no button but the search field,
  // so they are the one part of that panel the landing page does not show. The
  // range is the same table the panel uses, set to 3M so a 460px window carries
  // the candle density the terminal's own 6M window carries at full width; the
  // foot line is the panel's legend line with the last bar's OHLC on it.
  var CHT = { row: null, key: "", bars: null, cur: "", q: "", miss: "", seq: 0,
              pending: false, chart: null, series: null, vol: null };
  var CHT_CACHE = {};   // ticker -> { key, bars, cur } or null
  var CHT_REQ = {};     // ticker -> promise, so a fast typist asks once
  var RANGE_BARS = {"1D":5, "5D":5, "1W":5, "1M":21, "3M":63, "6M":126, "1Y":252, "5Y":1260, "10Y":2600};
  var CHT_RANGE = "3M";

  function chtTick(row){
    return String((row && (row.ticker || row.sym)) || "").toUpperCase();
  }
  function chtName(row){ return String((row && row.name) || ""); }

  // first match wins, in this order: the whole ticker, a ticker starting with
  // the query, a ticker carrying it, a name starting with it, a name carrying it
  function chtFind(q){
    var s = String(q || "").trim().toLowerCase();
    if (!s) return null;
    var rows = allRows(), i, t, n;
    for (i = 0; i < rows.length; i++) if (chtTick(rows[i]).toLowerCase() === s) return rows[i];
    for (i = 0; i < rows.length; i++){ t = chtTick(rows[i]).toLowerCase(); if (t && t.indexOf(s) === 0) return rows[i]; }
    for (i = 0; i < rows.length; i++){ t = chtTick(rows[i]).toLowerCase(); if (t && t.indexOf(s) > 0) return rows[i]; }
    for (i = 0; i < rows.length; i++){ n = chtName(rows[i]).toLowerCase(); if (n && n.indexOf(s) === 0) return rows[i]; }
    for (i = 0; i < rows.length; i++){ n = chtName(rows[i]).toLowerCase(); if (n && n.indexOf(s) > 0) return rows[i]; }
    return null;
  }

  // the same key order the panel uses: EX_<ticker> on the NSE and NGX, <sym> on
  // the JSE, <ticker>.CA on the EGX, first file to answer wins
  function chtHistory(row){
    var tick = chtTick(row);
    if (!tick) return Promise.resolve(null);
    if (Object.prototype.hasOwnProperty.call(CHT_CACHE, tick)) return Promise.resolve(CHT_CACHE[tick]);
    if (CHT_REQ[tick]) return CHT_REQ[tick];
    var keys = histKeys(row), chain = Promise.resolve(null);
    keys.forEach(function(k){
      chain = chain.then(function(hit){
        if (hit) return hit;
        return get("terminal/static_data/history/" + encodeURIComponent(k) + ".json")
          .then(function(d){
            if (!d || !d.bars || !d.bars.length) return null;
            return { key: k, bars: d.bars, cur: d.currency || "" };
          })
          .catch(function(){ return null; });
      });
    });
    CHT_REQ[tick] = chain.then(function(hit){
      CHT_CACHE[tick] = hit;
      delete CHT_REQ[tick];
      return hit;
    });
    return CHT_REQ[tick];
  }

  function chtSetBars(hit){
    CHT.bars = hit ? hit.bars : null;
    CHT.key = hit ? hit.key : "";
    CHT.cur = hit ? String(hit.cur || "") : "";
  }
  function chtSelect(row){
    if (!row) return;
    var tick = chtTick(row);
    var known = Object.prototype.hasOwnProperty.call(CHT_CACHE, tick);
    CHT.row = row;
    CHT.seq++;
    var seq = CHT.seq;
    if (known) chtSetBars(CHT_CACHE[tick]);
    else { CHT.bars = null; CHT.key = ""; CHT.cur = ""; }
    CHT.pending = !known;
    chtPaint();
    if (known) return;
    chtHistory(row).then(function(hit){
      if (seq !== CHT.seq) return;    // a later query owns the window now
      CHT.pending = false;
      chtSetBars(hit);
      tryDraw(chtPaint);
    }).catch(function(err){
      // A rejected history read used to leave CHT.pending true for the life of
      // the page: the panel sat on "Reading the published bars" and drew
      // nothing, and because tryDraw returns false without reporting, no
      // error was visible anywhere. Clear the flag and say so on the panel.
      if (seq !== CHT.seq) return;
      CHT.pending = false;
      CHT.miss = "history read failed";
      try { console.error("CHT history failed", err && (err.stack || err.message || err)); } catch(_){}
      tryDraw(chtPaint);
    });
  }

  // one field, no button: every keystroke is resolved, and Enter re-runs it
  function chtQuery(v){
    var q = String(v == null ? "" : v).trim();
    CHT.q = q;
    if (!q){ CHT.miss = ""; chtPaint(); return; }
    var row = chtFind(q);
    if (!row){
      var shown = chtTick(CHT.row) || "-";
      CHT.miss = 'no match "' + (q.length > 16 ? q.slice(0, 16) : q) + '" - still ' + shown;
      chtPaint();
      return;
    }
    CHT.miss = "";
    if (row === CHT.row){ chtPaint(); return; }
    chtSelect(row);
  }

  function chtBind(){
    var el = $("chtQ");
    if (!el || el.getAttribute("data-bound") === "1") return;
    el.setAttribute("data-bound", "1");
    el.addEventListener("input", function(){ chtQuery(el.value); });
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); chtQuery(el.value); }
    });
  }

  function chtBoot(){
    chtBind();
    if (CHT.row) return;
    var r = focusRow();
    if (r) chtSelect(r);
    else chtPaint();
  }

  // ---- the chart box: the product's renderer, its own options --------------
  function chtDestroy(){
    if (CHT.chart){ try{ CHT.chart.remove(); }catch(e){} }
    CHT.chart = null; CHT.series = null; CHT.vol = null;
    var box = $("chtChart");
    if (box) box.innerHTML = "";
  }

  function chtQuote(row){
    var el = $("chtQuote");
    if (!el) return;
    if (!row){ el.innerHTML = ""; return; }
    var px = num(row.price), pct = num(row.chgPct);
    var dir = pct == null ? "flat" : (pct > 0 ? "up" : (pct < 0 ? "down" : "flat"));
    el.innerHTML =
      '<span class="q"><span class="k">last</span><span class="v big ' + dir + '">' +
        (px === null ? "no quote" : fmtPx(px)) + '</span></span>' +
      '<span class="q"><span class="k">chg %</span><span class="v ' + dir + '">' +
        (pct === null ? "-" : fmtPct(pct)) + '</span></span>';
  }

  function chtPaint(){
    var symEl = $("chtSym"), nmEl = $("chtNm"), legEl = $("chtLegend"), msgEl = $("chtMsg");
    var box = $("chtChart");
    if (!box) return;

    var row = CHT.row;
    if ($("chtEx")) $("chtEx").textContent = EX;
    if (symEl) symEl.textContent = row ? chtTick(row) : "no security";
    if (nmEl) nmEl.textContent = row ? chtName(row) : "";
    if (msgEl) msgEl.textContent = CHT.miss || "";
    chtQuote(row);

    // only a bar carrying all four prices can be drawn as a candle
    var bars = (CHT.bars || []), full = [], closesOnly = 0, i, b, o, h, l, c;
    for (i = 0; i < bars.length; i++){
      b = bars[i] || {};
      o = num(b.o); h = num(b.h); l = num(b.l); c = num(b.c);
      if (c === null) continue;
      if (o === null || h === null || l === null){ closesOnly++; continue; }
      full.push({ t: String(b.t || "").slice(0, 10), o: o, h: h, l: l, c: c, v: num(b.v) });
    }

    var n = Math.min(full.length, RANGE_BARS[CHT_RANGE] || 126);
    var last = full.length ? full[full.length - 1] : null;
    if (legEl){
      if (!last){ legEl.textContent = "-"; }
      else {
        var prev = full.length > 1 ? full[full.length - 2] : null;
        var chg = (prev && prev.c) ? (last.c - prev.c) / prev.c * 100 : null;
        legEl.innerHTML = 'bars <b>' + n + '</b>/<b>' + full.length + '</b> &middot; O <b>' +
          fmtPx(last.o) + '</b> H <b>' + fmtPx(last.h) + '</b> L <b>' + fmtPx(last.l) +
          '</b> C <b>' + fmtPx(last.c) + '</b> ' +
          (chg === null ? '<span class="flat">-</span>'
                        : '<span class="' + cls(chg) + '">' + fmtPct(chg) + '</span>');
      }
    }

    if (!row){
      chtDestroy();
      box.innerHTML = '<div class="cht-none"><div class="np">No security selected</div></div>';
      return;
    }
    if (!full.length){
      chtDestroy();
      box.innerHTML = '<div class="cht-none"><div class="np">' +
        (CHT.pending ? "Reading the published bars" : (closesOnly ? "No candles" : "No price history")) +
        '</div><div>' + esc(CHT.pending
          ? "The bars for " + chtTick(row) + " are being read."
          : (closesOnly
              ? "The history file carries only a close for this window, so no candle is drawn."
              : "No daily history file answered for " + chtTick(row) + " on " + EX + ".")) +
        '</div></div>';
      return;
    }

    var W = Math.round(box.clientWidth), H = Math.round(box.clientHeight);
    if (!W || !H) return;
    chtRender(box, full, W, H);
  }

  function chtRender(box, full, W, H){
    chtDestroy();
    if (typeof LightweightCharts === "undefined"){
      box.innerHTML = '<div class="cht-none"><div class="np">Chart engine unavailable</div>' +
        '<div>The chart library did not load, so no candles are drawn.</div></div>';
      return;
    }
    var MINT = "#33e29a", RED = "#f87171";
    var win = full.slice(-(RANGE_BARS[CHT_RANGE] || 126));
    if (!win.length) return;
    try{
      CHT.chart = LightweightCharts.createChart(box, {
        layout:{background:{color:"transparent"},textColor:"#9a9a9a",fontFamily:"Oxygen Mono, monospace",fontSize:10,attributionLogo:false},
        grid:{vertLines:{color:"rgba(38,38,38,.5)"},horzLines:{color:"rgba(38,38,38,.5)"}},
        rightPriceScale:{borderColor:"#262626"},
        timeScale:{borderColor:"#262626",timeVisible:false,rightOffset:1,barSpacing:9,minBarSpacing:0.001},
        crosshair:{mode:1},
        handleScroll:false,
        handleScale:false,
        localization:{priceFormatter:function(p){ return p >= 1000 ? p.toLocaleString(undefined,{maximumFractionDigits:0}) : p.toFixed(2); }},
        width:W, height:H
      });
    }catch(e){
      box.innerHTML = '<div class="cht-none"><div class="np">Chart engine unavailable</div></div>';
      return;
    }
    try{
      // The window is laid out by a CSS grid, so the container can still be
      // zero sized when createChart runs. A chart created against a 0x0 box
      // draws nothing and stays blank for the life of the page. Measure after
      // layout, retry once, and keep watching the box.
      (function(){
        function fit(){
          try{
            var r = box.getBoundingClientRect();
            if (r.width > 8 && r.height > 8){ CHT.chart.resize(Math.round(r.width), Math.round(r.height)); return true; }
          }catch(e){}
          return false;
        }
        if (!fit()){ setTimeout(fit, 250); setTimeout(fit, 900); setTimeout(fit, 2000); }
        try {
          if (typeof ResizeObserver !== "undefined"){
            var ro = new ResizeObserver(function(){ fit(); });
            ro.observe(box);
          } else { window.addEventListener("resize", fit); }
        } catch(e){}
      })();
      CHT.series = CHT.chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor:MINT, downColor:RED, borderUpColor:MINT, borderDownColor:RED,
        wickUpColor:MINT, wickDownColor:RED,
        priceLineVisible:true, priceLineColor:MINT, priceLineWidth:1, priceLineStyle:2
      });
      CHT.series.setData(win.map(function(b){
        return { time:b.t, open:b.o, high:b.h, low:b.l, close:b.c };
      }));

      // the volume pane the terminal shows by default, from the bars' own v
      var hasVol = false;
      for (var i = 0; i < win.length; i++){ if (win[i].v !== null && win[i].v > 0){ hasVol = true; break; } }
      if (hasVol){
        CHT.vol = CHT.chart.addSeries(LightweightCharts.HistogramSeries, { priceFormat:{type:"volume"} }, 1);
        CHT.vol.setData(win.map(function(b){
          return { time:b.t, value:b.v,
                   color:(b.c >= b.o ? "rgba(51,226,154,.45)" : "rgba(248,113,113,.45)") };
        }).filter(function(p){ return p.value !== null && isFinite(p.value) && p.value > 0; }));
      }
      CHT.chart.timeScale().fitContent();
    }catch(e){}
  }

  // ---- header ------------------------------------------------------------
  // The footer strip is not part of this display: .foot is display:none and
  // carries no text, so nothing under the desk is written from here.
  function renderChrome(){
    var asOf = (MB && MB.asOf) ? String(MB.asOf) : "session as-of not stated";
    $("exName").textContent = EX;
    $("exFull").textContent = " " + CFG.full;
    $("topAsOf").textContent = asOf;
    $("wlMeta").textContent = EX + (MB && MB.stocks ? " - " + MB.stocks.length : "");
    $("mkMetaMark").textContent = "";
    if ($("chtEx")) $("chtEx").textContent = EX;
  }

  // ---- history -----------------------------------------------------------
  // One security per exchange, named up front, so the page makes exactly one
  // history request. The key that answers is the key the chart panel would use:
  // EX_<ticker> on the NSE and NGX, <sym> on the JSE, <ticker>.CA on the EGX.
  // If no file answers, the chart says so rather than drawing something else.
  function loadHistoryFor(row){
    if (!row) return Promise.resolve(null);
    var keys = histKeys(row), kc = Promise.resolve(null);
    keys.forEach(function(k){
      kc = kc.then(function(hit){
        if (hit) return hit;
        return get("terminal/static_data/history/" + encodeURIComponent(k) + ".json")
          .then(function(d){
            if (d && d.bars && d.bars.length){ HKEY = k; HROW = row; return d; }
            return null;
          })
          .catch(function(){ return null; });
      });
    });
    return kc.then(function(d){ HIST = d || null; return HIST; });
  }
  function loadHistory(){
    var rows = allRows();
    var pref = String(CFG.sym).toUpperCase();
    var row = null;
    for (var i = 0; i < rows.length; i++){
      if (String(rows[i].ticker || "").toUpperCase() === pref){ row = rows[i]; break; }
    }
    if (!row){
      var p = priced();
      row = p.length ? p[0] : null;
    }
    return loadHistoryFor(row);
  }
  // the standalone chart walks down the volume ranking until one security has a
  // history file, and names whichever one answered. It never draws a series
  // under another security's name.
  function loadHistoryAny(){
    var rows = priced();
    var pref = String(CFG.sym).toUpperCase();
    var order = rows.slice().sort(function(a, b){
      var aw = String(a.ticker || "").toUpperCase() === pref ? 0 : 1;
      var bw = String(b.ticker || "").toUpperCase() === pref ? 0 : 1;
      return aw - bw;
    }).slice(0, 14);
    var i = 0;
    function step(){
      if (i >= order.length) return Promise.resolve(null);
      var row = order[i++];
      return loadHistoryFor(row).then(function(d){ return d ? d : step(); });
    }
    return step();
  }

  // ---- static display views ------------------------------------------------
  // ?view= chooses the single panel drawn under the header. Every view is a
  // picture built from divs, spans, one table and one SVG. There is no input,
  // select, textarea, button or link in any of them, and no element that
  // reports cursor:pointer: nothing here can be typed into, clicked, tabbed to
  // or dragged. Figures come straight out of the published files; anything
  // missing prints the house empty marker and never a zero or an estimate.
  var VIEWS = ["watchlist", "chart", "financials", "screener", "info", "news", "corpactions", "trade"];
  var VIEW = String(Q.get("view") || "").toLowerCase();
  if (VIEWS.indexOf(VIEW) < 0) VIEW = "";

  var CACHE = { fin: null, news: null, ci: null, ca: null };

  function curOf(r){ return String((r && r.currency) || CFG.cur).toUpperCase(); }

  // a level change is printed only when the row's own percent agrees with it,
  // the same guard the default table uses
  function levelOf(r){
    var p = num(r.price), prev = num(r.prevClose), c = num(r.chgPct);
    if (p === null || prev === null || c === null || prev === 0) return null;
    var calc = (p - prev) / prev * 100;
    return Math.abs(calc - c) <= 0.02 ? p - prev : null;
  }
  function pxCell(r){
    var p = num(r.price);
    if (p === null) return '<span class="nq">no quote</span>';
    var cur = curOf(r);
    return fmtPx(p) + (cur !== CFG.cur.toUpperCase() ? '<span class="cur">' + esc(cur) + '</span>' : "");
  }
  function pctCell(c){ return c === null ? "-" : fmtPct(c); }
  function lvlCell(l){
    return '<span class="num c-lvl ' + cls(l) + '">' + (l === null ? "-" : (l > 0 ? "+" : "") + fmtPx(l)) + '</span>';
  }
  function fitRows(host, rowH, reserve){
    var h = host.clientHeight || 240;
    return Math.max(3, Math.floor((h - (reserve || 20)) / rowH));
  }
  function setView(title, meta){
    $("vTitle").textContent = title || "";
    $("vMeta").textContent = noDates(meta || "");
  }
  // the footer strip is gone: each view names the file it read in its own
  // caption, so nothing is written under the page any more
  function setFoot(){}
  function viewError(title, msg){
    $("vMeta").textContent = noDates(EX);
    $("vbody").innerHTML = '<div class="vempty"><b>' + esc(title) + '</b>' + esc(msg) + '</div>';
  }
  function renderView(){
    if (VIEW === "chart") return viewChart();
    if (VIEW === "financials") return viewFinancials();
    if (VIEW === "screener") return viewScreener();
    if (VIEW === "info") return viewInfo();
    if (VIEW === "news") return viewNews();
    if (VIEW === "corpactions") return viewCorpActions();
    if (VIEW === "trade") return viewTrade();
    return viewWatchlist();
  }

  // ---- watchlist: the board by volume, no controls -------------------------
  function viewWatchlist(){
    setView("Quote monitor", EX + " " + CFG.full);
    var host = $("vbody"), rows = ranked(), rowH = 24;
    var n = Math.min(fitRows(host, rowH), rows.length);
    var out = ['<div class="vrow vw hd"><span>Ticker</span><span>Security</span>' +
      '<span class="num">Price (' + esc(CFG.cur) + ')</span><span class="num c-lvl">Chg</span>' +
      '<span class="num">Chg %</span><span class="num">Volume</span></div>'];
    for (var i = 0; i < n; i++){
      var r = rows[i], c = num(r.chgPct), v = num(r.volume);
      out.push('<div class="vrow vw">' +
        '<span class="tk">' + esc(r.ticker || r.sym || "") + '</span>' +
        '<span class="nm">' + esc(r.name || "") + '</span>' +
        '<span class="num">' + pxCell(r) + '</span>' +
        lvlCell(levelOf(r)) +
        '<span class="num ' + cls(c) + '">' + pctCell(c) + '</span>' +
        '<span class="num dim">' + (v === null ? "-" : fmtInt(v)) + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    setFoot("terminal/static_data/market_" + EX + ".json",
      n + " of " + rows.length + " listed securities, ordered by volume, most traded first");
  }

  // ---- screener: the board by change percent, no filters -------------------
  function viewScreener(){
    setView("Screener", EX + " ordered by change percent");
    var host = $("vbody"), rowH = 24;
    var rows = allRows().filter(function(r){ return num(r.chgPct) !== null; });
    rows.sort(function(a, b){ return num(b.chgPct) - num(a.chgPct); });
    var n = Math.min(fitRows(host, rowH), rows.length);
    var out = ['<div class="vrow vs hd"><span>Ticker</span><span>Security</span>' +
      '<span>Sector</span><span class="num">Price (' + esc(CFG.cur) + ')</span>' +
      '<span class="num">Chg %</span></div>'];
    for (var i = 0; i < n; i++){
      var r = rows[i], c = num(r.chgPct);
      out.push('<div class="vrow vs">' +
        '<span class="tk">' + esc(r.ticker || r.sym || "") + '</span>' +
        '<span class="nm">' + esc(r.name || "") + '</span>' +
        '<span class="nm">' + esc(r.sector || "-") + '</span>' +
        '<span class="num">' + pxCell(r) + '</span>' +
        '<span class="num ' + cls(c) + '">' + pctCell(c) + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    setFoot("terminal/static_data/market_" + EX + ".json",
      n + " of " + rows.length + " securities with a published change, highest change percent first");
  }

  // ---- chart: the same candles, alone and larger ---------------------------
  function viewChart(){
    setView("Price history", "loading the published bars");
    $("vbody").innerHTML =
      '<div class="chart-wrap vchart" id="vChartWrap">' +
        '<svg id="vChart" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>' +
      '</div>' +
      '<div class="chart-note" id="vChartNote">-</div>';
    return loadHistoryAny().then(function(){
      function draw(){
        var wrap = $("vChartWrap");
        if (!wrap || !wrap.clientWidth) return;
        var W = wrap.clientWidth;
        drawCandles({
          wrap: wrap, svg: $("vChart"), head: $("vMeta"), note: $("vChartNote"),
          winN: W >= 1000 ? 56 : (W >= 700 ? 48 : 44),
          bodyCap: 34, bodyFrac: 0.74, dateTicks: true
        });
      }
      draw();
      requestAnimationFrame(draw);
      if (document.fonts && document.fonts.ready){ document.fonts.ready.then(draw).catch(function(){}); }
      setFoot(HKEY ? "terminal/static_data/history/" + HKEY + ".json" : "terminal/static_data/history",
        "candles from the published daily open, high, low and close, nothing interpolated");
    });
  }

  // ---- financials: one stored income statement -----------------------------
  // Statement lines only: ratio rows are left out (this is a statement view, not
  // a ratio block) and a grouped line is printed as its stored total, so every
  // figure on screen is one figure from the file, never a sum of my own.
  function finKeys(row){
    var t = String((row && row.ticker) || "").toUpperCase();
    var s = String((row && row.sym) || "").toUpperCase();
    var out = [];
    function push(k){
      k = String(k || "").toUpperCase();
      if (k && out.indexOf(k) < 0) out.push(k);
    }
    push(s); push(t); push(s.split(".")[0]); push(t + ".JO"); push(t + ".CA");
    return out;
  }
  var FIN_RANK = [
    [/^revenue/i, 0], [/^turnover/i, 0], [/^direct costs/i, 1], [/^cost of sales/i, 1],
    [/^cost of revenue/i, 1], [/^gross profit/i, 2], [/^operating expenses/i, 3],
    [/^other operating/i, 4], [/^ebitda/i, 5], [/^operating profit/i, 6],
    [/^net finance/i, 7], [/^finance/i, 7], [/^share of/i, 8], [/^profit before/i, 9],
    [/^income tax/i, 10], [/^tax/i, 10],
    [/^profit for/i, 11], [/^total profit/i, 11], [/^net profit/i, 11], [/^profit/i, 11],
    [/^eps/i, 12], [/earnings per share/i, 12]
  ];
  function finRank(lbl){
    for (var i = 0; i < FIN_RANK.length; i++){ if (FIN_RANK[i][0].test(lbl)) return FIN_RANK[i][1]; }
    return 9.5;   // an unclassified line sits with the pre-tax block
  }
  function statementRows(rows){
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var r = rows[i] || {}, lbl = String(r.label || "").trim();
      if (!lbl) continue;
      if (r.isGroupHeader) continue;                                       // its total carries it
      if (r.group && r.group !== "Ungrouped" && !r.isGroupTotal) continue;  // component lines
      if (lbl === "Ungrouped" || lbl === "Group Total") continue;           // stored placeholders
      if (/\(%\)$/.test(lbl) || /\bmargin\b/i.test(lbl)) continue;          // ratio block
      if (/^roe\b/i.test(lbl) || /^roa\b/i.test(lbl) || /^debt to equity/i.test(lbl)) continue;
      out.push({ label: lbl, values: r.values || [], tot: !!r.isGroupTotal || !!r.isStatementTotal, rank: finRank(lbl) });
    }
    out.sort(function(a, b){ return a.rank - b.rank; });   // stable within a rank
    return out;
  }
  // a statement figure, in the house compact form, negative sign kept
  function fmtFin(v){
    var n = Number(v);
    if (!isFinite(n)) return "-";
    var s = n < 0 ? "-" : "", a = Math.abs(n), o;
    if (a >= 1e12) o = (a / 1e12).toFixed(1) + "T";
    else if (a >= 1e9) o = (a / 1e9).toFixed(1) + "B";
    else if (a >= 1e6) o = (a / 1e6).toFixed(1) + "M";
    else if (a >= 1e3) o = (a / 1e3).toFixed(1) + "K";
    else o = a.toFixed(2);
    return s + o;
  }
  function finCell(v){
    if (v === null || v === undefined || v === "") return '<td class="abs">-</td>';
    var n = Number(v);
    if (!isFinite(n)) return '<td class="abs">-</td>';
    return '<td>' + esc(fmtFin(n)) + '</td>';
  }
  function loadStatement(rows){
    var order = rows.slice(0, 12), i = 0;
    function step(){
      if (i >= order.length) return Promise.resolve(null);
      var row = order[i++];
      var keys = finKeys(row), j = 0;
      function tryKey(){
        if (j >= keys.length) return step();
        var k = keys[j++];
        return get("terminal/static_data/financials/" + encodeURIComponent(k) + "__income.json")
          .then(function(d){
            if (d && (d.rows || []).length && d.available !== false){
              return { row: row, file: k + "__income.json", data: d };
            }
            return tryKey();
          })
          .catch(function(){ return tryKey(); });
      }
      return tryKey();
    }
    return step();
  }
  function drawStatement(hit){
    var d = hit.data, row = hit.row;
    var lines = statementRows(d.rows || []);
    var periods = (d.periods || []).slice();
    var cur = String(d.currency || curOf(row)).toUpperCase();
    if (!lines.length || !periods.length){
      viewError("Statement not on file", "The stored income statement for " + (row.ticker || row.sym) + " holds no line items.");
      return;
    }
    var name = String(row.name || d.name || "").trim();
    var cap = '<div class="fcap"><b>' + esc(name) + (row.ticker ? " &middot; " + esc(row.ticker) : "") +
      " &middot; " + esc(EX) + '</b> &middot; income statement &middot; source terminal/static_data/financials/' +
      esc(hit.file) + " &middot; " + lines.length + " statement lines of " + (d.rows || []).length +
      " stored rows &middot; figures in " + esc(cur) + '</div>';

    var head = '<tr><th>Line item &middot; ' + esc(cur) + '</th>';
    for (var p = 0; p < periods.length; p++){
      head += '<th>' + esc(periods[p]) + '<span>&middot; ' + esc(cur) + '</span></th>';
    }
    head += '</tr>';

    var body = '';
    for (var i = 0; i < lines.length; i++){
      var ln = lines[i];
      body += '<tr' + (ln.tot ? ' class="tot"' : '') + '><td>' + esc(ln.label) + '</td>';
      for (var c = 0; c < periods.length; c++){ body += finCell(ln.values[c]); }
      body += '</tr>';
    }

    var host = $("vbody");
    host.innerHTML = cap + '<div class="finwrap"><table class="fintab"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    // the rows keep every line item: if they do not fit the frame at a legible
    // height the table shrinks to the floor and the caption still names the file
    var tab = host.querySelector(".fintab");
    var avail = (host.clientHeight || 280) - (cap ? 24 : 0) - 30;
    var rowH = Math.floor(avail / (lines.length + 1));
    rowH = Math.max(12, Math.min(19, rowH));
    if (tab) tab.style.setProperty("--frow", rowH + "px");

    setView("Income statement", name + " - " + EX + " - " + hits(d));
    setFoot("terminal/static_data/financials/" + hit.file,
      "as stored in the file" + (d.asOf ? " on " + d.asOf : "") + "; an absent cell prints -, nothing is estimated");
  }
  function hits(d){ return ((d.periods || []).length) + " periods"; }
  function viewFinancials(){
    setView("Income statement", EX + " " + CFG.full);
    if (CACHE.fin) { drawStatement(CACHE.fin); return Promise.resolve(); }
    return loadStatement(ranked()).then(function(hit){
      if (!hit){
        viewError("No statement on file", "No income statement file answered for the most traded names on " + EX + ".");
        setFoot("terminal/static_data/financials/", "no income statement file answered");
        return;
      }
      CACHE.fin = hit;
      drawStatement(hit);
    }).catch(function(){
      viewError("No statement on file", "The stored income statements could not be read for " + EX + ".");
    });
  }

  // ---- info: the descriptive facts on file ---------------------------------
  var INFO_FIELDS = [
    ["Sector", "sector"], ["Currency", "currency"], ["Country", "country"],
    ["Founded", "founded"], ["Listed", "listed"], ["Year end", "year_end"],
    ["Transfer secretary", "transfer_secretary"], ["Indices", "indices"]
  ];
  function ciFor(CI, row){
    if (!CI) return null;
    var t = String(row.ticker || "").toUpperCase();
    var s = String(row.sym || "").toUpperCase();
    var bare = s.split(".")[0];
    var cands = [t, s, bare, t + ".JO", t + ".CA", t + ".ZAc",
      EX + ":" + t.toLowerCase(), EX.toLowerCase() + "-" + t.toLowerCase(),
      EX.toLowerCase() + ":ke-" + t.toLowerCase(), "ke-" + t.toLowerCase(), "ng-" + t.toLowerCase()];
    for (var i = 0; i < cands.length; i++){
      var v = CI[cands[i]];
      if (v && typeof v === "object") return v;
    }
    return null;
  }
  function viewInfo(){
    setView("Company profile", EX + " " + CFG.full);
    var rows = ranked();
    var pref = String(CFG.sym).toUpperCase();
    var order = rows.slice().sort(function(a, b){
      return (String(a.ticker || "").toUpperCase() === pref ? 0 : 1) -
             (String(b.ticker || "").toUpperCase() === pref ? 0 : 1);
    }).slice(0, 30);
    function paint(CI){
      var pick = null, info = null;
      for (var i = 0; i < order.length && !pick; i++){
        var cand = ciFor(CI, order[i]);
        if (cand){ info = cand; pick = order[i]; }
      }
      if (!pick){ pick = order[0] || null; info = null; }
      if (!pick){ viewError("No security", "The market snapshot for " + EX + " holds no rows."); return; }

      var name = String(info && info.name || pick.name || pick.ticker || "");
      var f = [];
      function line(k, v){
        v = (v === null || v === undefined) ? "" : String(v).trim();
        if (!v) return;
        f.push('<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>');
      }
      line("Name", name);
      line("Ticker", pick.ticker || pick.sym);
      line("Exchange", EX + " " + CFG.full);
      for (var q = 0; q < INFO_FIELDS.length; q++){
        var key = INFO_FIELDS[q][1], sub = info ? info[key] : null;
        if (!sub && key === "sector") sub = pick.sector;
        if (!sub && key === "currency") sub = curOf(pick);
        if (!sub && key === "country") sub = pick.country;
        line(INFO_FIELDS[q][0], sub);
      }
      if (info && info.source) line("Entry source", info.source);

      var html = '<div class="inf">' + f.join("") + '</div>';
      if (info && info.description) html += '<div class="inftxt">' + esc(info.description) + '</div>';
      $("vbody").innerHTML = html;
      $("vMeta").textContent = noDates(name + (pick.ticker ? " - " + pick.ticker : "") + " - " + EX);
      setFoot("terminal/static_data/company_info.json" + (info ? "" : " (no entry)"),
        info ? "descriptive fields only; anything not on file is left out" : "no company profile entry on file for this security");
    }
    if (CACHE.ci){ paint(CACHE.ci); return Promise.resolve(); }
    return get("terminal/static_data/company_info.json").then(function(CI){
      CACHE.ci = CI || {};
      paint(CACHE.ci);
    }).catch(function(){
      viewError("Profile unavailable", "The company profile file could not be read.");
    });
  }

  // ---- news: dated wire items, headlines as text ---------------------------
  function tsISO(it){
    var t = num(it && it.ts);
    if (t === null || t < 100000000) return "";
    var d = new Date(t * 1000);
    if (isNaN(d.getTime())) return "";
    var y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, dd = d.getUTCDate();
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd;
  }
  function paintNews(list){
    var host = $("vbody"), rowH = 30;
    var items = list.slice();
    items.sort(function(a, b){
      var x = num(a.ts), y = num(b.ts);
      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });
    var n = Math.min(fitRows(host, rowH, 26), items.length);
    var out = [];
    var firstD = "", lastD = "";
    for (var i = 0; i < n; i++){
      var it = items[i] || {};
      var iso = tsISO(it);
      var shown = iso || (it.date ? String(it.date).trim() : "");
      if (!shown) shown = "undated";
      if (!firstD) firstD = shown;
      lastD = shown;
      out.push('<div class="nw">' +
        '<span class="nw-d">' + esc(shown) + '</span>' +
        '<span class="nw-h">' + esc(it.title || "untitled item") + '</span>' +
        '<span class="nw-s">' + esc(it.publisher || "source not stated") + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("") ||
      '<div class="vempty"><b>No wire items</b>No item is published in the file for ' + esc(EX) + '.</div>';
    setView("News", EX + " " + CFG.full);
    $("vMeta").textContent = noDates(n + " items - " + firstD + " to " + lastD);
    setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json",
      n + " of " + items.length + " wire items, newest first, dated from the item timestamp");
  }
  function viewNews(){
    setView("News", EX + " " + CFG.full);
    if (CACHE.news){ paintNews(CACHE.news); return Promise.resolve(); }
    return get("terminal/static_data/" + EX.toLowerCase() + "_news.json").then(function(list){
      if (!list || !list.length){
        viewError("No wire file", "No published news file answered for " + EX + ".");
        setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json", "no items on file");
        return;
      }
      CACHE.news = list;
      paintNews(list);
    }).catch(function(){
      viewError("No wire file", "The news file for " + EX + " could not be read.");
      setFoot("terminal/static_data/" + EX.toLowerCase() + "_news.json", "no items on file");
    });
  }

  // ---- corporate actions: a dated table, one row per action ----------------
  // Each exchange publishes a different shape, so a row is read field by field:
  // the date as printed, the security, the action type the file states, and the
  // detail in the issuer's own words. A file that carries announcements without
  // an action type prints Announcement; nothing is classified by guesswork, no
  // amount, ratio or date is derived, and an undated row says undated.
  var CA_FILES = {
    NSE: "nse_corporate_actions.json",
    NGX: "ngx_corporate_actions.json",
    JSE: "jse_announcements.json",
    EGX: "egx_announcements.json"
  };
  var CA_KEEP = /corporate action|directors dealing|general meeting|board meeting|disclosure|court order|completion board|announcement|dividend|book closure|bonus|rights|split|capital/i;
  var CA_DROP = /financial statement|statemets|earnings|results/i;

  function caDate(s){
    var raw = String(s == null ? "" : s).trim();
    if (!raw) return { iso: "", ms: null, raw: "" };
    var a = asDate(raw);
    if (a) return { iso: a.iso, ms: a.ms, raw: raw };
    var ms = Date.parse(raw);
    if (!isNaN(ms)){
      var d = new Date(ms);
      var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
      return { iso: y + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd, ms: ms, raw: raw };
    }
    return { iso: "", ms: null, raw: raw };
  }
  function caRows(list){
    var out = [];
    for (var i = 0; i < list.length; i++){
      var it = list[i];
      if (!it || typeof it !== "object") continue;
      var kind = String(it.kind == null ? "" : it.kind).trim();
      if (kind && (!CA_KEEP.test(kind) || CA_DROP.test(kind))) continue;
      var dt = caDate(it.date);
      out.push({
        date: dt.iso || dt.raw,
        ms: dt.ms,
        tick: String(it.ticker == null ? "" : it.ticker).trim(),
        name: String(it.name || it.company || "").trim(),
        type: kind || "Announcement",
        detail: String(it.text || it.title || "").trim()
      });
    }
    out.sort(function(a, b){
      if (a.ms === null && b.ms === null) return 0;
      if (a.ms === null) return 1;
      if (b.ms === null) return -1;
      return b.ms - a.ms;
    });
    return out;
  }
  function paintCorpActions(list, file){
    var host = $("vbody"), rowH = 34;
    var rows = caRows(list);
    if (!rows.length){
      viewError("No corporate actions", "The file for " + EX + " carries no corporate-action row.");
      setFoot("terminal/static_data/" + file, "0 corporate-action rows in the file");
      return;
    }
    var n = Math.min(fitRows(host, rowH, 26), rows.length);
    var out = ['<div class="vrow vc hd"><span>Date</span><span>Security</span>' +
               '<span>Action type</span><span>Detail</span></div>'];
    for (var i = 0; i < n; i++){
      var r = rows[i];
      out.push('<div class="vrow vc">' +
        '<span class="d">' + esc(r.date || "undated") + '</span>' +
        '<span class="sec"><b>' + esc(r.tick || "-") + '</b><span>' + esc(r.name || "") + '</span></span>' +
        '<span class="ty">' + esc(r.type) + '</span>' +
        '<span class="dt">' + (r.detail ? esc(r.detail) : '<span style="color:#6a6a6a">-</span>') + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    var a = rows[0].date || "undated", b2 = rows[n - 1].date || "undated";
    setView("Corporate actions", EX + " " + CFG.full);
    $("vMeta").textContent = noDates(n + " actions - " + a + " to " + b2);
    setFoot("terminal/static_data/" + file, n + " of " + rows.length + " corporate-action rows, newest first");
  }
  function viewCorpActions(){
    setView("Corporate actions", EX + " " + CFG.full);
    var file = CA_FILES[EX];
    if (!file){
      viewError("No corporate-actions file", "No corporate-actions file is published for " + EX + ".");
      setFoot("terminal/static_data/", "no corporate-actions file for " + EX);
      return Promise.resolve();
    }
    if (CACHE.ca){ paintCorpActions(CACHE.ca.list, file); return Promise.resolve(); }
    return get("terminal/static_data/" + file).then(function(list){
      if (!list || !list.length){
        viewError("No corporate actions", "The file for " + EX + " holds no rows.");
        setFoot("terminal/static_data/" + file, "no rows on file");
        return;
      }
      CACHE.ca = { list: list };
      paintCorpActions(list, file);
    }).catch(function(){
      viewError("No corporate actions", "terminal/static_data/" + file + " could not be read.");
      setFoot("terminal/static_data/" + file, "no rows on file");
    });
  }

  // ---- trade: a static paper blotter --------------------------------------
  // The paper account lives in the visitor's own browser (the trade panel's
  // mx_paper_v1 key). This page only reads it. If it holds no position for this
  // exchange the blotter says so; no example trade is ever drawn.
  function viewTrade(){
    setView("Paper trading", EX + " paper blotter");
    var host = $("vbody");
    var book = null;
    try{
      var all = JSON.parse(localStorage.getItem("mx_paper_v1") || "{}");
      book = (all && all[EX]) || null;
    }catch(e){ book = null; }
    var pos = (book && book.positions) || {};
    var keys = Object.keys(pos).filter(function(k){
      var q = num(pos[k] && pos[k].qty);
      return q !== null && q !== 0;
    });
    var head = '<div class="vrow vt hd"><span>Ticker</span><span class="num">Quantity</span>' +
               '<span class="num">Entry</span><span class="num">Current</span>' +
               '<span class="num">Unrealised</span></div>';
    if (!keys.length){
      host.innerHTML = head + '<div class="vempty"><b>No open positions</b>' +
        'This paper account is held in this browser (mx_paper_v1) and holds no ' + esc(EX) +
        ' position, so there is nothing to value. Nothing is drawn here that was not traded.</div>';
      setFoot("browser storage mx_paper_v1", "no paper position for " + EX + " in this browser");
      return;
    }
    var idx = {};
    var rows = allRows();
    for (var i = 0; i < rows.length; i++){
      var t = String(rows[i].ticker || "").toUpperCase();
      if (t && !idx[t]) idx[t] = rows[i];
      var s2 = String(rows[i].sym || "").toUpperCase();
      if (s2 && !idx[s2]) idx[s2] = rows[i];
    }
    var out = [head], rowH = 24, shown = 0, total = 0;
    var n = fitRows(host, rowH);
    keys.sort();
    for (var k = 0; k < keys.length; k++){
      var sym = keys[k], p = pos[sym] || {};
      var qty = num(p.qty), entry = num(p.avg);
      var mrow = idx[String(sym).toUpperCase()] || null;
      var now = mrow ? num(mrow.price) : null;
      var un = (qty !== null && entry !== null && now !== null)
        ? (qty > 0 ? (now - entry) * qty : (entry - now) * -qty) : null;
      if (un !== null) total += un;
      if (shown >= n) continue;
      shown++;
      out.push('<div class="vrow vt">' +
        '<span class="tk">' + esc(sym) + '</span>' +
        '<span class="num">' + (qty === null ? "-" : fmtInt(qty)) + '</span>' +
        '<span class="num">' + (entry === null ? "-" : fmtPx(entry)) + '</span>' +
        '<span class="num">' + (now === null ? '<span class="nq">no quote</span>' : fmtPx(now)) + '</span>' +
        '<span class="num ' + cls(un) + '">' + (un === null ? "-" : (un > 0 ? "+" : "") + fmtPx(un)) + '</span>' +
      '</div>');
    }
    host.innerHTML = out.join("");
    setFoot("browser storage mx_paper_v1",
      shown + " of " + keys.length + " open positions; current price from terminal/static_data/market_" + EX + ".json");
  }

  // ---- the board ----------------------------------------------------------
  // market_<EX>.json is the file the WATCHLIST is drawn from and the one that
  // carries the whole quote: previous close, open, high, low and market cap.
  // screener_<EX>.json is the fallback: the same board from the same build,
  // carrying price, change and volume and nothing else. A window reads one
  // board, so MARKET, FOCUS and the WATCHLIST can never disagree about which
  // securities exist, and the empty state is only reached when NEITHER file
  // answers.
  function loadBoard(){
    var prim = "terminal/static_data/market_" + EX + ".json";
    var alt  = "terminal/static_data/screener_" + EX + ".json";
    function take(d, file, full){
      if (!d || !d.stocks || !d.stocks.length) return null;
      MB = d; BOARD_FILE = file; BOARD_FULL = full;
      return d;
    }
    return get(prim).then(function(d){ return take(d, prim, true); })
      .catch(function(){ return null; })
      .then(function(hit){
        if (hit) return hit;
        return get(alt).then(function(d){ return take(d, alt, false); })
          .catch(function(){ return null; });
      })
      .catch(function(){ return null; });
  }

  // ---- boot --------------------------------------------------------------
  function noBoardNote(){
    return "Neither terminal/static_data/market_" + EX + ".json nor terminal/static_data/screener_" +
      EX + ".json answered for " + EX + ", so there is nothing to draw.";
  }
  function boot(){
    $("exName").textContent = EX;
    $("exFull").textContent = " " + CFG.full;
    $("topAsOf").textContent = "loading the published snapshot";
    $("mkMetaMark").textContent = "";

    // ?view= swaps the desk for one panel; the header and the tape stay
    var hero = !VIEW;
    if (!hero){
      $("gridHero").hidden = true;
      $("gridView").hidden = false;
    }

    // the heatmap and the macro files are read alongside the board; each panel
    // repaints itself when its own file lands, so a slow or absent file never
    // holds up a window beside it
    var heat = hero ? loadHeatmap() : null;
    var macro = hero ? loadMacro() : null;

    return Promise.all([
      loadBoard(),
      get("terminal/static_data/ex_" + EX + "_indices.json").catch(function(){ return null; })
    ])
    .then(function(res){
      IX = res[1];
      if (!MB || !MB.stocks || !MB.stocks.length){
        $("topAsOf").textContent = "session as-of not stated";
        if (!hero){
          viewError("Snapshot unavailable", noBoardNote());
          return null;
        }
        var box = '<div class="vempty"><b>No snapshot</b>' + esc(noBoardNote()) + '</div>';
        $("wlBody").innerHTML = box;
        $("mkBody").innerHTML = box;
        $("fxBody").innerHTML = '<div class="vempty"><b>Focus</b>No security is published for ' +
          esc(EX) + ', so there is no quote to draw.</div>';
        tryDraw(renderCompare);
        tryDraw(renderHeatmap);
        tryDraw(renderMacro);
        tryDraw(chtPaint);
        return null;
      }
      if (!hero) { renderChrome(); renderTape(); return renderView(); }
      renderDesk();
      if (heat) heat.then(function(){ tryDraw(renderHeatmap); });
      if (macro) macro.then(function(){ tryDraw(renderMacro); });
      // one more pass once the frame and the webfont settle, so each window
      // trims against its real row height instead of the fallback metrics
      requestAnimationFrame(function(){ renderDesk(); });
      if (document.fonts && document.fonts.ready){
        document.fonts.ready.then(function(){ renderDesk(); }).catch(function(){});
      }
      return null;
    }).catch(function(){
      if (VIEW){ viewError("Could not read the snapshot", "Nothing is drawn rather than something guessed."); return; }
      // this page never blanks one window and leaves the others blank beside it
      var msg = noBoardNote();
      $("topAsOf").textContent = "session as-of not stated";
      $("wlBody").innerHTML = '<div class="vempty"><b>No snapshot</b>' + esc(msg) + '</div>';
      $("mkBody").innerHTML = '<div class="vempty"><b>No snapshot</b>' + esc(msg) + '</div>';
      $("fxBody").innerHTML = '<div class="vempty"><b>Focus</b>No security is published for ' +
        esc(EX) + ', so there is no quote to draw.</div>';
      tryDraw(chtPaint);
    });
  }

  var rt = null;
  window.addEventListener("resize", function(){
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){
      if (!MB) return;
      tryDraw(renderTape);
      if (VIEW){ renderView(); return; }
      renderDesk();
    }, 140);
  });

  boot();
})();
</script>
</body>
</html>
