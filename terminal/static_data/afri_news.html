<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - NEWS panel. NSE news headlines. Vanilla JS, Godel palette.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - NEWS</title>
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--acc:#33e29a;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  body{margin:0;background:#000;color:var(--tx);font-family:var(--ui);font-size:13px}
  .wrap{max-width:640px;margin:0 auto;padding:14px}
  .head{display:flex;align-items:center;gap:10px;padding:8px 4px 12px;border-bottom:1px solid var(--line2)}
  .code{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;border:1px solid var(--line2);padding:2px 6px;border-radius:2px}
  .title{font-family:var(--mono);font-size:12px;color:var(--tx2);letter-spacing:.06em}
  .title b{color:var(--acc)}
  .spacer{flex:1}
  .src{font-family:var(--mono);font-size:9px;color:var(--tx3)}
  .item{border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:12px 14px;margin-top:8px}
  .item a{color:var(--tx);text-decoration:none;font-size:13px;line-height:1.5;display:block}
  .item a:hover{color:var(--acc)}
  .meta{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-top:7px;display:flex;gap:10px;align-items:center}
  .pub{color:var(--acc)}
  .tick{color:var(--acc2);border:1px solid var(--line2);border-radius:2px;padding:1px 5px}
  .item .nl{color:var(--tx2)}
  .empty{padding:30px 14px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:11px}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <span class="code">NEWS</span>
    <span class="title"><span id="exTitle">NSE</span> NEWS <b>· HEADLINES · REGULATORY · ACTIONS</b></span>
    <span class="spacer"></span>
    <span class="src" id="src">Headlines · Reg · Actions</span>
  </div>
  <div id="items"><div class="empty">loading…</div></div>
</div>
<script>
(function(){
  "use strict";
  var CUR = "NSE";
  try{ var _q = new URLSearchParams(window.location.search); if(_q.get("ex")) CUR = _q.get("ex").toUpperCase(); }catch(e){}
  // Each exchange draws on its official/collector feed plus the market-bot scan.
  // JSE had headlines in jse_news.json all along that this panel never loaded,
  // and EGX had no feed at all - the scan reaches it through three sources.
  var EX_FILE = {
    "NSE": ["nse_news.json", "bot_news_NSE.json"],
    "NGX": ["ngx_news.json", "bot_news_NGX.json"],
    "JSE": ["jse_news.json", "bot_news_JSE.json"],
    "EGX": ["bot_news_EGX.json"]
  };
  var EX_NAME = { "NSE": "NSE", "NGX": "NGX", "JSE": "JSE", "EGX": "EGX" };
  var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // The REG panel's content folds into this one: the regulator wire, filtered
  // to the country of the exchange currently shown.
  var REG_ISO = { "NSE": "KE", "NGX": "NG", "JSE": "ZA", "EGX": "EG" };
  // Structured corporate actions (dividends / book closures) for exchanges
  // that publish them as their own feed.
  //
  // NGX was previously left out on the assumption that its dividends and
  // closures already rode ngx_news.json. They do not: that feed carries
  // dividends but no book closures at all, while ngx_corporate_actions.json
  // holds 397 corporate actions - 86 of them closure notices - plus directors'
  // dealings and board meetings. Only one of its 1000 rows duplicates a
  // headline already in the news feed, so folding it in adds coverage without
  // doubling anything up.
  //
  // JSE corporate actions arrive via the bot scan; EGX has no reachable
  // English feed.
  var CORP_FILE = { "NSE": "nse_corporate_actions.json",
                    "NGX": "ngx_corporate_actions.json" };

  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // The feeds date their items differently: the bot emits an epoch ts, the NGX
  // disclosures use "2026-08-28", and the older collectors use "Sep 3". Reduce
  // them all to one number so a merged list can be ordered honestly; anything
  // unparseable sorts last rather than pretending to be recent.
  function stamp(n){
    if(n && typeof n.ts === "number" && n.ts > 0) return n.ts;
    var d = String((n && n.date) || "").trim();
    var iso = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return Date.UTC(+iso[1], +iso[2]-1, +iso[3]) / 1000;
    var md = d.match(/^([A-Z][a-z]{2})\s+(\d{1,2})$/);
    if(md && MONTHS[md[1]] != null){
      var now = new Date(), y = now.getUTCFullYear();
      var t = Date.UTC(y, MONTHS[md[1]], +md[2]) / 1000;
      // A date more than a week ahead is last year's, not the future.
      if(t > now.getTime()/1000 + 7*86400) t = Date.UTC(y-1, MONTHS[md[1]], +md[2]) / 1000;
      return t;
    }
    return 0;
  }

  function key(n){
    var u = String((n && n.url) || "").split("?")[0];
    if(u) return "u:" + u;
    return "t:" + String((n && n.title) || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").slice(0, 90);
  }

  document.getElementById("exTitle").textContent = EX_NAME[CUR] || CUR;
  var files = EX_FILE[CUR];
  var el = document.getElementById("items");
  if(!files || !files.length){
    el.innerHTML = '<div class="empty">no news feed for ' + esc(CUR) + '</div>';
    return;
  }

  function load(name){
    return fetch("../../static_data/" + name)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .catch(function(){ return []; });
  }

  // Regulator-wire rows (reg.json) -> news rows, kept to this exchange's
  // country. The headline tail is the regulator's own masthead ("... -
  // Securities and Exchange Commission, Nigeria"), redundant with the
  // publisher line, so it is dropped. The wire also carries regulator
  // notices up to a decade old (the backend query has no date window), and a
  // news panel is not an archive: only items inside the recency window stay.
  var REG_DAYS = 180;
  function regRows(list){
    var iso = REG_ISO[CUR]; if(!iso) return [];
    var cutoff = Date.now() / 1000 - REG_DAYS * 86400;
    return ((list && list.items) || []).filter(function(i){
      if(!i || i.iso !== iso || !i.headline) return false;
      return stamp({ date: String(i.date || "").slice(0, 10) }) >= cutoff;
    })
      .map(function(i){
        var h = String(i.headline).replace(/\s+-\s+[^-\n]*$/, "").trim();
        return { title: h,
          publisher: String(i.regulator || "") + " \u00b7 " + String(i.outlet || ""),
          date: String(i.date || "").slice(0, 10),
          url: i.link || "", tickers: [] };
      });
  }

  // Corporate-action rows: {"date":"Sep 04 2026","ticker":"SCOM",
  // "name":"Safaricom Plc","text":"Payment of KES 1.15 final dividend",
  // "kind":"DIVIDEND PAYMENT"} -> a headline with a ticker chip. These are
  // exchange announcements with no article URL, so they render unlinked.
  function corpRows(list){
    var out = [];
    (list || []).forEach(function(r){
      if(!r || !r.name || !r.text) return;
      // The two exchanges date these differently - NSE writes "Sep 04 2026",
      // NGX writes "2026-08-28". Parse both, or the ISO rows get no timestamp,
      // sort to the bottom of a date-ordered list and print a date shaped
      // unlike every other row.
      var raw = String(r.date || "").trim();
      var ts = 0, disp = raw;
      var m = raw.match(/^([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})$/);
      var iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m && MONTHS[m[1]] != null){
        ts = Date.UTC(+m[3], MONTHS[m[1]], +m[2]) / 1000;
        disp = m[1] + " " + (+m[2]);
      }else if(iso){
        ts = Date.UTC(+iso[1], +iso[2] - 1, +iso[3]) / 1000;
        // same "Sep 4" shape the NSE rows use, so one list reads as one list
        disp = MONTH_NAMES[+iso[2] - 1] + " " + (+iso[3]);
      }
      out.push({ title: r.name + ": " + r.text,
        publisher: String(r.kind || "Corporate Action").toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }),
        date: disp, url: r.url || "", ts: ts, _corp: true,
        tickers: r.ticker ? [r.ticker] : [] });
    });
    out.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });

    // Dividends and book closures are the two announcements people open this
    // panel for, and a plain newest-25 buries them: NGX files enough board
    // meetings and directors' dealings in any given week to fill the slice, so
    // the dividend notices - days older - never appeared at all. Give those two
    // categories their own share of the slice and let everything else fill the
    // rest, all still newest-first.
    // Take the dividend and closure notices first, then fill the remainder of
    // the slice with everything else, newest-first. Capping the priority bucket
    // instead would cut NSE in half - every one of its corporate actions is a
    // dividend or a closure - so the rule is "these go in first", never "these
    // get at most N".
    var PRIORITY = /dividend|book clos|closure of register|closed period/i;
    var CORP_CAP = 25;
    var keyed = [], other = [];
    out.forEach(function(n){ (PRIORITY.test(n.title) ? keyed : other).push(n); });
    var pick = keyed.slice(0, CORP_CAP);
    return pick.concat(other.slice(0, CORP_CAP - pick.length));
  }

  function shortDate(ts){
    try{
      var d = new Date(ts * 1000);
      return d.toUTCString().slice(5, 16).replace(/^0/, "");
    }catch(e){ return ""; }
  }

  var jobs = (files || []).map(function(nm){
    return load(nm).then(function(d){ return { kind: "plain", rows: d }; });
  });
  if(REG_ISO[CUR])
    jobs.push(load("reg.json").then(function(d){ return { kind: "reg", rows: d }; }));
  if(CORP_FILE[CUR])
    jobs.push(load(CORP_FILE[CUR]).then(function(d){ return { kind: "corp", rows: d }; }));

  Promise.all(jobs).then(function(srcs){
    var seen = {}, all = [];
    srcs.forEach(function(s){
      var rows = s.kind === "plain" ? (s.rows || [])
               : (s.kind === "reg" ? regRows(s.rows) : corpRows(s.rows));
      rows.forEach(function(n){
        if(!n || !n.title) return;
        var k = key(n);
        if(seen[k]) return;
        seen[k] = 1;
        n._t = stamp(n);
        if(!n.date && n._t) n.date = shortDate(n._t);
        all.push(n);
      });
    });
    if(!all.length){ el.innerHTML = '<div class="empty">no news</div>'; return; }
    all.sort(function(a, b){ return b._t - a._t; });

    // Corporate actions must not lose a date race. NGX files ~300 press items a
    // month, so on a straight date sort the dividend and book-closure notices -
    // which are days older - fall past the 120-row cut and vanish, which is
    // exactly what they did before this. They are already capped at 25 by
    // corpRows, so reserve them their places and fill the rest by date.
    var CAP = 120;
    var corp = all.filter(function(n){ return n._corp; });
    var rest = all.filter(function(n){ return !n._corp; });
    var shown = corp.concat(rest.slice(0, Math.max(0, CAP - corp.length)));
    shown.sort(function(a, b){ return b._t - a._t; });

    el.innerHTML = shown.map(function(n){
      var ticks = (n.tickers || []).slice(0, 3).map(function(t){
        return '<span class="tick">' + esc(t) + '</span>'; }).join(" ");
      var head = n.url
        ? '<a href="' + esc(n.url) + '" target="_blank" rel="nofollow noopener">' + esc(n.title) + '</a>'
        : '<span class="nl">' + esc(n.title) + '</span>';
      return '<div class="item">' + head +
        '<div class="meta"><span class="pub">' + esc(n.publisher || "") + '</span>' +
          '<span>' + esc(n.date || "") + '</span>' + ticks + '</div>' +
        '</div>';
    }).join("");
  });
})();
</script>
</body>
</html>
