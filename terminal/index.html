<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUTXRI TERMINAL — African Markets Terminal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link rel="icon" type="image/svg+xml" href="/mutxri_logo.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/mutxri_logo_256.png">
<link rel="apple-touch-icon" href="/mutxri_logo_256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxygen+Mono&family=Sofia+Sans+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Godel tokens — unchanged */
  --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
  --line:#1a1a1a; --line2:#262626;
  --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
  --acc:#33e29a; --acc2:#1ecfb0; --up:#33e29a; --down:#f87171; --warn:#e0a340;
  --mint-dim:rgba(51,226,154,.10); --mint-line:rgba(51,226,154,.35);
  /* refinement: one spacing scale, used everywhere */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --mono:'Oxygen Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Inter',system-ui,sans-serif;
  --brand:'Sofia Sans Semi Condensed','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.term{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:var(--s5);padding:0 var(--s4);height:52px;
  border-bottom:1px solid var(--line2);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:var(--s3);cursor:pointer}
.mark{width:30px;height:30px;border:1.5px solid var(--acc);border-radius:3px;
  display:grid;place-items:center;font-family:var(--brand);font-weight:700;
  font-size:14px;color:var(--acc);letter-spacing:.02em}
.brandname{font-family:var(--brand);font-weight:700;font-size:17px;letter-spacing:.14em}
.brandname small{display:block;font-size:8px;letter-spacing:.34em;color:var(--tx3);
  font-weight:600;margin-top:-2px}
.exch{display:flex;gap:var(--s1);margin-left:var(--s2)}
.exch-tab{background:none;border:0;color:var(--tx3);font-family:var(--mono);
  font-size:11px;letter-spacing:.06em;padding:var(--s1) var(--s3);border-radius:2px;
  cursor:pointer;transition:color .15s,background .15s}
.exch-tab:hover{color:var(--tx2)}
.exch-tab.active{color:#00160e;background:var(--acc);font-weight:700;
  font-size:13px;padding:5px 12px;letter-spacing:.08em;box-shadow:0 0 12px rgba(51,226,154,.35)}
.exch-flag{font-size:11px;margin-right:3px}
.exch-full{font-size:9px;font-weight:400;opacity:.8;margin-left:5px;letter-spacing:.04em;text-transform:uppercase}
.search{margin-left:auto;display:flex;align-items:center;gap:var(--s2);
  background:var(--bg3);border:1px solid var(--line2);border-radius:3px;
  padding:var(--s2) var(--s3);width:260px;transition:border-color .15s}
.search:focus-within{border-color:var(--mint-line)}
.search span{color:var(--tx3);font-size:11px}
.search input{background:none;border:0;outline:0;color:var(--tx);font-family:var(--mono);
  font-size:12px;width:100%}
.search input::placeholder{color:var(--tx3)}
.acct button{background:var(--bg3);border:1px solid var(--line2);color:var(--acc);
  font-family:inherit;font-size:10px;padding:var(--s1) 10px;border-radius:2px;cursor:pointer;
  transition:border-color .15s,color .15s}
.acct button:hover{border-color:var(--mint-line)}
.clock{display:flex;align-items:center;gap:var(--s2);color:var(--tx2);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 0 rgba(51,226,154,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,226,154,.45)}70%{box-shadow:0 0 0 5px rgba(51,226,154,0)}100%{box-shadow:0 0 0 0 rgba(51,226,154,0)}}

/* ---------- tape ---------- */
.tape{display:flex;align-items:center;height:34px;border-bottom:1px solid var(--line2);
  background:var(--bg);overflow:hidden;white-space:nowrap;padding-left:var(--s4)}
.tape-inner{display:inline-flex;align-items:center;gap:0;will-change:transform;
  animation:tape-scroll 45s linear infinite}
.tape-inner:hover{animation-play-state:paused}
@keyframes tape-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
.tape-item{display:inline-flex;align-items:baseline;gap:var(--s2);padding:0 var(--s4);
  border-right:1px solid var(--line);font-size:11px}
.tape-item .sym{color:var(--tx2);font-weight:500}
.tape-item .pr{color:var(--tx)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx3)}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:var(--wW,232px) 1fr var(--wI,288px);min-height:0;position:relative}
/* rail resizers (drag the divider to size panels) */
.rsz{position:absolute;top:34px;bottom:0;width:7px;cursor:col-resize;z-index:18;background:transparent;transition:background .12s}
.rsz:hover{background:rgba(51,226,154,.10)}
.rsz::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--line2);transition:width .12s,background .12s}
.rsz:hover::after{width:2px;background:var(--acc)}
#rszL{left:calc(var(--wW,232px) - 4px)}
#rszR{right:calc(var(--wI,288px) - 3px)}
.view-panel .rsz,.view-watchlist .rsz,.view-info .rsz{display:none}
.rail{border-right:1px solid var(--line2);background:var(--bg2);
  display:flex;flex-direction:column;min-height:0}
.rail.right{border-right:0;border-left:1px solid var(--line2)}
.eyebrow{color:var(--tx3);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:var(--s3) var(--s4) var(--s2)}

/* watchlist */
.wl{overflow-y:auto;min-height:0;flex:1}
.wl-head{display:flex;justify-content:space-between;padding:var(--s2) var(--s4);font-size:10px;
  color:var(--tx3);border-bottom:1px solid var(--line);letter-spacing:.05em}
.wl-row{display:grid;grid-template-columns:26px 1fr auto;gap:2px var(--s3);
  align-items:center;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s}
.wl-row:hover{background:var(--bg3)}
.wl-row.active{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.wl-logo-cell{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center}
.wl-logo{width:22px;height:22px;border-radius:3px;background:var(--bg4);object-fit:contain;padding:2px}
.wl-mono{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);border-radius:3px;color:var(--acc);font-size:10px;font-weight:700;
  background:var(--bg3);letter-spacing:.02em}
.wl-main{grid-column:2;min-width:0}
.wl-main .sym{font-weight:500;color:var(--tx);letter-spacing:.02em}
.wl-main .nm{font-family:var(--ui);font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-main .wl-ceo{display:block;font-family:var(--ui);font-size:9px;color:var(--tx3);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-price{grid-column:3;text-align:right}
.wl-price .pr{color:var(--tx);font-size:11px}
.wl-price .chg{font-size:10.5px}

/* ---------- center panel ---------- */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line2);padding:0 var(--s3);
  overflow-x:auto}
/* in-window chart (view=watchlist previews) */
#wlChart{position:fixed;inset:0;z-index:60000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
#wlChart .wc-box{width:min(680px,94vw);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.7);}
#wlChart .wc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);}
#wlChart .wc-t{color:var(--acc);font-size:13px;letter-spacing:.08em;font-weight:700;}
#wlChart .wc-ct{background:none;border:1px solid var(--line2);color:var(--tx3);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 10px;cursor:pointer;margin-left:6px;border-radius:3px;}
#wlChart .wc-ct.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
#wlChart .wc-close{background:none;border:0;color:var(--tx3);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
#wlChart .wc-close:hover{color:#ff5f56;}
#wlChart .wc-body{height:380px;}
#wlChart .wc-load{color:var(--tx3);font-size:12px;padding:24px;text-align:center;}
/* auth gate (sign in required) */
.auth-gate-holder #authGate, #authGate{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
#authGate .gate-card{width:340px;border:1px solid var(--line2);border-radius:8px;padding:28px;background:var(--bg2);box-shadow:0 24px 80px rgba(0,0,0,.6);}
#authGate .gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#authGate .gate-mark{width:30px;height:30px;background:var(--acc);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:13px;}
#authGate .gate-name{font-size:15px;letter-spacing:.08em;color:var(--tx);}
#authGate .gate-name small{color:var(--tx3);font-size:10px;letter-spacing:.15em;display:block;}
#authGate .gate-sub{color:var(--tx3);font-size:11px;margin:10px 0 14px;letter-spacing:.05em;}
#authGate .gate-social{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
#authGate .gate-social-btn{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:var(--mono);font-size:12px;letter-spacing:.03em;padding:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
#authGate .gate-social-btn:hover{border-color:var(--acc);color:var(--acc);}
#authGate .gs-g{color:#4285f4;font-weight:700;}
#authGate .gs-star{color:var(--tx3);}
#authGate .gate-or{text-align:center;color:var(--tx3);font-size:10px;letter-spacing:.15em;margin:0 0 12px;}
#authGate .gate-tabs{display:flex;border:1px solid var(--line2);border-radius:4px;margin-bottom:14px;overflow:hidden;}
#authGate .gate-tab{flex:1;background:none;border:0;color:var(--tx3);font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:8px 0;cursor:pointer;}
#authGate .gate-tab.on{background:var(--acc);color:#000;font-weight:700;}
#authGate .gate-field input{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:var(--mono);font-size:12px;padding:10px;margin-bottom:10px;border-radius:4px;outline:none;}
#authGate .gate-field input:focus{border-color:var(--acc);}
#authGate .gate-msg{min-height:16px;font-size:11px;color:#ff5f56;margin-bottom:10px;}
#authGate .gate-msg.ok{color:var(--acc);}
#authGate .gate-btn{width:100%;background:var(--acc);border:0;color:#000;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;padding:11px;border-radius:4px;cursor:pointer;}
#authGate .gate-btn:hover{background:#26c98a;}
#authGate .gate-back{margin-top:14px;text-align:center;color:var(--tx3);font-size:11px;cursor:pointer;}
#authGate .gate-back:hover{color:var(--acc);}
/* workspace drag handles (Godel-style panel arrangement) */
.dgrip{color:var(--tx3);cursor:grab;font-size:11px;padding:0 4px;user-select:none;opacity:.6;}
.dgrip:hover{opacity:1;color:var(--acc);}
.dgrip.dragging{opacity:.35;}
#colWatch.drop-ok, #colInfo.drop-ok{outline:2px dashed var(--acc);outline-offset:-2px;background:rgba(51,226,154,.06);}
.ctab[draggable="true"]{cursor:grab;}
.ctab{background:none;border:0;color:var(--tx3);font-family:var(--mono);
  font-size:11px;letter-spacing:.05em;padding:var(--s3) var(--s3);cursor:pointer;
  position:relative;white-space:nowrap;transition:color .15s}
.ctab:hover{color:var(--tx2)}
.ctab.active{color:var(--tx)}
.ctab.active::after{content:"";position:absolute;left:var(--s3);
  right:var(--s3);bottom:-1px;height:2px;background:var(--acc)}
.stage{flex:1;min-height:0}
.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* ---------- right rail ---------- */
.rightinfo{flex:1;overflow-y:auto;padding:0;font-family:var(--mono);font-size:11px;color:var(--tx2)}
.rightinfo .qlink{color:var(--acc);cursor:pointer;text-decoration:none}
.rightinfo .qlink:hover{text-decoration:underline}
.rightinfo .qhead{padding:var(--s4) var(--s4) var(--s2);border-bottom:1px solid var(--line)}
.rightinfo .qsym{font-size:16px;font-weight:500;color:var(--tx)}
.rightinfo .qname{font-family:var(--ui);font-size:11px;color:var(--tx3);margin-top:2px}
.rightinfo .qpx{font-size:24px;margin-top:var(--s3);color:var(--tx)}
.rightinfo .qchg{font-size:13px;margin-top:2px}
.rightinfo .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:var(--s2) var(--s4);
  font-size:10px;font-family:var(--mono)}
.rightinfo .qgrid span:nth-child(odd){color:var(--tx3)}
.rightinfo .qgrid span:nth-child(even){text-align:right;color:var(--tx)}

/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:var(--s4);height:30px;padding:0 var(--s4);
  border-top:1px solid var(--line2);background:var(--bg2);color:var(--tx3);font-size:10px}
.status .live{color:var(--acc)}
.status .warn{color:var(--warn)}
.status .spacer{margin-left:auto}
.status .cmd{display:flex;align-items:center;gap:4px}
.status .cmd b{color:var(--acc)}
.status .cmd input{background:var(--bg3);border:1px solid var(--line2);color:var(--tx);
  font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:2px;outline:0;width:160px}
.status .cmd input::placeholder{color:var(--tx3)}
kbd{font-family:var(--mono);background:var(--bg3);border:1px solid var(--line2);
  border-radius:2px;padding:1px 5px;color:var(--tx2);font-size:10px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---- embed mode (?rails=0 / ?view=): focused showcase, no app chrome ---- */
.no-rails .rail.right{display:none;}
.no-rails .main{grid-template-columns:1fr;}
.no-rails .status .cmd{display:none;}
.no-rails .tape{display:none;}
.hide-chrome .topbar{display:none;}
.hide-chrome .status{display:none;}
.hide-chrome .tape{display:none;}
.hide-panel .panel{display:none;}
.hide-panel .main{grid-template-columns:1fr;}
.hide-tape .tape{display:none;}
/* panel view: the center panel fills the whole embed */
.view-panel .main{grid-template-columns:1fr;}
.view-panel .panel{border-right:0;}
/* watchlist view: keep ONLY the watchlist rail, full width */
.view-watchlist .main{grid-template-columns:1fr;}
.view-watchlist .rail{border-right:0;background:transparent;}
.view-watchlist .wl-head{display:none;}
.view-watchlist #wlList{max-height:none;}
/* info view: keep only the right rail (investor sheet) */
.view-info .main{grid-template-columns:1fr;}
.view-info .rail{display:none;}
.view-info .rail.right{display:flex;border-right:0;background:transparent;}

</style>
</head>
<body>
<!-- ===== auth gate: sign in required to enter the terminal ===== -->
<div id="authGate" style="display:none">
  <div class="gate-card">
    <div class="gate-brand"><span class="gate-mark">MX</span><span class="gate-name">MUTXRI<small>TERMINAL</small></span></div>
    <div class="gate-sub">SIGN IN TO ENTER THE TERMINAL</div>
    <div class="gate-social">
      <button class="gate-social-btn" type="button" onclick="gateSocial('google')"><span class="gs-g">G</span> Continue with Google</button>
    <div class="gate-note">By continuing you agree to the <a href="/terms.html" style="color:var(--acc)">Terms of Service</a> and <a href="/privacy.html" style="color:var(--acc)">Privacy Policy</a>.</div>
      
    </div>
    <div class="gate-or">OR</div>
    <div class="gate-tabs">
      <button class="gate-tab on" data-gmode="login" onclick="gateMode('login')">SIGN IN</button>
      <button class="gate-tab" data-gmode="signup" onclick="gateMode('signup')">CREATE ACCOUNT</button>
    </div>
    <div class="gate-field"><input id="gateEmail" type="email" placeholder="EMAIL" autocomplete="email"></div>
    <div class="gate-field" id="gateNameWrap" style="display:none"><input id="gateName" type="text" placeholder="NAME (OPTIONAL)" autocomplete="name"></div>
    <div class="gate-field"><input id="gatePwd" type="password" placeholder="PASSWORD (MIN 8)" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateSubmit()"></div>
    <div class="gate-msg" id="gateMsg"></div>
    <button class="gate-btn" onclick="gateSubmit()">SIGN IN</button>
    <div class="gate-back" onclick="location.href='/'">&larr; Back to mutxriterminal.com</div>
  </div>
</div>
<!-- in-window chart for view=watchlist mode (landing previews): click a security -> candles -->
<div id="wlChart" style="display:none">
  <div class="wc-box">
    <div class="wc-head">
      <span class="wc-t" id="wcTitle">MUTXRI</span>
      <span class="wc-types">
        <button class="wc-ct on" data-t="candle" onclick="wcSetType('candle')">CANDLE</button>
        <button class="wc-ct" data-t="line" onclick="wcSetType('line')">LINE</button>
        <button class="wc-ct" data-t="area" onclick="wcSetType('area')">AREA</button>
      </span>
      <button class="wc-close" onclick="wcClose()">&times;</button>
    </div>
    <div class="wc-body" id="wcBody"><div class="wc-load">Loading history…</div></div>
  </div>
</div>
<script>
(function(){
  var AUTH_API = (window.AUTH_API || (new URLSearchParams(location.search).get("api") || "")) || "https://mutxri-terminal.onrender.com";
  var gate = document.getElementById("authGate");
  var q = new URLSearchParams(location.search);
  // landing previews (view= modes) and embedded iframes are not gated
  if(q.get("view") || window.self !== window.top){ if(gate) gate.remove(); return; }
  var mode = "login";
  function show(){ if(gate) gate.style.display = "flex"; }
  function hide(){ if(gate) gate.remove(); }
  function msg(t, ok){ var m = document.getElementById("gateMsg"); if(!m) return; m.textContent = t || ""; m.className = "gate-msg" + (ok ? " ok" : ""); }
  // OAuth callback: ?oauth=<provider>&code=<one-time> -> trade for a session token
  var oauthP = q.get("oauth"), oauthCode = q.get("code");
  if(oauthP && oauthCode){
    msg("Completing sign-in…");
    fetch(AUTH_API + "/api/auth/oauth/exchange", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code: oauthCode})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .then(function(d){
        if(d && d.ok){ try{ localStorage.setItem("mt_token", d.token || ""); localStorage.setItem("mt_email", d.email || ""); }catch(e){} }
        var sp = new URLSearchParams(location.search); sp.delete("oauth"); sp.delete("code");
        try{ history.replaceState({}, "", location.pathname + (sp.toString() ? "?" + sp.toString() : "")); }catch(e){}
        check();
      })
      .catch(function(){ check(); });
    return;
  }
  window.gateSocial = function(provider){
    msg("Connecting to " + provider + "…");
    fetch(AUTH_API + "/api/auth/oauth/" + provider + "/start")
      .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"could not reach server"}; }); })
      .then(function(d){
        if(d && d.ok && d.url){ window.location.href = d.url; }
        else { msg((d && d.error) ? d.error : "Sign-in is not available right now."); }
      })
      .catch(function(){ msg("Could not reach the sign-in server."); });
  };
  window.gateMode = function(m){
    mode = m;
    document.querySelectorAll(".gate-tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-gmode") === m); });
    var nm = document.getElementById("gateNameWrap"); if(nm) nm.style.display = (m === "signup") ? "block" : "none";
    var btn = document.querySelector(".gate-btn"); if(btn) btn.textContent = (m === "signup") ? "CREATE ACCOUNT" : "SIGN IN";
  };
  function tok(){ try{ return localStorage.getItem("mt_token") || ""; }catch(e){ return ""; } }
  function check(){
    var t = tok();
    if(!t){ show(); return; }
    msg("Verifying session…");
    fetch(AUTH_API + "/api/auth/me", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: t})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .then(function(d){ if(d && d.ok){ hide(); } else { show(); msg("Session expired. Sign in to continue."); } })
      .catch(function(){ show(); msg("Could not reach the sign-in server. Check your connection and try again."); });
  }
  window.gateSubmit = function(){
    var email = (document.getElementById("gateEmail").value || "").trim();
    var pwd = document.getElementById("gatePwd").value || "";
    var name = document.getElementById("gateName") ? document.getElementById("gateName").value.trim() : "";
    if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg("Enter a valid email address."); return; }
    if(!pwd){ msg("Enter your password."); return; }
    if(mode === "signup" && pwd.length < 8){ msg("Password must be at least 8 characters."); return; }
    var payload = {email: email, password: pwd};
    if(mode === "signup" && name) payload.name = name;
    msg(mode === "login" ? "Signing in…" : "Creating your account…");
    fetch(AUTH_API + "/api/auth/" + (mode === "login" ? "login" : "signup"), {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"server error"}; }); })
      .then(function(d){
        if(d && d.ok){
          try{ localStorage.setItem("mt_token", d.token || ""); localStorage.setItem("mt_email", d.email || ""); }catch(e){}
          msg("Welcome. Loading the terminal…", true);
          setTimeout(hide, 600);
        } else {
          msg((d && d.error) ? d.error : "Sign in failed. Try again.");
        }
      })
      .catch(function(){ msg("Could not reach the sign-in server. Try again shortly."); });
  };
  check();
})();
</script>

<script>

// ===== BACKEND CONFIG (GitHub Pages deployment) =====
// Empty string = local/snapshot mode. Set to deployed backend URL (NO trailing
// slash) to route all /api/* calls to the live server.
// API_BASE: Render backend URL. Auto-detected: ?api= param > window.AUTH_API
// (set by landing) > default Render service. Empty = snapshot mode.
const API_BASE = (function(){
  try{
    var q = new URLSearchParams(location.search).get("api");
    if(q) return q;
    if(window.AUTH_API) return window.AUTH_API;
  }catch(e){}
  return "";
})();
const __origFetch = window.fetch;
window.fetch = function(url, opts){
  const u = String(url);
  const isApi = u.indexOf('/api/') === 0;
  if(isApi && API_BASE){
    return __origFetch(API_BASE + u, opts);
  }
  return __origFetch(url, opts);
};
window.API_BASE = API_BASE;
// ===== END BACKEND CONFIG =====

// ===== App state =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let currentEx = 'JSE';
// support ?ex=NGX deep-link (landing dropdown passes the exchange)
try{
  const _pex = new URLSearchParams(location.search).get('ex');
  if(_pex && ['JSE','EGX','NGX','NSE'].includes(_pex.toUpperCase())) currentEx = _pex.toUpperCase();
  const _pp = new URLSearchParams(location.search).get('panel');

  if(_rails === '0') document.documentElement.classList.add('no-rails');

  if(_view){
    document.documentElement.classList.add('view-' + _view);
    if(_view === 'watchlist'){
      document.documentElement.classList.add('no-rails');
      document.documentElement.classList.add('hide-chrome');
      document.documentElement.classList.add('hide-panel');
      document.documentElement.classList.add('hide-tape');
    }
    if(_view === 'panel'){
      document.documentElement.classList.add('no-rails');
      document.documentElement.classList.add('hide-chrome');
      document.documentElement.classList.add('hide-tape');

    if(_view === 'info'){
      document.documentElement.classList.add('no-rails');
      document.documentElement.classList.add('hide-chrome');
      document.documentElement.classList.add('hide-panel');

let listing = {};

// ===== Company logos =====
let LOGO_MAP = {};
try{
  fetch((window.API_BASE ? window.API_BASE : '') + 'static_data/logos.json')
    .then(r => r.ok ? r.json() : Promise.reject())

}catch(e){}

// ===== company_info cache (fetched once, reused) =====
window.__CINFO = null; window.__CINFO_P = null;
function loadCompanyInfo(){
  if(window.__CINFO) return Promise.resolve(window.__CINFO);
  if(window.__CINFO_P) return window.__CINFO_P;
  window.__CINFO_P = fetch((window.API_BASE ? window.API_BASE : '') + 'static_data/company_info.json')
    .then(r => { if(!r.ok) throw 0; return r.json(); })
    .then(d => { window.__CINFO = d || {}; window.__CINFO_P = null; return window.__CINFO; })
    .catch(e => { window.__CINFO_P = null; throw e; });

}
// ===== Company CEOs (Wikipedia-verified) =====
window.__CEOS = {};
try{
  fetch((window.API_BASE ? window.API_BASE : '') + 'static_data/ceos.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { window.__CEOS = d || {}; })
    .catch(() => {});
}catch(e){}

// ===== Clock (exchange capital-city timezone) =====
const EX_TZ = {
  JSE: {tz: 'Africa/Johannesburg', city: 'JHB'},
  EGX: {tz: 'Africa/Cairo',        city: 'CAI'},
  NGX: {tz: 'Africa/Lagos',        city: 'LOS'},
  NSE: {tz: 'Africa/Nairobi',      city: 'NBO'},
};
function clockTZ(){
  const ex = (typeof currentEx !== 'undefined' ? currentEx : 'JSE');
  const info = EX_TZ[ex] || EX_TZ.JSE;
  try{
    const d = new Date();
    const time = d.toLocaleTimeString('en-GB', {timeZone: info.tz, hour12: false});
    const date = d.toLocaleDateString('en-GB', {timeZone: info.tz, day: '2-digit', month: 'short'});
    $('clock').textContent = time + ' ' + info.city;
    $('clock').title = date + ' · ' + info.tz;
  }catch(e){
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-GB', {hour12:false});
  }
}
setInterval(clockTZ, 1000);
clockTZ();

// ===== Tabs (Claude's panels, untouched, embedded) =====
let PANELS = [
  {id:'heatmap', label:'HEATMAP', url:'features/panels/afri_heatmap.html'},
  {id:'screener',label:'SCREENER', url:'features/panels/afri_screener.html'},
  {id:'financials',label:'FINANCIALS', url:'features/panels/afri_financials.html'},
  {id:'reg',     label:'REG',      url:'features/panels/afri_reg.html'},
  {id:'corp',    label:'CORP',     url:'features/panels/afri_corp.html'},
  {id:'news',    label:'NEWS',     url:'features/panels/afri_news.html'},
  {id:'bot',     label:'BOT',      url:'features/panels/afri_bot.html'},
  {id:'glco',    label:'GLCO',     url:'features/panels/afri_glco.html'},
  {id:'bnd',     label:'BND',      url:'features/panels/afri_bnd.html'},
  {id:'fx',      label:'FX',       url:'features/panels/afri_fx.html'},
  {id:'tas',     label:'TAS',      url:'features/panels/afri_tas.html'},
  {id:'ratings', label:'RATINGS',  url:'features/panels/afri_ratings.html'},
];
// restore the user's saved tab order (workflow persistence)
try{
  const saved = localStorage.getItem('mt_tabs');
  if(saved){
    const ids = saved.split(',');
    const byId = {};
    PANELS.forEach(p => { byId[p.id] = p; });
    const reordered = ids.map(id => byId[id]).filter(Boolean);
    if(reordered.length === PANELS.length) PANELS = reordered;
  }
}catch(e){}
// panel URL with the current exchange appended (?ex=NGX) so EVERY panel
// loads that exchange's data when opened
function panelUrl(p){
  return p.url + (p.url.indexOf('?') >= 0 ? '&' : '?') + 'ex=' + currentEx + '&v=' + Date.now();
}
// render the center panel tabs (rebuilt when the user drags them into a new order)
function renderTabs(){
  const nav = $('centerTabs');
  nav.innerHTML = '';
  PANELS.forEach((p, i) => {
    const t = document.createElement('div');
    t.className = 'ctab' + (i === 0 ? ' active' : '');
    t.textContent = p.label;
    t.draggable = true;
    t.title = 'drag to reorder panel';
    t.onclick = () => {
      document.querySelectorAll('.ctab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      $('stageFrame').src = panelUrl(p);
    };
    nav.appendChild(t);
  });
}
// ===== drag-and-drop: arrange the workspace like Godel =====
// columns: drag the watchlist / info grip to swap which side each sits on
(function(){
  // keep the center panel in the 1fr middle slot; the two rails swap around it
  function setColOrder(first){
    const main = document.querySelector('.main');
    const watch = document.getElementById('colWatch');
    const info = document.getElementById('colInfo');
    const center = document.getElementById('colCenter');
    main.appendChild(center);
    main.appendChild(first === 'info' ? watch : info);
    main.insertBefore(first === 'info' ? info : watch, main.firstChild);
  }
  function bindColDrag(){
    let dragCol = null;
    document.querySelectorAll('.dgrip').forEach(g => {
      g.addEventListener('dragstart', e => {
        dragCol = g.getAttribute('data-col');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', dragCol); }catch(err){}
        g.classList.add('dragging');
      });
      g.addEventListener('dragend', () => {
        dragCol = null;
        document.querySelectorAll('.dgrip').forEach(x => x.classList.remove('dragging'));
        document.querySelectorAll('#colWatch, #colInfo').forEach(x => x.classList.remove('drop-ok'));
      });
    });
    ['colWatch', 'colInfo'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('dragover', e => {
        if(dragCol && dragCol !== id.replace('col','').toLowerCase()){ e.preventDefault(); el.classList.add('drop-ok'); }
      });
      el.addEventListener('dragleave', () => el.classList.remove('drop-ok'));
      el.addEventListener('drop', e => {
        e.preventDefault();
        el.classList.remove('drop-ok');
        if(!dragCol) return;
        const target = id.replace('col','').toLowerCase();
        if(dragCol !== target){
          setColOrder(dragCol);  // the dragged rail moves to the left side
          try{ localStorage.setItem('mt_cols', dragCol); }catch(err){}
        }
        dragCol = null;
      });
    });
  }
  // restore the saved rail order
  try{
    const cols = localStorage.getItem('mt_cols');
    if(cols) setColOrder(cols.indexOf('info') === 0 ? 'info' : 'watch');
  }catch(e){}
  // ===== resize the rails: drag the divider between panels =====
  (function(){
    const main = document.querySelector('.main');
    function cur(v, dflt){ const x = parseFloat(getComputedStyle(main).getPropertyValue(v)); return isNaN(x) ? dflt : x; }
    function restoreSizes(){
      try{
        const s = (localStorage.getItem('mt_sizes') || '').split(',');
        if(s.length < 2) return;
        const vw = window.innerWidth;
        const wl = Math.min(parseInt(s[0], 10) || 232, Math.max(180, vw - 420));
        const ir = Math.min(parseInt(s[1], 10) || 288, Math.max(180, vw - wl - 380));
        main.style.setProperty('--wW', Math.max(180, wl) + 'px');
        main.style.setProperty('--wI', Math.max(180, ir) + 'px');
      }catch(e){}
    }
    restoreSizes();
    function begin(side, e){
      e.preventDefault();
      const startX = e.clientX, wL = cur('--wW', 232), wI = cur('--wI', 288);
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;cursor:col-resize;';
      document.body.appendChild(ov);
      function move(ev){
        const dx = ev.clientX - startX;
        if(side === 'L'){
          const maxW = Math.max(180, window.innerWidth - wI - 380);
          main.style.setProperty('--wW', Math.min(maxW, Math.max(180, wL + dx)) + 'px');
        }else{
          const maxW = Math.max(180, window.innerWidth - wL - 380);
          main.style.setProperty('--wI', Math.min(maxW, Math.max(180, wI - dx)) + 'px');
        }
      }
      function end(){
        ov.remove();
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', end);
        try{ localStorage.setItem('mt_sizes', Math.round(cur('--wW', 232)) + ',' + Math.round(cur('--wI', 288))); }catch(e2){}
      }
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }
    const l = document.getElementById('rszL'), r = document.getElementById('rszR');
    if(l) l.addEventListener('mousedown', function(e){ begin('L', e); });
    if(r) r.addEventListener('mousedown', function(e){ begin('R', e); });
  })();
  // tab reordering
  let dragTab = null;
  document.addEventListener('dragstart', e => {
    if(e.target.classList.contains('ctab')) dragTab = Array.prototype.indexOf.call(e.target.parentNode.children, e.target);
  });
  document.addEventListener('dragover', e => {
    if(dragTab !== null && e.target.classList.contains('ctab')){ e.preventDefault(); }
  });
  document.addEventListener('drop', e => {
    if(dragTab === null || !e.target.classList.contains('ctab')) return;
    e.preventDefault();
    const to = Array.prototype.indexOf.call(e.target.parentNode.children, e.target);
    const from = dragTab;
    if(from !== to && from >= 0 && to >= 0){
      const moved = PANELS.splice(from, 1)[0];
      PANELS.splice(to, 0, moved);
      try{ localStorage.setItem('mt_tabs', PANELS.map(p => p.id).join(',')); }catch(err){}
      renderTabs();
    }
    dragTab = null;
  });
  document.addEventListener('dragend', () => { dragTab = null; });
  bindColDrag();
})();
renderTabs();
// load the default panel WITH the current exchange
// (?panel= deep-link support for the landing showcase; unknown panels fall back to default)
let __startIdx = 0;
if(window.__INIT_PANEL){
  const __pi = PANELS.findIndex(p => p.id === window.__INIT_PANEL);
  if(__pi >= 0) __startIdx = __pi;
}
$('stageFrame').src = panelUrl(PANELS[__startIdx]);
if(__startIdx > 0){
  const __tabs = document.querySelectorAll('.ctab');
  if(__tabs[__startIdx]){ __tabs.forEach(x => x.classList.remove('active')); __tabs[__startIdx].classList.add('active'); }
}

// ===== auto-open a security from ?sym= (landing showcase) =====
if(window.__INIT_SYM){
  const __tryOpen = setInterval(function(){
    if(window.openStock && document.querySelector('#wlList .wl-row')){
      clearInterval(__tryOpen);
      try{ window.openStock(window.__INIT_SYM); }catch(e){}
    }
  }, 800);
}

// ===== Load listing =====
async function loadListing(ex){
  try{
    const url = window.API_BASE ? ('/api/listing?exchange=' + ex) : ('static_data/listing_' + ex + '.json');
    const r = await fetch(url);
    const d = await r.json();
    listing[ex] = d.stocks || [];
    // static mode: overlay the freshest market snapshot prices onto the listing
    // so the watchlist shows the SAME prices as the info sheet (no stale listing)
    if(!window.API_BASE){
      try{
        const mr = await fetch('static_data/market_' + ex + '.json');
        const md = await mr.json();
        const byTkr = {};
        (md.stocks || []).forEach(s => { byTkr[s.ticker || s.sym] = s; });
        listing[ex] = listing[ex].map(s => {
          const tkr = s.ticker || s.code || (s.sym || '').split('.')[0];
          const m = byTkr[tkr] || byTkr[s.sym] || {};
          if(m.price != null){
            return Object.assign({}, s, {
              price: m.price, chgPct: m.chgPct, volume: m.volume,
              currency: m.currency || s.currency,
              sym: s.sym || m.sym || tkr,
              high: m.high, low: m.low, open: m.open, prevClose: m.prevClose,
              turnover: m.turnover, marketCap: m.marketCap
            });
          }
          return s;
        });
      }catch(e2){ console.error('market overlay fail', e2); }
    }
    $('wlEx').textContent = ex + ' · ' + listing[ex].length;
    renderWatchlist($('q').value);
    buildTape(ex);            // tape now shows the new exchange immediately
    primeQuotes(ex);          // then refresh with live quotes
  }catch(e){ console.error('listing fail', e); }
}

function stockTicker(s){
  return s.ticker || s.short || s.code || (s.sym || '').split('.')[0] || (s.name || '').split(' ')[0].toUpperCase();
}

function renderWatchlist(filter){
  const list = listing[currentEx] || [];
  const f = (filter || '').toUpperCase();
  const rows = f ? list.filter(s => stockTicker(s).includes(f) || (s.name||'').toUpperCase().includes(f)) : list.filter(s => s.instrument !== 'structured');
  const el = $('wlList');
  el.innerHTML = rows.slice(0, 300).map(s => {
    // JSE/EGX: quote from cache; NGX/NSE: EOD data embedded in the listing
    const q = quotes[s.sym] || {};
    const price = q.price != null ? q.price : s.price;
    const chg = q.changePct != null ? q.changePct : s.chgPct;
    const vol = q.volume != null ? q.volume : s.volume;
    const cur = s.currency || (q.currency || '');
    const pr = price != null ? Number(price).toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
    const cls = chg === null || chg === undefined ? '' : (chg >= 0 ? 'up' : 'down');
    const sign = chg === null || chg === undefined ? '' : TickerFix.fmtPct(chg);
    const sym = stockTicker(s);
    const volTxt = vol != null ? (Number(String(vol).replace(/,/g,'')).toLocaleString() || String(vol)) : '';
    // logo: official domain -> favicon service (or direct image URL); monogram fallback (no broken images)
    const rawLogo = LOGO_MAP[s.sym] || LOGO_MAP[s.ticker] || LOGO_MAP[sym] || '';
    const isUrl = /^https?:\/\//i.test(rawLogo);
    const dom = rawLogo.replace(/^www\./, '');
    const logoSrc = isUrl ? rawLogo : `https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=64`;
    const logoHtml = rawLogo
      ? `<img class="wl-logo" loading="lazy" src="${logoSrc}" alt="" onerror="this.outerHTML='<span class=&quot;wl-mono&quot;>${esc(sym[0]||'?')}</span>'" onload="if(this.naturalWidth<=16&&this.naturalHeight<=16)this.outerHTML='<span class=&quot;wl-mono&quot;>${esc(sym[0]||'?')}</span>'" >`
      : `<span class="wl-mono">${esc(sym[0]||'?')}</span>`;
    return `<div class="wl-row" onclick="openStock('${esc(s.sym || s.ticker || s.name || '')}')">
      <span class="wl-logo-cell">${logoHtml}</span>
      <span class="wl-main">
        <span class="sym">${esc(sym)}</span>
        <span class="nm">${esc(s.name||'')}</span>
      </span>
      <span class="wl-price">
        <span class="pr">${pr} <small style="color:var(--tx3)">${esc(cur)}</small></span>
        <span class="chg ${cls}">${sign}</span>
      </span>
    </div>`;
  }).join('') || '<div style="padding:20px;color:var(--tx3);font-family:var(--mono);font-size:11px">no stocks</div>';
}

// ===== Quotes =====
let quotes = {};
async function primeQuotes(ex){
  const syms = (listing[ex]||[]).filter(s => s.sym).slice(0, 80).map(s => s.sym);
  if(!syms.length) return;
  // static mode (GitHub Pages): load the per-exchange market snapshot so the
  // watchlist shows the REAL current data (official feeds), not stale listing prices
  if(!window.API_BASE){
    try{
      const r = await fetch('static_data/market_' + ex + '.json');
      const d = await r.json();
      (d.stocks || []).forEach(s => {
        quotes[s.sym] = { price: s.price, changePct: s.chgPct, volume: s.volume, currency: s.currency };
        if(s.ticker) quotes[s.ticker] = quotes[s.sym];
      });
      renderWatchlist($('q').value);
      buildTape(ex);
      return;
    }catch(e){ console.error('market snapshot fail', e); }
  }
  try{
    const r = await fetch('/api/quotes?symbols=' + syms.join(','));
    const d = await r.json();
    Object.assign(quotes, d);
    renderWatchlist($('q').value);
    buildTape(ex);
  }catch(e){ console.error('quotes fail', e); }
}

// ===== Ticker tape =====
function buildTape(ex){
  // live-quotes version: refresh with fetched quotes
  buildTapeFromListing(ex);
}

// ===== Exchange tabs (only the selected exchange shows - clean UI) =====
const EX_FULL = {
  JSE: {name: 'Johannesburg', flag: 'ZA'},
  EGX: {name: 'Cairo', flag: 'EG'},
  NGX: {name: 'Lagos', flag: 'NG'},
  NSE: {name: 'Nairobi', flag: 'KE'},
};
function renderExchTabs(){
  const nav = $('exchTabs');
  if(!nav) return;
  // single tab: just the current exchange (no other initials shown)
  const info = EX_FULL[currentEx] || {name: currentEx, flag: ''};
  nav.innerHTML = '<button class="exch-tab active" data-ex="' + esc(currentEx) + '" title="' + esc(info.name) + ' · ' + esc(currentEx) + '">' +
    '<span class="exch-flag">' + esc(info.flag) + '</span> ' + esc(currentEx) +
    '<span class="exch-full">' + esc(info.name) + '</span></button>';
}
function switchExchange(ex){
  currentEx = ex;
  // reload the open panel for the new exchange (every panel is ?ex= aware)
  const _cur = $('stageFrame').src;
  $('stageFrame').src = _cur.replace(/([?&])ex=[A-Za-z]+/, '$1ex=' + currentEx);
  if(!listing[currentEx]) {
    // immediate tape from the new exchange's own data, then refresh
    buildTapeFromListing(currentEx);
    renderWatchlist($('q').value);
    loadListing(currentEx);
  } else {
    buildTapeFromListing(currentEx);
    renderWatchlist($('q').value);
    primeQuotes(currentEx);
  }
}

// ===== Tape helpers =====
function tapeItem(s){
  const q = quotes[s.sym] || {};
  const price = q.price != null ? q.price : s.price;
  const chg = q.changePct != null ? q.changePct : s.chgPct;
  if(price == null) return '';
  const tkr = stockTicker(s);
  const cls = TickerFix.pctClass(chg);
  const sign = chg >= 0 ? '+' : '';
  return `<span class="tape-item"><span class="sym">${esc(tkr)}</span><span class="pr">${Number(price).toLocaleString(undefined,{maximumFractionDigits:2})}</span><span class="chg ${cls}">${TickerFix.fmtPct(chg)}</span></span>`;
}
function buildTapeFromListing(ex){
  // instant: use the listing's own price data (EOD) - no network wait
  // only real common stocks (skip structured notes, prefs, bonds, ETFs)
  const syms = (listing[ex]||[]).filter(s => (s.instrument !== 'structured') && (s.sym || s.ticker)).slice(0, 40);
  const items = syms.map(tapeItem).filter(Boolean).join('');
  $('tape').innerHTML = items + items;
  // real indices on top, filtered to the CURRENT exchange only
  // (clean UI: JSE selection shows only JSE indices, no EGX/NGX/NSE tape)
  TickerFix.fetchJSONSafe('static_data/indices.json').then(res => {
    if(!res.ok) return;
    const d = res.data;
    if(!d || !d.entries || !d.entries.length) return;
    const ix = d.entries
      .filter(e => (e.market || '').toUpperCase() === (ex || '').toUpperCase())
      .map(e => {
      const cls = e.changePct >= 0 ? 'up' : 'down';
      const sign = e.changePct >= 0 ? '+' : '';
      const pct = e.changePct != null ? TickerFix.fmtPct(e.changePct) : '—';
      const price = e.price != null ? e.price.toLocaleString(undefined,{maximumFractionDigits:2}) : '';
      const tag = e.kind === 'basket' ? ' (basket)' : '';
      return `<span class="tape-item" style="color:var(--tx2)"><b style="color:var(--acc)">${esc(e.label)}${esc(tag)}</b> <span style="color:#fff">${esc(price)}</span> <span class="${cls}">${esc(pct)}</span></span>`;
    }).join('');
    $('tape').innerHTML = ix + (items + items);
  }).catch(() => {});
}

// ===== Command bar =====
$('cmd').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const v = $('cmd').value.trim().toUpperCase();
  $('cmd').value = '';
  if(!v) return;
  const parts = v.split(' ');
  const code = parts[parts.length - 1];
  const idx = PANELS.findIndex(p => p.id === code.toLowerCase() || p.label === code);
  if(idx >= 0){
    document.querySelectorAll('.ctab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.ctab')[idx].classList.add('active');
    $('stageFrame').src = panelUrl(PANELS[idx]);
  } else if(v === 'HELP'){
    $('rightInfo').innerHTML = PANELS.map(p => `<div style="padding:4px 0"><b style="color:var(--acc)">${p.label}</b> <span style="color:var(--tx3)">→ ${p.url.split('/').pop()}</span></div>`).join('') +
      '<div style="padding:8px 0;color:var(--tx3)">Type a panel code (HEATMAP, SCREEN, FIN, REG, GLCO, BND, FX, TAS, RATINGS) then Enter.</div>';
  } else {
    $('rightInfo').innerHTML = `<div style="color:var(--down)">unknown: ${esc(v)}</div>`;
  }
});

// ===== Static-market panel (snapshot mode): full investor info sheet =====
function renderMarketStatic(rec, info){
  const chg = rec.chgPct;
  const cls = chg === null || chg === undefined ? '' : (chg >= 0 ? 'up' : 'down');
  const sign = chg === null || chg === undefined ? '' : (chg >= 0 ? '+' : '');
  const px = rec.price != null ? Number(rec.price).toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
  const chgTxt = chg === null || chg === undefined ? '' : sign + Number(chg).toFixed(2) + '%';
  const vol = rec.volume != null ? Number(String(rec.volume).replace(/,/g,'')).toLocaleString() : '—';
  const i = info || {};
  const dash = '—';
  const row = (k, v) => `<span>${esc(k)}</span><span>${esc(v != null && v !== '' ? v : dash)}</span>`;
  const fmtShares = (n) => {
    if(n == null || n === '') return dash;
    const x = Number(n);
    if(!isFinite(x)) return String(n);
    const abs = Math.abs(x);
    if(abs >= 1e12) return (x/1e12).toFixed(2).replace(/\.?0+$/, '') + 'T';
    if(abs >= 1e9)  return (x/1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
    if(abs >= 1e6)  return (x/1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
    return x.toLocaleString();
  };
  // dividends compact
  let divTxt = dash;
  if(Array.isArray(i.dividends) && i.dividends.length){
    const d = i.dividends;
    const last = d[d.length-1];
    divTxt = (typeof last === 'object' && last !== null) ? (last.year ? 'FY' + last.year : '') + ' ' + (last.amount != null ? last.amount : '') : String(d.length) + ' paid';
  }
  const linkify = function(arr){
    if(!Array.isArray(arr) || !arr.length) return dash;
    return arr.map(function(x){
      var s = String(x).trim();
      if(!s) return '';
      var m = s.match(/^([A-Z0-9][A-Z0-9.\-]{1,14})/);
      if(m){ return '<a class="qlink" data-goto="' + m[1] + '">' + esc(m[1]) + '</a>' + esc(s.slice(m[1].length)); }
      return esc(s);
    }).join(', ');
  };
  let html = `
    <div class="qhead">
      <div class="qsym">${esc(rec.ticker || sym0(rec))}</div>
      <div class="qname">${esc(rec.name||i.name||'')}</div>
      <div class="qpx">${px} <span style="font-size:11px;color:var(--tx3)">${esc(rec.currency||'')}</span></div>
      <div class="qchg ${cls}">${chgTxt}</div>
    </div>
    <div class="qgrid">
      ${row('PRICE', px)}
      ${row('CHANGE', chgTxt || dash)}
      ${row('VOLUME', vol)}
      ${row('SECTOR', rec.sector || i.sector || dash)}
      ${row('COUNTRY', i.country || dash)}
      ${row('CEO', window.__CEOS && window.__CEOS[rec.sym] ? window.__CEOS[rec.sym] : (window.__CEOS && window.__CEOS[rec.ticker] ? window.__CEOS[rec.ticker] : dash))}
      ${row('COMPETITORS', linkify(i.competitors))}
      ${row('CUSTOMERS', linkify(i.customers))}
      ${row('PARTNERS', linkify(i.partners))}
      ${row('SUPPLIERS', linkify(i.suppliers))}
      ${row('FOUNDED', i.founded || dash)}
      ${row('LISTED', i.listed || dash)}
      ${row('YEAR END', rec.yearEnd || i.year_end || dash)}
      ${row('52W RANGE', rec.range52w || dash)}
      ${row('OPEN', rec.open || dash)}
      ${row('PREV CLOSE', rec.prevClose || dash)}
      ${row('TURNOVER', rec.turnover || dash)}
      ${row('SHARES', fmtShares(rec.sharesIssued))}
      ${row('MKT CAP', rec.marketCap || dash)}
      ${row('EXCHANGE', rec.exchange || i.exchange || dash)}
      ${row('PHONE', i.phone || dash)}
      ${row('TRANSFER SEC', i.transfer_secretary || dash)}
      ${row('DIVIDENDS', divTxt)}
      ${row('STATEMENTS', i.statements ? 'filed' : dash)}
    </div>`;
  if(i.description){
    html += `<div style="padding:10px 16px;border-top:1px solid var(--line);font-family:var(--ui);font-size:11px;color:var(--tx2);line-height:1.55">${esc(i.description)}</div>`;
  }
  if(Array.isArray(i.shareholders) && i.shareholders.length){
    html += `<div style="padding:8px 16px 4px;border-top:1px solid var(--line);color:var(--tx3);font-size:10px;letter-spacing:.1em;font-weight:700">MAJOR SHAREHOLDERS</div>`;
    i.shareholders.forEach(sh => {
      const h = (typeof sh === 'object' && sh !== null) ? sh.holder : sh;
      const s = (typeof sh === 'object' && sh !== null) ? (sh.stake || sh.pct || '') : '';
      html += `<div style="display:flex;justify-content:space-between;padding:3px 16px;font-size:10px"><span style="color:var(--tx2)">${esc(String(h))}</span><span style="color:var(--acc);font-family:var(--mono)">${esc(String(s))}</span></div>`;
    });
  }
  html += `<div style="padding:12px 16px;color:var(--tx3);font-size:9px;border-top:1px solid var(--line)">Snapshot data · live quotes need the backend</div>`;
  $('rightInfo').innerHTML = html;
  // financials summary from the collected statement files (static, honest)
  try{
    var _fsym = String(rec.sym || rec.ticker || '').replace(/\//g, '_');
    if(_fsym){
      var _finName = (rec.name || '').trim();
      var _finEx = String(currentEx || '').toUpperCase();
      var _renderFin = (d) => {
        if(!d || d.available === false) return;
        var rows = d.rows || [];
        var periods = d.periods || [];
        var cur = d.currency || '';
        var fnum = (n) => {
          if(n == null || !isFinite(Number(n))) return '—';
          var x = Number(n), abs = Math.abs(x);
          if(abs >= 1e9) return (x/1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
          if(abs >= 1e6) return (x/1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
          if(abs >= 1e3) return (x/1e3).toFixed(1).replace(/\.?0+$/, '') + 'K';
          return x.toLocaleString(undefined, {maximumFractionDigits: 2});
        };
        var want = ['Revenue','Gross Profit','Operating Profit (EBIT)','Net Profit','EPS'];
        var pick = {};
        rows.forEach(rr => { if(want.indexOf(rr.label) >= 0) pick[rr.label] = rr.values; });
        var year = periods[0] || '';
        var h = `<div style="padding:8px 16px 4px;border-top:1px solid var(--line);color:var(--acc);font-size:10px;letter-spacing:.1em;font-weight:700">FINANCIALS · ${esc(year)}</div>`;
        var keys = ['Revenue','Gross Profit','Operating Profit (EBIT)','Net Profit','EPS'];
        var any = false;
        keys.forEach(k => {
          var v = pick[k] && pick[k][0];
          if(v == null) return;
          any = true;
          h += `<div style="display:flex;justify-content:space-between;padding:3px 16px;font-size:10px"><span style="color:var(--tx2)">${esc(k)}</span><span style="color:var(--tx);font-family:var(--mono)">${esc(fnum(v))}${cur ? ' ' + esc(cur) : ''}</span></div>`;
        });
        if(any){
          var ri = $('rightInfo');
          if(ri) ri.insertAdjacentHTML('beforeend', h + `<div style="padding:12px 16px;color:var(--tx3);font-size:9px;border-top:1px solid var(--line)">From filed statements · full detail in FINANCIALS</div>`);
        }
      };
      var _fetchInc = (k) => fetch('static_data/financials/' + encodeURIComponent(k) + '__income.json').then(r => r.ok ? r.json() : Promise.reject());
      _fetchInc(_fsym)
        .then(_renderFin)
        .catch(function(){
          // renamed securities (e.g. ABBEYBANK -> ABBEYBDS): match the index by name + exchange
          return fetch('static_data/financials_index.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(function(idx){
              if(!idx || typeof idx !== 'object') throw 0;
              var key = null;
              for(var k in idx){
                var e = idx[k];
                if(k === _fsym){ key = k; break; }
                if(e && _finName && e.exchange === _finEx && String(e.name || '').toLowerCase() === _finName.toLowerCase()){ key = k; break; }
              }
              if(!key) throw 0;
              return _fetchInc(key);
            });
        })
        .then(_renderFin)
        .catch(function(){});
    }
  }catch(e){}
}

// ===== in-window chart (view=watchlist previews only; normal terminal keeps info sheet) =====
let __wcChart = null, __wcSeries = null, __wcBars = [], __wcType = 'candle';
function wcRender(bars){
  const body = $('wcBody');
  if(!body) return;
  if(!bars || !bars.length){ body.innerHTML = '<div class="wc-load">No chart data for this security yet.</div>'; return; }
  __wcBars = bars;
  body.innerHTML = '';
  try{
    __wcChart = LightweightCharts.createChart(body, {
      layout:{background:{type:'solid',color:'#0a0a0a'},textColor:'#9a9a9a',fontFamily:'ui-monospace,Consolas,monospace'},
      grid:{vertLines:{color:'#141414'},horzLines:{color:'#141414'}},
      timeScale:{borderColor:'#262626'}, rightPriceScale:{borderColor:'#262626'}, crosshair:{mode:0},
      width: body.clientWidth || 640, height: 380
    });
    __wcChart.timeScale().fitContent();
  }catch(e){ body.innerHTML = '<div class="wc-load">Chart could not render.</div>'; return; }
  wcSetType('candle');
}
function wcSetType(t){
  __wcType = t;
  document.querySelectorAll('.wc-ct').forEach(b => b.classList.toggle('on', b.getAttribute('data-t') === t));
  if(!__wcChart) return;
  try{ __wcChart.removeSeries(__wcSeries); }catch(e){}
  const c = __wcBars;
  try{
    if(t === 'candle'){
      __wcSeries = __wcChart.addCandlestickSeries({ upColor:'#33e29a', downColor:'#ff5f56', borderVisible:false, wickUpColor:'#33e29a', wickDownColor:'#ff5f56' });
      __wcSeries.setData(c.map(b => ({ time: b.t, open: b.o, high: b.h, low: b.l, close: b.c })));
    } else if(t === 'line'){
      __wcSeries = __wcChart.addLineSeries({ color:'#33e29a', lineWidth: 2 });
      __wcSeries.setData(c.map(b => ({ time: b.t, value: b.c })));
    } else {
      __wcSeries = __wcChart.addAreaSeries({ lineColor:'#33e29a', topColor:'rgba(51,226,154,.25)', bottomColor:'rgba(51,226,154,0)' });
      __wcSeries.setData(c.map(b => ({ time: b.t, value: b.c })));
    }
    __wcChart.timeScale().fitContent();
  }catch(e){}
}

function openChartModal(sym){
  const m = $('wlChart'); if(!m) return;
  const ttl = $('wcTitle'); if(ttl) ttl.textContent = sym;
  m.style.display = 'flex';
  $('wcBody').innerHTML = '<div class="wc-load">Loading history…</div>';
  var histBase = String(sym).replace(/\//g, '_');
  try{
    if(currentEx === 'NSE' || currentEx === 'NGX'){ histBase = currentEx + '_' + String(sym).split('.')[0]; }
  }catch(e){}
  fetch('static_data/history/' + encodeURIComponent(histBase) + '.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => wcRender((d && d.bars) || []))
    .catch(() => fetch('static_data/history/' + encodeURIComponent(histBase) + '.max.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => wcRender((d && d.bars) || []))
      .catch(() => wcRender(null)));

function openStock(sym){
  if(!sym) return;
  try{ if(new URLSearchParams(location.search).get('view') === 'watchlist'){ openChartModal(sym); return; } }catch(e){}
  const ex = currentEx;
  const stock = (listing[ex]||[]).find(s => (s.sym||s.ticker||s.name) === sym || (s.sym||'') === sym);
  $('rightInfo').innerHTML = `<div style="padding:6px 0;color:var(--acc);font-weight:700">${esc(sym)}</div>
    <div style="padding:4px 0;color:var(--tx3)">Loading…</div>`;
  if(!window.API_BASE){
    fetch('static_data/market_' + ex + '.json').then(r => { if(!r.ok) throw 0; return r.json(); })
      .then(d => {
        const rows = d.stocks || [];
        const lr = (listing[ex]||[]).find(l => (l.sym||l.ticker||l.name) === sym);
        const rec = rows.find(x => x.sym === sym || x.ticker === sym || (x.name||'') === sym)
                || (lr ? rows.find(x => (x.name||'') && lr.name && String(x.name).toLowerCase() === String(lr.name).toLowerCase()) : null)
                || rows.find(x => (x.sym||'').split('.')[0] === sym.split('.')[0]);
        if(!rec){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx3);font-family:var(--mono);font-size:11px">no snapshot data for ${esc(sym)}</div>`; return; }
        // company info from company_info.json (cached, fetched once)
        loadCompanyInfo().then(ci => {
            let info = null;
            for (const k of [rec.sym, rec.ticker, (rec.sym||'').split('.')[0], (rec.name||'')]) {
              if (k && ci[k]) { info = ci[k]; break; }
            }
            renderMarketStatic(rec, info);
          })
          .catch(() => renderMarketStatic(rec, null));
      })
      .catch(() => { $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx3);font-family:var(--mono);font-size:11px">no market snapshot for ${esc(sym)}</div>`; });
    return;
  }
  fetch('/api/chart?symbol=' + encodeURIComponent(sym) + '&range=1y&interval=1d')
    .then(r => r.json())
    .then(d => {
      if(d.error){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--down);font-family:var(--mono);font-size:11px">${esc(d.error)}</div>`; return; }
      if(d.noData){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx2);font-family:var(--mono);font-size:11px">
        <div style="color:var(--acc);font-weight:700;margin-bottom:6px">${esc(sym)} · ${esc(d.name||'')}</div>
        <div style="color:var(--tx3);line-height:1.6">${esc(d.message||'No market data available for this security.')}</div></div>`; return; }
      try{ renderStockInfo(d, sym); }catch(e){ console.error('info fail', e); }
      try{ loadMetrics(sym, ex, stock && stock.name); }catch(e){ console.error('metrics fail', e); }
    })
    .catch(e => $('rightInfo').innerHTML = `<div style="color:var(--down)">${esc(String(e))}</div>`);
}

function loadMetrics(sym, ex, name){
  const params = new URLSearchParams({symbol: sym, exchange: ex||'', name: name||''});
  fetch('/api/metrics?' + params.toString())
    .then(r => r.json())
    .then(d => {
      if(d.error || !d.stock_price) return;
      let html = '<div style="padding:10px 12px;border-top:1px solid var(--line)">';
      html += `<div style="color:var(--acc);font-weight:700;font-size:11px;letter-spacing:.08em;padding-bottom:6px">FULL METRICS</div>`;

      // --- company description ---
      if(d.description){
        html += `<div style="font-size:11px;color:var(--tx2);line-height:1.55;padding:4px 0 8px">${esc(d.description)}</div>`;
      }

      const groups = [
        ['IDENTITY', [['Exchange', d.exchange], ['Country', d.country], ['Currency', d.currency], ['Sector', d.sector], ['Industry', d.industry], ['Founded', d.founded], ['Employees', d.employees != null ? Number(d.employees).toLocaleString() : null], ['Revenue', d.revenue != null ? fmtMoney(d.revenue) : null], ['ISIN', d.isin]]],
        ['PRICE', [['Stock Price', d.stock_price], ['Open', d.open_price], ['High', d.high_price], ['Low', d.low_price], ['Previous Close', d.previous_close], ['Volume', d.volume != null ? Number(d.volume).toLocaleString() : null], ['Avg Volume (20d)', d.avg_volume != null ? Number(d.avg_volume).toLocaleString() : null], ['Dollar Volume', d.dollar_volume != null ? Number(d.dollar_volume).toLocaleString(undefined,{maximumFractionDigits:0}) : null], ['Price Date', d.stock_price_date ? new Date(d.stock_price_date).toISOString().slice(0,10) : null]]],
        ['PRICE CHANGE', [['1D', d.price_change_1D], ['1W', d.price_change_1W], ['1M', d.price_change_1M], ['3M', d.price_change_3M], ['6M', d.price_change_6M], ['YTD', d.price_change_YTD], ['1Y', d.price_change_1Y], ['3Y', d.price_change_3Y], ['5Y', d.price_change_5Y], ['10Y', d.price_change_10Y], ['15Y', d.price_change_15Y], ['20Y', d.price_change_20Y]]],
        ['TOTAL RETURN', [['1W', d.total_return_1W], ['1M', d.total_return_1M], ['3M', d.total_return_3M], ['6M', d.total_return_6M], ['YTD', d.total_return_YTD], ['1Y', d.total_return_1Y], ['3Y', d.total_return_3Y], ['5Y', d.total_return_5Y], ['10Y', d.total_return_10Y], ['15Y', d.total_return_15Y], ['20Y', d.total_return_20Y]]],
        ['CAGR', [['1Y', d.return_cagr_1Y], ['3Y', d.return_cagr_3Y], ['5Y', d.return_cagr_5Y], ['10Y', d.return_cagr_10Y], ['15Y', d.return_cagr_15Y], ['20Y', d.return_cagr_20Y]]],
        ['RANGES', [['52W High', d.fifty_two_week_high], ['52W High Date', d.fifty_two_week_high_date ? new Date(d.fifty_two_week_high_date).toISOString().slice(0,10) : null], ['52W Low', d.fifty_two_week_low], ['52W Low Date', d.fifty_two_week_low_date ? new Date(d.fifty_two_week_low_date).toISOString().slice(0,10) : null], ['Change vs 52W High', d.price_change_52w_high], ['Change vs 52W Low', d.price_change_52w_low], ['Position in Range', d.position_in_range], ['All-Time High', d.all_time_high], ['ATH Date', d.all_time_high_date ? new Date(d.all_time_high_date).toISOString().slice(0,10) : null], ['ATH Change', d.all_time_high_change], ['All-Time Low', d.all_time_low], ['ATL Date', d.all_time_low_date ? new Date(d.all_time_low_date).toISOString().slice(0,10) : null], ['ATL Change', d.all_time_low_change]]],
        ['TECHNICAL', [['RSI (14)', d.rsi_14], ['Weekly RSI', d.rsi_weekly], ['Monthly RSI', d.rsi_monthly], ['ATR (14)', d.atr_14], ['Beta (5Y)', d.beta_5y], ['20-Day MA', d.ma_20], ['50-Day MA', d.ma_50], ['150-Day MA', d.ma_150], ['200-Day MA', d.ma_200], ['Price vs 20D MA', d.price_change_20d_ma], ['Price vs 50D MA', d.price_change_50d_ma], ['Price vs 150D MA', d.price_change_150d_ma], ['Price vs 200D MA', d.price_change_200d_ma], ['50 vs 200 MA', d.ma_50_vs_200]]],
        ['VALUATION (real)', [['PE Ratio', d.pe_ratio], ['Earnings Yield', d.earnings_yield], ['Gross Margin', d.gross_margin], ['Operating Margin', d.operating_margin], ['Profit Margin', d.profit_margin], ['FCF Margin', d.fcf_margin], ['ROA', d.return_on_assets], ['ROE', d.return_on_equity], ['Debt/Equity', d.debt_to_equity]]],
        ['DIVIDENDS', [['Yield', d.dividend_yield], ['DPS', d.dividend_per_share], ['Last Dividend', d.last_dividend], ['Growth', d.dividend_growth], ['Payment Years', d.dividend_payment_years]]],
      ];

      // financial statements section (income statement / balance sheet / cash flow)
      if(d.statements && d.statements.data){
        const s = d.statements.data;
        const period = (d.statements.period||'') + ' ' + (d.statements.year||'');
        const rows = [
          ['Revenue', s.revenue], ['Gross Profit', s.gross_profit], ['Operating Profit', s.operating_profit],
          ['Profit After Tax', s.profit_after_tax], ['EPS', s.eps], ['Total Assets', s.total_assets],
          ['Total Liabilities', s.total_liabilities], ['Shareholders Equity', s.shareholders_equity],
          ['Cash & Equivalents', s.cash_and_equivalents], ['Operating Cash Flow', s.operating_cash_flow],
          ['Investing Cash Flow', s.investing_cash_flow], ['Financing Cash Flow', s.financing_cash_flow],
          ['Dividends Paid', s.dividends_paid], ['Free Float', s.free_float ? s.free_float + '%' : null],
        ];
        const real = rows.filter(([,v]) => v !== null && v !== undefined);
        if(real.length){
          html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">FINANCIAL STATEMENTS <span style="color:var(--tx3);font-weight:400">· ${esc(period)} · ${esc(d.currency||'')}</span></div>`;
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--mono);font-size:10px">';
          real.forEach(([k, v]) => {
            const val = typeof v === 'number' ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v);
            html += `<span style="color:var(--tx3)">${esc(k)}</span><span style="text-align:right;color:var(--tx)">${esc(val)}</span>`;
          });
          html += '</div>';
          if(d.statements.url){
            html += `<div style="padding:4px 0 0;font-size:9px;color:var(--tx3)">filing available on company IR site</div>`;
          }
        }
      }

      groups.forEach(([title, rows]) => {
        const real = rows.filter(([,v]) => v !== null && v !== undefined);
        if(!real.length) return;
        html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">${title}</div>`;
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--mono);font-size:10px">';
        real.forEach(([k, v]) => {
          const val = typeof v === 'number' ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v);
          html += `<span style="color:var(--tx3)">${esc(k)}</span><span style="text-align:right;color:var(--tx)">${esc(val)}</span>`;
        });
        html += '</div>';
      });

      // ownership
      if(d.ownership && d.ownership.shareholders){
        html += `<div style="color:var(--tx3);font-size:10px;letter-spacing:.1em;padding:8px 0 4px;font-weight:700">MAJOR SHAREHOLDERS · ${esc(d.ownership.company||'')}</div>`;
        d.ownership.shareholders.forEach(sh => {
          html += `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px"><span style="color:var(--tx2)">${esc(sh.holder)}</span><span style="color:var(--acc);font-family:var(--mono)">${esc(sh.stake)}</span></div>`;
        });
        html += `<div style="padding:4px 0 0;color:var(--tx3);font-size:8px">${esc(d.ownership.source||'')}</div>`;
      }
      html += '</div>';
      $('rightInfo').insertAdjacentHTML('beforeend', html);
    })
    .catch(() => {});
}


function fmtMoney(v){
  // consistent money display: 12.3B / 950.0M / 4.3T - honest dash when missing
  if(v == null || v === '' || isNaN(v)) return '—';
  const f = Number(v);
  const sign = f < 0 ? '-' : '';
  const a = Math.abs(f);
  if(a >= 1e12) return sign + (a/1e12).toFixed(1) + 'T';
  if(a >= 1e9) return sign + (a/1e9).toFixed(1) + 'B';
  if(a >= 1e6) return sign + (a/1e6).toFixed(1) + 'M';
  if(a >= 1e3) return sign + (a/1e3).toFixed(1) + 'K';
  return sign + a.toFixed(1);
}

function renderStockInfo(d, sym){
  const price = d.regularMarketPrice != null ? d.regularMarketPrice.toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
  const prev = d.chartPreviousClose;
  const chg = (price !== '—' && prev) ? ((d.regularMarketPrice - prev) / prev * 100) : null;
  const chgTxt = chg === null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
  const chgCls = chg === null ? '' : (chg >= 0 ? 'up' : 'down');
  const bars = d.bars || [];
  const last = bars.length ? bars[bars.length-1] : null;
  const html = `
    <div style="padding:8px 12px;border-bottom:1px solid var(--line)">
      <div style="color:var(--acc);font-weight:700;font-size:15px">${esc(sym)}</div>
      <div style="color:var(--tx2);font-size:11px;padding:2px 0">${esc(d.name||'')}</div>
      <div style="font-size:20px;font-weight:700;padding:4px 0">${price} <span style="font-size:11px;color:var(--tx3)">${esc(d.currency||'')}</span></div>
      <div class="chg ${chgCls}" style="font-size:12px">${chgTxt}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:8px 0 2px;font-family:var(--mono);font-size:10px">
        <span style="color:var(--tx3)">OPEN</span><span style="text-align:right">${last && last.open != null ? last.open.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">HIGH</span><span style="text-align:right">${last && last.high != null ? last.high.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">LOW</span><span style="text-align:right">${last && last.low != null ? last.low.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">PREV CLOSE</span><span style="text-align:right">${prev != null ? prev.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">VOLUME</span><span style="text-align:right">${d.regularMarketVolume != null ? d.regularMarketVolume.toLocaleString() : (last && last.volume ? last.volume.toLocaleString() : '—')}</span>
        <span style="color:var(--tx3)">52W HIGH</span><span style="text-align:right">${d.fiftyTwoWeekHigh != null ? d.fiftyTwoWeekHigh.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">52W LOW</span><span style="text-align:right">${d.fiftyTwoWeekLow != null ? d.fiftyTwoWeekLow.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</span>
        <span style="color:var(--tx3)">STATE</span><span style="text-align:right">${esc(d.marketState||'?')}</span>
      </div>
    </div>`;
  $('rightInfo').innerHTML = html;
}

// ===== Init =====

loadListing(currentEx);  // honor ?ex= deep-link (defaults JSE)
