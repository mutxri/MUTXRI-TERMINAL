<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUTXRI TERMINAL — African Markets Terminal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link rel="icon" type="image/svg+xml" href="/mutxri_logo.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/mutxri_logo_256.png">
<link rel="apple-touch-icon" href="/mutxri_logo_256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxygen+Mono&family=Sofia+Sans+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Godel tokens — unchanged */
  --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
  --line:#1a1a1a; --line2:#262626;
  --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
  --acc:#33e29a; --acc2:#1ecfb0; --up:#33e29a; --down:#f87171; --warn:#e0a340;
  --mint-dim:rgba(51,226,154,.10); --mint-line:rgba(51,226,154,.35);
  /* refinement: one spacing scale, used everywhere */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --mono:'Oxygen Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Inter',system-ui,sans-serif;
  --brand:'Sofia Sans Semi Condensed','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.term{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:var(--s5);padding:0 var(--s4);height:52px;
  border-bottom:1px solid var(--line2);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:var(--s3);cursor:pointer}
.mark{width:30px;height:30px;border:1.5px solid var(--acc);border-radius:3px;
  display:grid;place-items:center;font-family:var(--brand);font-weight:700;
  font-size:14px;color:var(--acc);letter-spacing:.02em}
.brandname{font-family:var(--brand);font-weight:700;font-size:17px;letter-spacing:.14em}
.brandname small{display:block;font-size:8px;letter-spacing:.34em;color:var(--tx3);
  font-weight:600;margin-top:-2px}
.exch{display:flex;gap:var(--s1);margin-left:var(--s2)}
/* All four markets have to look switchable. The three you are not on were
   --tx3 text on black with no border, sitting next to a glowing green pill:
   people read that as a label for the market they were already on and never
   found the other exchanges. */
.exch-tab{background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);font-family:var(--mono);
  font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:2px;
  cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.exch-tab:hover{color:var(--tx);background:var(--bg4);border-color:var(--mint-line)}
.exch-tab.active{color:#00160e;background:var(--acc);border-color:var(--acc);font-weight:700;
  font-size:13px;padding:5px 12px;letter-spacing:.08em;box-shadow:0 0 12px rgba(51,226,154,.35)}
.exch-flag{font-size:11px;margin-right:3px;opacity:.8}
.exch-tab:hover .exch-flag,.exch-tab.active .exch-flag{opacity:1}
.exch-full{font-size:9px;font-weight:400;opacity:.8;margin-left:5px;letter-spacing:.04em;text-transform:uppercase}
.search{margin-left:auto;display:flex;align-items:center;gap:var(--s2);
  background:var(--bg3);border:1px solid var(--line2);border-radius:3px;
  padding:var(--s2) var(--s3);width:260px;transition:border-color .15s}
.search:focus-within{border-color:var(--mint-line)}
.search span{color:var(--tx3);font-size:11px}
.search input{background:none;border:0;outline:0;color:var(--tx);font-family:var(--mono);
  font-size:12px;width:100%}
.search input::placeholder{color:var(--tx3)}
.acct button{background:var(--bg3);border:1px solid var(--line2);color:var(--acc);
  font-family:inherit;font-size:10px;padding:var(--s1) 10px;border-radius:2px;cursor:pointer;
  transition:border-color .15s,color .15s}
.acct button:hover{border-color:var(--mint-line)}
.clock{display:flex;align-items:center;gap:var(--s2);color:var(--tx2);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 0 rgba(51,226,154,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,226,154,.45)}70%{box-shadow:0 0 0 5px rgba(51,226,154,0)}100%{box-shadow:0 0 0 0 rgba(51,226,154,0)}}

/* ---------- tape ---------- */
.tape{display:flex;align-items:center;height:34px;border-bottom:1px solid var(--line2);
  background:var(--bg);overflow:hidden;white-space:nowrap;padding-left:var(--s4)}
.tape-inner{display:inline-flex;align-items:center;gap:0;will-change:transform;
  animation:tape-scroll 45s linear infinite}
.tape-inner:hover{animation-play-state:paused}
@keyframes tape-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
.tape-item{display:inline-flex;align-items:baseline;gap:var(--s2);padding:0 var(--s4);
  border-right:1px solid var(--line);font-size:11px}
.tape-item .sym{color:var(--tx2);font-weight:500}
.tape-item .pr{color:var(--tx)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx3)}

/* ---------- workspace: rows of windows ---------- */
/* .main stacks rows; each row is its own grid of windows. Windows dock to the
   top or bottom row, so dividers run both ways: vertical ones size the windows
   within a row, the horizontal one sizes the rows themselves. */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.wrow{display:grid;grid-template-columns:var(--wW,232px) 1fr var(--wI,288px) var(--wC,300px);
  min-height:0;min-width:0;position:relative;flex:1 1 0}
#rowBot{flex:0 0 var(--hB,260px)}
#rowBot:empty{display:none}                      /* embed modes never fill it */
.main:has(#rowBot:empty) .rsz-h{display:none}
/* dividers: vertical ones are absolutely placed inside a row by the workspace
   manager (any window can be closed or moved, so which gap a divider sits in is
   not a fixed thing); the horizontal one sits between the rows */
/* A seam nobody can see is a seam nobody drags: each divider carries a visible
   grip at rest, and the hit area is wider than the line it draws. */
.rsz{position:absolute;top:0;bottom:0;width:9px;cursor:col-resize;z-index:18;background:transparent;transition:background .12s}
.rsz:hover{background:rgba(51,226,154,.10)}
.rsz::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line2);transition:width .12s,background .12s}
.rsz:hover::after{width:2px;background:var(--acc)}
.rsz::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:28px;margin-top:-14px;
  border-radius:2px;background:var(--line2);transition:background .12s,height .12s}
.rsz:hover::before{background:var(--acc);height:44px;margin-top:-22px}
.rsz.dragging{background:rgba(51,226,154,.16)}
.rsz.dragging::after,.rsz.dragging::before{background:var(--acc)}
.rsz-h{flex:0 0 9px;height:9px;cursor:row-resize;position:relative;z-index:18;background:transparent;transition:background .12s}
.rsz-h:hover{background:rgba(51,226,154,.10)}
.rsz-h::after{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--line2);transition:height .12s,background .12s}
.rsz-h:hover::after{height:2px;background:var(--acc)}
.rsz-h::before{content:"";position:absolute;top:3px;left:50%;height:3px;width:28px;margin-left:-14px;
  border-radius:2px;background:var(--line2);transition:background .12s,width .12s;z-index:1}
.rsz-h:hover::before{background:var(--acc);width:44px;margin-left:-22px}
.rsz-h.dragging{background:rgba(51,226,154,.16)}
.rsz-h.dragging::after,.rsz-h.dragging::before{background:var(--acc)}
.view-panel .rsz,.view-watchlist .rsz,.view-info .rsz{display:none}
.rail{border-right:1px solid var(--line2);background:var(--bg2);
  display:flex;flex-direction:column;min-height:0}
.rail.right{border-right:0;border-left:1px solid var(--line2)}
.eyebrow{color:var(--tx3);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:var(--s3) var(--s4) var(--s2)}

/* watchlist */
.wl{overflow-y:auto;min-height:0;flex:1}
.wl-head{display:flex;justify-content:space-between;padding:var(--s2) var(--s4);font-size:10px;
  color:var(--tx3);border-bottom:1px solid var(--line);letter-spacing:.05em}
.wl-row{display:grid;grid-template-columns:26px 1fr auto;gap:2px var(--s3);
  align-items:center;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s}
.wl-row:hover{background:var(--bg3)}
.wl-row.active{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.wl-logo-cell{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center}
.wl-logo{width:22px;height:22px;border-radius:3px;background:var(--bg4);object-fit:contain;padding:2px}
.wl-mono{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);border-radius:3px;color:var(--acc);font-size:10px;font-weight:700;
  background:var(--bg3);letter-spacing:.02em}
.wl-main{grid-column:2;min-width:0}
.wl-main .sym{font-weight:500;color:var(--tx);letter-spacing:.02em}
.wl-main .nm{font-family:var(--ui);font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-main .wl-ceo{display:block;font-family:var(--ui);font-size:9px;color:var(--tx3);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-price{grid-column:3;text-align:right}
.wl-price .pr{color:var(--tx);font-size:11px}
.wl-price .chg{font-size:10.5px}

/* ---------- center panel ---------- */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line2);padding:0 var(--s3);
  overflow-x:auto}
/* in-window chart (view=watchlist previews) */
#wlChart{position:fixed;inset:0;z-index:60000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
#wlChart .wc-box{width:min(680px,94vw);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.7);}
#wlChart .wc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);}
#wlChart .wc-t{color:var(--acc);font-size:13px;letter-spacing:.08em;font-weight:700;}
#wlChart .wc-ct{background:none;border:1px solid var(--line2);color:var(--tx3);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 10px;cursor:pointer;margin-left:6px;border-radius:3px;}
#wlChart .wc-ct.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
#wlChart .wc-close{background:none;border:0;color:var(--tx3);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
#wlChart .wc-close:hover{color:#ff5f56;}
#wlChart .wc-body{height:380px;}
#wlChart .wc-load{color:var(--tx3);font-size:12px;padding:24px;text-align:center;}
/* auth gate (sign in required) */
.auth-gate-holder #authGate, #authGate{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
#authGate .gate-card{width:340px;border:1px solid var(--line2);border-radius:8px;padding:28px;background:var(--bg2);box-shadow:0 24px 80px rgba(0,0,0,.6);}
#authGate .gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#authGate .gate-mark{width:30px;height:30px;background:var(--acc);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:13px;}
#authGate .gate-name{font-size:15px;letter-spacing:.08em;color:var(--tx);}
#authGate .gate-name small{color:var(--tx3);font-size:10px;letter-spacing:.15em;display:block;}
#authGate .gate-sub{color:var(--tx3);font-size:11px;margin:10px 0 14px;letter-spacing:.05em;}
#authGate .gate-social{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
#authGate .gate-social-btn{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:var(--mono);font-size:12px;letter-spacing:.03em;padding:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
#authGate .gate-social-btn:hover{border-color:var(--acc);color:var(--acc);}
#authGate .gs-g{color:#4285f4;font-weight:700;}
#authGate .gs-star{color:var(--tx3);}
#authGate .gate-or{text-align:center;color:var(--tx3);font-size:10px;letter-spacing:.15em;margin:0 0 12px;}
#authGate .gate-tabs{display:flex;border:1px solid var(--line2);border-radius:4px;margin-bottom:14px;overflow:hidden;}
#authGate .gate-tab{flex:1;background:none;border:0;color:var(--tx3);font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:8px 0;cursor:pointer;}
#authGate .gate-tab.on{background:var(--acc);color:#000;font-weight:700;}
#authGate .gate-field input{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--line2);color:var(--tx);font-family:var(--mono);font-size:12px;padding:10px;margin-bottom:10px;border-radius:4px;outline:none;}
#authGate .gate-field input:focus{border-color:var(--acc);}
#authGate .gate-msg{min-height:16px;font-size:11px;color:#ff5f56;margin-bottom:10px;}
#authGate .gate-msg.ok{color:var(--acc);}
#authGate .gate-btn{width:100%;background:var(--acc);border:0;color:#000;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;padding:11px;border-radius:4px;cursor:pointer;}
#authGate .gate-btn:hover{background:#26c98a;}
#authGate .gate-back{margin-top:14px;text-align:center;color:var(--tx3);font-size:11px;cursor:pointer;}
#authGate .gate-back:hover{color:var(--acc);}
/* workspace drag handles (Godel-style panel arrangement) */
/* every window header is a drag handle; the braille grip says so */
.dgrip{color:var(--tx3);font-size:11px;padding:0 4px;user-select:none;opacity:.55;}
[data-drag]{cursor:grab;user-select:none;}
[data-drag]:active{cursor:grabbing;}
[data-drag]:hover .dgrip{opacity:1;color:var(--acc);}
[data-drag] button,[data-drag] input,[data-drag] .ctab{cursor:pointer;}
.win-dragging{opacity:.45;}
.wrow.drop-row{outline:1px solid rgba(51,226,154,.35);outline-offset:-1px;}
/* where the window will land */
.drop-ind{position:fixed;z-index:99998;background:var(--acc);pointer-events:none;
  box-shadow:0 0 10px rgba(51,226,154,.7);border-radius:2px;}
.drop-ind.band{background:rgba(51,226,154,.14);border:1px solid var(--acc);box-shadow:none;}
.drop-ghost{position:fixed;z-index:99999;pointer-events:none;background:var(--bg3);
  border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;padding:4px 10px;border-radius:3px;transform:translate(12px,12px);}
.ctab[draggable="true"]{cursor:grab;}
.ctab{background:none;border:0;color:var(--tx3);font-family:var(--mono);
  font-size:11px;letter-spacing:.05em;padding:var(--s3) var(--s3);cursor:pointer;
  position:relative;white-space:nowrap;transition:color .15s}
.ctab:hover{color:var(--tx2)}
.ctab.active{color:var(--tx)}
.ctab.active::after{content:"";position:absolute;left:var(--s3);
  right:var(--s3);bottom:-1px;height:2px;background:var(--acc)}
.stage{flex:1;min-height:0}
.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* ---------- right rail ---------- */
.rightinfo{flex:1;overflow-y:auto;padding:0;font-family:var(--mono);font-size:11px;color:var(--tx2)}
.rightinfo .qlink{color:var(--acc);cursor:pointer;text-decoration:none}
.rightinfo .qlink:hover{text-decoration:underline}
.rightinfo .qhead{padding:var(--s4) var(--s4) var(--s2);border-bottom:1px solid var(--line)}
.rightinfo .qsym{font-size:16px;font-weight:500;color:var(--tx)}
.rightinfo .qname{font-family:var(--ui);font-size:11px;color:var(--tx3);margin-top:2px}
.rightinfo .qpx{font-size:24px;margin-top:var(--s3);color:var(--tx)}
.rightinfo .qchg{font-size:13px;margin-top:2px}
.rightinfo .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:var(--s2) var(--s4);
  font-size:10px;font-family:var(--mono)}
.rightinfo .qgrid span:nth-child(odd){color:var(--tx3)}
.rightinfo .qgrid span:nth-child(even){text-align:right;color:var(--tx)}

kbd{font-family:var(--mono);background:var(--bg3);border:1px solid var(--line2);
  border-radius:2px;padding:1px 5px;color:var(--tx2);font-size:10px}

/* no scrollbars anywhere: the content still scrolls by wheel, trackpad,
   keyboard and drag - only the bar that drew it is gone */
html{scrollbar-width:none;}
*{scrollbar-width:none;}
::-webkit-scrollbar{width:0;height:0;}


/* ---------- window chrome: close buttons + the restore strip ---------- */
.win-dock{background:none;border:0;color:var(--tx3);font-family:var(--mono);font-size:10px;line-height:1;
  padding:0 2px;cursor:pointer;opacity:.65}
.win-dock:hover{color:var(--acc);opacity:1}
.panel-head{display:flex;align-items:center;border-bottom:1px solid var(--line2);padding-right:var(--s3)}
.panel-head .tabs{flex:1;min-width:0;border-bottom:0}
.eyebrow{display:flex;align-items:center;gap:var(--s2)}
.wl-head .win-dock,.eyebrow .win-dock{margin-left:auto}

/* ---------- chat rail (4th window) ---------- */
.rail.chat{border-left:1px solid var(--line2);border-right:0;background:var(--bg2)}
.chat-head{display:flex;align-items:center;gap:2px;padding:var(--s2) var(--s3) var(--s2) var(--s4);
  border-bottom:1px solid var(--line)}
.chat-tab{background:none;border:0;color:var(--tx3);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;padding:3px 6px;cursor:pointer;border-radius:2px}
.chat-tab:hover{color:var(--tx2)}
.chat-tab.on{color:var(--acc);background:rgba(51,226,154,.08)}
.chat-head .chat-act{margin-left:auto;display:flex;align-items:center;gap:4px}
.chat-head .chat-act button{background:none;border:1px solid var(--line2);color:var(--tx3);
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:2px;cursor:pointer}
.chat-head .chat-act button:hover{border-color:var(--acc);color:var(--acc)}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:var(--s3) var(--s4);
  font-family:var(--mono);font-size:11px;color:var(--tx2);display:flex;flex-direction:column;gap:var(--s3)}
.chat-msg{max-width:100%}
.chat-msg .who{display:block;font-size:9px;letter-spacing:.14em;color:var(--tx3);margin-bottom:3px}
.chat-msg.me .who{color:var(--tx2)}
.chat-msg.bot .who{color:var(--acc)}
.chat-msg .body{background:var(--bg3);border:1px solid var(--line);border-radius:3px;
  padding:var(--s2) var(--s3);line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
.chat-msg .body b{color:var(--tx)}
.chat-msg .krow{display:grid;grid-template-columns:1fr auto;gap:1px 10px;font-size:10.5px;margin-top:3px}
.chat-msg .krow span:nth-child(odd){color:var(--tx3)}
.chat-msg .krow span:nth-child(even){text-align:right;color:var(--tx)}
.chat-chip{display:inline-block;background:var(--bg3);border:1px solid var(--line2);color:var(--acc);
  font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;cursor:pointer;margin:3px 3px 0 0}
.chat-chip:hover{border-color:var(--acc)}
/* room messages */
.room-msg{display:flex;flex-direction:column;gap:2px}
.room-msg .rm-h{display:flex;align-items:baseline;gap:6px;font-size:9px;color:var(--tx3);letter-spacing:.06em}
.room-msg .rm-n{color:var(--acc)}
.room-msg.mine .rm-n{color:var(--tx)}
.room-msg .rm-ctx{border:1px solid var(--line2);border-radius:2px;padding:0 4px;font-size:8.5px;color:var(--tx3)}
.room-msg .rm-x{margin-left:auto;background:none;border:0;color:var(--tx3);cursor:pointer;font-size:10px;
  padding:0 2px;opacity:0}
.room-msg:hover .rm-x{opacity:.7}
.room-msg .rm-x:hover{color:#ff5f56;opacity:1}
.room-msg .rm-t{background:var(--bg3);border:1px solid var(--line);border-radius:3px;
  padding:var(--s2) var(--s3);line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.room-msg.mine .rm-t{border-color:var(--line2)}

<script>
(function(){
  var AUTH_API = (window.AUTH_API || (new URLSearchParams(location.search).get("api") || "")) || "https://mutxri-terminal.onrender.com";
  var gate = document.getElementById("authGate");
  var q = new URLSearchParams(location.search);
  // landing previews (view= modes) and embedded iframes are not gated
  if(q.get("view") || window.self !== window.top){ if(gate) gate.remove(); return; }
  var mode = "login";
  function show(){
    if(!gate) return;
    gate.style.display = "flex";
    // prefill the address from last time so a returning user only types a password
    try{
      var last = localStorage.getItem("mt_email") || "";
      var em = document.getElementById("gateEmail");
      if(em && last && !em.value) em.value = last;
      var pw = document.getElementById("gatePwd");
      setTimeout(function(){ var t = (em && em.value && pw) ? pw : em; if(t) t.focus(); }, 60);
    }catch(e){}
  }
  function hide(){ if(gate) gate.remove(); }
  function msg(t, ok){ var m = document.getElementById("gateMsg"); if(!m) return; m.textContent = t || ""; m.className = "gate-msg" + (ok ? " ok" : ""); }
  // OAuth callback: ?oauth=<provider>&code=<one-time> -> trade for a session token
  var oauthP = q.get("oauth"), oauthCode = q.get("code");
  if(oauthP && oauthCode){
    msg("Completing sign-in…");
    fetch(AUTH_API + "/api/auth/oauth/exchange", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code: oauthCode})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .then(function(d){
        if(d && d.ok){ try{ localStorage.setItem("mt_token", d.token || ""); localStorage.setItem("mt_email", d.email || ""); }catch(e){} }
        var sp = new URLSearchParams(location.search); sp.delete("oauth"); sp.delete("code");
        try{ history.replaceState({}, "", location.pathname + (sp.toString() ? "?" + sp.toString() : "")); }catch(e){}
        check();
      })
      .catch(function(){ check(); });
    return;
  }
  window.gateSocial = function(provider){
    msg("Connecting to " + provider + "…");
    fetch(AUTH_API + "/api/auth/oauth/" + provider + "/start")
      .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"could not reach server"}; }); })
      .then(function(d){
        if(d && d.ok && d.url){ window.location.href = d.url; }
        else { msg((d && d.error) ? d.error : "Sign-in is not available right now."); }
      })
      .catch(function(){ msg("Could not reach the sign-in server."); });
  };
  window.gateMode = function(m){
    mode = m;
    document.querySelectorAll(".gate-tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-gmode") === m); });
    var nm = document.getElementById("gateNameWrap"); if(nm) nm.style.display = (m === "signup") ? "block" : "none";
    var btn = document.querySelector(".gate-btn"); if(btn) btn.textContent = (m === "signup") ? "CREATE ACCOUNT" : "SIGN IN";
  };
  function tok(){ try{ return localStorage.getItem("mt_token") || ""; }catch(e){ return ""; } }
  function check(){
    var t = tok();
    if(!t){ show(); return; }
    msg("Verifying session…");
    fetch(AUTH_API + "/api/auth/me", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: t})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .then(function(d){ if(d && d.ok){ hide(); } else { show(); msg("Session expired. Sign in to continue."); } })
      .catch(function(){ show(); msg("Could not reach the sign-in server. Check your connection and try again."); });
  }
  window.gateSubmit = function(){
    var email = (document.getElementById("gateEmail").value || "").trim();
    var pwd = document.getElementById("gatePwd").value || "";
    var name = document.getElementById("gateName") ? document.getElementById("gateName").value.trim() : "";
    if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg("Enter a valid email address."); return; }
    if(!pwd){ msg("Enter your password."); return; }
    if(mode === "signup" && pwd.length < 8){ msg("Password must be at least 8 characters."); return; }
    var payload = {email: email, password: pwd};
    if(mode === "signup" && name) payload.name = name;
    msg(mode === "login" ? "Signing in…" : "Creating your account…");
    fetch(AUTH_API + "/api/auth/" + (mode === "login" ? "login" : "signup"), {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, error:"server error"}; }); })
      .then(function(d){
        if(d && d.ok){
          try{ localStorage.setItem("mt_token", d.token || ""); localStorage.setItem("mt_email", d.email || email); }catch(e){}
          msg("Welcome. Loading the terminal…", true);
          setTimeout(hide, 600);
        } else {
          msg((d && d.error) ? d.error : "Sign in failed. Try again.");
        }
      })
      .catch(function(){ msg("Could not reach the sign-in server. Try again shortly."); });
  };
  check();
})();
</script>

<script>

// ===== BACKEND CONFIG (GitHub Pages deployment) =====
// Empty string = local/snapshot mode. Set to deployed backend URL (NO trailing
// slash) to route all /api/* calls to the live server.
// API_BASE: Render backend URL. Auto-detected: ?api= param > window.AUTH_API
// (set by landing) > default Render service. Empty = snapshot mode.
const API_BASE = (function(){
  try{
    var q = new URLSearchParams(location.search).get("api");
    if(q) return q;
    if(window.AUTH_API) return window.AUTH_API;
  }catch(e){}
  return "";
})();
const __origFetch = window.fetch;
window.fetch = function(url, opts){
  const u = String(url);
  const isApi = u.indexOf('/api/') === 0;
  if(isApi && API_BASE){
    return __origFetch(API_BASE + u, opts);
  }
  return __origFetch(url, opts);
};
window.API_BASE = API_BASE;
// ===== END BACKEND CONFIG =====

// ===== App state =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const EXCHANGES = ['JSE', 'EGX', 'NGX', 'NSE'];
// Nobody should have to pick a market before seeing anything. Order of
// preference: an explicit ?ex= deep link, then whatever they used last, then
// their own timezone, and only then a default.
function pickInitialExchange(){
  try{
    const p = (new URLSearchParams(location.search).get('ex') || '').toUpperCase();
    if(EXCHANGES.includes(p)) return p;
  }catch(e){}
  try{
    const saved = localStorage.getItem('mt_ex');
    if(EXCHANGES.includes(saved)) return saved;
  }catch(e){}
  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const byTz = {'Africa/Nairobi':'NSE', 'Africa/Lagos':'NGX',
                  'Africa/Johannesburg':'JSE', 'Africa/Cairo':'EGX'};
    if(byTz[tz]) return byTz[tz];
  }catch(e){}
  return 'JSE';   // deepest statement coverage, so the best first impression
}
let currentEx = pickInitialExchange();
try{
  const _pp = new URLSearchParams(location.search).get('panel');
  if(_pp) window.__INIT_PANEL = _pp.toLowerCase();
  const _rails = new URLSearchParams(location.search).get('rails');

    document.documentElement.classList.add('view-' + _view);
    if(_view === 'watchlist'){
      document.documentElement.classList.add('no-rails');

    }
    if(_view === 'info'){
      document.documentElement.classList.add('no-rails');
      document.documentElement.classList.add('hide-chrome');
      document.documentElement.classList.add('hide-panel');
      document.documentElement.classList.add('hide-tape');

let listing = {};

window.__CINFO = null; window.__CINFO_P = null;
function loadCompanyInfo(){

    .then(r => { if(!r.ok) throw 0; return r.json(); })

const EX_TZ = {

};

  const ex = (typeof currentEx !== 'undefined' ? currentEx : 'JSE');
  const info = EX_TZ[ex] || EX_TZ.JSE;
  try{
    const d = new Date();
    const time = d.toLocaleTimeString('en-GB', {timeZone: info.tz, hour12: false});
    const date = d.toLocaleDateString('en-GB', {timeZone: info.tz, day: '2-digit', month: 'short'});
    $('clock').textContent = time + ' ' + info.city;

clockTZ();

// ===== Tabs (Claude's panels, untouched, embedded) =====

        if(saved.order && saved.order.top && saved.order.bottom){
          const seen = {};
          ['top', 'bottom'].forEach(function(r){
            order[r] = (saved.order[r] || []).filter(function(k){
              const ok = COLS[k] && !seen[k];
              seen[k] = 1;
              return ok;
            });
          });
          KEYS.forEach(function(k){ if(!seen[k]) order.top.push(k); });   // new window
        }else if(saved.row){
          // older shape: {open, row:{k:'top'|'bottom'}}
          order = {top: [], bottom: []};
          KEYS.forEach(function(k){ order[saved.row[k] === 'bottom' ? 'bottom' : 'top'].push(k); });
        }
      }
    }catch(e){}
    if(!KEYS.some(function(k){ return open[k]; })) open = {watch: true, center: true, info: true, chat: true};
    try{
      const s = (localStorage.getItem('mt_sizes') || '').split(',');
      if(s.length >= 2){
        want.watch = parseInt(s[0], 10) || COLS.watch.def;
        want.info = parseInt(s[1], 10) || COLS.info.def;
        want.chat = parseInt(s[2], 10) || COLS.chat.def;
      }
      wantBot = parseInt(localStorage.getItem('mt_rowh'), 10) || DEF_BOT;
    }catch(e){}

    function el(k){ return document.getElementById(COLS[k].el); }
    function cur(v){ const x = parseFloat(getComputedStyle(main).getPropertyValue(v)); return isNaN(x) ? 0 : x; }
    function rowOf(k){ return order.bottom.indexOf(k) >= 0 ? 'bottom' : 'top'; }
    function visIn(r){ return order[r].filter(function(k){ return open[k]; }); }
    function anyOpen(){ return visIn('top').length + visIn('bottom').length; }
    // the column that takes the slack in a row: the centre panel when it is
    // there, otherwise the last window in that row - something must fill it
    function flexOf(r){
      const v = visIn(r);
      return (open.center && rowOf('center') === r && v.indexOf('center') >= 0) ? 'center' : v[v.length - 1];
    }
    function width(k){ return COLS[k].v ? cur(COLS[k].v) : 0; }

    function clamp(k, px){
      const r = rowOf(k), v = visIn(r), flex = flexOf(r);
      let taken = 0;
      v.forEach(function(o){ if(o !== k && o !== flex) taken += width(o); });
      const floor = flex === 'center' ? MIN_CENTER : MIN_RAIL;
      const max = Math.max(MIN_RAIL, (main.clientWidth || window.innerWidth) - taken - floor);
      return Math.min(max, Math.max(MIN_RAIL, px));
    }
    function clampBot(px){
      const avail = (main.clientHeight || window.innerHeight) - 9;
      return Math.min(Math.max(MIN_ROW, avail - MIN_ROW), Math.max(MIN_ROW, px));
    }
    function setWidth(k, px){
      if(!COLS[k].v) return;
      want[k] = Math.max(MIN_RAIL, Math.round(px));
      main.style.setProperty(COLS[k].v, clamp(k, want[k]) + 'px');
    }
    function applyAll(){
      KEYS.forEach(function(k){
        if(COLS[k].v) main.style.setProperty(COLS[k].v, clamp(k, want[k]) + 'px');
      });
    }
    function save(){
      try{
        localStorage.setItem('mt_sizes', [want.watch, want.info, want.chat].join(','));
        localStorage.setItem('mt_rowh', String(Math.round(wantBot)));
        localStorage.setItem('mt_wins', JSON.stringify({open: open, order: order}));
      }catch(e){}
    }

    // ---- vertical dividers, created per row as the layout needs them ----
    const pool = {top: [], bottom: []}, gapMap = {top: [], bottom: []};
    function overlay(cursor){
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;cursor:' + cursor + ';';
      document.body.appendChild(ov);
      return ov;   // also swallows mouse events over the panel iframes
    }
    function beginW(r, i, e, node){
      const g = gapMap[r][i];
      if(!g) return;
      e.preventDefault();
      const startX = e.clientX, start = width(g.k), ov = overlay('col-resize');
      node.classList.add('dragging');
      function move(ev){ setWidth(g.k, start + g.dir * (ev.clientX - startX)); layout(); }
      function end(){
        ov.remove();
        node.classList.remove('dragging');
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', end);
        save();
      }
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }
    function dividers(r, v, flex){
      const gaps = [], fi = v.indexOf(flex);
      for(let i = 0; i < v.length - 1; i++){
        // anchor each divider from the side whose windows all have fixed
        // widths - the flexible one has no width to measure from
        if(fi > i){
          let off = 0;
          for(let j = 0; j <= i; j++) off += width(v[j]);
          gaps.push({k: v[i], dir: 1, side: 'left', off: off - 5});
        }else{
          let off = 0;
          for(let j = i + 1; j < v.length; j++) off += width(v[j]);
          gaps.push({k: v[i + 1], dir: -1, side: 'right', off: off - 4});
        }
      }
      gapMap[r] = gaps;
      while(pool[r].length < gaps.length){
        const d = document.createElement('div');
        d.className = 'rsz';
        d.addEventListener('mousedown', function(e){ beginW(r, pool[r].indexOf(d), e, d); });
        d.addEventListener('dblclick', function(){
          const g = gapMap[r][pool[r].indexOf(d)];
          if(g){ setWidth(g.k, COLS[g.k].def); layout(); save(); }
        });
        ROWS[r].appendChild(d);
        pool[r].push(d);
      }
      pool[r].forEach(function(d, i){
        const g = gaps[i];
        if(!g){ d.style.display = 'none'; return; }
        d.style.display = '';
        d.style.left = g.side === 'left' ? g.off + 'px' : 'auto';
        d.style.right = g.side === 'right' ? g.off + 'px' : 'auto';
        d.title = 'Drag to resize ' + COLS[g.k].label.toLowerCase();
      });
    }

    // ---- the horizontal divider between the rows ----
    function beginH(e){
      e.preventDefault();
      const startY = e.clientY, start = clampBot(wantBot), ov = overlay('row-resize');
      hDiv.classList.add('dragging');
      function move(ev){
        wantBot = Math.round(start - (ev.clientY - startY));   // drag up = taller bottom
        main.style.setProperty('--hB', clampBot(wantBot) + 'px');
      }
      function end(){
        ov.remove();
        hDiv.classList.remove('dragging');
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', end);
        wantBot = clampBot(wantBot);
        save();
        window.dispatchEvent(new Event('mt:layout'));
      }
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }
    if(hDiv){
      hDiv.addEventListener('mousedown', beginH);
      hDiv.addEventListener('dblclick', function(){
        wantBot = DEF_BOT;
        main.style.setProperty('--hB', clampBot(wantBot) + 'px');
        save();
      });
    }

    function layout(){
      if(EMBED) return;
      ['top', 'bottom'].forEach(function(r){
        const v = visIn(r), flex = flexOf(r);
        order[r].forEach(function(k, i){
          const n = el(k);
          if(!n) return;
          n.style.display = open[k] ? '' : 'none';
          // CSS order, not DOM moves: re-inserting #colCenter would reload the
          // panel iframe on every rearrange
          n.style.order = String(i);
          if(n.parentNode !== ROWS[r]) ROWS[r].appendChild(n);
        });
        ROWS[r].style.display = v.length ? '' : 'none';
        ROWS[r].style.gridTemplateColumns = v.map(function(k){
          return k === flex ? 'minmax(0,1fr)' : 'var(' + COLS[k].v + ')';
        }).join(' ');
        dividers(r, v, flex);
      });
      const top = visIn('top').length, bot = visIn('bottom').length;
      ROWS.bottom.style.flex = top ? '0 0 var(--hB,' + DEF_BOT + 'px)' : '1 1 0';
      if(hDiv) hDiv.style.display = (top && bot) ? '' : 'none';
      main.style.setProperty('--hB', clampBot(wantBot) + 'px');
      docks();
    }

    function docks(){
      document.querySelectorAll('.win-dock').forEach(function(d){
        const k = d.getAttribute('data-dock');
        if(!COLS[k]) return;
        const down = rowOf(k) === 'top';
        d.textContent = down ? '▼' : '▲';
        d.title = down ? 'Move to the bottom row' : 'Move to the top row';
      });
    }

    function place(k, r, idx){
      ['top', 'bottom'].forEach(function(x){
        const i = order[x].indexOf(k);
        if(i >= 0) order[x].splice(i, 1);
      });
      const arr = order[r];
      idx = (idx == null) ? arr.length : Math.max(0, Math.min(arr.length, idx));
      arr.splice(idx, 0, k);
    }
    function commit(){
      layout(); applyAll(); layout();
      save();
      window.dispatchEvent(new Event('mt:layout'));
    }
    function set(k, on){
      if(!COLS[k] || open[k] === on) return;
      if(!on && anyOpen() <= 1) return;   // never close the last one
      open[k] = on;
      commit();
    }
    function toggle(k){ set(k, !open[k]); }
    function move(k, r, idx){
      if(!COLS[k] || (r !== 'top' && r !== 'bottom')) return;
      place(k, r, idx);
      if(!open[k]) open[k] = true;        // docking a closed window brings it back
      commit();
    }

    // ---- drag a window by its header to anywhere in the workspace ----
    // Pointer events, not HTML5 drag-and-drop: dragover never fires over the
    // panel iframes, which is why the old rail drag could not cross the middle.
    function band(){ return Math.max(MIN_ROW, main.getBoundingClientRect().height * 0.22); }
    function dropTarget(x, y){
      const used = ['top', 'bottom'].filter(function(r){ return visIn(r).length; });
      const mb = main.getBoundingClientRect();
      let r = null;
      if(used.length > 1){
        for(let i = 0; i < used.length; i++){
          const box = ROWS[used[i]].getBoundingClientRect();
          if(y >= box.top && y <= box.bottom){ r = used[i]; break; }
        }
        if(!r) r = y < ROWS.top.getBoundingClientRect().bottom ? 'top' : 'bottom';
      }else{
        // only one row in use: it fills the height, so an empty row has no rect
        // to aim at. The far edge of the workspace stands in for it - that is
        // how a second row gets created by dragging at all.
        const only = used[0] || 'top';
        if(only === 'top' && y > mb.bottom - band()) r = 'bottom';
        else if(only === 'bottom' && y < mb.top + band()) r = 'top';
        else r = only;
      }
      const v = visIn(r);
      let idx = v.length;
      for(let i = 0; i < v.length; i++){
        const b = el(v[i]).getBoundingClientRect();
        if(x < b.left + b.width / 2){ idx = i; break; }
      }
      return {row: r, index: idx, visible: v, isNew: !v.length};
    }
    function indicatorFor(t){
      const v = t.visible, mb = main.getBoundingClientRect();
      if(t.isNew){
        // a whole new row: show the slab it will occupy, not a hairline
        const h = band();
        return {left: mb.left, width: mb.width, height: h, band: true,
                top: t.row === 'bottom' ? mb.bottom - h : mb.top};
      }
      const box = ROWS[t.row].getBoundingClientRect();
      const at = t.index < v.length ? el(v[t.index]).getBoundingClientRect().left
                                    : el(v[v.length - 1]).getBoundingClientRect().right;
      return {left: at - 2, width: 4, top: box.top, height: box.height};
    }
    function beginMove(k, e){
      if(e.button !== 0) return;
      if(e.target.closest('button, input, select, textarea, a, .ctab')) return;
      const startX = e.clientX, startY = e.clientY;
      let dragging = false, ov = null, ind = null, ghost = null, target = null;
      function move(ev){
        if(!dragging){
          if(Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 5) return;
          dragging = true;
          ov = overlay('grabbing');
          el(k).classList.add('win-dragging');
          ind = document.createElement('div');
          ind.className = 'drop-ind';
          ghost = document.createElement('div');
          ghost.className = 'drop-ghost';
          ghost.textContent = COLS[k].label;
          document.body.appendChild(ind);
          document.body.appendChild(ghost);
        }
        target = dropTarget(ev.clientX, ev.clientY);
        const box = indicatorFor(target);
        ind.style.left = box.left + 'px';
        ind.style.top = box.top + 'px';
        ind.style.width = box.width + 'px';
        ind.style.height = box.height + 'px';
        ind.classList.toggle('band', !!box.band);
        ghost.style.left = ev.clientX + 'px';
        ghost.style.top = ev.clientY + 'px';
        ['top', 'bottom'].forEach(function(r){ ROWS[r].classList.toggle('drop-row', r === target.row); });
      }
      function end(){
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', end);
        if(dragging){
          if(ov) ov.remove();
          if(ind) ind.remove();
          if(ghost) ghost.remove();
          el(k).classList.remove('win-dragging');
          ['top', 'bottom'].forEach(function(r){ ROWS[r].classList.remove('drop-row'); });
          if(target){
            // dropping to the right of itself in its own row counts one slot high
            const from = order[target.row].indexOf(k);
            let idx = target.index;
            if(from >= 0 && from < idx) idx -= 1;
            place(k, target.row, idx);
            commit();
          }
        }
      }
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }
    if(!EMBED){
      document.querySelectorAll('[data-drag]').forEach(function(h){
        h.addEventListener('mousedown', function(e){ beginMove(h.getAttribute('data-drag'), e); });
      });
    }

    document.addEventListener('click', function(e){
      if(!e.target.closest) return;
      const d = e.target.closest('.win-dock');
      if(d){
        const k = d.getAttribute('data-dock');
        move(k, rowOf(k) === 'top' ? 'bottom' : 'top');
      }
    });
    window.addEventListener('resize', function(){ applyAll(); layout(); });

    applyAll();
    layout();

    return {toggle: toggle, set: set, move: move, layout: layout,
            isOpen: function(k){ return !!open[k]; }, rowOf: rowOf,
            orderOf: function(){ return JSON.parse(JSON.stringify(order)); }};
  })();
  // tab reordering
  let dragTab = null;
  document.addEventListener('dragstart', e => {
    if(e.target.classList.contains('ctab')) dragTab = Array.prototype.indexOf.call(e.target.parentNode.children, e.target);
  });
  document.addEventListener('dragover', e => {
    if(dragTab !== null && e.target.classList.contains('ctab')){ e.preventDefault(); }
  });
  document.addEventListener('drop', e => {
    if(dragTab === null || !e.target.classList.contains('ctab')) return;
    e.preventDefault();
    const to = Array.prototype.indexOf.call(e.target.parentNode.children, e.target);
    const from = dragTab;
    if(from !== to && from >= 0 && to >= 0){
      const moved = PANELS.splice(from, 1)[0];
      PANELS.splice(to, 0, moved);
      try{ localStorage.setItem('mt_tabs', PANELS.map(p => p.id).join(',')); }catch(err){}
      renderTabs();
    }
    dragTab = null;
  });
  document.addEventListener('dragend', () => { dragTab = null; });
})();
renderTabs();

// ===== Load listing =====
async function loadListing(ex){
  try{
    const url = window.API_BASE ? ('/api/listing?exchange=' + ex) : ('static_data/listing_' + ex + '.json');
    const r = await fetch(url);
    const d = await r.json();
    listing[ex] = d.stocks || [];
    // Overlay the freshest market-snapshot prices onto the listing (EOD base)
    // in BOTH modes: pure static AND API mode (backend /api/quotes returns a
    // throttled subset, e.g. ~80 of 431 JSE names -> most rows would render
    // "—"). Live quotes still win per row when present.
    try{
        const mr = await fetch('static_data/market_' + ex + '.json');
        const md = await mr.json();
        const byTkr = {};
        (md.stocks || []).forEach(s => { byTkr[s.ticker || s.sym] = s; });
        listing[ex] = listing[ex].map(s => {
          const tkr = s.ticker || s.code || (s.sym || '').split('.')[0];
          const m = byTkr[tkr] || byTkr[s.sym] || {};
          if(m.price != null){
            return Object.assign({}, s, {
              price: m.price, chgPct: m.chgPct, volume: m.volume,
              currency: m.currency || s.currency,
              sym: s.sym || m.sym || tkr,
              high: m.high, low: m.low, open: m.open, prevClose: m.prevClose,
              turnover: m.turnover, marketCap: m.marketCap
            });
          }
          return s;
        });
      }catch(e2){ console.error('market overlay fail', e2); }
    $('wlEx').textContent = ex + ' · ' + listing[ex].length;
    renderWatchlist($('q').value);
    buildTape(ex);            // tape now shows the new exchange immediately
    primeQuotes(ex);          // then refresh with live quotes
  }catch(e){ console.error('listing fail', e); }
}

function stockTicker(s){
  return s.ticker || s.short || s.code || (s.sym || '').split('.')[0] || (s.name || '').split(' ')[0].toUpperCase();
}

function renderWatchlist(filter){
  const list = listing[currentEx] || [];
  const f = (filter || '').toUpperCase();
  const rows = f ? list.filter(s => stockTicker(s).includes(f) || (s.name||'').toUpperCase().includes(f)) : list.filter(s => s.instrument !== 'structured');
  const el = $('wlList');
  el.innerHTML = rows.slice(0, 300).map(s => {
    // JSE/EGX: quote from cache; NGX/NSE: EOD data embedded in the listing
    const q = quotes[s.sym] || {};
    const price = q.price != null ? q.price : s.price;
    const chg = q.changePct != null ? q.changePct : s.chgPct;
    const vol = q.volume != null ? q.volume : s.volume;
    const cur = s.currency || (q.currency || '');
    const pr = price != null ? Number(price).toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
    const cls = chg === null || chg === undefined ? '' : (chg >= 0 ? 'up' : 'down');
    const sign = chg === null || chg === undefined ? '' : TickerFix.fmtPct(chg);
    const sym = stockTicker(s);
    const volTxt = vol != null ? (Number(String(vol).replace(/,/g,'')).toLocaleString() || String(vol)) : '';
    // logo: official domain -> favicon service (or direct image URL); monogram fallback (no broken images)
    const rawLogo = LOGO_MAP[s.sym] || LOGO_MAP[s.ticker] || LOGO_MAP[sym] || '';
    const isUrl = /^https?:\/\//i.test(rawLogo);
    const dom = rawLogo.replace(/^www\./, '');
    const logoSrc = isUrl ? rawLogo : `https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=64`;
    const monoFallback = `<span class="wl-mono">${esc(sym[0]||'?')}</span>`;
    // Direct image URLs are real logos (even 16x16 favicons) -> only onerror fallback.
    // s2 favicon-service URLs get the globe check (16x16 = no icon) too.
    const logoHtml = rawLogo
      ? (isUrl
        ? `<img class="wl-logo" loading="lazy" src="${logoSrc}" alt="" onerror="this.outerHTML='<span class=&quot;wl-mono&quot;>${esc(sym[0]||'?')}</span>'">`
        : `<img class="wl-logo" loading="lazy" src="${logoSrc}" alt="" onerror="this.outerHTML='<span class=&quot;wl-mono&quot;>${esc(sym[0]||'?')}</span>'" onload="if(this.naturalWidth<=16&&this.naturalHeight<=16)this.outerHTML='<span class=&quot;wl-mono&quot;>${esc(sym[0]||'?')}</span>'">`)
      : monoFallback;
    return `<div class="wl-row" onclick="openStock('${esc(s.sym || s.ticker || s.name || '')}')">
      <span class="wl-logo-cell">${logoHtml}</span>
      <span class="wl-main">
        <span class="sym">${esc(sym)}</span>
        <span class="nm">${esc(s.name||'')}</span>
      </span>
      <span class="wl-price">
        <span class="pr">${pr} <small style="color:var(--tx3)">${esc(cur)}</small></span>
        <span class="chg ${cls}">${sign}</span>
      </span>
    </div>`;
  }).join('') || '<div style="padding:20px;color:var(--tx3);font-family:var(--mono);font-size:11px">no stocks</div>';
}

// ===== Quotes =====
let quotes = {};
async function primeQuotes(ex){
  const syms = (listing[ex]||[]).filter(s => s.sym).slice(0, 80).map(s => s.sym);
  if(!syms.length) return;
  // static mode (GitHub Pages): load the per-exchange market snapshot so the
  // watchlist shows the REAL current data (official feeds), not stale listing prices
  if(!window.API_BASE){
    try{
      const r = await fetch('static_data/market_' + ex + '.json');
      const d = await r.json();
      (d.stocks || []).forEach(s => {
        quotes[s.sym] = { price: s.price, changePct: s.chgPct, volume: s.volume, currency: s.currency };
        if(s.ticker) quotes[s.ticker] = quotes[s.sym];
      });
      renderWatchlist($('q').value);
      buildTape(ex);
      return;
    }catch(e){ console.error('market snapshot fail', e); }
  }
  try{
    const r = await fetch('/api/quotes?symbols=' + syms.join(','));
    const d = await r.json();
    Object.assign(quotes, d);
    renderWatchlist($('q').value);
    buildTape(ex);
  }catch(e){ console.error('quotes fail', e); }
}

// ===== Ticker tape =====
function buildTape(ex){
  // live-quotes version: refresh with fetched quotes
  buildTapeFromListing(ex);
}

function buildTapeFromListing(ex){

// ===== Command bar: Bloomberg-style "TICKER FUNCTION" =====
const PANEL_ALIAS = {DES:'info', FA:'financials', FIN:'financials', GP:'chart', CN:'news',
                     HP:'chart', EQS:'screener', RV:'financials', SPLC:'info'};
// Every market's tickers, fetched once at boot (39 KB gzipped for all four) so
// a ticker resolves no matter which board is on screen. Before this, typing a
// Nairobi ticker while on the JSE board just answered "unknown".
const SEARCH_IDX = {};
async function loadSearchIndex(){
  await Promise.all(EXCHANGES.map(async function(ex){
    if(listing[ex]) return;                       // already fully loaded
    try{
      const r = await fetch('static_data/listing_' + ex + '.json');
      const d = await r.json();
      SEARCH_IDX[ex] = d.stocks || [];
    }catch(e){ /* a market we cannot index just stays unsearchable */ }
  }));
}
function matchRow(s, tok){
  const st = String(s.ticker || s.sym || '');
  const b = st.split('.')[0];
  return st.toUpperCase() === tok || b.toUpperCase() === tok ||
         String(s.name || '').toUpperCase() === tok;
}
function resolveSec(tok){
  // the exchange in view wins, so an ambiguous ticker resolves to what the
  // user is actually looking at
  const order = [currentEx].concat(EXCHANGES.filter(e => e !== currentEx));
  for(const ex of order){
    const rows = listing[ex] || SEARCH_IDX[ex];
    if(!rows) continue;
    const row = rows.find(s => matchRow(s, tok));
    if(row) return {ex: ex, sym: (row.sym || row.ticker)};
  }
  return null;
}
function panelFor(tok){
  if(!tok) return null;
  const tl = tok.toLowerCase();
  let p = PANELS.find(x => x.id === tl || x.label === tok);
  if(p) return p;
  const al = PANEL_ALIAS[tok];
  if(!al) return null;
  if(al === 'info') return {id: 'info', label: 'INFO'};
  return PANELS.find(x => x.id === al) || null;
}
function openPanelTab(p){
  const idx = PANELS.indexOf(p);
  document.querySelectorAll('.ctab').forEach(x => x.classList.remove('active'));
  const els = document.querySelectorAll('.ctab');
  if(idx >= 0 && els[idx]){ els[idx].classList.add('active'); __activePanelIdx = idx; }
  $('stageFrame').src = panelUrl(p);
}

}
// Window commands. With the status bar gone these are the way back to a window
// you closed - the closed state is remembered between sessions, so without them
// an X would be permanent.
const WINDOW_CMDS = {WATCH: 'watch', WATCHLIST: 'watch', PANEL: 'center', CENTER: 'center',
                     MARKET: 'info', INFO: 'info', CHAT: 'chat', ROOM: 'chat'};
function runCommand(raw){
  const v = String(raw || '').trim().toUpperCase();
  if(!v) return;
  if(v === 'HELP'){
    $('rightInfo').innerHTML = PANELS.map(p => `<div style="padding:4px 0"><b style="color:var(--acc)">${p.label}</b> <span style="color:var(--tx3)">→ ${p.url.split('/').pop()}</span></div>`).join('') +
      '<div style="padding:8px 0;color:var(--tx3)">Bloomberg-style: type a ticker, a panel code, or both — e.g. MTN FINANCIALS, SCOM FIN, FA (financials), DES (overview).</div>' +
      '<div style="padding:4px 0;color:var(--tx3)">Windows: <b style="color:var(--acc)">WATCH</b>, <b style="color:var(--acc)">PANEL</b>, <b style="color:var(--acc)">MARKET</b>, <b style="color:var(--acc)">CHAT</b> open one you closed; <b style="color:var(--acc)">WINDOWS</b> opens all four.</div>';
    return;
  }
  if(v === 'WINDOWS' || v === 'ALL'){
    if(window.MTWin) ['watch', 'center', 'info', 'chat'].forEach(function(k){ window.MTWin.set(k, true); });
    return;
  }
  if(WINDOW_CMDS[v] && window.MTWin){
    const k = WINDOW_CMDS[v];
    // a command for a window you are already looking at means "close it"
    window.MTWin.set(k, !window.MTWin.isOpen(k));
    return;
  }
  const parts = v.split(/\s+/);
  const lastP = panelFor(parts[parts.length - 1]);
  if(parts.length >= 2 && lastP){
    // "MTN FIN" -> resolve the ticker part, open the panel scoped to it
    const tick = parts.slice(0, -1).join(' ');
    const sec = resolveSec(tick);
    if(sec){
      if(sec.ex !== currentEx && typeof switchExchange === 'function') switchExchange(sec.ex);
      curSec = sec.sym;
      openPanelTab(lastP);
      return;
    }
    // ticker not resolvable: still open the panel, note it
    openPanelTab(lastP);
    showUnknown('no security matches "' + tick + '" — panel opened for ' + (curSec || 'no security'));
    return;
  }
  const p = panelFor(v);
  if(p && p.id === 'info'){
    // DES / SPLC on the current security (quote sheet)
    if(curSec){ const row = ((listing[currentEx]||[])).find(s => (s.sym||s.ticker) === curSec); openStock(row ? (row.sym||row.ticker) : curSec); }
    else showUnknown('select a security first (click a row or type a ticker)');
    return;
  }
  if(p){ openPanelTab(p); return; }
  // single token that is a security? -> open its quote sheet (DES behaviour)
  const sec = resolveSec(v);
  if(sec){
    if(sec.ex !== currentEx && typeof switchExchange === 'function') switchExchange(sec.ex);
    curSec = sec.sym;
    openStock(sec.sym);
    return;
  }
  showUnknown('unknown: ' + v);
}

    if(abs >= 1e9)  return (x/1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';

      .then(d => {
        const rows = d.stocks || [];
        const lr = (listing[ex]||[]).find(l => (l.sym||l.ticker||l.name) === sym);
        const rec = rows.find(x => x.sym === sym || x.ticker === sym || (x.name||'') === sym)
                || (lr ? rows.find(x => (x.name||'') && lr.name && String(x.name).toLowerCase() === String(lr.name).toLowerCase()) : null)
                || rows.find(x => (x.sym||'').split('.')[0] === sym.split('.')[0]);
        if(!rec){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx3);font-family:var(--mono);font-size:11px">no snapshot data for ${esc(sym)}</div>`; return; }
        // company info from company_info.json (cached, fetched once)
        loadCompanyInfo().then(ci => {
            let info = null;
            for (const k of [rec.sym, rec.ticker, (rec.sym||'').split('.')[0], (rec.name||'')]) {
              if (k && ci[k]) { info = ci[k]; break; }
            }
            renderMarketStatic(rec, info);
          })
          .catch(() => renderMarketStatic(rec, null));
      })
      .catch(() => { $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx3);font-family:var(--mono);font-size:11px">no market snapshot for ${esc(sym)}</div>`; });
    return;
  }
  fetch('/api/chart?symbol=' + encodeURIComponent(sym) + '&range=1y&interval=1d')
    .then(r => r.json())
    .then(d => {
      if(d.error){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--down);font-family:var(--mono);font-size:11px">${esc(d.error)}</div>`; return; }
      if(d.noData){ $('rightInfo').innerHTML = `<div style="padding:10px;color:var(--tx2);font-family:var(--mono);font-size:11px">
        <div style="color:var(--acc);font-weight:700;margin-bottom:6px">${esc(sym)} · ${esc(d.name||'')}</div>
        <div style="color:var(--tx3);line-height:1.6">${esc(d.message||'No market data available for this security.')}</div></div>`; return; }
      try{ renderStockInfo(d, sym); }catch(e){ console.error('info fail', e); }
      try{ loadMetrics(sym, ex, stock && stock.name); }catch(e){ console.error('metrics fail', e); }
    })
    .catch(e => $('rightInfo').innerHTML = `<div style="color:var(--down)">${esc(String(e))}</div>`);
}

function fmtMoney(v){
  // consistent money display: 12.3B / 950.0M / 4.3T - honest dash when missing
  if(v == null || v === '' || isNaN(v)) return '—';
  const f = Number(v);
  const sign = f < 0 ? '-' : '';
  const a = Math.abs(f);
  if(a >= 1e12) return sign + (a/1e12).toFixed(1) + 'T';
  if(a >= 1e9) return sign + (a/1e9).toFixed(1) + 'B';
  if(a >= 1e6) return sign + (a/1e6).toFixed(1) + 'M';
  if(a >= 1e3) return sign + (a/1e3).toFixed(1) + 'K';
  return sign + a.toFixed(1);
}

// ===== Chat window: the shared room + a local data assistant =====
// ROOM is the desk talking to itself - every signed-in user reads and writes
// the same thread on the backend. ASK is the offline half: it answers from the
// terminal's own listings, so the window still does something useful when the
// backend is unreachable or you are not signed in.
(function(){
  const roomLog = $('roomLog'), askLog = $('chatLog'), form = $('chatForm'),
        input = $('chatInput'), note = $('chatNote'), sendBtn = $('chatSend');
  if(!roomLog || !askLog || !form || !input) return;

  // the room needs the live backend; the terminal itself can run on snapshots
  const CHAT_API = (window.API_BASE || 'https://mutxri-terminal.onrender.com').replace(/\/$/, '');
  const HIST_KEY = 'mt_chat', MAX_HIST = 40;
  let mode = 'room';

  function token(){ try{ return localStorage.getItem('mt_token') || ''; }catch(e){ return ''; } }
  async function api(path, body){
    const r = await fetch(CHAT_API + path, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({token: token()}, body || {}))
    });
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }
  function setNote(msg, bad){
    if(!note) return;
    note.hidden = !msg;
    note.className = 'chat-note' + (bad ? ' bad' : '');
    note.innerHTML = msg || '';
  }

  // ---------------- ROOM ----------------
  const seen = {};
  let lastTs = 0, me = '', poll = null, delay = 5000, drew = false;
  function stamp(ts){
    try{ return new Date(ts * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}); }
    catch(e){ return ''; }
  }
  function drawMsg(m){
    if(!m || !m.id || seen[m.id]) return;
    seen[m.id] = 1;
    const mine = m.name && m.name === me;
    const el = document.createElement('div');
    el.className = 'room-msg' + (mine ? ' mine' : '');
    el.setAttribute('data-id', m.id);
    el.innerHTML = '<div class="rm-h"><span class="rm-n">' + esc(m.name || 'trader') + '</span>' +
      (m.ctx ? '<span class="rm-ctx">' + esc(m.ctx) + '</span>' : '') +
      '<span>' + stamp(m.ts) + '</span>' +
      (mine ? '<button class="rm-x" type="button" title="Delete">\u2715</button>' : '') +
      '</div><div class="rm-t">' + esc(m.text || '') + '</div>';
    const atBottom = roomLog.scrollHeight - roomLog.scrollTop - roomLog.clientHeight < 60;
    roomLog.appendChild(el);
    if(atBottom || mine) roomLog.scrollTop = roomLog.scrollHeight;
    if(m.ts > lastTs) lastTs = m.ts;
  }
  function empty(html){
    if(drew) return;
    roomLog.innerHTML = '<div class="room-empty">' + html + '</div>';
  }
  async function refresh(){
    if(!token()){
      empty('Sign in to join the room and see what everyone else is watching.');
      setNote('The room is for signed-in users. <b>Sign in</b> to post.', false);
      gate();
      return;
    }
    try{
      const d = await api('/api/chat/history', {after: lastTs, limit: 60});
      if(!d || !d.ok){
        if(d && d.auth === false){
          empty('Sign in to join the room.');
          setNote(esc(d.error || 'sign in to post'), true);
        }else{
          setNote(esc((d && d.error) || 'room unavailable'), true);
        }
        gate();
        return;
      }
      if(d.me) me = d.me;
      if(d.messages && d.messages.length){
        if(!drew){ roomLog.innerHTML = ''; drew = true; }
        d.messages.forEach(drawMsg);
      }else if(!drew && lastTs === 0){
        empty('Nobody has said anything yet. Start the conversation.');
      }
      setNote('');
      delay = 5000;
      gate();
    }catch(e){
      setNote('Room offline - retrying.', true);
      delay = Math.min(60000, delay * 2);   // back off rather than hammer
      gate();
    }
  }
  function active(){
    return mode === 'room' && !document.hidden &&
           (!window.MTWin || window.MTWin.isOpen('chat'));
  }
  function loop(){
    clearTimeout(poll);
    poll = setTimeout(function(){
      (active() ? refresh() : Promise.resolve()).then(loop, loop);
    }, delay);
  }
  document.addEventListener('visibilitychange', function(){ if(active()) refresh(); });
  window.addEventListener('mt:layout', function(){ if(active()) refresh(); });

  roomLog.addEventListener('click', async function(e){
    const b = e.target.closest('.rm-x');
    if(!b) return;
    const row = b.closest('.room-msg');
    const id = row && row.getAttribute('data-id');
    if(!id) return;
    try{
      const d = await api('/api/chat/delete', {id: id});
      if(d && d.ok) row.remove(); else setNote(esc((d && d.error) || 'could not delete'), true);
    }catch(err){ setNote('Could not reach the room.', true); }
  });

  async function sendRoom(text){
    if(!token()){ setNote('Sign in to post to the room.', true); return; }
    sendBtn.disabled = true;
    try{
      const ctx = currentEx + (typeof curSec !== 'undefined' && curSec ? ' ' + String(curSec).split('.')[0] : '');
      const d = await api('/api/chat/send', {text: text, ctx: ctx});
      if(d && d.ok && d.message){
        if(!drew){ roomLog.innerHTML = ''; drew = true; }
        drawMsg(d.message);
        input.value = '';
        setNote('');
      }else{
        setNote(esc((d && d.error) || 'message not sent'), true);
      }
    }catch(e){ setNote('Could not reach the room - your message was not sent.', true); }
    sendBtn.disabled = false;
    gate();
  }

  // ---------------- ASK (local, offline) ----------------
  let hist = [];
  try{ hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]') || []; }catch(e){ hist = []; }
  if(!Array.isArray(hist)) hist = [];
  function saveHist(){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(hist.slice(-MAX_HIST))); }catch(e){} }
  function bubble(role, html, remember){
    const el = document.createElement('div');
    el.className = 'chat-msg ' + (role === 'me' ? 'me' : 'bot');
    el.innerHTML = '<span class="who">' + (role === 'me' ? 'YOU' : 'MUTXRI') + '</span>' +
                   '<div class="body">' + html + '</div>';
    askLog.appendChild(el);
    askLog.scrollTop = askLog.scrollHeight;
    if(remember !== false){ hist.push({r: role, h: html}); saveHist(); }
    return el;
  }
  function chips(list){
    return '<div>' + list.map(function(t){
      return '<span class="chat-chip" data-ask="' + esc(t) + '">' + esc(t) + '</span>';
    }).join('') + '</div>';
  }
  const HELP = 'Ask about the markets on this terminal:' +
    chips(['SCOM', 'top gainers', 'open financials', 'markets']) +
    '<div style="color:var(--tx3);margin-top:6px">A ticker gives you its quote and opens it. ' +
    '"open &lt;panel&gt;" switches the centre window. "top gainers" / "top losers" rank the market in view.</div>';
  function rowsFor(ex){
    return (typeof listing !== 'undefined' && listing[ex]) ||
           (typeof SEARCH_IDX !== 'undefined' && SEARCH_IDX[ex]) || [];
  }
  function num(v, d){
    return v == null || v === '' || isNaN(Number(v)) ? null :
      Number(v).toLocaleString(undefined, {maximumFractionDigits: d == null ? 2 : d});
  }
  function tickerOf(row){
    return (typeof stockTicker === 'function') ? stockTicker(row) : (row.ticker || row.sym || '');
  }
  function quoteCard(row, ex){
    const chg = row.chgPct;
    const cls = chg == null ? '' : (chg >= 0 ? 'up' : 'down');
    const chgTxt = chg == null ? '\u2014' : (chg >= 0 ? '+' : '') + Number(chg).toFixed(2) + '%';
    return '<b>' + esc(tickerOf(row)) + '</b> <span style="color:var(--tx3)">' + esc(ex) + '</span>' +
      '<div style="color:var(--tx3);font-size:10px">' + esc(row.name || '') + '</div>' +
      '<div class="krow">' +
        '<span>PRICE</span><span>' + (num(row.price) || '\u2014') + ' ' + esc(row.currency || '') + '</span>' +
        '<span>CHANGE</span><span class="' + cls + '">' + chgTxt + '</span>' +
        '<span>VOLUME</span><span>' + (num(String(row.volume == null ? '' : row.volume).replace(/,/g, ''), 0) || '\u2014') + '</span>' +
      '</div>';
  }
  function movers(ex, dir){
    const rows = rowsFor(ex).filter(function(s){ return s.chgPct != null && !isNaN(Number(s.chgPct)); });
    if(!rows.length) return null;
    rows.sort(function(a, b){ return dir * (Number(b.chgPct) - Number(a.chgPct)); });
    return '<b>' + (dir > 0 ? 'Top gainers' : 'Top losers') + ' \u2014 ' + esc(ex) + '</b>' +
      '<div class="krow">' + rows.slice(0, 5).map(function(s){
        const c = Number(s.chgPct);
        return '<span>' + esc(tickerOf(s)) + '</span><span class="' + (c >= 0 ? 'up' : 'down') + '">' +
               (c >= 0 ? '+' : '') + c.toFixed(2) + '%</span>';
      }).join('') + '</div>';
  }
  function localAnswer(text){
    const v = text.trim().toUpperCase();
    if(!v) return null;
    if(/^(HELP|\?|WHAT CAN YOU DO)/.test(v)) return HELP;
    if(/^(MARKETS?|EXCHANGES?)\b/.test(v)){
      return 'Four boards: <b>JSE</b>, <b>EGX</b>, <b>NGX</b>, <b>NSE</b>. You are on <b>' + esc(currentEx) + '</b>.' +
        chips(['top gainers', 'top losers', 'open heatmap']);
    }
    if(/GAINER|RISER|UP TODAY/.test(v)) return movers(currentEx, 1) || 'No quotes loaded for ' + esc(currentEx) + ' yet.';
    if(/LOSER|FALLER|DOWN TODAY/.test(v)) return movers(currentEx, -1) || 'No quotes loaded for ' + esc(currentEx) + ' yet.';
    const words = v.replace(/[^A-Z0-9 .]/g, ' ').split(/\s+/).filter(Boolean);
    const asked = words.filter(function(w){ return ['OPEN','SHOW','GO','TO','THE','PANEL'].indexOf(w) < 0; });
    for(let i = 0; i < asked.length; i++){
      const p = (typeof panelFor === 'function') ? panelFor(asked[i]) : null;
      if(p && p.id !== 'info' && typeof openPanelTab === 'function'){
        if(window.MTWin && !window.MTWin.isOpen('center')) window.MTWin.set('center', true);
        openPanelTab(p);
        return 'Opened the <b>' + esc(p.label) + '</b> panel in the centre window.';
      }
    }
    for(let i = 0; i < asked.length; i++){
      const w = asked[i];
      const sec = (typeof resolveSec === 'function') ? resolveSec(w) : null;
      if(!sec) continue;
      const row = rowsFor(sec.ex).find(function(s){ return (s.sym || s.ticker) === sec.sym; }) || {sym: sec.sym};
      if(sec.ex !== currentEx && typeof switchExchange === 'function') switchExchange(sec.ex);
      try{ if(typeof openStock === 'function') openStock(sec.sym); }catch(e){}
      return quoteCard(row, sec.ex) +
        '<div style="color:var(--tx3);margin-top:4px">Opened in the market window.</div>' +
        chips([w + ' FINANCIALS', w + ' NEWS']);
    }
    return null;
  }
  function sendAsk(text){
    bubble('me', esc(text));
    input.value = '';
    bubble('bot', localAnswer(text) || ('I could not match that to a security or a panel. ' + HELP));
  }
  askLog.addEventListener('click', function(e){
    const chip = e.target.closest('.chat-chip');
    if(chip){ input.value = chip.getAttribute('data-ask') || ''; sendAsk(input.value); }
  });
  $('chatClear').addEventListener('click', function(){
    if(mode === 'room'){ setNote('Only your own messages can be removed - hover one to delete it.'); return; }
    hist = []; saveHist(); askLog.innerHTML = '';
    bubble('bot', HELP, false);
  });

  // ---------------- shared plumbing ----------------
  function gate(){
    const signedIn = !!token();
    const block = mode === 'room' && !signedIn;
    input.disabled = block;
    sendBtn.disabled = block;
    input.placeholder = mode === 'room'
      ? (signedIn ? 'Message the room...' : 'Sign in to post')
      : 'Ask about a ticker or market...';
  }
  function setMode(m){
    mode = m;
    document.querySelectorAll('.chat-tab').forEach(function(t){
      t.classList.toggle('on', t.getAttribute('data-mode') === m);
    });
    roomLog.style.display = m === 'room' ? '' : 'none';
    askLog.style.display = m === 'ask' ? '' : 'none';
    setNote('');
    gate();
    if(m === 'room'){ refresh(); roomLog.scrollTop = roomLog.scrollHeight; }
    input.focus();
  }
  document.querySelectorAll('.chat-tab').forEach(function(t){
    t.addEventListener('click', function(){ setMode(t.getAttribute('data-mode')); });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const t = input.value.trim();
    if(!t) return;
    if(mode === 'room') sendRoom(t); else sendAsk(t);
  });

  if(hist.length){
    hist.slice(-MAX_HIST).forEach(function(m){ bubble(m.r === 'me' ? 'me' : 'bot', m.h, false); });
  }else{
    bubble('bot', HELP, false);
  }
  setMode('room');
  refresh();
  loop();
})();

// ===== Init =====

loadListing(currentEx);  // honor ?ex= deep-link, else remembered/inferred market
loadSearchIndex();       // every other market's tickers, so search spans all four

</script>
