<!--
  mx_compare.html - side-by-side comparison of 2 to 4 securities.

  A comparison only means something when the numbers stand on the SAME metric,
  the SAME period and the SAME currency. This panel enforces all three:

    * SOURCE. Every figure comes from the product's own audited analytics file
      (static_data/analytics/<KEY>.json): valuation.pe/pb/ps/peg with their
      pePeriod and their *_withheld flags and reasons, the ratios block (each
      ratio carries its own period), the growth block and the models block. The
      panel never recomputes a multiple in the browser and never borrows one
      security's number for another.
    * PERIOD. Each metric carries the period it actually belongs to. When every
      security shares one period the row names it once; when they differ the row
      says "periods differ" and each cell prints its own period, so a number from
      FY2025 and one from H1 2026 are never shown as if one column produced both.
    * CURRENCY. Prices and money rows are labelled with the security's own
      currency, per cell. The JSE quotes in CENTS (ZAc, 100 ZAc = 1 ZAR) while
      the other exchanges quote in major units, so a ZAc figure is never placed
      beside a shilling figure without its unit on it. When the selected
      securities are on different currencies the panel adds a converted price
      row built from static_data/fx.json and says so, cents divided out first.
    * ABSENCE. A missing metric renders as absent ("-"), never as zero and never
      as a peer's value. A withheld metric renders as "withheld" WITH its own
      reason. A row only one security has is dropped: one value is no comparison.

  Usage: mx_compare.html?a=SCOM&b=ABG.JO   (comma or space separated, 2 to 4)
         mx_compare.html?sym=SCOM           (deep link: fills A, offers peers)
  Vanilla JS, single file, no build step. Godel palette, mint accent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;--acc2:#1ecfb0;
    --amber:#e0a341;--blue:#6ea8fe;--violet:#c08cff;--mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px}
  .wrap{border:1px solid var(--line2);background:var(--bg);max-width:1040px}
  .head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--bg2);flex-wrap:wrap}
  .head .code{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .head .code.c1{color:var(--blue)}
  .head .code.c2{color:var(--amber)}
  .head .code.c3{color:var(--violet)}
  .head .vs{color:var(--tx3)}
  .head .name{color:var(--tx2);font-family:var(--ui)}
  .head .ex{color:var(--tx3);font-size:10px}
  .controls{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  input.tk{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;padding:6px 8px;font-family:var(--mono);font-size:11px;width:260px;text-transform:uppercase}
  button.go{background:var(--acc);color:#00160e;border:0;padding:6px 14px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;border-radius:2px}
  button.go:hover{background:var(--acc2)}
  .hint{color:var(--tx3);font-size:10px}
  .peers{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .peers .pl{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .peers a{color:var(--tx2);text-decoration:none;border:1px solid var(--line2);padding:3px 8px;border-radius:2px;font-size:11px;cursor:pointer}
  .peers a:hover{color:var(--acc);border-color:var(--acc)}
  .banner{margin:10px 14px 0;padding:8px 10px;border:1px solid #3a2f12;background:#170f02;color:var(--amber);font-family:var(--ui);font-size:11px;line-height:1.55}
  .banner b{font-family:var(--mono)}
  .chartbox{padding:12px 14px;border-bottom:1px solid var(--line2)}
  .chartbox .window{color:var(--tx3);font-size:10px;padding:0 0 8px;line-height:1.6}
  svg{display:block;width:100%;height:240px}
  .legend{display:flex;gap:16px;padding:6px 0 0;flex-wrap:wrap}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
  .legend .sw{width:10px;height:10px;border-radius:1px;display:inline-block}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 14px;text-align:right;white-space:nowrap;vertical-align:top}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);font-weight:400}
  thead th .hccy{display:block;color:var(--tx3);font-size:9px;letter-spacing:.02em;text-transform:none}
  tbody td{border-bottom:1px solid var(--line);color:var(--tx)}
  tbody tr.rowsec td{background:var(--bg2);color:var(--tx2);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px}
  td.item{color:var(--tx2);font-family:var(--ui)}
  td.item .per{color:var(--tx3);font-family:var(--mono);font-size:10px;margin-left:6px}
  td.item .per.warnp{color:var(--amber)}
  td.win{color:var(--acc);font-weight:700}
  td .cper{display:block;color:var(--amber);font-size:9px;font-family:var(--mono);margin-top:1px}
  .wh{color:var(--amber);font-size:10px;border-bottom:1px dotted var(--amber);cursor:help}
  .dim{color:var(--tx3)}
  .notes{padding:10px 14px;border-top:1px solid var(--line2);background:var(--bg2)}
  .notes .nt{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .notes .wn{color:var(--tx2);font-family:var(--ui);font-size:11px;line-height:1.5;margin:3px 0}
  .notes .wn b{color:var(--amber);font-family:var(--mono)}
  .verdict{padding:12px 14px;border-top:1px solid var(--line2);background:var(--bg2);font-family:var(--ui);font-size:12px;line-height:1.55}
  .verdict b{font-family:var(--mono)}
  .status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--bg2);color:var(--tx3);font-size:10px;line-height:1.5}
  .err{padding:24px 14px;color:var(--tx2);font-family:var(--ui);line-height:1.6}
  .err b{color:var(--down);font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"><span class="code">--</span></div>
  <div class="controls">
    <input class="tk" id="inToks" placeholder="SCOM, ABG.JO, KCB" maxlength="160">
    <button class="go" id="goBtn">COMPARE</button>
    <span class="hint">2 to 4 tickers, comma or space separated.</span>
  </div>
  <div class="peers" id="peers" style="display:none"></div>
  <div id="body">
    <div class="err">Enter two or more tickers.</div>
  </div>
  <div class="status" id="status">loading&hellip;</div>
</div>
<script>
'use strict';
var Q = new URLSearchParams(location.search);
var EXS = ['NSE','NGX','JSE','EGX'];
var MAX_SEC = 4;
var COL = ['#33e29a','#e0a341','#6ea8fe','#c08cff'];
var listingCache = {};
var FX = null, FX_ASOF = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function isNum(v){ return v!==null && v!==undefined && v!=='' && !isNaN(v); }
function num(v){ return isNum(v) ? Number(v) : null; }
function DASH(){ return '<span class="dim">-</span>'; }
function stripW(s){ return String(s==null?'':s).replace(/^Withheld:\s*/i,''); }
function fmtX(v){ if(!isNum(v)) return DASH(); var n=+v; return (Math.abs(n)>=100?n.toFixed(1):n.toFixed(2))+'x'; }
function fmtNum(v, dp){
  if(!isNum(v)) return DASH();
  var n=+v;
  if(dp!=null) return n.toFixed(dp);
  if(Math.abs(n)>=1000) return n.toLocaleString(undefined,{maximumFractionDigits:0});
  return n.toFixed(2);
}
function fmtMoney(v){
  if(!isNum(v)) return DASH();
  var f=+v, s=f<0?'-':'', a=Math.abs(f), o;
  if(a>=1e12) o=(a/1e12).toFixed(2)+'T';
  else if(a>=1e9) o=(a/1e9).toFixed(2)+'B';
  else if(a>=1e6) o=(a/1e6).toFixed(2)+'M';
  else if(a>=1e3) o=(a/1e3).toFixed(2)+'K';
  else o=a.toFixed(2);
  return s+o;
}
function parseYtd(v){
  if(v===null||v===undefined||v==='') return null;
  var s = String(v).replace(/[%+\s]/g,'');
  var n = Number(s);
  return isNaN(n) ? null : n;
}

/* ---- currency: never mix units silently --------------------------------
   The JSE quotes in cents (ZAc). 100 ZAc = 1 ZAR. A ZAc price placed beside
   a shilling price without saying so is a 100x error on screen, so every
   monetary cell carries its own currency code and the cents are named. */
function isCents(ccy){ return String(ccy||'').toUpperCase()==='ZAC'; }
function majorOf(ccy){
  var c = String(ccy||'').toUpperCase();
  if(c==='ZAC') return 'ZAR';
  if(c==='KSH') return 'KES';
  return c;
}
function inMajor(v, ccy){ return (v==null) ? null : (isCents(ccy) ? v/100 : v); }
function ccyLabel(ccy){
  var c = String(ccy||'');
  if(isCents(c)) return 'ZAc (cents)';
  return c || 'n/a';
}

/* ---- fx from the product's own static_data/fx.json --------------------- */
async function loadJSON(path){
  try{ var r = await fetch(path, {cache:'no-store'}); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
async function loadFx(){
  if(FX) return FX;
  var d = await loadJSON('../../static_data/fx.json');
  var map = {};
  if(d){
    FX_ASOF = d.as_of || (d.matrix && d.matrix[0] && d.matrix[0].as_of) || '';
    (d.matrix||[]).forEach(function(row){
      if(!row || !row.base) return;
      var b = String(row.base).toUpperCase();
      map[b] = map[b] || {};
      (row.cells||[]).forEach(function(c){
        if(c && c.to!=null && c.rate!=null) map[b][String(c.to).toUpperCase()] = Number(c.rate);
      });
    });
  }
  FX = map;
  return FX;
}
function fxRate(from, to){
  from = majorOf(from); to = majorOf(to);
  if(!from || !to) return null;
  if(from===to) return 1;
  if(FX && FX[from] && FX[from][to]!=null) return FX[from][to];
  return null;
}

/* ---- resolution: token -> listing row -> analytics file ---------------- */
function matchRow(s, tok){
  var t = String(tok||'').trim().toUpperCase();
  if(!t) return false;
  var forms = [s.sym, s.ticker, s.code, s.short, s.data_sym, s.display_sym].filter(Boolean);
  for(var i=0;i<forms.length;i++){
    var f = String(forms[i]).toUpperCase();
    if(f===t) return true;
    var base = f.split('.')[0];
    if(base && base===t) return true;
  }
  if(String(s.name||'').toUpperCase()===t) return true;
  return false;
}
async function loadListing(ex){
  if(!listingCache[ex]){
    var d = await loadJSON('../../static_data/listing_'+ex+'.json');
    listingCache[ex] = d ? (d.stocks||[]) : [];
  }
  return listingCache[ex];
}
async function resolveStock(tok){
  var prefer = (Q.get('ex')||'').toUpperCase();
  var order = prefer ? [prefer].concat(EXS.filter(function(e){return e!==prefer;})) : EXS.slice();
  for(var i=0;i<order.length;i++){
    var rows = await loadListing(order[i]);
    for(var j=0;j<rows.length;j++){
      if(matchRow(rows[j], tok)) return Object.assign({ ex: order[i] }, rows[j]);
    }
  }
  return null;
}
function keyForms(s){
  var out=[], seen={};
  function add(k){ k=String(k==null?'':k).toUpperCase().replace(/\//g,'_'); if(k && !seen[k]){ seen[k]=1; out.push(k); } }
  add(s.sym); add(s.ticker); add(s.code); add(s.short); add(s.data_sym);
  [s.sym, s.ticker, s.code].forEach(function(k){
    if(k && String(k).indexOf('.')>=0) add(String(k).split('.')[0]);
  });
  return out;
}
async function loadAnalytics(s){
  var keys = keyForms(s);
  for(var i=0;i<keys.length;i++){
    var d = await loadJSON('../../static_data/analytics/'+encodeURIComponent(keys[i])+'.json');
    if(d && (d.valuation || d.ratios)) return d;
  }
  return null;
}
function histPaths(s){
  var ex = s.ex, sym = s.sym || s.ticker;
  if(ex==='NSE') return ['NSE_'+s.ticker+'.json'];
  if(ex==='NGX') return ['NGX_'+s.ticker+'.json'];
  return [sym+'.max.json', sym+'.json'];
}
async function loadHistory(s){
  var paths = histPaths(s);
  for(var i=0;i<paths.length;i++){
    var d = await loadJSON('../../static_data/history/'+paths[i]);
    if(d && d.bars && d.bars.length) return d;
  }
  return null;
}
function barDate(b){
  var t = b.t;
  if(typeof t === 'string') return t.slice(0,10);
  if(typeof t === 'number') return new Date(t*1000).toISOString().slice(0,10);
  return null;
}

/* ---- per-metric extraction. Every cell: {v, unit, period, withheld, reason} */
function ratioEntry(an, key){
  if(!an || !an.ratios) return null;
  for(var i=0;i<an.ratios.length;i++){ if(an.ratios[i] && an.ratios[i].key===key) return an.ratios[i]; }
  return null;
}
function multCell(an, k){
  if(!an || !an.valuation) return { v:null, unit:'x' };
  var v = an.valuation;
  var period = v[k+'Period'] || v.pePeriod || v.asOfPeriod || v.ratiosPeriod || null;
  if(v[k]!=null) return { v:num(v[k]), unit:'x', period:period };
  if(v[k+'_withheld']) return { v:null, unit:'x', period:period, withheld:true, reason:v[k+'_withheld_reason']||'' };
  return { v:null, unit:'x', period:period };
}
function ratioCell(an, key, fallbackPeriod){
  var r = ratioEntry(an, key);
  if(!r) return { v:null };
  var per = r.period || fallbackPeriod || null;
  var unit = r.unit || '';
  if(r.value!=null) return { v:num(r.value), unit:unit, period:per, label:r.label||key };
  if(r.withheld) return { v:null, unit:unit, period:per, label:r.label||key, withheld:true, reason:r.withheld_reason||'' };
  return { v:null, unit:unit, period:per, label:r.label||key };
}
function ratioCellAny(an, keys, fallbackPeriod){
  for(var i=0;i<keys.length;i++){
    if(ratioEntry(an, keys[i])) return ratioCell(an, keys[i], fallbackPeriod);
  }
  return { v:null };
}

function ROWS(){
  var out = [];
  [['pe','P/E'],['pb','P/B'],['ps','P/S'],['peg','PEG']].forEach(function(m){
    out.push({ id:m[0], label:m[1], unit:'x', dir:'lower', sec:'Valuation (multiples)',
      get:function(s){ return multCell(s.an, m[0]); } });
  });
  [
    ['roe','Return on equity','%','higher'],
    ['roa','Return on assets','%','higher'],
    ['net_margin','Net margin','%','higher'],
    ['gross_margin','Gross margin','%','higher'],
    ['ebit_margin','Operating margin','%','higher'],
    ['roce','Return on capital employed','%','higher'],
    ['roic','Return on invested capital','%','higher'],
    ['asset_turnover','Asset turnover','x','higher'],
    ['current_ratio','Current ratio','','higher'],
    ['interest_cover','Interest cover','x','higher'],
    ['revenue_growth','Revenue growth','%','higher'],
    ['ocf_to_net_profit','Cash conversion','x','higher'],
    ['effective_tax_rate','Effective tax rate','%','lower'],
    ['eps','Earnings per share','ccy',null],
    ['net_profit','Net profit','money',null]
  ].forEach(function(r){
    out.push({ id:r[0], label:r[1], unit:r[2], dir:r[3], sec:'Profitability and efficiency',
      get:function(s){ return ratioCell(s.an, r[0], s.an && s.an.period); } });
  });
  out.push({ id:'debt_to_equity', label:'Debt to equity', unit:'x', dir:'lower', sec:'Leverage',
    get:function(s){ return ratioCellAny(s.an, ['debt_to_equity','liabilities_to_equity','net_debt_to_equity'], s.an && s.an.period); } });
  out.push({ id:'rev_cagr', label:'Revenue CAGR', unit:'%', dir:'higher', sec:'Growth',
    get:function(s){
      var g = s.an && s.an.growth; if(!g) return { v:null, unit:'%' };
      var per = (g.from && g.to) ? (g.from+' to '+g.to) : null;
      return { v: num(g.revenue_cagr), unit:'%', period:per };
    } });
  out.push({ id:'np_cagr', label:'Net profit CAGR', unit:'%', dir:'higher', sec:'Growth',
    get:function(s){
      var g = s.an && s.an.growth; if(!g) return { v:null, unit:'%' };
      var per = (g.from && g.to) ? (g.from+' to '+g.to) : null;
      return { v: num(g.net_profit_cagr), unit:'%', period:per };
    } });
  out.push({ id:'fscore', label:'Piotroski F-score', unit:'', dir:'higher', sec:'Model',
    get:function(s){
      var mo = s.an && s.an.models; if(!mo) return { v:null, unit:'' };
      var per = s.an.period || (s.an.valuation && s.an.valuation.asOfPeriod) || null;
      return { v: mo.fscore==null?null:num(mo.fscore), unit:'', period:per };
    } });
  return out;
}

/* ---- chart: indexed price return over the common window ----------------
   Each series is rebased to 100 at the first common date. A return is
   unit-free, so a ZAc series and a KES series can share one frame; the window
   and the point count are printed so the reader sees the basis. */
function alignDates(series){
  var maps = series.map(function(s){ var m=new Map(); s.forEach(function(x){ m.set(x.date, x.c); }); return m; });
  var dates = [];
  maps[0].forEach(function(_, d){
    for(var i=1;i<maps.length;i++){ if(!maps[i].has(d)) return; }
    dates.push(d);
  });
  dates.sort();
  return { dates:dates, maps:maps };
}
function downsampleIdx(len, n){
  if(len<=n) return Array.apply(null,Array(len)).map(function(_,i){ return i; });
  var out=[], step=(len-1)/(n-1);
  for(var i=0;i<n;i++) out.push(Math.round(i*step));
  return out;
}
function renderChart(secs, series){
  var rets = secs.map(function(){ return null; });
  if(series.some(function(s){ return !s || s.length<2; })){
    return { html:'<div class="window">No common price history for these securities.</div>', rets: rets };
  }
  var A = alignDates(series);
  var dates = A.dates, maps = A.maps;
  if(dates.length < 2){
    return { html:'<div class="window">No common price history for these securities.</div>', rets: rets };
  }
  var d0 = dates[0], dN = dates[dates.length-1];
  maps.forEach(function(m, i){ var a=m.get(d0), b=m.get(dN); if(a!=null && b!=null) rets[i]=(b/a-1)*100; });

  var W=920,H=220,L=44,R=12,T=10,B=22, iw=W-L-R, ih=H-T-B;
  var idx = downsampleIdx(dates.length, 90);
  var pts = idx.map(function(ix){ return dates[ix]; });
  var bases = maps.map(function(m){ return m.get(d0); });
  var seriesPct = maps.map(function(m, si){ return pts.map(function(d){ return (m.get(d)/bases[si]-1)*100; }); });
  var all = [];
  seriesPct.forEach(function(sp){ all = all.concat(sp); });
  var lo = Math.min(0, Math.min.apply(null, all)), hi = Math.max(0, Math.max.apply(null, all));
  var pad = (hi-lo)*0.08 || 1; lo -= pad; hi += pad;
  function X(i){ return L + (i/(pts.length-1))*iw; }
  function Y(v){ return T + (1-(v-lo)/(hi-lo))*ih; }
  function line(sp){ var d=''; for(var i=0;i<sp.length;i++){ d += (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(sp[i]).toFixed(1); } return d; }
  var grid='';
  for(var g=0; g<=5; g++){
    var v = lo + (hi-lo)*g/5, y = Y(v);
    grid += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#1a1a1a"/>';
    grid += '<text x="'+(L-6)+'" y="'+(y+3)+'" fill="#6a6a6a" font-size="9" text-anchor="end">'+v.toFixed(0)+'%</text>';
  }
  var zeroY = Y(0);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' + grid
    + '<line x1="'+L+'" y1="'+zeroY+'" x2="'+(W-R)+'" y2="'+zeroY+'" stroke="#3a3a3a" stroke-dasharray="3 3"/>';
  for(var si=seriesPct.length-1; si>=0; si--){
    svg += '<path d="'+line(seriesPct[si])+'" fill="none" stroke="'+COL[si%COL.length]+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
  }
  svg += '<text x="'+L+'" y="'+(H-6)+'" fill="#6a6a6a" font-size="9" text-anchor="start">'+pts[0]+'</text>';
  svg += '<text x="'+(W-R)+'" y="'+(H-6)+'" fill="#6a6a6a" font-size="9" text-anchor="end">'+pts[pts.length-1]+'</text>';
  svg += '</svg>';
  var winTxt = 'common window ' + d0 + ' to ' + dN + ' (' + pts.length + ' points).';
  var legend = '';
  seriesPct.forEach(function(sp, k){
    if(!sp) return;
    var last = sp[sp.length-1];
    legend += '<span class="li"><span class="sw" style="background:'+COL[k%COL.length]+'"></span>'+esc(secs[k].ticker||secs[k].sym)+' '+(last>=0?'+':'')+last.toFixed(1)+'%</span>';
  });
  return { html: '<div class="window">'+winTxt+'</div>' + svg + '<div class="legend">'+legend+'</div>', rets: rets };
}

/* ---- table ------------------------------------------------------------ */
function cellFmt(row, c){
  if(c.v==null){
    if(c.withheld) return '<span class="wh" title="'+esc(stripW(c.reason))+'">withheld</span>';
    return DASH();
  }
  var v = c.v;
  if(row.unit==='%') return fmtNum(v)+'%';
  if(row.unit==='x') return fmtX(v);
  if(row.unit==='money') return fmtMoney(v)+' '+esc(c.unit||'');
  if(row.unit==='ccy') return fmtNum(v)+' '+esc(c.unit||'');
  return fmtNum(v);
}
function periodSet(cells){
  var seen={}, out=[];
  cells.forEach(function(c){ if(c && c.v!=null && c.period && !seen[c.period]){ seen[c.period]=1; out.push(c.period); } });
  return out;
}
function numCount(cells){ return cells.filter(function(c){ return c && c.v!=null; }).length; }
function bestIdx(cells, dir){
  var bi=-1, bv=null;
  cells.forEach(function(c, i){
    if(!c || c.v==null) return;
    if(bv==null || (dir==='higher' ? c.v>bv : c.v<bv)){ bv=c.v; bi=i; }
  });
  return bi;
}

function renderTable(secs){
  var rows = ROWS();
  var head = '<thead><tr><th>Metric</th>';
  secs.forEach(function(s, i){
    head += '<th><span style="color:'+COL[i%COL.length]+'">'+esc(s.ticker||s.sym)+'</span>'
          + '<span class="hccy">'+esc(ccyLabel(s.quoteCcy))+'</span></th>';
  });
  head += '</tr></thead>';
  var body = '';
  var cmpRows = 0;

  function emitRow(label, cells, opt){
    if(numCount(cells) < 2) return '';                     // one value is no comparison
    var pers = periodSet(cells);
    var mixed = pers.length > 1;
    var rowPeriod = (pers.length===1) ? pers[0] : null;
    var bi = (opt.dir && !mixed) ? bestIdx(cells, opt.dir) : -1;
    var html = '<tr><td class="item">'+esc(label)
      + (mixed ? ' <span class="per warnp">periods differ</span>'
               : (rowPeriod ? ' <span class="per">'+esc(rowPeriod)+'</span>' : ''))
      + '</td>';
    cells.forEach(function(c, i){
      var cls = (i===bi) ? 'win' : '';
      var txt = cellFmt(opt.row, c);
      if(mixed && c && c.v!=null && c.period){ txt += '<span class="cper">'+esc(c.period)+'</span>'; }
      html += '<td class="'+cls+'">'+txt+'</td>';
    });
    html += '</tr>';
    return html;
  }

  // informational price row: quote unit, labelled, per cell
  body += '<tr><td class="item">Price <span class="per">quote unit</span></td>';
  secs.forEach(function(s){
    body += '<td>'+((s.price!=null) ? (fmtNum(s.price)+' '+esc(s.quoteCcy||'')) : DASH())+'</td>';
  });
  body += '</tr>';

  // converted price row, only when the selected securities are on different majors
  var majors = [];
  secs.forEach(function(s){ var m = majorOf(s.quoteCcy); if(m && majors.indexOf(m)<0) majors.push(m); });
  if(majors.length > 1 && FX){
    var target = majors[0];
    var conv = secs.map(function(s){
      var pm = inMajor(num(s.price), s.quoteCcy);
      var r = fxRate(s.quoteCcy, target);
      return (pm!=null && r!=null) ? (pm*r) : null;
    });
    if(conv.filter(function(x){ return x!=null; }).length >= 2){
      var note = 'to '+target + (FX_ASOF ? (' as of '+FX_ASOF) : '');
      body += '<tr><td class="item">Price, converted <span class="per">'+esc(note)+'</span></td>';
      conv.forEach(function(x){ body += '<td>'+(x!=null ? (fmtNum(x)+' '+esc(target)) : DASH())+'</td>'; });
      body += '</tr>';
    }
  }

  body += emitRow('Day change', secs.map(function(s){ return { v:num(s.chgPct) }; }), { row:{unit:'%'}, dir:null });
  body += emitRow('YTD return', secs.map(function(s){ return { v:parseYtd(s.ytd) }; }), { row:{unit:'%'}, dir:null });

  var groups = [], gidx = {};
  rows.forEach(function(r){
    if(!(r.sec in gidx)){ gidx[r.sec] = groups.length; groups.push({ sec:r.sec, rows:[] }); }
    groups[gidx[r.sec]].rows.push(r);
  });
  groups.forEach(function(g){
    var inner = '';
    g.rows.forEach(function(r){
      var rh = emitRow(r.label, secs.map(function(s){ return r.get(s); }), { row:r, dir:r.dir });
      if(rh){ cmpRows++; inner += rh; }
    });
    // an empty section is a section the reader cannot compare: drop its header too
    if(inner) body += '<tr class="rowsec"><td colspan="'+(secs.length+1)+'">'+esc(g.sec)+'</td></tr>' + inner;
  });

  return { html: '<table>'+head+'<tbody>'+body+'</tbody></table>', cmpRows: cmpRows };
}

function collectWithheld(secs, rows){
  var out = [];
  rows.forEach(function(r){
    secs.forEach(function(s){
      var c = r.get(s);
      if(c && c.v==null && c.withheld && c.reason){
        out.push({ tag: String(s.ticker||s.sym), metric: r.label, reason: stripW(c.reason) });
      }
    });
  });
  return out;
}

function verdict(secs, rets){
  var p = [];
  var withRet = [];
  secs.forEach(function(s, i){ if(rets[i]!=null) withRet.push({ s:s, r:rets[i] }); });
  if(withRet.length>=2){
    withRet.sort(function(a,b){ return b.r-a.r; });
    var w = withRet[0], l = withRet[withRet.length-1];
    if(w.r===l.r) p.push('All compared securities returned <b>'+w.r.toFixed(1)+'%</b> over the common window.');
    else p.push('<b>'+esc(w.s.ticker||w.s.sym)+'</b> returned the most over the common window (<b>'+w.r.toFixed(1)+'%</b>) against <b>'+l.r.toFixed(1)+'%</b> for '+esc(l.s.ticker||l.s.sym)+'.');
  }
  // Compare a multiple only when at least two carry a value AND every one of
  // those stands on the SAME period. Otherwise name the mismatch.
  [['pe','P/E'],['pb','P/B'],['ps','P/S']].forEach(function(m){
    var have = [];
    secs.forEach(function(s){ var c = multCell(s.an, m[0]); if(c.v!=null) have.push({ s:s, c:c }); });
    if(have.length < 2) return;
    var pers = {}, mixed = false;
    have.forEach(function(h){ if(h.c.period){ if(Object.keys(pers).length && !(h.c.period in pers)) mixed = true; pers[h.c.period] = 1; } });
    if(mixed){
      p.push('<b>'+m[1]+'</b> is not compared: the securities stand on different periods ('+have.map(function(h){ return esc(h.s.ticker||h.s.sym)+' '+esc(h.c.period||'n/a'); }).join(', ')+').');
      return;
    }
    if(m[0]==='pe'){
      have.sort(function(a,b){ return a.c.v-b.c.v; });
      p.push('<b>'+esc(have[0].s.ticker||have[0].s.sym)+'</b> trades on the lower P/E (<b>'+have[0].c.v.toFixed(1)+'x</b> vs '+have[have.length-1].c.v.toFixed(1)+'x'+(have[0].c.period?', both on '+esc(have[0].c.period):'')+').');
    }
  });
  if(!p.length) return 'Not enough shared, period-aligned data.';
  return p.join(' ');
}

/* ---- head / peers ----------------------------------------------------- */
function renderHead(secs){
  var h = '';
  secs.forEach(function(s, i){
    if(i) h += '<span class="vs">vs</span>';
    h += '<span class="code c'+i+'">'+esc(s.ticker||s.sym)+'</span>'
       + '<span class="name">'+esc(s.name||'')+'</span>'
       + '<span class="ex">'+esc(s.ex||'')+'</span>';
  });
  $('head').innerHTML = h;
}
function renderPeers(secs){
  var box = $('peers');
  var a = secs[0];
  if(!a || !a.sector){ box.style.display='none'; box.innerHTML=''; return; }
  var have = {};
  secs.forEach(function(s){ have[String(s.ticker||s.sym).toUpperCase()] = 1; });
  var peers = [];
  EXS.forEach(function(ex){
    (listingCache[ex]||[]).forEach(function(s){
      var k = String(s.ticker||s.sym||'').toUpperCase();
      if(k && !have[k] && (s.sector||'').toLowerCase()===(a.sector||'').toLowerCase()) peers.push(k);
    });
  });
  if(!peers.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  var html = '<span class="pl">'+esc(a.sector)+' peers:</span>';
  peers.slice(0,14).forEach(function(t){ html += '<a data-tk="'+esc(t)+'">'+esc(t)+'</a>'; });
  box.innerHTML = html;
  box.querySelectorAll('a[data-tk]').forEach(function(el){
    el.addEventListener('click', function(){
      var toks = secs.map(function(s){ return String(s.ticker||s.sym).toUpperCase(); });
      var tk = el.getAttribute('data-tk');
      if(toks.indexOf(tk) >= 0) return;
      if(toks.length >= MAX_SEC) toks = toks.slice(0, MAX_SEC-1);
      toks.push(tk);
      compare(toks.join(' '));
    });
  });
}

/* ---- main ------------------------------------------------------------- */
function parseToks(v){
  if(!v) return [];
  return String(v).split(/[\s,]+/).map(function(t){ return t.trim().toUpperCase(); }).filter(Boolean);
}
function dedupeCap(toks){
  var out = [];
  toks.forEach(function(t){ if(out.indexOf(t)<0) out.push(t); });
  return out.slice(0, MAX_SEC);
}
async function buildSec(stock){
  var an = await loadAnalytics(stock);
  var hist = await loadHistory(stock);
  return {
    ex: stock.ex,
    ticker: stock.ticker || stock.code || stock.short || String(stock.sym||'').split('.')[0],
    sym: stock.sym,
    name: stock.name,
    sector: stock.sector,
    quoteCcy: stock.currency || '',
    price: num(stock.price),
    chgPct: num(stock.chgPct),
    ytd: stock.ytd,
    an: an,
    hist: hist
  };
}
async function compare(tokArg){
  var toks = dedupeCap(parseToks(tokArg));
  $('inToks').value = toks.join(', ');
  if(toks.length < 2){
    $('body').innerHTML = '<div class="err">At least two tickers.</div>';
    $('status').textContent = 'need two or more';
    return;
  }
  $('status').textContent = 'loading ' + toks.join(', ');
  var resolved = [], missing = [];
  for(var i=0;i<toks.length;i++){
    var r = await resolveStock(toks[i]);
    if(r) resolved.push(r); else missing.push(toks[i]);
  }
  if(missing.length){
    $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(missing.join(', '))+'</b>.</div>';
    $('status').textContent = 'not found';
    return;
  }
  await loadFx();
  var secs = [];
  for(var k=0;k<resolved.length;k++){ secs.push(await buildSec(resolved[k])); }

  renderHead(secs);
  renderPeers(secs);

  var rows = ROWS();
  var html = '';

  // currency banner: currencies are never mixed in silence
  var majors = [];
  secs.forEach(function(s){ var m = majorOf(s.quoteCcy); if(m && majors.indexOf(m)<0) majors.push(m); });
  if(majors.length > 1){
    var ccys = [];
    secs.forEach(function(s){ var l = ccyLabel(s.quoteCcy); if(l && ccys.indexOf(l)<0) ccys.push(l); });
    var anyCents = secs.some(function(s){ return isCents(s.quoteCcy); });
    html += '<div class="banner"><b>Currencies differ: '+esc(ccys.join(', '))+'.</b>'
          + (anyCents ? ' 100 ZAc = 1 ZAR.' : '') + '</div>';
  }

  // period banner: the newest period each security reports on, and the basis
  // the multiples stand on
  var perBits = secs.map(function(s){
    var newest = (s.an && s.an.period) || 'n/a';
    var base = (s.an && s.an.valuation && (s.an.valuation.pePeriod || s.an.valuation.asOfPeriod)) || 'n/a';
    return esc(s.ticker||s.sym)+' newest '+esc(newest)+', multiples on '+esc(base);
  });
  html += '<div class="banner" style="border-color:#122a20;background:#03170f;color:#7fd7b0">'
        + '<b>Periods.</b> '+perBits.join(' &middot; ')+'</div>';

  var series = secs.map(function(s){
    if(!s.hist) return null;
    return (s.hist.bars||[]).map(function(b){ return { date:barDate(b), c:b.c }; }).filter(function(x){ return x.date && x.c!=null; });
  });
  var chart = renderChart(secs, series);
  html += '<div class="chartbox">' + chart.html + '</div>';
  var tbl = renderTable(secs);
  html += tbl.html;
  if(tbl.cmpRows === 0){
    html += '<div class="notes"><div class="nt">No shared fundamental metric</div></div>';
  }

  var wd = collectWithheld(secs, rows);
  if(wd.length){
    html += '<div class="notes"><div class="nt">Withheld metrics</div>';
    wd.forEach(function(w){ html += '<div class="wn"><b>'+esc(w.tag)+'</b> '+esc(w.metric)+': '+esc(w.reason)+'</div>'; });
    html += '</div>';
  }

  html += '<div class="verdict">'+verdict(secs, chart.rets)+'</div>';
  $('body').innerHTML = html;
  $('status').textContent = 'Source: company filings and exchange listings.';
}

/* ---- controls / boot -------------------------------------------------- */
$('goBtn').addEventListener('click', function(){ compare($('inToks').value); });
$('inToks').addEventListener('keydown', function(e){ if(e.key==='Enter') $('goBtn').click(); });

(async function(){
  var toks = [];
  ['a','b','c','d'].forEach(function(p){ toks = toks.concat(parseToks(Q.get(p))); });
  var fromSym = false;
  var sym = Q.get('sym');
  if(!toks.length && sym){ toks = parseToks(sym); fromSym = true; }
  toks = dedupeCap(toks);
  $('inToks').value = toks.join(', ');
  if(toks.length >= 2){ await compare(toks.join(' ')); return; }
  if(toks.length === 1){
    var one = await resolveStock(toks[0]);
    if(!one){
      $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(toks[0])+'</b>.</div>';
      $('status').textContent = 'not found';
      return;
    }
    // warm every listing so a peer can be found across exchanges
    for(var i=0;i<EXS.length;i++){ await loadListing(EXS[i]); }
    // a ?sym= deep link fills side A; auto-pick one same-sector peer so the panel
    // is not left blank, but never invent a comparison beyond that pair
    var secOne = await buildSec(one);
    renderHead([secOne]);
    var pool = [];
    EXS.forEach(function(ex){
      (listingCache[ex]||[]).forEach(function(s){
        var k = String(s.ticker||s.sym||'');
        if(k && k.toUpperCase() !== String(one.ticker||one.sym).toUpperCase() && (s.sector||'').toLowerCase()===(one.sector||'').toLowerCase())
          pool.push({ ex:ex, k:k });
      });
    });
    pool.sort(function(x,y){ return (x.ex===one.ex?0:1)-(y.ex===one.ex?0:1); });
    if(fromSym && pool.length){
      await compare(String(one.ticker||one.sym).toUpperCase() + ' ' + pool[0].k.toUpperCase());
      return;
    }
    renderPeers([secOne]);
    $('body').innerHTML = '<div class="err">Comparing <b>'+esc(secOne.ticker||secOne.sym)+'</b>.</div>';
    $('status').textContent = 'ready';
    return;
  }
  $('status').textContent = 'ready';
})();
</script>
