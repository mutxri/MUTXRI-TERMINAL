<!--
  mx_compare.html - side-by-side comparison of two or more securities.

  A comparison only means something when the numbers stand on the SAME metric,
  the SAME period and the SAME currency. This panel enforces all three:

    * SOURCE. Every figure comes from the product's own audited analytics file
      (static_data/analytics/<KEY>.json): valuation.pe/pb/ps/peg with their
      pePeriod and their *_withheld flags and reasons, the ratios block (each
      ratio carries its own period), the growth block and the models block. The
      panel never recomputes a multiple in the browser and never borrows one
      security's number for another.
    * PERIOD. Each metric carries the period it actually belongs to. When every
      security shares one period the row names it once; when they differ the row
      says "periods differ" and each cell prints its own period, so a number from
      FY2025 and one from H1 2026 are never shown as if one column produced both.
    * CURRENCY. Prices and money rows are labelled with the security's own
      currency, per cell. The JSE quotes in CENTS (ZAc, 100 ZAc = 1 ZAR) while
      the other exchanges quote in major units, so a ZAc figure is never placed
      beside a shilling figure without its unit on it. When the selected
      securities are on different currencies the panel adds a converted price
      row built from static_data/fx.json and says so, cents divided out first.
    * ABSENCE. A missing metric renders as absent ("-"), never as zero and never
      as a peer's value. A withheld metric renders as "withheld" WITH its own
      reason. A row only one security has is dropped: one value is no comparison.

  What can be compared here is not only shares. A money market, fixed income
  or special fund is a token too: a category (MMF, SPECIAL, FIXED, EQUITY,
  BALANCED) brings the regulator's own figures for that category, and a named
  fund (MANSAX, ETICAWEALTHA, ZIMELESAVINGS and the rest of funds_KE.json)
  brings its manager's own published numbers, each with the metric its manager
  labelled it with. Beside them runs the cash line: the same money in the
  91-day Treasury bill, compounded month by month at the Central Bank of
  Kenya's own published rate for that month.

  The chart area holds three views of that one window, switched on the bar:
    * LINES   - the flat rebased chart.
    * 3D      - the same lanes turned: time along one edge, the series pulled
                apart in depth, percent return as height. Depth is separation
                only and carries no quantity.
    * MONEY   - the whole Kenyan rate surface (mx_curve.html), the context the
      CURVE     cash line is compounded from.

  Usage: mx_compare.html?a=SCOM&b=ABG.JO   (comma or space separated, two or more)
         mx_compare.html?a=SCOM&b=MANSAX   (a share against a named fund)
         mx_compare.html?sym=SCOM           (deep link: fills A, offers peers)
  HOW MANY. There is no cap. The comparison used to stop at four, which is a
  chart convention and not a fact about the data: the window, the rebasing and
  the table work for any number, so the limit is now the reader's eye. Each
  security takes its own colour from a fourteen-hue palette that holds no gold
  (the Treasury bill line) and no violet (a named fund), the header prints each
  code in the colour of its own line, and the table scrolls sideways in its own
  box rather than letting a column fall off the panel.

  Vanilla JS, single file, no build step. Godel palette, mint accent.
-->

<script>
'use strict';
var Q = new URLSearchParams(location.search);
var EXS = ['NSE','NGX','JSE','EGX'];
/* NO CAP. The comparison used to stop at four securities, which is a chart
   convention and not a fact about the data: the window, the rebasing and the
   table all work for any number. The only real limit is the eye, so the lines
   are coloured from a palette wide enough to tell a dozen apart and the
   colour is repeated nowhere a reader has to guess. */
var MAX_SEC = 0;
/* Every line on one frame has to be told apart at a glance, and all of them
   have to be told apart from the gold benchmark line and from the violet a
   named fund takes. These fourteen hues are the order the header prints them
   in, so a code at the top and a line in the chart are never different
   colours, and gold is not among them. */
var COL = ['#33e29a','#e0a340','#7aa2f7','#f87171','#4dd4e8','#f49ac2','#a3e635',
           '#ff9f5a','#5eead4','#9ca3f7','#fb7185','#38bdf8','#d9f99d','#fdba74'];
var GOLD = '#f5c542';
/* THE WINDOW. A comparison is only as honest as the dates it runs between, so
   the window is a control rather than an accident of which security has the
   shortest history. MAX is every session the securities share; YTD starts at
   the first session of this calendar year; 1Y and 3Y count back from the last.
   The cut happens before anything is rebased, so every line, the cash line and
   every fund point are measured from the same first day. */
var RANGES = [['YTD', 'ytd'], ['1Y', '1y'], ['3Y', '3y'], ['MAX', 'max']];
var RANGE = (Q.get('range') || 'max').toLowerCase();
var listingCache = {};
var FX = null, FX_ASOF = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function isNum(v){ return v!==null && v!==undefined && v!=='' && !isNaN(v); }
function num(v){ return isNum(v) ? Number(v) : null; }
function DASH(){ return '<span class="dim">-</span>'; }
function stripW(s){ return String(s==null?'':s).replace(/^Withheld:\s*/i,''); }
/* A withheld cell carries the fact that withheld it: the unit, the period, the
   line item off file, or the two keys of one company whose figures disagree.
   The audit tail that follows ("A blank is honest...") and the scope sentence
   after a conflict are conclusions, so the cell states the fact only. */
function whyShort(reason){
  var s = stripW(reason).trim();
  ['A blank is honest',
   'Every market-based multiple of this security is built on that market cap',
   '; one market capitalisation cannot be two',
   'the ratio is only meaningful for POSITIVE earnings growth'].forEach(function(m){
    var i = s.indexOf(m);
    if(i > 0) s = s.slice(0, i).trim();
  });
  s = s.replace(/[\s;:,]+$/,'');
  if(s && !/[.!?]$/.test(s)) s += '.';
  return s;
}
function fmtX(v){ if(!isNum(v)) return DASH(); var n=+v; return (Math.abs(n)>=100?n.toFixed(1):n.toFixed(2))+'x'; }
function fmtNum(v, dp){
  if(!isNum(v)) return DASH();
  var n=+v;
  if(dp!=null) return n.toFixed(dp);
  if(Math.abs(n)>=1000) return n.toLocaleString(undefined,{maximumFractionDigits:0});
  return n.toFixed(2);
}
function fmtMoney(v){
  if(!isNum(v)) return DASH();
  var f=+v, s=f<0?'-':'', a=Math.abs(f), o;
  if(a>=1e12) o=(a/1e12).toFixed(2)+'T';
  else if(a>=1e9) o=(a/1e9).toFixed(2)+'B';
  else if(a>=1e6) o=(a/1e6).toFixed(2)+'M';
  else if(a>=1e3) o=(a/1e3).toFixed(2)+'K';
  else o=a.toFixed(2);
  return s+o;
}
function parseYtd(v){
  if(v===null||v===undefined||v==='') return null;
  var s = String(v).replace(/[%+\s]/g,'');
  var n = Number(s);
  return isNaN(n) ? null : n;
}

/* ---- currency: never mix units silently --------------------------------
   The JSE quotes in cents (ZAc). 100 ZAc = 1 ZAR. A ZAc price placed beside
   a shilling price without saying so is a 100x error on screen, so every
   monetary cell carries its own currency code and the cents are named. */
function isCents(ccy){ return String(ccy||'').toUpperCase()==='ZAC'; }
function majorOf(ccy){
  var c = String(ccy||'').toUpperCase();
  if(c==='ZAC') return 'ZAR';
  if(c==='KSH') return 'KES';
  return c;
}
function inMajor(v, ccy){ return (v==null) ? null : (isCents(ccy) ? v/100 : v); }
function ccyLabel(ccy){
  var c = String(ccy||'');
  if(isCents(c)) return 'ZAc (cents)';
  return c || 'n/a';
}

/* ---- fx from the product's own static_data/fx.json --------------------- */
async function loadJSON(path){
  try{ var r = await fetch(path, {cache:'no-store'}); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
async function loadFx(){
  if(FX) return FX;
  var d = await loadJSON('../../static_data/fx.json');
  var map = {};
  if(d){
    FX_ASOF = d.as_of || (d.matrix && d.matrix[0] && d.matrix[0].as_of) || '';
    (d.matrix||[]).forEach(function(row){
      if(!row || !row.base) return;
      var b = String(row.base).toUpperCase();
      map[b] = map[b] || {};
      (row.cells||[]).forEach(function(c){
        if(c && c.to!=null && c.rate!=null) map[b][String(c.to).toUpperCase()] = Number(c.rate);
      });
    });
  }
  FX = map;
  return FX;
}
/* ---- the cash line ------------------------------------------------------
   The chart rebases every security to 0% at the start of the window. The cash
   line is built the same way and from the Central Bank of Kenya's OWN monthly
   91-day Treasury bill series (static_data/macro_rates.json, monthly_rates[].
   t_bill_91d, 1991 to date): each month's published rate is applied to the days
   of that month that fall inside the window, so the curve is the path the bill
   actually took, never today's rate projected backwards. Each month converts as
   (1 + r)^(days/365), stated on the chart.

   Three rules keep it honest. The series is Kenyan, so the line is drawn only
   when every selected security quotes in shillings: a shilling bill is not a
   reference for a rand or a naira return. A month with no published rate is
   never bridged - the line stops there. And where the series ends before the
   price window does, the line ends with it, says so, and the beat-the-bill
   verdict is measured to that date for every security, not to two dates. */
/* ---- funds as things you can put IN a comparison -----------------------
   A reader does not only weigh one share against another: the real question is
   whether to own the share at all or leave the money in a fund. So the fund
   CATEGORIES the Capital Markets Authority licenses are first-class tokens
   here - MMF, SPECIAL, FIXED, EQUITY, BALANCED - resolved from
   static_data/cis_NSE.json, the CMA's own Soundness Report figures.

   What a fund brings to the frame is its size, its share of the industry and
   the CMA's own definition of what it invests in. What it does NOT bring is a
   return: the CMA publishes no fund yield, so the return cell is withheld with
   that reason, and the only rate drawn on the chart is the Treasury bill, which
   is a published rate and is named as itself, never as a fund's. */
var CIS = null, FUNDS = null;
/* A fund is a token too. MANSAX publishes a calendar-year net return series,
   so it can be drawn as a line beside a share. A fund that publishes only a
   current yield cannot be - a yield is not a path - and gets a rate card. */
/* a fund keeps the violet family whatever else is on the chart, so the reader
   can see at a glance which lines are funds and which are shares */
var FUNDCOL = ['#c48bf7','#f09ad0','#b39ddb','#e879f9','#a78bfa','#f0abfc'];
var NAMED_TOK = { MANSAX:'MANSAX_KES', MANSAXKES:'MANSAX_KES', MANSAXUSD:'MANSAX_USD',
                  MADISONMMF:'MADISON_MMF', MADISONFIXED:'MADISON_FIXED',
                  MADISONSPECIAL:'MADISON_WEALTH_SPECIAL', BRITAMMMF:'BRITAM_MMF' };
async function loadFunds(){
  if(FUNDS) return FUNDS;
  FUNDS = (await loadJSON('../../static_data/funds_KE.json')) || { funds:[] };
  return FUNDS;
}
/* Any fund in the file is typeable, not just the ones with a short alias: the
   id itself is a token once its underscores are dropped, and the KES class of
   a fund answers to its bare name because that is what a reader will type. */

var CASH = null;
function pad2(x){ return (x<10?'0':'')+x; }
function monthKey(d){ return String(d).slice(0,7); }
function daysInMonth(ym){ var a=ym.split('-'); return new Date(Number(a[0]), Number(a[1]), 0).getDate(); }
function nextMonth(ym){ var a=ym.split('-'), y=Number(a[0]), m=Number(a[1])+1; if(m>12){ m=1; y++; } return y+'-'+pad2(m); }
function dayNum(d){ return Math.floor(Date.parse(d+'T00:00:00Z')/86400000); }

async function loadCash(){
  if(CASH) return CASH;
  var d = await loadJSON('../../static_data/macro_rates.json');
  var out = { m:{}, months:[], point:null, publisher:'Central Bank of Kenya' };
  if(d && d.countries){
    var k = d.countries.filter(function(c){ return c.iso2==='KE' || c.country==='Kenya'; })[0];
    if(k){
      (k.monthly_rates||[]).forEach(function(r){
        if(r && r.date && r.t_bill_91d!=null){ out.m[r.date] = Number(r.t_bill_91d); out.months.push(r.date); }
      });
      out.months.sort();
      out.point = (k.market_rates||{}).t_bill_91d || null;
    }
  }
  CASH = out;
  return CASH;
}
/* accrual factor from d0 to d. null the moment a month on the path is missing. */
function cashFactor(d0, d, C){
  var t0 = dayNum(d0), t1 = dayNum(d);
  if(!(t1 > t0)) return 1;
  var f = 1, ym = monthKey(d0), endYm = monthKey(d), guard = 0;
  while(guard++ < 2400){
    var r = C.m[ym];
    if(r == null) return null;
    var ms = dayNum(ym+'-01'), me = dayNum(ym+'-'+pad2(daysInMonth(ym))) + 1;
    var a = Math.max(t0, ms), b = Math.min(t1, me);
    if(b > a) f *= Math.pow(1 + r/100, (b-a)/365);
    if(ym === endYm) break;
    ym = nextMonth(ym);
  }
  return f;
}
function cashCurve(secs, pts, C){
  if(!C || !C.months.length)
    return { pct:null, why:'the Central Bank of Kenya monthly 91-day bill series could not be read' };
  var allKes = secs.every(function(s){ return String(majorOf(s.quoteCcy)||'').toUpperCase() === 'KES'; });
  if(!allKes)
    return { pct:null, why:'the bill is a shilling return, and this selection does not quote only in shillings. '
                        + 'A return earned in rand or naira is not comparable to it without the exchange rate, '
                        + 'so no cash line is drawn' };
  var d0 = pts[0], first = C.months[0], last = C.months[C.months.length-1];
  if(monthKey(d0) < first)
    return { pct:null, why:'the price window opens before the bill series does ('+first+')' };
  if(monthKey(d0) > last)
    return { pct:null, why:'the price window opens after the last month on file ('+last+')' };
  var cap = last+'-'+pad2(daysInMonth(last));
  var pct = [], cut = -1;
  for(var i=0;i<pts.length;i++){
    if(pts[i] > cap) break;
    var f = cashFactor(d0, pts[i], C);
    if(f == null) break;
    pct.push((f-1)*100); cut = i;
  }
  if(pct.length < 2)
    return { pct:null, why:'the bill series does not cover enough of this window' };
  return { pct:pct, cut:cut, upto:pts[cut], partial:(cut < pts.length-1), last:last, point:C.point };
}

/* ---- per-metric extraction. Every cell: {v, unit, period, withheld, reason} */
function ratioEntry(an, key){
  if(!an || !an.ratios) return null;
  for(var i=0;i<an.ratios.length;i++){ if(an.ratios[i] && an.ratios[i].key===key) return an.ratios[i]; }
  return null;
}
function multCell(an, k){
  if(!an || !an.valuation) return { v:null, unit:'x' };
  var v = an.valuation;
  var period = v[k+'Period'] || v.pePeriod || v.asOfPeriod || v.ratiosPeriod || null;
  if(v[k]!=null) return { v:num(v[k]), unit:'x', period:period };
  if(v[k+'_withheld']) return { v:null, unit:'x', period:period, withheld:true, reason:v[k+'_withheld_reason']||'' };
  return { v:null, unit:'x', period:period };
}
function ratioCell(an, key, fallbackPeriod){
  var r = ratioEntry(an, key);
  if(!r) return { v:null };
  var per = r.period || fallbackPeriod || null;
  var unit = r.unit || '';
  if(r.value!=null) return { v:num(r.value), unit:unit, period:per, label:r.label||key };
  if(r.withheld) return { v:null, unit:unit, period:per, label:r.label||key, withheld:true, reason:r.withheld_reason||'' };
  return { v:null, unit:unit, period:per, label:r.label||key };
}
function ratioCellAny(an, keys, fallbackPeriod){
  for(var i=0;i<keys.length;i++){
    if(ratioEntry(an, keys[i])) return ratioCell(an, keys[i], fallbackPeriod);
  }
  return { v:null };
}

/* ---- chart: indexed price return over the common window ----------------
   Each series is rebased to 100 at the first common date. A return is
   unit-free, so a ZAc series and a KES series can share one frame; the window
   and the point count are printed so the reader sees the basis. */
function alignDates(series){
  var maps = series.map(function(s){ var m=new Map(); s.forEach(function(x){ m.set(x.date, x.c); }); return m; });
  var dates = [];
  maps[0].forEach(function(_, d){
    for(var i=1;i<maps.length;i++){ if(!maps[i].has(d)) return; }
    dates.push(d);
  });
  dates.sort();
  return { dates:dates, maps:maps };
}
function downsampleIdx(len, n){
  if(len<=n) return Array.apply(null,Array(len)).map(function(_,i){ return i; });
  var out=[], step=(len-1)/(n-1);
  for(var i=0;i<n;i++) out.push(Math.round(i*step));
  return out;
}
function renderChart(secs, series, C, named){
  var rets = secs.map(function(){ return null; });
  var NONE = { rets:rets, cash:null, funds:[] };
  if(series.some(function(s){ return !s || s.length<2; })){
    NONE.html = '<div class="window">No common price history for these securities.</div>';
    return NONE;
  }
  var A = alignDates(series);
  var dates = A.dates, maps = A.maps;
  /* the chosen window, cut off the common dates before anything else happens */
  var rangeFrom = null;
  if(dates.length > 1 && RANGE !== 'max'){
    var lastD = dates[dates.length-1];
    if(RANGE === 'ytd') rangeFrom = lastD.slice(0,4) + '-01-01';
    else if(RANGE === '1y') rangeFrom = (Number(lastD.slice(0,4)) - 1) + lastD.slice(4);
    else if(RANGE === '3y') rangeFrom = (Number(lastD.slice(0,4)) - 3) + lastD.slice(4);
    if(rangeFrom){
      var cut = dates.filter(function(x){ return x >= rangeFrom; });
      if(cut.length >= 2) dates = cut;
      else rangeFrom = null;
    }
  }
  if(dates.length < 2){
    NONE.html = '<div class="window">No common price history for these securities.</div>';
    return NONE;
  }
  /* A fund that opened in 2019 has no place on a chart that starts in 2008:
     rebasing it to a date before it existed would invent eight years. So the
     window is CLAMPED FORWARD to the latest inception among the funds being
     drawn, every security is rebased to that same date, and the chart says so. */
  var drawable = (named||[]).filter(function(f){
    return f.f && f.f.cumulative_net && ((f.f.cumulative_net.points)||[]).length > 1;
  });
  var clampTo = null;
  drawable.forEach(function(f){
    var inc = String(f.f.inception || '');
    var start = (inc.length >= 7) ? (inc.slice(0,7) + '-01') : f.f.cumulative_net.points[0].as_of;
    if(clampTo == null || start > clampTo) clampTo = start;
  });
  var clampedFrom = null;
  if(clampTo && dates.length && dates[0] < clampTo){
    var kept = dates.filter(function(x){ return x >= clampTo; });
    if(kept.length >= 2){ clampedFrom = dates[0]; dates = kept; }
    else { drawable = []; clampTo = null; }
  }

  var d0 = dates[0], dN = dates[dates.length-1];
  maps.forEach(function(m, i){ var a=m.get(d0), b=m.get(dN); if(a!=null && b!=null) rets[i]=(b/a-1)*100; });

  var W=920,H=220,L=44,R=12,T=10,B=22, iw=W-L-R, ih=H-T-B;
  var idx = downsampleIdx(dates.length, 90);
  var pts = idx.map(function(ix){ return dates[ix]; });
  var bases = maps.map(function(m){ return m.get(d0); });
  var seriesPct = maps.map(function(m, si){ return pts.map(function(d){ return (m.get(d)/bases[si]-1)*100; }); });
  var cash = cashCurve(secs, pts, C);

  /* a fund's points are annual, so each sits at the chart column whose DATE is
     nearest to it, never at an evenly spaced slot, and each is rebased to the
     fund's own value at the first point inside the window */
  var fundLines = [];
  drawable.forEach(function(f, fi){
    var base = null, xy = [];
    /* A fund's inception point can fall a few days before the first TRADING
       day in the window - a fund opening on 1 January, a market opening on the
       2nd. That point is the fund's zero and dropping it would silently charge
       the fund's first year to nobody, so a point up to six weeks ahead of the
       first column is kept and placed on it. */
    (f.f.cumulative_net.points || []).forEach(function(p){
      if(dayNum(p.as_of) < dayNum(pts[0]) - 42 || p.as_of > pts[pts.length-1]) return;
      var bi = 0, bd = Infinity;
      for(var q=0; q<pts.length; q++){
        var dd = Math.abs(dayNum(pts[q]) - dayNum(p.as_of));
        if(dd < bd){ bd = dd; bi = q; }
      }
      if(base == null) base = p.value;
      xy.push({ i:bi, v: ((1 + p.value/100) / (1 + base/100) - 1) * 100, d:p.as_of });
    });
    if(xy.length >= 2) fundLines.push({ f:f, xy:xy, col: FUNDCOL[fi % FUNDCOL.length] });
  });

  var all = [];
  seriesPct.forEach(function(sp){ all = all.concat(sp); });
  if(cash.pct) all = all.concat(cash.pct);
  fundLines.forEach(function(fl){ fl.xy.forEach(function(p){ all.push(p.v); }); });
  var lo = Math.min(0, Math.min.apply(null, all)), hi = Math.max(0, Math.max.apply(null, all));
  var pad = (hi-lo)*0.08 || 1; lo -= pad; hi += pad;
  function X(i){ return L + (i/(pts.length-1))*iw; }
  function Y(v){ return T + (1-(v-lo)/(hi-lo))*ih; }
  function line(sp){ var d=''; for(var i=0;i<sp.length;i++){ d += (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(sp[i]).toFixed(1); } return d; }
  var grid='';
  for(var g=0; g<=5; g++){
    var v = lo + (hi-lo)*g/5, y = Y(v);
    grid += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#1a1a1a"/>';
    grid += '<text x="'+(L-6)+'" y="'+(y+3)+'" fill="#6a6a6a" font-size="9" text-anchor="end">'+v.toFixed(0)+'%</text>';
  }
  var zeroY = Y(0);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' + grid
    + '<line x1="'+L+'" y1="'+zeroY+'" x2="'+(W-R)+'" y2="'+zeroY+'" stroke="#3a3a3a" stroke-dasharray="3 3"/>';
  if(cash.pct){
    var cd = '';
    for(var ci=0; ci<cash.pct.length; ci++){ cd += (ci?'L':'M') + X(ci).toFixed(1) + ' ' + Y(cash.pct[ci]).toFixed(1); }
    svg += '<path d="'+cd+'" fill="none" stroke="'+GOLD+'" stroke-width="1.8" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>';
    /* where the series ends before the prices do, the end is marked, not faded out */
    var ex = X(cash.cut), ey = Y(cash.pct[cash.pct.length-1]);
    if(cash.partial){
      svg += '<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="2.6" fill="'+GOLD+'"/>';
      svg += '<line x1="'+ex.toFixed(1)+'" y1="'+T+'" x2="'+ex.toFixed(1)+'" y2="'+(T+ih)+'" stroke="'+GOLD+'" stroke-opacity="0.22" stroke-dasharray="2 4"/>';
    }
    /* the line names itself on the frame: a reader should not have to match a
       colour against a legend to know which line is the cash one */
    var lx = ex + 7, anc = 'start';
    if(lx > W-R-46){ lx = ex - 7; anc = 'end'; }
    svg += '<text x="'+lx.toFixed(1)+'" y="'+(ey-6).toFixed(1)+'" fill="'+GOLD+'" font-size="9" '
         + 'letter-spacing="0.8" text-anchor="'+anc+'">T-BILL</text>';
  }
  for(var si=seriesPct.length-1; si>=0; si--){
    svg += '<path d="'+line(seriesPct[si])+'" fill="none" stroke="'+COL[si%COL.length]+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
  }
  fundLines.forEach(function(fl){
    var fp = '';
    fl.xy.forEach(function(p, k){ fp += (k?'L':'M') + X(p.i).toFixed(1) + ' ' + Y(p.v).toFixed(1); });
    svg += '<path d="'+fp+'" fill="none" stroke="'+fl.col+'" stroke-width="2.1" '
         + 'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    fl.xy.forEach(function(p){
      svg += '<circle cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.3" fill="'+fl.col+'">'
           + '<title>'+esc(p.d + '  ' + (p.v>=0?'+':'') + p.v.toFixed(1) + '% since the window start')
           + '</title></circle>';
    });
    var e = fl.xy[fl.xy.length-1];
    svg += '<text x="'+(X(e.i)-7).toFixed(1)+'" y="'+(Y(e.v)-8).toFixed(1)+'" fill="'+fl.col
         + '" font-size="9" letter-spacing="0.7" text-anchor="end">'+esc(fl.f.key)+'</text>';
  });
  svg += '<text x="'+L+'" y="'+(H-6)+'" fill="#6a6a6a" font-size="9" text-anchor="start">'+pts[0]+'</text>';
  svg += '<text x="'+(W-R)+'" y="'+(H-6)+'" fill="#6a6a6a" font-size="9" text-anchor="end">'+pts[pts.length-1]+'</text>';
  svg += '</svg>';
  var winTxt = (rangeFrom ? (RANGE === 'ytd' ? 'this year so far: ' : 'the last ' + RANGE.toUpperCase() + ': ') : 'common window ')
    + d0 + ' to ' + dN + ' (' + pts.length + ' points). Each series is rebased to 100 at the start, so a line is percent return, not price; currencies differ across markets, but a return is unit-free.';
  if(clampedFrom){
    winTxt += '<br><span style="color:#c48bf7">The securities have price history back to '
            + esc(clampedFrom) + ', but the window starts at ' + esc(d0)
            + ': that is when the fund on this chart opened. Everything here is rebased to that '
            + 'date so the same money is followed over the same months.</span>';
  }
  if(cash.pct){
    winTxt += '<br><span class="cashnote">The gold dashed line is the same money in the 91-day Treasury bill, '
            + 'compounded month by month at the Central Bank of Kenya&rsquo;s own published rate for that month, '
            + '(1 + r) to the power days/365. It is not today&rsquo;s rate projected backwards.'
            + (cash.partial ? ' The bill series ends '+esc(cash.last)+', so the line stops at '+esc(cash.upto)
                            + ' and the beat-the-bill reading below is measured to that date for every security.' : '')
            + '</span>';
  } else if(cash.why){
    winTxt += '<br><span class="cashnote">Cash line withheld: '+esc(cash.why)+'.</span>';
  }

  /* when the bill line stops short, every security is re-measured to its end
     date: a verdict must not compare a return to one date with a return to
     another. rets (the full window) is left alone for the rest of the panel. */
  var cashEnd = cash.pct ? pts[cash.cut] : null;
  var retsAt = secs.map(function(){ return null; });
  if(cashEnd){
    maps.forEach(function(m, i){
      var a = bases[i], b = m.get(cashEnd);
      if(a != null && b != null) retsAt[i] = (b/a-1)*100;
    });
  }

  var legend = '';
  seriesPct.forEach(function(sp, k){
    if(!sp) return;
    var last = sp[sp.length-1];
    legend += '<span class="li"><span class="sw" style="background:'+COL[k%COL.length]+'"></span>'+esc(secs[k].ticker||secs[k].sym)+' '+(last>=0?'+':'')+last.toFixed(1)+'%</span>';
  });
  fundLines.forEach(function(fl){
    var fe = fl.xy[fl.xy.length-1];
    legend += '<span class="li" style="color:'+fl.col+'"><span class="sw" style="background:'+fl.col+'"></span>'
            + esc(fl.f.key) + ' ' + (fe.v>=0?'+':'') + fe.v.toFixed(1) + '% to ' + esc(fe.d)
            + ' <span style="color:var(--tx3)">net, annual points</span></span>';
  });
  if(cash.pct){
    var cl = cash.pct[cash.pct.length-1];
    legend += '<span class="li cash"><span class="sw dash"></span>91-day T-bill '+(cl>=0?'+':'')+cl.toFixed(1)+'%'
            + (cash.partial ? ' to '+esc(cash.upto) : '') + '</span>';
  }
  /* ---- the same window as lanes, for the turnable view -------------------
     A lane carries exactly the rebased percent return the flat chart draws,
     taken from the same rebased series. Depth only separates the lanes: it is
     not a quantity and nothing is rescaled to make room for it. A fund keeps
     its own sparse annual points and is never filled in between them. */
  var lanes = [];
  seriesPct.forEach(function(sp, k){
    lanes.push({ label: String(secs[k].ticker||secs[k].sym||''), name: secs[k].name || '',
                 col: COL[k%COL.length], kind:'sec',
                 p: sp.map(function(v, i){ return { i:i, v:v }; }) });
  });
  fundLines.forEach(function(fl){
    lanes.push({ label: fl.f.key, name: fl.f.name || '', col: fl.col, kind:'fund',
                 p: fl.xy.map(function(p){ return { i:p.i, v:p.v }; }) });
  });
  if(cash.pct){
    lanes.push({ label:'91d T-BILL', name:'91-day Treasury bill, Central Bank of Kenya',
                 col: GOLD, kind:'cash',
                 p: cash.pct.map(function(v, i){ return { i:i, v:v }; }) });
  }

  return {
    win: '<div class="window">'+winTxt+'</div>',
    body: svg + '<div class="legend">'+legend+'</div>',
    v3: { pts: pts, lanes: lanes, lo: lo, hi: hi, from: d0 },
    html: '<div class="window">'+winTxt+'</div>' + svg + '<div class="legend">'+legend+'</div>',
    rets: rets,
    funds: fundLines.map(function(fl){
      var fe = fl.xy[fl.xy.length-1];
      return { key: fl.f.key, name: fl.f.name, ret: fe.v, upto: fe.d, from: pts[0],
               ccy: fl.f.quoteCcy };
    }),
    cash: cash.pct ? { ret: cash.pct[cash.pct.length-1], upto: cash.upto, partial: cash.partial,
                       last: cash.last, retsAt: retsAt, from: d0 } : null
  };
}

/* ---- the turnable view -------------------------------------------------
   The flat chart and this one draw the SAME numbers. Nothing here is computed:
   the lanes arrive already rebased from renderChart, and the third dimension
   only pulls them apart so four shares, a fund and the Treasury bill can each
   be followed without crossing. One canvas, one projection, painter's
   algorithm, no WebGL and no library, same as every other panel here. */
var V3 = null, c3 = null, x3 = null;
var yaw3 = -0.62, pitch3 = 0.46, zoom3 = 1, hov3 = -1, wire3 = false, spin3 = 0;
var DPR3 = Math.min(window.devicePixelRatio || 1, 2);
var V3VIEWS = { iso:[-0.62,0.46], time:[-1.5707,0.10], series:[0,0.10], top:[-0.62,1.30] };
var tick3Started = false;

function project3(x, y, z, W, H){
  var cy = Math.cos(yaw3), sy = Math.sin(yaw3);
  var x1 = x*cy - z*sy, z1 = x*sy + z*cy;
  var cp = Math.cos(pitch3), sp = Math.sin(pitch3);
  var y1 = y*cp - z1*sp, z2 = y*sp + z1*cp;
  var s = Math.min(W, H*1.5) * 0.42 * zoom3;
  return { x: W/2 + x1*s, y: H*0.56 - y1*s, d: z2 };
}
function shade3(hex, k){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex||''));
  if(!m) return hex;
  var n = parseInt(m[1], 16);
  function c(v){ return Math.max(0, Math.min(255, Math.round(v*k))); }
  return 'rgb(' + [c((n>>16)&255), c((n>>8)&255), c(n&255)].join(',') + ')';
}
function geo3(){
  var n = V3.pts.length, K = V3.lanes.length;
  var lo = V3.lo, hi = V3.hi, span = (hi-lo) || 1;
  var Z = function(k){ return K > 1 ? (k/(K-1))*1.08 - 0.54 : 0; };
  var Y = function(v){ return ((v-lo)/span)*0.9 - 0.3; };
  return { n:n, K:K, Z:Z, Y:Y, y0:Y(0),
           X: function(i){ return n > 1 ? (i/(n-1))*2 - 1 : 0; },
           hz: K > 1 ? Math.min(0.095, (1.08/(K-1))*0.3) : 0.1 };
}
/* a lane's value AT a column, and the last published point up to it. A fund
   has a point only where it published one, so the readout says which date the
   figure belongs to rather than pretending the fund reported that month. */
function laneAt(L, i){
  for(var k=0;k<L.p.length;k++){ if(L.p[k].i === i) return L.p[k].v; }
  return null;
}
function laneUpTo(L, i){
  var best = null;
  L.p.forEach(function(p){ if(p.i <= i && (best == null || p.i > best.i)) best = p; });
  return best;
}
function draw3(){
  if(!V3 || !c3) return;
  var W = c3.clientWidth, H = c3.clientHeight;
  if(!W || !H) return;
  c3.width = Math.round(W*DPR3); c3.height = Math.round(H*DPR3);
  x3.setTransform(DPR3,0,0,DPR3,0,0);
  x3.clearRect(0,0,W,H);
  var G = geo3(), font = getComputedStyle(document.body).fontFamily;

  /* the back wall, so a height can be read as a number */
  for(var g=0; g<=5; g++){
    var gv = V3.lo + (V3.hi-V3.lo)*g/5, gy = G.Y(gv);
    var a = project3(-1, gy, -0.70, W, H), b = project3(1, gy, -0.70, W, H);
    x3.strokeStyle = '#1a1a1a'; x3.lineWidth = 1;
    x3.beginPath(); x3.moveTo(a.x, a.y); x3.lineTo(b.x, b.y); x3.stroke();
    x3.fillStyle = '#6a6a6a'; x3.font = '9px ' + font; x3.textAlign = 'right';
    x3.fillText(gv.toFixed(0) + '%', a.x - 5, a.y + 3);
  }
  /* zero is the rebase date, not another gridline, so it is drawn apart */
  var za = project3(-1, G.y0, -0.70, W, H), zb = project3(1, G.y0, -0.70, W, H);
  x3.strokeStyle = '#3a3a3a'; x3.lineWidth = 1; x3.setLineDash([3,3]);
  x3.beginPath(); x3.moveTo(za.x, za.y); x3.lineTo(zb.x, zb.y); x3.stroke();
  x3.setLineDash([]);

  /* Lanes far to near. Each lane is its own slab in depth and the slabs never
     cross, so ordering the lanes and then the faces inside each lane puts
     every face in the right place without a depth buffer. A larger projected
     depth is farther away, so it is painted first. */
  var order = V3.lanes.map(function(L, k){
    return { k:k, d: project3(0, 0, G.Z(k), W, H).d };
  }).sort(function(p, q){ return q.d - p.d; });

  var labels3 = [];
  order.forEach(function(o){
    var L = V3.lanes[o.k], zc = G.Z(o.k), hz = G.hz, quads = [];
    for(var i=0;i<L.p.length-1;i++){
      var p = L.p[i], q = L.p[i+1];
      var x1 = G.X(p.i), x2 = G.X(q.i), y1 = G.Y(p.v), y2 = G.Y(q.v);
      /* the top of the ribbon, then the two faces dropped to the rebase
         plane, so a height reads as a distance from zero and not as a line
         floating in the frame */
      quads.push({ pts:[[x1,y1,zc-hz],[x2,y2,zc-hz],[x2,y2,zc+hz],[x1,y1,zc+hz]], sh:0.92 });
      quads.push({ pts:[[x1,G.y0,zc+hz],[x1,y1,zc+hz],[x2,y2,zc+hz],[x2,G.y0,zc+hz]], sh:0.42 });
      quads.push({ pts:[[x1,G.y0,zc-hz],[x1,y1,zc-hz],[x2,y2,zc-hz],[x2,G.y0,zc-hz]], sh:0.28 });
    }
    quads.forEach(function(Q){
      Q.q = Q.pts.map(function(P){ return project3(P[0], P[1], P[2], W, H); });
      Q.d = (Q.q[0].d + Q.q[1].d + Q.q[2].d + Q.q[3].d) / 4;
    });
    quads.sort(function(p, q){ return q.d - p.d; });
    quads.forEach(function(Q){
      x3.beginPath(); x3.moveTo(Q.q[0].x, Q.q[0].y);
      for(var k2=1;k2<4;k2++) x3.lineTo(Q.q[k2].x, Q.q[k2].y);
      x3.closePath();
      if(!wire3){
        x3.fillStyle = shade3(L.col, Q.sh);
        x3.globalAlpha = (L.kind === 'cash') ? 0.78 : 0.94;
        x3.fill();
        x3.globalAlpha = 1;
      }
      x3.strokeStyle = wire3 ? shade3(L.col, 0.85) : 'rgba(0,0,0,.35)';
      x3.lineWidth = wire3 ? 0.6 : 0.5;
      x3.stroke();
    });
    /* the lane's own line, on its own ribbon */
    x3.beginPath();
    L.p.forEach(function(pp, i){
      var pr = project3(G.X(pp.i), G.Y(pp.v), zc, W, H);
      if(i) x3.lineTo(pr.x, pr.y); else x3.moveTo(pr.x, pr.y);
    });
    x3.strokeStyle = L.col;
    x3.lineWidth = (L.kind === 'fund') ? 2.1 : 1.7;
    if(L.kind === 'cash') x3.setLineDash([5,4]);
    x3.stroke();
    x3.setLineDash([]);
    if(L.kind === 'fund'){
      L.p.forEach(function(pp){
        var pr = project3(G.X(pp.i), G.Y(pp.v), zc, W, H);
        x3.beginPath(); x3.arc(pr.x, pr.y, 2.3, 0, 6.3);
        x3.fillStyle = L.col; x3.fill();
      });
    }
    /* the lane names itself at its own end. The label is held for the end of
       the pass so no later lane paints over it, kept inside the frame, and
       nudged clear of a label already placed: two names on top of each other
       name nothing. */
    var endp = L.p[L.p.length-1];
    var ep = project3(G.X(endp.i), G.Y(endp.v), zc, W, H);
    labels3.push({ txt: L.label + '  ' + (endp.v>=0?'+':'') + endp.v.toFixed(1) + '%',
                   x: ep.x, y: ep.y, col: L.col });
    if(hov3 >= 0){
      var hv = laneAt(L, hov3);
      if(hv != null){
        var hp = project3(G.X(hov3), G.Y(hv), zc, W, H);
        x3.beginPath(); x3.arc(hp.x, hp.y, 3, 0, 6.3);
        x3.fillStyle = '#ffffff'; x3.fill();
      }
    }
  });

  /* the lane names, after every face is down */
  x3.font = '9.5px ' + font; x3.textAlign = 'left';
  var placed = [];
  labels3.forEach(function(Lb){
    var tw = x3.measureText(Lb.txt).width;
    var tx = Lb.x + 6;
    if(tx + tw > W - 4) tx = Math.max(4, Lb.x - 6 - tw);
    var ty = Math.max(12, Math.min(H - 5, Lb.y - 4));
    for(var guard=0; guard<10; guard++){
      var clash = placed.filter(function(p){
        return Math.abs(p.y - ty) < 15 && tx < p.x + p.w + 8 && p.x < tx + tw + 8;
      })[0];
      if(!clash) break;
      ty = (clash.y + 16 < H - 5) ? clash.y + 16 : Math.max(12, clash.y - 16);
    }
    placed.push({ x:tx, y:ty, w:tw });
    x3.fillStyle = Lb.col;
    x3.fillText(Lb.txt, tx, ty);
  });

  /* the years along the time edge */
  var years = [], seen = {};
  for(var iy=0; iy<V3.pts.length; iy++){
    var yr = String(V3.pts[iy]).slice(0,4);
    if(!seen[yr]){ seen[yr] = 1; years.push({ yr:yr, i:iy }); }
  }
  var step = years.length > 14 ? 3 : (years.length > 7 ? 2 : 1);
  x3.fillStyle = '#a8a8a8'; x3.font = '9px ' + font; x3.textAlign = 'center';
  years.forEach(function(y, k){
    if(k % step) return;
    var pt = project3(G.X(y.i), G.y0, -0.70, W, H);
    x3.fillText(y.yr, pt.x, pt.y + 13);
  });
}
function read3(){
  var el = $('rd3');
  if(!el || !V3) return;
  var i = (hov3 >= 0 && hov3 < V3.pts.length) ? hov3 : V3.pts.length - 1;
  var rows = V3.lanes.map(function(L){
    var v = laneAt(L, i), tail = '';
    if(v == null){
      var b = laneUpTo(L, i);
      if(b){ v = b.v; tail = '<span style="color:var(--tx3)"> to ' + esc(V3.pts[b.i]) + '</span>'; }
    }
    return '<tr><td style="color:'+L.col+'">' + esc(L.label) + '</td>'
         + '<td class="v" style="color:'+L.col+'">'
         + (v == null ? DASH() : ((v>=0?'+':'') + v.toFixed(1) + '%')) + tail + '</td></tr>';
  }).join('');
  el.innerHTML = '<h5>' + (hov3 >= 0 ? 'Hovered column' : 'Window end') + '</h5>'
    + '<div class="dt">' + esc(V3.pts[i]) + '</div><table>' + rows + '</table>'
    + '<div class="h3">Height is percent return since <b>' + esc(V3.pts[0]) + '</b>, the same rebase the flat '
    + 'chart uses. Depth separates the series and carries no quantity. A fund lane steps between the annual '
    + 'points its manager published, and where it has no point for a column the figure is labelled with the '
    + 'date it does belong to.</div>';
}
function initCanvas3(){
  var el = $('cv3');
  if(!el) return;
  if(c3 === el){ draw3(); return; }
  c3 = el; x3 = el.getContext('2d');
  var dragging = false, lx = 0, ly = 0;
  c3.addEventListener('pointerdown', function(e){
    dragging = true; lx = e.clientX; ly = e.clientY; spin3 = 0;
    var sb = $('spin3'); if(sb) sb.classList.remove('on');
    c3.classList.add('drag'); c3.setPointerCapture(e.pointerId);
  });
  c3.addEventListener('pointerup', function(){ dragging = false; c3.classList.remove('drag'); });
  c3.addEventListener('pointerleave', function(){ dragging = false; c3.classList.remove('drag'); });
  c3.addEventListener('pointermove', function(e){
    if(dragging){
      yaw3 += (e.clientX - lx) * 0.0075;
      pitch3 = Math.max(-0.2, Math.min(1.35, pitch3 + (e.clientY - ly) * 0.0055));
      lx = e.clientX; ly = e.clientY;
      draw3();
      return;
    }
    if(!V3) return;
    /* the nearest published point on screen, whichever lane it belongs to */
    var r = c3.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    var G = geo3(), best = -1, bd = 1e9;
    V3.lanes.forEach(function(L, k){
      L.p.forEach(function(pp){
        var pr = project3(G.X(pp.i), G.Y(pp.v), G.Z(k), r.width, r.height);
        var dd = (pr.x-mx)*(pr.x-mx) + (pr.y-my)*(pr.y-my);
        if(dd < bd){ bd = dd; best = pp.i; }
      });
    });
    if(bd < 3600 && best !== hov3){ hov3 = best; draw3(); read3(); }
  });
  c3.addEventListener('wheel', function(e){
    e.preventDefault();
    zoom3 = Math.max(0.45, Math.min(2.6, zoom3 * (e.deltaY > 0 ? 0.92 : 1.08)));
    draw3();
  }, {passive:false});
  if(!tick3Started){
    tick3Started = true;
    (function tick(){
      if(spin3 && c3 && c3.clientWidth){ yaw3 += 0.0045; draw3(); }
      requestAnimationFrame(tick);
    })();
    window.addEventListener('resize', function(){ if(c3 && c3.clientWidth){ draw3(); } });
  }
  draw3();
}

/* ---- table ------------------------------------------------------------ */
function cellFmt(row, c){
  if(c.v==null){
    if(c.withheld) return '<span class="wh" title="'+esc(stripW(c.reason))+'">withheld</span>';
    return DASH();
  }
  var v = c.v;
  if(row.unit==='%') return fmtNum(v)+'%';
  if(row.unit==='x') return fmtX(v);
  if(row.unit==='money') return fmtMoney(v)+' '+esc(c.unit||'');
  if(row.unit==='ccy') return fmtNum(v)+' '+esc(c.unit||'');
  return fmtNum(v);
}
function periodSet(cells){
  var seen={}, out=[];
  cells.forEach(function(c){ if(c && c.v!=null && c.period && !seen[c.period]){ seen[c.period]=1; out.push(c.period); } });
  return out;
}
function numCount(cells){ return cells.filter(function(c){ return c && c.v!=null; }).length; }
function bestIdx(cells, dir){
  var bi=-1, bv=null;
  cells.forEach(function(c, i){
    if(!c || c.v==null) return;
    if(bv==null || (dir==='higher' ? c.v>bv : c.v<bv)){ bv=c.v; bi=i; }
  });
  return bi;
}

function renderTable(secs){
  var rows = ROWS();
  var head = '<thead><tr><th>Metric</th>';
  secs.forEach(function(s, i){
    head += '<th><span style="color:'+COL[i%COL.length]+'">'+esc(s.ticker||s.sym)+'</span>'
          + '<span class="hccy">'+esc(ccyLabel(s.quoteCcy))+'</span></th>';
  });
  head += '</tr></thead>';
  var body = '';
  var cmpRows = 0;

  /* two or more securities: a row with one value is no comparison and is
     dropped. ONE security (it is being weighed against a fund, not another
     share) keeps its own column: there is nothing to mislead a reader with. */
  var minCells = (secs.length === 1) ? 1 : 2;
  function emitRow(label, cells, opt){
    if(numCount(cells) < minCells) return '';
    var pers = periodSet(cells);
    var mixed = pers.length > 1;
    var rowPeriod = (pers.length===1) ? pers[0] : null;
    var bi = (opt.dir && !mixed) ? bestIdx(cells, opt.dir) : -1;
    var html = '<tr><td class="item">'+esc(label)
      + (mixed ? ' <span class="per warnp">periods differ</span>'
               : (rowPeriod ? ' <span class="per">'+esc(rowPeriod)+'</span>' : ''))
      + '</td>';
    cells.forEach(function(c, i){
      var cls = (i===bi) ? 'win' : '';
      var txt = cellFmt(opt.row, c);
      if(mixed && c && c.v!=null && c.period){ txt += '<span class="cper">'+esc(c.period)+'</span>'; }
      html += '<td class="'+cls+'">'+txt+'</td>';
    });
    html += '</tr>';
    return html;
  }

  // informational price row: quote unit, labelled, per cell
  body += '<tr><td class="item">Price <span class="per">quote unit</span></td>';
  secs.forEach(function(s){
    body += '<td>'+((s.price!=null) ? (fmtNum(s.price)+' '+esc(s.quoteCcy||'')) : DASH())+'</td>';
  });
  body += '</tr>';

  // converted price row, only when the selected securities are on different majors
  var majors = [];
  secs.forEach(function(s){ var m = majorOf(s.quoteCcy); if(m && majors.indexOf(m)<0) majors.push(m); });
  if(majors.length > 1 && FX){
    var target = majors[0];
    var conv = secs.map(function(s){
      var pm = inMajor(num(s.price), s.quoteCcy);
      var r = fxRate(s.quoteCcy, target);
      return (pm!=null && r!=null) ? (pm*r) : null;
    });
    if(conv.filter(function(x){ return x!=null; }).length >= 2){
      var anyCents = secs.some(function(s){ return isCents(s.quoteCcy); });
      var note = 'to '+target + (FX_ASOF ? (' as of '+FX_ASOF) : '') + (anyCents ? ', JSE cents divided by 100 first' : '');
      body += '<tr><td class="item">Price, converted <span class="per">'+esc(note)+'</span></td>';
      conv.forEach(function(x){ body += '<td>'+(x!=null ? (fmtNum(x)+' '+esc(target)) : DASH())+'</td>'; });
      body += '</tr>';
    }
  }

  body += emitRow('Day change', secs.map(function(s){ return { v:num(s.chgPct) }; }), { row:{unit:'%'}, dir:null });
  body += emitRow('YTD return', secs.map(function(s){ return { v:parseYtd(s.ytd) }; }), { row:{unit:'%'}, dir:null });

  var groups = [], gidx = {};
  rows.forEach(function(r){
    if(!(r.sec in gidx)){ gidx[r.sec] = groups.length; groups.push({ sec:r.sec, rows:[] }); }
    groups[gidx[r.sec]].rows.push(r);
  });
  groups.forEach(function(g){
    var inner = '';
    g.rows.forEach(function(r){
      var rh = emitRow(r.label, secs.map(function(s){ return r.get(s); }), { row:r, dir:r.dir });
      if(rh){ cmpRows++; inner += rh; }
    });
    // an empty section is a section the reader cannot compare: drop its header too
    if(inner) body += '<tr class="rowsec"><td colspan="'+(secs.length+1)+'">'+esc(g.sec)+'</td></tr>' + inner;
  });

  /* With the cap gone the table can be wider than the panel, and this skin
     hides scrollbars, so the overflow is given its own scrolling box: a
     column must never be cut off where a reader cannot reach it. The metric
     column stays put while the rest scrolls under it. */
  return { html: '<div class="tscroll"><table>'+head+'<tbody>'+body+'</tbody></table></div>',
           cmpRows: cmpRows };
}

function collectWithheld(secs, rows){
  var out = [];
  rows.forEach(function(r){
    secs.forEach(function(s){
      var c = r.get(s);
      if(c && c.v==null && c.withheld && c.reason){
        out.push({ tag: String(s.ticker||s.sym), metric: r.label, why: whyShort(c.reason) });
      }
    });
  });
  return out;
}

function verdict(secs, rets, cash, funds, chartFunds){
  var p = [];
  if(cash && cash.ret != null){
    var beat = [], lost = [];
    secs.forEach(function(s, i){
      var r = cash.retsAt[i];
      if(r == null) return;
      (r > cash.ret ? beat : lost).push(esc(s.ticker||s.sym) + ' ' + (r>=0?'+':'') + r.toFixed(1) + '%');
    });
    if(beat.length || lost.length){
      var head = 'The same money in the <b>91-day Treasury bill</b> returned <b>'
               + (cash.ret>=0?'+':'') + cash.ret.toFixed(1) + '%</b> from ' + esc(cash.from)
               + ' to ' + esc(cash.upto) + '. ';
      if(beat.length && lost.length) head += 'Beat it: ' + beat.join(', ') + '. Did not: ' + lost.join(', ') + '.';
      else if(beat.length) head += 'Beat it: ' + beat.join(', ') + '.';
      else head += 'Nothing here beat it: ' + lost.join(', ') + '.';
      p.push(head);
    }
  }
  var withRet = [];
  secs.forEach(function(s, i){ if(rets[i]!=null) withRet.push({ s:s, r:rets[i] }); });
  if(withRet.length>=2){
    withRet.sort(function(a,b){ return b.r-a.r; });
    var w = withRet[0], l = withRet[withRet.length-1];
    if(w.r===l.r) p.push('All compared securities returned <b>'+w.r.toFixed(1)+'%</b> over the common window.');
    else p.push('<b>'+esc(w.s.ticker||w.s.sym)+'</b> returned the most over the common window (<b>'+w.r.toFixed(1)+'%</b>) against <b>'+l.r.toFixed(1)+'%</b> for '+esc(l.s.ticker||l.s.sym)+'.');
  }
  // Compare a multiple only when at least two carry a value AND every one of
  // those stands on the SAME period. Otherwise name the mismatch.
  [['pe','P/E'],['pb','P/B'],['ps','P/S']].forEach(function(m){
    var have = [];
    secs.forEach(function(s){ var c = multCell(s.an, m[0]); if(c.v!=null) have.push({ s:s, c:c }); });
    if(have.length < 2) return;
    var pers = {}, mixed = false;
    have.forEach(function(h){ if(h.c.period){ if(Object.keys(pers).length && !(h.c.period in pers)) mixed = true; pers[h.c.period] = 1; } });
    if(mixed){
      p.push('<b>'+m[1]+'</b> is not compared: the securities stand on different periods ('+have.map(function(h){ return esc(h.s.ticker||h.s.sym)+' '+esc(h.c.period||'n/a'); }).join(', ')+').');
      return;
    }
    if(m[0]==='pe'){
      have.sort(function(a,b){ return a.c.v-b.c.v; });
      p.push('<b>'+esc(have[0].s.ticker||have[0].s.sym)+'</b> trades on the lower P/E (<b>'+have[0].c.v.toFixed(1)+'x</b> vs '+have[have.length-1].c.v.toFixed(1)+'x'+(have[0].c.period?', both on '+esc(have[0].c.period):'')+').');
    }
  });
  if(chartFunds && chartFunds.length){
    chartFunds.forEach(function(cf){
      var beat = [], lost = [];
      secs.forEach(function(sec, i){
        var r = rets[i];
        if(r == null) return;
        (r > cf.ret ? beat : lost).push(esc(sec.ticker||sec.sym) + ' ' + (r>=0?'+':'') + r.toFixed(1) + '%');
      });
      var line = '<b>' + esc(cf.name) + '</b> returned <b>' + (cf.ret>=0?'+':'') + cf.ret.toFixed(1)
               + '%</b> net from ' + esc(cf.from) + ' to ' + esc(cf.upto) + '. ';
      if(beat.length && lost.length) line += 'Ahead of it: ' + beat.join(', ') + '. Behind: ' + lost.join(', ') + '.';
      else if(beat.length) line += 'Ahead of it: ' + beat.join(', ') + '.';
      else if(lost.length) line += 'Nothing here is ahead of it: ' + lost.join(', ') + '.';
      if(String(cf.ccy||'KES').toUpperCase() !== 'KES'){
        line += ' This fund reports in ' + esc(cf.ccy) + ', so the two returns are not in the same money.';
      }
      p.push(line);
    });
  }
  if(funds && funds.length){
    p.push('<b>' + funds.map(function(f){ return esc(f.name); }).join(' and ')
         + '</b>: no return is compared. The Capital Markets Authority publishes the size of each '
         + 'category and what the schemes hold, but no yield, so a fund return is not placed beside '
         + 'a share return here.');
  }
  if(!p.length) return 'Not enough shared, period-aligned data.';
  return p.join(' ');
}

/* ---- head / peers ----------------------------------------------------- */
function renderHead(secs, funds){

       + '<span class="name">'+esc(s.name||'')+'</span>'
       + '<span class="ex">'+esc(s.ex||'')+'</span>';

    if(secs.length || i) h += '<span class="vs">vs</span>';

    h += '<span class="code '+(f.kind==='named'?'nfund':'fund')+'"'
       + (f.kind==='named' ? ' style="color:'+FUNDCOL[nf % FUNDCOL.length]+'"' : '')
       + '>'+esc(f.key)+'</span>'
       + '<span class="name">'+esc(f.name||'')+'</span>'
       + '<span class="ex">'+(f.kind==='named'?'FUND':'CIS')+'</span>';

function renderPeers(secs){
  var box = $('peers');
  var a = secs[0];
  if(!a || !a.sector){ box.style.display='none'; box.innerHTML=''; return; }
  var have = {};
  secs.forEach(function(s){ have[String(s.ticker||s.sym).toUpperCase()] = 1; });
  var peers = [];
  EXS.forEach(function(ex){
    (listingCache[ex]||[]).forEach(function(s){
      var k = String(s.ticker||s.sym||'').toUpperCase();
      if(k && !have[k] && (s.sector||'').toLowerCase()===(a.sector||'').toLowerCase()) peers.push(k);
    });
  });
  if(!peers.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  var html = '<span class="pl">'+esc(a.sector)+' peers:</span>';
  peers.slice(0,14).forEach(function(t){ html += '<a data-tk="'+esc(t)+'">'+esc(t)+'</a>'; });
  box.innerHTML = html;
  box.querySelectorAll('a[data-tk]').forEach(function(el){
    el.addEventListener('click', function(){
      var toks = secs.map(function(s){ return String(s.ticker||s.sym).toUpperCase(); });
      var tk = el.getAttribute('data-tk');
      if(toks.indexOf(tk) >= 0) return;
      if(MAX_SEC > 0 && toks.length >= MAX_SEC) toks = toks.slice(0, MAX_SEC-1);
      toks.push(tk);
      compare(toks.join(' '));
    });
  });

/* ---- main ------------------------------------------------------------- */
function parseToks(v){
  if(!v) return [];
  return String(v).split(/[\s,]+/).map(function(t){ return t.trim().toUpperCase(); }).filter(Boolean);
}
function dedupeCap(toks){
  var out = [];
  toks.forEach(function(t){ if(out.indexOf(t)<0) out.push(t); });
  return MAX_SEC > 0 ? out.slice(0, MAX_SEC) : out;
}
async function buildSec(stock){
  var an = await loadAnalytics(stock);
  var hist = await loadHistory(stock);
  return {
    ex: stock.ex,
    ticker: stock.ticker || stock.code || stock.short || String(stock.sym||'').split('.')[0],
    sym: stock.sym,
    name: stock.name,
    sector: stock.sector,
    quoteCcy: stock.currency || '',
    price: num(stock.price),
    chgPct: num(stock.chgPct),
    ytd: stock.ytd,
    an: an,
    hist: hist
  };
}
async function compare(tokArg){
  var toks = dedupeCap(parseToks(tokArg));
  $('inToks').value = toks.join(', ');
  if(toks.length < 2){
    $('body').innerHTML = '<div class="err">At least two: tickers, or a ticker and a fund '
      + '(<b>MMF</b>, <b>SPECIAL</b>, <b>FIXED</b>, <b>EQUITY</b>, <b>BALANCED</b>).</div>';
    $('status').textContent = 'need two or more';
    return;
  }
  $('status').textContent = 'loading ' + toks.join(', ');
  var resolved = [], funds = [], named = [], missing = [];
  for(var i=0;i<toks.length;i++){
    var nf = await resolveNamedFund(toks[i]);
    if(nf){ named.push(nf); continue; }
    var fd = await resolveFund(toks[i]);
    if(fd){ funds.push(fd); continue; }
    var r = await resolveStock(toks[i]);
    if(r) resolved.push(r); else missing.push(toks[i]);
  }
  if(missing.length){
    $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(missing.join(', '))+'</b>.</div>';
    $('status').textContent = 'not found';
    return;
  }
  await loadFx();
  if(!resolved.length){
    $('body').innerHTML = '<div class="err">A comparison needs at least one listed security '
      + 'beside the fund. Try <b>SCOM MMF</b>.</div>';
    $('status').textContent = 'need a security';
    return;
  }
  var secs = [];
  for(var k=0;k<resolved.length;k++){ secs.push(await buildSec(resolved[k])); }

  renderHead(secs, funds.concat(named));
  renderPeers(secs);

  var rows = ROWS();
  var html = '';

  // currency banner: currencies are never mixed in silence
  var majors = [];
  secs.forEach(function(s){ var m = majorOf(s.quoteCcy); if(m && majors.indexOf(m)<0) majors.push(m); });
  if(majors.length > 1){
    var ccys = [];
    secs.forEach(function(s){ var l = ccyLabel(s.quoteCcy); if(l && ccys.indexOf(l)<0) ccys.push(l); });
    var anyCents = secs.some(function(s){ return isCents(s.quoteCcy); });
    html += '<div class="banner"><b>Currencies differ: '+esc(ccys.join(', '))+'.</b>'
          + (anyCents ? ' JSE quotes in cents: 100 ZAc = 1 ZAR.' : '') + '</div>';
  }

  // period banner: the newest period each security reports on, and the basis
  // the multiples stand on
  var perBits = secs.map(function(s){
    var newest = (s.an && s.an.period) || 'n/a';
    var base = (s.an && s.an.valuation && (s.an.valuation.pePeriod || s.an.valuation.asOfPeriod)) || 'n/a';
    return esc(s.ticker||s.sym)+' newest '+esc(newest)+', multiples on '+esc(base);
  });
  html += '<div class="banner" style="border-color:#122a20;background:#03170f;color:#33e29a">'
        + '<b>Periods.</b> '+perBits.join(' &middot; ')+'</div>';

  var series = secs.map(function(s){
    if(!s.hist) return null;
    return (s.hist.bars||[]).map(function(b){ return { date:barDate(b), c:b.c }; }).filter(function(x){ return x.date && x.c!=null; });
  });
  await loadFunds();
  var chart = renderChart(secs, series, await loadCash(), named);
  /* One chart area, three ways of looking at the same window: the flat lines,
     the same lanes turned in three dimensions, and the rate surface the cash
     line is drawn from. The explanation of the window sits above all three
     because it is true of all three. */
  hov3 = -1;
  var hasLanes = !!(chart.v3 && chart.v3.lanes && chart.v3.lanes.length);
  if(chart.body){
    html += '<div class="chartbox">' + viewbarHTML(hasLanes) + chart.win
          + '<div class="pane" id="pnLines">' + chart.body + '</div>'
          + pane3HTML(hasLanes) + paneCurveHTML() + '</div>';
  } else {
    html += '<div class="chartbox">' + viewbarHTML(false) + chart.html
          + '<div class="pane" id="pnLines"></div>' + paneCurveHTML() + '</div>';
  }
  html += renderNamed(named, chart.funds);
  html += renderFunds(funds,
    chart.cash ? chart.cash.ret : null,
    chart.cash ? chart.cash.from : '',
    chart.cash ? chart.cash.upto : '');

  var tbl = renderTable(secs);
  html += tbl.html;
  if(tbl.cmpRows === 0){
    html += '<div class="notes"><div class="nt">No shared fundamental metric</div></div>';
  }

  /* the bill as a single number, beside the yields it is there to be read
     against. The chart carries the path; this carries the latest point, with
     the CBK's own as-of date on it, and the MMF rate the CMA does not publish. */
  var eys = secs.map(function(s){ var v = s.an && s.an.valuation; return (v && num(v.earnings_yield)) || null; })
                .filter(function(x){ return x != null; });
  if(CASH && CASH.point && CASH.point.value != null && eys.length >= 2
     && secs.every(function(s){ return String(majorOf(s.quoteCcy)||'').toUpperCase() === 'KES'; })){
    var bill = Number(CASH.point.value);
    var over = eys.filter(function(x){ return x > bill; }).length;
    html += '<div class="notes"><div class="nt">Cash reference</div>'
          + '<div class="wn cash"><b>91-day Treasury bill ' + bill.toFixed(3) + '%</b> as at '
          + esc(CASH.point.as_of || '') + ', Central Bank of Kenya. '
          + over + ' of ' + eys.length + ' earnings yields above it.</div>'
          + '<div class="wn">An earnings yield is what the business earns on the price you pay. The bill is '
          + 'a contractual rate paid in cash. A shareholder receives only what is paid out as dividend, so '
          + 'the comparison shows what the price is asking you to accept, not what you will be paid.</div>'
          + '<div class="wn"><b>Money market fund rate: withheld.</b> The Capital Markets Authority publishes '
          + 'no fund yield. Managers publish their own and they are not like-for-like: some gross of the 15 '
          + 'per cent withholding tax, some net of fees, some a three-month average.</div>'
          + '</div>';
  }

  var wd = collectWithheld(secs, rows);
  if(wd.length){
    html += '<div class="notes"><div class="nt">Withheld metrics</div>';
    wd.forEach(function(w){ html += '<div class="wn"><b>'+esc(w.tag)+'</b> '+esc(w.metric)+': '+(w.why ? esc(w.why) : 'withheld')+'</div>'; });
    html += '</div>';
  }

  html += '<div class="verdict">'+verdict(secs, chart.rets, chart.cash, funds, chart.funds)+'</div>';
  $('body').innerHTML = html;
  wireViews(chart.v3);
  $('status').textContent = 'ready';
}

/* ---- controls / boot -------------------------------------------------- */
function paintRange(){
  var bar = $('rangebar');
  if(!bar) return;
  bar.innerHTML = RANGES.map(function(r){
    return '<button data-range="' + r[1] + '"' + (RANGE === r[1] ? ' class="on"' : '') + '>' + r[0] + '</button>';
  }).join('');
  Array.prototype.forEach.call(bar.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      RANGE = b.getAttribute('data-range');
      paintRange();
      if($('inToks').value.trim()) compare($('inToks').value);
    });
  });
}
paintRange();
$('goBtn').addEventListener('click', function(){ compare($('inToks').value); });
$('inToks').addEventListener('keydown', function(e){ if(e.key==='Enter') $('goBtn').click(); });

(async function(){
  var toks = [];
  ['a','b','c','d'].forEach(function(p){ toks = toks.concat(parseToks(Q.get(p))); });
  var fromSym = false;
  var sym = Q.get('sym');
  if(!toks.length && sym){ toks = parseToks(sym); fromSym = true; }
  toks = dedupeCap(toks);
  $('inToks').value = toks.join(', ');
  if(toks.length >= 2){ await compare(toks.join(' ')); return; }
  if(toks.length === 1){
    var one = await resolveStock(toks[0]);
    if(!one){
      $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(toks[0])+'</b>.</div>';
      $('status').textContent = 'not found';
      return;
    }
    // warm every listing so a peer can be found across exchanges
    for(var i=0;i<EXS.length;i++){ await loadListing(EXS[i]); }
    // a ?sym= deep link fills side A; auto-pick one same-sector peer so the panel
    // is not left blank, but never invent a comparison beyond that pair
    var secOne = await buildSec(one);
    renderHead([secOne]);
    var pool = [];
    EXS.forEach(function(ex){
      (listingCache[ex]||[]).forEach(function(s){
        var k = String(s.ticker||s.sym||'');
        if(k && k.toUpperCase() !== String(one.ticker||one.sym).toUpperCase() && (s.sector||'').toLowerCase()===(one.sector||'').toLowerCase())
          pool.push({ ex:ex, k:k });
      });
    });
    pool.sort(function(x,y){ return (x.ex===one.ex?0:1)-(y.ex===one.ex?0:1); });
    if(fromSym && pool.length){
      await compare(String(one.ticker||one.sym).toUpperCase() + ' ' + pool[0].k.toUpperCase());
      return;
    }
    renderPeers([secOne]);
    $('body').innerHTML = '<div class="err">Comparing <b>'+esc(secOne.ticker||secOne.sym)+'</b>.</div>';
    $('status').textContent = 'ready';
    return;
  }
  $('status').textContent = 'ready';
})();
</script>
