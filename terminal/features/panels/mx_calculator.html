<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - CALC panel.
  Pick a security off the board, then see the whole round trip: what the broker and the
  statutory levies take on each side, what the tax on the dividend and on the gain is,
  and what is left. Vanilla JS, no library.

  THE FEES ARE THE BROKER'S, NOT A GUESS. The schedule is read from
  static_data/broker_fees.json, which carries the published client charges for each
  market with its source named. NSE is on file (Faida Investment Bank: brokerage
  1.76% at or below KES 100,000 and 1.5% above it, plus NSE 0.12%, CMA 0.12%, CDSC
  0.08%, CDSC guarantee 0.01%, CMA guarantee 0.01% - a 2.10% / 1.84% round trip).
  A market with no schedule on file charges nothing and says so, because an invented
  levy is worse than a zero the reader can see. Every rate is a field either way.
-->
<html lang="en">
<head><script>(function(){var V='20261128064903';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script><script>(function(){var V='20261128064903';try{fetch('/build.json?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(!d||!d.build||d.build===V)return;try{if(sessionStorage.getItem('mxv')===d.build)return;sessionStorage.setItem('mxv',d.build);}catch(e){return;}var q=location.search?location.search+'&':'?';location.replace(location.pathname+q+'v='+d.build+location.hash);})['catch'](function(){});}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - CALC</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#121212;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;
    --mono:'Oxygen Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:11px;}
  .cx{padding:10px 12px 18px;}
  .cx-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .cx-hd h1{font-size:10px;letter-spacing:.14em;color:var(--tx3);font-weight:600;margin:0;text-transform:uppercase;}
  .cxs{display:flex;gap:4px;margin-left:auto;}
  .cxs button{background:transparent;border:1px solid var(--line2);color:var(--tx2);font:inherit;
    font-size:9.5px;letter-spacing:.08em;padding:2px 6px;cursor:pointer;border-radius:2px;}
  .cxs button.on{border-color:var(--acc);color:var(--acc);}

  .pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 2px;}
  .pick input[type=text]{flex:1 1 130px;min-width:110px;background:var(--bg2);border:1px solid var(--line2);
    color:var(--tx);font:inherit;font-size:11px;padding:4px 6px;border-radius:2px;}
  .pick select{flex:2 1 220px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
    font:inherit;font-size:11px;padding:4px 6px;border-radius:2px;}
  .pick input:focus,.pick select:focus{outline:none;border-color:var(--acc);}
  .quo{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:4px 0 2px;color:var(--tx2);font-size:10.5px;}
  .quo b{color:var(--tx);font-weight:600;}
  .quo .up{color:var(--up);} .quo .down{color:var(--down);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;}
  @media (max-width:620px){.grid{grid-template-columns:1fr;}}
  .fld{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);}
  .fld label{flex:1 1 auto;color:var(--tx2);font-size:10.5px;}
  .fld input{flex:0 0 96px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
    font:inherit;font-size:11px;text-align:right;padding:3px 6px;border-radius:2px;}
  .fld input:focus{outline:none;border-color:var(--acc);}
  .fld .u{color:var(--tx3);font-size:9.5px;width:26px;text-align:left;}

  h2{font-size:9.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;
     margin:16px 0 4px;font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  td.k{color:var(--tx2);font-size:10.5px;}
  td.v{text-align:right;font-size:11px;white-space:nowrap;}
  td.w{color:var(--tx3);font-size:9.5px;padding-left:10px;}
  tr.sub td.k{padding-left:12px;font-size:10px;color:var(--tx3);}
  tr.sub td.v{font-size:10px;color:var(--tx2);}
  .tot td{border-bottom:none;padding-top:7px;}
  .tot td.k{color:var(--tx);font-weight:600;}
  .tot td.v{font-size:13px;font-weight:600;}
  .up{color:var(--up);} .down{color:var(--down);} .mut{color:var(--tx3);}
  .note{color:var(--tx3);font-size:9.5px;line-height:1.5;margin:8px 0 0;}
  #t_sens tr.here td{background:#161616;}
  #t_sens tr.here td.k{color:var(--tx);}
</style>
</head>
<body>
<div class="cx">
  <div class="cx-hd">
    <h1>Returns, costs and tax</h1>
    <div class="cxs" id="xs"></div>
  </div>

  <div class="pick">
    <input id="q" type="text" placeholder="filter by ticker or name" autocomplete="off">
    <select id="sym" size="1"></select>
  </div>
  <div class="quo" id="quo"><span class="mut">reading the board</span></div>

  <div class="grid">
    <div class="fld"><label>Shares</label><input id="qty" type="number" min="0" step="1" value="1000"><span class="u"></span></div>
    <div class="fld"><label>Or cash to invest</label><input id="cash" type="number" min="0" step="1000" value="0"><span class="u">amt</span></div>
    <div class="fld"><label>Bought at</label><input id="buy" type="number" min="0" step="0.01" value="0"><span class="u">px</span></div>
    <div class="fld"><label>Sold at</label><input id="sell" type="number" min="0" step="0.01" value="0"><span class="u">px</span></div>
    <div class="fld"><label>Held for</label><input id="days" type="number" min="1" step="1" value="365"><span class="u">d</span></div>
    <div class="fld"><label>Brokerage</label><input id="brok" type="number" min="0" step="0.01" value="0"><span class="u">%</span></div>
    <div class="fld"><label>Costs, if you want one flat rate</label><input id="flat" type="number" min="0" step="0.01" value="0"><span class="u">%</span></div>
    <div class="fld"><label>Dividends per share</label><input id="div" type="number" min="0" step="0.01" value="0"><span class="u">px</span></div>
    <div class="fld"><label>Tax on dividends</label><input id="dtax" type="number" min="0" step="0.01" value="0"><span class="u">%</span></div>
    <div class="fld"><label>Tax on the gain</label><input id="gtax" type="number" min="0" step="0.01" value="0"><span class="u">%</span></div>
    <div class="fld"><label>Other costs</label><input id="other" type="number" min="0" step="0.01" value="0"><span class="u">amt</span></div>
  </div>
  <p class="note" id="rateNote">reading the published broker schedule</p>

  <h2>What the position cost</h2>
  <table id="t_cost"></table>

  <h2>Return, before and after tax</h2>
  <table id="t_ret"></table>

  <h2>If you sell at a different price</h2>
  <table id="t_sens"></table>

  <h2>Rates it worked out at</h2>
  <table id="t_rate"></table>

  <p class="note" id="foot"></p>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var n = function(id){ var v = parseFloat(($(id) || {}).value); return isFinite(v) ? v : 0; };

  var FEES = null;                 // broker_fees.json
  var X = 'NSE';                   // selected exchange
  var BOARD = {rows: [], asOf: ''};
  var SEL = '';                    // selected ticker
  var RESTORED = false;            // the reader's own figures came back from storage

  function money(v, cur){
    var neg = v < 0; v = Math.abs(v);
    return (neg ? '-' : '') + cur + ' ' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function pct(v){ return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
  function row(tbl, k, v, why, cls, sub){
    var tr = document.createElement('tr');
    if(sub) tr.className = 'sub';
    var a = document.createElement('td'); a.className = 'k'; a.textContent = k;
    var b = document.createElement('td'); b.className = 'v' + (cls ? ' ' + cls : ''); b.textContent = v;
    var c = document.createElement('td'); c.className = 'w'; c.textContent = why || '';
    tr.appendChild(a); tr.appendChild(b); tr.appendChild(c);
    tbl.appendChild(tr);
    return tr;
  }
  function clear(tbl){ tbl.innerHTML = ''; }

  // ---- the schedule for the selected market ----
  function market(){
    return (FEES && FEES.markets && FEES.markets[X]) ? FEES.markets[X]
      : {currency: 'KES', levies: [], taxes: {}, note: 'no schedule is loaded for this market'};
  }
  function tierFor(consideration){
    var lev = market().levies || [];
    var levyPct = lev.reduce(function(s, l){ return s + (l.pct || 0); }, 0);
    var flat = n('flat');
    if(flat > 0){
      return {brokerage: flat, levyList: [], levyPct: 0,
              label: 'one flat rate entered on this panel', total: flat};
    }
    var t = null, tiers = market().tiers || [];
    for(var i = 0; i < tiers.length; i++){
      if(tiers[i].maxConsideration === null || consideration <= tiers[i].maxConsideration){ t = tiers[i]; break; }
    }
    var override = n('brok');
    var brok = override > 0 ? override : (t ? t.brokerage : 0);
    return {
      brokerage: brok,
      levyList: lev,
      levyPct: levyPct,
      label: override > 0 ? 'brokerage entered on this panel' : (t ? t.label : 'no tier matches this consideration'),
      total: brok + levyPct
    };
  }

  function num(v){ return v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function round2(v){ return Math.round(v * 100) / 100; }

  // One calculation, used by every figure on the panel and by the scenario strip, so
  // a reader cannot be shown two arithmetics for the same trade.
  function calc(qty, buyPx, sellPx, days, dpx, dtax, gtax, other){
    var bcons = round2(qty * buyPx), scons = round2(qty * sellPx);
    var bt = tierFor(bcons), st = tierFor(scons);
    var bfee = round2(bcons * bt.total / 100), sfee = round2(scons * st.total / 100);
    var out = round2(bcons + bfee + other);
    var gross = round2(scons - bcons);
    var dgross = round2(qty * dpx), dtaxAmt = round2(dgross * dtax), dnet = round2(dgross - dtaxAmt);
    var taxableGain = Math.max(0, round2(gross - bfee - sfee));
    var gt = round2(taxableGain * gtax);
    var net = round2(scons - sfee - bcons - bfee - other - gt + dnet);
    var costTotal = round2(bfee + sfee + other);
    var ret = out > 0 ? (net / out) * 100 : 0;
    var ann = out > 0 ? (Math.pow(1 + net/out, 365/Math.max(1, days)) - 1) * 100 : 0;
    var denom = qty * (1 - st.total/100) * (1 - gtax);
    var be = denom !== 0 ? round2((out - dnet) / denom) : NaN;
    return {bcons:bcons, scons:scons, bt:bt, st:st, bfee:bfee, sfee:sfee, out:out, gross:gross,
            dgross:dgross, dtaxAmt:dtaxAmt, dnet:dnet, taxableGain:taxableGain, gt:gt, net:net,
            costTotal:costTotal, ret:ret, ann:ann, be:be};
  }

  function draw(){
    var m = market();
    var cur = m.currency || 'KES';
    var qty = n('qty'), buy = n('buy'), sell = n('sell'), days = Math.max(1, n('days'));
    var dpx = n('div'), dtax = n('dtax')/100, gtax = n('gtax')/100, other = n('other');
    var c = calc(qty, buy, sell, days, dpx, dtax, gtax, other);

    var tb = $('t_cost'); clear(tb);
    row(tb, 'Consideration to buy', money(c.bcons, cur), qty + ' x ' + num(buy));
    row(tb, 'Brokerage to buy', money(c.bcons * c.bt.brokerage / 100, cur), num(c.bcons) + ' x ' + c.bt.brokerage.toFixed(2) + '%');
    (c.bt.levyList || []).forEach(function(l){
      row(tb, l.name + ' to buy', money(c.bcons * l.pct / 100, cur), num(c.bcons) + ' x ' + l.pct.toFixed(2) + '%', null, true);
    });
    row(tb, 'All costs to buy', money(c.bfee, cur), num(c.bcons) + ' x ' + c.bt.total.toFixed(2) + '% (' + c.bt.label + ')');
    row(tb, 'Cash out of your pocket', money(c.out, cur), 'consideration + costs' + (other ? ' + other costs' : ''));
    row(tb, 'Consideration to sell', money(c.scons, cur), qty + ' x ' + num(sell));
    row(tb, 'Brokerage to sell', money(c.scons * c.st.brokerage / 100, cur), num(c.scons) + ' x ' + c.st.brokerage.toFixed(2) + '%');
    (c.st.levyList || []).forEach(function(l){
      row(tb, l.name + ' to sell', money(c.scons * l.pct / 100, cur), num(c.scons) + ' x ' + l.pct.toFixed(2) + '%', null, true);
    });
    row(tb, 'All costs to sell', money(c.sfee, cur), num(c.scons) + ' x ' + c.st.total.toFixed(2) + '% (' + c.st.label + ')');
    if(other) row(tb, 'Other costs', money(other, cur), 'entered on this panel');
    row(tb, 'Cash back in your hand', money(c.scons - c.sfee - other, cur), 'proceeds - costs' + (other ? ' - other costs' : ''));

    var tr = $('t_ret'); clear(tr);
    row(tr, 'Gross gain on the shares', money(c.gross, cur), num(c.scons) + ' - ' + num(c.bcons), c.gross >= 0 ? 'up' : 'down');
    row(tr, 'Dividends received', money(c.dgross, cur), qty + ' x ' + num(dpx) + ' per share');
    row(tr, 'Tax taken off dividends', money(c.dtaxAmt, cur), num(c.dgross) + ' x ' + (dtax*100).toFixed(2) + '%');
    row(tr, 'Dividends kept', money(c.dnet, cur), 'dividends less withholding');
    row(tr, 'Gain chargeable to tax', money(c.taxableGain, cur), 'gross gain less both sides of costs');
    row(tr, 'Tax on the gain', money(c.gt, cur), gtax > 0 ? num(c.taxableGain) + ' x ' + (gtax*100).toFixed(2) + '%' : 'rate on the gain is set to zero for this market');
    var r = row(tr, 'Net profit', money(c.net, cur), 'cash back in - cash out of pocket + dividends kept - tax on the gain', c.net >= 0 ? 'up' : 'down');
    r.className = 'tot';

    // the same arithmetic at other prices, so the reader sees what the trade needs
    var ts = $('t_sens'); clear(ts);
    var marks = [-10, -5, 0, 5, 10];
    marks.forEach(function(d){
      var px = buy * (1 + d/100);
      var sc = calc(qty, buy, px, days, dpx, dtax, gtax, other);
      var lbl = (d === 0 ? 'at the board price ' : (d > 0 ? '+' : '') + d + '% ') + num(px);
      var rr = row(ts, lbl, money(sc.net, cur) + '  ' + pct(sc.ret),
                   'gross ' + num(sc.gross) + ', costs both sides ' + num(sc.bfee + sc.sfee),
                   sc.net >= 0 ? 'up' : 'down');
      if(d === 0) rr.className = 'here';
    });

    var ta = $('t_rate'); clear(ta);
    row(ta, 'Total cost of the round trip', money(c.costTotal, cur), 'both sides of costs' + (other ? ' + other costs' : '') + ' = ' + (c.out > 0 ? (c.costTotal/c.out*100).toFixed(2) : '0') + '% of cash invested');
    row(ta, 'Cost drag on each side', c.bt.total.toFixed(2) + '% / ' + c.st.total.toFixed(2) + '%', 'buy / sell, and ' + (c.bt.total + c.st.total).toFixed(2) + '% before any tax');
    row(ta, 'Net return on cash invested', pct(c.ret), num(c.net) + ' on ' + num(c.out), c.ret >= 0 ? 'up' : 'down');
    row(ta, 'Annualised return', pct(c.ann), 'the net return carried to a 365 day year over ' + days + ' days', c.ann >= 0 ? 'up' : 'down');
    row(ta, 'Sell price that only breaks even', isFinite(c.be) ? money(c.be, cur) : 'n/a', 'covers both sides of costs, the dividend and the tax on the gain');
    row(ta, 'That break-even price is a gain of', isFinite(c.be) && buy > 0 ? pct((c.be/buy - 1) * 100) : 'n/a', 'on the price you bought at');
    row(ta, 'Gain you have to make to cover the bill alone', money(c.costTotal + c.gt, cur), 'costs both sides and the tax, before a shilling of profit');

    var t = m.taxes || {};
    $('rateNote').textContent = (m.source ? 'Charges: ' + m.source + '. ' : '') +
      (m.note ? m.note + ' ' : '') + (m.also ? m.also + ' ' : '') +
      (t.capitalGainsNote ? t.capitalGainsNote + ' ' : '') + (t.dividendNote ? t.dividendNote : '');
    $('foot').textContent = 'This panel adds up your own figures. The price and the charges come from the board and the published schedule named above; ' +
      'every rate on it can be changed, and no line is left out of the total. Figures in ' + cur + '.';
    remember();
  }

  // ---- what the reader last typed stays put ----
  var KEY = 'mt_calc_v1';
  function remember(){
    try{
      var o = {};
      ['qty','cash','buy','sell','days','brok','flat','div','dtax','gtax','other'].forEach(function(k){ if($(k)) o[k] = $(k).value; });
      localStorage.setItem(KEY, JSON.stringify({ex: X, sym: SEL, f: o}));
    }catch(e){}
  }
  function recall(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(!d || !d.f) return false;
      Object.keys(d.f).forEach(function(k){ var el = $(k); if(el && d.f[k] != null) el.value = d.f[k]; });
      if(d.ex) X = d.ex;
      if(d.sym) SEL = d.sym;
      return true;
    }catch(e){ return false; }
  }

  // cash to invest fills the share count, fees included
  function fromCash(){
    var cash = n('cash');
    if(cash <= 0) return;
    var buy = n('buy');
    if(buy <= 0) return;
    var t = tierFor(cash);
    var qty = Math.floor(cash / (buy * (1 + t.total/100)));
    $('qty').value = qty;
    draw();
  }

  // ---- the board ----
  function fillPicker(){
    var sel = $('sym'), q = ($('q').value || '').toUpperCase();
    sel.innerHTML = '';
    var rows = BOARD.rows.filter(function(r){
      if(r.price == null) return false;
      if(!q) return true;
      return String(r.sym).toUpperCase().indexOf(q) > -1 || String(r.name || '').toUpperCase().indexOf(q) > -1;
    });
    rows.slice(0, 400).forEach(function(r){
      var o = document.createElement('option');
      o.value = r.sym;
      o.textContent = r.sym + '  ' + String(r.name || '').slice(0, 30) + '  ' + Number(r.price).toFixed(2);
      sel.appendChild(o);
    });
    if(!rows.length) return;
    var keep = rows.some(function(r){ return r.sym === SEL; }) ? SEL : rows[0].sym;
    sel.value = keep;
    pick(keep);
  }

  function pick(sym){
    SEL = sym;
    var r = BOARD.rows.filter(function(x){ return x.sym === sym; })[0];
    if(!r) return;
    var cur = market().currency || 'KES';
    if(!RESTORED || !n('buy')){
      $('buy').value = Number(r.price).toFixed(2);
      $('sell').value = Number(r.price).toFixed(2);
    }
    RESTORED = false;
    $('quo').innerHTML = '<span><b>' + r.sym + '</b> ' + String(r.name || '') + '</span>' +
      '<span>last <b>' + Number(r.price).toFixed(2) + '</b> ' + cur + '</span>' +
      (r.chgPct != null ? '<span class="' + (r.chgPct >= 0 ? 'up' : 'down') + '">' + (r.chgPct >= 0 ? '+' : '') + Number(r.chgPct).toFixed(2) + '%</span>' : '') +
      (r.prevClose != null ? '<span class="mut">prev ' + Number(r.prevClose).toFixed(2) + '</span>' : '') +
      '<span class="mut">board ' + (BOARD.asOf || 'undated') + '</span>';
    draw();
  }

  function loadBoard(){
    var url = 'static_data/market_' + X + '.json';
    fetch('../../' + url, {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      BOARD = {rows: (d.stocks || d.rows || []).slice(), asOf: d.asOf || ''};
      if(!RESTORED){
        var t = market().taxes || {};
        $('dtax').value = (t.dividendWithholding != null ? t.dividendWithholding : 0);
        $('gtax').value = (t.capitalGainsOnListedShares != null ? t.capitalGainsOnListedShares : 0);
      }
      fillPicker();
    }).catch(function(){
      BOARD = {rows: [], asOf: ''};
      $('quo').innerHTML = '<span class="mut">the board for ' + X + ' could not be read</span>';
      draw();
    });
  }

  function chips(){
    var box = $('xs'); box.innerHTML = '';
    var keys = (FEES && FEES.markets) ? Object.keys(FEES.markets) : ['NSE', 'NGX', 'JSE', 'EGX'];
    keys.forEach(function(k){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = k;
      b.className = (k === X) ? 'on' : '';
      b.onclick = function(){
        X = k; SEL = ''; RESTORED = false;
        Array.prototype.forEach.call(box.children, function(c){ c.className = (c.textContent === X) ? 'on' : ''; });
        loadBoard();
      };
      box.appendChild(b);
    });
  }

  document.querySelectorAll('input').forEach(function(i){ i.addEventListener('input', draw); });
  $('cash').addEventListener('input', fromCash);
  $('q').addEventListener('input', function(){ fillPicker(); });
  $('sym').addEventListener('change', function(){ pick($('sym').value); });

  // the desk's own selection, when this panel is opened from the shell
  var deskSym = '';
  try{
    var p = window.parent;
    if(p && p !== window && p.__mtSelection && p.__mtSelection.sym) deskSym = String(p.__mtSelection.sym).toUpperCase();
  }catch(e){}

  fetch('../../static_data/broker_fees.json', {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    FEES = d;
    RESTORED = recall();
    chips();
    if(!RESTORED && deskSym) SEL = deskSym;
    loadBoard();                 // the picker needs the board whether or not a trade came back
  }).catch(function(){
    FEES = {markets: {NSE: {currency: 'KES', levies: [], taxes: {}, note: 'the published charge schedule could not be read, so no charges are applied until a rate is entered.'}}};
    chips(); loadBoard();
  });
})();
</script>
