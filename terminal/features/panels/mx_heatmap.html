<!DOCTYPE html>
<!-- MUTXRI TERMINAL - HEATMAP (TradingView-style squarified treemap).
     Sector-grouped, cells packed by weight to fill space, colored by day %,
     AUTO-POLLING with animated transitions. Godel palette, vanilla JS, no build.
     Reads the live /api/heatmap feed when reachable, else the dated snapshot
     static_data/heatmap_<EX>.json; an honest empty state if neither exists.
     Never renders invented rows.
     LIVE DATA appears only when wired to the bundled Python server (see README). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - Heatmap</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;--tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  /* The shell already draws this panel's window chrome, its border and its
     background, so the panel must NOT draw a second frame inside it. A 16px
     gutter, its own 1px border and its own fill read as one panel nested inside
     another - which is exactly the defect the owner reported in this window and
     that the FOCUS and CHART panels already carry the fix for. Fill the shell's
     window instead: no padding, no border, no background, no max-width, no auto
     margin. Same rule, same values, as .fx in mx_focus.html and .ch in
     mx_chart.html. */
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--ui);font-size:13px;padding:0;}
  .hm{max-width:none;margin:0;border:0;background:transparent;border-radius:0;}
  .hm-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);gap:12px;flex-wrap:wrap;}
  .hm-head .t{font-size:12px;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase;}
  .hm-head .t b{color:var(--acc);font-weight:700;}
  .hm-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
  .hm-status{font-family:var(--mono);font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);display:inline-block;}
  .dot.eod{background:#e0a341;box-shadow:0 0 6px #e0a341}
  .dot.live{background:var(--up);box-shadow:0 0 6px rgba(51,226,154,.7);animation:pulse 1.6s infinite;}
  .dot.sample{background:#e0a340;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hm-view{display:flex;gap:3px;margin-right:10px;}
  .hm-vb{font-family:var(--mono);font-size:10px;color:var(--tx3);background:var(--bg2);border:1px solid var(--line2);padding:3px 8px;border-radius:2px;cursor:pointer;letter-spacing:.04em;}
  .hm-vb.on{color:var(--acc);border-color:var(--acc);}
  .hm-tabs{display:flex;gap:3px;}
  .hm-tab{font-family:var(--mono);font-size:11px;color:var(--tx3);padding:3px 10px;border:1px solid transparent;cursor:pointer;border-radius:2px;}
  .hm-tab:hover{color:var(--tx2);}
  .hm-tab.on{color:var(--acc);border-color:var(--line2);background:var(--bg3);}
  .hm-tab .cnt{color:var(--tx3);font-size:9px;margin-left:4px;}
  #canvas{position:relative;width:100%;height:520px;background:var(--bg);overflow:hidden;}
  .sector{position:absolute;overflow:hidden;pointer-events:none;
    background:rgba(255,255,255,.015);
    border:1px solid rgba(255,255,255,.04);
    transition:left .55s cubic-bezier(.2,.8,.3,1),top .55s cubic-bezier(.2,.8,.3,1),
               width .55s cubic-bezier(.2,.8,.3,1),height .55s cubic-bezier(.2,.8,.3,1),
               background-color .4s ease,border-color .4s ease,box-shadow .4s ease;}
  .sector-label{position:absolute;top:0;left:0;right:0;height:16px;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2);background:rgba(10,10,10,.85);padding:2px 6px;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);pointer-events:auto;}
  /* SECTORS view: each industry tile is a live, hoverable block */
  .sector[style*="flex"]{pointer-events:auto;}
  .sector[style*="flex"]:hover{background:rgba(51,226,154,.06);border-color:rgba(51,226,154,.45);
    box-shadow:0 0 18px rgba(51,226,154,.18),inset 0 0 22px rgba(51,226,154,.05);}
  .sector[style*="flex"] .sector-label{position:static;background:transparent;color:var(--acc);
    font-size:11px;letter-spacing:.08em;padding:0;text-align:center;font-weight:700;}
  /* breathing outline on industry tiles (Godel data-flow feel) */
  .sector[style*="flex"]::after{content:"";position:absolute;inset:0;pointer-events:none;
    border:1px solid rgba(51,226,154,.08);animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.4;}50%{opacity:1;}}
  .sector[style*="flex"]:hover .sector-label{color:#fff;text-shadow:0 0 12px rgba(51,226,154,.8);}
  .cell{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;cursor:pointer;
    transition:left .5s ease,top .5s ease,width .5s ease,height .5s ease,background-color .6s ease;border:1px solid rgba(0,0,0,.35);}
  .cell:hover{outline:1px solid var(--acc);outline-offset:-1px;z-index:3;}
  .cell .ct{font-weight:700;line-height:1.05;}
  .cell .cc{line-height:1.15;opacity:.92;}
  .flash{animation:flash .7s ease;}
  @keyframes flash{0%{filter:brightness(2.2);}40%{filter:brightness(1.35);}100%{filter:brightness(1);}}
  .cell.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.35);}
  @keyframes enter{0%{transform:scale(.25) translateY(6px);opacity:0;filter:brightness(2);}
    60%{transform:scale(1.07) translateY(0);opacity:1;filter:brightness(1.4);}
    100%{transform:scale(1);opacity:1;filter:brightness(1);}}
  .sector{animation:secEnter .6s cubic-bezier(.2,.8,.3,1);}
  @keyframes secEnter{0%{opacity:0;transform:scale(.92);}
    100%{opacity:1;transform:scale(1);}}
  /* hover: cell lifts with a mint rim and its price glows */
  .cell:hover .ct{text-shadow:0 0 10px rgba(51,226,154,.55);}
  /* subtle continuous 'alive' shimmer on every cell (Godel-style data flow) */
  .cell::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 45%,transparent 60%);
    background-size:250% 100%;animation:shimmer 5.5s linear infinite;}
  @keyframes shimmer{0%{background-position:120% 0;}100%{background-position:-120% 0;}}
  /* sector drill-down panel */
  #chartPanel{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  #chartPanel.open{display:flex;animation:bdIn .25s ease;}
  @keyframes bdIn{0%{opacity:0;}100%{opacity:1;}}
  .cp-box{background:var(--bg2);border:1px solid var(--line2);border-radius:4px;width:min(860px,94vw);max-height:88vh;display:flex;flex-direction:column;
    animation:boxIn .32s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 18px 60px rgba(0,0,0,.85),0 0 0 1px rgba(51,226,154,.08);}
  @keyframes boxIn{0%{opacity:0;transform:translateY(18px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
  .cp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);}
  .cp-title{font-family:var(--mono);font-weight:700;color:var(--acc);letter-spacing:.04em;}
  .cp-sub{font-size:11px;color:var(--tx3);margin-top:2px;}
  .cp-toolbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .cp-types,.cp-ranges,.cp-basis{display:flex;gap:4px;}
  .cp-type,.cp-range,.cp-basis-b{font-family:var(--mono);font-size:10px;color:var(--tx2);background:var(--bg3);
    border:1px solid var(--line2);border-radius:2px;padding:4px 10px;cursor:pointer;letter-spacing:.06em;transition:all .12s;}
  .cp-type.on,.cp-range.on,.cp-basis-b.on{color:#00160e;background:var(--acc);border-color:var(--acc);font-weight:700;}
  .cp-type:hover,.cp-range:hover,.cp-basis-b:hover{border-color:var(--acc);color:var(--acc);}
  .cp-type.on:hover,.cp-range.on:hover,.cp-basis-b.on:hover{color:#00160e;}
  .cp-basis-b.dim{opacity:.35;pointer-events:none;}
  .cp-inds{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 18px;margin:0 18px;width:calc(100% - 36px);box-sizing:border-box;}
  .cp-ind{font-family:var(--mono);font-size:9px;color:var(--tx3);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:3px 8px;cursor:pointer;letter-spacing:.05em;transition:all .12s;}
  .cp-ind:hover{border-color:var(--acc);color:var(--acc);}
  .cp-ind.on{color:#00160e;background:var(--acc);border-color:var(--acc);font-weight:700;}
  .cp-ind.dim{opacity:.35;pointer-events:none;}
  .cp-reset{font-family:var(--mono);font-size:9px;color:var(--tx2);background:var(--bg3);border:1px solid var(--line2);border-radius:2px;padding:3px 8px;cursor:pointer;letter-spacing:.05em;margin-left:auto;}
  .cp-reset:hover{border-color:var(--acc);color:var(--acc);}
  /* drawing-tool row: the tools the reader places on the candles themselves */
  .cp-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 18px;margin:0 18px;width:calc(100% - 36px);box-sizing:border-box;}
  .cp-lbl{font-family:var(--mono);font-size:8px;color:var(--tx3);letter-spacing:.12em;margin-right:2px;}
  .cp-len{font-family:var(--mono);font-size:10px;color:var(--tx);background:var(--bg3);border:1px solid var(--line2);border-radius:2px;padding:2px 4px;width:46px;text-align:center;}
  .cp-len:focus{outline:none;border-color:var(--acc);}
  .cp-dcount{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-left:auto;letter-spacing:.04em;}
  .cp-legend{font-family:var(--mono);font-size:9px;color:var(--tx3);display:flex;gap:12px;flex-wrap:wrap;padding:0 18px 8px;min-height:11px;}
  .cp-legend .na{color:#e0a340;}
  .cp-stat{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-left:auto;}
  .cp-chart{height:420px;position:relative;margin:10px 18px 18px;}
  @media(max-width:700px){.cp-chart{height:300px;}}
  /* sector drill-down panel */
  #sectorPanel{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  #sectorPanel.open{display:flex;animation:bdIn .25s ease;}
  .sp-box{background:var(--bg2);border:1px solid var(--line2);border-radius:4px;width:min(720px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.85),0 0 0 1px rgba(51,226,154,.08);
    animation:boxIn .32s cubic-bezier(.2,.9,.3,1.2);}
  .sp-row{animation:rowIn .3s ease backwards;}
  @keyframes rowIn{0%{opacity:0;transform:translateX(-8px);}100%{opacity:1;transform:translateX(0);}}
  .sp-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);}
  .sp-head .sp-title{font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--tx);}
  .sp-head .sp-sub{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:2px;}
  .sp-head .sp-close{margin-left:auto;cursor:pointer;color:var(--tx3);font-size:18px;padding:2px 8px;border-radius:2px;}
  .sp-head .sp-close:hover{color:var(--tx);background:var(--bg3);}
  .sp-stats{display:flex;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--tx2);}
  .sp-stats b{color:var(--acc);font-weight:700;}
  .sp-list{overflow-y:auto;padding:4px 0;}
  .sp-row{display:grid;grid-template-columns:64px 1fr 90px 90px;gap:8px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;font-size:12px;}
  .sp-row:hover{background:var(--bg3);}
  .sp-row .tkr{font-family:var(--mono);font-weight:700;color:var(--acc);letter-spacing:.02em;}
  .sp-row .nm{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sp-row .px{font-family:var(--mono);text-align:right;color:var(--tx);}
  .sp-row .chg{font-family:var(--mono);text-align:right;font-weight:700;}
  .sp-empty{padding:24px;color:var(--tx3);text-align:center;font-size:12px;}
</style>
</head>
<body>
<div class="hm" id="heatmap">
  <div class="hm-head">
    <div class="t"><b>HEATMAP</b> &middot; <span id="exLabel">JSE</span></div>
    <div class="hm-right">
      <div class="hm-view" id="hmView">
        <button class="hm-vb on" data-v="all" onclick="hmSetView('all')">ALL</button>
      </div>
      <span class="hm-status"><span class="dot" id="dot"></span><span id="statusTxt">-</span></span>
    </div>
  </div>
  <div id="canvas"></div>
</div>
<div id="chartPanel">
  <div class="cp-box">
    <div class="cp-head">
      <div>
        <div class="cp-title" id="cpTitle">-</div>
        <div class="cp-sub" id="cpSub">-</div>
      </div>
      <span class="sp-close" onclick="document.getElementById('chartPanel').classList.remove('open')">&times;</span>
    </div>
    <div class="cp-toolbar">
      <div class="cp-types" id="cpTypes">
        <button class="cp-type on" data-type="candle" onclick="cpSetType('candle')">CANDLE</button>
        <button class="cp-type" data-type="line" onclick="cpSetType('line')">LINE</button>
        <button class="cp-type" data-type="area" onclick="cpSetType('area')">AREA</button>
      </div>
      <div class="cp-ranges" id="cpRanges">
        <button class="cp-range on" data-rng="1D" onclick="cpSetRange('1D')">1D</button>
        <button class="cp-range" data-rng="1W" onclick="cpSetRange('1W')">1W</button>
        <button class="cp-range" data-rng="1M" onclick="cpSetRange('1M')">1M</button>
        <button class="cp-range" data-rng="3M" onclick="cpSetRange('3M')">3M</button>
        <button class="cp-range" data-rng="6M" onclick="cpSetRange('6M')">6M</button>
        <button class="cp-range" data-rng="1Y" onclick="cpSetRange('1Y')">1Y</button>
        <button class="cp-range" data-rng="10Y" onclick="cpSetRange('10Y')">10Y</button>
        <button class="cp-range" data-rng="ALL" onclick="cpSetRange('ALL')">ALL</button>
      </div>
      <div class="cp-basis" id="cpBasisBtns">
        <button class="cp-basis-b on" data-basis="splits" onclick="cpSetBasis('splits')" title="TradingView's default chart basis">SPLIT</button>
        <button class="cp-basis-b" data-basis="dividends" onclick="cpSetBasis('dividends')" title="Adjusted for dividends too, which is NOT TradingView's default">+DIV</button>
      </div>
      <div class="cp-stat" id="cpStat">-</div>
    </div>
    <div class="cp-tools" id="cpTools">
      <span class="cp-lbl">DRAW</span>
      <button class="cp-ind" data-tool="trend" onclick="cpSetTool('trend')" title="Click, then drag to the second point. The line is anchored to the bars it was drawn from, so it stays on that price as the chart pans and zooms.">TRENDLINE</button>
      <button class="cp-ind" data-tool="ray" onclick="cpSetTool('ray')" title="A trendline extended to the right, as a projection ray">RAY</button>
      <button class="cp-ind" data-tool="hline" onclick="cpSetTool('hline')" title="Horizontal line at a price: support or resistance. Click the chart to place it.">H-LINE</button>
      <button class="cp-ind" data-tool="vline" onclick="cpSetTool('vline')" title="Vertical line on one bar. Click the chart to place it.">V-LINE</button>
      <button class="cp-ind" data-tool="zone" onclick="cpSetTool('zone')" title="Rectangle zone: drag from one corner to the other">ZONE</button>
      <button class="cp-ind" data-tool="erase" onclick="cpSetTool('erase')" title="Click a drawing to remove it">ERASE</button>
      <button class="cp-reset" onclick="cpClearDrawings()" title="Remove every drawing for this security">CLEAR ALL</button>
      <span class="cp-dcount" id="cpDrawCount">0 drawings</span>
    </div>
    <div class="cp-inds" id="cpInds">
      <span class="cp-lbl">IND</span>
      <button class="cp-ind" data-ind="sma" onclick="cpToggleInd('sma')" title="Simple moving average of the closes">SMA</button>
      <input class="cp-len" id="cpSmaLen" type="number" min="2" max="500" step="1" value="20" onchange="cpSetLen('sma',this.value)" title="SMA length in bars. Nothing is drawn until this many bars exist.">
      <button class="cp-ind" data-ind="ema" onclick="cpToggleInd('ema')" title="Exponential moving average of the closes">EMA</button>
      <input class="cp-len" id="cpEmaLen" type="number" min="2" max="500" step="1" value="20" onchange="cpSetLen('ema',this.value)" title="EMA length in bars. Nothing is drawn until this many bars exist.">
      <button class="cp-ind" data-ind="bb" onclick="cpToggleInd('bb')" title="Bollinger bands: 20 bar SMA with 2 standard deviations">BBANDS</button>
      <button class="cp-ind" data-ind="vol" onclick="cpToggleInd('vol')" title="Published volume per bar. A bar with no published volume plots nothing.">VOL</button>
      <button class="cp-ind" data-ind="rsi" onclick="cpToggleInd('rsi')" title="Wilder RSI, 14 bars">RSI</button>
      <button class="cp-ind" data-ind="macd" onclick="cpToggleInd('macd')" title="MACD 12/26/9">MACD</button>
      <button class="cp-reset" onclick="cpResetZoom()">RESET ZOOM</button>
    </div>
    <div class="cp-legend" id="cpLegend"></div>
    <div class="cp-chart" id="cpChart"></div>
  </div>
</div>
<div id="sectorPanel">
  <div class="sp-box">
    <div class="sp-head">
      <div>
        <div class="sp-title" id="spTitle">-</div>
        <div class="sp-sub" id="spSub">-</div>
      </div>
      <span class="sp-close" onclick="document.getElementById('sectorPanel').classList.remove('open')">&times;</span>
    </div>
    <div class="sp-stats" id="spStats"></div>
    <div class="sp-list" id="spList"></div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@5.0.4/dist/lightweight-charts.standalone.production.js"></script>
<!-- drawing tools + indicator maths for the candlestick chart (shared module) -->
<script src="../../static_data/mx_chart_tools.js"></script>
<script>
// The deploy ships static_data/ (which carries mx_chart_tools.js) but a fresh
// checkout has not copied it there yet, so fall back to the tracked source that
// sits beside this panel. Without either copy the panel still runs: it hides the
// promise of tools it cannot deliver and says so on the indicator line.
if(!window.MXChartTools){ document.write('<script src="mx_chart_tools.js"><\/script>'); }
</script>
<script src="../../static_data/nse_heatmap_charts.js"></script>
<script src="../../static_data/nse_ir_adapter.js"></script>
<script>
(function(){
  "use strict";
  // API BASE (2026-09-28). This panel runs inside an iframe, so the shell's fetch
  // wrapper - the thing that prepends API_BASE to /api/ paths - does NOT apply here.
  // A bare "/api/heatmap" therefore resolved against mutxriterminal.com, which has no
  // backend, so the panel fell back and its colours never came from the live board.
  // Resolve the base the same way the shell does: the parent window, else ?api=, else none.
  var API_BASE=(function(){
    try{ if(window.parent && window.parent.API_BASE && String(window.parent.API_BASE).indexOf("http")===0) return window.parent.API_BASE; }catch(e){}
    var m=location.search.match(/[?&]api=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  })();
  var ENDPOINT=API_BASE+"/api/heatmap";
  var EXCHANGES=["JSE","EGX","NGX","NSE"];
  var EOD_MARKETS={NGX:true,NSE:true};
  var POLL_MS=15000, snapAsOf="";
  var CLAMP=4.0;
  var activeEx="JSE";
  // honor ?ex= deep-link from the terminal (landing exchange dropdown)
  try{
    var _pex = new URLSearchParams(location.search).get("ex");
    if(_pex && EXCHANGES.indexOf(_pex.toUpperCase()) >= 0) activeEx = _pex.toUpperCase();
  }catch(e){}
  var pollTimer=null;
  var prevByKey={};


  function $(id){return document.getElementById(id);}
  function lerp(a,b,t){
    function h(x){return [parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];}
    var A=h(a),B=h(b);function c(i){var v=Math.round(A[i]+(B[i]-A[i])*t);return ("0"+v.toString(16)).slice(-2);}
    return "#"+c(0)+c(1)+c(2);
  }
  function color(chg){
    if(chg==null)return "#2a2a2a";        // nothing published: grey, label shows "-"
    var c=Math.max(-CLAMP,Math.min(CLAMP,chg));
    // ZERO IS NOT MISSING (2026-09-29). A security that traded and closed unchanged
    // carries chgPct 0, and lerping from #141414 painted it the same near-black as
    // the page. 49 JSE names (ACT, ADW, AOO, APH and others) read as empty tiles
    // while the watchlist showed them priced with +0.00%. Flat now gets a visible
    // neutral so "unchanged" looks different from "we have no figure".
    if(c===0)return "#3f3f3f";
    return c>=0?lerp("#141414","#33e29a",c/CLAMP):lerp("#141414","#f87171",(-c)/CLAMP);
  }
  function txtColor(chg){
    if(chg==null)return "#9a9a9a";

  function worst(row, length){
    var sum=row.reduce(function(s,r){return s+r.area;},0);
    var mx=Math.max.apply(null,row.map(function(r){return r.area;}));
    var mn=Math.min.apply(null,row.map(function(r){return r.area;}));

  function layoutRow(items, x, y, w, h, out){
    if(!items.length)return;
    items=items.slice();
    while(items.length){
      var horizontal = w >= h;
      var length = horizontal ? h : w;
      if(length<=0){ items.forEach(function(it){out.push({item:it.item,x:x,y:y,w:0,h:0});}); return; }
      var row=[];
      while(items.length){
        var withNext=row.concat([items[0]]);
        if(row.length===0 || worst(row,length) >= worst(withNext,length)){ row=withNext; items.shift(); }
        else break;
      }
      var rowArea=row.reduce(function(s,r){return s+r.area;},0);
      var thickness = rowArea/length;
      var offset=0;
      for(var i=0;i<row.length;i++){
        var cellLen = thickness>0 ? row[i].area/thickness : 0;
        if(horizontal){ out.push({item:row[i].item,x:x,y:y+offset,w:thickness,h:cellLen}); }
        else { out.push({item:row[i].item,x:x+offset,y:y,w:cellLen,h:thickness}); }
        offset+=cellLen;
      }
      if(horizontal){ x+=thickness; w-=thickness; } else { y+=thickness; h-=thickness; }
    }

  function squarify(items, x, y, w, h){
    var out=[];
    var total=items.reduce(function(s,it){return s+it.value;},0);
    if(total<=0||w<=0||h<=0)return items.map(function(it){return {item:it,x:x,y:y,w:0,h:0};});
    var scale=(w*h)/total;
    var norm=items.map(function(it){return {item:it,area:it.value*scale};});
    norm.sort(function(a,b){return b.area-a.area;});
    layoutRow(norm, x, y, w, h, out);

  window.cpSetLen = cpSetLen;
  window.cpResetZoom = cpResetZoom;
  window.cpSetTool = cpSetTool;
  window.cpClearDrawings = cpClearDrawings;
  window.cpDrawCount = function(){ return cpTA ? cpTA.count() : 0; };
  window.cpToolsHandle = function(){ return cpTA; };
  window.hmSetView = hmSetView;
  // The proof surface for the centre window's candles: the range name, the bar
  // window that name maps to, the history key that loaded, how many bars the
  // published file holds and how many candles were actually handed to the series,
  // plus the first and last bar's date and OHLC. Read from the rendered DOM, so
  // the centre view and the CHART panel can be compared bar for bar rather than
  // by eye. Deliberately NOT rendered on screen: a bar count is an implementation
  // detail, and this file's own comment (see cpStat) says so.
  window.__mtCentreState = function(){
    var v = cpBarsForRange(), lb = v.length ? v[v.length - 1] : null;
    return {
      view: "cpChart, the centre window's chart",
      type: cpType, range: cpRange, basis: cpBasisMode,
      barsInView: v.length, barsPlotted: cpPlotted,
      monthlyOnly: cpMonthlyOnly,
      barsPublishedDaily: cpBarsDaily.length, barsPublishedMax: cpBarsMax.length,
      barsPublishedDiv: cpDivBars.length,
      rangeBars: RANGE_BARS[cpRange] || null,
      rangeTable: RANGE_BARS,
      histKey: cpHistoryKey,
      firstBar: v.length ? String(v[0].t) : null,
      lastBar: lb ? String(lb.t) : null,
      lastOhlc: lb ? {t: String(lb.t), o: num(lb.o), h: num(lb.h), l: num(lb.l), c: num(lb.c)} : null,
      seriesPlotted: !!cpSeries,
      candlesPlotted: (cpType === "candle" ? cpPlotted : 0)
    };
  };
  cpPaintInds();
  cpPaintTools();
})();
</script>
