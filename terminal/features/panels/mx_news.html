<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - NEWS panel. NSE news headlines. Vanilla JS, Godel palette.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - NEWS</title>
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--acc:#33e29a;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  body{margin:0;background:#000;color:var(--tx);font-family:var(--ui);font-size:13px}
  .wrap{max-width:640px;margin:0 auto;padding:14px}
  .head{display:flex;align-items:center;gap:10px;padding:8px 4px 12px;border-bottom:1px solid var(--line2)}
  .code{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;border:1px solid var(--line2);padding:2px 6px;border-radius:2px}
  .title{font-family:var(--mono);font-size:12px;color:var(--tx2);letter-spacing:.06em}
  .title b{color:var(--acc)}
  .spacer{flex:1}
  .src{font-family:var(--mono);font-size:9px;color:var(--tx3)}
  .item{border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:12px 14px;margin-top:8px}
  .item a{color:var(--tx);text-decoration:none;font-size:13px;line-height:1.5;display:block}
  .item a:hover{color:var(--acc)}
  .meta{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-top:7px;display:flex;gap:10px;align-items:center}
  .pub{color:var(--acc)}
  .tick{color:var(--acc2);border:1px solid var(--line2);border-radius:2px;padding:1px 5px}
  .item .nl{color:var(--tx2)}
  .empty{padding:30px 14px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:11px}

  /* SECURITY FILTER: the search box, its suggestion list, the chip that names
     the security the panel is narrowed to, and the note that explains what a
     single-security view leaves out. */
  .bar{display:flex;gap:8px;padding:12px 0 8px;align-items:center}
  .sbox{position:relative;flex:1}
  .search{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;
    color:var(--tx);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none}
  .search:focus{border-color:var(--acc)}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:9;background:var(--bg3);
    border:1px solid var(--line2);border-radius:3px;max-height:224px;overflow:auto;display:none}
  .sugg.on{display:block}
  .sugg div{font-family:var(--mono);font-size:11px;color:var(--tx2);padding:6px 9px;cursor:pointer;
    display:flex;gap:8px;align-items:baseline}
  .sugg div:hover,.sugg div.sel{background:var(--bg4);color:var(--acc)}
  .sugg b{color:var(--acc);min-width:56px;display:inline-block}
  .sugg span{color:var(--tx3);font-size:10px}
  .active{display:flex;align-items:center;gap:8px;padding:0 0 8px}
  .active .pill{font-family:var(--mono);font-size:10px;color:#000;background:var(--acc);
    border-radius:2px;padding:2px 7px;letter-spacing:.06em}
  .active .pill.no{background:transparent;color:var(--tx3);border:1px solid var(--line2)}
  .active .an{font-family:var(--mono);font-size:10px;color:var(--tx2)}
  .active .clr{margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:2px;
    color:var(--tx2);font-family:var(--mono);font-size:9px;padding:2px 8px;cursor:pointer}
  .active .clr:hover{border-color:var(--acc);color:var(--acc)}
  .note{font-family:var(--mono);font-size:9px;color:var(--tx3);padding:0 4px 8px;line-height:1.5}
  /* a single-security view is about listed securities, so the coming-to-market
     block (companies that have not traded and belong to no security) steps out
     of the way rather than sitting above an unrelated filter result */
  body.has-q #upcoming{display:none}

  /* UPCOMING LISTINGS: companies approaching the market that have NOT traded.
     Data-driven from static_data/upcoming_listings.json. Carries no traded
     price: a null renders as an honest hyphen or the row is omitted, never a
     zero, and an offer price is labelled OFFER PRICE. */
  .up-h{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;flex-wrap:wrap}
  .up-code{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;border:1px solid var(--line2);padding:2px 6px;border-radius:2px}
  .up-t{font-family:var(--mono);font-size:12px;color:var(--tx2);letter-spacing:.06em}
  .up-t b{color:var(--acc)}
  .up-card{border:1px solid var(--line2);border-left:2px solid var(--acc);border-radius:4px;background:var(--bg2);padding:12px 14px;margin-bottom:8px}
  .up-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .up-name{font-size:14px;color:var(--tx);font-weight:600}
  .up-chip{font-family:var(--mono);font-size:9px;letter-spacing:.08em;border-radius:2px;padding:2px 7px;border:1px solid var(--line2);white-space:nowrap}
  .up-chip.ok{color:#33e29a;border-color:#33e29a}
  .up-chip.soon{color:#e0a341;border-color:#e0a341}
  .up-chip.pend{color:var(--tx2)}
  .up-aka{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:3px}
  .up-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px 14px;margin-top:10px}
  .up-f{min-width:0}
  .up-k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--tx3)}
  .up-v{font-family:var(--mono);font-size:12px;color:var(--tx);overflow-wrap:anywhere;margin-top:2px}
  .up-v.price{color:#33e29a}
  .up-note{display:block;font-family:var(--ui);font-size:9px;color:var(--tx3);margin-top:2px}
  .up-text{margin-top:10px;font-size:12px;line-height:1.5;color:var(--tx2)}
  .up-src{margin-top:9px;font-family:var(--mono);font-size:9px;color:var(--tx3);line-height:1.5;overflow-wrap:anywhere}
  .up-src a{color:var(--acc2);text-decoration:none}
  .up-sep{height:1px;background:var(--line2);margin:2px 0 12px}
</style>
</head>
<body>

<div class="wrap">
  <div id="upcoming"></div>
  <div class="head">
    <span class="code" id="panelCode">NEWS</span>
    <span class="title"><span id="exTitle">NSE</span> <span id="panelKind">NEWS</span> <b id="panelFeeds">· HEADLINES · REGULATORY · ACTIONS</b></span>
    <span class="spacer"></span>
    <span class="src" id="src">Headlines · Reg · Actions</span>
  </div>
  <div class="bar">
    <div class="sbox">
      <input class="search" id="q" autocomplete="off" spellcheck="false"
        placeholder="filter to one security:  ticker, ISIN or company  (e.g. SCOM, Safaricom)" />
      <div class="sugg" id="sugg"></div>
    </div>
  </div>
  <div class="active" id="active" style="display:none"></div>
  <div class="note" id="note"></div>
  <div id="items"><div class="empty">loading…</div></div>
</div>
<script>
(function(){
  "use strict";
  var CUR = "NSE";
  // PRESS_ONLY drops the regulator wire and the corporate actions, leaving the
  // press headlines on their own. Same file, two tabs: NEWS is the merged wire,
  // PRESS is the reading list. Kept as a mode rather than a second panel file
  // because this panel already exists twice on disk (features/panels and the
  // static_data snapshot) and a third copy would be a third thing to drift.
  var PRESS_ONLY = false;
  try{
    var _q = new URLSearchParams(window.location.search);
    if(_q.get("ex")) CUR = _q.get("ex").toUpperCase();
    PRESS_ONLY = (_q.get("feeds") || "").toLowerCase() === "press";
  }catch(e){}
  // The security filter's controls, and the merged feed it filters.
  var qEl = document.getElementById("q"),
      suggEl = document.getElementById("sugg"),
      actEl = document.getElementById("active"),
      noteEl = document.getElementById("note");
  var NEWSROWS = [];   // every row the feeds produced, before the window cut
  var READY = false;   // a keystroke before the feeds land must not leave a
                       // stale empty state on screen
  // Each exchange draws on its official/collector feed plus the market-bot scan.
  // JSE had headlines in jse_news.json all along that this panel never loaded,
  // and EGX had no feed at all - the scan reaches it through three sources.
  // EGX now has its own headline file too (egx_news.json): the Egyptian business
  // desks (Enterprise, Daily News Egypt, Egypt Independent) became reachable, so
  // news_collect_egx.py builds it and the sweep keeps it current. Both EGX files
  // are loaded; they are deduped against each other by URL and headline.
  var EX_FILE = {
    "NSE": ["nse_news.json", "bot_news_NSE.json"],
    "NGX": ["ngx_news.json", "bot_news_NGX.json"],
    "JSE": ["jse_news.json", "bot_news_JSE.json"],
    "EGX": ["egx_news.json", "bot_news_EGX.json"]
  };
  var EX_NAME = { "NSE": "NSE", "NGX": "NGX", "JSE": "JSE", "EGX": "EGX" };
  var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // The REG panel's content folds into this one: the regulator wire, filtered
  // to the country of the exchange currently shown.
  var REG_ISO = { "NSE": "KE", "NGX": "NG", "JSE": "ZA", "EGX": "EG" };
  // Structured corporate actions (dividends / book closures) for exchanges
  // that publish them as their own feed.
  //
  // NGX was previously left out on the assumption that its dividends and
  // closures already rode ngx_news.json. They do not: that feed carries
  // dividends but no book closures at all, while ngx_corporate_actions.json
  // holds 397 corporate actions - 86 of them closure notices - plus directors'
  // dealings and board meetings. Only one of its 1000 rows duplicates a
  // headline already in the news feed, so folding it in adds coverage without
  // doubling anything up.
  //
  // JSE corporate actions arrive via the bot scan; EGX has no reachable
  // English feed.
  var CORP_FILE = { "NSE": "nse_corporate_actions.json",
                    "NGX": "ngx_corporate_actions.json" };

  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ---- SECURITY FILTER ---------------------------------------------------
  // One control narrows this panel to a single security's items. The rule is
  // deliberately literal, so it can be read rather than guessed at:
  //
  //   1. The query and every piece of row text are normalised to UPPERCASE
  //      with each run of non-alphanumerics collapsed to one space, and the
  //      HTML entities a feed leaves inside a label are decoded first, so
  //      "kcb-group", "KCB Group" and "KCB GROUP" compare equal and an EGX
  //      ticker written "MFSC.CA" compares as "MFSC CA".
  //   2. A company name is a SEQUENCE of words, not a bag of words. The name is
  //      reduced to its PHRASE: its leading words in order, stopped before the
  //      first legal suffix (Ltd, Plc, Co), the market's own country (Kenya,
  //      Nigeria) or Holdings/Holding. So "Standard Group Plc" reduces to
  //      STANDARD GROUP, "Equity Group Holdings Limited" to EQUITY GROUP and
  //      "Safaricom Plc" to SAFARICOM. Keeping the word Group inside the phrase
  //      is the fix: no name can collapse to one generic word, so a single
  //      industry word can never stand for a company. That is why the phrase
  //      STANDARD GROUP stops "Standard Chartered Bank Kenya" (a different
  //      security) matching the query SGL, and EQUITY GROUP stops the headline
  //      "Britam expands ... with global equity ... funds" matching Equity.
  //   3. The query resolves to a security from static_data/listing_<EX>.json
  //      in a fixed order. An EXACT ticker (ignoring a market suffix such as
  //      .CA or .JO) or an EXACT ISIN wins outright and resolves to that one
  //      security ALONE. Only when nothing matches exactly does the name rule
  //      run: a contiguous whole-word run inside the security's name or name
  //      PHRASE, or one of its evidenced former or alternate names (RENAMES
  //      below). The name rule is never partial: a partial word only offers a
  //      suggestion in the picker (so "safa" offers Safaricom for the reader to
  //      choose) and can never silently narrow the panel to a set. Row matching
  //      below never uses a partial word either.
  //   4. A row belongs to that security when the row's own ticker field equals
  //      the security ticker, the row's ISIN equals the security ISIN, or the
  //      row text carries the security TICKER as a whole word, the security's
  //      name PHRASE as a contiguous whole-word run, or one of its alternate
  //      name phrases as a contiguous whole-word run.
  //
  // WHOLE WORDS only, never substrings. That is the point of the rule: a
  // substring filter for "bat" matched those letters inside unrelated words and
  // rows. A query that resolves to no security shows the explicit empty state
  // and no rows; it never falls back to listing everything as though the filter
  // were off.
  // The feed writes most entities with their terminating semicolon, but a few
  // labels lose it ("I&amp M", the I&M Group rows), so the entity never decodes
  // and the label reads I AMP M instead of I M. Decode the semicolon form first,
  // then the same entities when the semicolon is missing, but only where the
  // entity is followed by a non-alphanumeric or the end, so a real word that
  // merely starts "amp..." is never cut.
  function unesc(s){
    return String(s == null ? "" : s)
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, "\"").replace(/&#39;/g, "'").replace(/&apos;/g, "'")
      .replace(/&amp(?![A-Za-z0-9])/g, "&").replace(/&lt(?![A-Za-z0-9])/g, "<")
      .replace(/&gt(?![A-Za-z0-9])/g, ">").replace(/&quot(?![A-Za-z0-9])/g, "\"")
      .replace(/&apos(?![A-Za-z0-9])/g, "'").replace(/&#39(?![0-9])/g, "'");
  }
  function norm(s){
    return unesc(s).toUpperCase().replace(/[^A-Z0-9]+/g, " ").replace(/^\s+|\s+$/g, "");
  }
  function toks(s){ var n = norm(s); return n ? n.split(" ") : []; }
  function baseTicker(s){ return String(s == null ? "" : s).toUpperCase().split(".")[0].trim(); }
  function isISIN(s){ return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(String(s == null ? "" : s).toUpperCase().trim()); }
  // Words that END a company's phrase: legal suffixes, the market's own country
  // and Holdings/Holding, which the feeds drop. GROUP does not end it, which is
  // what keeps a name from collapsing to one generic word.
  var LEGAL_STOP = {LTD:1,LIMITED:1,PLC:1,CO:1,COMPANY:1,CORPORATION:1,CORP:1,INC:1,
                    INCORPORATED:1,SA:1,AG:1,BV:1,NV:1,PL:1};
  var PLACE_STOP = {KENYA:1,NIGERIA:1,EGYPT:1,GHANA:1,TANZANIA:1,UGANDA:1,RWANDA:1,AFRICA:1,SOUTH:1};
  var HOLD_STOP = {HOLDINGS:1,HOLDING:1};
  function isStop(w){ return !!(LEGAL_STOP[w] || PLACE_STOP[w] || HOLD_STOP[w]); }
  // A query made only of these words names no company: they are legal, place or
  // structural words, so "group", "bank", "ltd" or "kenya" resolve to nothing
  // rather than to every issuer that carries the word.
  var QUERY_STOP = {LTD:1,LIMITED:1,PLC:1,CO:1,COMPANY:1,CORPORATION:1,CORP:1,INC:1,
                    INCORPORATED:1,SA:1,AG:1,BV:1,NV:1,PL:1,GROUP:1,HOLDINGS:1,HOLDING:1,
                    BANK:1,THE:1,OF:1,AND:1,
                    KENYA:1,NIGERIA:1,EGYPT:1,GHANA:1,TANZANIA:1,UGANDA:1,RWANDA:1,AFRICA:1,SOUTH:1};
  function namePhrase(name){
    var t = toks(name), out = [];
    for (var i = 0; i < t.length; i++){
      if (i > 0 && isStop(t[i])) break;
      out.push(t[i]);
      if (out.length >= 6) break;
    }
    return out;
  }
  // EVIDENCED alternate and former names for the issuers on this exchange. Each
  // is a rename or merger the issuer itself published, never a guess:
  //   ABSA : Barclays Bank of Kenya renamed Absa Bank Kenya PLC, 10 Feb 2020.
  //   HFCB : Housing Finance / HF Group renamed HFCB Group Plc, May 2026.
  //   NCBA : NIC Group merged with CBA and renamed NCBA Group Plc, Oct 2019.
  //   SBIC : CfC Stanbic Holdings renamed Stanbic Holdings Plc, Aug 2016.
  //   SLAM : Pan Africa Insurance Holdings renamed Sanlam Kenya Plc, 2016.
  //   EQTY : the listed entity was Equity Bank Limited before its Dec 2014
  //          conversion into Equity Group Holdings Limited.
  //   TCL  : the NSE spells it "Trans-Century Plc"; the feed writes
  //          "TransCentury".
  // An entry only ADDS search words to the current listing; the row still has to
  // carry the phrase, and an issuer with no listed successor is left alone.
  //
  // The second block below covers companies the feed files under a former or
  // shortened name that the phrase rule cannot reach. Each is a genuine variant
  // of exactly one STILL-LISTED issuer, evidenced by the feed's own label or by
  // the filing title, so the successor is the current listing and no row is
  // mislabelled. A delisted issuer with no successor is deliberately absent.
  //   IMH  : I&M Holdings Plc renamed I&M Group Plc; the feed labels the rows
  //          "I&amp M" (a malformed entity) and their titles read "I&M Holdings
  //          Plc". The "IM Holdings" form is the hyphenated slug.
  //   TOTL : Total Kenya Plc renamed TotalEnergies Marketing Kenya Plc (2022).
  //   LKL  : Longhorn Kenya Limited renamed Longhorn Publishers Plc; one batch
  //          is misspelled "Lonhorn".
  //   SCAN : WPP Scangroup Plc;  KPLC : Kenya Power & Lighting Company Plc.
  //   EVRD : Eveready East Africa Limited;  KNRE : Kenya Re-Insurance.
  //   CTUM : Centum Investment Company Plc;  CARB : Carbacid Investments Ltd.
  //   HFCB : Housing Finance Company of Kenya (HFCK);  BAMB : Bamburi Cement.
  //   SMER : Sameer Africa Plc (the feed files the one-word "SameerAfrica").
  var RENAMES = {
    ABSA: ["Barclays", "Barclays Bank of Kenya"],
    HFCB: ["Housing Finance", "Housing Finance Company of Kenya", "HF Group", "HFC", "HFCK"],
    NCBA: ["NIC", "NIC Bank", "NIC Group"],
    SBIC: ["CfC Stanbic", "CfC Stanbic Holdings"],
    SLAM: ["Pan Africa Insurance", "Pan Africa Insurance Holdings"],
    EQTY: ["Equity Bank", "Equity Bank Limited", "Equity Bank Group"],
    TCL:  ["TransCentury"],
    IMH:  ["I&M", "I&M Holdings", "I&M Group", "IM Holdings"],
    TOTL: ["Total Kenya", "TotalEnergies Marketing"],
    LKL:  ["Longhorn", "Lonhorn Kenya"],
    SCAN: ["Scangroup"],
    KPLC: ["Kenya Power"],
    EVRD: ["Eveready East Africa", "Eveready EA", "Eveready"],
    KNRE: ["Kenya Reinsurance", "Kenya Re"],
    CTUM: ["Centum"],
    CARB: ["Carbacid Investment", "Carbacid"],
    BAMB: ["Bamburi"],
    SMER: ["SameerAfrica"],
    // The feed writes "Car & General" and "Laptrust Imara I-REIT": the
    // ampersand normalises away and the REIT's "INCOME" is absent, so these two
    // listed issuers' rows were unreachable by their own ticker. Same rule as
    // above: an entry only ADDS search words, and the row still has to carry
    // the phrase.
    CGEN: ["Car General"],
    LAPR: ["Laptrust Imara I"]
  };
  function addAlt(s, words){
    if (!s || !words || !words.length) return;
    for (var i = 0; i < s.alt.length; i++)
      if (s.alt[i].join(" ") === words.join(" ")) return;
    s.alt.push(words);
  }
  var SEC = [];   // the securities static_data/listing_<EX>.json knows about
  var SECLOADED = false;   // false until the directory answers (or fails), so a
                           // query is never resolved against a half-built list
  function loadSecurities(){
    fetch("../../static_data/listing_" + CUR + ".json")
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        SEC = ((d && d.stocks) || []).map(function(r){
          var tk = baseTicker(r.ticker || r.code || r.sym);
          var isin = isISIN(r.code) ? String(r.code).toUpperCase()
                   : (isISIN(r.sym) ? String(r.sym).toUpperCase() : "");
          var s = { tk: tk, name: String(r.name || ""), phrase: namePhrase(r.name), isin: isin, alt: [] };
          (RENAMES[tk] || []).forEach(function(x){ addAlt(s, toks(x)); });
          return s;
        }).filter(function(s){ return s.tk; });
        // A query typed before the directory arrived re-resolves against it now,
        // whether or not the box holds text: the panel must never keep a count,
        // or an empty state, computed against a half-loaded directory.
        SECLOADED = true;
        onQuery();
      })
      // A missing directory does not break the filter: resolveSec below still
      // accepts a ticker the feeds carry themselves, and no other query matches.
      // SECLOADED is still set so the panel stops waiting and answers honestly.
      .catch(function(){ SEC = []; SECLOADED = true; onQuery(); });
  }
  function rowTickers(r){
    var out = [];
    [].concat(r.tickers || [], r.ticker || [], r.symbol || []).forEach(function(t){
      if (t) out.push(baseTicker(t));
    });
    return out;
  }
  function rowText(r){
    return [r.title, r.company, r.name, r.text, r.headline].filter(function(x){ return x; }).join(" ");
  }
  // true when words appears as a contiguous run of whole words inside s. With
  // partialLast, the final word only has to BEGIN the row's word, which is what
  // lets "safa" reach Safaricom in the suggestion list while "BAT" still never
  // reaches a row that merely contains those letters inside another word.
  function hasRun(s, words, partialLast){
    if (!words || !words.length) return false;
    var t = (typeof s === "string") ? norm(s).split(" ") : s;
    if (!t.length || t[0] === "") return false;
    for (var j = 0; j + words.length <= t.length; j++){
      var ok = true;
      for (var k = 0; k < words.length; k++){
        if (partialLast && k === words.length - 1){
          if (t[j + k].indexOf(words[k]) !== 0){ ok = false; break; }
        } else if (t[j + k] !== words[k]){ ok = false; break; }
      }
      if (ok) return true;
    }
    return false;
  }
  // The resolution order is deliberate, and the order IS the fix:
  //   1. an EXACT ticker or ISIN resolves to that one security and STOPS. It is
  //      never widened by the name rule, because a ticker is also a prefix of a
  //      longer name: the exact ticker BRIT (Britam) is the first four letters
  //      of BRITISH AMERICAN TOBACCO, so a name rule allowed to run alongside
  //      the ticker dragged BAT's rows into BRIT's. An exact code cannot be
  //      ambiguous, so nothing else may join it.
  //   2. only if nothing matched exactly, a whole-word company name or an
  //      evidenced former/alternate name may resolve. The LAST word is NOT
  //      allowed to be partial here, so a partial word can never silently
  //      narrow the panel to a set; a partial word only ever offers a
  //      suggestion (suggHits below), which the reader picks.
  //   3. the directory may not list a security the feeds still file under; an
  //      EXACT ticker the rows carry themselves is still that security.
  function resolveSec(qraw){
    var raw = String(qraw == null ? "" : qraw).trim();
    if (!raw) return null;
    var base = baseTicker(raw);
    var isinU = raw.toUpperCase().replace(/\s/g, "");
    var qt = toks(raw), out = [];
    // A query made only of legal, place or structural words names no security,
    // so it never resolves through a name or an alias.
    var qAllStop = qt.length > 0 && qt.every(function(w){ return QUERY_STOP[w]; });
    function push(s){
      for (var i = 0; i < out.length; i++) if (out[i].tk === s.tk) return;
      out.push(s);
    }
    // 1. EXACT ticker, then EXACT ISIN: one security, alone, and stop.
    var hitTk = null, hitIsin = null;
    SEC.forEach(function(s){
      if (!hitTk && s.tk === base) hitTk = s;
      if (!hitIsin && s.isin && s.isin === isinU) hitIsin = s;
    });
    if (hitTk) return [hitTk];
    if (hitIsin) return [hitIsin];
    // 2. a whole-word name, phrase or evidenced alternate name (no partial)
    var qlen = norm(raw).replace(/ /g, "").length;
    if (!qAllStop && qlen >= 2){
      SEC.forEach(function(s){
        if (hasRun(s.phrase, qt) || hasRun(s.name, qt)) { push(s); return; }
        for (var i = 0; i < s.alt.length; i++)
          if (hasRun(s.alt[i], qt)) { push(s); return; }                   // former/alternate name
      });
    }
    if (out.length) return out;
    // 3. an EXACT ticker the rows carry themselves (a renamed or delisted issuer)
    NEWSROWS.forEach(function(r){
      rowTickers(r).forEach(function(t){
        if (t === base)
          push({ tk: t, name: r.company || r.publisher || "", phrase: namePhrase(r.company || r.name || ""), isin: "", alt: [] });
      });
    });
    return out.length ? out : null;
  }
  function rowMatch(r, secs){
    var tk = rowTickers(r), isin = String(r.isin || "").toUpperCase(), text = rowText(r);
    for (var i = 0; i < secs.length; i++){
      var s = secs[i];
      for (var j = 0; j < tk.length; j++) if (tk[j] === s.tk) return true;
      if (s.isin && isin && isin === s.isin) return true;
      if (hasRun(text, [s.tk])) return true;    // the ticker used as the short label
      if (hasRun(text, s.phrase)) return true;  // the company's name phrase
      for (var k = 0; k < s.alt.length; k++)    // a former or alternate name
        if (hasRun(text, s.alt[k])) return true;
    }
    return false;
  }
  var SUGSEL = -1;
  function suggHits(qraw){
    var raw = String(qraw || "").trim().toUpperCase();
    var q = norm(raw);
    if (!q) return [];
    var qt = q.split(" "), base = baseTicker(raw), hits = [];
    var qAllStop = qt.length > 0 && qt.every(function(w){ return QUERY_STOP[w]; });
    var qlen = q.replace(/ /g, "").length;   // a one-letter query suggests nothing
    SEC.forEach(function(s){
      var sc = -1;
      if (s.tk === base) sc = 0;
      else if (s.isin && s.isin === raw.replace(/\s/g, "")) sc = 1;
      else if (s.tk.indexOf(base) === 0) sc = 2;
      else if (qlen >= 2 && !qAllStop && hasRun(s.phrase, qt, true)) sc = 3;
      if (sc < 0 && qlen >= 2 && !qAllStop && hasRun(s.name, qt, true)) sc = 4;
      if (sc < 0 && !qAllStop)
        for (var i = 0; i < s.alt.length; i++)
          if (hasRun(s.alt[i], qt, true)){ sc = 4; break; }
      if (sc < 0 && base.length >= 3 && s.tk.indexOf(base) >= 0) sc = 5;
      if (sc >= 0) hits.push({ s: s, sc: sc });
    });
    hits.sort(function(a, b){ return a.sc - b.sc || (a.s.tk < b.s.tk ? -1 : 1); });
    return hits.slice(0, 8);
  }
  function hideSugg(){ suggEl.className = "sugg"; suggEl.innerHTML = ""; SUGSEL = -1; }
  function drawSugg(qraw){
    var hits = suggHits(qraw);
    if (!hits.length){ hideSugg(); return; }
    if (SUGSEL >= hits.length) SUGSEL = -1;
    suggEl.innerHTML = hits.map(function(h, i){
      return '<div data-tk="' + h.s.tk + '"' + (i === SUGSEL ? ' class="sel"' : '') + '>' +
             '<b>' + esc(h.s.tk) + '</b><span>' + esc(h.s.name) + '</span></div>';
    }).join("");
    suggEl.className = "sugg on";
    var rows = suggEl.querySelectorAll("div");
    for (var i = 0; i < rows.length; i++){
      rows[i].addEventListener("mousedown", function(e){
        e.preventDefault();
        qEl.value = this.getAttribute("data-tk");
        hideSugg(); onQuery();
      });
    }
  }
  function pickSugg(delta){
    var hits = suggHits(qEl.value);
    if (!hits.length) return;
    SUGSEL = (SUGSEL + delta + hits.length) % hits.length;
    drawSugg(qEl.value);
  }
  // The chip names the security the panel is narrowed to, and CLEAR lifts it.
  // It also tells the coming-to-market block to stand down while a security is
  // selected, so nothing on the panel sits outside the filter.
  function chip(qraw, secs){
    document.body.classList[qraw ? "add" : "remove"]("has-q");
    if (!qraw){ actEl.style.display = "none"; actEl.innerHTML = ""; return; }
    actEl.style.display = "flex";
    // A query that named no security still gets a chip, so the state is visible
    // and can be cleared rather than leaving the reader with a dead box.
    var head = secs ? secs.slice(0, 4).map(function(s){
      return '<span class="pill">' + esc(s.tk) + '</span>' +
             (s.name ? '<span class="an">' + esc(s.name) + '</span>' : "");
    }).join('<span class="an">+</span>')
      : '<span class="pill no">NO MATCH</span><span class="an">' + esc(qraw) + '</span>';
    actEl.innerHTML = head + '<button class="clr" id="clrQ">CLEAR</button>';
    document.getElementById("clrQ").addEventListener("click", clearQ);
  }
  function clearQ(){ qEl.value = ""; hideSugg(); onQuery(); }
  function emptyState(qraw, secs){
    return '<div class="empty">Nothing for ' + esc(qraw) + ' in this window.' +
      (secs ? '<br><br>No ' + esc(secs.map(function(s){ return s.tk; }).join(" + ")) +
              ' item is inside the current news window.'
            : '<br><br>No listed security in this market matched this query. ' +
              'The news feed may file this company under another or a former name, ' +
              'so nothing is shown rather than another company&#39;s items.') +
      '</div>';
  }

  // The feeds date their items differently: the bot emits an epoch ts, the NGX
  // disclosures use "2026-08-28", and the older collectors use "Sep 3". Reduce
  // them all to one number so a merged list can be ordered honestly; anything
  // unparseable sorts last rather than pretending to be recent.
  function stamp(n){
    if(n && typeof n.ts === "number" && n.ts > 0) return n.ts;
    var d = String((n && n.date) || "").trim();
    var iso = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return Date.UTC(+iso[1], +iso[2]-1, +iso[3]) / 1000;
    var md = d.match(/^([A-Z][a-z]{2})\s+(\d{1,2})$/);
    if(md && MONTHS[md[1]] != null){
      var now = new Date(), y = now.getUTCFullYear();
      var t = Date.UTC(y, MONTHS[md[1]], +md[2]) / 1000;
      // A date more than a week ahead is last year's, not the future.
      if(t > now.getTime()/1000 + 7*86400) t = Date.UTC(y-1, MONTHS[md[1]], +md[2]) / 1000;
      return t;
    }
    return 0;
  }

  function key(n){
    var u = String((n && n.url) || "").split("?")[0];
    if(u) return "u:" + u;
    return "t:" + String((n && n.title) || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").slice(0, 90);
  }

  document.getElementById("exTitle").textContent = EX_NAME[CUR] || CUR;
  // the header must describe what is actually in the list below it
  if(PRESS_ONLY){
    document.getElementById("panelCode").textContent = "PRESS";
    document.getElementById("panelKind").textContent = "PRESS";
    document.getElementById("panelFeeds").textContent = "· HEADLINES";
    document.getElementById("src").textContent = "Headlines only";
    document.title = "MUTXRI TERMINAL - PRESS";
  }
  var files = EX_FILE[CUR];
  var el = document.getElementById("items");
  if(!files || !files.length){
    el.innerHTML = '<div class="empty">no news feed for ' + esc(CUR) + '</div>';
    return;
  }

  function load(name){
    return fetch("../../static_data/" + name)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .catch(function(){ return []; });
  }

  // Regulator-wire rows (reg.json) -> news rows, kept to this exchange's
  // country. The headline tail is the regulator's own masthead ("... -
  // Securities and Exchange Commission, Nigeria"), redundant with the
  // publisher line, so it is dropped. The wire also carries regulator
  // notices up to a decade old (the backend query has no date window), and a
  // news panel is not an archive: only items inside the recency window stay.
  var REG_DAYS = 180;
  function regRows(list){
    var iso = REG_ISO[CUR]; if(!iso) return [];
    var cutoff = Date.now() / 1000 - REG_DAYS * 86400;
    return ((list && list.items) || []).filter(function(i){
      if(!i || i.iso !== iso || !i.headline) return false;
      return stamp({ date: String(i.date || "").slice(0, 10) }) >= cutoff;
    })
      .map(function(i){
        var h = String(i.headline).replace(/\s+-\s+[^-\n]*$/, "").trim();
        return { title: h,
          publisher: String(i.regulator || "") + " \u00b7 " + String(i.outlet || ""),
          date: String(i.date || "").slice(0, 10),
          url: i.link || "", tickers: [], _reg: true };
      });
  }

  // Corporate-action rows: {"date":"Sep 04 2026","ticker":"SCOM",
  // "name":"Safaricom Plc","text":"Payment of KES 1.15 final dividend",
  // "kind":"DIVIDEND PAYMENT"} -> a headline with a ticker chip. These are
  // exchange announcements with no article URL, so they render unlinked.
  function corpRows(list){
    var out = [];
    (list || []).forEach(function(r){
      if(!r || !r.name || !r.text) return;
      // The two exchanges date these differently - NSE writes "Sep 04 2026",
      // NGX writes "2026-08-28". Parse both, or the ISO rows get no timestamp,
      // sort to the bottom of a date-ordered list and print a date shaped
      // unlike every other row.
      var raw = String(r.date || "").trim();
      var ts = 0, disp = raw;
      var m = raw.match(/^([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})$/);
      var iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m && MONTHS[m[1]] != null){
        ts = Date.UTC(+m[3], MONTHS[m[1]], +m[2]) / 1000;
        disp = m[1] + " " + (+m[2]);
      }else if(iso){
        ts = Date.UTC(+iso[1], +iso[2] - 1, +iso[3]) / 1000;
        // same "Sep 4" shape the NSE rows use, so one list reads as one list
        disp = MONTH_NAMES[+iso[2] - 1] + " " + (+iso[3]);
      }
      out.push({ title: r.name + ": " + r.text,
        publisher: String(r.kind || "Corporate Action").toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }),
        date: disp, url: r.url || "", ts: ts, _corp: true,
        tickers: r.ticker ? [r.ticker] : [] });
    });
    out.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });

    // Dividends and book closures are the two announcements people open this
    // panel for, and a plain newest-25 buries them: NGX files enough board
    // meetings and directors' dealings in any given week to fill the slice, so
    // the dividend notices - days older - never appeared at all. Give those two
    // categories their own share of the slice and let everything else fill the
    // rest, all still newest-first.
    // Take the dividend and closure notices first, then fill the remainder of
    // the slice with everything else, newest-first. Capping the priority bucket
    // instead would cut NSE in half - every one of its corporate actions is a
    // dividend or a closure - so the rule is "these go in first", never "these
    // get at most N".
    var PRIORITY = /dividend|book clos|closure of register|closed period/i;
    var CORP_CAP = 25;
    var keyed = [], other = [];
    out.forEach(function(n){ (PRIORITY.test(n.title) ? keyed : other).push(n); });
    var pick = keyed.slice(0, CORP_CAP);
    return pick.concat(other.slice(0, CORP_CAP - pick.length));
  }

  function shortDate(ts){
    try{
      var d = new Date(ts * 1000);
      return d.toUTCString().slice(5, 16).replace(/^0/, "");
    }catch(e){ return ""; }
  }

  var jobs = (files || []).map(function(nm){
    return load(nm).then(function(d){ return { kind: "plain", rows: d }; });
  });
  if(!PRESS_ONLY && REG_ISO[CUR])
    jobs.push(load("reg.json").then(function(d){ return { kind: "reg", rows: d }; }));
  if(!PRESS_ONLY && CORP_FILE[CUR])
    jobs.push(load(CORP_FILE[CUR]).then(function(d){ return { kind: "corp", rows: d }; }));

  Promise.all(jobs).then(function(srcs){
    var seen = {}, all = [];
    srcs.forEach(function(s){
      var rows = s.kind === "plain" ? (s.rows || [])
               : (s.kind === "reg" ? regRows(s.rows) : corpRows(s.rows));
      rows.forEach(function(n){
        if(!n || !n.title) return;
        var k = key(n);
        if(seen[k]) return;
        seen[k] = 1;
        n._t = stamp(n);
        if(!n.date && n._t) n.date = shortDate(n._t);
        all.push(n);
      });
    });
    if(!all.length){ el.innerHTML = '<div class="empty">no news</div>'; return; }
    all.sort(function(a, b){ return b._t - a._t; });
    NEWSROWS = all;
    READY = true;
    renderNews();
  });

  function CFG_hasReg(){ return !PRESS_ONLY && !!REG_ISO[CUR]; }

  // Corporate actions must not lose a date race. NGX files ~300 press items a
  // month, so on a straight date sort the dividend and book-closure notices -
  // which are days older - fall past the 120-row cut and vanish, which is
  // exactly what they did before this. They are already capped at 25 by
  // corpRows, so reserve them their places and fill the rest by date.
  //
  // The regulator wire (reg.json) loses the same race for the same reason:
  // on a busy board its few rows - dated weeks earlier than the press - drop
  // below the cut, so the header said REGULATORY while showing none. Reserve
  // a small slice for it too, so the panel shows what its header claims.
  function windowRows(all){
    var CAP = 120, REG_CAP = 6;
    var corp = all.filter(function(n){ return n._corp; });
    var reg  = all.filter(function(n){ return n._reg; }).slice(0, REG_CAP);
    var rest = all.filter(function(n){ return !n._corp && !n._reg; });
    var out = corp.concat(reg).concat(rest.slice(0, Math.max(0, CAP - corp.length - reg.length)));
    out.sort(function(a, b){ return b._t - a._t; });
    return out;
  }

  // One render path for both states: no query is the window this panel has
  // always shown, a query is the security's items alone or an explicit empty
  // state. Nothing here ever falls back to the full list.
  function renderNews(){
    if(!READY){ el.innerHTML = '<div class="empty">loading…</div>'; return; }
    var qraw = qEl.value.trim();
    // A filter must not answer from half its inputs: while the listing
    // directory is still in flight a query cannot be resolved, and the panel
    // waits (the directory's arrival re-renders) instead of showing a count or
    // an empty state that a later file could contradict.
    if (qraw && !SECLOADED) return;
    var secs = qraw ? resolveSec(qraw) : null;
    chip(qraw, secs);
    var shown;
    if(!qraw){
      noteEl.textContent = "";
      shown = windowRows(NEWSROWS);
    } else if(!secs){
      // A query that names no listed security is not a filter anyone can
      // honour: nothing is shown, and the empty state names the query.
      noteEl.textContent = "";
      el.innerHTML = emptyState(qraw, null);
      return;
    } else {
      // A security is selected. Every source is filtered: the general headlines
      // and the corporate-action rows by the security they name. The regulator
      // wire (reg.json) is a market-wide notice board whose items carry no
      // issuer at all (REG_ISO only narrows them to a country), so no item of it
      // can belong to one security; it is hidden rather than shown under that
      // security's name, and the note says so.
      noteEl.textContent = CFG_hasReg()
        ? "Regulatory-wire notices are market-wide and carry no issuer, so they are not shown in a single-security view."
        : "";
      shown = NEWSROWS.filter(function(n){ return !n._reg && rowMatch(n, secs); });
    }
    if(!shown.length){ el.innerHTML = emptyState(qraw, secs); return; }
    el.innerHTML = shown.map(function(n){
      var ticks = (n.tickers || []).slice(0, 3).map(function(t){
        return '<span class="tick">' + esc(t) + '</span>'; }).join(" ");
      var head = n.url
        ? '<a href="' + esc(n.url) + '" target="_blank" rel="nofollow noopener">' + esc(n.title) + '</a>'
        : '<span class="nl">' + esc(n.title) + '</span>';
      return '<div class="item">' + head +
        '<div class="meta"><span class="pub">' + esc(n.publisher || "") + '</span>' +
          '<span>' + esc(n.date || "") + '</span>' + ticks + '</div>' +
        '</div>';
    }).join("");
  }

  qEl.addEventListener("input", onQuery);
  qEl.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){ e.preventDefault(); pickSugg(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); pickSugg(-1); }
    else if(e.key === "Escape"){ hideSugg(); }
    else if(e.key === "Enter"){
      var hits = suggHits(qEl.value);
      if(hits.length && SUGSEL >= 0){ e.preventDefault(); qEl.value = hits[SUGSEL].s.tk; hideSugg(); onQuery(); }
    }
  });
  qEl.addEventListener("blur", function(){ setTimeout(hideSugg, 120); });
  function onQuery(){ SUGSEL = -1; renderNews(); drawSugg(qEl.value); }
  loadSecurities();
})();
</script>
<script>
/* UPCOMING LISTINGS: companies approaching the market that have NOT traded.
   A reader must see these without selecting anything from a board, because a
   company with no price sits on no board. Data: static_data/upcoming_listings.json.
   The block carries no traded price: a null renders as an honest hyphen or the
   row is omitted, never a zero, and an offer price is labelled OFFER PRICE. */
(function(){
  "use strict";
  try{
    var _q = new URLSearchParams(window.location.search);
    if((_q.get("feeds") || "").toLowerCase() === "press") return; // PRESS tab is headlines only
  }catch(e){}
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function chipCls(st){
    st = String(st || "").toUpperCase();
    if(st.indexOf("LISTING CONFIRMED") >= 0) return "ok";
    if(st.indexOf("LISTING SOON") >= 0) return "soon";
    return "pend";
  }
  fetch("../../static_data/upcoming_listings.json")
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var rows = (d && d.listings) || [];
      var host = document.getElementById("upcoming");
      if(!host || !rows.length) return;
      var h = '<div class="up-h"><span class="up-code">UPCOMING</span>' +
              '<span class="up-t">COMING TO MARKET <b>· NOT YET TRADING</b></span></div>';
      rows.forEach(function(c){
        var facts = "";
        function f(label, val, cls){
          facts += '<div class="up-f"><div class="up-k">' + esc(label) + '</div>' +
                   '<div class="up-v' + (cls ? ' ' + cls : '') + '">' + val + '</div></div>';
        }
        var exTxt = c.exchange_name || c.exchange || "";
        if(c.segment) exTxt += (exTxt ? ' · ' : '') + c.segment;
        if(exTxt) f("EXCHANGE", esc(exTxt));
        // The date may be fixed or only a window. Show whichever exists, and a
        // hyphen only when neither does, never a guessed date.
        var when = c.expected_date ? esc(c.expected_date)
                 : (c.expected_window ? esc(c.expected_window) : "-");
        f("EXPECTED DATE", when);
        if(c.offer_price != null)
          f("OFFER PRICE",
            esc((typeof c.offer_price === "number" ? c.offer_price.toFixed(2) : c.offer_price) + (c.offer_price_currency ? " " + c.offer_price_currency : "")) +
            ' <span class="up-note">offer price, not a traded price</span>', "price");
        if(c.shares_offered != null) f("SHARES OFFERED", esc(num(c.shares_offered)));
        if(c.shares_in_issue != null) f("SHARES IN ISSUE", esc(num(c.shares_in_issue)));
        if(c.sector) f("SECTOR", esc(c.sector));
        var src = "";
        if(c.sources && c.sources.length){
          src = '<div class="up-src">' + c.sources.map(function(s){
            var l = s && (s.label || s);
            return (s && s.url)
              ? '<a href="' + esc(s.url) + '" target="_blank" rel="nofollow noopener">' + esc(l) + '</a>'
              : esc(l);
          }).join(" · ") + '</div>';
        }
        h += '<div class="up-card">' +
             '<div class="up-top"><span class="up-name">' + esc(c.name || "") + '</span>' +
             (c.status ? '<span class="up-chip ' + chipCls(c.status) + '">' + esc(c.status) + '</span>' : '') +
             '</div>' +
             (c.trading_name ? '<div class="up-aka">trading as ' + esc(c.trading_name) + '</div>' : '') +
             '<div class="up-grid">' + facts + '</div>' +
             (c.note ? '<div class="up-text">' + esc(c.note) + '</div>' : '') +
             src + '</div>';
      });
      h += '<div class="up-sep"></div>';
      host.innerHTML = h;
    })
    .catch(function(){ /* no upcoming file: render nothing, do not break NEWS */ });
})();
</script>
</body>
