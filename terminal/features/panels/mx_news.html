<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - NEWS panel. NSE news headlines. Vanilla JS, Godel palette.

  Two layers: the published snapshot files in static_data (rebuilt every few
  hours) and, on top, the live wire from the backend (/api/news/live, polled
  every minute). Each story carries an IMPACT read - which market, sector or
  paper-book holding it reaches and which way - computed in this page by
  tagStory(). MY BOOK narrows the panel to the stories that touch the reader's
  holdings (localStorage mx_paper_v1, read only).
-->
<html lang="en">
<head><script>(function(){var V='20261128065920';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script><script>(function(){var V='20261128065920';try{fetch('/build.json?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(!d||!d.build||d.build===V)return;try{if(sessionStorage.getItem('mxv')===d.build)return;sessionStorage.setItem('mxv',d.build);}catch(e){return;}var q=location.search?location.search+'&':'?';location.replace(location.pathname+q+'v='+d.build+location.hash);})['catch'](function(){});}catch(e){}})();</script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - NEWS</title>
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#121212;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--acc:#33e29a;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--ui);font-size:13px;padding:0}
  .wrap{max-width:none;margin:0;border:0;background:transparent;border-radius:0;padding:14px}
  .head{display:flex;align-items:center;gap:10px;padding:8px 4px 12px;border-bottom:1px solid var(--line2)}
  .code{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;border:1px solid var(--line2);padding:2px 6px;border-radius:2px}
  .title{font-family:var(--mono);font-size:12px;color:var(--tx2);letter-spacing:.06em}
  .title b{color:var(--acc)}
  .spacer{flex:1}
  .src{font-family:var(--mono);font-size:9px;color:var(--tx3)}
  /* THE WIRE IS A TABLE. It was a stack of cards: a bordered box per story with
     its source, date and tickers wrapped underneath in a row that started at a
     different place on every line. Six stories filled the panel and nothing
     could be scanned down a column. A reader working a news wire reads down,
     not across - every story at this hour, everything from this source,
     everything on this ticker - so the fields line up under their headings and
     thirty rows fit where six did. */
  .nwrap{margin-top:10px}
  table.nt{width:100%;border-collapse:collapse;font-size:12px}
  .nt thead th{position:sticky;top:0;z-index:2;background:var(--bg);
    font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.12em;
    color:var(--tx3);text-align:left;padding:7px 12px 7px 0;
    border-bottom:1px solid var(--line2);white-space:nowrap}
  .nt tbody td{padding:5px 12px 5px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
  .nt tbody tr:hover td{background:var(--bg3)}
  /* The headline takes whatever the fixed columns leave. width:1% on a cell
     whose content cannot wrap is the standard way to say "only as wide as it
     needs", so the four meta columns shrink to their text and the headline
     keeps the rest instead of all five sharing the width equally. */
  .nt .c-date,.nt .c-time,.nt .c-tick,.nt .c-src{
    font-family:var(--mono);font-size:10px;color:var(--tx3);white-space:nowrap;width:1%}
  .nt .c-time{color:var(--tx2)}
  .nt .c-tick{color:var(--acc2)}
  .nt .c-src{color:var(--acc);max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .nt a{color:var(--tx);text-decoration:none;line-height:1.45}
  .nt a:hover{color:var(--acc)}
  .nt .nl{color:var(--tx2)}
  .pub{color:var(--acc)}
  .tick{color:var(--acc2);border:1px solid var(--line2);border-radius:2px;padding:1px 5px}
  .empty{padding:30px 14px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:11px}

  /* SECURITY FILTER: the search box, its suggestion list, the chip that names
     the security the panel is narrowed to, and the note that explains what a
     single-security view leaves out. */
  .bar{display:flex;gap:8px;padding:12px 0 8px;align-items:center}
  .sbox{position:relative;flex:1}
  .search{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;
    color:var(--tx);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none}
  .search:focus{border-color:var(--acc)}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:9;background:var(--bg3);
    border:1px solid var(--line2);border-radius:3px;max-height:224px;overflow:auto;display:none}
  .sugg.on{display:block}
  .sugg div{font-family:var(--mono);font-size:11px;color:var(--tx2);padding:6px 9px;cursor:pointer;
    display:flex;gap:8px;align-items:baseline}
  .sugg div:hover,.sugg div.sel{background:var(--bg4);color:var(--acc)}
  .sugg b{color:var(--acc);min-width:56px;display:inline-block}
  .sugg span{color:var(--tx3);font-size:10px}
  .active{display:flex;align-items:center;gap:8px;padding:0 0 8px}
  .active .pill{font-family:var(--mono);font-size:10px;color:#000;background:var(--acc);
    border-radius:2px;padding:2px 7px;letter-spacing:.06em}
  .active .pill.no{background:transparent;color:var(--tx3);border:1px solid var(--line2)}
  .active .an{font-family:var(--mono);font-size:10px;color:var(--tx2)}
  .active .clr{margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:2px;
    color:var(--tx2);font-family:var(--mono);font-size:9px;padding:2px 8px;cursor:pointer}
  .active .clr:hover{border-color:var(--acc);color:var(--acc)}
  .note{font-family:var(--mono);font-size:9px;color:var(--tx3);padding:0 4px 8px;line-height:1.5}
  /* a single-security view is about listed securities, so the coming-to-market
     block (companies that have not traded and belong to no security) steps out
     of the way rather than sitting above an unrelated filter result */
  /* the search sits on the title line, after the panel name and before the
     source note, so the head reads  PANEL  [search]  source  the way a desk does it */
  /* the search must stay usable at any window width: it gets a floor instead of
     collapsing to a sliver, the title yields with an ellipsis, and the source note
     steps aside on narrow windows rather than squeezing the box out */
  .head .sbox.inhead{flex:1 1 180px;min-width:120px}
  .head .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:600px){ .head .src{display:none} }
  .head .sbox.inhead .search{width:100%;box-sizing:border-box;font-size:10.5px;padding:3px 7px}
  .head .sbox.inhead .sugg{left:0;right:0;top:calc(100% + 2px)}

  /* LIVE WIRE + IMPACT READ. The status light says whether the rows below
     include the live wire or only the published snapshot; the IMPACT column is
     the rules-based read of which market, sector or holding a story reaches,
     and which way the exposure map says it usually cuts. */
  :root{--dn:#f87171}
  .live{font-family:var(--mono);font-size:9px;color:var(--tx3);display:inline-flex;align-items:center;
    gap:5px;white-space:nowrap;letter-spacing:.08em;cursor:default}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--tx3);display:inline-block}
  .live.on{color:var(--acc)}
  .live.on i{background:var(--acc);animation:mxpulse 2s ease-in-out infinite}
  .live.wait i{background:#d6b44a}
  @keyframes mxpulse{0%,100%{opacity:1}50%{opacity:.25}}
  .bk{background:transparent;border:1px solid var(--line2);border-radius:2px;color:var(--tx2);
    font-family:var(--mono);font-size:9px;padding:3px 8px;cursor:pointer;white-space:nowrap;letter-spacing:.06em}
  .bk:hover{border-color:var(--acc);color:var(--acc)}
  .bk.on{background:var(--acc);color:#000;border-color:var(--acc)}
  .bk:disabled{opacity:.4;cursor:default;border-color:var(--line2);color:var(--tx3)}
  .sum{font-family:var(--mono);font-size:10px;color:var(--tx2);padding:10px 0 0;display:flex;
    gap:6px 16px;flex-wrap:wrap;align-items:baseline;line-height:1.5}
  .sum b{color:var(--tx);font-weight:400}
  .sum .u{color:var(--up)} .sum .d{color:var(--dn)}
  .sum .hint{color:var(--tx3)}
  .nt .c-imp{white-space:nowrap;width:1%;font-family:var(--mono);font-size:10px}
  .im{display:inline-block;border:1px solid var(--line2);border-radius:2px;padding:0 5px;margin-right:3px;
    cursor:pointer;color:var(--tx2);line-height:16px}
  .im.up{color:var(--up);border-color:rgba(51,226,154,.35)}
  .im.dn{color:var(--dn);border-color:rgba(248,113,113,.4)}
  .im.mine{background:rgba(255,255,255,.04)}
  .im.mine:before{content:"\25C9 ";font-size:8px;vertical-align:1px}
  .nt tr.new td{animation:mxflash 7s ease-out}
  @keyframes mxflash{0%{background:rgba(51,226,154,.16)}100%{background:transparent}}
  .nt tr.det td{background:var(--bg2);color:var(--tx2);font-size:11px;line-height:1.6;padding:8px 12px 10px;
    white-space:normal;border-bottom:1px solid var(--line2)}
  .det .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tx3);margin-right:6px}
  .det .ln{margin:2px 0}
  .det .u{color:var(--up)} .det .d{color:var(--dn)}
  .det .fine{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-top:6px}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <span class="code" id="panelCode">NEWS</span>
    <span class="title"><span id="exTitle">NSE</span> <span id="panelKind">NEWS</span> <b id="panelFeeds">· HEADLINES · REGULATORY · ACTIONS</b></span>
    <div class="sbox inhead">
      <input class="search" id="q" autocomplete="off" spellcheck="false"
        placeholder="ticker, ISIN or company  (e.g. SCOM, Safaricom)" />
      <div class="sugg" id="sugg"></div>
    </div>
    <button class="bk" id="bookBtn" title="Show only the stories that touch the holdings in your paper book">MY BOOK</button>
    <span class="live" id="live" title="Connecting to the live wire"><i></i><span id="liveTx">SNAPSHOT</span></span>
    <span class="spacer"></span>
    <span class="src" id="src">Headlines · Reg · Actions</span>
  </div>
  <div class="active" id="active" style="display:none"></div>
  <div class="sum" id="sum" style="display:none"></div>
  <div id="items"><div class="empty">loading…</div></div>
</div>
<script src="_fresh.js"></script>
<script>
(function(){
  "use strict";
  var CUR = "NSE";
  // PRESS_ONLY drops the regulator wire and the corporate actions, leaving the
  // press headlines on their own. Same file, two tabs: NEWS is the merged wire,
  // PRESS is the reading list. Kept as a mode rather than a second panel file
  // because this panel already exists twice on disk (features/panels and the
  // static_data snapshot) and a third copy would be a third thing to drift.
  var PRESS_ONLY = false;
  try{
    var _q = new URLSearchParams(window.location.search);
    if(_q.get("ex")) CUR = _q.get("ex").toUpperCase();
    PRESS_ONLY = (_q.get("feeds") || "").toLowerCase() === "press";
  }catch(e){}
  // The security filter's controls, and the merged feed it filters.
  var qEl = document.getElementById("q"),
      suggEl = document.getElementById("sugg"),
      actEl = document.getElementById("active");
  var NEWSROWS = [];   // every row the feeds produced, before the window cut
  var READY = false;   // a keystroke before the feeds land must not leave a
                       // stale empty state on screen
  // Each exchange draws on its official/collector feed plus the market-bot scan.
  // JSE had headlines in jse_news.json all along that this panel never loaded,
  // and EGX had no feed at all - the scan reaches it through three sources.
  // EGX now has its own headline file too (egx_news.json): the Egyptian business
  // desks (Enterprise, Daily News Egypt, Egypt Independent) became reachable, so
  // news_collect_egx.py builds it and the sweep keeps it current. Both EGX files
  // are loaded; they are deduped against each other by URL and headline.
  var EX_FILE = {
    "NSE": ["nse_news.json", "bot_news_NSE.json"],
    "NGX": ["ngx_news.json", "bot_news_NGX.json"],
    "JSE": ["jse_news.json", "bot_news_JSE.json"],
    "EGX": ["egx_news.json", "bot_news_EGX.json"]
  };
  var EX_NAME = { "NSE": "NSE", "NGX": "NGX", "JSE": "JSE", "EGX": "EGX" };
  var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // The REG panel's content folds into this one: the regulator wire, filtered
  // to the country of the exchange currently shown.
  var REG_ISO = { "NSE": "KE", "NGX": "NG", "JSE": "ZA", "EGX": "EG" };
  // Structured corporate actions (dividends / book closures) for exchanges
  // that publish them as their own feed.
  //
  // NGX was previously left out on the assumption that its dividends and
  // closures already rode ngx_news.json. They do not: that feed carries
  // dividends but no book closures at all, while ngx_corporate_actions.json
  // holds 397 corporate actions - 86 of them closure notices - plus directors'
  // dealings and board meetings. Only one of its 1000 rows duplicates a
  // headline already in the news feed, so folding it in adds coverage without
  // doubling anything up.
  //
  // JSE corporate actions arrive via the bot scan; EGX has no reachable
  // English feed.
  var CORP_FILE = { "NSE": "nse_corporate_actions.json",
                    "NGX": "ngx_corporate_actions.json" };

  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ---- SECURITY FILTER ---------------------------------------------------
  // One control narrows this panel to a single security's items. The rule is
  // deliberately literal, so it can be read rather than guessed at:
  //
  //   1. The query and every piece of row text are normalised to UPPERCASE
  //      with each run of non-alphanumerics collapsed to one space, and the
  //      HTML entities a feed leaves inside a label are decoded first, so
  //      "kcb-group", "KCB Group" and "KCB GROUP" compare equal and an EGX
  //      ticker written "MFSC.CA" compares as "MFSC CA".
  //   2. A company name is a SEQUENCE of words, not a bag of words. The name is
  //      reduced to its PHRASE: its leading words in order, stopped before the
  //      first legal suffix (Ltd, Plc, Co), the market's own country (Kenya,
  //      Nigeria) or Holdings/Holding. So "Standard Group Plc" reduces to
  //      STANDARD GROUP, "Equity Group Holdings Limited" to EQUITY GROUP and
  //      "Safaricom Plc" to SAFARICOM. Keeping the word Group inside the phrase
  //      is the fix: no name can collapse to one generic word, so a single
  //      industry word can never stand for a company. That is why the phrase
  //      STANDARD GROUP stops "Standard Chartered Bank Kenya" (a different
  //      security) matching the query SGL, and EQUITY GROUP stops the headline
  //      "Britam expands ... with global equity ... funds" matching Equity.
  //   3. The query resolves to a security from static_data/listing_<EX>.json
  //      in a fixed order. An EXACT ticker (ignoring a market suffix such as
  //      .CA or .JO) or an EXACT ISIN wins outright and resolves to that one
  //      security ALONE. Only when nothing matches exactly does the name rule
  //      run: a contiguous whole-word run inside the security's name or name
  //      PHRASE, or one of its evidenced former or alternate names (RENAMES
  //      below). The name rule is never partial: a partial word only offers a
  //      suggestion in the picker (so "safa" offers Safaricom for the reader to
  //      choose) and can never silently narrow the panel to a set. Row matching
  //      below never uses a partial word either.
  //   4. A row belongs to that security when the row's own ticker field equals
  //      the security ticker, the row's ISIN equals the security ISIN, or the
  //      row text carries the security TICKER as a whole word, the security's
  //      name PHRASE as a contiguous whole-word run, or one of its alternate
  //      name phrases as a contiguous whole-word run.
  //
  // WHOLE WORDS only, never substrings. That is the point of the rule: a
  // substring filter for "bat" matched those letters inside unrelated words and
  // rows. A query that resolves to no security shows the explicit empty state
  // and no rows; it never falls back to listing everything as though the filter
  // were off.
  // The feed writes most entities with their terminating semicolon, but a few
  // labels lose it ("I&amp M", the I&M Group rows), so the entity never decodes
  // and the label reads I AMP M instead of I M. Decode the semicolon form first,
  // then the same entities when the semicolon is missing, but only where the
  // entity is followed by a non-alphanumeric or the end, so a real word that
  // merely starts "amp..." is never cut.
  function unesc(s){
    return String(s == null ? "" : s)
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, "\"").replace(/&#39;/g, "'").replace(/&apos;/g, "'")
      .replace(/&amp(?![A-Za-z0-9])/g, "&").replace(/&lt(?![A-Za-z0-9])/g, "<")
      .replace(/&gt(?![A-Za-z0-9])/g, ">").replace(/&quot(?![A-Za-z0-9])/g, "\"")
      .replace(/&apos(?![A-Za-z0-9])/g, "'").replace(/&#39(?![0-9])/g, "'");
  }
  function norm(s){
    return unesc(s).toUpperCase().replace(/[^A-Z0-9]+/g, " ").replace(/^\s+|\s+$/g, "");
  }
  function toks(s){ var n = norm(s); return n ? n.split(" ") : []; }
  function baseTicker(s){ return String(s == null ? "" : s).toUpperCase().split(".")[0].trim(); }
  function isISIN(s){ return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(String(s == null ? "" : s).toUpperCase().trim()); }
  // Words that END a company's phrase: legal suffixes, the market's own country
  // and Holdings/Holding, which the feeds drop. GROUP does not end it, which is
  // what keeps a name from collapsing to one generic word.
  var LEGAL_STOP = {LTD:1,LIMITED:1,PLC:1,CO:1,COMPANY:1,CORPORATION:1,CORP:1,INC:1,
                    INCORPORATED:1,SA:1,AG:1,BV:1,NV:1,PL:1};
  var PLACE_STOP = {KENYA:1,NIGERIA:1,EGYPT:1,GHANA:1,TANZANIA:1,UGANDA:1,RWANDA:1,AFRICA:1,SOUTH:1};
  var HOLD_STOP = {HOLDINGS:1,HOLDING:1};
  function isStop(w){ return !!(LEGAL_STOP[w] || PLACE_STOP[w] || HOLD_STOP[w]); }
  // A query made only of these words names no company: they are legal, place or
  // structural words, so "group", "bank", "ltd" or "kenya" resolve to nothing
  // rather than to every issuer that carries the word.
  var QUERY_STOP = {LTD:1,LIMITED:1,PLC:1,CO:1,COMPANY:1,CORPORATION:1,CORP:1,INC:1,
                    INCORPORATED:1,SA:1,AG:1,BV:1,NV:1,PL:1,GROUP:1,HOLDINGS:1,HOLDING:1,
                    BANK:1,THE:1,OF:1,AND:1,
                    KENYA:1,NIGERIA:1,EGYPT:1,GHANA:1,TANZANIA:1,UGANDA:1,RWANDA:1,AFRICA:1,SOUTH:1};
  function namePhrase(name){
    var t = toks(name), out = [];
    for (var i = 0; i < t.length; i++){
      if (i > 0 && isStop(t[i])) break;
      out.push(t[i]);
      if (out.length >= 6) break;
    }
    return out;
  }
  // EVIDENCED alternate and former names for the issuers on this exchange. Each
  // is a rename or merger the issuer itself published, never a guess:
  //   ABSA : Barclays Bank of Kenya renamed Absa Bank Kenya PLC, 10 Feb 2020.
  //   HFCB : Housing Finance / HF Group renamed HFCB Group Plc, May 2026.
  //   NCBA : NIC Group merged with CBA and renamed NCBA Group Plc, Oct 2019.
  //   SBIC : CfC Stanbic Holdings renamed Stanbic Holdings Plc, Aug 2016.
  //   SLAM : Pan Africa Insurance Holdings renamed Sanlam Kenya Plc, 2016.
  //   EQTY : the listed entity was Equity Bank Limited before its Dec 2014
  //          conversion into Equity Group Holdings Limited.
  //   TCL  : the NSE spells it "Trans-Century Plc"; the feed writes
  //          "TransCentury".
  // An entry only ADDS search words to the current listing; the row still has to
  // carry the phrase, and an issuer with no listed successor is left alone.
  //
  // The second block below covers companies the feed files under a former or
  // shortened name that the phrase rule cannot reach. Each is a genuine variant
  // of exactly one STILL-LISTED issuer, evidenced by the feed's own label or by
  // the filing title, so the successor is the current listing and no row is
  // mislabelled. A delisted issuer with no successor is deliberately absent.
  //   IMH  : I&M Holdings Plc renamed I&M Group Plc; the feed labels the rows
  //          "I&amp M" (a malformed entity) and their titles read "I&M Holdings
  //          Plc". The "IM Holdings" form is the hyphenated slug.
  //   TOTL : Total Kenya Plc renamed TotalEnergies Marketing Kenya Plc (2022).
  //   LKL  : Longhorn Kenya Limited renamed Longhorn Publishers Plc; one batch
  //          is misspelled "Lonhorn".
  //   SCAN : WPP Scangroup Plc;  KPLC : Kenya Power & Lighting Company Plc.
  //   EVRD : Eveready East Africa Limited;  KNRE : Kenya Re-Insurance.
  //   CTUM : Centum Investment Company Plc;  CARB : Carbacid Investments Ltd.
  //   HFCB : Housing Finance Company of Kenya (HFCK);  BAMB : Bamburi Cement.
  //   SMER : Sameer Africa Plc (the feed files the one-word "SameerAfrica").
  var RENAMES = {
    ABSA: ["Barclays", "Barclays Bank of Kenya"],
    HFCB: ["Housing Finance", "Housing Finance Company of Kenya", "HF Group", "HFC", "HFCK"],
    NCBA: ["NIC", "NIC Bank", "NIC Group"],
    SBIC: ["CfC Stanbic", "CfC Stanbic Holdings"],
    SLAM: ["Pan Africa Insurance", "Pan Africa Insurance Holdings"],
    EQTY: ["Equity Bank", "Equity Bank Limited", "Equity Bank Group"],
    TCL:  ["TransCentury"],
    IMH:  ["I&M", "I&M Holdings", "I&M Group", "IM Holdings"],
    TOTL: ["Total Kenya", "TotalEnergies Marketing"],

  // reaches a row that merely contains those letters inside another word.
  function hasRun(s, words, partialLast){
    if (!words || !words.length) return false;
    var t = (typeof s === "string") ? norm(s).split(" ") : s;
    if (!t.length || t[0] === "") return false;

      var ok = true;
      for (var k = 0; k < words.length; k++){

  // The resolution order is deliberate, and the order IS the fix:
  //   1. an EXACT ticker or ISIN resolves to that one security and STOPS. It is
  //      never widened by the name rule, because a ticker is also a prefix of a
  //      longer name: the exact ticker BRIT (Britam) is the first four letters
  //      of BRITISH AMERICAN TOBACCO, so a name rule allowed to run alongside
  //      the ticker dragged BAT's rows into BRIT's. An exact code cannot be
  //      ambiguous, so nothing else may join it.
  //   2. only if nothing matched exactly, a whole-word company name or an
  //      evidenced former/alternate name may resolve. The LAST word is NOT
  //      allowed to be partial here, so a partial word can never silently
  //      narrow the panel to a set; a partial word only ever offers a
  //      suggestion (suggHits below), which the reader picks.
  //   3. the directory may not list a security the feeds still file under; an
  //      EXACT ticker the rows carry themselves is still that security.
  function resolveSec(qraw){
    var raw = String(qraw == null ? "" : qraw).trim();
    if (!raw) return null;
    var base = baseTicker(raw);
    var isinU = raw.toUpperCase().replace(/\s/g, "");
    var qt = toks(raw), out = [];
    // A query made only of legal, place or structural words names no security,
    // so it never resolves through a name or an alias.
    var qAllStop = qt.length > 0 && qt.every(function(w){ return QUERY_STOP[w]; });
    function push(s){
      for (var i = 0; i < out.length; i++) if (out[i].tk === s.tk) return;
      out.push(s);
    }
    // 1. EXACT ticker, then EXACT ISIN: one security, alone, and stop.
    var hitTk = null, hitIsin = null;
    SEC.forEach(function(s){
      if (!hitTk && s.tk === base) hitTk = s;
      if (!hitIsin && s.isin && s.isin === isinU) hitIsin = s;
    });
    if (hitTk) return [hitTk];
    if (hitIsin) return [hitIsin];
    // 2. a whole-word name, phrase or evidenced alternate name (no partial)
    var qlen = norm(raw).replace(/ /g, "").length;
    if (!qAllStop && qlen >= 2){
      SEC.forEach(function(s){
        if (hasRun(s.phrase, qt) || hasRun(s.name, qt)) { push(s); return; }
        for (var i = 0; i < s.alt.length; i++)
          if (hasRun(s.alt[i], qt)) { push(s); return; }                   // former/alternate name
      });
    }
    if (out.length) return out;
    // 3. an EXACT ticker the rows carry themselves (a renamed or delisted issuer)
    NEWSROWS.forEach(function(r){
      rowTickers(r).forEach(function(t){
        if (t === base)
          push({ tk: t, name: r.company || r.publisher || "", phrase: namePhrase(r.company || r.name || ""), isin: "", alt: [] });
      });
    });

  }
  function rowMatch(r, secs){

      for (var j = 0; j < tk.length; j++) if (tk[j] === s.tk) return true;
      if (s.isin && isin && isin === s.isin) return true;
      if (hasRun(text, [s.tk])) return true;    // the ticker used as the short label
      if (hasRun(text, s.phrase)) return true;  // the company's name phrase
      for (var k = 0; k < s.alt.length; k++)    // a former or alternate name

    var raw = String(qraw || "").trim().toUpperCase();

    var qt = q.split(" "), base = baseTicker(raw), hits = [];
    var qAllStop = qt.length > 0 && qt.every(function(w){ return QUERY_STOP[w]; });
    var qlen = q.replace(/ /g, "").length;   // a one-letter query suggests nothing
    SEC.forEach(function(s){
      var sc = -1;
      if (s.tk === base) sc = 0;
      else if (s.isin && s.isin === raw.replace(/\s/g, "")) sc = 1;
      else if (s.tk.indexOf(base) === 0) sc = 2;
      else if (qlen >= 2 && !qAllStop && hasRun(s.phrase, qt, true)) sc = 3;
      if (sc < 0 && qlen >= 2 && !qAllStop && hasRun(s.name, qt, true)) sc = 4;
      if (sc < 0 && !qAllStop)

      if (sc >= 0) hits.push({ s: s, sc: sc });

    if (!want || !have) return false;

    var cues = {};
    ALLEX.forEach(function(e){ if (EXCUE[e].test(t)) cues[e] = 1; });
    // a local desk's story is about its own market even when it does not say so
    if (n._home) cues[n._home] = 1;
    var up = count(UPW, t), dn = count(DNW, t);
    var dir = up > dn ? 1 : (dn > up ? -1 : 0);
    var themes = [], effects = [];
    THEMES.forEach(function(th){
      if (!th.pat.test(t)) return;
      if (th.ctx && !FINCTX.test(t)) return;
      themes.push({ id: th.id, label: th.label, note: th.note });
      th.exp.forEach(function(e){
        var cued = !!cues[e.ex];
        if (!th.inh && !cued) return;      // a local theme reaches only the market it names
        effects.push({ ex: e.ex, sector: e.sector, sign: dir * e.sign, s: e.s * (cued ? 1 : .7),

      if (e.ex !== ex) return;
      var spec = e.sector ? (sectorHit(e.sector, sector) ? 2 : 0) : 1;
      if (!spec) return;
      if (!best || spec > best.spec || (spec === best.spec && e.s > best.e.s)) best = { spec: spec, e: e };

  }

  // ---- THE READER'S BOOK ---------------------------------------------------
  // Read-only, from the same localStorage key the TRADE panel writes
  // ({ <EX>: { positions: { <sym>: { qty, avg } } } }). Nothing is sent anywhere:
  // the match of a story to a holding is made here.
  var BOOK = [];          // [{ sym, ex, qty, sec, sector }]
  var BOOKONLY = false;
  var LISTS = {};         // EX -> listing rows, for holdings on other boards
  function readBookRaw(){
    var raw = null;
    try { raw = localStorage.getItem("mx_paper_v1") || localStorage.getItem("mt_paper_v1"); } catch(e){}
    if (!raw) return [];
    var all = null;
    try { all = JSON.parse(raw); } catch(e){ return []; }
    var out = [];
    Object.keys(all || {}).forEach(function(k){
      var b = all[k];
      if (!b || typeof b !== "object" || !b.positions) return;
      var ex = ALLEX.indexOf(k) >= 0 ? k : null;
      Object.keys(b.positions).forEach(function(sym){
        var q = +((b.positions[sym] || {}).qty);
        if (!q) return;
        out.push({ sym: baseTicker(sym), ex: ex, qty: q });
      });
    });
    return out;
  }
  function secFrom(r, ex){
    var tk = baseTicker(r.ticker || r.code || r.sym);
    var s = { tk: tk, name: String(r.name || ""), phrase: namePhrase(r.name), isin: "", alt: [],
              sector: String(r.sector || "") };
    if (ex === "NSE") (RENAMES[tk] || []).forEach(function(x){ addAlt(s, toks(x)); });
    return s;
  }
  function loadList(ex){
    if (LISTS[ex]) return Promise.resolve(LISTS[ex]);
    return fetch("../../static_data/listing_" + ex + ".json")
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){ LISTS[ex] = (d && d.stocks) || []; return LISTS[ex]; })
      .catch(function(){ LISTS[ex] = []; return []; });
  }
  function loadBook(){
    var raw = readBookRaw();
    var need = {};
    raw.forEach(function(h){ if (h.ex) need[h.ex] = 1; else ALLEX.forEach(function(e){ need[e] = 1; }); });
    return Promise.all(Object.keys(need).map(loadList)).then(function(){
      BOOK = raw.map(function(h){
        var exs = h.ex ? [h.ex] : ALLEX;
        for (var i = 0; i < exs.length; i++){
          var rows = LISTS[exs[i]] || [];
          for (var j = 0; j < rows.length; j++){
            if (baseTicker(rows[j].ticker || rows[j].code || rows[j].sym) === h.sym){
              var s = secFrom(rows[j], exs[i]);
              return { sym: h.sym, ex: exs[i], qty: h.qty, sec: s, sector: s.sector };
            }
          }
        }
        return { sym: h.sym, ex: h.ex, qty: h.qty, sec: null, sector: "" };
      });
      var btn = document.getElementById("bookBtn");
      btn.disabled = !BOOK.length;
      btn.textContent = "MY BOOK" + (BOOK.length ? " (" + BOOK.length + ")" : "");
      btn.title = BOOK.length
        ? "Show only the stories that touch the " + BOOK.length + " holdings in your paper book"
        : "No holdings in this browser's paper book yet - buy in TRADE and the stories that touch them are flagged here";
      if (!BOOK.length) BOOKONLY = false;
      NEWSROWS.forEach(function(n){ n._hits = null; });
      if (READY) renderNews();
    });
  }
  // A holding is NAMED by a story only on strong evidence: the row's own ticker
  // field, the ticker written in capitals as a whole word (3+ letters, so "KQ"
  // or "ART" in running text never count), the company's name phrase or an
  // evidenced former name. A miss is better than a wrong story on a holding.
  function names(n, s){
    var tk = rowTickers(n);
    for (var j = 0; j < tk.length; j++) if (tk[j] === s.tk) return true;
    var raw = unesc(n.title || "");
    if (s.tk.length >= 3 && new RegExp("(^|[^A-Za-z0-9])" + s.tk.replace(/[^A-Z0-9]/g, "") + "([^A-Za-z0-9]|$)").test(raw)) return true;
    var text = rowText(n);
    if (s.phrase.length && hasRun(text, s.phrase)) return true;
    for (var k = 0; k < s.alt.length; k++) if (hasRun(text, s.alt[k])) return true;
    return false;
  }
  function bookHits(n){
    if (n._hits) return n._hits;
    var tg = tagStory(n), out = [];
    BOOK.forEach(function(h){
      if (h.sec && names(n, h.sec)){
        out.push({ h: h, how: "named", sign: tg.corp, e: null });
        return;
      }
      if (!h.ex) return;
      var b = bestEffect(tg, h.ex, h.sector);
      // A market-wide theme whose headline states no move (a T-bill auction
      // notice, a bond-index launch) would flag every holding on that board at
      // once and say nothing. It stays in the MARKET READ; it touches the book
      // only when the move is stated, or when the exposure is the holding's own
      // sector.
      if (b && b.spec === 1 && !b.e.sign) b = null;
      if (b) out.push({ h: h, how: b.spec === 2 ? "sector" : "market", sign: b.e.sign, e: b.e });
    });
    n._hits = out;
    return out;
  }
  // A cross-market wire story belongs on this board only when it reaches it:
  // through the exposure map, by naming the market, or by touching the book.
  function relevantHere(n){
    if (!n._live || n._home) return true;
    var tg = tagStory(n);
    if (tg.cues[CUR]) return true;
    for (var i = 0; i < tg.effects.length; i++) if (tg.effects[i].ex === CUR) return true;
    return bookHits(n).length > 0;
  }
  // The cross-market wire files a hundred-odd macro stories a day, most of them
  // the same oil or dollar move retold. On a board's own page they are capped
  // at the newest GLOBAL_CAP, so the market's own desks still lead.
  var GLOBAL_CAP = 30;
  function capGlobal(rows){
    var g = 0;
    return rows.filter(function(n){
      if (!n._live || n._home) return true;
      return ++g <= GLOBAL_CAP;
    });
  }
  function arrow(sign){ return sign > 0 ? "▲" : (sign < 0 ? "▼" : "◆"); }
  function cls(sign){ return sign > 0 ? "up" : (sign < 0 ? "dn" : ""); }
  function impactCell(n){
    var hits = bookHits(n);
    if (hits.length){
      var groups = { "1": [], "-1": [], "0": [] };
      hits.forEach(function(x){ groups[String(x.sign > 0 ? 1 : (x.sign < 0 ? -1 : 0))].push(x.h.sym); });
      return ["1", "-1", "0"].filter(function(k){ return groups[k].length; }).map(function(k){
        var g = groups[k], sg = +k;
        return '<span class="im mine ' + cls(sg) + '" data-x="1" title="Touches your book - click for why">' +
               arrow(sg) + " " + esc(g.slice(0, 3).join(" ")) + (g.length > 3 ? " +" + (g.length - 3) : "") + '</span>';
      }).join("");
    }
    var tg = tagStory(n);
    var b = bestEffect(tg, CUR, null), sec = null;
    tg.effects.forEach(function(e){ if (e.ex === CUR && e.sector && (!sec || e.s > sec.s)) sec = e; });
    var out = "";
    if (b) out += '<span class="im ' + cls(b.e.sign) + '" data-x="1" title="' + esc(b.e.via) + ' - click for why">' +
                  arrow(b.e.sign) + " " + esc(CUR) + " · " + esc(b.e.via.toUpperCase()) + '</span>';
    if (sec && (!b || sec.sign !== b.e.sign))
      out += '<span class="im ' + cls(sec.sign) + '" data-x="1">' + arrow(sec.sign) + " " + esc(sec.sector.toUpperCase()) + '</span>';
    if (!out && tg.corp && (n.tickers || []).length)
      out = '<span class="im ' + cls(tg.corp) + '" data-x="1">' + arrow(tg.corp) + " " + esc(n.tickers[0]) + '</span>';
    return out;
  }
  function signWords(sign){
    return sign > 0 ? '<span class="u">usually supportive</span>'
         : (sign < 0 ? '<span class="d">usually a drag</span>'
         : "direction not stated in the headline - one to watch");
  }
  function detailHtml(n){
    var tg = tagStory(n), hits = bookHits(n), lines = [];
    var notes = {};
    tg.themes.forEach(function(t){ notes[t.label] = t.note; });
    Object.keys(notes).forEach(function(k){
      lines.push('<div class="ln"><span class="k">WHY IT MATTERS · ' + esc(k.toUpperCase()) + '</span>' + esc(notes[k]) + '</div>');
    });
    if (hits.length){
      hits.forEach(function(x){
        var where = esc(x.h.sym) + ' <span class="k">' + esc((x.h.ex || "") + (x.h.sector ? " · " + x.h.sector : "")) + '</span>';
        var why;
        if (x.how === "named")
          why = "named in this story; " + (x.sign > 0 ? '<span class="u">the wording reads positive</span> (results, dividend or deal language)'
              : (x.sign < 0 ? '<span class="d">the wording reads negative</span> (loss, probe, suspension or exit language)'
              : "no clear positive or negative wording - read it"));
        else
          why = "exposed through " + esc(x.e.via) + (x.how === "sector" ? " (its sector)" : " (its whole market)") + ": " + signWords(x.sign);
        lines.push('<div class="ln"><span class="k">YOUR BOOK</span>' + where + " - " + why + '</div>');
      });
    } else {
      var seen = {};
      tg.effects.filter(function(e){ return e.ex === CUR; }).forEach(function(e){
        var k = (e.sector || "all") + e.via;
        if (seen[k]) return; seen[k] = 1;
        lines.push('<div class="ln"><span class="k">MARKET READ</span>' + esc(CUR) + " " +
                   esc(e.sector ? e.sector.toLowerCase() : "shares overall") + " via " + esc(e.via) + ": " + signWords(e.sign) + '</div>');
      });
      if (tg.corp && (n.tickers || []).length)
        lines.push('<div class="ln"><span class="k">COMPANY</span>' + esc(n.tickers.join(", ")) + ": " +
                   (tg.corp > 0 ? '<span class="u">the wording reads positive</span>' : '<span class="d">the wording reads negative</span>') + '</div>');
      if (!BOOK.length)
        lines.push('<div class="ln"><span class="k">YOUR BOOK</span>no holdings in this browser\'s paper book - buy in TRADE and the stories that touch them are flagged.</div>');
    }
    if (!lines.length) lines.push('<div class="ln">No market theme or listed company recognised in this headline.</div>');
    lines.push('<div class="fine">A rules-based read of the headline against a fixed exposure map: which way this kind of news has tended to push, not a forecast and not investment advice.</div>');
    return lines.join("");
  }
  var OPEN = {};    // row key -> detail open
  function summaryHtml(rows){
    if (!BOOK.length) return "";
    var now = Date.now() / 1000, n24 = 0, up = 0, dn = 0, by = {};
    rows.forEach(function(n){
      if (!n._t || now - n._t > 86400) return;
      var h = bookHits(n);
      if (!h.length) return;
      n24++;
      h.forEach(function(x){
        if (x.sign > 0) up++; else if (x.sign < 0) dn++;
        var b = by[x.h.sym] || (by[x.h.sym] = { n: 0, s: 0 });
        b.n++; b.s += x.sign;
      });
    });
    if (!n24) return '<span class="hint">Nothing in the last 24h touches the ' + BOOK.length + ' holdings in your paper book.</span>';
    var top = Object.keys(by).sort(function(a, b){ return by[b].n - by[a].n; }).slice(0, 5).map(function(k){
      var s = by[k].s;
      return '<b class="' + (s > 0 ? "u" : (s < 0 ? "d" : "")) + '">' + arrow(s) + " " + esc(k) + "</b> " + by[k].n;
    }).join(" · ");
    return '<span>LAST 24H · <b>' + n24 + '</b> ' + (n24 === 1 ? "story touches" : "stories touch") + ' your book</span>' +
           '<span><span class="u">▲ ' + up + '</span> supportive · <span class="d">▼ ' + dn + '</span> drag</span>' +
           '<span>' + top + '</span>';
  }

  // ---- LIVE WIRE ----------------------------------------------------------
  // The backend keeps a rolling wire of market-scoped feeds, re-read every two
  // minutes (backend_render/live_news.py). The panel asks for what is new once
  // a minute, while it is visible, and folds it into the same table. When the
  // backend cannot be reached the panel keeps the snapshot and says so: the
  // status light is the only claim the panel makes about how fresh it is.
  //
  // Which backend: a ?api= handed in by the shell, checked against the known
  // hosts so a crafted link cannot aim these reads elsewhere; otherwise the
  // terminal's own Render service, the same default the shell uses.
  var API = (function(){
    try {
      var v = new URLSearchParams(location.search).get("api");
      if (v){
        var u = new URL(v, location.href);
        if (u.protocol !== "https:" && u.protocol !== "http:") return "";
        if (u.origin === location.origin || u.hostname === "mutxri-terminal.onrender.com" ||
            u.hostname === "localhost" || u.hostname === "127.0.0.1") return u.origin;
        return "";
      }
    } catch(e){}
    return "https://mutxri-terminal.onrender.com";
  })();
  var LIVE = { state: "off", since: 0, updated: 0, timer: null, first: true };
  var LIVE_MS = 60000;
  var SEEN = {};    // url and headline keys of every row already in the table
  function tkey(n){ return "t:" + String((n && n.title) || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").slice(0, 90); }
  function admit(n){
    var a = key(n), b = tkey(n);
    if (SEEN[a] || SEEN[b]) return false;
    SEEN[a] = 1; SEEN[b] = 1;
    return true;
  }
  function setLive(state, tip){
    LIVE.state = state;
    var el = document.getElementById("live"), tx = document.getElementById("liveTx");
    el.className = "live" + (state === "on" ? " on" : (state === "wait" ? " wait" : ""));
    if (state === "on"){
      var d = new Date(LIVE.updated * 1000);
      tx.textContent = "LIVE · " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    } else tx.textContent = state === "wait" ? "CONNECTING" : "SNAPSHOT";
    el.title = tip || "";
  }
  function schedule(){
    clearTimeout(LIVE.timer);
    LIVE.timer = setTimeout(pollLive, LIVE_MS);
  }
  function pollLive(){
    if (!API){ setLive("off", "No live backend for this page - showing the published snapshot."); return; }
    if (document.hidden){ schedule(); return; }
    if (LIVE.state !== "on") setLive("wait", "Connecting to the live wire (the backend can take up to a minute to wake).");
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctl) ctl.abort(); }, 60000);
    fetch(API + "/api/news/live?ex=" + encodeURIComponent(CUR) + (LIVE.since ? "&since=" + LIVE.since : ""),
          { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){
        clearTimeout(to);
        if (!d || !d.ok) throw 0;
        LIVE.updated = d.updated || Math.floor(Date.now() / 1000);
        var added = 0, mark = !LIVE.first, now = Date.now();
        (d.items || []).forEach(function(r){
          if (r.seen > LIVE.since) LIVE.since = r.seen;
          if (PRESS_ONLY && !r.home) return;
          var n = { title: r.title, url: r.url, publisher: r.publisher, ts: r.ts, tickers: [],
                    _live: true, _home: r.home || null, _clock: true };
          n._t = n.ts;
          if (!n.title || !admit(n)) return;
          if (mark) n._newAt = now;
          NEWSROWS.push(n);
          added++;
        });
        LIVE.first = false;
        setLive("on", "Live wire: " + (d.feeds - (d.feeds_down || 0)) + " of " + d.feeds +
                " feeds answering, re-read every " + Math.round((d.poll || 120) / 60) +
                " min; this panel checks every minute. Snapshot rows are kept below.");
        if (added){
          NEWSROWS.sort(function(a, b){ return b._t - a._t; });
          renderNews();
        }
        schedule();
      })
      .catch(function(){
        clearTimeout(to);
        setLive(LIVE.updated ? "wait" : "off", LIVE.updated
          ? "Live wire did not answer the last check - retrying. Rows already shown stay."
          : "Live wire unreachable - showing the published snapshot, refreshed every few hours.");
        schedule();
      });
  }
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && LIVE.state !== "off" && API){ clearTimeout(LIVE.timer); pollLive(); }
  });
  // TRADE writes the book from another frame; follow it.
  window.addEventListener("storage", function(e){
    if (e.key === "mx_paper_v1" || e.key === "mt_paper_v1") loadBook();
  });

  // The feeds date their items differently: the bot emits an epoch ts, the NGX
  // disclosures use "2026-08-28", and the older collectors use "Sep 3". Reduce
  // them all to one number so a merged list can be ordered honestly; anything
  // unparseable sorts last rather than pretending to be recent.
  function stamp(n){
    if(n && typeof n.ts === "number" && n.ts > 0) return n.ts;
    var d = String((n && n.date) || "").trim();
    var iso = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return Date.UTC(+iso[1], +iso[2]-1, +iso[3]) / 1000;
    var md = d.match(/^([A-Z][a-z]{2})\s+(\d{1,2})$/);
    if(md && MONTHS[md[1]] != null){
      var now = new Date(), y = now.getUTCFullYear();
      var t = Date.UTC(y, MONTHS[md[1]], +md[2]) / 1000;
      // A date more than a week ahead is last year's, not the future.
      if(t > now.getTime()/1000 + 7*86400) t = Date.UTC(y-1, MONTHS[md[1]], +md[2]) / 1000;
      return t;
    }
    return 0;
  }

  function key(n){
    var u = String((n && n.url) || "").split("?")[0];
    if(u) return "u:" + u;
    return "t:" + String((n && n.title) || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").slice(0, 90);
  }

  document.getElementById("exTitle").textContent = EX_NAME[CUR] || CUR;
  // the header must describe what is actually in the list below it
  if(PRESS_ONLY){
    document.getElementById("panelCode").textContent = "PRESS";
    document.getElementById("panelKind").textContent = "PRESS";
    document.getElementById("panelFeeds").textContent = "· HEADLINES";
    document.getElementById("src").textContent = "Headlines only";
    document.title = "MUTXRI TERMINAL - PRESS";
  }
  var files = EX_FILE[CUR];
  var el = document.getElementById("items");
  if(!files || !files.length){
    el.innerHTML = '<div class="empty">no news feed for ' + esc(CUR) + '</div>';
    return;
  }

  function load(name){
    return fetch("../../static_data/" + name)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .catch(function(){ return []; });
  }

  // Regulator-wire rows (reg.json) -> news rows, kept to this exchange's
  // country. The headline tail is the regulator's own masthead ("... -
  // Securities and Exchange Commission, Nigeria"), redundant with the
  // publisher line, so it is dropped. The wire also carries regulator
  // notices up to a decade old (the backend query has no date window), and a
  // news panel is not an archive: only items inside the recency window stay.
  var REG_DAYS = 180;
  function regRows(list){
    var iso = REG_ISO[CUR]; if(!iso) return [];
    var cutoff = Date.now() / 1000 - REG_DAYS * 86400;
    return ((list && list.items) || []).filter(function(i){
      if(!i || i.iso !== iso || !i.headline) return false;
      return stamp({ date: String(i.date || "").slice(0, 10) }) >= cutoff;
    })
      .map(function(i){
        var h = String(i.headline).replace(/\s+-\s+[^-\n]*$/, "").trim();
        return { title: h,
          publisher: String(i.regulator || "") + " \u00b7 " + String(i.outlet || ""),
          date: String(i.date || "").slice(0, 10),
          url: i.link || "", tickers: [], _reg: true };
      });
  }

  // Corporate-action rows: {"date":"Sep 04 2026","ticker":"SCOM",
  // "name":"Safaricom Plc","text":"Payment of KES 1.15 final dividend",
  // "kind":"DIVIDEND PAYMENT"} -> a headline with a ticker chip. These are
  // exchange announcements with no article URL, so they render unlinked.
  function corpRows(list){
    var out = [];
    (list || []).forEach(function(r){
      if(!r || !r.name || !r.text) return;
      // The two exchanges date these differently - NSE writes "Sep 04 2026",
      // NGX writes "2026-08-28". Parse both, or the ISO rows get no timestamp,
      // sort to the bottom of a date-ordered list and print a date shaped
      // unlike every other row.
      var raw = String(r.date || "").trim();
      var ts = 0, disp = raw;
      var m = raw.match(/^([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})$/);
      var iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m && MONTHS[m[1]] != null){
        ts = Date.UTC(+m[3], MONTHS[m[1]], +m[2]) / 1000;
        disp = m[1] + " " + (+m[2]);
      }else if(iso){
        ts = Date.UTC(+iso[1], +iso[2] - 1, +iso[3]) / 1000;
        // same "Sep 4" shape the NSE rows use, so one list reads as one list
        disp = MONTH_NAMES[+iso[2] - 1] + " " + (+iso[3]);
      }
      out.push({ title: r.name + ": " + r.text,
        publisher: String(r.kind || "Corporate Action").toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }),
        date: disp, url: r.url || "", ts: ts, _corp: true,
        tickers: r.ticker ? [r.ticker] : [] });
    });
    out.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });

    // Dividends and book closures are the two announcements people open this
    // panel for, and a plain newest-25 buries them: NGX files enough board
    // meetings and directors' dealings in any given week to fill the slice, so
    // the dividend notices - days older - never appeared at all. Give those two
    // categories their own share of the slice and let everything else fill the
    // rest, all still newest-first.
    // Take the dividend and closure notices first, then fill the remainder of
    // the slice with everything else, newest-first. Capping the priority bucket
    // instead would cut NSE in half - every one of its corporate actions is a
    // dividend or a closure - so the rule is "these go in first", never "these
    // get at most N".
    var PRIORITY = /dividend|book clos|closure of register|closed period/i;
    var CORP_CAP = 25;
    var keyed = [], other = [];
    out.forEach(function(n){ (PRIORITY.test(n.title) ? keyed : other).push(n); });
    var pick = keyed.slice(0, CORP_CAP);
    return pick.concat(other.slice(0, CORP_CAP - pick.length));
  }

  function shortDate(ts){
    try{
      var d = new Date(ts * 1000);
      return d.toUTCString().slice(5, 16).replace(/^0/, "");
    }catch(e){ return ""; }
  }

  var jobs = (files || []).map(function(nm){
    return load(nm).then(function(d){ return { kind: "plain", rows: d }; });
  });
  if(!PRESS_ONLY && REG_ISO[CUR])
    jobs.push(load("reg.json").then(function(d){ return { kind: "reg", rows: d }; }));
  if(!PRESS_ONLY && CORP_FILE[CUR])
    jobs.push(load(CORP_FILE[CUR]).then(function(d){ return { kind: "corp", rows: d }; }));

  Promise.all(jobs).then(function(srcs){
    var all = [];
    srcs.forEach(function(s){
      var rows = s.kind === "plain" ? (s.rows || [])
               : (s.kind === "reg" ? regRows(s.rows) : corpRows(s.rows));
      rows.forEach(function(n){
        if(!n || !n.title) return;
        if(!admit(n)) return;
        n._t = stamp(n);
        // every snapshot file is filed per exchange, so its rows are this
        // board's stories for the impact read
        n._home = CUR;
        // WHICH ROWS MAY PRINT A TIME. Only the press feed publishes one: its
        // items carry a real epoch stamp, 823 of 823 on the NSE file, with a
        // genuine hour and minute. A corporate action is dated to the day and
        // corpRows derives its ts as midnight UTC, so printing that row's time
        // would put "00:00" against a dividend nobody announced at midnight. A
        // regulator row carries no stamp at all. The flag is set where the row
        // is built, so the table never has to guess from the number alone.
        n._clock = (s.kind === "plain" && typeof n.ts === "number" && n.ts > 0);
        if(!n.date && n._t) n.date = shortDate(n._t);
        all.push(n);
      });
    });
    all.sort(function(a, b){ return b._t - a._t; });
    // rows the live wire may already have delivered stay
    NEWSROWS = NEWSROWS.concat(all).sort(function(a, b){ return b._t - a._t; });
    READY = true;
    renderNews();
    pollLive();
  });

  // Corporate actions must not lose a date race. NGX files ~300 press items a
  // month, so on a straight date sort the dividend and book-closure notices -
  // which are days older - fall past the 120-row cut and vanish, which is
  // exactly what they did before this. They are already capped at 25 by
  // corpRows, so reserve them their places and fill the rest by date.
  //
  // The regulator wire (reg.json) loses the same race for the same reason:
  // on a busy board its few rows - dated weeks earlier than the press - drop
  // below the cut, so the header said REGULATORY while showing none. Reserve
  // a small slice for it too, so the panel shows what its header claims.
  //
  // Regulatory and market-structure rows from the bot scan (bot_news_<EX>.json,
  // flagged mktstruct) are the same case: a regulator approving short selling or
  // an exchange opening securities lending is market-wide, dated, and would be
  // buried under a week of company filings on a busy board. They get a reserved
  // slice as well, so the panel's REGULATORY claim is true on a busy day too.
  var MKT_PRI = /short[- ]?sell|securities lending|securities borrowing|market[- ]?mak|market maker|market structure|trading rules/i;
  function windowRows(all){
    var CAP = 120, REG_CAP = 6, MKT_CAP = 12;
    var corp = all.filter(function(n){ return n._corp; });
    var reg  = all.filter(function(n){ return n._reg; }).slice(0, REG_CAP);
    // The market-structure slice is not a plain newest-N. The exact story whose
    // absence started this - a regulator approving short selling, an exchange
    // opening securities lending and borrowing - can sit a few days below
    // several central-bank notices, so on a straight date sort it fell off the
    // slice. A market-structure item takes its place first, then the slice fills
    // by date, so the category this panel claims to carry is actually carried.
    var mktAll = all.filter(function(n){ return n.mktstruct && !n._corp && !n._reg; })
                    .sort(function(a, b){ return b._t - a._t; });
    var mktPri = mktAll.filter(function(n){ return MKT_PRI.test(n.title || ""); });
    var mktRest = mktAll.filter(function(n){ return !MKT_PRI.test(n.title || ""); });
    var mkt = mktPri.slice(0, MKT_CAP).concat(
      mktRest.slice(0, Math.max(0, MKT_CAP - Math.min(MKT_CAP, mktPri.length))));
    var rest = all.filter(function(n){ return !n._corp && !n._reg && !n.mktstruct; });
    var out = corp.concat(reg).concat(mkt).concat(
      rest.slice(0, Math.max(0, CAP - corp.length - reg.length - mkt.length)));
    out.sort(function(a, b){ return b._t - a._t; });
    return out;
  }

  // One render path for both states: no query is the window this panel has
  // always shown, a query is the security's items alone or an explicit empty
  // state. Nothing here ever falls back to the full list.
  function renderNews(){
    if(!READY){ el.innerHTML = '<div class="empty">loading…</div>'; return; }
    var qraw = qEl.value.trim();
    // A filter must not answer from half its inputs: while the listing
    // directory is still in flight a query cannot be resolved, and the panel
    // waits (the directory's arrival re-renders) instead of showing a count or
    // an empty state that a later file could contradict.
    if (qraw && !SECLOADED) return;
    var secs = qraw ? resolveSec(qraw) : null;
    chip(qraw, secs);
    var shown;
    var pool = capGlobal(NEWSROWS.filter(relevantHere));
    document.getElementById("sum").style.display = BOOK.length ? "flex" : "none";
    document.getElementById("sum").innerHTML = summaryHtml(pool);
    document.getElementById("bookBtn").className = "bk" + (BOOKONLY ? " on" : "");
    if(!NEWSROWS.length){ el.innerHTML = '<div class="empty">no news</div>'; return; }
    if(BOOKONLY){
      // the book view reads the whole wire, not the display window, so an older
      // story about a holding is not cut by the 120-row limit
      shown = pool.filter(function(n){ return bookHits(n).length > 0; });
      if(qraw && secs) shown = shown.filter(function(n){ return !n._reg && rowMatch(n, secs); });
      if(!shown.length){
        el.innerHTML = '<div class="empty">Nothing in this window touches your book' + (qraw ? ' for ' + esc(qraw) : '') + '.</div>';
        return;
      }
    } else if(!qraw){
      shown = windowRows(pool);
    } else if(!secs){
      // A query that names no listed security is not a filter anyone can
      // honour: nothing is shown, and the empty state names the query.
      el.innerHTML = emptyState(qraw, null);
      return;
    } else {
      // A security is selected. Every source is filtered: the general headlines
      // and the corporate-action rows by the security they name. The regulator
      // wire (reg.json) is a market-wide notice board whose items carry no
      // issuer at all (REG_ISO only narrows them to a country), so no item of it
      // can belong to one security; it is hidden rather than shown under that
      // security's name.
      shown = pool.filter(function(n){ return !n._reg && rowMatch(n, secs); });
    }
    if(!shown.length){ el.innerHTML = emptyState(qraw, secs); return; }
    var nowMs = Date.now();
    el.innerHTML =
      '<div class="nwrap"><table class="nt"><thead><tr>' +
        '<th class="c-head">Headline</th><th>Impact</th><th>Date</th><th>Time</th>' +
        '<th>Ticker</th><th>Source</th>' +
      '</tr></thead><tbody>' +
      shown.map(function(n, i){
        var head = n.url
          ? '<a href="' + esc(n.url) + '" target="_blank" rel="nofollow noopener">' + esc(n.title) + '</a>'
          : '<span class="nl">' + esc(n.title) + '</span>';
        var dt = rowDate(n), tm = rowTime(n);
        var tks = (n.tickers || []);
        var tick = tks.length
          ? esc(tks[0]) + (tks.length > 1 ? ' +' + (tks.length - 1) : '')
          : '';
        var k = key(n), isNew = n._newAt && nowMs - n._newAt < 7000;
        return '<tr data-i="' + i + '"' + (isNew ? ' class="new"' : '') + '>' +
          '<td class="c-head">' + head + '</td>' +
          '<td class="c-imp">' + impactCell(n) + '</td>' +
          '<td class="c-date">' + esc(dt) + '</td>' +
          '<td class="c-time">' + esc(tm) + '</td>' +
          '<td class="c-tick">' + tick + '</td>' +
          '<td class="c-src" title="' + esc(n.publisher || "") + '">' + esc(n.publisher || "") + '</td>' +
        '</tr>' +
        (OPEN[k] ? '<tr class="det"><td colspan="6">' + detailHtml(n) + '</td></tr>' : '');
      }).join("") +
      '</tbody></table></div>';
    SHOWN = shown;
  }
  // Clicking an impact mark opens the reasoning under its row.
  var SHOWN = [];
  el.addEventListener("click", function(e){
    var t = e.target;
    if(!t || !t.getAttribute || t.getAttribute("data-x") !== "1") return;
    var tr = t.closest ? t.closest("tr") : null;
    var n = tr ? SHOWN[+tr.getAttribute("data-i")] : null;
    if(!n) return;
    var k = key(n);
    OPEN[k] = !OPEN[k];
    renderNews();
  });
  document.getElementById("bookBtn").addEventListener("click", function(){
    if(!BOOK.length) return;
    BOOKONLY = !BOOKONLY;
    renderNews();
  });

  // Date and time are read from ONE source per row so the two can never
  // disagree. A press row has a published epoch stamp and prints both from it,
  // in the reader's own clock. A row dated only to the day prints the date its
  // feed gave and leaves the time cell empty, which is the true answer: nobody
  // published a time for it.
  function pad2(v){ return (v < 10 ? "0" : "") + v; }
  function rowDate(n){
    // One shape down the whole column, DD/MM/YY, the same order the rest of the
    // terminal writes a date in.
    if(n._clock){
      // A published instant, shown in the reader's clock, the same clock the
      // time cell beside it uses.
      var d = new Date(n.ts * 1000);
      return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" +
             String(d.getFullYear()).slice(2);
    }
    // A day, not an instant. Its ts was built as midnight UTC, so it is read
    // back in UTC: converting it to a local clock would move a dividend onto
    // the previous day for any reader west of Greenwich, and a corporate action
    // on the wrong date is worse than no table at all.
    if(typeof n.ts === "number" && n.ts > 0){
      var u = new Date(n.ts * 1000);
      return pad2(u.getUTCDate()) + "/" + pad2(u.getUTCMonth() + 1) + "/" +
             String(u.getUTCFullYear()).slice(2);
    }
    // No stamp at all: the regulator wire dates its rows "2026-11-21".
    var iso = String(n.date || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[3] + "/" + iso[2] + "/" + iso[1].slice(2);
    return n.date || "";
  }
  function rowTime(n){
    if(!n._clock) return "";
    var d = new Date(n.ts * 1000);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  qEl.addEventListener("input", onQuery);
  qEl.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){ e.preventDefault(); pickSugg(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); pickSugg(-1); }
    else if(e.key === "Escape"){ hideSugg(); }
    else if(e.key === "Enter"){
      var hits = suggHits(qEl.value);
      if(hits.length && SUGSEL >= 0){ e.preventDefault(); qEl.value = hits[SUGSEL].s.tk; hideSugg(); onQuery(); }
    }
  });
  qEl.addEventListener("blur", function(){ setTimeout(hideSugg, 120); });
  function onQuery(){ SUGSEL = -1; renderNews(); drawSugg(qEl.value); }
  loadSecurities();
  loadBook();
})();
</script>
</body>
</html>
