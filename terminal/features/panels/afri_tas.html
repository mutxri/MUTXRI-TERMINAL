<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - TAS (Time & Sales) panel. Spec section 9.4 (P2).
  A bar-derived trade tape for intraday markets (JSE/EGX). Honestly shows
  "no intraday tape" for EOD markets (NGX/NSE) rather than faking prints.

  Standalone-viewable: reads static_data/tas.json (the real tape state) when /api/tas is not reachable.
  Vanilla JS, exact Godel tokens, no build step.

  INTEGRATE: lift .tas-* markup into a right-panel tab (TAS), lift the
  <script>, wire the TAS command to window.showTas(symbol). No sample prints
  are shipped; /api/tas (when live) returns {available, reason, source, prints}.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - TAS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --down:#f87171; --acc:#33e29a;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .tas-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:420px; margin:24px auto; }
  .tas-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .tas-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .tas-title b { color:var(--acc); font-weight:700; }
  .tas-sym { font-family:var(--mono); font-size:12px; color:var(--tx); }
  .tas-cols { display:grid; grid-template-columns:0.9fr 1fr 1fr 1fr; gap:6px; padding:7px 14px; border-bottom:1px solid var(--line2); color:var(--tx3); font-size:10px; text-transform:uppercase; font-family:var(--mono); }
  .tas-cols span:not(:first-child) { text-align:right; }
  .tas-feed { max-height:360px; overflow-y:auto; }
  .tas-row { display:grid; grid-template-columns:0.9fr 1fr 1fr 1fr; gap:6px; padding:5px 14px; font-family:var(--mono); font-size:12px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .tas-row span:not(:first-child) { text-align:right; }
  .tas-row .t { color:var(--tx3); }
  .tas-row .p.up { color:var(--up); } .tas-row .p.down { color:var(--down); } .tas-row .p.flat, .tas-row .p { color:var(--tx); }
  .muted { color:var(--tx3); }
  .tas-empty { padding:32px 14px; text-align:center; color:var(--tx3); font-family:var(--mono); font-size:12px; line-height:1.5; }
  .tas-foot { padding:8px 14px; border-top:1px solid var(--line); color:var(--tx3); font-family:var(--mono); font-size:10px; }
</style>
</head>
<body>

<div class="tas-wrap" id="tas">
  <div class="tas-head">
    <div class="tas-title"><b>TAS</b> · Time &amp; Sales</div>
    <span class="tas-sym" id="tasSym"></span>
  </div>
  <div class="tas-cols"><span>Time</span><span>Price</span><span>Volume</span><span>Cum Vol</span></div>
  <div class="tas-feed" id="tasFeed"></div>
  <div class="tas-empty" id="tasEmpty" style="display:none;"></div>
  <div class="tas-foot" id="tasFoot">-</div>
</div>

<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var EX = (Q.get("ex") || "").toUpperCase();
  var REQ = (Q.get("sym") || Q.get("symbol") || "").toUpperCase();
  var TAS_ENDPOINT = "../../static_data/tas.json";


  function $(id){ return document.getElementById(id); }
  function fmt(v, dp){ return v == null ? '<span class="muted">-</span>' : Number(v).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }

  // The free sources MUTXRI reads are end-of-day: there is no intraday trade
  // tape for any of the four boards. State that honestly, NAME the selected
  // exchange, and never show a fixed ticker (the old build printed "SOL.JO"
  // whatever market was selected) or invent prints. A security label appears
  // only when the snapshot really carries that security's own prints.
  function render(data) {
    var sec = data && data.symbol ? String(data.symbol) : "";
    var avail = !!(data && data.available && (data.prints || []).length);
    if (avail && REQ && sec.toUpperCase() !== REQ) avail = false;
    if (avail) {
      $("tasSym").textContent = sec || REQ;
      $("tasEmpty").style.display = "none";
      $("tasFeed").innerHTML = (data.prints || []).map(function (r) {
        var cls = r.tick === "up" ? "up" : r.tick === "down" ? "down" : "flat";
        return '<div class="tas-row">' +
          '<span class="t">' + (r.t || "-") + "</span>" +
          '<span class="p ' + cls + '">' + fmt(r.price, 2) + "</span>" +
          "<span>" + fmt(r.volume, 0) + "</span>" +
          "<span>" + fmt(r.cumVolume, 0) + "</span>" +
        "</div>";
      }).join("");
      $("tasFoot").textContent = data.source || "";
      return;
    }
    $("tasFeed").innerHTML = "";
    $("tasSym").textContent = EX || "";
    $("tasEmpty").style.display = "block";
    $("tasEmpty").textContent = "No intraday trade tape" + (EX ? " for " + EX : "") +
      ". The free sources this terminal reads are end-of-day, so nothing is shown here rather than a fabricated tape.";
    $("tasFoot").textContent = (data && data.reason) || "";
  }

  function load(symbol) {
    if (symbol) REQ = String(symbol).toUpperCase();
    // Static origin: read the published snapshot directly (there is no /api/tas
    // here, so calling it first would only 404). Never fall back to sample prints.
    fetch(TAS_ENDPOINT)
      .then(function (r) { if (!r.ok) throw new Error("no snapshot"); return r.json(); })
      .then(render)
      .catch(function () { render(null); });
  }

  window.showTas = function (symbol) {
    var el = $("tas"); if (el) el.scrollIntoView({ behavior:"smooth" });
    if (symbol) load(symbol);
  };

  function init() { load(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
