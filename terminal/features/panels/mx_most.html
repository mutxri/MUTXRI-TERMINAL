<!DOCTYPE html>
<html lang="en"><head><script>(function(){var V='20261113221348';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script><meta charset="utf-8">
<title>MOST</title>
<style>
:root{--bg:#000;--line:#1c1c1c;--tx:#d8d8d8;--tx3:#7a7a7a;--acc:#33e29a;--down:#ff4d5e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.35 'Oxygen Mono',ui-monospace,monospace;height:100%}
#wrap{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-bottom:1px solid var(--line);background:#0d0d0d;flex:none}
.bar .t{letter-spacing:.07em;text-transform:uppercase;font-size:11px}
.sp{flex:1}
button,select{font:inherit;color:var(--tx);background:#141414;border:1px solid var(--line);border-radius:2px;padding:2px 6px;font-size:11px}
button:hover{background:#1d1d1d;cursor:pointer}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.on{background:var(--acc);color:#000}
.tw{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11.5px}
thead th{position:sticky;top:0;background:#0d0d0d;border-bottom:1px solid #262626;text-align:right;padding:4px 8px;color:var(--tx3);font-weight:400;white-space:nowrap;cursor:pointer}
thead th.l{text-align:left}
tbody td{border-bottom:1px solid #131313;padding:3px 8px;text-align:right;white-space:nowrap}
tbody td.l{text-align:left}
tbody tr:hover{background:#111}
.up{color:var(--acc)}.down{color:var(--down)}.dim{color:var(--tx3)}
.rank{color:#4a4a4a;width:34px}
.foot{height:24px;display:flex;align-items:center;gap:12px;padding:0 8px;border-top:1px solid var(--line);color:var(--tx3);font-size:10.5px;flex:none}
</style></head>
<body><div id="wrap">
  <div class="bar">
    <span class="t">Most Active</span>
    <span class="dim" id="exlbl"></span>
    <span class="sp"></span>
    <div class="seg" id="seg">
      <button data-t="active" class="on">ACTIVE</button>
      <button data-t="gainers">GAINERS</button>
      <button data-t="losers">LOSERS</button>
      <button data-t="value">VALUE</button>
    </div>
    <select id="rows"><option>10</option><option selected>25</option><option>50</option><option>100</option></select>
    <select id="sector"><option>All sectors</option></select>
    <select id="mincap">
      <option value="0">Any cap</option>
      <option value="1e8">Min 100M</option>
      <option value="1e9">Min 1B</option>
      <option value="1e10">Min 10B</option>
      <option value="1e11">Min 100B</option>
    </select>
  </div>
  <div class="tw"><table><thead><tr>
    <th class="l rank">#</th><th class="l">Ticker</th><th class="l">Name</th>
    <th>Last</th><th>Chg %</th><th>Chg</th><th>Vol</th><th>Vol $</th><th>M Cap</th><th class="l">Sector</th>
  </tr></thead><tbody id="body"></tbody></table></div>
  <div class="foot"><span id="cnt"></span><span class="sp" style="flex:1"></span><span id="asof"></span></div>
</div>
<script>

/* ---- where this panel's data comes from --------------------------------
   Built against serve_local.py, the development host that serves
   /api/parity/* out of the same static files the site ships. The DEPLOYED
   terminal has no such route: the call 404s to an HTML page, and a panel that
   only knew how to call it printed a JSON parse error where its table should
   be. Every read now goes through here. The parity route is tried first and
   used when it answers with JSON; otherwise the same answer is assembled in
   the browser out of static_data, which is what the deployed site serves. The
   panel therefore works in the terminal, on the development host and straight
   from the repo, and MX_SRC records which source answered. */
var MX_SRC = '';
function mxJSON(u){
  return fetch(u, {cache:'no-store'}).then(function(r){
    var nm = u.split('?')[0].split('/').pop();
    if(!r.ok) throw new Error(nm + ' ' + r.status);
    var ct = (r.headers.get('content-type') || '').toLowerCase();
    if(ct.indexOf('json') < 0) throw new Error(nm + ' did not answer with JSON');
    return r.json();
  });
}
function mxFirst(urls){
  var i = -1, last = null;
  function next(e){
    if(e) last = e;
    i++;
    if(i >= urls.length) throw (last || new Error('no file to read'));
    return mxJSON(urls[i]).catch(next);
  }
  return Promise.resolve().then(function(){ return next(null); });
}
function mxSnapshot(ex){
  ex = String(ex || 'NSE').toUpperCase();
  return mxJSON('/api/parity/snapshot?ex=' + encodeURIComponent(ex))
    .then(function(d){ MX_SRC = 'parity api'; return d; })
    .catch(function(){
      return mxFirst(['../../static_data/market_' + ex + '.json',
                      '../../static_data/heatmap_' + ex + '.json'])
        .then(function(d){
          d.stocks = d.stocks || [];
          d.count = d.stocks.length;
          d.exchange = d.exchange || ex;
          MX_SRC = 'static snapshot';
          return d;
        });
    });
}
(function(){
  var qs=new URLSearchParams(location.search), EX=(qs.get('ex')||'NGX').toUpperCase();
  document.getElementById('exlbl').textContent='· '+EX;
  var ST={tab:'active', rows:[], all:[], sort:null, dir:1};

  function num(v){
    if(typeof v==='number') return v;
    if(!v) return null;
    var m=String(v).replace(/[,\s]/g,'').match(/^(-?[\d.]+)([KMBT])?$/i);
    if(!m) return null;
    return parseFloat(m[1])*({'':1,'K':1e3,'M':1e6,'B':1e9,'T':1e12}[(m[2]||'').toUpperCase()]||1);
  }
  function fmt(n){
    if(n==null||isNaN(n)) return '—';
    var a=Math.abs(n);
    if(a>=1e12) return (n/1e12).toFixed(2)+'T';
    if(a>=1e9) return (n/1e9).toFixed(2)+'B';
    if(a>=1e6) return (n/1e6).toFixed(2)+'M';
    if(a>=1e3) return (n/1e3).toFixed(1)+'K';
    return String(Math.round(n));
  }
  function norm(s){
    var price=(s.price!=null?s.price:s.ltp);
    var prev=s.prevClose;
    var chg=(s.chg!=null?s.chg:(price!=null&&prev!=null?price-prev:null));
    var pct=(s.chgPct!=null?s.chgPct:(chg!=null&&prev?chg/prev*100:null));
    return {sym:s.sym||s.ticker,name:s.name,sector:s.sector,price:price,chg:chg,chgPct:pct,
            volume:num(s.volume),turnoverNum:num(s.turnover),cap:num(s.marketCap),asOf:s.asOf,
            traded:(price!=null && s.volume!=null && num(s.volume)>0)};
  }

  function build(){
    var cap=parseFloat(document.getElementById('mincap').value)||0;
    var sec=document.getElementById('sector').value;
    var n=parseInt(document.getElementById('rows').value,10)||25;
    var base=ST.all.filter(function(r){
      if((r.cap||0)<cap) return false;
      if(sec!=='All sectors' && r.sector!==sec) return false;
      return r.traded;                       // never rank an untraded name
    });
    var list;
    if(ST.tab==='active')      list=base.slice().sort(function(a,b){return (b.volume||0)-(a.volume||0);});
    else if(ST.tab==='value')  list=base.slice().sort(function(a,b){return (b.turnoverNum||0)-(a.turnoverNum||0);});
    else if(ST.tab==='gainers')list=base.filter(function(r){return r.chgPct>0;}).sort(function(a,b){return b.chgPct-a.chgPct;});
    else                       list=base.filter(function(r){return r.chgPct<0;}).sort(function(a,b){return a.chgPct-b.chgPct;});
    ST.rows=list.slice(0,n);
    if(ST.sort){
      ST.rows.sort(function(a,b){
        var x=a[ST.sort],y=b[ST.sort];
        if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
        if(typeof x==='string') return ST.dir*x.localeCompare(String(y));
        return ST.dir*(x-y);
      });
    }
    render();
  }

  function render(){
    var tb=document.getElementById('body'); tb.innerHTML='';
    ST.rows.forEach(function(r,i){
      var tr=document.createElement('tr');
      function td(txt,cls){ var d=document.createElement('td'); if(cls) d.className=cls; d.textContent=txt; tr.appendChild(d); return d; }
      td(String(i+1),'l rank');
      var s=td(r.sym,'l'); s.style.cursor='pointer'; s.onclick=function(){ parent.postMessage({type:'mx-open',sym:r.sym,cmd:'FOCUS',ex:EX},'*'); location.href='mx_focus.html?ex='+EX+'&sym='+encodeURIComponent(r.sym); };
      td(r.name||'—','l');
      td(r.price==null?'—':r.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),'');
      td((r.chgPct==null?'—':(r.chgPct>0?'+':'')+r.chgPct.toFixed(2)+'%'), r.chgPct>=0?'up':'down');
      td((r.chg==null?'—':(r.chg>0?'+':'')+r.chg.toFixed(2)), r.chg>=0?'up':'down');
      td(fmt(r.volume));
      td(fmt(r.turnoverNum));
      td(fmt(r.cap));
      td(r.sector||'—','l dim');
      tb.appendChild(tr);
    });
    document.getElementById('cnt').textContent=ST.rows.length+' of '+ST.all.length+' names · '+ST.tab;
  }

  document.getElementById('seg').onclick=function(e){
    if(e.target.tagName!=='BUTTON') return;
    [].forEach.call(this.children,function(b){b.classList.remove('on');});
    e.target.classList.add('on'); ST.tab=e.target.getAttribute('data-t'); build();
  };
  ['rows','sector','mincap'].forEach(function(id){
    document.getElementById(id).onchange=build;
  });
  document.querySelectorAll('thead th').forEach(function(th){
    if(th.classList.contains('rank')) return;
    th.onclick=function(){
      var map={'Ticker':'sym','Name':'name','Last':'price','Chg %':'chgPct','Chg':'chg','Vol':'volume','Vol $':'turnoverNum','M Cap':'cap','Sector':'sector'};
      var k=map[th.textContent.trim()]; if(!k) return;
      if(ST.sort!==k){ST.sort=k;ST.dir=1;} else if(ST.dir===1){ST.dir=-1;} else {ST.sort=null;ST.dir=1;}
      build();
    };
  });

  mxSnapshot(EX).then(function(s){
    ST.all=(s.stocks||[]).map(norm);
    var secs={}; ST.all.forEach(function(r){ if(r.sector) secs[r.sector]=1; });
    var sel=document.getElementById('sector');
    Object.keys(secs).sort().forEach(function(s){ var o=document.createElement('option'); o.textContent=s; sel.appendChild(o); });
    document.getElementById('asof').textContent=(s.asOf?('as of '+s.asOf):'')+(s._source?(' · '+s._source):'');
    build();
  });
})();
</script></body></html>
