<!--
  mx_financials.html  -  Financials tab panel (Income / Balance / Cash Flow)
  Standalone: shows verified real filing links + a dash scaffold (NO made-up
  numbers). Wired: fetches GET /api/financials and shows real filed statements.
  Always links each company's investor-relations / filing PDFs as primary source.
  Exposes window.showFinancials(ticker) for the command bar.
  Vanilla JS, single file, no build step. Godel palette, mint accent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financials</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:12px;padding:0}
  .wrap{border:0;background:transparent;max-width:none;margin:0;border-radius:0}
  .head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--bg2)}
  .code{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .name{color:var(--tx2);font-family:var(--ui)}
  .spacer{margin-left:auto}
  .filing{color:var(--acc);text-decoration:none;font-size:11px;border:1px solid rgba(51,226,154,.35);padding:3px 9px;border-radius:2px}
  .filing:hover{background:rgba(51,226,154,.08)}
  .filing[aria-disabled="true"]{color:var(--tx3);border-color:var(--line2);pointer-events:none}
  .controls{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
  .seg button{background:var(--bg2);color:var(--tx2);border:0;padding:6px 12px;font-family:var(--mono);font-size:11px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button[aria-pressed="true"]{background:var(--acc);color:#00160e;font-weight:700}
  select{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;padding:6px 8px;font-family:var(--mono);font-size:11px}
  label.lbl{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 14px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);font-weight:400}
  tbody td{border-bottom:1px solid var(--line);color:var(--tx)}
  tbody tr:hover td{background:var(--bg2)}
  td.item{color:var(--tx2);font-family:var(--ui)}
  tr.total td{color:var(--tx);font-weight:700;border-top:1px solid var(--line2)}
  tr.total td.item{color:var(--tx)}
  .neg{color:var(--down)}
  .status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--bg2);color:var(--tx3);font-size:10px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--tx3)}
  .dot.live{background:var(--acc)}
  .dot.sample{background:#e0a340}
  .badge{border:1px solid var(--line2);border-radius:2px;padding:1px 6px;color:var(--tx2)}
  .empty{padding:34px 14px;text-align:center;color:var(--tx3)}
  /* Bot analysis: computed from the filed statements above, never from a model. */
  .an{border-top:1px solid var(--line2);padding:12px 14px}
  .an h4{margin:0 0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
  .an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:5px 16px}
  .an-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:2px 0}
  .an-row span:first-child{color:var(--tx3)}
  .an-row span:last-child{color:var(--tx);font-variant-numeric:tabular-nums}
  .an-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .an-chip{font-size:9.5px;letter-spacing:.04em;border:1px solid var(--line2);border-radius:2px;padding:2px 6px;color:var(--tx2)}
  .an-chip.hi{color:var(--down);border-color:#5c2222}
  .an-chip.md{color:#c8a24a;border-color:#4a3a18}
  .an-chip.ok{color:var(--acc);border-color:#1c4d3a}
  .an-note{font-size:9.5px;color:var(--tx3);margin-top:8px;line-height:1.55}
  .an-wd{font-size:9.5px;color:var(--tx3);margin-top:6px;line-height:1.5;border-left:2px solid var(--line2);padding-left:7px}
  .an-wd b{color:var(--tx2);font-weight:600}
  /* the quote the selection carries: painted with the identity, before any
     statement file is read, so the price never waits on a filing */
  .fa-q{display:none;align-items:baseline;gap:9px;font-family:var(--mono);white-space:nowrap}
  .fa-q.on{display:flex}
  .fa-q .k{font-size:9px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase}
  .fa-q .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx)}
  .fa-q .v.px{font-size:18px}
  .fa-q .v.sm{font-size:11px;font-weight:400;color:var(--tx3)}
  .fa-q .v.up{color:var(--up)}
  .fa-q .v.down{color:var(--down)}
  .fa-q .v.flat{color:var(--tx2)}
  .fa-q .v.nofig{color:var(--tx3)}
  .fa-q .v.warn{color:#e0a340}
  .empty a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="panel">
  <div class="head">
    <span class="code">FA</span>
    <span id="tkr" style="font-weight:700"></span>
    <span class="name" id="coName"></span>
    <span id="exLabel" style="font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.05em"></span>
    <span class="spacer"></span>
    <span class="fa-q" id="faQuote"></span>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="statement">
      <button data-st="income"  aria-pressed="true">Income Statement</button>
      <button data-st="balance" aria-pressed="false">Balance Sheet</button>
      <button data-st="cashflow" aria-pressed="false">Cash Flow</button>
    </div>
    <span class="spacer"></span>
    <!-- no exchange picker: the market is already chosen upstream and arrives
         as ?ex=, and the header label above shows which one is in view -->
    <label class="lbl" for="secSel">Security</label>
    <input id="secSel" list="secList" placeholder="ticker or name" autocomplete="off"
           style="min-width:180px;background:var(--bg);color:var(--tx);border:1px solid var(--line2);
                  border-radius:2px;padding:3px 8px;font-family:var(--mono);font-size:11px">
    <datalist id="secList"></datalist>
    <label class="lbl" for="period">Period</label>
    <select id="period">
      <option value="annual">Annual</option>
      <option value="interim">Interim</option>
    </select>
  </div>

  <div id="body"></div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="srcLabel">loading</span>
    <span class="spacer"></span>
    <span class="badge" id="curBadge">-</span>
    <span id="asOf"></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---- security selector: dropdown of securities WITH financials ----
  // reads the panel's ?ex= (the terminal appends it) and lists only the
  // securities that actually have statement files (financials_index.json)
  var SECS = [];
  var state = (function(){
    var s = {ticker:"",statement:"income",period:"annual",ex:"NSE"};
    try{
      var q = new URLSearchParams(window.location.search);
      var e = q.get("ex"); if(e) s.ex = e.toUpperCase();
      var t = q.get("ticker"); if(t) s.ticker = t.toUpperCase();
      var sy = q.get("sym"); if(sy) s.sym = sy.toUpperCase();
    }catch(err){}
    return s;
  })();

  // ---- display labels: never show an internal key to a reader -------------
  // The EGX statement files are keyed by the ISIN (EGS60121C018.CA), which is
  // the right KEY for the lookup but the wrong LABEL: the header printed the
  // ISIN where the ticker (COMI) belongs. listing_<EX>.json carries both the
  // key forms and the ticker + company name, so resolve a display ticker and
  // name for the key while the key itself stays internal to every fetch.
  var LABELS = null;   // upper-cased key form -> {ticker, name}
  function loadLabels(){
    if (LABELS) return Promise.resolve(LABELS);
    var ex = state.ex || "NSE";
    return fetch("../../static_data/listing_" + encodeURIComponent(ex) + ".json").then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(d){
      var m = {};
      (d.stocks || []).forEach(function(s){
        var tkr = s.ticker || s.short || s.code || (s.sym || "").split(".")[0];
        var nm = s.name || "";
        [s.sym, s.ticker, s.code, s.short, s.short_sym, s.data_sym, s.display_sym].forEach(function(k){
          if(k) m[String(k).toUpperCase()] = {ticker: tkr, name: nm};
        });
      });
      LABELS = m; return m;
    }).catch(function(){ LABELS = {}; return LABELS; });
  }
  function labelFor(t){
    if(!LABELS) return null;
    var u = String(t || "").toUpperCase();
    return LABELS[u] || LABELS[u.split(".")[0]] || null;
  }

  // ---- canonical-key resolution -------------------------------------------
  // The shell opens this panel with ?sym=<the market row's sym>, which for EGX is
  // the ISIN form (EGS69101C011.CA) while the statement files are keyed by the
  // ticker the company actually trades under (HRHO). An outdated deep link can
  // also carry a retired spelling (the provider form ALEXA.CA for Alexandria
  // Cement, whose file is keyed ALEX.CA). Resolving the key here means a reader who
  // opens any of those forms sees the company's real statements instead of an empty
  // scaffold with no explanation. Statement data is never copied between keys, so a
  // refresh of the canonical file can never leave a stale twin behind.
  var KEY_ALIAS = {
    "ALEXA.CA": "ALEX.CA", "ALEXA": "ALEX.CA",
    "EGS69101C011": "HRHO", "EGS69101C011.CA": "HRHO",
    "EGS73541C012": "CCAP", "EGS73541C012.CA": "CCAP"
  };
  function dataKeys(t){
    var out = [], seen = {};
    function add(k){ k = String(k == null ? "" : k).toUpperCase(); if(k && !seen[k]){ seen[k] = 1; out.push(k); } }
    add(t);
    var lab = labelFor(t);
    if(lab && lab.ticker) add(lab.ticker);
    var u = String(t == null ? "" : t).toUpperCase();
    add(KEY_ALIAS[u]);
    add(KEY_ALIAS[u.split(".")[0]]);
    if(u.indexOf(".") >= 0) add(u.split(".")[0]);
    return out;
  }

  // ---- VERIFIED REAL FILINGS (links only, no fabricated numbers) ----------
  // Each URL was confirmed against the issuer's own domain. This panel shows
  // NO made-up financial statements: statement values render as dashes until a
  // real filings loader populates them; users open the primary-source PDF here.
    var FILINGS={
    SCOM:{name:"Safaricom Plc",exchange:"NSE",currency:"KES",ir:"https://www.safaricom.co.ke/investor-relations",reports:[{label:"Annual Report 2026",url:"https://www.safaricom.co.ke/images/Downloads/2026_Safaricom_Annual_Report_Updated.pdf"},{label:"Annual Report 2025",url:"https://www.safaricom.co.ke/images/Downloads/annual-2025-report.pdf"},{label:"Annual Report 2024",url:"https://www.safaricom.co.ke/annualreport_2024/wp-content/uploads/2024/07/safaricom-annual-report.pdf"}]},
    EQTY:{name:"Equity Group Holdings Plc",exchange:"NSE",currency:"KES",ir:"https://equitygroupholdings.com/investor-relations/",reports:[{label:"Integrated Report & Financial Statements 2025",url:"https://equitygroupholdings.com/wp-content/uploads/2026/06/Equity-Group-Holdings-PLC-2025-Integrated-Report-and-Financial-Statements.pdf"},{label:"Integrated Report & Financial Statements 2024",url:"https://equitygroupholdings.com/wp-content/uploads/2025/06/Equity-Group-Holdings-PLC-2024-Integrated-Report-and-Financial-Statements.pdf"},{label:"Audited Financial Statements FY2024",url:"https://equitygroupholdings.com/wp-content/uploads/2025/03/Equity-Group-Holdings-PLC-Audited-Financial-Statements-for-the-Year-Ended-31st-December-2024.pdf"}]},
    DANGCEM:{name:"Dangote Cement Plc",exchange:"NGX",currency:"NGN",ir:"https://cement.dangote.com/annual-report-2024/",reports:[{label:"Annual Report FY2024",url:"https://www.dangotecement.com/wp-content/uploads/2025/05/Dangote-Cement-FY-2024-Annual-Report.pdf"},{label:"Full Year 2024 Account (Audited)",url:"https://cement.dangote.com/wp-content/uploads/2025/03/Dangote-Cement-Full-Year-2024-Account.pdf"}]},
    MTNN:{name:"MTN Nigeria Communications Plc",exchange:"NGX",currency:"NGN",ir:"https://www.mtn.ng/investors/annual-report/",reports:[{label:"Financial Reporting Library (FY2025 audited, FY2024, ...)",url:"https://www.mtn.ng/investors/financial-reporting/"}]},
    COMI:{name:"Commercial International Bank (Egypt)",exchange:"EGX",currency:"EGP",ir:"https://www.cibeg.com/en/investor-relations",reports:[{label:"Annual Report 2025",url:"https://www.cibeg.com/-/media/project/downloads/investor-relations/ir-library/annual-reports/2025/cib-ar-2025-final.pdf"},{label:"Annual Report 2024",url:"https://www.cibeg.com/-/media/project/downloads/investor-relations/ir-library/annual-reports/2024/cib-ar-2024-final.pdf"},{label:"Financial Statements 2024",url:"https://annualreport24.cibeg.com/documents/CIB-AR24-Financial-Statements.pdf"}]},
    SBK:{name:"Standard Bank Group Ltd",exchange:"JSE",currency:"ZAR",ir:"https://www.standardbank.com/sbg/standard-bank-group/investor-relations/results-and-reports",reports:[{label:"Annual Integrated Report 2025",url:"https://www.standardbank.com/static_file/StandardBankGroup/filedownloads/RTS/2025/SBG_AnnualIntegratedReport2025.pdf"},{label:"Annual Financial Statements 2024",url:"https://www.standardbank.com/static_file/Investor%20Relations/Documents/Financial-results/Annual-Results/SBG_2024_Annual-Financial-Statements.pdf"}]},
    SOL:{name:"Sasol Limited",exchange:"JSE",currency:"ZAR",ir:"https://www.sasol.com/investor-centre",reports:[{label:"Integrated Report 2024",url:"https://www.sasol.com/sites/default/files/2024-09/SASOL-Integrated-Report-2024.pdf"}]},
    EABL:{name:"East African Breweries Plc",exchange:"NSE",currency:"KES",ir:"https://www.eabl.com/investors/annual-reports",reports:[{label:"Integrated Annual Report 2024",url:"https://www.eabl.com/~/media/Files/E/eabl/documents/investor/annual-reports/2024/eabl-2024-annual-report-interactive-version.pdf"}]},
    KCB:{name:"KCB Group Plc",exchange:"NSE",currency:"KES",ir:"https://africanfinancials.com/document/ke-kcb-2024-ar-00/",reports:[{label:"Annual Report 2024 (via AfricanFinancials)",url:"https://africanfinancials.com/document/ke-kcb-2024-ar-00/"}]},
    GTCO:{name:"Guaranty Trust Holding Company Plc",exchange:"NGX",currency:"NGN",ir:"https://www.gtcoplc.com/investor-relations/annual-reports",reports:[{label:"Annual Report FY2024",url:"https://gtbank-plc.files.svdcdn.com/production/annual-reports/2024-annual-report/GTCO-FY-2024-Annual-Report.pdf"}]},
    NESTLE:{name:"Nestle Nigeria Plc",exchange:"NGX",currency:"NGN",ir:"https://africanfinancials.com/document/ng-nestle-2024-ar-00/",reports:[{label:"Annual Report 2024",url:"https://www.nestle-cwa.com/sites/g/files/pydnoa346/files/2025-05/2024-Annual-Report-of-Nestle-Nigeria-PLC.pdf"}]},
    ETEL:{name:"Telecom Egypt",exchange:"EGX",currency:"EGP",ir:"https://ir.te.eg/en/FinancialInformation/AnnualReports",reports:[{label:"Annual Reports (IR library)",url:"https://ir.te.eg/en/FinancialInformation/AnnualReports"}]},
    HRHO:{name:"EFG Holding",exchange:"EGX",currency:"EGP",ir:"https://efgholding.com/en/investor-relations/annual-reports",reports:[{label:"FY2024 Earnings Release",url:"https://efgholding.com/uploads/EFG_Holding_FY_24_Earnings_Release_325e534d9b.pdf"}]},
  };

  var SCHEMA={
    income:[["revenue","Revenue"],["costOfSales","Cost of Sales"],["grossProfit","Gross Profit"],
      ["operatingExpenses","Operating Expenses"],["operatingProfit","Operating Profit (EBIT)"],
      ["netFinanceCosts","Net Finance Costs"],["profitBeforeTax","Profit Before Tax"],
      ["taxExpense","Income Tax"],["netProfit","Net Profit"],["eps","EPS"],
      ["roe","ROE (%)"],["roa","ROA (%)"],["netMargin","Net Margin (%)"],
      ["grossMargin","Gross Margin (%)"],["opMargin","Operating Margin (%)"],
      ["debtToEquity","Debt to Equity"]],
    balance:[["nonCurrentAssets","Non-current Assets"],["currentAssets","Current Assets"],
      ["cashAndEquivalents","Cash & Equivalents"],["totalAssets","Total Assets"],
      ["nonCurrentLiabilities","Non-current Liabilities"],["currentLiabilities","Current Liabilities"],
      ["totalLiabilities","Total Liabilities"],["totalEquity","Total Equity"]],
    cashflow:[["operatingCashFlow","Operating Cash Flow"],["capex","Capital Expenditure"],
      ["freeCashFlow","Free Cash Flow"],["investingCashFlow","Investing Cash Flow"],
      ["financingCashFlow","Financing Cash Flow"],["netChangeInCash","Net Change in Cash"]]
  };
  var TOTAL_KEYS={grossProfit:1,operatingProfit:1,netProfit:1,totalAssets:1,totalLiabilities:1,
    totalEquity:1,freeCashFlow:1,netChangeInCash:1};

  // Label -> schema-key aliases, in PRIORITY order (first match wins). Statement
  // files use issuer-varied labels ("Turnover", "Net Interest Income", "Insurance
  // Revenue", "Profit for the year", ...); map them onto the canonical display keys.
  var KEY_ALIASES={
  revenue:["revenue","total revenue","revenue total","total operating income","total operating income (revenue)","total insurance revenue","insurance revenue","turnover","net revenue","gross sales","net sales","sales","revenue from contracts with customers","revenues from contracts with customers","revenue (operating income)","rental and related income","rental income","total income","gross written premium","gross written premiums","net earned premium","net earned premiums","net interest income","total interest income","electricity revenue","trading revenue","trading income","interest revenue calculated using the effective interest method"],
  costOfSales:["cost of sales","cost of revenue","cost of operations","cost of production","cost of services"],
  grossProfit:["gross profit","gross profit total"],
  operatingExpenses:["operating expenses","operating expenses total","total operating expenses","total operating costs","administration and other expenses","administrative expenses","administration and general expenses","selling and distribution expenses","selling and distribution costs","selling and administrative expenses","distribution costs","general and administrative expenses","operating and administrative expenses","administrative costs","administration costs","administration","establishment expenses","administration and establishment expenses"],
  operatingProfit:["operating profit (ebit)","operating profit","operating loss","results from operating activities"],
  netFinanceCosts:["net finance costs","finance costs","finance cost","net finance income","finance costs (net)","finance income/(cost)","finance (cost)/income","interest expense","total interest expenses"],
  profitBeforeTax:["profit before tax","profit before income tax","loss before tax","loss before income tax","profit before taxation","profit before tax and exceptional items","profit before income tax total"],
  taxExpense:["income tax","income tax expense","income tax credit","income tax charge","tax expense","tax charge","taxation","tax","income tax (expense)/credit","income tax expense/credit","income tax credit/(expense)","income tax credit/(charge)","income tax (charge)/credit","tax (charge)/credit","taxation charge","taxation charge/ credit","taxation (credit)","tax credit","tax income (expense)","taxation credit"],
  netProfit:["net profit","net income","profit for the year","profit after tax","profit attributable to owners of the company","profit attributable to equity holders","loss for the year","(loss)/profit for the year","profit/(loss) for the year","profit/(loss) for the period","profit/(loss) after taxation","profit from continuing operations","total comprehensive income","total comprehensive profit/(loss) for the year","total profit/loss","profit/loss"],
  eps:["eps","earnings per share","basic earnings per share (shs)","basic and diluted earnings per share (kshs)","earnings per share (kshs)","loss per share (ksh)","basic eps","diluted eps"],
  roe:["roe (%)","roe"],roa:["roa (%)","roa"],
  netMargin:["net margin (%)","net margin"],grossMargin:["gross margin (%)","gross margin"],
  opMargin:["operating margin (%)","operating margin"],debtToEquity:["debt to equity"],
  nonCurrentAssets:["non-current assets","non current assets","noncurrent assets","total non-current assets"],
  currentAssets:["current assets","total current assets"],
  cashAndEquivalents:["cash & equivalents","cash and cash equivalents","cash and bank balances","cash & bank balances","cash and balances with central banks","cash and balances with banking institutions","cash & cash equivalents","cash balances","bank and cash balances","cash and balances with banks","cash (both local and foreign)","cash and bank balances and bank deposits","cash at bank and in hand","cash, bank and short term deposits"],
  totalAssets:["total assets"],
  nonCurrentLiabilities:["non-current liabilities","non current liabilities","noncurrent liabilities","total non-current liabilities"],
  currentLiabilities:["current liabilities","total current liabilities"],
  totalLiabilities:["total liabilities"],
  totalEquity:["total equity","total shareholders' equity","total shareholders equity","shareholders' equity","total stockholders' equity","capital and reserves"],
  operatingCashFlow:["operating cash flow","net cash from operating activities","net cash generated from operating activities","net cash flows from operating activities","net cash provided by operating activities","cash generated from operations","net cash generated from/(used in) operating activities","net cash flows used in operating activities","net cash from operations","cash generated from operating activities (total)","net cash used in operating activities","net cash generated from/(used in) operations","cash flows from/(to) operating activities","cash flows (used in)/generated from operating activities","net cash flows used in operations","net cash used in operations","net cash used for operations"],
  investingCashFlow:["investing cash flow","net cash from investing activities","net cash generated from investing activities","net cash flows from investing activities","net cash used in investing activities","net cash generated from/(used in) investing activities","cash used in investing activities (total)","net cash (used in) investing activities","cash flows from investing activities","net cash flows generated from investing activities","net cash flows generated from / (used in) investing activities"],
  financingCashFlow:["financing cash flow","net cash from financing activities","net cash generated from financing activities","net cash flows from financing activities","net cash used in financing activities","net cash generated from/(used in) financing activities","cash used in financing activities (total)","net cash (used in) financing activities","net cash (used in)/generated from financing activities","cash flows from financing activities","net cash flows used in financing activities","net cash generated from / (used in) financing activities","net cash used in/(generated from) financing activities"],
  capex:["capital expenditure","capex","purchase of property, plant and equipment","purchase of property and equipment","acquisition of property, plant and equipment","purchase of property plant and equipment","additions to property, plant and equipment","purchase of pp&e","purchase of property, plant & equipment","purchase of intangible assets","acquisition of intangible assets","additions to property and equipment","acquisition / purchase of property and equipment","additions to intangible assets"],
  freeCashFlow:["free cash flow"],
  netChangeInCash:["net change in cash","net increase in cash","net decrease in cash","net increase/(decrease) in cash","net (decrease)/increase in cash","net increase/(decrease) in cash and cash equivalents","increase/(decrease) in cash and cash equivalents","net movement in cash and cash equivalents","net (decrease)/increase in cash and cash equivalents","net increase in cash resources","net increase in cash and cash equivalents","net increase in cash and cash equivalents during the year"]
  };

  var DASH="-";
  function fmtMoney(v,cur){
    if(v===null||v===undefined||isNaN(v))return DASH;
    var f=+v,s=f<0?"-":"",a=Math.abs(f),o;
    if(a>=1e12)o=(a/1e12).toFixed(1)+"T";
    else if(a>=1e9)o=(a/1e9).toFixed(1)+"B";
    else if(a>=1e6)o=(a/1e6).toFixed(1)+"M";
    else if(a>=1e3)o=(a/1e3).toFixed(1)+"K";
    else o=a.toFixed(1);
    return s+o+(cur?" "+cur:"");
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

  function filingsFor(t){
    if(FILINGS[t]) return FILINGS[t];
    // financials_index.json carries ONLY name / currency / exchange / marketCap /
    // source for each security - it has no per-company filing URLs (0 of its 1613
    // entries carry a "filings" key). So return the real identity from the keys
    // that ARE present, with an EMPTY reports list; that makes the panel render
    // its truthful "no verified filing links on file" state instead of a dead
    // branch that could never fire. Filing URLs are never invented here.
    if(window.__FIN_IDX){
      var e = window.__FIN_IDX[t] || window.__FIN_IDX[String(t).split(".")[0]];
      if(e){
        return {
          name: e.name || t, exchange: e.exchange, currency: e.currency,
          source: e.source || "", reports: []
        };
      }
    }
    return null;
  }

  function renderScaffold(rec){
    // Always renders the statement scaffold with dashes (no fabricated numbers)
    // plus a real filings list. `rec.values` is used only if a real server
    // supplied FILED numbers; otherwise everything is a dash.
    var body=document.getElementById("body");
    var cur=rec&&rec.currency?rec.currency:null;
    document.getElementById("curBadge").textContent=cur||DASH;
    // The key (an EGX ISIN) stays internal; the reader sees the ticker and the
    // company name. Fall back to the key only when nothing resolves it.
    var lab=labelFor(state.ticker);
    // The selection carried the exchange's own ticker and name, so a key the
    // listing has not resolved yet is never printed where the ticker belongs.
    var known=(SEL_LABEL && String(SEL_LABEL.key||"").toUpperCase()===String(state.ticker).toUpperCase())?SEL_LABEL:null;
    var dispTicker=(lab&&lab.ticker)?lab.ticker:(known&&known.ticker?known.ticker:state.ticker);
    // The header names the LISTED security, which is what FOCUS and CHART show;
    // a statement file's own issuer label stays where it belongs, in the table
    // heading below, so the three panels cannot disagree about the company.
    var dispName=(known&&known.name)?known.name:((rec&&rec.name)||(lab&&lab.name)||"");
    document.getElementById("coName").textContent=dispName;
    document.getElementById("tkr").textContent=dispTicker;


    var sch=SCHEMA[state.statement];
    var per=(rec&&rec.periods&&rec.periods.length)?rec.periods:["Latest"];
    var vals=(rec&&rec.values)||{};
    var derivedSet={}, derivedFrom={}, dcell={}, dform={};
    // per-CELL derived markers: a row can carry filed values for some
    // periods and a computed value for others, so mark the cell, not the
    // row, and never label a filed figure as computed.

    // normalize: files store rows as [{label,values:[...]}] - map by label (with
    // issuer-varied aliases) to schema keys, in priority order (first match wins)
    if(!Object.keys(vals).length && rec && rec.rows && rec.rows.length){
      var normL = function(s){return String(s==null?"":s).trim().toLowerCase().replace(/\s+/g," ");};
      var lmap = {};
      (rec.rows||[]).forEach(function(rw){
        var l = normL(rw.label);
        if(!(l in lmap)){ lmap[l] = rw.values || []; if(rw.derived){ derivedSet[l]=true; derivedFrom[l]=rw.derived_from||rw.derivedFrom||rw.formula||"computed"; }
          if(rw.derivedCells && rw.derivedCells.length){ dcell[l]=rw.derivedCells; dform[l]=rw.derivedCellFormula||rw.derivedFrom||"computed from filed values"; } }
      });
      sch.forEach(function(p){
        var key = p[0], aliases = KEY_ALIASES[key] || [normL(p[1])];
        for(var i=0;i<aliases.length;i++){
          var a = normL(aliases[i]);
          if(a in lmap){ vals[key] = lmap[a]; if(derivedSet[a]){ derivedSet[key]=true; derivedFrom[key]=derivedFrom[a]; }
            if(dcell[a]){ dcell[key]=dcell[a]; dform[key]=dform[a]; } break; }
        }
      });
    }
    // A statement with no figures at all must say so in words, not render a grid
    // of dashes a reader cannot tell from a broken site. This is the honest,
    // named-absence state: name the company, name the statement, and say why the
    // space is empty. Statement data is never invented to fill it.
    var hasRows = !!(rec && rec.rows && rec.rows.length);
    var hasVals = !!(rec && rec.values && Object.keys(rec.values).length);
    if(!hasRows && !hasVals){
      var who = dispTicker ? (dispTicker + (dispName ? " (" + dispName + ")" : "")) : state.ticker;
      var aReps = ((rec && rec.reports) || []).filter(function(rp){ return rp && rp.url; });
      // If the statement file itself says WHY it holds nothing (an ETF or ETN
      // that publishes no statements, a cash flow the issuer does not disclose),
      // print that reason.
      var note = (rec && rec.reason) ? esc(rec.reason) : '';
      var a = '<div class="empty">' + esc(STMT_TITLE()) + ' not on file for ' + esc(who) + '.' +
        (note ? ' ' + note : '') +
        '</div>';
      if(aReps.length){
        a += '<div style="padding:10px 14px;border-top:1px solid var(--line2)">' +
          '<div style="color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Filings</div>';
        aReps.forEach(function(lk){
          a += '<a class="filing" href="' + esc(lk.url) + '" target="_blank" rel="noopener" style="display:inline-block;margin:2px 8px 2px 0">' + esc(lk.label || "Filing") + '</a>';
        });
        a += '</div>';
      }
      document.getElementById("body").innerHTML = a;
      return;
    }

    var h='<table><thead><tr><th>'+STMT_TITLE()+(dispTicker?(' &middot; '+esc(dispTicker)):'')+(dispName?(' &middot; '+esc(dispName)):'')+'</th>';
    for(var i=0;i<per.length;i++)h+='<th>'+esc(per[i])+'</th>';
    h+='</tr></thead><tbody>';
    for(var r=0;r<sch.length;r++){
      var key=sch[r][0],lbl=sch[r][1],series=vals[key]||[],isTot=TOTAL_KEYS[key];
      var dv = derivedSet[key]
        ? '<span title="'+esc('derived: '+(derivedFrom[key]||'computed from filed values'))+'" style="color:var(--tx3);font-style:italic">&#8776;</span> '
        : '';
      h+='<tr class="'+(isTot?'total':'')+'"><td class="item">'+dv+esc(lbl)+'</td>';
      for(var c=0;c<per.length;c++){
        var v=series[c];
        var disp;
        if(key==="eps"){ disp=(v==null||isNaN(v)?DASH:(+v).toFixed(2)); }
        else if(key==="roe"||key==="roa"||key==="netMargin"||key==="grossMargin"||key==="opMargin"){ disp=(v==null||isNaN(v)?DASH:(+v).toFixed(1)+"%"); }
        else if(key==="debtToEquity"){ disp=(v==null||isNaN(v)?DASH:(+v).toFixed(2)+"x"); }
        else { disp=fmtMoney(v,cur); }
        var neg=(typeof v==="number"&&v<0)?' class="neg"':'';
        var dc=dcell[key], isDCell=(dc&&dc.indexOf&&dc.indexOf(c)>=0);
        var dm=isDCell?(' <span title="'+esc(dform[key]||"computed from filed values")+'" style="color:var(--tx3);font-style:italic">&#8776;</span>'):'';
        h+='<td'+neg+'>'+esc(disp)+dm+'</td>';
      }
      h+='</tr>';
    }
    h+='</tbody></table>';

    // real filings list (primary-source PDFs)
    var srcUrl=(rec&&(rec.source_url||rec.ir_url||rec.ir))||null;
    var reps=(rec&&rec.reports)||[];
    var links=[];
    if(srcUrl) links.push({label:"Source document",url:srcUrl});
    (reps||[]).forEach(function(rp){ if(rp&&rp.url) links.push({label:rp.label||"Filing",url:rp.url}); });
    if(links.length){
      h+='<div style="padding:10px 14px;border-top:1px solid var(--line2)">'+
         '<div style="color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Filings</div>';
      links.forEach(function(lk){
        h+='<a class="filing" href="'+esc(lk.url)+'" target="_blank" rel="noopener" style="display:inline-block;margin:2px 8px 2px 0">'+esc(lk.label)+'</a>';
      });
      h+='</div>';
    } else {
      h+='<div class="empty">No verified filing links on file for '+esc(state.ticker)+'.</div>';
    }
    body.innerHTML=h;
  }

  // ---- bot analysis -------------------------------------------------------
  // Ratios, models and flags computed by market_bot.py from the very statement
  // rendered above. One small per-ticker file, matching how statements ship.
  var ANALYTICS = {};

  function fmtVal(v, unit){
    if(v == null || isNaN(v)) return DASH;
    var n = Number(v);
    if(unit === '%') return n.toFixed(2) + '%';
    if(unit === 'x') return n.toFixed(2) + 'x';
    // A statement figure arrives in whole units (a net profit of 61634295000),
    // which printed raw. Give it a readable scale so the analysis block reads
    // like the statement above it.
    var a = Math.abs(n), s = n < 0 ? '-' : '', suf = unit ? ' ' + unit : '';
    if(a >= 1e12) return s + (a/1e12).toFixed(2) + 'T' + suf;
    if(a >= 1e9)  return s + (a/1e9).toFixed(2) + 'B' + suf;
    if(a >= 1e6)  return s + (a/1e6).toFixed(2) + 'M' + suf;
    if(a >= 1e3)  return s + Math.round(a).toLocaleString('en-US') + suf;
    return n.toFixed(2) + suf;
  }

  function renderAnalysis(a){
    var body = document.getElementById('body');
    if(!body || !a) return;
    // renderScaffold replaces the table but a pending fetch can land twice
    // (statement switch, or a second render before the first resolved), which
    // appended the analysis block over and over. Clear any previous one first.
    var prev = body.querySelector('.an');
    if(prev) prev.remove();
    var h = '<div class="an"><h4>Analysis' + (a.period ? ' &middot; ' + esc(a.period) : '') + '</h4><div class="an-grid">';
    (a.ratios || []).forEach(function(r){
      h += '<div class="an-row"><span>' + esc(r.label) + '</span><span>' +
           fmtVal(r.value, r.unit) + '</span></div>';
    });
    var v = a.valuation || {};
    [['P/E', v.pe, ''], ['P/B', v.pb, ''], ['Earnings yield', v.earnings_yield, '%']].forEach(function(p){
      if(p[1] != null) h += '<div class="an-row"><span>' + p[0] + '</span><span>' + fmtVal(p[1], p[2]) + '</span></div>';
    });
    var m = a.models || {};
    if(m.fscore != null) h += '<div class="an-row"><span>Piotroski F-Score</span><span>' + m.fscore + '/' + m.fscoreOutOf + '</span></div>';
    if(m.altmanZ != null) h += '<div class="an-row"><span>Altman Z&Prime;</span><span>' + Number(m.altmanZ).toFixed(2) + ' ' + esc(m.altmanBand || '') + '</span></div>';
    if(m.accruals != null) h += '<div class="an-row"><span>Accruals</span><span>' + Number(m.accruals).toFixed(2) + '%</span></div>';
    if(m.costToIncome != null) h += '<div class="an-row"><span>Cost-to-income</span><span>' + Number(m.costToIncome).toFixed(2) + '%</span></div>';
    h += '</div>';

    if((a.flags || []).length){
      h += '<div class="an-chips">' + a.flags.map(function(f){
        var cl = f.severity === 'high' ? 'hi' : (f.severity === 'medium' ? 'md' : '');
        return '<span class="an-chip ' + cl + '">' + esc(String(f.id).replace(/_/g, ' ')) + '</span>';
      }).join('') + '</div>';
    }

    // A withheld multiple is absent above (never a zero). The row states that it
    // is withheld; the reason is not printed.
    var wd = [];
    [['P/E','pe'],['P/B','pb'],['P/S','ps'],['Earnings yield','earnings_yield'],
     ['EV/EBIT','ev_ebit']].forEach(function(p){
      if(v[p[1]] == null && v[p[1]+'_withheld'] === true)
        wd.push('<div class="an-wd"><b>' + esc(p[0]) + ' withheld</b></div>');
    });
    (a.ratios || []).forEach(function(r){
      if(r && r.withheld === true && r.value == null)
        wd.push('<div class="an-wd"><b>' + esc(r.label || r.key) + ' withheld</b></div>');
    });
    if(wd.length) h += wd.join('');
    h += '</div>';
    body.insertAdjacentHTML('beforeend', h);
  }

  var ANALYTICS_INFLIGHT = {};

  function loadAnalysis(){
    var t = state.ticker;
    if(!t) return;
    if(ANALYTICS[t] !== undefined){ renderAnalysis(ANALYTICS[t]); return; }
    if(ANALYTICS_INFLIGHT[t]) return;      // one request per ticker, not one per render
    ANALYTICS_INFLIGHT[t] = 1;
    // The analytics file is keyed by the same ticker as the statement file, so try
    // the same candidate spellings before giving up (a request carrying the ISIN
    // form still gets the company's analytics).
    var keys = dataKeys(t);
    (function tryKey(i){
      if(i >= keys.length){ ANALYTICS[t] = null; delete ANALYTICS_INFLIGHT[t]; return; }
      fetch('../../static_data/analytics/' + encodeURIComponent(String(keys[i]).replace(/\//g, '_')) + '.json')
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(d){ ANALYTICS[t] = d; delete ANALYTICS_INFLIGHT[t]; if(state.ticker === t) renderAnalysis(d); })
        .catch(function(){ tryKey(i+1); });
    })(0);
  }

  function render(rec){ PENDING=false; renderScaffold(rec); loadAnalysis(); }
  function STMT_TITLE(){return {income:"Income Statement",balance:"Balance Sheet",
    cashflow:"Cash Flow Statement"}[state.statement];}

  function setStatus(source,asOf){
    var dot=document.getElementById("dot"),lab=document.getElementById("srcLabel");
    dot.className="dot";
    if(source==="FILED"){dot.classList.add("live");lab.textContent="FILED";}
    else if(source==="LINKS"){lab.textContent="filing links";}
    else if(source==="NONE"){lab.textContent="no filings on file";}
    else{dot.classList.add("live");lab.textContent="";}
    document.getElementById("asOf").textContent=asOf?("as of "+asOf):"";
  }

  // ---- the selection handed over by the shell ------------------------------
  // THE NAME, THE PRICE AND THE CHANGE DO NOT WAIT FOR A STATEMENT FILE. The
  // shell holds this security's row already (its listing carries the snapshot's
  // price), so it hands the row over with the selection and this panel paints the
  // identity and the quote in the same task as the click: no document load and no
  // request between the click and the ticker. The statement files are read
  // afterwards, guarded by a generation counter, so a slow reply for the security
  // the reader has just left can never land on the one now in the header.
  var GEN = 0;            // a slower earlier statement read never paints over a newer pick
  var SEL_LOCK = false;   // a selection painted this panel; loadSecurities must not overwrite it
  var SEL_LABEL = null;   // the ticker, name and currency the selection carried
  var PENDING = false;    // identity painted, the statement is still being read

  function numv(v){ if(v === null || v === undefined || v === "") return null; var n = Number(v); return isNaN(n) ? null : n; }
  function fmtPx2(a){ return Number(a).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  // the quote the shell handed over, in the header beside the ticker
  function paintQuote(sel){
    var box = document.getElementById("faQuote");
    if(!box) return;
    var r = (sel && sel.row) ? sel.row : null;
    var px = r ? numv(r.price) : null;
    var pct = r ? numv(r.chgPct) : null;
    var prev = r ? numv(r.prevClose) : null;
    var cur = (r && r.currency) || (SEL_LABEL && SEL_LABEL.currency) || "";
    var h = [];
    if(r && (r.priceWithheld || r.withhold_reason)){
      h.push('<span class="k">last</span><span class="v warn">price withheld</span>');
    } else if(!r && sel && sel.absent){
      // the shell's listing has no row for this security, which is the same fact
      // FOCUS and CHART state on their own cards
      h.push('<span class="k">last</span><span class="v nofig">not in the snapshot</span>');
    } else if(px == null){
      h.push('<span class="k">last</span><span class="v nofig">no current quote</span>');
    } else {
      var dir = pct == null ? "nofig" : (pct > 0 ? "up" : (pct < 0 ? "down" : "flat"));
      h.push('<span class="k">last</span><span class="v px ' + dir + '">' + esc(fmtPx2(px)) + '</span>' +
             (cur ? '<span class="v sm">' + esc(cur) + '</span>' : ''));
      if(pct == null){
        h.push('<span class="v nofig">change not stated</span>');
      } else {
        h.push('<span class="v ' + dir + '">' + (pct >= 0 ? "+" : "") + pct.toFixed(2) + '%</span>');
        // the level change is printed only when the row's own percent agrees with
        // price - prevClose, the same rule the FOCUS card applies
        if(prev != null && prev !== 0 && Math.abs(((px - prev) / prev * 100) - pct) <= 0.02){
          var lv = px - prev;
          h.push('<span class="k">chg</span><span class="v ' + dir + '">' +
                 (lv >= 0 ? "+" : "") + esc(fmtPx2(lv)) + '</span>');
        }
      }
    }
    if(r && r.asOf) h.push('<span class="k">as of</span><span class="v sm">' + esc(r.asOf) + '</span>');
    box.innerHTML = h.join("");
    box.className = "fa-q on";
  }
  function paintIdentity(sel){
    var r = (sel && sel.row) ? sel.row : null;
    var t = String((r && (r.ticker || r.sym)) || (sel && sel.sym) || "").toUpperCase();
    SEL_LABEL = {key: String(state.ticker || "").toUpperCase(), ticker: t,
                 name: (r && r.name) || "", currency: (r && r.currency) || ""};
    document.getElementById("tkr").textContent = t;
    document.getElementById("coName").textContent = SEL_LABEL.name;
    paintQuote(sel);
  }
  // The figures of the previous security go BEFORE the fetch, so none of them can
  // be read as this company's statement while the new file is on its way.
  function pendingBody(){
    PENDING = true;
    var body = document.getElementById("body");
    if(body) body.innerHTML = '<div class="empty">Reading the ' + esc(STMT_TITLE().toLowerCase()) +
      ' for ' + esc((SEL_LABEL && SEL_LABEL.ticker) || state.ticker) + '.</div>';
    var lab = document.getElementById("srcLabel");
    if(lab) lab.textContent = "reading the statement file";
    var dot = document.getElementById("dot");
    if(dot) dot.className = "dot";
    var asOf = document.getElementById("asOf");
    if(asOf) asOf.textContent = "";
  }
  // The shell calls this directly (same origin), so the paint lands in the task
  // that ran the click. False means another exchange, and the shell re-points it.
  window.__mtApplySelection = function(sel){
    if(!sel || !sel.sym) return false;
    if(String(sel.ex || state.ex).toUpperCase() !== state.ex) return false;
    state.ticker = String(sel.sym).toUpperCase();
    state.sym = state.ticker;
    SEL_LOCK = true;
    paintIdentity(sel);
    pendingBody();
    load();          // the statement files for the new security, guarded by GEN
    return true;
  };
  if(window.addEventListener){
    window.addEventListener("message", function(ev){
      if(!ev || ev.origin !== location.origin) return;
      var d = ev.data;
      if(d && d.__mt === "selection") window.__mtApplySelection(d);
    });
  }
  // the proof surface: what this panel believes, readable from the DOM
  window.__mtFinState = function(){
    var body = document.getElementById("body");
    var head = body ? body.querySelector("thead th") : null;
    var per = body ? Array.prototype.map.call(body.querySelectorAll("thead th"), function(th){
      return String(th.textContent || "").trim(); }) : [];
    return {
      ticker: state.ticker, ex: state.ex, statement: state.statement, period: state.period,
      pending: PENDING, gen: GEN, label: SEL_LABEL,
      rows: body ? body.querySelectorAll("tbody tr").length : 0,
      periods: per.slice(1), heading: head ? String(head.textContent || "").trim() : "",
      src: (document.getElementById("srcLabel") || {}).textContent || "",
      currency: (document.getElementById("curBadge") || {}).textContent || "",
      bodyText: body ? String(body.textContent || "").slice(0, 400) : ""
    };
  };
  // A PANEL OPENED AFTER A SELECTION SHOWS THAT SECURITY AT ONCE. The shell's
  // selection is the truth here, so a frame built without ?sym= adopts it rather
  // than reading this exchange's default first.
  function seedFromShell(){
    try{
      var p = window.parent;
      if(!p || p === window || !p.__mtSelection) return false;
      var sel = p.__mtSelection;
      if(String(sel.ex || state.ex).toUpperCase() !== state.ex) return false;
      if(state.ticker && String(sel.sym || "").toUpperCase() !== state.ticker) return false;
      return window.__mtApplySelection(sel) === true;
    }catch(e){ return false; }
  }
  // tell the shell this document is ready to be handed the selection
  function announceReady(){
    try{
      if(window.parent && window.parent !== window) window.parent.postMessage({__mt: "sel-ready"}, location.origin);
    }catch(e){}
  }

  function load(){
    // no ticker selected yet - wait for loadSecurities to pick the first
    if(!state.ticker) return;
    // Resolve the display ticker/name (an EGX ISIN is the KEY, not the label)
    // before the first render, so the header never shows the key to a reader.
    if(!LABELS){ loadLabels().then(function(){ load(); }); return; }
    var gen = ++GEN;      // this read owns the panel only while no newer one has started
    // Try each candidate key the request may be spelled as (the request, the
    // listing ticker it resolves to, a documented retired alias) until one has a
    // statement file. Then the real endpoint; offline, the scaffold names the
    // absence rather than rendering fabricated numbers.
    var keys = dataKeys(state.ticker);
    // A statement file that exists but carries available:false states its OWN
    // reason (an ETF/ETN that publishes no statements, a cash flow the issuer
    // does not disclose). Keep that reason so the panel names the real cause
    // instead of a generic "no verified source" line.
    var noDataReason = null;
    (function tryKey(i){
      if(gen !== GEN) return;                 // a newer selection owns the panel now
      if(i >= keys.length){ apiFallback(); return; }
      var stFile = "../../static_data/financials/" +
                   encodeURIComponent(String(keys[i]).replace(/\//g, "_")) +
                   "__" + state.statement + ".json";
      fetch(stFile).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
        if(gen !== GEN) return;               // this file belongs to the previous security
        if(d && d.available !== false){
          // credit the real provider - JSE/EGX statements come from Yahoo, but
          // NGX/NSE come from AfricanFinancials filings and were being labelled
          // "Yahoo Finance" regardless
          render(d); setStatus("");
          return;
        }
        if(d && (d.source_note || d.note)) noDataReason = d.source_note || d.note;
        throw 0;
      }).catch(function(){ if(gen !== GEN) return; tryKey(i+1); });
    })(0);

    function apiFallback(){
      if(gen !== GEN) return;
      var url="/api/financials?ticker="+encodeURIComponent(state.ticker)+
              "&statement="+state.statement+"&period="+state.period;
      fetch(url).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      if(gen !== GEN) return;                  // a newer selection owns the panel now
      var fil=filingsFor(state.ticker)||{};
      if(!d||d.available===false){
        render({periods:[],name:d&&d.name||fil.name,currency:d&&d.currency||fil.currency,
                ir:(d&&d.ir_url)||fil.ir,reports:fil.reports||[],reason:noDataReason});
        setStatus(fil.reports&&fil.reports.length?"LINKS":"NONE",null);
        return;
      }
      var vals={};(d.rows||[]).forEach(function(row){vals[row.key]=row.values;});
      render({periods:d.periods,currency:d.currency,values:vals,
              ir:d.source_url||d.ir_url||fil.ir,name:d.name,reports:fil.reports||[]});
      setStatus(d.source||"FILED",d.filedAsOf);
    }).catch(function(){
      if(gen !== GEN) return;                  // a newer selection owns the panel now
      var fil=filingsFor(state.ticker);
      render(fil?{name:fil.name,currency:fil.currency,ir:fil.ir,reports:fil.reports,periods:[],reason:noDataReason}:{periods:[],reason:noDataReason});
      setStatus(fil&&fil.reports&&fil.reports.length?"LINKS":"NONE",null);
    });
    }
  }

  // ---- controls ----
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(x){
        x.setAttribute("aria-pressed", x===b ? "true":"false");});
      state.statement=b.getAttribute("data-st");load();
    });
  });
  document.getElementById("period").addEventListener("change",function(e){
    state.period=e.target.value;load();});

  // command-bar hook
  window.showFinancials=function(ticker){
    if(ticker)state.ticker=String(ticker).toUpperCase();
    load();
  };

  // ---- security selector: dropdown of securities WITH financials ----
  function loadSecurities(){
    // only securities that HAVE financial statements (financials_index.json),
    // filtered to the panel's exchange (?ex=JSE etc.)
    fetch("../../static_data/financials_index.json").then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(idx){
      window.__FIN_IDX = idx;
      var all = [];
      Object.keys(idx || {}).forEach(function(k){
        var v = idx[k] || {};
        var ex = (v.exchange || "").toUpperCase();
        if(state.ex && ex !== state.ex) return;  // respect the panel's exchange
        var tkr = String(k).toUpperCase();
        var nm = v.name || "";
        all.push({t: tkr, n: nm});
      });
      // dedupe + sort by ticker
      var seen = {};
      all.forEach(function(s){ if(!seen[s.t]) seen[s.t] = s; });
      SECS = Object.keys(seen).sort().map(function(k){ return seen[k]; });
      var dl = document.getElementById("secList");
      if(dl){
        // The option VALUE stays the internal key (the statement file is named
        // for it); the option TEXT shows the ticker the reader knows.
        loadLabels().then(function(){
          dl.innerHTML = SECS.map(function(s){
            var lab = labelFor(s.t);
            var tkr = (lab && lab.ticker) ? lab.ticker : s.t;
            return '<option value="' + s.t + '">' + tkr + " · " + s.n.replace(/"/g, "") + '</option>';
          }).join("");
        }).catch(function(){});
      }
      var exLbl = document.getElementById("exLabel");
      if(exLbl) exLbl.textContent = state.ex + " · " + SECS.length + " securities";
      // ?sym= (Bloomberg-style sticky security) overrides the default pick
      var want = state.sym ? state.sym.toUpperCase() : '';
      var PREFERRED = {NSE:'SCOM', NGX:'DANGCEM', JSE:'MTN.JO', EGX:''};
      var pick = SECS.length ? SECS[0].t : '';
      var pref = PREFERRED[state.ex] || '';
      if(pref && SECS.length){
        for(var pi = 0; pi < SECS.length; pi++){
          var pk = SECS[pi].t;
          if(pk === pref || pk.split('.')[0] === pref){ pick = pk; break; }
        }
      }
      var found = false;
      if(want && SECS.length){
        for(var si = 0; si < SECS.length; si++){
          var k = SECS[si].t;
          var kb = k.split('.')[0];
          if(k === want || kb === want || (want.indexOf('.') < 0 && k === want + '.' + state.ex)){ pick = k; found = true; break; }
        }
      }
      // a sticky ?sym= ticker wins even when it has no statement file yet:
      // show the requested name with an honest "no statements" state rather
      // than silently swapping in the exchange default
      if(want && !found) pick = want;
      // A SELECTION OUTRANKS THE DEFAULT PICK. When a selection has already
      // painted this panel, this index read (which can land after it) must not
      // swap in an exchange default or rewrite the ticker on screen.
      if(SEL_LOCK) return;
      // if the current ticker isn't in this exchange's list (or none set), pick
      if((!state.ticker || !Object.prototype.hasOwnProperty.call(seen, state.ticker)) && SECS.length){
        state.ticker = pick || SECS[0].t;
        load();
      }
    }).catch(function(){});
  }
  document.getElementById("secSel").addEventListener("change", function(e){
    var v = String(e.target.value || "").trim().toUpperCase();
    if(v){ state.ticker = v; load(); }
  });
  // the exchange picker was removed: state.ex comes from ?ex= and never changes
  // inside the panel, so there is no listener and nothing to sync here
  document.getElementById("secSel").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      var v = String(this.value || "").trim().toUpperCase();
      if(v){ state.ticker = v; load(); }
    }
  });
  // if the current ticker is in the list, show it in the box
  function syncSecSel(){
    var el = document.getElementById("secSel");
    if(el && state.ticker) el.value = state.ticker;
  }
  var _origLoad = load;
  load = function(){ syncSecSel(); _origLoad(); };
  loadSecurities();

  // this frame can take a selection in place; the shell asks before re-pointing
  try{ document.__mtSelAck = true; }catch(e){}
  // A PANEL OPENED AFTER A SELECTION SHOWS THAT SECURITY AT ONCE, instead of
  // reading this exchange's default first and being handed the selection on top.
  if(!seedFromShell()) load();
  announceReady();
})();
</script>
</body>
</html>
