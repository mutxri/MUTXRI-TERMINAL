<!DOCTYPE html>
<html lang="en"><head><script>(function(){var V='20261114024710';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script><meta charset="utf-8">
<title>SECF</title>
<style>
:root{--bg:#000;--line:#1c1c1c;--tx:#d8d8d8;--tx3:#7a7a7a;--acc:#33e29a;--down:#ff4d5e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.35 'Oxygen Mono',ui-monospace,monospace;height:100%}
#wrap{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-bottom:1px solid var(--line);background:#0d0d0d;flex:none}
.bar .t{letter-spacing:.07em;text-transform:uppercase;font-size:11px}
#q{flex:1;background:#0a0a0a;border:1px solid #262626;color:var(--tx);font:inherit;padding:4px 8px;border-radius:2px}
#q:focus{outline:none;border-color:var(--acc)}
.tabs{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);background:#080808;flex:none}
.tab{padding:1px 8px;border:1px solid var(--line);border-radius:2px;font-size:10.5px;cursor:pointer;color:var(--tx3)}
.tab.on{background:var(--acc);color:#000;border-color:var(--acc)}
.tw{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11.5px}
thead th{position:sticky;top:0;background:#0d0d0d;border-bottom:1px solid #262626;color:var(--tx3);font-weight:400;text-align:right;padding:4px 8px;white-space:nowrap}
thead th.l{text-align:left}
tbody td{border-bottom:1px solid #131313;padding:3px 8px;text-align:right;white-space:nowrap}
tbody td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:#141414}
.up{color:var(--acc)}.down{color:var(--down)}.dim{color:var(--tx3)}
.foot{height:24px;display:flex;align-items:center;gap:12px;padding:0 8px;border-top:1px solid var(--line);color:var(--tx3);font-size:10.5px;flex:none}
</style></head>
<body><div id="wrap">
  <div class="bar">
    <span class="t">Securities Finder</span>
    <input id="q" placeholder="ticker, company, sector…  (↑↓ to move, Enter to open)" autocomplete="off" autofocus>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tw"><table><thead><tr>
    <th class="l">Ticker</th><th class="l">Ex</th><th class="l">Name</th><th>Last</th><th>Chg %</th><th>Vol</th><th class="l">Sector</th><th class="l">Ccy</th>
  </tr></thead><tbody id="body"></tbody></table></div>
  <div class="foot"><span id="cnt"></span><span class="sp" style="flex:1"></span><span id="hint" class="dim"></span></div>
</div>
<script>

/* ---- where this panel's data comes from --------------------------------
   Built against serve_local.py, the development host that serves
   /api/parity/* out of the same static files the site ships. The DEPLOYED
   terminal has no such route: the call 404s to an HTML page, and a panel that
   only knew how to call it printed a JSON parse error where its table should
   be. Every read now goes through here. The parity route is tried first and
   used when it answers with JSON; otherwise the same answer is assembled in
   the browser out of static_data, which is what the deployed site serves. The
   panel therefore works in the terminal, on the development host and straight
   from the repo, and MX_SRC records which source answered. */
var MX_SRC = '';
function mxJSON(u){
  return fetch(u, {cache:'no-store'}).then(function(r){
    var nm = u.split('?')[0].split('/').pop();
    if(!r.ok) throw new Error(nm + ' ' + r.status);
    var ct = (r.headers.get('content-type') || '').toLowerCase();
    if(ct.indexOf('json') < 0) throw new Error(nm + ' did not answer with JSON');
    return r.json();
  });
}
function mxFirst(urls){
  var i = -1, last = null;
  function next(e){
    if(e) last = e;
    i++;
    if(i >= urls.length) throw (last || new Error('no file to read'));
    return mxJSON(urls[i]).catch(next);
  }
  return Promise.resolve().then(function(){ return next(null); });
}
function mxSnapshot(ex){
  ex = String(ex || 'NSE').toUpperCase();
  return mxJSON('/api/parity/snapshot?ex=' + encodeURIComponent(ex))
    .then(function(d){ MX_SRC = 'parity api'; return d; })
    .catch(function(){
      return mxFirst(['../../static_data/market_' + ex + '.json',
                      '../../static_data/heatmap_' + ex + '.json'])
        .then(function(d){
          d.stocks = d.stocks || [];
          d.count = d.stocks.length;
          d.exchange = d.exchange || ex;
          MX_SRC = 'static snapshot';
          return d;
        });
    });
}
function mxSearch(q){
  var term = String(q || '').trim().toLowerCase();
  return mxJSON('/api/parity/search?q=' + encodeURIComponent(q || ''))
    .then(function(d){ MX_SRC = 'parity api'; return d; })
    .catch(function(){
      var EXS = ['NGX', 'NSE', 'JSE', 'EGX'];
      return Promise.all(EXS.map(function(ex){
        return mxSnapshot(ex).catch(function(){ return {stocks:[]}; });
      })).then(function(all){
        var out = [], seen = {};
        all.forEach(function(d, k){
          (d.stocks || []).forEach(function(s){
            var sym = String(s.sym || s.ticker || ''), nm = String(s.name || '');
            if(!sym) return;
            if(term && sym.toLowerCase().indexOf(term) < 0 && nm.toLowerCase().indexOf(term) < 0) return;
            var key = sym.toUpperCase() + '|' + EXS[k];
            if(seen[key]) return;
            seen[key] = 1;
            out.push({sym:sym, name:s.name, ex:EXS[k], price:s.price, chgPct:s.chgPct,
                      volume:s.volume, currency:s.currency, sector:s.sector});
          });
        });
        MX_SRC = 'static snapshots';
        return {q:q, count:out.length, results:out.slice(0, 400)};
      });
    });
}
(function(){
  var qs=new URLSearchParams(location.search), EX0=(qs.get('ex')||'ALL').toUpperCase();
  var ST={ex:EX0,rows:[],sel:0,all:[]};
  var EXS=['ALL','NGX','NSE','JSE','EGX'];

  document.getElementById('tabs').innerHTML=EXS.map(function(e){
    return '<div class="tab'+(e===ST.ex?' on':'')+'" data-e="'+e+'">'+e+'</div>';
  }).join('');
  document.getElementById('tabs').onclick=function(ev){
    var t=ev.target.closest('.tab'); if(!t) return;
    [].forEach.call(this.children,function(x){x.classList.remove('on');});
    t.classList.add('on'); ST.ex=t.getAttribute('data-e'); search(true);
  };

  function fmt(n){ if(n==null||isNaN(n))return '—'; var a=Math.abs(n);
    if(a>=1e9)return (n/1e9).toFixed(2)+'B'; if(a>=1e6)return (n/1e6).toFixed(2)+'M'; if(a>=1e3)return (n/1e3).toFixed(1)+'K'; return String(Math.round(n)); }

  function search(){
    var q=document.getElementById('q').value.trim();
    mxSearch(q).then(function(d){
      var rows=(d.results||[]).filter(function(r){ return ST.ex==='ALL'||r.ex===ST.ex; });
      ST.rows=rows.slice(0,300); ST.sel=0; render();
    });
  }
  function render(){
    var tb=document.getElementById('body'); tb.innerHTML='';
    ST.rows.forEach(function(r,i){
      var pct=r.chgPct;
      var tr=document.createElement('tr');
      if(i===ST.sel) tr.className='sel';
      tr.innerHTML='<td class="l">'+r.sym+'</td><td class="l dim">'+r.ex+'</td><td class="l">'+(r.name||'')+'</td>'+
        '<td>'+(r.price==null?'—':r.price.toFixed(2))+'</td>'+
        '<td class="'+(pct==null?'':(pct>=0?'up':'down'))+'">'+(pct==null?'—':(pct>0?'+':'')+pct.toFixed(2)+'%')+'</td>'+
        '<td>'+fmt(r.volume)+'</td><td class="l dim">'+(r.sector||'')+'</td><td class="l dim">'+(r.currency||'')+'</td>';
      tr.onclick=function(){ open(r); };
      tr.onmouseenter=function(){ ST.sel=i; };
      tb.appendChild(tr);
    });
    document.getElementById('cnt').textContent=ST.rows.length+' instruments · '+ST.ex;
    document.getElementById('hint').textContent='search across NGX · NSE · JSE · EGX';
  }
  function open(r){
    parent.postMessage({type:'mx-open',sym:r.sym,cmd:'FOCUS',ex:r.ex},'*');
    var u='mx_focus.html?ex='+r.ex+'&sym='+encodeURIComponent(r.sym);
    if(window.parent===window) location.href=u;
  }
  var q=document.getElementById('q');
  var t=null;
  q.oninput=function(){ clearTimeout(t); t=setTimeout(search,160); };
  q.onkeydown=function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); ST.sel=Math.min(ST.sel+1,ST.rows.length-1); render(); scrollSel(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); ST.sel=Math.max(ST.sel-1,0); render(); scrollSel(); }
    if(e.key==='Enter'&&ST.rows[ST.sel]) open(ST.rows[ST.sel]);
  };
  function scrollSel(){ var el=document.querySelector('tr.sel'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  if(qs.get('q')){ q.value=qs.get('q'); }
  search();
})();
</script></body></html>
