<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - REG (Regulatory Wire) panel. Spec section 8 (P1).
  The trust differentiator: one scrolling feed of official regulator /
  central-bank releases across KE/NG/ZA/EG.

  Standalone-viewable: reads static_data/reg.json (the real regulator feed)
  when /api/reg isn't reachable. Vanilla JS, exact Godel tokens, no build step.

  INTEGRATE: lift the .reg-* markup into your right-panel tab set (new
  REG tab) and the <script> into your bundle. Wire the REG command to
  window.showReg(). No sample items are shipped.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - REG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --acc:#33e29a; --acc2:#1ecfb0;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .reg-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:560px; margin:24px auto; }
  .reg-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .reg-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .reg-title b { color:var(--acc); font-weight:700; }
  .reg-refresh { background:transparent; border:1px solid var(--line2); border-radius:2px; color:var(--tx2); font-family:var(--mono); font-size:11px; padding:4px 10px; cursor:pointer; }
  .reg-refresh:hover { border-color:var(--acc); color:var(--acc); }
  .reg-chips { display:flex; flex-wrap:wrap; gap:5px; padding:9px 14px; border-bottom:1px solid var(--line); }
  .reg-chip { font-family:var(--mono); font-size:10px; padding:2px 8px; border:1px solid var(--line2); border-radius:2px; color:var(--tx3); cursor:pointer; user-select:none; }
  .reg-chip:hover { border-color:var(--acc); color:var(--tx2); }
  .reg-chip.on { border-color:var(--acc); color:var(--acc); }
  .reg-feed { max-height:440px; overflow-y:auto; }
  .reg-item { display:block; padding:11px 14px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; }
  .reg-item:hover { background:var(--bg3); }
  .reg-meta { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .reg-badge { font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.05em; color:var(--acc); border:1px solid rgba(51,226,154,.4); border-radius:2px; padding:1px 6px; }
  .reg-country { font-family:var(--mono); font-size:10px; color:var(--tx3); }
  .reg-date { font-family:var(--mono); font-size:10px; color:var(--tx3); margin-left:auto; }
  .reg-headline { font-size:13px; line-height:1.45; color:var(--tx); }
  .reg-outlet { font-family:var(--mono); font-size:10px; color:var(--tx3); margin-top:3px; }
  .reg-empty { padding:36px 14px; text-align:center; color:var(--tx3); font-family:var(--mono); font-size:12px; }
  .reg-foot { padding:8px 14px; border-top:1px solid var(--line); color:var(--tx3); font-family:var(--mono); font-size:10px; }
</style>
</head>
<body>

<div class="reg-wrap" id="reg">
  <div class="reg-head">
    <div class="reg-title"><b>REG</b> · Regulatory Wire</div>
    <button class="reg-refresh" id="regRefresh">Refresh</button>
  </div>
  <div class="reg-chips" id="regChips"></div>
  <div class="reg-feed" id="regFeed"></div>
  <div class="reg-empty" id="regEmpty" style="display:none;">No releases available right now.</div>
  <div class="reg-foot" id="regFoot">-</div>
</div>

<script>
(function () {
  "use strict";
  var REG_ENDPOINT = "/api/reg";

  // Regulators, for the country/source filter chips.
  var REGULATORS = [
    { reg:"CMA", iso:"KE" }, { reg:"CBK", iso:"KE" },
    { reg:"SEC", iso:"NG" }, { reg:"CBN", iso:"NG" },
    { reg:"FSCA", iso:"ZA" }, { reg:"SARB", iso:"ZA" },
    { reg:"FRA", iso:"EG" }, { reg:"CBE", iso:"EG" }
  ];


  var activeIso = null; // null = all
  var allItems = [];

  function $(id) { return document.getElementById(id); }

  function relTime(iso) {
    if (!iso) return "-";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "-";
    var mins = Math.floor((Date.now() - then) / 60000);
    if (mins < 1) return "now";
    if (mins < 60) return mins + "m";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h";
    return Math.floor(hrs / 24) + "d";
  }

  function renderChips() {
    var isos = [];
    REGULATORS.forEach(function (r) { if (isos.indexOf(r.iso) === -1) isos.push(r.iso); });
    var chips = ['<span class="reg-chip' + (activeIso === null ? " on" : "") + '" data-iso="">ALL</span>'];
    isos.forEach(function (iso) {
      chips.push('<span class="reg-chip' + (activeIso === iso ? " on" : "") + '" data-iso="' + iso + '">' + iso + "</span>");
    });
    var box = $("regChips");
    box.innerHTML = chips.join("");
    Array.prototype.forEach.call(box.querySelectorAll(".reg-chip"), function (c) {
      c.addEventListener("click", function () {
        var iso = c.getAttribute("data-iso");
        activeIso = iso === "" ? null : iso;
        renderChips(); renderFeed();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch];
    });
  }

  function renderFeed() {
    var items = activeIso ? allItems.filter(function (i) { return i.iso === activeIso; }) : allItems;
    $("regEmpty").style.display = items.length ? "none" : "block";
    $("regFeed").innerHTML = items.map(function (i) {
      var href = i.link && i.link !== "#" ? ' href="' + escapeHtml(i.link) + '" target="_blank" rel="noopener"' : "";
      return "<a class='reg-item'" + href + ">" +
        '<div class="reg-meta">' +
          '<span class="reg-badge">' + escapeHtml(i.regulator) + "</span>" +
          '<span class="reg-country">' + escapeHtml(i.country || i.iso || "") + "</span>" +
          '<span class="reg-date">' + relTime(i.date) + "</span>" +
        "</div>" +
        '<div class="reg-headline">' + escapeHtml(i.headline) + "</div>" +
        (i.outlet ? '<div class="reg-outlet">via ' + escapeHtml(i.outlet) + "</div>" : "") +
      "</a>";
    }).join("");
  }

  function load() {
    $("regFoot").textContent = "loading…";
    fetch(REG_ENDPOINT)
      .then(function (r) { if (!r.ok) throw new Error("no endpoint"); return r.json(); })
      .then(function (data) {
        allItems = data.items || [];
        $("regFoot").textContent = (data.freshness || "live") + " · " + allItems.length + " items";
        renderFeed();
      })
      .catch(function () { loadStatic(); });
  }

  // The served origin has no /api backend; the real regulator feed ships as
  // static_data/reg.json (same {count,sources,freshness,items} shape). Read
  // that before giving up, and never fabricate a release.
  function loadStatic() {
    fetch("../../static_data/reg.json")
      .then(function (r) { if (!r.ok) throw new Error("no snapshot"); return r.json(); })
      .then(function (data) {
        allItems = data.items || [];
        $("regFoot").textContent = (data.freshness || "snapshot") + " · " + allItems.length + " items";
        renderFeed();
      })
      .catch(function () {
        allItems = [];
        $("regFoot").textContent = "regulatory wire unavailable - no live feed and no snapshot on file";
        renderFeed();
      });
  }

  window.showReg = function () { var el = $("reg"); if (el) el.scrollIntoView({ behavior:"smooth" }); };

  function init() {
    renderChips();
    $("regRefresh").addEventListener("click", load);
    load();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
