<!DOCTYPE html>
<html lang="en">
<head><script>(function(){var V='20261118142346';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUTXRI TERMINAL - GLOBE</title>
<!--
  GLOBE - the God's Eye View app, framed inside the terminal.

  The panel mounts the real God's Eye View build (MIT, Bilawal Sidhu) at
  ../../globe/ in its own embed mode (?embed=1) and drives it through the app's own
  embed contract: the app announces {type:'gev:ready'} and this page posts
  {type:'gev:view', id, view} with a camera {lat, lon, altitude_m, heading_deg,
  pitch_deg}; the app answers {type:'gev:view-applied'}.

  WHERE THE CAMERA OPENS, in order: a land site for the security being read
  (static_data/land_<EX>.json), then that company's main office
  (static_data/offices_<EX>.json). With neither on file the app STILL OPENS - the
  whole instrument, free to pan and zoom - and the footer says plainly that the
  camera is at the app's own default.

  A MISSING RECORD NEVER COVERS THE GLOBE. An earlier version put an empty state
  over the frame whenever a security had no land record, which read as "the globe
  is broken" while the globe was fine: the shell handed the exchange code over as
  the ticker, so nothing matched. The build is now mounted once, unconditionally,
  and a record only decides where the camera starts.
-->
<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --line:#1a1a1a; --line2:#262626;
    --tx:#f5f5f5; --tx2:#d2d2d2; --tx3:#a8a8a8; --acc:#33e29a; --warn:#f5c542;
    --mono:'Oxygen Mono',ui-monospace,monospace; --ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:var(--ui);height:100vh;overflow:hidden}
  .gl{display:flex;flex-direction:column;height:100%}
  .bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);
       border-bottom:1px solid var(--line);flex:0 0 auto}
  .tkr{font-family:var(--mono);font-size:11px;color:var(--tx);letter-spacing:.08em}
  .ex{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.16em}
  select,.btn{background:#111;color:var(--tx2);border:1px solid var(--line2);border-radius:2px;
        font-family:var(--mono);font-size:10px;padding:3px 6px;outline:none;max-width:300px}
  .btn{cursor:pointer}
  .btn:hover{border-color:var(--acc);color:var(--tx)}
  .pos{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.06em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
  .frame{position:relative;flex:1 1 auto;min-height:0;background:#050505}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:8px;text-align:center;padding:24px;background:#050505}
  .empty .h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--warn)}
  .empty .b{font-family:var(--ui);font-size:12px;color:var(--tx2);max-width:480px;line-height:1.5}
  .empty code{font-family:var(--mono);font-size:10px;color:var(--acc)}
  .foot{flex:0 0 auto;padding:4px 10px;border-top:1px solid var(--line);font-family:var(--mono);
        font-size:8.5px;color:var(--tx3);letter-spacing:.05em;display:flex;gap:14px;flex-wrap:wrap}
  .foot b{color:var(--tx2);font-weight:400}
</style>
</head>
<body>
<div class="gl" id="gl">
  <div class="bar">
    <span class="tkr" id="tkr">GLOBE</span>
    <span class="ex" id="ex">-</span>
    <select id="site" title="what the camera opens on"></select>
    <button class="btn" id="reload" type="button" title="re-centre on the chosen place">RECENTRE</button>
    <span class="pos" id="pos">-</span>
  </div>
  <div class="frame" id="frame">
    <iframe id="gev" title="God's Eye View" allow="fullscreen; clipboard-write"></iframe>
    <div class="empty" id="empty" style="display:none">
      <div class="h" id="emptyHead">THE GLOBE BUILD IS NOT REACHABLE</div>
      <div class="b" id="emptyBody"></div>
    </div>
  </div>
  <div class="foot">
    <span id="srcLine">land file</span>
    <span id="camLine"></span>
    <span>imagery and layers: God's Eye View (MIT), Bilawal Sidhu</span>
  </div>
</div>
<script>
(function(){
  var Q = new URLSearchParams(location.search);
  var EX = (Q.get('ex') || 'NSE').toUpperCase();
  var SYM = (Q.get('sym') || Q.get('ticker') || '').toUpperCase();
  // The shell passes the exchange code through as the ticker when nothing is
  // selected. That is not a security, and must not be treated as a missing one.
  if(SYM === EX || SYM === 'NSE' || SYM === 'NGX' || SYM === 'JSE' || SYM === 'EGX') SYM = '';
  var GEV_BASE = window.GEV_BASE || '../../globe/';
  var ALT_LAND = Number(Q.get('alt') || 14000);
  var ALT_OFFICE = Number(Q.get('altoffice') || 2600);
  var PITCH = Number(Q.get('pitch') || -58);

  var elTkr = document.getElementById('tkr');
  var elEx  = document.getElementById('ex');
  var elSel = document.getElementById('site');
  var elPos = document.getElementById('pos');
  var elCam = document.getElementById('camLine');
  var frame = document.getElementById('gev');
  var empty = document.getElementById('empty');
  var emptyHead = document.getElementById('emptyHead');
  var emptyBody = document.getElementById('emptyBody');
  var srcLine = document.getElementById('srcLine');

  var VIEW_ID = 0, frameReady = false, pending = null, places = [];
  var GEV_ORIGIN = location.origin;
  try{ GEV_ORIGIN = new URL(GEV_BASE, location.href).origin; }catch(e){}

  elTkr.textContent = SYM || 'GLOBE';
  elEx.textContent = EX;

  function viewFor(place){
    return {
      camera: {
        lat: Number(place.lat), lon: Number(place.lon),
        altitude_m: Math.round(place.alt || ALT_LAND),
        heading_deg: 0, pitch_deg: Math.round(PITCH)
      },
      layers: [], style: 'normal'
    };
  }

  function postView(place){
    if(!place || place.lat == null) return;
    pending = place;
    if(!frameReady) return;                 // the app has not announced itself yet
    try{
      frame.contentWindow.postMessage({ type:'gev:view', id:++VIEW_ID, view:viewFor(place) },
                                      GEV_ORIGIN);
    }catch(e){}
  }

  window.addEventListener('message', function(ev){
    if(!frame.contentWindow || ev.source !== frame.contentWindow) return;
    var d = ev.data || {};
    if(d.type === 'gev:ready'){
      frameReady = true;
      if(pending) postView(pending);
    }
  });

  function setPos(place){
    elPos.textContent = Number(place.lat).toFixed(5) + ', ' + Number(place.lon).toFixed(5) +
                        '  ' + Math.round((place.alt || ALT_LAND) / 1000) + ' KM OUT';
    elCam.innerHTML = '<b>' + place.kind + '</b> ' + (place.label || '');
  }

  function showEmpty(head, body, code){
    emptyHead.textContent = head;
    emptyBody.innerHTML = body + (code ? '<br><br><code>' + code + '</code>' : '');
    empty.style.display = 'flex';
  }

  // MOUNT THE APP - the whole point of the panel, so it happens whether or not this
  // security has a record. The record only decides where the camera starts.
  var MOUNT_TRIES = 0;
  function mountApp(){
    empty.style.display = 'none';
    if(frame.src && frame.src !== 'about:blank' && MOUNT_TRIES > 0) return;
    MOUNT_TRIES++;
    // A cache-buster on the framed app: the host serves these files with a
    // ten-minute cache, and an error page served in that window must not stick.
    frame.src = GEV_BASE + '?embed=1&r=' + Date.now();
  }

  function fillSelect(){
    elSel.innerHTML = '';
    places.forEach(function(pl, i){
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = pl.kind + ' - ' + pl.label;
      elSel.appendChild(o);
    });
    if(!places.length){
      var o2 = document.createElement('option');
      o2.textContent = 'no place on file';
      elSel.appendChild(o2);
    }
  }

  function choose(i){
    var pl = places[i];
    if(!pl) return;
    postView(pl);
    setPos(pl);
  }

  function loadAll(){
    var landUrl = '../../static_data/land_' + EX + '.json';
    var offUrl  = '../../static_data/offices_' + EX + '.json';
    srcLine.textContent = 'land_' + EX + '.json  offices_' + EX + '.json';
    Promise.all([
      fetch(landUrl).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
      fetch(offUrl).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
    ]).then(function(res){
      var land = res[0], off = res[1];
      places = [];
      var lrec = land && land.securities ? land.securities[SYM] : null;
      if(lrec && (lrec.sites || []).length){
        lrec.sites.forEach(function(s){
          var pn = s.pin || {};
          if(pn.lat == null) return;
          places.push({kind:'LAND', label:s.site + (s.county ? '  (' + s.county + ')' : ''),
                       lat:pn.lat, lon:pn.lon, alt:ALT_LAND, note:pn.precision});
        });
      }
      var orec = off && off.securities ? off.securities[SYM] : null;
      if(orec && orec.lat != null){
        places.push({kind:'MAIN OFFICE', label:orec.address + (orec.city ? '  (' + orec.city + ')' : ''),
                     lat:orec.lat, lon:orec.lon, alt:ALT_OFFICE, note:orec.precision});
      }
      fillSelect();
      if(places.length){
        elSel.value = '0';
        choose(0);
      }else{
        elPos.textContent = 'camera at the app default';
        elCam.innerHTML = SYM
          ? 'no land record or main office on file for <b>' + SYM + '</b> - the instrument is open'
          : 'no security selected - the instrument is open';
      }
    });
  }

  // Is the build reachable? Only a real miss shows the empty state, and it names
  // the path it asked for so the fault is visible rather than mysterious.
  fetch(GEV_BASE + 'index.html').then(function(r){
    if(!r.ok) throw 0;
    mountApp();
    watchGlobe();
    loadAll();
  }).catch(function(){
    showEmpty('THE GLOBE BUILD IS NOT REACHABLE',
              'The God\u2019s Eye View build was not found at this path, so there is nothing to frame yet. ' +
              'When it is present this panel opens the full app - flights, ships, satellites, earthquakes, ' +
              'public cameras - on the place you pick.',
              GEV_BASE);
    loadAll();
  });

  // WATCHDOG. The framed app is same-origin, so this page can look inside it. If
  // no canvas appears, the frame is almost certainly showing a host error page
  // (GitHub Pages serves its own crash page when it is unhealthy) rather than the
  // app. Retry once with a fresh URL, then say so in our own words instead of
  // leaving someone else's error screen sitting in the panel.
  var WATCH = { tries: 0 };
  function watchGlobe(){
    setTimeout(function(){
      var doc = null;
      try{ doc = frame.contentDocument; }catch(e){}
      if(!doc) return;
      var canvases = doc.querySelectorAll('canvas').length;
      var title = (doc.title || '');
      if(canvases > 0) return;                     // the app is up
      if(WATCH.tries < 1){
        WATCH.tries++;
        frame.src = GEV_BASE + '?embed=1&retry=' + Date.now();
        watchGlobe();
        return;
      }
      showEmpty('THE GLOBE DID NOT START',
                'The app in this frame did not produce a canvas' +
                (title && !/God/i.test(title) ? ', and the page it loaded calls itself "' + title.slice(0, 40) + '"' : '') +
                '. That is usually the host serving an error page rather than the build: reload the panel in a moment, ' +
                'and the instrument comes back with no change on your side.');
      elCam.innerHTML = 'the framed app did not start; use RECENTRE to try again';
    }, 22000);
  }

  document.getElementById('reload').onclick = function(){
    // If the frame never produced a canvas, re-mount it rather than only re-posting
    // a camera; otherwise just recentre.
    var doc = null;
    try{ doc = frame.contentDocument; }catch(e){}
    if(!doc || !doc.querySelectorAll('canvas').length){
      MOUNT_TRIES = 0;
      WATCH.tries = 0;
      mountApp();
      watchGlobe();
      return;
    }
    var i = Number(elSel.value);
    if(!isNaN(i) && places[i]) choose(i);
  };
  elSel.onchange = function(){ choose(Number(elSel.value)); };

  // A host may hand over a different security without reloading the frame.
  window.showGlobe = function(ticker, ex){
    if(ticker) SYM = String(ticker).toUpperCase();
    if(ex) EX = String(ex).toUpperCase();
    if(SYM === EX) SYM = '';
    elTkr.textContent = SYM || 'GLOBE';
    elEx.textContent = EX;
    loadAll();
  };
})();
</script>
</body>
</html>
