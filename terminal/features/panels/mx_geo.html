<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - GEO panel: the land a company's revenue is grown on.

  WHY THIS PANEL EXISTS. Every other panel treats a security as a set of
  numbers. For an agricultural counter the numbers are grown somewhere, and the
  weather over that somewhere is the first input to the result. This panel puts
  the place on screen: where the estates are, what the land temperature does
  there across the seasons, how much rain actually fell, and the revenue that
  rain became.

  WHAT IT CLAIMS, AND WHAT IT WILL NOT.

   * Rainfall is MEASURED: ERA5 daily reanalysis at the growing areas, summed
     over THAT COMPANY'S OWN financial year. The year ends differ and it
     matters. Williamson and Kapchorua close on 31 March, Sasini on 30
     September, Kakuzi and Limuru on 31 December. Reading a March-year
     company's revenue against calendar rainfall offsets the cause from the
     effect by nine months.

   * The thermal images are a real satellite product, MODIS Aqua land surface
     temperature from NASA GIBS, not a heat map drawn here. Their dark patches
     are cloud and missing data. Over a tea belt that is cloudy by nature those
     gaps are part of the picture and are NOT filled in.

   * NO CORRELATION COEFFICIENT IS SHOWN. Each company has about five annual
     revenue figures on file, and at n=5 a coefficient of 0.9 falls out of
     random numbers about one time in twenty five. The two series are drawn
     against each other and the point count is stated. The reader judges.

   * The coordinates are town or growing-area centroids, not estate boundaries
     published by anyone, and each location says how it was established: from
     the company's own material, or from a third party where the company's own
     source could not be reached.

  AND THE RESULT IS NOT THE INTUITIVE ONE. More rain does mean more leaf, but
  when rain is good across the whole country every estate plucks at once, the
  auction price falls, and revenue can fall with it. Williamson and Kapchorua
  both had their wettest year on file and their weakest revenue in the same
  year. The panel says this where the data shows it rather than leaving the
  reader with a chain that points the wrong way.

  A security with no growing areas on file says so and offers the ones that do.
-->
<html lang="en">
<head><script>(function(){var V='20261124163329';var f=window.fetch;if(!f||window.__mxv)return;window.__mxv=V;window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url);if(u&&u.indexOf('static_data/')>=0&&u.indexOf('v=')<0){var s=u+(u.indexOf('?')<0?'?':'&')+'v='+V;i=(typeof i==='string')?s:new Request(s,i);}}catch(e){}return f.call(this,i,o);};})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - GEO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#121212;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;--gold:#f5c542;--blue:#5aa9f8;
    --violet:#b07cf0;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--ui);font-size:13px}
  /* ---- the ontology workspace -------------------------------------------
     Three columns, because that is the shape of the work: what this object
     links to, the object itself, and the evidence for every claim on screen.
     The right column is the point. A panel that cannot show its sources is a
     picture; the provenance is what makes it usable. */
  .trail{display:flex;align-items:center;gap:6px;padding:6px 2px 10px;flex-wrap:wrap}
  .crumb{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border:1px solid var(--line2);
         border-radius:5px;padding:3px 8px;white-space:nowrap;cursor:pointer;background:var(--bg2)}
  .crumb:hover{border-color:#3a3a3a;color:var(--tx2)}
  .crumb.on{color:var(--acc);border-color:#2a5d4a;background:#0d1a15;cursor:default}
  .crumb .sep{color:#3a3a3a}
  .ws{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;gap:12px;align-items:start}
  @media(max-width:1000px){.ws{grid-template-columns:170px minmax(0,1fr)}
                           .ws .col3{grid-column:1/-1}}
  @media(max-width:700px){.ws{grid-template-columns:1fr}}
  .col{min-width:0}
  .ch{font-family:var(--mono);font-size:9px;letter-spacing:1.7px;color:var(--tx3);
      margin:0 0 8px;padding-left:2px}
  .card{border:1px solid var(--line);background:var(--bg3);border-radius:9px;
        padding:12px 14px;margin-bottom:12px}
  /* left rail: what this object links to */
  .lk{padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.35}
  .lk:last-child{border-bottom:0}
  .lk:hover{background:#171717}
  .lk .nm{font-size:11.5px;color:var(--tx)}
  .lk .rel{font-family:var(--mono);font-size:8.5px;color:var(--tx3);margin-top:2px}
  .lk.on{background:#16101d}
  .lk.on .nm{color:var(--violet)}
  .kindrow{display:flex;justify-content:space-between;padding:5px 8px;font-size:11px}
  .kindrow .n{font-family:var(--mono);font-size:10px;color:var(--tx3)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
  /* right rail: evidence, one card per fact, each with its source */
  .ev{border:1px solid #171717;background:#0e0e0e;border-radius:7px;padding:9px 11px;
      margin-bottom:8px}
  .ev .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;color:var(--tx3)}
  .ev .v{font-size:14px;margin-top:3px;font-family:var(--mono)}
  .ev .s{font-family:var(--mono);font-size:8.5px;color:#6a6a6a;margin-top:6px;line-height:1.5;
         border-top:1px solid #171717;padding-top:5px}
  .badge{font-family:var(--mono);font-size:7.5px;border:1px solid;border-radius:3px;
         padding:1px 4px;margin-left:5px;vertical-align:middle}
  .badge.meas{color:var(--acc);border-color:#2a5d4a}
  .badge.stat{color:var(--tx3);border-color:#333}
  .badge.obs{color:var(--gold);border-color:#5d4a1f}
  .hero{font-size:17px;font-weight:700;letter-spacing:.3px}
  .herosub{font-family:var(--mono);font-size:9.5px;color:var(--tx3);margin-top:3px}
  .tile{border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#0d0d0d;
        margin-bottom:9px}
  .tile img{width:100%;display:block}
  .tile .cap{padding:6px 9px 8px}
  .tile .cap b{font-size:10.5px;letter-spacing:.3px}
  .tile .cap div{font-family:var(--mono);font-size:8.5px;color:var(--tx3);margin-top:3px}
  .note{font-family:var(--mono);font-size:9px;color:var(--tx3);line-height:1.6;margin-top:8px}
  .warn{color:var(--down)}
  .empty{font-family:var(--mono);font-size:10.5px;color:var(--tx3);line-height:1.8;padding:8px 2px}
  .chip{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:5px;
        padding:4px 9px;color:var(--tx2);cursor:pointer;background:var(--bg2);display:inline-block;
        margin:0 6px 6px 0}
  .chip:hover{border-color:#3a3a3a}
  svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="trail" id="trail"></div>
  <div class="ws">
    <div class="col col1">
      <div class="card" style="padding:9px 6px">
        <div class="ch" style="padding-left:8px">OBJECT TYPES</div>
        <div id="kinds"></div>
      </div>
      <div class="card" style="padding:9px 6px">
        <div class="ch" style="padding-left:8px">LINKS FROM HERE</div>
        <div id="links"></div>
      </div>
    </div>
    <div class="col col2" id="centre"></div>
    <div class="col col3">
      <div class="card">
        <div class="hero" id="hero"></div>
        <div class="herosub" id="herosub"></div>
      </div>
      <div class="ch">EVIDENCE</div>
      <div id="facts"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var Q  = new URLSearchParams(location.search);
  var EX  = (Q.get("ex")  || "NSE").toUpperCase();
  var SYM = (Q.get("sym") || "").toUpperCase();
  var D = null, area = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function sd(p){ return "../../static_data/" + p; }
  function fmt(n, dp){
    if(n == null || isNaN(n)) return "-";
    return Number(n).toLocaleString(undefined, {minimumFractionDigits: dp||0,
                                                maximumFractionDigits: dp||0});
  }
  function money(v){
    if(v == null) return "-";
    return v >= 1e9 ? (v/1e9).toFixed(2) + "B" : Math.round(v/1e6) + "M";
  }

  fetch(sd("geo_KE.json")).then(function(r){
    if(!r.ok) throw new Error("geo_KE.json " + r.status);
    return r.json();
  }).then(function(j){ D = j; draw(); })
    .catch(function(e){
      $("body").innerHTML = '<div class="empty">The geography file could not be read ('
        + esc(e.message) + '). Nothing is drawn rather than drawn from nothing.</div>';
    });

  /* ---- the rainfall-against-revenue chart ------------------------------
     Two series on one frame with independent scales, which is honest only
     because neither is being multiplied by the other: the shapes are being
     compared, not a ratio computed. Point count is printed beneath. */
  function chart(years, w){
    if(!years || years.length < 2) return "";
    var H = 150, PL = 44, PR = 46, PT = 14, PB = 26;
    var iw = w - PL - PR, ih = H - PT - PB;
    var rr = years.map(function(y){ return y.rain_mm; });
    var vv = years.map(function(y){ return y.revenue; });
    var r0 = Math.min.apply(null, rr) * 0.86, r1 = Math.max.apply(null, rr) * 1.06;
    var v0 = Math.min.apply(null, vv) * 0.82, v1 = Math.max.apply(null, vv) * 1.1;
    var n = years.length, step = iw / n;
    var o = "";
    years.forEach(function(y, i){
      var bh = (y.rain_mm - r0) / (r1 - r0) * ih;
      var bx = PL + i * step + step * 0.24;
      o += '<rect x="' + bx.toFixed(1) + '" y="' + (PT + ih - bh).toFixed(1)
         + '" width="' + (step * 0.52).toFixed(1) + '" height="' + Math.max(2, bh).toFixed(1)
         + '" fill="#23506e"/>';
      o += '<text x="' + (bx + step * 0.26).toFixed(1) + '" y="' + (PT + ih - bh - 4).toFixed(1)
         + '" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="#5aa9f8">'
         + fmt(y.rain_mm) + '</text>';
    });
    var pts = years.map(function(y, i){
      return [PL + i * step + step / 2, PT + ih - (y.revenue - v0) / (v1 - v0) * ih];
    });
    o += '<path d="' + pts.map(function(p, i){
      return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("")
      + '" fill="none" stroke="#33e29a" stroke-width="2.4"/>';
    pts.forEach(function(p, i){
      var worst = years[i].revenue === Math.min.apply(null, vv);
      o += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.6" fill="'
         + (worst ? "#f87171" : "#33e29a") + '" stroke="#0d0d0d" stroke-width="2"/>';
      o += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 10).toFixed(1)
         + '" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="'
         + (worst ? "#f87171" : "#33e29a") + '">' + money(years[i].revenue) + '</text>';
    });
    years.forEach(function(y, i){
      o += '<text x="' + (PL + i * step + step / 2).toFixed(1) + '" y="' + (H - 8)
         + '" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="#6a6a6a">FY'
         + String(y.fy).slice(2) + '</text>';
    });
    o += '<text x="4" y="' + (PT + 8) + '" font-family="var(--mono)" font-size="9" fill="#5aa9f8">mm</text>';
    o += '<text x="' + (w - 40) + '" y="' + (PT + 8)
       + '" font-family="var(--mono)" font-size="9" fill="#33e29a">revenue</text>';
    return '<svg width="' + w + '" height="' + H + '">' + o + '</svg>';
  }

  /* monthly rainfall bars for one growing area */
  function rainBars(monthly, w){
    if(!monthly || monthly.length < 12) return "";
    var last = monthly.slice(-36), H = 72, bw = (w - 8) / last.length;
    var mx = Math.max.apply(null, last.map(function(r){ return r.rain_mm; })) || 1;
    var o = "";
    last.forEach(function(r, i){
      var bh = Math.max(1, r.rain_mm / mx * (H - 18));
      var mo = r.m.slice(5);
      var wet = (mo === "04" || mo === "05");
      o += '<rect x="' + (4 + i * bw).toFixed(1) + '" y="' + (H - 14 - bh).toFixed(1)
         + '" width="' + Math.max(1, bw - 1.3).toFixed(1) + '" height="' + bh.toFixed(1)
         + '" fill="' + (wet ? "#5aa9f8" : "#2f6f93") + '"/>';
      if(mo === "01")
        o += '<text x="' + (4 + i * bw - 7).toFixed(1) + '" y="' + (H - 2)
           + '" font-family="var(--mono)" font-size="8.5" fill="#6a6a6a">' + r.m.slice(0,4) + '</text>';
    });
    return '<svg width="' + w + '" height="' + H + '">' + o + '</svg>';
  }

  /* ---- the workspace -----------------------------------------------------
     Three columns filled from one object. `trail` is how you got here, which
     matters because the panel is walked rather than read: place to company to
     neighbour and back. Facts carry a badge saying what KIND of claim each is,
     because "1,772 mm" and "the wettest year had the weakest revenue" are not
     the same sort of statement and should not look alike. */
  var TRAIL = [];

  function pushTrail(kind, id, label){
    var k = -1;
    TRAIL.forEach(function(t, i){ if(t.kind === kind && t.id === id) k = i; });
    if(k >= 0) TRAIL = TRAIL.slice(0, k + 1);
    else TRAIL.push({kind: kind, id: id, label: label});
    if(TRAIL.length > 6) TRAIL = TRAIL.slice(-6);
  }

  function drawTrail(){
    $("trail").innerHTML = TRAIL.map(function(t, i){
      var on = i === TRAIL.length - 1;
      return (i ? '<span class="sep">&rsaquo;</span>' : "")
        + '<span class="crumb' + (on ? " on" : "") + '" data-tk="' + esc(t.kind)
        + '" data-ti="' + esc(t.id) + '">' + esc(t.label) + '</span>';
    }).join("");
    Array.prototype.forEach.call($("trail").querySelectorAll(".crumb"), function(b){
      b.addEventListener("click", function(){
        var k = b.getAttribute("data-tk"), id = b.getAttribute("data-ti");
        if(k === "sec"){ SYM = id; area = null; }
        else { area = id; }
        draw();
      });
    });
  }

  function ev(k, v, src, badge){
    return '<div class="ev"><div class="k">' + esc(k)
      + (badge ? '<span class="badge ' + badge[0] + '">' + esc(badge[1]) + '</span>' : "")
      + '</div><div class="v">' + esc(v) + '</div>'
      + (src ? '<div class="s">' + esc(src) + '</div>' : "") + '</div>';
  }

  function kinds(){
    var np = Object.keys(D.places).length, nc = Object.keys(D.companies).length;
    $("kinds").innerHTML =
      '<div class="kindrow"><span><span class="dot" style="background:#f0f0f0"></span>security</span>'
      + '<span class="n">' + nc + '</span></div>'
      + '<div class="kindrow"><span><span class="dot" style="background:#b07cf0"></span>place</span>'
      + '<span class="n">' + np + '</span></div>';
  }

  function draw(){
    var c = D.companies[SYM];
    kinds();

    if(!c){
      TRAIL = [];
      drawTrail();
      $("hero").textContent = SYM || "GEO";
      $("herosub").textContent = EX + " / no growing areas on file";
      $("facts").innerHTML = ev("COVERAGE", Object.keys(D.companies).length + " securities",
        "A place is carried only where the company itself names one. That is true today "
        + "for the agricultural counters and nothing else, so an absence here is a gap in "
        + "what has been read, not a statement about the company.", ["stat", "stated"]);
      $("links").innerHTML = Object.keys(D.companies).sort().map(function(t){
        return '<div class="lk" data-go="' + esc(t) + '"><div class="nm">' + esc(t)
             + '</div><div class="rel">' + esc(D.companies[t].crop) + '</div></div>';
      }).join("");
      $("centre").innerHTML = '<div class="card"><div class="empty">'
        + 'No growing areas are on file for ' + esc(SYM || "this security") + '.<br><br>'
        + 'Pick one of the securities on the left that does have them.</div></div>';
      wire();
      return;
    }

    if(!area || c.areas.indexOf(area) < 0) area = c.areas[0];
    pushTrail("sec", SYM, SYM);
    pushTrail("place", area, area);
    drawTrail();

    var yrs = c.years || [];
    var last = yrs.length ? yrs[yrs.length - 1] : null;
    var wettest = yrs.length ? yrs.reduce(function(a, b){
      return b.rain_mm > a.rain_mm ? b : a; }) : null;
    var worst = yrs.length ? yrs.reduce(function(a, b){
      return b.revenue < a.revenue ? b : a; }) : null;
    var counter = (wettest && worst && wettest.fy === worst.fy);
    var p = D.places[area];
    var ser = (p && p.monthly) || [];

    /* -------- hero and evidence -------- */
    $("hero").textContent = c.name;
    $("herosub").textContent = EX + " / " + SYM + "  ·  " + c.crop
      + "  ·  FY ends " + c.fy_end;

    var f = "";
    if(last){
      f += ev("RAINFALL FY" + last.fy, fmt(last.rain_mm) + " mm",
        D.weather_source + ". Summed over this company's own financial year, "
        + last.window[0] + " to " + last.window[1] + ".", ["meas", "measured"]);
      f += ev("REVENUE FY" + last.fy, "KES " + money(last.revenue),
        "The issuer's filed statement for the year ended " + last.window[1] + ".",
        ["stat", "stated"]);
      f += ev("WET DAYS FY" + last.fy, fmt(last.wet_days) + " days",
        "Days of 1 mm or more at the growing areas.", ["meas", "measured"]);
    }
    if(counter){
      f += ev("WHAT THE SERIES SHOWS",
        "wettest year, weakest revenue",
        "FY" + wettest.fy + " was the wettest year on file here and the weakest revenue of "
        + "the " + yrs.length + ". More rain means more leaf, but when rain is good across "
        + "the whole country every estate plucks at once and the auction price falls.",
        ["obs", "observation"]);
    }
    f += ev("POINTS ON FILE", yrs.length + " financial years",
      D.no_coefficient, ["stat", "stated"]);
    if(ser.length){
      var wet = ser.reduce(function(a, b){ return b.rain_mm > a.rain_mm ? b : a; });
      var dry = ser.reduce(function(a, b){ return b.rain_mm < a.rain_mm ? b : a; });
      f += ev("WETTEST MONTH AT " + area.toUpperCase(),
        wet.m + "  " + fmt(wet.rain_mm) + " mm", D.weather_source, ["meas", "measured"]);
      f += ev("DRIEST MONTH AT " + area.toUpperCase(),
        dry.m + "  " + fmt(dry.rain_mm) + " mm", D.weather_source, ["meas", "measured"]);
    }
    f += ev("WHERE " + area.toUpperCase() + " IS",
      p ? p.lat.toFixed(4) + ", " + p.lon.toFixed(4) : "-",
      D.coords_basis + " " + c.location_basis, ["stat", "stated"]);
    f += ev("OTHER DRIVERS", "not only the weather", D.other_drivers, ["stat", "stated"]);
    $("facts").innerHTML = f;

    /* -------- left rail: what this object links to -------- */
    var alsoHere = Object.keys(D.companies).filter(function(t){
      return t !== SYM && D.companies[t].areas.indexOf(area) >= 0;
    }).sort();
    var l = c.areas.map(function(a){
      return '<div class="lk' + (a === area ? " on" : "") + '" data-a="' + esc(a) + '">'
        + '<div class="nm">' + esc(a) + '</div><div class="rel">farms at</div></div>';
    }).join("");
    l += alsoHere.map(function(t){
      return '<div class="lk" data-go="' + esc(t) + '"><div class="nm">' + esc(t)
        + '</div><div class="rel">also farms ' + esc(area) + '</div></div>';
    }).join("");
    $("links").innerHTML = l;

    /* -------- centre: the object itself -------- */
    var W = Math.max(260, ($("centre").clientWidth || 520) - 30);
    var h = '<div class="card"><div class="ch">RAIN AGAINST THE REVENUE IT BECAME</div>'
      + chart(yrs, W)
      + '<div class="note">' + esc(yrs.length) + ' points, so no correlation coefficient '
      + 'is computed: at this sample size one would be noise.</div>';
    if(counter){
      h += '<div class="note warn">FY' + wettest.fy + ' was the wettest year on file here '
         + 'and the weakest revenue of the ' + yrs.length + '. A good year for the crop can '
         + 'be a poor one for the shareholder.</div>';
    }
    h += '</div>';

    if(p && (p.tiles || []).length){
      h += '<div class="card"><div class="ch">' + esc(area.toUpperCase())
         + ' &middot; LAND SURFACE TEMPERATURE</div>'
         + p.tiles.map(function(t){
             return '<div class="tile"><img src="' + sd(esc(t.file)) + '" alt="'
                  + esc(area + " " + t.caption) + '" loading="lazy"><div class="cap"><b>'
                  + esc(t.caption.toUpperCase()) + '</b><div>' + esc(t.date)
                  + '</div></div></div>'; }).join("")
         + '<div class="note">' + esc(D.gaps) + '</div></div>';
    }
    if(ser.length){
      h += '<div class="card"><div class="ch">' + esc(area.toUpperCase())
         + ' &middot; RAINFALL BY MONTH, LAST 3 YEARS</div>' + rainBars(ser, W)
         + '<div class="note">April and May picked out as the long rains.</div></div>';
    }
    $("centre").innerHTML = h;
    wire();
  }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll(".lk[data-a]"), function(b){
      b.addEventListener("click", function(){ area = b.getAttribute("data-a"); draw(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){
      b.addEventListener("click", function(){
        SYM = b.getAttribute("data-go");
        draw();
        try{
          window.parent.postMessage({__mt: "mt:sym", type: "mt:sym", sym: SYM, ex: EX},
                                    location.origin);
        }catch(e){}
      });
    });
  }

  window.addEventListener("message", function(e){
    var d = e && e.data;
    if(d && d.type === "mt:sym" && d.sym){
      SYM = String(d.sym).toUpperCase();
      if(d.ex) EX = String(d.ex).toUpperCase();
      if(D) draw();
    }
  });
})();
</script>
</body>
</html>
