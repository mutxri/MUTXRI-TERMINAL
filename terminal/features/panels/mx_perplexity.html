<!--
  mx_perplexity.html - PERPLEXITY: the visual dossier for one security.

  A dashboard, not a document. Eight figure tiles across the top, a relationship
  network as the centrepiece, revenue and net profit as grouped bars, the price
  history on the same lightweight-charts engine the CHART window uses, a strip of
  headline cards, laws as status coloured chips and ownership as one stacked bar.
  Labels are short and figures are large: a reader should read the company in
  about three seconds.

  Nothing here is fetched from a new source. The panel reads what the terminal
  already ships for the selected security:

    TILES         static_data/market_<EX>.json, static_data/analytics/<KEY>.json,
                  static_data/history/<KEY>.json
    RELATIONSHIPS static_data/relationships_<EX>.json
    PRICE         static_data/history/NSE_<TK>.json or NGX_<TK>.json
    FINANCIALS    static_data/financials/<KEY>__income.json
    NEWS          static_data/<ex>_news.json and <ex>_announcements.json
    OWNERSHIP     static_data/shareholders_<EX>.json
    LAWS          static_data/gov_laws_KE.json
    EXPOSURE      static_data/gov_exposure_KE.json / gov_exposure_SA.json

  Rules this file keeps:
    * a figure is printed only when the file carries it;
    * a withheld multiple prints WITHHELD in amber and keeps its stored reason
      on the tile's hover title, never as a paragraph;
    * an empty record is told apart from a failed read, and a failed read prints
      the failure where its content belongs;
    * every block draws inside a guard, so one broken read blanks one block;
    * one input, no buttons.
  Vanilla JS, single file, no build step. Mint on black, Oxygen Mono.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perplexity</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;
    --acc2:#1ecfb0;--warn:#e0a341;--blue:#6ea8fe;--violet:#c08cff;
    --mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  /* The shell gives every panel a window, so this panel draws no frame of its
     own: no border, no radius, no max-width, no padding, no margin. */
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:12px;
       padding:0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;
       height:100vh;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;border:0;background:transparent;
        max-width:none;margin:0;border-radius:0}

  /* ---------- head ---------- */
  .head{display:flex;align-items:center;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line2);
        background:var(--bg2);flex:0 0 auto;min-width:0}
  .head .code{color:var(--acc);font-weight:700;letter-spacing:.06em;font-size:10px}
  .head .tkr{font-weight:700;letter-spacing:.04em;font-size:14px}
  .head .name{color:var(--tx2);font-family:var(--ui);font-size:11px;white-space:nowrap;overflow:hidden;
              text-overflow:ellipsis;max-width:34vw}
  .head .tag{font-size:8px;letter-spacing:.08em;color:var(--acc);border:1px solid #1f4f3c;
             padding:1px 4px;border-radius:2px;white-space:nowrap}
  .head .tag.dim{color:var(--tx3);border-color:var(--line2)}
  .spacer{margin-left:auto}
  .head .asof{font-size:8px;color:var(--tx3);letter-spacing:.06em;white-space:nowrap}

  /* ---------- search: one input, no buttons ---------- */
  .controls{position:relative;display:flex;align-items:center;gap:9px;padding:5px 12px;
            border-bottom:1px solid var(--line);flex:0 0 auto}
  input.qin{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
            padding:4px 8px;font-family:var(--mono);font-size:11px;width:260px;text-transform:uppercase}
  input.qin:focus{outline:0;border-color:var(--acc)}
  .hint{color:var(--tx3);font-size:8px;letter-spacing:.1em}
  .sug{position:absolute;left:12px;top:100%;width:400px;max-height:250px;overflow:auto;
       background:var(--bg3);border:1px solid var(--line2);border-top:0;z-index:60;display:none}
  .sug.on{display:block}
  .sg{display:flex;align-items:baseline;gap:8px;padding:4px 8px;cursor:pointer;border-top:1px solid var(--line)}
  .sg:first-child{border-top:0}
  .sg.sel{background:var(--bg4)}
  .sg .tk{color:var(--acc);font-weight:700;min-width:62px}
  .sg .nm{color:var(--tx2);font-family:var(--ui);font-size:10.5px;flex:1;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .sg .ex{color:var(--tx3);font-size:8px;letter-spacing:.06em}
  .sg.none{color:var(--tx3);font-size:10px;cursor:default}

  /* ---------- top strip of tiles ---------- */
  .strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line2);
         border-bottom:1px solid var(--line2);flex:0 0 auto}
  .tile{background:#050505;padding:6px 8px 5px;display:flex;flex-direction:column;gap:1px;
        min-width:0;overflow:hidden}
  .tile .tl{font-size:7.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;white-space:nowrap}
  .tile .tv{font-size:20px;font-weight:700;line-height:1.06;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;color:var(--tx)}
  .tile .tv.up{color:var(--up)} .tile .tv.down{color:var(--down)} .tile .tv.flat{color:var(--tx2)}
  .tile .tv.sm{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--warn)}
  .tile .tv.xs{font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--tx3)}
  .tile .tm{height:22px;margin-top:1px;display:flex;align-items:flex-end}
  .tile .tm svg{width:100%;height:22px;display:block}
  .tile .ts{font-size:7.5px;color:var(--tx3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis}

  /* ---------- dashboard grid ---------- */
  .grid{flex:1 1 auto;min-height:0;display:grid;gap:1px;background:var(--line2);padding:1px;
        grid-template-columns:repeat(12,minmax(0,1fr));
        grid-template-rows:minmax(0,1.52fr) minmax(0,1.02fr) minmax(0,.62fr)}
  .card{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
  #c_rel{grid-column:1/8;grid-row:1}
  #c_px{grid-column:8/13;grid-row:1}
  #c_fin{grid-column:1/7;grid-row:2}
  #c_own{grid-column:7/10;grid-row:2}
  #c_law{grid-column:10/13;grid-row:2}
  #c_news{grid-column:1/13;grid-row:3}
  .ch{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:1px solid var(--line);
      flex:0 0 auto;min-width:0}
  .cl{font-size:7.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;font-weight:600;
      white-space:nowrap}
  .cm{margin-left:auto;font-size:7.5px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .cb{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}

  /* relationship graph */
  .gwrap{position:absolute;inset:0}
  .gwrap svg{width:100%;height:100%;display:block}
  .gsub{position:absolute;left:0;right:0;bottom:0;padding:3px 9px 5px;font-size:8.5px;letter-spacing:.07em;
        color:#9a9a9a;text-transform:uppercase;background:rgba(0,0,0,.55)}
  .gsub b{color:var(--warn);font-weight:700}
  .nd{pointer-events:all}
  .nd text{font-family:var(--mono);letter-spacing:.02em}

  /* price chart */
  .pxbox{position:absolute;inset:0}
  .pxchart{position:absolute;inset:0}
  .pxfb{position:absolute;inset:0;display:none}
  .pxfb svg{width:100%;height:100%;display:block}

  /* financial bars + statement rows kept available */
  .finbox{position:absolute;inset:0;display:flex;flex-direction:column}
  .finchart{flex:1 1 auto;min-height:0;position:relative}
  .finchart svg{width:100%;height:100%;display:block}
  details.stmt{flex:0 0 auto;border-top:1px solid var(--line);background:#050505}
  details.stmt summary{list-style:none;cursor:pointer;font-size:7.5px;letter-spacing:.14em;
    color:var(--tx3);text-transform:uppercase;padding:3px 8px;outline:0}
  details.stmt summary::-webkit-details-marker{display:none}
  details.stmt summary:hover{color:var(--acc)}
  details.stmt[open] summary{color:var(--acc);border-bottom:1px solid var(--line)}
  .stwrap{max-height:190px;overflow:auto}
  table.fin{width:100%;border-collapse:collapse}
  table.fin th,table.fin td{padding:2px 8px;text-align:right;white-space:nowrap;font-size:9.5px}
  table.fin th:first-child,table.fin td:first-child{text-align:left}
  table.fin thead th{color:var(--tx3);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;
    border-bottom:1px solid var(--line2);font-weight:400;position:sticky;top:0;background:#050505}
  table.fin tbody td{border-top:1px solid #0f0f0f}
  table.fin td.it{color:var(--tx2);font-family:var(--ui);font-size:10px;white-space:normal}
  table.fin tr.tot td{color:var(--tx);font-weight:700}
  table.fin td.neg{color:var(--down)}

  /* ownership */
  #b_own{padding:6px 8px;display:flex;flex-direction:column;gap:6px}
  .ofig{display:flex;align-items:baseline;gap:6px;min-width:0}
  .ofv{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .ofl{font-size:7.5px;letter-spacing:.12em;color:var(--tx3);white-space:nowrap}
  .obar{display:flex;height:13px;width:100%;border:1px solid var(--line2);overflow:hidden;background:#0a0a0a}
  .seg{height:100%;min-width:1px}
  .oleg{display:flex;flex-direction:column;gap:3px;min-height:0}
  .olr{display:flex;align-items:center;gap:5px;font-size:8.5px;color:var(--tx2);white-space:nowrap;
       overflow:hidden;min-width:0}
  .old{width:6px;height:6px;flex:0 0 auto;border-radius:1px}
  .oln{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .olp{color:var(--tx);font-weight:700;flex:0 0 auto}

  /* law and exposure chips */
  #b_law{padding:5px 8px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;overflow:hidden}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;letter-spacing:.04em;
        padding:2px 5px;border:1px solid var(--line2);color:var(--tx2);background:#0a0a0a;
        max-width:100%;overflow:hidden;white-space:nowrap}
  .chip i{font-style:normal;font-size:7.5px;color:var(--tx3);letter-spacing:.06em}
  .chip.enacted{color:var(--acc);border-color:#1f4f3c;background:#07130e}
  .chip.enacted i{color:#1f8f66}
  .chip.repealed{color:var(--down);border-color:#5c2222;background:#140909}
  .chip.repealed i{color:#a25555}
  .chip.withdrawn{color:var(--warn);border-color:#4a3810;background:#120d05}
  .chip.withdrawn i{color:#8a6a2c}
  .chip.gov{color:var(--tx2);border-style:dashed}
  .chip.gov b{font-weight:700;color:var(--acc)}
  .chip.gov.ind b{color:var(--warn)}
  .chip.none{color:var(--tx3);border-style:dashed}
  .chip.other{color:var(--tx3)}

  /* news strip */
  #b_news{display:flex;gap:1px;background:var(--line2)}
  .ncard{flex:1 1 0;min-width:0;background:#050505;padding:5px 7px;display:flex;flex-direction:column;
         gap:4px;overflow:hidden}
  .nd{display:flex;gap:5px;align-items:baseline;font-size:7.5px;letter-spacing:.05em;color:var(--tx3);
      min-width:0}
  .ndd{color:var(--acc);font-weight:700;flex:0 0 auto}
  .nds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
  .nt{font-size:10px;line-height:1.3;color:var(--tx2);font-family:var(--ui);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .nt a{color:inherit;text-decoration:none}
  .ncard:hover .nt{color:var(--tx)}

  /* states */
  .fail{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--down);color:var(--down);
        font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .fail b{font-weight:700}
  .emp{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--line2);color:var(--tx3);
       font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .emp b{color:var(--tx2);font-weight:600}
  .foot{display:flex;align-items:center;gap:10px;padding:2px 12px;background:var(--bg2);
        border-top:1px solid var(--line2);color:var(--tx3);font-size:7.5px;letter-spacing:.08em;
        flex:0 0 auto}
  .foot .sp{margin-left:auto}
</style>
</head>
<body>
<div class="wrap" id="panel">
  <div class="head" id="head">
    <span class="code">PX</span>
    <span class="tkr" id="tkr">-</span>
    <span class="name" id="coName"></span>
    <span class="tag" id="exTag" style="display:none"></span>
    <span class="tag dim" id="secTag" style="display:none"></span>
    <span class="spacer"></span>
    <span class="asof" id="asOf"></span>
  </div>

  <div class="controls">
    <input class="qin" id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="ticker or company name" aria-label="ticker or company name">
    <span class="hint">TICKER OR NAME</span>
    <div class="sug" id="sug"></div>
  </div>

  <div class="strip" id="b_strip"></div>

  <div class="grid">
    <div class="card" id="c_rel">
      <div class="ch"><span class="cl">RELATIONSHIPS</span><span class="cm" id="m_rel"></span></div>
      <div class="cb" id="b_rel"></div>
    </div>
    <div class="card" id="c_px">
      <div class="ch"><span class="cl">PRICE</span><span class="cm" id="m_px"></span></div>
      <div class="cb" id="b_px"></div>
    </div>
    <div class="card" id="c_fin">
      <div class="ch"><span class="cl">REVENUE / NET PROFIT</span><span class="cm" id="m_fin"></span></div>
      <div class="cb" id="b_fin"></div>
    </div>
    <div class="card" id="c_own">
      <div class="ch"><span class="cl">OWNERSHIP</span><span class="cm" id="m_own"></span></div>
      <div class="cb" id="b_own"></div>
    </div>
    <div class="card" id="c_law">
      <div class="ch"><span class="cl">LAWS / EXPOSURE</span><span class="cm" id="m_law"></span></div>
      <div class="cb" id="b_law"></div>
    </div>
    <div class="card" id="c_news">
      <div class="ch"><span class="cl">NEWS</span><span class="cm" id="m_news"></span></div>
      <div class="cb" id="b_news"></div>
    </div>
  </div>

  <div class="foot">
    <span id="footTk">-</span>
    <span class="sp" id="footNote"></span>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.0.4/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
  'use strict';

  var Q = new URLSearchParams(location.search);
  var EXS = ['NSE','JSE','NGX','EGX'];
  /* which exchange ships which headline file: asking for a file that is not in
     the tree turns a missing dataset into a console 404 and reads like a failed
     read, so the request is only made when the file is part of the product */
  var NEWS_EX = {NSE:1, JSE:1, NGX:1, EGX:1};
  var ANN_EX = {NSE:1, JSE:1, EGX:1};
  var SEC_TITLE = {strip:'TILES', rel:'RELATIONSHIPS', px:'PRICE', fin:'FINANCIALS',
                   own:'OWNERSHIP', law:'LAWS', news:'NEWS'};
  var DASH = '-';

  /* ---------- text, numbers, units ---------------------------------- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* the product prints no em dash and no en dash, including when the dash
     arrives inside a recorded sentence or a headline */
  function nd(s){ return String(s == null ? '' : s).replace(/[\u2013\u2014]/g, '-'); }
  function t(s){ return esc(nd(s)); }

  function isNum(v){ return v !== null && v !== undefined && v !== '' && !isNaN(Number(v)); }
  function numv(v){ return isNum(v) ? Number(v) : null; }

  function isCents(c){ return String(c || '').toUpperCase() === 'ZAC'; }
  function ccyLabel(c){ return isCents(c) ? 'ZAc' : String(c || ''); }

  function fx(v){
    if(!isNum(v)) return DASH;
    var n = Number(v);
    return (Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(2)) + 'x';
  }
  function fpc(v){
    if(!isNum(v)) return DASH;
    var n = Number(v);
    return (Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(2)) + '%';
  }
  function fnum(v, dp){
    if(!isNum(v)) return DASH;
    var n = Number(v);
    if(dp != null) return n.toLocaleString('en-US', {minimumFractionDigits:dp, maximumFractionDigits:dp});
    if(Math.abs(n) >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits:0});
    return n.toFixed(2);
  }
  function fmoney(v){
    if(!isNum(v)) return DASH;
    var f = Number(v), s = f < 0 ? '-' : '', a = Math.abs(f), o;
    if(a >= 1e12) o = (a/1e12).toFixed(2) + 'T';
    else if(a >= 1e9) o = (a/1e9).toFixed(2) + 'B';
    else if(a >= 1e6) o = (a/1e6).toFixed(2) + 'M';
    else if(a >= 1e3) o = (a/1e3).toFixed(2) + 'K';
    else o = a.toFixed(2);
    return s + o;
  }
  function ipx(v){
    if(!isNum(v)) return DASH;
    return Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* ---------- file reads, with the read state kept ---------------- */
  var FILES = {};
  function getJSON(path){
    if(FILES[path]) return FILES[path].p;
    var rec = {ok:false, data:null, err:''};
    rec.p = fetch(path, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){ rec.ok = true; rec.data = d; return d; })
      .catch(function(e){ rec.err = nd(String((e && e.message) || e)); return null; });
    FILES[path] = rec;
    return rec.p;
  }
  function readState(path){
    var r = FILES[path];
    if(!r) return 'unread';
    return r.ok ? 'ok' : 'failed';
  }
  function sd(p){ return '../../static_data/' + p; }

  /* ---------- market index: every exchange, one list ---------------- */
  var MKT = {}, IDX = [], IDX_P = null;
  function loadIndex(){
    if(IDX_P) return IDX_P;
    IDX_P = Promise.all(EXS.map(function(ex){
      return getJSON(sd('market_' + ex + '.json')).then(function(d){
        var rows = (d && d.stocks) || [];
        rows.forEach(function(r){ r.ex = ex; });
        MKT[ex] = rows;
        return rows;
      });
    })).then(function(){
      IDX = [];
      EXS.forEach(function(ex){ (MKT[ex] || []).forEach(function(r){ IDX.push(r); }); });
      return IDX;
    });
    return IDX_P;
  }
  function findRow(tk, exHint){
    var q = String(tk == null ? '' : tk).trim().toUpperCase();
    if(!q) return null;
    var e = exHint ? String(exHint).toUpperCase() : '';
    var pool = IDX.slice();
    if(e) pool.sort(function(a, b){ return (a.ex === e ? 0 : 1) - (b.ex === e ? 0 : 1); });
    var i;
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].ticker || '').toUpperCase() === q) return pool[i];
    }
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].sym || '').toUpperCase() === q) return pool[i];
    }
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].name || '').toUpperCase() === q) return pool[i];
    }
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].name || '').toUpperCase().indexOf(q) >= 0) return pool[i];
    }
    return null;
  }
  function rowTicker(r){ return String((r && (r.ticker || r.sym)) || '').toUpperCase(); }

  /* ---------- the search bar: one input, ticker first then name ------ */
  var SUG = {rows:[], i:0, on:false};
  function rank(q){
    var s = String(q || '').trim().toUpperCase();
    if(!s) return [];
    function pass(needle){
      var out = [];
      for(var i = 0; i < IDX.length; i++){
        var r = IDX[i];
        var tk = String(r.ticker || '').toUpperCase();
        var sy = String(r.sym || '').toUpperCase();
        var nm = String(r.name || '').toUpperCase();
        var sc = -1;
        if(tk === needle || sy === needle) sc = 0;
        else if(tk.indexOf(needle) === 0) sc = 1;
        else if(sy.indexOf(needle) === 0) sc = 2;
        else if(nm.indexOf(needle) === 0) sc = 3;
        else if(tk.indexOf(needle) > 0) sc = 4;
        else if(nm.indexOf(needle) > 0) sc = 5;
        if(sc >= 0) out.push({r:r, sc:sc, len:tk.length});
      }
      out.sort(function(a, b){
        if(a.sc !== b.sc) return a.sc - b.sc;
        if(a.len !== b.len) return a.len - b.len;
        return String(a.r.ticker).localeCompare(String(b.r.ticker));
      });
      return out;
    }
    var hits = pass(s);
    /* the NGX row for Dangote Cement is named "Dangote", so a typed full name
       falls back to its first word rather than answering nothing */
    if(!hits.length && s.indexOf(' ') > 0) hits = pass(s.split(/\s+/)[0]);
    return hits.slice(0, 12).map(function(x){ return x.r; });
  }
  function drawSug(q){

  /* ---------- 1. TOP STRIP ------------------------------------------ */
  function spark(arr, colour){
    if(!arr || arr.length < 2) return '';
    var w = 100, h = 22;
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
    var span = (mx - mn) || 1;
    var pts = arr.map(function(v, i){
      var x = (i / (arr.length - 1)) * w;
      var y = h - 1.5 - ((v - mn) / span) * (h - 3);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + colour + '" stroke-width="1.2" ' +
      'vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
  }
  function vbars(vals, colour){
    if(!vals || !vals.length) return '';
    var max = Math.max.apply(null, vals) || 1;
    var bw = 100 / vals.length;
    var out = vals.map(function(v, i){
      var hh = Math.max(1, (v / max) * 19);
      return '<rect x="' + (i * bw + 0.4).toFixed(2) + '" y="' + (21 - hh).toFixed(2) +
        '" width="' + (bw * 0.62).toFixed(2) + '" height="' + hh.toFixed(2) +
        '" fill="' + colour + '" opacity=".55"/>';
    }).join('');
    return '<svg viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">' + out + '</svg>';
  }
  /* where the last price sits inside the session range the row carries */
  function rangebar(lo, hi, last, colour){
    if(lo == null || hi == null || last == null || hi <= lo) return '';
    var pos = Math.max(0, Math.min(1, (last - lo) / (hi - lo))) * 100;
    return '<svg viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">' +
      '<line x1="0" y1="12" x2="100" y2="12" stroke="#262626" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<line x1="0" y1="8" x2="0" y2="16" stroke="#3a3a3a" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<line x1="100" y1="8" x2="100" y2="16" stroke="#3a3a3a" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<line x1="' + pos.toFixed(1) + '" y1="7" x2="' + pos.toFixed(1) + '" y2="17" stroke="' + colour +
      '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + pos.toFixed(1) + '" cy="12" r="2.2" fill="' + colour + '"/></svg>';
  }
  function tile(o){
    return '<div class="tile"' + (o.title ? ' title="' + t(o.title) + '"' : '') + '>' +
      '<div class="tl">' + o.label + '</div>' +
      '<div class="tv' + (o.vcls ? ' ' + o.vcls : '') + '">' + o.value + '</div>' +
      '<div class="tm">' + (o.micro || '') + '</div>' +
      '<div class="ts">' + (o.sub || '') + '</div></div>';
  }
  function multipleTile(an, key, fmt, period){
    var v = an && an.valuation ? an.valuation : null;
    var raw = v ? v[key] : null;
    var wh = v ? (v[key + '_withheld'] === true) : false;
    var reason = v ? (v[key + '_withheld_reason'] || '') : '';
    if(raw != null && !wh && isNum(raw)){
      return {value: fmt(raw), vcls: '', sub: period || 'NO PERIOD', title: ''};
    }
    if(wh || (raw === null && v)){
      return {value: 'WITHHELD', vcls: 'sm', sub: 'REASON ON HOVER', title: reason || 'withheld'};
    }
    return {value: 'NOT ON FILE', vcls: 'xs', sub: 'NO ANALYTICS', title: 'no valuation record'};
  }
  function drawTiles(box, row, an, hist, histSt){
    var px = numv(row.price) != null ? numv(row.price) : numv(row.ltp);
    var pct = numv(row.chgPct);
    var prev = numv(row.prevClose);
    var dir = pct == null ? 'flat' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'));
    var colour = dir === 'up' ? '#33e29a' : (dir === 'down' ? '#f87171' : '#9a9a9a');
    var bars = (hist && hist.bars) || [];
    var closes = [], vols = [];
    bars.slice(-60).forEach(function(b){ var c = numv(b.c); if(c != null) closes.push(c); });
    bars.slice(-20).forEach(function(b){ var v = numv(b.v); if(v != null) vols.push(v); });
    var histSub = histSt === 'failed' ? 'HISTORY READ FAILED' : (bars.length ? 'HISTORY' : 'NO BARS');

    var h = '';

    h += tile({label:'LAST', value: px == null ? 'NO QUOTE' : ipx(px),
      vcls: px == null ? 'xs' : dir,
      micro: closes.length > 1 ? spark(closes, colour) : '',
      sub: px == null ? 'PRICE NOT STATED' : (ccyLabel(row.currency) + (isCents(row.currency) ? ' CENTS' : '')),
      title: row.name || ''});

    var chgVal = pct == null ? 'NOT STATED' : ((pct >= 0 ? '+' : '') + pct.toFixed(2) + '%');
    h += tile({label:'CHG %', value: chgVal, vcls: pct == null ? 'xs' : dir,
      micro: rangebar(numv(row.low), numv(row.high), px, colour),
      sub: (numv(row.low) != null && numv(row.high) != null)
             ? ('LOW ' + ipx(row.low) + '  HIGH ' + ipx(row.high)) : 'RANGE NOT STATED',
      title: prev != null ? ('prev close ' + ipx(prev)) : ''});

    h += tile({label:'VOLUME', value: isNum(row.volume) ? fmoney(row.volume) : 'NOT STATED',
      vcls: isNum(row.volume) ? '' : 'xs',
      micro: vols.length ? vbars(vols, '#33e29a') : '',
      sub: isNum(row.volume) ? 'SHARES TRADED' : 'NO TAPE',
      title: isNum(row.volume) ? fnum(row.volume, 0) : ''});

    var mc = row.marketCap;
    var mcVal, mcSub, mcCls;
    if(isNum(mc)){ mcVal = fmoney(mc); mcSub = ccyLabel(row.currency) + ' AT LAST'; mcCls = ''; }
    else if(mc != null && String(mc).trim()){ mcVal = String(mc); mcSub = 'AS STATED'; mcCls = ''; }
    else { mcVal = 'NOT STATED'; mcSub = 'NO MARKET CAP'; mcCls = 'xs'; }
    h += tile({label:'MKT CAP', value: mcVal, vcls: mcCls, micro: '',
      sub: isNum(row.sharesIssued) ? (fnum(row.sharesIssued, 0) + ' SHARES') : mcSub,
      title: isNum(mc) ? fnum(mc, 0) : ''});

    var pTag = an && an.valuation ? (an.valuation.pePeriod || an.valuation.asOfPeriod || an.period || '') : '';
    [{l:'P/E', k:'pe', f:fx},
     {l:'P/B', k:'pb', f:fx},
     {l:'P/S', k:'ps', f:fx},
     {l:'EARN YIELD', k:'earnings_yield', f:fpc}].forEach(function(m){
      var o = multipleTile(an, m.k, m.f, pTag);
      h += tile({label:m.l, value:o.value, vcls:o.vcls, micro:'', sub:o.sub, title:o.title});
    });

    box.innerHTML = h;
    meta('strip', px == null ? 'NO QUOTE' : (ccyLabel(row.currency) + '  ' + histSub));
  }

  /* ---------- 2. RELATIONSHIP NETWORK ------------------------------- */
  function relTypes(){
    return [
      {k:'customers', c:'#33e29a', n:'CUSTOMERS'},
      {k:'suppliers', c:'#6ea8fe', n:'SUPPLIERS'},
      {k:'competitors', c:'#f87171', n:'COMPETITORS'},
      {k:'partners', c:'#c08cff', n:'PARTNERS'}
    ];
  }
  function nameKey(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function linkCount(securities){
    var freq = {};
    relTypes().forEach(function(tp){
      Object.keys(securities).forEach(function(k){
        (securities[k][tp.k] || []).forEach(function(e){
          var n = nameKey(e && e.name);
          if(n) freq[n] = (freq[n] || 0) + 1;
        });
      });
    });
    return freq;
  }
  function listedCode(name){
    var n = coreName(name);
    if(!n) return '';
    for(var i = 0; i < IDX.length; i++){
      /* the whole normalised name has to agree: a prefix test would hang the
         Dangote parent company on the DANGCEM ticker */
      if(coreName(IDX[i].name) === n) return rowTicker(IDX[i]);
    }
    return '';
  }
  function codeOf(name){
    var lc = listedCode(name);
    if(lc) return lc;
    var words = String(name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').split(/\s+/)
      .filter(function(w){ return w && w.length > 1; });
    if(!words.length) return '?';
    if(words.length === 1) return words[0].slice(0, 7);
    var ini = words.map(function(w){ return w.charAt(0); }).join('');
    return ini.length >= 2 ? ini.slice(0, 5) : words[0].slice(0, 6);
  }
  function centreNode(cx, cy, label){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="27" fill="#0a1c15" stroke="#33e29a" ' +
      'stroke-width="1.5"/>' +
      '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="12" ' +
      'font-weight="700" fill="#33e29a" font-family="Oxygen Mono,monospace">' + t(label) + '</text>';
  }
  function graphBody(w, h, row, rec, securities){
    var freq = linkCount(securities);
    var nodes = [];
    var seen = {};
    relTypes().forEach(function(tp){
      (rec[tp.k] || []).forEach(function(e){
        var nm = String((e && e.name) || '').trim();
        if(!nm) return;
        var sk = nameKey(nm) + '|' + tp.k;
        if(seen[sk]) return;
        seen[sk] = 1;
        var reason = (e && (e.role || e.note)) || '';
        nodes.push({name:nm, type:tp.k, colour:tp.c, reason:reason,
                    f:(freq[nameKey(nm)] || 1)});
      });
    });
    var cx = w / 2, cy = h / 2 + 2;
    /* two records can resolve to the same short code (Jamii Telecommunications
       and Jamii Telkom both come out as JT), so a repeated code is numbered
       rather than drawn twice under one label */
    var usedCode = {};
    nodes.forEach(function(n){
      var c = codeOf(n.name);
      if(usedCode[c]){ usedCode[c]++; c = c + usedCode[c]; }
      else usedCode[c] = 1;
      n.code = c;
    });
    /* an ellipse, not a circle: the card is wider than it is tall, and a circle
       sized to the height leaves half the width empty */
    var rx = Math.min(w * 0.40, 330), ry = Math.min(h * 0.34, 200);
    var present = relTypes().filter(function(tp){
      return nodes.some(function(n){ return n.type === tp.k; });
    });
    var gap = present.length > 1 ? 13 : 0;
    var avail = 360 - gap * present.length;
    var start = -90;
    present.forEach(function(tp){
      var arr = nodes.filter(function(n){ return n.type === tp.k; });
      var span = avail * (arr.length / Math.max(1, nodes.length));
      arr.forEach(function(n, i){
        var ang = (start + span * ((i + 0.5) / arr.length)) * Math.PI / 180;
        var k = (arr.length > 6 && i % 2) ? 0.72 : 1;
        n.x = cx + Math.cos(ang) * rx * k;
        n.y = cy + Math.sin(ang) * ry * k;
      });
      start += span + gap;
    });
    var out = '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx.toFixed(1) + '" ry="' +
      ry.toFixed(1) + '" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 5"/>';
    nodes.forEach(function(n){
      out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) +
        '" stroke="#33e29a" stroke-opacity=".26" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    nodes.forEach(function(n){
      var r = 5 + Math.min(5, Math.log(n.f + 1) * 2.4);
      out += '<g class="nd"><title>' + t(n.name + (n.reason ? ' | ' + n.reason : '')) + '</title>' +
        '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + r.toFixed(1) +
        '" fill="#050505" stroke="' + n.colour + '" stroke-width="1.3"/>' +
        '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + r + 11).toFixed(1) + '" text-anchor="middle" ' +
        'font-size="9" fill="#b0b0b0" font-family="Oxygen Mono,monospace">' + t(n.code) + '</text></g>';
    });
    out += centreNode(cx, cy, rowTicker(row));
    /* legend, one colour per type, in the corner */
    var counts = {};
    nodes.forEach(function(n){ counts[n.type] = (counts[n.type] || 0) + 1; });
    var ly = h - 8 - (relTypes().length - 1) * 12;
    relTypes().forEach(function(tp, i){
      var y = ly + i * 12;
      out += '<rect x="9" y="' + (y - 6) + '" width="6" height="6" fill="' + tp.c + '"/>' +
        '<text x="20" y="' + y + '" font-size="8" fill="#6a6a6a" letter-spacing=".08em" ' +
        'font-family="Oxygen Mono,monospace">' + tp.n + ' ' + (counts[tp.k] || 0) + '</text>';
    });
    return out;
  }
  function drawRel(box, row, relFile, rec){
    var path = sd('relationships_' + row.ex + '.json');
    if(readState(path) === 'failed' || !relFile){
      box.innerHTML = failBox('RELATIONSHIPS', 'relationships_' + row.ex + '.json not loaded');
      meta('rel', 'FILE NOT READ');
      return;
    }
    var cov = relFile.coverage || {};
    var securities = relFile.securities || {};
    var withOne = isNum(cov.securitiesWithSourcedEntity) ? Number(cov.securitiesWithSourcedEntity)
                                                        : Object.keys(securities).length;
    var listed = isNum(cov.securitiesListed) ? Number(cov.securitiesListed) : null;
    if(!rec){
      var covTxt = withOne + (listed != null ? ' OF ' + listed : '') + ' ' + row.ex +
        ' SECURITIES CARRY A SOURCED RECORD';
      box.innerHTML = '<div class="gwrap"><svg class="gsvg"></svg></div>' +
        '<div class="gsub"><b>NO RECORD</b> | ' + t(covTxt) + '</div>';
      var svg0 = box.querySelector('.gsvg');
      var run0 = function(){
        var r = svg0.getBoundingClientRect();
        var w = Math.round(r.width || box.clientWidth || 600);
        var hh = Math.round(r.height || (box.clientHeight - 18) || 220);
        svg0.setAttribute('viewBox', '0 0 ' + w + ' ' + hh);
        svg0.innerHTML = centreNode(w / 2, hh / 2, rowTicker(row));
      };
      run0();
      PAINT.rel = run0;
      meta('rel', '0 NODES | 0 LINKS');
      return;
    }
    var count = relTypes().reduce(function(a, tp){ return a + (rec[tp.k] || []).length; }, 0);
    if(!count){
      box.innerHTML = empBox('EMPTY RECORD', 'the file carries ' + rowTicker(row) + ' but names nothing');
      meta('rel', '0 NODES | 0 LINKS');
      return;
    }
    box.innerHTML = '<div class="gwrap"><svg class="gsvg"></svg></div>';
    var svg = box.querySelector('.gsvg');
    var run = function(){
      var r = svg.getBoundingClientRect();
      var w = Math.round(r.width || box.clientWidth || 600);
      var hh = Math.round(r.height || box.clientHeight || 260);
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hh);
      svg.innerHTML = graphBody(w, hh, row, rec, securities);
    };
    run();
    PAINT.rel = run;
    meta('rel', count + ' NODES | ' + count + ' LINKS');
  }

  /* ---------- 3. REVENUE / NET PROFIT BARS --------------------------- */
  function hasValue(r){
    return !!(r && (r.values || []).some(function(v){ return isNum(v); }));
  }
  function pickVal(rows, re){
    for(var i = 0; i < rows.length; i++){
      if(re.test(String(rows[i].label || '')) && hasValue(rows[i])) return rows[i];
    }
    return null;
  }
  function finSeries(fin){
    var P = (fin.periods || []);
    var all = (fin.rows || []);
    var rows = all.filter(function(r){ return !r.isGroupHeader; });
    /* a group header labelled "Revenue" carries the total its sub lines add up
       to, so an exact label holding numbers wins over the first line that only
       starts with the word: that one is a component, not the top line */
    var rev = pickVal(all, /^revenue$/i) || pickVal(rows, /^revenue/i) ||
              pickVal(rows, /turnover|net sales/i);
    var np = pickVal(all, /^net profit$/i) || pickVal(all, /^profit for the (year|period)$/i) ||
             pickVal(rows, /net profit|profit for the (year|period)|profit after tax/i);
    var out = [];
    for(var i = P.length - 1; i >= 0; i--){
      out.push({p:P[i], rev: rev ? numv((rev.values || [])[i]) : null,
                       np: np ? numv((np.values || [])[i]) : null});
    }
    return {pts: out};
  }
  function barsSVG(w, h, pts){
    var padL = 46, padR = 6, padT = 17, padB = 17;
    var pw = Math.max(20, w - padL - padR), ph = Math.max(20, h - padT - padB);
    var maxV = 0, minV = 0;
    pts.forEach(function(o){
      [o.rev, o.np].forEach(function(v){
        if(v != null){ if(v > maxV) maxV = v; if(v < minV) minV = v; }
      });
    });
    if(maxV === 0 && minV === 0) return '';
    var span = (maxV - minV) || 1;
    function y(v){ return padT + ph - ((v - minV) / span) * ph; }
    var zero = y(0);
    var n = pts.length || 1;
    var gw = pw / n;
    var bw = Math.max(3, Math.min(22, gw * 0.3));
    var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">';
    [minV, (minV + maxV) / 2, maxV].forEach(function(v){
      var yy = y(v).toFixed(1);
      out += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy +
        '" stroke="#141414" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<text x="' + (padL - 4) + '" y="' + (+yy + 2.5) + '" text-anchor="end" font-size="7.5" ' +
        'fill="#6a6a6a" font-family="Oxygen Mono,monospace">' + t(fmoney(v)) + '</text>';
    });
    out += '<line x1="' + padL + '" y1="' + zero.toFixed(1) + '" x2="' + (w - padR) + '" y2="' +
      zero.toFixed(1) + '" stroke="#262626" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    pts.forEach(function(o, i){
      var cxp = padL + gw * (i + 0.5);
      var x1 = cxp - bw - 1.5, x2 = cxp + 1.5;
      [[o.rev, x1, '#33e29a'], [o.np, x2, '#6ea8fe']].forEach(function(pair){
        var v = pair[0];
        if(v == null) return;
        var top = Math.min(y(v), zero), hh = Math.max(1, Math.abs(y(v) - zero));
        out += '<rect x="' + pair[1].toFixed(1) + '" y="' + top.toFixed(1) + '" width="' +
          bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" fill="' + pair[2] + '" opacity=".85"/>';
        if(bw >= 13 && ph > 60){
          var ly = v >= 0 ? Math.max(padT + 6, top - 3) : Math.min(h - padB - 2, top + hh + 8);
          out += '<text x="' + (pair[1] + bw / 2).toFixed(1) + '" y="' + ly.toFixed(1) +
            '" text-anchor="middle" font-size="7" fill="' + pair[2] + '" opacity=".9" ' +

  function statementTable(fin){
    var ccy = fin.currency || '';
    var periods = (fin.periods || []).slice(0, 3);
    var rows = (fin.rows || []).filter(function(r){ return !r.isGroupHeader; });
    var magSeen = {};
    rows = rows.filter(function(r){
      var vals = r.values || [], any = false, sig = [], neg = [];
      for(var i = 0; i < vals.length; i++){
        if(isNum(vals[i])){ any = true; sig.push(Number(vals[i]).toFixed(2)); neg.push((-Number(vals[i])).toFixed(2)); }
        else { sig.push('x'); neg.push('x'); }
      }
      if(!any) return true;
      var s = sig.join('|'), nn = neg.join('|');
      if(magSeen[s] !== undefined || magSeen[nn] !== undefined) return false;
      magSeen[s] = 1;
      return true;
    });
    var h = '<table class="fin"><thead><tr><th>' + t(ccyLabel(ccy)) + '</th>';
    periods.forEach(function(p){ h += '<th>' + t(p) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.slice(0, 40).forEach(function(r){
      var vals = r.values || [];
      h += '<tr' + (r.isGroupTotal ? ' class="tot"' : '') + '><td class="it">' + t(r.label) + '</td>';
      periods.forEach(function(p, i){
        var v = vals[i];
        h += isNum(v) ? '<td class="' + (Number(v) < 0 ? 'neg' : '') + '">' + fmoney(v) + '</td>'
                      : '<td>' + DASH + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    return h;

  /* ---------- 4. PRICE CHART ----------------------------------------- */
  var PXSTATE = {mode:'none', points:0, bars:0};
  function histPaths(row){
    var tk = rowTicker(row), sy = String(row.sym || '');
    var c = [];
    if(row.ex === 'NSE' || row.ex === 'NGX') c.push(row.ex + '_' + tk + '.json');
    if(sy){ c.push(sy + '.max.json'); c.push(sy + '.json'); }
    c.push(tk + '.max.json'); c.push(tk + '.json');
    var seen = {}, out = [];
    c.forEach(function(k){ if(k && !seen[k]){ seen[k] = 1; out.push(k); } });
    return out;
  }
  function readHistory(row){
    var keys = histPaths(row);
    return (function step(i){
      if(i >= keys.length) return Promise.resolve({d:null, path:sd('history/' + keys[0])});
      var p = sd('history/' + keys[i]);
      return getJSON(p).then(function(d){
        if(d && (d.bars || []).length) return {d:d, path:p};
        return step(i + 1);
      });
    })(0);
  }
  function engineReady(){
    return new Promise(function(res){
      if(window.LightweightCharts) return res(true);
      var t0 = Date.now();
      var iv = setInterval(function(){
        if(window.LightweightCharts){ clearInterval(iv); res(true); }
        else if(Date.now() - t0 > 3500){ clearInterval(iv); res(false); }
      }, 100);
    });
  }
  function svgLine(w, h, closes){
    if(closes.length < 2) return '';
    var padL = 6, padR = 6, padT = 10, padB = 14;
    var pw = w - padL - padR, ph = h - padT - padB;
    var mn = Math.min.apply(null, closes), mx = Math.max.apply(null, closes);
    var span = (mx - mn) || 1;
    var pts = closes.map(function(v, i){
      var x = padL + (i / (closes.length - 1)) * pw;
      var y = padT + ph - ((v - mn) / span) * ph;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<polyline points="' + pts + '" fill="none" stroke="#33e29a" stroke-width="1.3" ' +
      'vector-effect="non-scaling-stroke"/>' +
      '<text x="' + padL + '" y="' + (h - 4) + '" font-size="8" fill="#6a6a6a" ' +
      'font-family="Oxygen Mono,monospace">' + t(ipx(mn)) + '</text>' +
      '<text x="' + padL + '" y="' + (padT + 8) + '" font-size="8" fill="#6a6a6a" ' +
      'font-family="Oxygen Mono,monospace">' + t(ipx(mx)) + '</text></svg>';
  }
  function drawPrice(box, row, hist, histPath, histSt){
    var bars = (hist && hist.bars) || [];
    if(histSt === 'failed'){
      box.innerHTML = failBox('PRICE HISTORY', (histPath || '').split('/').pop() + ' not loaded');
      meta('px', 'FILE NOT READ');
      return;
    }
    if(!bars.length){
      box.innerHTML = empBox('NO BARS ON FILE', 'no price history for ' + rowTicker(row));
      meta('px', '0 BARS');
      return;
    }
    box.innerHTML = '<div class="pxbox"><div class="pxchart"></div><div class="pxfb"></div></div>';
    var host = box.querySelector('.pxchart');
    var fb = box.querySelector('.pxfb');
    var mapped = bars.map(function(b){
      return {time:String(b.t).slice(0, 10), open:numv(b.o), high:numv(b.h), low:numv(b.l),
              close:numv(b.c)};
    }).filter(function(p){ return p.close != null; });
    var canCandle = mapped.every(function(p){
      return p.open != null && p.high != null && p.low != null;
    });
    PXSTATE.bars = bars.length;

    function fallback(){
      host.style.display = 'none';
      fb.style.display = 'block';
      var run = function(){
        var w = Math.round(fb.clientWidth || 0), h = Math.round(fb.clientHeight || 0);
        if(!w || !h) return;
        var closes = mapped.slice(-160).map(function(p){ return p.close; });
        fb.innerHTML = svgLine(w, h, closes) || '<div class="emp">NO BARS</div>';
      };
      run();
      PAINT.px = run;
      PXSTATE.mode = 'svg';
      PXSTATE.points = Math.min(160, mapped.length);
    }

    engineReady().then(function(ok){
      if(!ok || !window.LightweightCharts){ fallback(); return; }
      try{
        var w = Math.max(120, host.clientWidth || 0), h = Math.max(90, host.clientHeight || 0);
        var chart = LightweightCharts.createChart(host, {
          layout:{background:{color:'transparent'}, textColor:'#6a6a6a',
                  fontFamily:'Oxygen Mono, monospace', fontSize:9},
          grid:{vertLines:{color:'rgba(38,38,38,.45)'}, horzLines:{color:'rgba(38,38,38,.45)'}},
          rightPriceScale:{borderColor:'#262626', scaleMargins:{top:.12, bottom:.12}},
          timeScale:{borderColor:'#262626', timeVisible:false, rightOffset:2},
          crosshair:{mode:1},
          handleScroll:true,
          handleScale:true,
          localization:{priceFormatter:function(p){
            return p >= 1000 ? p.toLocaleString(undefined, {maximumFractionDigits:0}) : p.toFixed(2);
          }},
          width:w, height:h
        });
        var series;
        if(canCandle){
          series = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor:'#33e29a', downColor:'#f87171', borderUpColor:'#33e29a',
            borderDownColor:'#f87171', wickUpColor:'#33e29a', wickDownColor:'#f87171',
            priceLineVisible:true, priceLineColor:'#33e29a', priceLineStyle:2
          });
          series.setData(mapped.map(function(p){
            return {time:p.time, open:p.open, high:p.high, low:p.low, close:p.close};
          }));
          PXSTATE.mode = 'candle';
        } else {
          series = chart.addSeries(LightweightCharts.LineSeries, {
            color:'#33e29a', lineWidth:2, priceLineVisible:true, priceLineColor:'#33e29a'
          });
          series.setData(mapped.map(function(p){ return {time:p.time, value:p.close}; }));
          PXSTATE.mode = 'line';
        }
        PXSTATE.points = mapped.length;
        chart.timeScale().fitContent();
        PAINT.px = function(){
          if(!host.clientWidth) return;
          chart.applyOptions({width:host.clientWidth, height:host.clientHeight});
        };
      }catch(e){
        fallback();
      }
    });

    var last = mapped[mapped.length - 1] || {};
    meta('px', fnum(bars.length, 0) + ' BARS | ' + mapped[0].time + ' > ' + last.time);
  }

  /* ---------- 5. NEWS STRIP ------------------------------------------ */
  var SUFFIX = {plc:1, ltd:1, limited:1, group:1, holdings:1, holding:1, company:1, co:1,
                inc:1, corp:1, corporation:1, sa:1, nv:1, ag:1, the:1, public:1, 'and':1};
  function normChars(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function coreName(s){
    return normChars(s).split(' ').filter(function(w){ return w && !SUFFIX[w]; }).join(' ');
  }
  function keysFor(row){
    var keys = [], seen = {};
    function add(k){
      k = normChars(k);
      if(!k || k.length < 3 || seen[k]) return;
      seen[k] = 1;
      keys.push({k:k, single:(k.indexOf(' ') < 0)});
    }
    add(String(row.ticker || ''));
    var sy = String(row.sym || '');
    if(sy && sy.toUpperCase() !== String(row.ticker || '').toUpperCase()){
      add(sy.replace(/\.(JO|CA)$/i, ''));
    }
    add(row.name);
    add(coreName(row.name));
    return keys;
  }
  function rivalsFor(row){
    var core = coreName(row.name);
    if(!core || core.indexOf(' ') >= 0) return [];
    var out = [];
    (MKT[row.ex] || []).forEach(function(p){
      if(rowTicker(p) === rowTicker(row)) return;
      var c = coreName(p.name);
      if(c && c !== core && c.indexOf(core + ' ') === 0) out.push(c);
    });
    return out;
  }
  function namedIn(text, keys, rivals){
    var hay = normChars(text);
    for(var i = 0; i < keys.length; i++){
      var re = new RegExp('(^| )' + escRe(keys[i].k) + '( |$)');
      if(!re.test(hay)) continue;
      if(keys[i].single && rivals.length){
        var blocked = false;
        for(var j = 0; j < rivals.length; j++){
          if(hay.indexOf(rivals[j]) >= 0){ blocked = true; break; }
        }
        if(blocked) continue;
      }
      return true;
    }
    return false;
  }
  function tsOf(it){
    if(isNum(it.ts)) return Number(it.ts) * 1000;
    if(it.date){ var d = Date.parse(it.date); if(!isNaN(d)) return d; }
    if(isNum(it.year)) return Date.UTC(Number(it.year), 0, 1);
    return 0;
  }
  function dateLabel(it){
    if(it.date) return nd(it.date);
    if(isNum(it.year)) return String(it.year);
    return 'NO DATE';
  }
  function drawNews(box, row){
    var nPath = sd(row.ex.toLowerCase() + '_news.json');
    var aPath = sd(row.ex.toLowerCase() + '_announcements.json');
    var newsFile = FILES[nPath] && FILES[nPath].ok ? FILES[nPath].data : null;
    var annFile = FILES[aPath] && FILES[aPath].ok ? FILES[aPath].data : null;
    var newsSt = readState(nPath), annSt = readState(aPath);
    var keys = keysFor(row), rivals = rivalsFor(row);
    var news = [], ann = [];
    if(newsFile){
      (newsFile.items || newsFile || []).forEach(function(it){
        if(!it) return;
        if(namedIn(String(it.title || '') + ' ' + String(it.summary || ''), keys, rivals)) news.push(it);
      });
    }
    if(annFile){
      (annFile.items || annFile || []).forEach(function(it){
        if(!it) return;
        if(namedIn(String(it.title || '') + ' ' + String(it.company || '') + ' ' +
                   String(it.ticker || ''), keys, rivals)) ann.push(it);
      });
    }
    news.sort(function(a, b){ return tsOf(b) - tsOf(a); });
    ann.sort(function(a, b){ return tsOf(b) - tsOf(a); });
    var all = news.map(function(x){ return {it:x, kind:'NEWS'}; })
                  .concat(ann.map(function(x){ return {it:x, kind:'ANN'}; }));
    if(!all.length){
      if(!newsFile && !annFile){
        var bad = [];
        if(newsSt === 'failed') bad.push('news not loaded');
        if(annSt === 'failed') bad.push('filings not loaded');
        if(bad.length){
          box.innerHTML = failBox('HEADLINE FILES', bad.join(', '));
          meta('news', 'FILES NOT READ');
        } else {
          box.innerHTML = empBox('NO HEADLINE FILE', 'none is shipped for ' + row.ex);
          meta('news', 'NO FILE');
        }
        return;
      }
      box.innerHTML = empBox('NO ITEM NAMES ' + rowTicker(row), 'headline and filing files read');
      meta('news', '0 HEADLINES');
      return;
    }
    var shown = all.slice(0, 6);
    box.innerHTML = shown.map(function(x){
      var it = x.it;
      var title = nd(it.title || '');
      var src = it.publisher || it.source || (x.kind === 'ANN' ? 'FILING' : row.ex);
      var inner = it.url
        ? '<a href="' + t(it.url) + '" target="_blank" rel="noopener">' + t(title) + '</a>'
        : t(title);
      return '<div class="ncard"><div class="nd"><span class="ndd">' + t(dateLabel(it)) + '</span>' +
        '<span class="nds">' + t(src) + '</span></div>' +
        '<div class="nt" title="' + t(title) + '">' + inner + '</div></div>';
    }).join('');
    var extra = all.length - shown.length;
    meta('news', all.length + ' ITEM' + (all.length === 1 ? '' : 'S') +
      (extra > 0 ? ' | ' + extra + ' MORE' : '') +
      ' | ' + news.length + ' HEADLINE' + (news.length === 1 ? '' : 'S'));
  }

  /* ---------- 6. LAWS AND EXPOSURE ----------------------------------- */
  function shortLaw(nm){
    var s = String(nm || '');
    s = s.replace(/\((?:No\.|Legal Notice)[^)]*\)/gi, '');
    s = s.replace(/,\s*(19|20)\d\d\s*$/g, '');
    s = s.replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim();
    return s.length > 26 ? s.slice(0, 25) + '.' : s;
  }
  function exposureHits(file, tkr){
    var hits = [];
    var map = (file && (file.sector_exposure || file.sectors)) || {};
    Object.keys(map).forEach(function(secName){
      var rec = map[secName] || {};
      ['direct','indirect'].forEach(function(kind){
        (rec[kind] || []).forEach(function(r){
          var tk = Array.isArray(r) ? r[0] : r.ticker;
          if(String(tk || '').toUpperCase() !== tkr) return;
          hits.push({sector:secName, code:rec.sector_code || '', kind:kind,
                     reason:(Array.isArray(r) ? r[1] : r.reason) || ''});
        });
      });
    });
    return hits;
  }
  function drawLaws(box, row, lawsFile, govFile, govJur){
    var h = '';
    var n = 0;
    var colours = {enacted:0, repealed:0, withdrawn:0};
    if(row.ex !== 'NSE'){
      h += '<span class="chip other">NO LAW FILE ' + t(row.ex) + '</span>';
      meta('law', 'NO LAW FILE');
    } else if(readState(sd('gov_laws_KE.json')) === 'failed' || !lawsFile){
      h += '<span class="chip other">LAW FILE NOT READ</span>';
      meta('law', 'FILE NOT READ');
    } else {
      var tk = rowTicker(row);
      var laws = (lawsFile.laws || []).filter(function(l){
        var list = (l.tickers || []).map(function(x){ return String(x).toUpperCase(); });
        return list.indexOf(tk) >= 0 || list.indexOf('ALL') >= 0;
      });
      laws.sort(function(a, b){
        var A = (a.tickers || []).map(function(x){ return String(x).toUpperCase(); }).indexOf(tk) >= 0 ? 0 : 1;
        var B = (b.tickers || []).map(function(x){ return String(x).toUpperCase(); }).indexOf(tk) >= 0 ? 0 : 1;
        if(A !== B) return A - B;
        return String(b.year || '').localeCompare(String(a.year || ''));
      });
      if(!laws.length) h += '<span class="chip other">NO ACT NAMES ' + t(tk) + '</span>';
      laws.forEach(function(l){
        var st = String(l.status || '').toLowerCase();
        var cl = (st === 'enacted' || st === 'repealed' || st === 'withdrawn') ? st : 'other';
        if(colours[cl] != null) colours[cl]++;
        var tip = [l.name || l.id || '', st || 'status not stated',
                   l.mechanism || '', l.status_note || ''].filter(Boolean).join(' | ');
        h += '<span class="chip ' + cl + '" title="' + t(tip) + '">' +
          (l.year ? '<i>' + t(l.year) + '</i>' : '') + t(shortLaw(l.name || l.id || '')) + '</span>';
        n++;
      });
      meta('law', n + ' ACTS | ' + colours.enacted + ' ENACTED ' + colours.withdrawn + ' WITHDRAWN ' +
        colours.repealed + ' REPEALED');
    }
    /* the government budget link, or one chip saying there is none */
    if(govJur){
      if(readState(sd('gov_exposure_' + govJur + '.json')) === 'failed' || !govFile){
        h += '<span class="chip other">EXPOSURE FILE NOT READ</span>';
      } else {
        var hits = exposureHits(govFile, rowTicker(row));
        if(!hits.length){
          h += '<span class="chip none">NO BUDGET LINK</span>';
        } else {
          hits.slice(0, 2).forEach(function(x){
            h += '<span class="chip gov' + (x.kind === 'indirect' ? ' ind' : '') +
              '" title="' + t(x.reason) + '">' + t(x.sector.toUpperCase()) + ' <b>' +
              t(x.kind.toUpperCase()) + '</b></span>';
          });
        }
      }
    } else {
      /* no budget file covers this exchange at all: the chip still reads as an
         absent link, and its hover says which file would have carried one */
      h += '<span class="chip none" title="no budget file covers ' + t(row.ex) +
        '; the fiscal link is recorded for NSE and JSE">NO BUDGET LINK</span>';
    }
    box.innerHTML = h;
  }

  /* ---------- 7. OWNERSHIP ------------------------------------------- */
  var SEGCOL = ['#33e29a', '#1ecfb0', '#6ea8fe', '#c08cff', '#e0a341'];
  function segColour(i){ return i < SEGCOL.length ? SEGCOL[i] : '#4a4a4a'; }
  function drawOwn(box, row, file){
    var path = sd('shareholders_' + row.ex + '.json');
    if(readState(path) === 'failed' || !file){
      box.innerHTML = failBox('SHAREHOLDER FILE', 'shareholders_' + row.ex + '.json not loaded');
      meta('own', 'FILE NOT READ');
      return;
    }
    var map = file.securities || {};
    var rec = map[row.ticker] || map[row.sym] || map[rowTicker(row)] || null;
    if(!rec){
      box.innerHTML = empBox('NO HOLDER RECORD', Object.keys(map).length + ' ' + row.ex + ' records, not this one');
      meta('own', 'NO RECORD');
      return;
    }
    var holders = [];
    ['substantial','promoters','directors','other'].forEach(function(g){
      (rec[g] || []).forEach(function(x){
        if(!x) return;
        var nm = x.name || x.holder || '';
        if(!nm) return;
        holders.push({name:nm, holding:numv(x.holding != null ? x.holding : x.shares),
                      pct:numv(x.pct)});
      });
    });
    var issued = numv(rec.issued);
    var basis = 'STATED PCT';
    if(!holders.length){
      box.innerHTML = empBox('RECORD CARRIES NO HOLDERS', (rec.asOf ? 'AS AT ' + rec.asOf : '') +
        (issued != null ? ' | ' + fnum(issued, 0) + ' ISSUED' : ''));
      meta('own', '0 HOLDERS');
      return;
    }
    /* per cent comes from the file when it prints one; when it prints share
       counts only the width is shares held over issued shares, and the caption
       says so instead of implying a printed percentage */
    var anyPct = holders.some(function(x){ return x.pct != null; });
    if(!anyPct && issued){
      holders.forEach(function(x){
        if(x.holding != null) x.pct = x.holding / issued * 100;
      });
      basis = 'SHARE OF ISSUED';
    }
    holders = holders.filter(function(x){ return x.pct != null && x.pct > 0; })
                     .sort(function(a, b){ return b.pct - a.pct; });
    if(!holders.length){
      box.innerHTML = empBox('NO HOLDING PERCENTAGE', 'the record carries share counts only');
      meta('own', '0 HOLDERS');
      return;
    }
    var big = holders.filter(function(x){ return x.pct >= 0.5; }).slice(0, 6);
    var sum = big.reduce(function(a, x){ return a + x.pct; }, 0);
    var segs = big.slice();
    if(sum < 99.5) segs.push({name:'OTHER HOLDERS', pct:100 - sum, rest:true});

    var h = '<div class="ofig"><span class="ofv">' + (issued != null ? fnum(issued, 0) : DASH) +
      '</span><span class="ofl">ISSUED</span></div>';
    h += '<div class="obar">';
    segs.forEach(function(s, i){
      h += '<div class="seg" style="width:' + s.pct.toFixed(2) + '%;background:' +
        (s.rest ? '#3a3a3a' : segColour(i)) +
        '" title="' + t(s.name + ' ' + s.pct.toFixed(2) + '%') + '"></div>';
    });
    h += '</div><div class="oleg">';
    segs.slice(0, 3).forEach(function(s, i){
      h += '<div class="olr"><span class="old" style="background:' +
        (s.rest ? '#3a3a3a' : segColour(i)) + '"></span>' +
        '<span class="oln">' + t(s.name) + '</span>' +
        '<span class="olp">' + s.pct.toFixed(2) + '%</span></div>';
    });
    h += '</div>';
    box.innerHTML = h;
    meta('own', segs.length + ' SEGMENTS | ' + basis + (rec.asOf ? ' | ' + rec.asOf : ''));
  }

  /* ---------- the build ---------------------------------------------- */
  var GEN = 0, CUR = null;

  function finPath(row, key, kind){
    var base = '../../static_data/' + (kind === 'analytics' ? 'analytics/' : 'financials/');
    var name = encodeURIComponent(String(key).replace(/\//g, '_'));
    return base + name + (kind === 'analytics' ? '.json' : '__income.json');
  }
  function tryKeys(row){
    var keys = [String(row.ticker || '')];
    if(row.sym && String(row.sym).toUpperCase() !== String(row.ticker).toUpperCase()) keys.push(String(row.sym));
    if(row.ex === 'JSE' && String(row.ticker).indexOf('.') < 0) keys.push(String(row.ticker) + '.JO');
    var seen = {}, out = [];
    keys.forEach(function(k){ if(k && !seen[k]){ seen[k] = 1; out.push(k); } });
    return out;
  }
  function readFirst(row, kind){
    var keys = tryKeys(row);
    return (function step(i){
      if(i >= keys.length) return Promise.resolve(null);
      return getJSON(finPath(row, keys[i], kind)).then(function(d){
        if(d) return {d:d, key:keys[i]};
        return step(i + 1);
      });
    })(0);
  }

  function build(row){
    var gen = ++GEN;
    CUR = row;
    PAINT = {};
    PXSTATE = {mode:'none', points:0, bars:0};
    paintHead(row, null);
    document.getElementById('footNote').textContent = '';

    var ex = row.ex;
    var J = {};
    J.info = getJSON(sd('company_info.json'));
    J.rel = getJSON(sd('relationships_' + ex + '.json'));
    J.news = NEWS_EX[ex] ? getJSON(sd(ex.toLowerCase() + '_news.json')) : Promise.resolve(null);
    J.ann = ANN_EX[ex] ? getJSON(sd(ex.toLowerCase() + '_announcements.json')) : Promise.resolve(null);
    J.sh = getJSON(sd('shareholders_' + ex + '.json'));
    J.fin = readFirst(row, 'income');
    J.an = readFirst(row, 'analytics');
    J.hist = readHistory(row);
    if(ex === 'NSE'){
      J.gov = getJSON(sd('gov_exposure_KE.json'));
      J.laws = getJSON(sd('gov_laws_KE.json'));
    } else if(ex === 'JSE'){
      J.gov = getJSON(sd('gov_exposure_SA.json'));
    }

    Promise.all([J.info, J.rel, J.news, J.ann, J.sh, J.fin, J.an, J.hist,
                 J.gov || null, J.laws || null])
    .then(function(R){
      if(gen !== GEN) return;
      var info = R[0], relFile = R[1], shFile = R[4], fin = R[5], an = R[6], hist = R[7];
      var govFile = R[8], lawsFile = R[9];
      paintHead(row, info && (info[row.ticker] || info[ex + ':' + row.sym] || info[row.sym] || info[rowTicker(row)]));

      var relRec = null;
      if(relFile && relFile.securities){
        var s = relFile.securities;
        relRec = s[row.ticker] || s[row.sym] || s[rowTicker(row)] || null;
      }
      var histSt = hist ? readState(hist.path) : 'unread';

      guardDraw('strip', function(box){
        drawTiles(box, row, an && an.d, hist && hist.d, histSt);
      });
      guardDraw('rel', function(box){ drawRel(box, row, relFile, relRec); });
      guardDraw('fin', function(box){
        drawFin(box, row, fin && fin.d, an && an.d, (fin && fin.key) || rowTicker(row));
      });
      guardDraw('own', function(box){ drawOwn(box, row, shFile); });
      guardDraw('law', function(box){
        drawLaws(box, row, lawsFile, govFile, ex === 'NSE' ? 'KE' : (ex === 'JSE' ? 'SA' : ''));
      });
      guardDraw('news', function(box){ drawNews(box, row); });
      guardDraw('px', function(box){ drawPrice(box, row, hist && hist.d, hist && hist.path, histSt); });

      var bits = [];
      if(relFile && relFile.generated) bits.push('REL ' + relFile.generated);
      if(hist && hist.d && hist.d.realigned_at) bits.push('HIST ' + hist.d.realigned_at);
      document.getElementById('footNote').textContent = nd(bits.join('  '));
    }).catch(function(e){
      if(gen !== GEN) return;
      document.getElementById('b_rel').innerHTML =
        '<div class="fail"><b>DASHBOARD FAILED</b> ' + t(String((e && e.message) || e)) + '</div>';
    });
  }

  function pick(row){
    if(!row) return;
    closeSug();
    var inp = document.getElementById('q');
    if(inp){ inp.value = rowTicker(row); }
    build(row);
  }

  /* ---------- wiring -------------------------------------------------- */
  var inp = document.getElementById('q');
  if(inp){
    inp.addEventListener('input', function(){ drawSug(inp.value); });
    inp.addEventListener('keydown', function(ev){
      var k = ev.key;
      if(k === 'Enter'){
        ev.preventDefault();
        var tok = String(inp.value || '').trim();
        if(!tok) return;
        if(SUG.on && SUG.rows.length){ pick(SUG.rows[SUG.i || 0]); return; }
        var exact = findRow(tok, null);
        if(exact){ pick(exact); return; }
        var first = rank(tok)[0];
        if(first){ pick(first); return; }
        var box = document.getElementById('sug');
        if(box){
          box.innerHTML = '<div class="sg none">NO SECURITY MATCHES "' + t(tok) + '"</div>';
          box.className = 'sug on';
        }
      } else if(k === 'ArrowDown' || k === 'ArrowUp'){
        if(!SUG.on || !SUG.rows.length) return;
        ev.preventDefault();
        var n = SUG.rows.length;
        SUG.i = (SUG.i + (k === 'ArrowDown' ? 1 : n - 1)) % n;
        Array.prototype.forEach.call(document.querySelectorAll('#sug .sg[data-i]'), function(el){
          el.className = 'sg' + (Number(el.getAttribute('data-i')) === SUG.i ? ' sel' : '');
        });
      } else if(k === 'Escape'){
        closeSug();
        inp.blur();
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(closeSug, 120); });
  }
  document.addEventListener('mousedown', function(ev){
    var box = document.getElementById('sug');
    if(box && ev.target !== inp && !box.contains(ev.target) && box.className.indexOf('on') >= 0){
      closeSug();
    }
  });

  /* the shell hands the selection over; adopting it means a panel opened from
     a watchlist click lands on that security, not on a default */
  window.__mtApplySelection = function(sel){
    if(!sel || !(sel.sym || sel.ticker)) return false;
    loadIndex().then(function(){
      var row = findRow(sel.sym || sel.ticker, sel.ex);
      if(row) pick(row);
    });
    return true;
  };
  window.addEventListener('message', function(ev){
    if(!ev || ev.origin !== location.origin) return;
    var d = ev.data;
    if(d && d.__mt === 'selection') window.__mtApplySelection(d);
  });
  function announceReady(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({__mt: 'sel-ready'}, location.origin);
      }
    }catch(e){}
  }

  /* the proof surface: what this panel believes, readable from the DOM */
  function textWords(){
    var txt = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
    return txt ? txt.split(' ').length : 0;
  }
  window.__mtPerpState = function(){
    var tiles = Array.prototype.map.call(document.querySelectorAll('#b_strip .tile'), function(el){
      var l = el.querySelector('.tl'), v = el.querySelector('.tv'), s = el.querySelector('.ts');
      return {label: l ? l.textContent : '', value: v ? v.textContent : '', sub: s ? s.textContent : ''};
    });
    var segs = Array.prototype.map.call(document.querySelectorAll('#b_own .seg'), function(el){
      return {w: el.style.width, c: el.style.background, t: el.getAttribute('title')};
    });
    var chips = Array.prototype.map.call(document.querySelectorAll('#b_law .chip'), function(el){
      return {text: el.textContent.trim(), cls: el.className.replace('chip', '').trim()};
    });
    return {
      ticker: CUR ? rowTicker(CUR) : '', ex: CUR ? CUR.ex : '', name: CUR ? nd(CUR.name || '') : '',
      tiles: tiles,
      rel: {nodes: document.querySelectorAll('#b_rel .nd').length,
            edges: document.querySelectorAll('#b_rel line').length,
            legend: Array.prototype.map.call(
              document.querySelectorAll('#b_rel svg text'), function(e){ return e.textContent; })
              .filter(function(s){ return /^(CUSTOMERS|SUPPLIERS|COMPETITORS|PARTNERS) /.test(s); })},
      fin: {periods: document.querySelectorAll('#b_fin text[text-anchor="middle"]').length,
            labels: Array.prototype.map.call(
              document.querySelectorAll('#b_fin svg text[text-anchor="middle"]'),
              function(e){ return e.textContent; })},
      px: {mode: PXSTATE.mode, points: PXSTATE.points, bars: PXSTATE.bars},
      news: {cards: document.querySelectorAll('#b_news .ncard').length},
      laws: {chips: chips},
      own: {segments: segs},
      inputs: document.querySelectorAll('input').length,
      buttons: document.querySelectorAll('button').length,
      words: textWords()
    };
  };

  /* boot */
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      /* open on a security of the exchange the shell shows that carries a
         relationship record, so the first screen is a dossier not an empty frame */
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
