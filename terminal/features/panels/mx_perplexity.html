      if(el.getAttribute('data-a') === key || el.getAttribute('data-b') === key)
        el.classList.add('hv');
      else el.classList.add('dim');
    });
  }
  function clearHover(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd, path.eg'), function(el){
      el.classList.remove('hv');
      el.classList.remove('dim');
    });
  }
  /* the chip focus is marked on the drawn svg: selected leaves get a halo in
     their own colour, the rest recede but stay drawn and stay counted */
  function applyFocus(svg){
    if(!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      var on = !!G.cat && el.getAttribute('data-cl') === G.cat;
      if(on) el.classList.add('cat-on'); else el.classList.remove('cat-on');
      if(G.cat && !on) el.classList.add('rcd'); else el.classList.remove('rcd');
      var leaf = el.querySelector('circle.lf');
      var halo = el.querySelector('circle.ch');
      if(on && leaf && !halo){
        var ns = 'http://www.w3.org/2000/svg';
        halo = document.createElementNS(ns, 'circle');
        halo.setAttribute('class', 'ch');
        halo.setAttribute('cx', leaf.getAttribute('cx'));
        halo.setAttribute('cy', leaf.getAttribute('cy'));
        halo.setAttribute('r', (Number(leaf.getAttribute('r')) + 3.2).toFixed(1));
        halo.setAttribute('stroke', leaf.getAttribute('stroke'));
        el.insertBefore(halo, leaf);
      } else if(!on && halo){
        halo.parentNode.removeChild(halo);
      }
    });
    Array.prototype.forEach.call(svg.querySelectorAll('path.eg'), function(el){
      if(G.cat && el.getAttribute('data-t') !== G.cat) el.classList.add('rcd');
      else el.classList.remove('rcd');
    });
  }
  function wireNodes(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('.nd'), function(el){
      var key = el.getAttribute('data-k') || '';
      var cl = el.getAttribute('data-cl') || '';
      el.addEventListener('mouseenter', function(){ hoverNode(svg, key); });
      el.addEventListener('mouseleave', function(){ clearHover(svg); });
      el.addEventListener('click', function(ev){
        if(MAP.moved) return;
        ev.stopPropagation();
        G.selKey = key;
        markNode(svg);
        paintSel();
      });
    });
  }
  function findNode(key){
    var m = G.model;
    if(!m || !key) return null;
    if(m.centre.key === key) return m.centre;
    var all = m.ring1.concat(m.ring2);
    for(var i = 0; i < all.length; i++){ if(all[i].key === key) return all[i]; }
    return null;
  }
  function actBasis(n){
    if(!G.law || !n || !n.co) return '';
    if(n.st === 'direct'){
      if(n.why === 'named') return 'DIRECT, NAMED BY ACT';
      if(n.why === 'all') return 'DIRECT, ACT NAMES ALL ' + ((G.tm && G.tm.ex) || '') + ' ISSUERS';
      return 'DIRECT, SECTOR NAMED BY ACT';
    }
    if(n.st === 'hop1') return 'HOP 1, ONE RECORDED LINK FROM A DIRECT COMPANY';
    if(n.st === 'hop2') return 'HOP 2, ONE LINK FURTHER, DIMMER';
    return 'NOT REACHED BY THIS ACT';
  }
  /* one pinned node: name, code, board, cluster, hop, the Act's verdict, the
     recorded note and the source it was read from */
  function nodePane(box, n){
    var isC = String(n.key || '').indexOf('C:') === 0;
    var h = '';
    h += '<div class="srow"><span class="sk">NAME</span><span class="sv clip" title="' +
      t(n.name) + '">' + t(n.name) + '</span></div>';
    h += '<div class="srow"><span class="sk">CODE</span><span class="sv tk">' +
      t(n.code || n.tk || DASH) + '</span><span class="sk sk2">' + t(n.ex || '') + '</span></div>';
    if(isC){
      h += '<div class="srow"><span class="sk">PRICE</span><span class="sv">' + t(fmtP(n.price)) +
        ' ' + t(n.currency || '') + '</span><span class="sk sk2">' + t(fmtPct(n.pct)) + '</span></div>';
      h += '<div class="srow"><span class="sk">SECTOR</span><span class="sv dm">' +
        t(n.sector || DASH) + '</span></div>';
      h += '<div class="srow"><span class="sk">AS OF</span><span class="sv dm">' +
        t(n.asOf || DASH) + '</span></div>';
      h += '<div class="srow"><span class="sk">RECORD</span><span class="sv dm">' +
        recCount(n.rec) + ' LINKS ON FILE</span></div>';
      box.innerHTML = h;
      meta('sel', 'CENTRE | ' + (n.ex || ''));
      return;
    }
    h += '<div class="srow"><span class="sk">CLUSTER</span><span class="sv wr">' +
      t(String(n.cluster || '').toUpperCase()) + '</span>' +
      (n.link && String(n.link).toUpperCase() !== String(n.cluster || '').toUpperCase()
        ? '<span class="sk sk2">' + t(n.link) + '</span>' : '') + '</div>';
    if(n.hop){
      h += '<div class="srow"><span class="sk">HOP</span><span class="sv dm">' +
        (n.hop || 1) + '</span></div>';
    }
    if(G.law && n.co){
      h += '<div class="srow"><span class="sk">ACT</span><span class="sv ' +
        (n.st === 'direct' ? 'wr' : 'dm') + '" title="' + t(actBasis(n)) + '">' +
        t(actBasis(n)) + '</span></div>';
    }
    if(n.cat === 'laws'){
      h += '<div class="srow"><span class="sk">CLAUSE</span><span class="sv ' +
        (n.clause ? 'wr' : 'dm') + '" title="' +
        t((n.clauseList || []).map(function(x){ return x.cite + ' - ' + x.effect; }).join('  |  ')
          || n.clauseWhy) + '">' +
        t(n.clause || 'NOT ON FILE') + '</span></div>';
      if(!n.clause && n.clauseWhy){
        h += '<div class="srow"><span class="sk">WHY</span><span class="sv clip dm" title="' +
          t(n.clauseWhy) + '">' + t(n.clauseWhy) + '</span></div>';
      }
    }
    h += '<div class="srow"><span class="sk">NOTE</span><span class="sv clip" title="' +
      t(n.reason || '') + '">' + t(n.reason || 'none recorded') + '</span></div>';
    h += '<div class="srow"><span class="sk">SOURCE</span><span class="sv dm" title="' +
      t(n.src || '') + '">' + t(n.src || DASH) + '</span></div>';
    box.innerHTML = h;
    meta('sel', String(n.cluster || '').toUpperCase() + (n.hop ? ' | HOP ' + n.hop : ''));
  }

  /* one category from the chip row: a heading with the count, then a compact
     record per row carrying name, ticker and board where they are known, the
     link type, the hop and the source. A category with nothing behind it says
     so here rather than leaving the pane blank. */
  function catPane(box, k){
    var m = G.model, c = null;
    if(m){ m.cats.forEach(function(x){ if(x.k === k) c = x; }); }
    if(!c){
      box.innerHTML = '<div class="emp"><b>NO CATEGORY</b> ' + t(String(k || '').toUpperCase()) +
        ' is not on this map</div>';
      meta('sel', String(k || '').toUpperCase());
      return;
    }
    var count = c.state === 'fail' ? 'FILE NOT READ'
      : (c.total + (c.k === 'laws' ? ' OF ' + (c.ofTotal || 0) + ' ACTS' : ' ON FILE'));
    var head = '<div class="chead"><b>' + t(c.n) + '</b><span class="cc">' + t(count) +
      '</span></div>';
    meta('sel', c.n + ' | ' + count);
    if(c.state === 'fail'){
      box.innerHTML = head + '<div class="fail"><b>FILE NOT READ</b> ' + t(c.file) + ': ' +
        t(c.err || 'not loaded') + '</div>';
      return;
    }
    if(!c.items.length){
      box.innerHTML = head + '<div class="emp"><b>NONE ON FILE</b> ' + t(c.emptyMsg) + '</div>';
      return;
    }
    var h = head, onMap = 0;
    c.items.forEach(function(it){
      var tag = it.tag || (it.code ? (it.code + (it.ex ? ' ' + it.ex : '')) : 'NO TICKER');
      if(it.drawn === true) onMap++;
      h += '<div class="crow' + (it.drawn === true ? '' : ' ndoff') + '" data-k="' + t(it.key) + '">' +
        '<div class="r1"><span class="rnm" title="' + t(it.name) + '">' + t(it.name) +
        '</span><span class="rtk">' + t(tag) + '</span></div>' +
        '<div class="r2"><span class="rl2">' + t(it.link) + '</span>' +
        '<span class="rh">HOP ' + it.hop + '</span>' +
        '<span class="rsrc" title="' + t(it.src || '') + '">' +
        t(it.src || 'no source on file') + '</span></div></div>';
    });
    if(onMap < c.items.length){
      h += '<div class="cnote">' + onMap + ' OF ' + c.items.length +
        ' ON MAP, THE RING IS FULL</div>';
    }
    box.innerHTML = h;
  }

  function paintSel(){
    var box = document.getElementById('b_sel');
    if(!box) return;
    var n = findNode(G.selKey);
    if(n){ nodePane(box, n); return; }
    if(G.cat){ catPane(box, G.cat); return; }
    if(G.model && G.model.centre){ nodePane(box, G.model.centre); return; }
    box.innerHTML = '<div class="emp"><b>NO MAP</b> this security has no relationship ' +
      'record to draw</div>';
    meta('sel', DASH);
  }
  function paintChips(){
    Array.prototype.forEach.call(document.querySelectorAll('#c_type .ft'), function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-t') === G.cat ? 'true' : 'false');
    });
  }

  /* ---------- 9. draw ------------------------------------------- */
  /* ---------- LAWS ON THIS SECURITY, compact readout ----------
   Direction comes from the Act operative verb and nothing else: a levy imposed
   or raised is a cost the company bears, a levy removed or an exemption granted
   is relief. Where the verb does not settle it the row says NOT STATED rather
   than guessing. This is not a price view and the panel says so underneath. */
  /* THE CLAUSE, NAMED. An Act that reaches a company reaches it through one
     provision, not through its title, so every place this panel names an Act
     also names the provision: the section of the amending Act and, where it
     rewrites another statute, the provision of that statute as it now reads.
     The citations were read from the Acts' own text (gov_laws_KE.json carries
     the read date). A record with no enacted text to cite says so and why,
     and no number is ever inferred from a summary. */
  function lawClauses(l){ return (l && l.clauses) || []; }
  function clauseCite(l){
    var c = lawClauses(l);
    if(!c.length) return '';
    return c.map(function(x){ return x.cite; }).join(', ');
  }
  function clauseHTML(l){
    var c = lawClauses(l);
    if(!c.length){
      var why = (l && l.clauses_not_on_file) || 'no clause is recorded for this instrument';
      return '<div class="lcl"><span class="nocl"><b>CLAUSE NOT ON FILE.</b> ' + t(why) + '</span></div>';
    }
    return '<div class="lcl">' + c.map(function(x){
      return '<b>' + t(x.cite) + '</b>, ' + t(x.instrument) +
             (x.effect ? ' <span style="color:var(--tx3)">' + t(x.effect) + '</span>' : '');
    }).join('<br>') + '</div>';
  }
  function lawDirection(l){
    var m = String((l && l.mechanism) || '').toLowerCase().replace(/^[\s"'(]+/, '');
    if(/^(imposes|adds|introduces|increases|raises|charges|extends|requires)\b/.test(m)) return {k:'neg', t:'COST'};
    /* "Sets" and "Inserts" are only a cost when the object is a rate or a payment.
       "Sets the permitted methods for selling a shareholding" is not a cost, so
       the object has to name the charge. */
    if(/^(sets|inserts)\b[^.]*\b(excise|duty|lev(y|ies)|tax|fee|rate|shall pay|each pay)\b/.test(m)) return {k:'neg', t:'COST'};
    if(/^(exempts|removes|deletes|reduces|cuts|lowers|abolishes|grants)\b/.test(m)) return {k:'pos', t:'RELIEF'};
    /* "Repeals" says nothing on its own: repealing a levy is relief, repealing a
       fund and replacing it with a mandatory contribution is a cost. So it is
       not treated as relief, and the object of the repeal decides. */
    if(/^repeals?\b/.test(m)){
      if(/\b(imposes|requires|statutory|shall pay|contribut|mandatory)\b/.test(m)) return {k:'neg', t:'COST'};
      return {k:'uns', t:'NOT STATED'};
    }
    if(/\b(and requires|as well as|while also)\b/.test(m)) return {k:'mix', t:'MIXED'};
    return {k:'uns', t:'NOT STATED'};
  }
  function renderLaws(row){
    var box = document.getElementById('b_law'), meta = document.getElementById('m_law');
    if(!box) return;
    if(LAW.st === 'failed'){
      box.innerHTML = '<div class="lawempty">gov_laws_KE.json could not be read, so no Act is claimed against this security.</div>';
      if(meta) meta.textContent = 'ACT FILE NOT READ';
      return;
    }
    if(!row){
      box.innerHTML = '<div class="lawempty">Pick a company to see the Acts that name it.</div>';
      if(meta) meta.textContent = '';
      return;
    }
    var hits = lawHits(row);
    if(meta) meta.textContent = hits.length + ' OF ' + (LAW.list || []).length + ' ACTS';
    if(!hits.length){
      box.innerHTML = '<div class="lawempty">No Act on file names this security or its sector.</div>';
      return;
    }
    box.innerHTML = hits.map(function(l){
      var d = lawDirection(l), st = String(l.status || '').toLowerCase();
      var mech = String(l.mechanism || '').replace(/\s+/g, ' ').trim();
      return '<div class="lawrow st-' + esc(st) + '">' +
               '<div><div class="lh"><span class="lc">' + esc(lawCode(l.id, l.year)) + '</span>' +
                 '<span class="ly">' + esc(String(l.year || '')) +
                   (st && st !== 'enacted' ? ' ' + esc(st.toUpperCase()) : '') + '</span></div>' +
                 '<div class="lm" title="' + esc(mech) + '">' + esc(mech) + '</div>' +
                 clauseHTML(l) + '</div>' +
               '<span class="dir ' + d.k + '">' + d.t + '</span></div>';
    }).join('') +
    '<div class="lawbasis">DIRECTION IS READ FROM THE OPERATIVE VERB OF THE ACT: A LEVY IMPOSED IS A COST TO THE COMPANY, A LEVY REMOVED IS RELIEF. IT IS NOT A PRICE VIEW.</div>';
  }

  /* ---------- the same map, turned ---------------------------------------
     3D draws the MODEL the flat map draws: the same nodes, the same recorded
     links, the same colours and the same Act marking. Nothing is added to the
     graph to fill the third dimension and no position carries a quantity - the
     depth is there to pull the clusters apart, because six categories that
     have to share one circle on a flat map get a cone each here, and a link
     that crosses the middle of the flat map no longer crosses anything.
     One canvas, one projection, painter's algorithm, no WebGL and no library. */
  var V3 = {on:false, yaw:-0.62, pitch:0.42, zoom:1, clusters:[], spin:0, cv:null, cx:null,
            hov:'', pos:null, ticking:false,
            DPR:Math.min(window.devicePixelRatio || 1, 2)};

  function proj3(p, W, H){
    var cy = Math.cos(V3.yaw), sy = Math.sin(V3.yaw);
    var x1 = p.x*cy - p.z*sy, z1 = p.x*sy + p.z*cy;
    var cp = Math.cos(V3.pitch), sp = Math.sin(V3.pitch);
    var y1 = p.y*cp - z1*sp, z2 = p.y*sp + z1*cp;
    var s = Math.min(W, H*1.6) * 0.30 * V3.zoom;
    /* a weak perspective divide on top of the rotation. Orthographic alone
       puts a node pointing straight at the reader on top of the centre with
       nothing to tell them apart; this pulls the near side open and pushes
       the far side back, which is the whole reason for turning the map. */
    /* kept weak on purpose: a stronger divide throws the outer shell off the
       frame on the near side, which is a distortion and not a depth cue */
    var f = 1 / (1 + 0.15 * z2);
    return { x: W/2 + x1*s*f, y: H/2 - y1*s*f, d: z2, f: f };
  }
  function dir3(az, el, rad){
    return { x: Math.cos(el)*Math.cos(az)*rad, y: Math.sin(el)*rad,
             z: Math.cos(el)*Math.sin(az)*rad, az:az, el:el };
  }
  /* Each category keeps its own cone of directions, so a cluster reads as a
     cluster from any angle, and a ring 2 node sits beside the ring 1 node the
     record was read from rather than anywhere on an outer circle. */
  function place3(m){
    var pos = {};
    pos[m.centre.key] = dir3(0, 0, 0);
    pos[m.centre.key].n = m.centre;
    var groups = {}, order = [];
    m.ring1.forEach(function(it){
      var k = it.cat || 'other';
      if(!groups[k]){ groups[k] = []; order.push(k); }
      groups[k].push(it);
    });
    var gN = order.length || 1;
    V3.clusters = [];
    order.forEach(function(k, gi){
      var arr = groups[k], n = arr.length;
      var az0 = (gi/gN) * Math.PI * 2;
      /* the cone's own direction, so the cluster can name itself in the air
         above its nodes instead of the reader counting colours */
      V3.clusters.push({ k:k, n:n, col:(arr[0] && arr[0].colour) || GREY,
                           p: dir3(az0, 0.02, 1.34) });
      var spread = Math.min(0.62, 0.17 * Math.max(1, n - 1));
      arr.forEach(function(it, i){
        var az = az0 + (n > 1 ? ((i/(n-1)) - 0.5) * spread : 0);
        var el = (n > 1 ? (((i % 2) ? 1 : -1) * (0.10 + 0.40 * (i/n))) : 0.06);
        var p = dir3(az, el, 1.0);
        p.n = it;
        pos[it.key] = p;
      });
    });
    var kids = {};
    m.ring2.forEach(function(it){
      var par = it.parent || m.centre.key;
      kids[par] = (kids[par] || 0) + 1;
      var pp = pos[par] || pos[m.centre.key];
      var i = kids[par] - 1;
      var p = dir3((pp.az || 0) + ((i % 3) - 1) * 0.17,
                   (pp.el || 0) + (((i % 2) ? 1 : -1) * 0.13 + (i > 2 ? 0.1 : 0)), 1.78);
      p.n = it;
      pos[it.key] = p;
    });
    return pos;
  }
  function node3r(n){
    if(String(n.key || '').indexOf('C:') === 0) return 9.5;
    return n.hop === 2 ? 3.4 : 5.0;
  }
  function dim3(n){
    /* the Act dims what it does not reach, exactly as the flat map does */
    if(!G.law || !n.co) return 1;
    if(n.st === 'direct') return 1;
    if(n.st === 'hop1') return 0.82;
    if(n.st === 'hop2') return 0.6;
    return 0.3;
  }
  function draw3(){
    var cv = V3.cv, cx = V3.cx, m = G.model;
    if(!cv || !cx || !m) return;
    var W = cv.clientWidth, H = cv.clientHeight;
    if(!W || !H) return;
    cv.width = Math.round(W*V3.DPR); cv.height = Math.round(H*V3.DPR);
    cx.setTransform(V3.DPR,0,0,V3.DPR,0,0);
    cx.clearRect(0,0,W,H);
    var font = "10px 'Oxygen Mono',ui-monospace,Menlo,Consolas,monospace";
    if(!V3.pos) V3.pos = place3(m);
    var P = V3.pos, pr = {}, dmin = 1e9, dmax = -1e9;
    Object.keys(P).forEach(function(k){
      var q = proj3(P[k], W, H);
      q.n = P[k].n;
      pr[k] = q;
      if(q.d < dmin) dmin = q.d;
      if(q.d > dmax) dmax = q.d;
    });
    /* Three faint great circles on the ring 1 shell and one on the ring 2
       shell. They carry no data: they are the frame that tells the eye this
       is a sphere being turned and not a flat star, and they are drawn first
       so nothing on the graph is obscured by them. */
    [[1.0, '#1f1f1f', []], [1.78, '#171717', [3,4]]].forEach(function(sh){
      var rad = sh[0], planes = (rad === 1.0) ? [0,1,2] : [0];
      planes.forEach(function(pl){
        cx.beginPath();
        for(var a=0; a<=64; a++){
          var th = (a/64) * Math.PI * 2, v;
          if(pl === 0) v = { x:Math.cos(th)*rad, y:0, z:Math.sin(th)*rad };
          else if(pl === 1) v = { x:Math.cos(th)*rad, y:Math.sin(th)*rad, z:0 };
          else v = { x:0, y:Math.sin(th)*rad, z:Math.cos(th)*rad };
          var q = proj3(v, W, H);
          if(a) cx.lineTo(q.x, q.y); else cx.moveTo(q.x, q.y);
        }
        cx.strokeStyle = sh[1]; cx.lineWidth = 1;
        cx.setLineDash(sh[2]); cx.stroke(); cx.setLineDash([]);
      });
    });

    var dspan = (dmax - dmin) || 1;
    /* 0 is the farthest thing on screen, 1 the nearest: a node is drawn a
       little larger and a little brighter as it comes forward, which is the
       only depth cue an orthographic projection gives for free */
    function nearD(d){ return (d - dmin) / dspan; }

    /* every link and every node in one list, painted far to near: a larger
       projected depth is farther away, so it goes down first */
    var items = [];
    (m.edges || []).forEach(function(e){
      var a = pr[e.a], b = pr[e.b];
      if(!a || !b) return;
      items.push({ t:'e', d:(a.d + b.d)/2, a:a, b:b, hop:e.hop,
                   col:(b.n && b.n.colour) || GREY, nb:b.n });
    });
    Object.keys(pr).forEach(function(k){ items.push({ t:'n', d:pr[k].d, k:k, p:pr[k], n:pr[k].n }); });
    items.sort(function(x, y){ return y.d - x.d; });

    var labels = [];
    items.forEach(function(it){
      if(it.t === 'e'){
        var al = 0.5 * dim3(it.nb) * (it.hop === 2 ? 0.6 : 1) * (0.5 + 0.5*nearD(it.b.d));
        cx.strokeStyle = it.col;
        cx.globalAlpha = Math.max(0.08, Math.min(0.85, al));
        cx.lineWidth = it.hop === 2 ? 0.7 : 1.1;
        cx.beginPath(); cx.moveTo(it.a.x, it.a.y); cx.lineTo(it.b.x, it.b.y); cx.stroke();
        cx.globalAlpha = 1;
        return;
      }
      var n = it.n, isC = String(n.key || '').indexOf('C:') === 0;
      var r = node3r(n) * (0.70 + 0.34 * nearD(it.d)) * (it.p.f || 1) * (0.85 + 0.15*V3.zoom);
      var col = isC ? '#f5c542' : (n.colour || GREY);
      var a = dim3(n);
      cx.globalAlpha = a;
      cx.beginPath(); cx.arc(it.p.x, it.p.y, r, 0, 6.3);
      cx.fillStyle = col; cx.fill();
      cx.lineWidth = 1; cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.stroke();
      /* the Act's own marking: the amber halo the flat map puts on a leaf */
      if(G.law && n.st === 'direct'){
        cx.beginPath(); cx.arc(it.p.x, it.p.y, r + 3.4, 0, 6.3);
        cx.strokeStyle = AMB; cx.lineWidth = 1.4; cx.stroke();
      }
      if(n.key === G.selKey || n.key === V3.hov){
        cx.beginPath(); cx.arc(it.p.x, it.p.y, r + 5.2, 0, 6.3);
        cx.strokeStyle = '#ffffff'; cx.lineWidth = n.key === G.selKey ? 1.6 : 1;
        cx.stroke();
      }
      cx.globalAlpha = 1;
      /* every node names itself here. The flat map has to drop a hop 2 label
         for room; the sphere has room, and an unnamed dot is not a record. */
      var show = true;
      if(show){
        labels.push({ txt: isC ? (n.tk || n.name) : leafLabel(n),
                      x: it.p.x + r + 5, y: it.p.y + 3.2, col: col,
                      a: isC ? 1 : Math.max(0.42, a * (0.45 + 0.55*nearD(it.d))),
                      big: isC });
      }
    });

    /* the names last, so no node paints over one, and nudged apart: two names
       on top of each other name nothing */
    var placed = [];

    /* the cluster names, out at the end of each cone. They are placed first
       and kept in the same collision set, so a company name is never buried
       under a category name. */
    (V3.clusters || []).forEach(function(c){
      var q = proj3(c.p, W, H);
      var txt = String(c.k).toUpperCase() + ' ' + c.n;
      cx.font = "9px 'Oxygen Mono',ui-monospace,Menlo,Consolas,monospace";
      cx.textAlign = 'center';
      var w2 = cx.measureText(txt).width;
      cx.globalAlpha = 0.30 + 0.45 * nearD(q.d);
      cx.fillStyle = c.col;
      cx.fillText(txt, q.x, q.y);
      cx.globalAlpha = 1;
      placed.push({ x:q.x - w2/2, y:q.y, w:w2 });
    });
    labels.forEach(function(L){
      cx.font = L.big ? "11.5px 'Oxygen Mono',ui-monospace,Menlo,Consolas,monospace" : font;
      var tw = cx.measureText(L.txt).width, tx = L.x, ty = L.y;
      if(tx + tw > W - 3) tx = Math.max(3, L.x - tw - (L.big ? 22 : 14));
      for(var g=0; g<8; g++){
        var cl = placed.filter(function(p){
          return Math.abs(p.y - ty) < 11 && tx < p.x + p.w + 6 && p.x < tx + tw + 6;
        })[0];
        if(!cl) break;
        ty = (cl.y + 12 < H - 3) ? cl.y + 12 : Math.max(10, cl.y - 12);
      }
      placed.push({x:tx, y:ty, w:tw});
      cx.globalAlpha = L.a;
      cx.fillStyle = L.col;
      cx.textAlign = 'left';
      cx.fillText(L.txt, tx, ty);
      cx.globalAlpha = 1;
    });
  }
  function hit3(mx, my, W, H){
    var P = V3.pos, best = '', bd = 1e9;
    if(!P) return '';
    Object.keys(P).forEach(function(k){
      var q = proj3(P[k], W, H);
      var dd = (q.x-mx)*(q.x-mx) + (q.y-my)*(q.y-my);
      if(dd < bd){ bd = dd; best = k; }
    });
    return bd < 260 ? best : '';
  }
  function mount3(cv){
    V3.cv = cv; V3.cx = cv.getContext('2d');
    var dragging = false, lx = 0, ly = 0, moved = false;
    cv.addEventListener('pointerdown', function(e){
      dragging = true; moved = false; lx = e.clientX; ly = e.clientY;
      V3.spin = 0; paintSpin();
      cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointerup', function(e){
      dragging = false; cv.classList.remove('drag');
      if(moved) return;
      var r = cv.getBoundingClientRect();
      var k = hit3(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
      if(k){ G.selKey = k; draw3(); paintSel(); }
    });
    cv.addEventListener('pointerleave', function(){
      dragging = false; cv.classList.remove('drag');
      if(V3.hov){ V3.hov = ''; draw3(); }
    });
    cv.addEventListener('pointermove', function(e){
      var r = cv.getBoundingClientRect();
      if(dragging){
        if(Math.abs(e.clientX - lx) > 2 || Math.abs(e.clientY - ly) > 2) moved = true;
        V3.yaw += (e.clientX - lx) * 0.0075;
        V3.pitch = Math.max(-0.55, Math.min(1.25, V3.pitch + (e.clientY - ly) * 0.0055));
        lx = e.clientX; ly = e.clientY;
        draw3();
        return;
      }
      var k = hit3(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
      if(k !== V3.hov){ V3.hov = k; draw3(); }
    });
    cv.addEventListener('wheel', function(e){
      e.preventDefault();
      V3.zoom = Math.max(0.5, Math.min(4.5, V3.zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
      var zk = document.getElementById('zk');
      if(zk) zk.textContent = V3.zoom.toFixed(1) + 'x';
      draw3();
    }, {passive:false});
    if(!V3.ticking){
      V3.ticking = true;
      (function tick(){
        if(V3.on && V3.spin && V3.cv && V3.cv.clientWidth){ V3.yaw += 0.004; draw3(); }
        requestAnimationFrame(tick);
      })();
    }
    draw3();
  }

  function renderMap(box){
    box.innerHTML = '<div class="gwrap"></div><div class="gsub" id="gsub"></div>';
    var wrap = box.querySelector('.gwrap');
    /* the model is rebuilt on every pass, so a resize never re-places stale
       nodes and the header can never disagree with what is on screen */
    var lastW = 0, lastH = 0;
    function run(){
      var r = wrap.getBoundingClientRect();
      var w = Math.round(r.width || box.clientWidth || 600);
      var hh = Math.round(r.height || box.clientHeight || 300);
      if(w < 80 || hh < 80) return;
      if(w === lastW && hh === lastH) return;
      lastW = w; lastH = hh;
      var m = buildRadial(G.row);
      G.model = m;
      /* THE TURNED VIEW DOES NOT GO THROUGH THE RING LAYOUT. A flat ring can
         only carry the nodes its circumference has room for, and the rest are
         counted as dropped on the header. A sphere has room for all of them,
         so the 3D pass skips that clipping and every node the model holds is
         drawn and marked drawn, which is why the header reports no drop while
         it is on. The per-category cap in buildRadial still applies to both
         views, and NODE DETAIL still reports it. */
      if(V3.on){
        m.ring1.concat(m.ring2).forEach(function(it){ it.drawn = true; });
        m.cats.forEach(function(c){
          c.drawn = c.items.filter(function(it){ return it.drawn === true; }).length;
        });
        trans(m);
        G.tm = m.tm;
        wrap.innerHTML = '<canvas class="g3" width="' + w + '" height="' + hh + '"></canvas>';
        MAP.svg = null;
        V3.pos = null;
        mount3(wrap.querySelector('canvas'));
        meta('rel', headerMeta(m) + ' | TURNED, THE SPHERE CARRIES EVERY NODE');
        G.geo = null;
        return;
      }
      layoutRadial(m, w, hh);
      trans(m);
      G.tm = m.tm;
      wrap.innerHTML = '<svg class="gsvg" viewBox="0 0 ' + w + ' ' + hh + '" width="' + w +
        '" height="' + hh + '">' + svgAll(m, w, hh) + '</svg>';
      var svg = wrap.querySelector('.gsvg');
      MAP.svg = svg;
      applyView(svg);
      wirePan(svg);
      wireNodes(svg);
      markNode(svg);
      applyFocus(svg);
      meta('rel', headerMeta(m));
      G.geo = m.geo;
    }
    run();
    PAINT.rel = run;
    try{ renderLaws(G.row); }catch(e){}
    paintChips();
    paintSel();
    paintAct();
    /* the law card below settles after this draw, so the map box changes size
       once more: follow it, or the svg would letterbox a stale viewBox */
    if(MAP.ro){ MAP.ro.disconnect(); MAP.ro = null; }
    if(window.ResizeObserver){
      MAP.ro = new ResizeObserver(function(){ requestAnimationFrame(run); });
      MAP.ro.observe(wrap);
    } else {
      requestAnimationFrame(run);
    }
  }

  function normEvents(ex, raw, row){
    var tk = rowTicker(row), core = coreName(row.name);
    var div = String(row.sym || '').split('.')[0];

    (raw || []).forEach(function(r){

      var tt = String(r.title || '').toLowerCase();

      if(ex === 'NSE' || ex === 'NGX'){
        ok = rt === tk;
      } else {
        ok = (rt === tk) || (!!div && rt.split('.')[0] === div) ||
             (!!core && nm.indexOf(core) >= 0) || (!!core && tt.indexOf(core) >= 0);
      }
      if(!ok) return;
      out.push({date:String(r.date || r.year || ''),
                kind:String(r.kind || ((ex === 'NSE' || ex === 'NGX') ? 'EVENT' : 'ANNOUNCEMENT')),

  function build(row){

    .then(function(R){

        sectors: law ? (law.sectors || []) : [], tickers: law ? (law.tickers || []) : [],
        exchange: law ? String(law.exchange || LAW.ex || '') : '',
        optionCount: opts.length, options: opts,
        selected: pol ? pol.value : '', fileState: LAW.st
      },
      transmission: tm ? {
        ex:tm.ex, all:tm.all, named:tm.named, sectors:tm.sectors,
        direct:tm.direct, hop1:tm.hop1, hop2:tm.hop2, off:tm.off,
        directList:tm.directList, hop1List:tm.hop1List, hop2List:tm.hop2List,
        offList:tm.offList, noRec:tm.noRec, message:tm.msg,
        domDirect: document.querySelectorAll('#b_rel g.nd.st-direct').length,
        domHop1: document.querySelectorAll('#b_rel g.nd.st-hop1').length,
        domHop2: document.querySelectorAll('#b_rel g.nd.st-hop2').length,
        domOff: document.querySelectorAll('#b_rel g.nd[data-st="off"]').length,
        domRings: document.querySelectorAll('#b_rel rect.ar').length
      } : null,
      graph: {
        hopMode:G.hops, cap:G.cap, truncated:m ? m.dropped : 0, rings:2,
        ring1:m ? m.ring1.length : 0, ring2:m ? m.ring2.length : 0,
        nodes:m ? nodeCount(m) : 0, edges:m && m.edges ? m.edges.length : 0,
        domNodes: document.querySelectorAll('#b_rel g.nd').length,
        domLeaves: document.querySelectorAll('#b_rel circle.lf').length,
        domEdges: document.querySelectorAll('#b_rel path.eg').length,
        domArrows: document.querySelectorAll('#b_rel path.eg[marker-end]').length,
        domRings: document.querySelectorAll('#b_rel ellipse.ring').length,
        domRingLabels: document.querySelectorAll('#b_rel text.rl').length,
        domCentre: document.querySelectorAll('#b_rel circle.cdc').length,
        domMarkers: document.querySelectorAll('#b_rel marker').length,
        domLeafLabels: document.querySelectorAll('#b_rel text.nl').length,
        category:G.cat,
        zoom:{k:Math.round(MAP.k * 1000) / 1000, x:Math.round(MAP.x), y:Math.round(MAP.y)},
        pinned:G.selKey,
        files:EXS.map(function(ex){ return {ex:ex, state:REL_ST[ex] || 'unread'}; }),
        sub: sub ? sub.textContent : '',
        types: CATS.map(function(c){ return c.k; })
      },
      geo: geo,
      /* the turned view answers for itself the same way the flat one does:
         the angle it is held at, and where every node it placed actually
         landed on screen, so what is drawn can be checked and not trusted */
      view3: {
        on: !!V3.on,
        yaw: Math.round(V3.yaw * 1000) / 1000,
        pitch: Math.round(V3.pitch * 1000) / 1000,
        zoom: Math.round(V3.zoom * 1000) / 1000,
        spin: !!V3.spin,
        hover: V3.hov || '',
        clusters: (V3.clusters || []).map(function(c){ return {key:c.k, nodes:c.n}; }),
        screen: (V3.on && V3.cv && V3.pos) ? Object.keys(V3.pos).map(function(k){
          var q = proj3(V3.pos[k], V3.cv.clientWidth, V3.cv.clientHeight);
          var n = V3.pos[k].n || {};
          return {key:k, label:n.label || n.tk || '', hop:n.hop || 0,
                  x:Math.round(q.x), y:Math.round(q.y),
                  depth:Math.round(q.d * 1000) / 1000};
        }) : []
      },
      sel: selInfo(),
      actbar: ab ? ab.textContent.replace(/\s+/g, ' ').trim() : '',
      claim: claim ? claim.textContent.replace(/\s+/g, ' ').trim() : '',
      inputs: document.querySelectorAll('input').length,
      selects: document.querySelectorAll('select').length,
      enabledInputs: document.querySelectorAll('input:not([disabled])').length,
      buttons: document.querySelectorAll('button').length,
      webq: wq ? {disabled: !!wq.disabled, placeholder: wq.placeholder} : null,
      words:textWords()
    };
  };

  /* boot */
  loadLaws();
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
</body>
</html>
