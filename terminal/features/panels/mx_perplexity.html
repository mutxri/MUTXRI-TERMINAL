<!--
  mx_perplexity.html - PERPLEXITY: one security at the centre of its constellation.

  The layout is the relationship map the owner asked for, in the manner of a
  terminal relationship screen:

    CENTRE         one box: ticker and board on a coloured strip, the company
                   name, the last price, the percent change, and a sparkline
                   read from static_data/history/<KEY>.json.
    CONSTELLATION  separate small clusters on a rough ring around that box, each
                   with its own title and a count in brackets, each joined to the
                   centre by one thin line. Each radial cluster has a tiny hub
                   and coloured labelled boxes around it, joined to that hub by
                   short lines. Box colour carries meaning, never decoration.

  What each cluster reads, and nothing else:

    INDICES     static_data/ex_<EX>_indices.json
    PEERS       competitors in static_data/relationships_<EX>.json (all four
                exchange files are read, so a link can cross a board)
    CUSTOMERS   the same files, customers
    SUPPLIERS   the same files, suppliers
    PARTNERS    the same files, partners
    2 LINKS     one recorded link past a first link, only when depth 2 is on
    HOLDERS     static_data/shareholders_<EX>.json where a record exists
    EXCHANGES   the four boards, the one this security is listed on marked
    EXECUTIVES  static_data/ceos.json where it names a chief executive
    BALANCE     static_data/financials/<KEY>__balance.json, three real lines
    LAWS        static_data/gov_laws_KE.json: the Acts whose own ticker list or
                own sector list names this security, coloured by status
    EVENTS      static_data/<ex>_corporate_actions.json, or the announcements
                file for a board that has no corporate action file
    NEWS        static_data/<ex>_news.json, the four newest headlines naming it

  A cluster with no record still appears, with a count and the word NONE, so the
  absence is visible. A cluster whose file could not be read prints the failure
  instead, so empty and failed are never confused.

  Policy behaviour kept from the previous build: choose an Act and it marks the
  companies it names directly, the companies one recorded link away, and the
  companies two links away, and dims the rest. In this layout the marking is the
  amber ring around a node box inside a cluster, and the Act line above the map
  counts what it reached.

  Rules this file keeps:
    * no peer set is generated and nothing is inferred from a sector label on
      the map: a link is drawn only where a relationship record names it;
    * all four exchange relationship files are read and their read state is
      printed;
    * the node cap is stated on the map and truncation is reported, not hidden;
    * every block draws inside a guard, so one broken read blanks one block;
    * pan, zoom, reset, node detail and hover highlighting stay;
    * one line states what this shows and what it does not claim.

  Vanilla JS, single file, no build step. Mint on black, Oxygen Mono.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perplexity</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;
    --warn:#e0a341;--blue:#6ea8fe;--violet:#c08cff;
    --mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  /* the shell gives every panel a window, so this panel draws no frame */
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:12px;
       padding:0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;
       height:100vh;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;border:0;background:transparent;
        max-width:none;margin:0;border-radius:0}

  /* ---------- search and the Act selector ---------- */
  .controls{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px;
            border-bottom:1px solid var(--line2);flex:0 0 auto;flex-wrap:wrap;min-width:0}
  .controls .cl2{font-size:7px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;
                 white-space:nowrap;flex:0 0 auto}
  input.qin{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
            padding:4px 8px;font-family:var(--mono);font-size:11px;width:210px;
            text-transform:uppercase;min-width:0}
  input.qin:focus{outline:0;border-color:var(--acc)}
  select.psel{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
              padding:4px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
              max-width:400px;min-width:0;cursor:pointer}
  select.psel:focus{outline:0;border-color:var(--acc)}
  select.psel option{background:#0a0a0a;color:#f0f0f0}
  .hint{color:var(--tx3);font-size:7.5px;letter-spacing:.09em;white-space:nowrap}
  .sug{position:absolute;left:12px;top:100%;width:400px;max-height:250px;overflow:auto;
       background:var(--bg3);border:1px solid var(--line2);border-top:0;z-index:60;display:none}
  .sug.on{display:block}
  .sg{display:flex;align-items:baseline;gap:8px;padding:4px 8px;cursor:pointer;border-top:1px solid var(--line)}
  .sg:first-child{border-top:0}
  .sg.sel{background:var(--bg4)}
  .sg .tk{color:var(--acc);font-weight:700;min-width:62px}
  .sg .nm{color:var(--tx2);font-family:var(--ui);font-size:10.5px;flex:1;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .sg .ex{color:var(--tx3);font-size:8px;letter-spacing:.06em}
  .sg.none{color:var(--tx3);font-size:10px;cursor:default}

  /* ---------- the map and the detail of the node the reader pinned -------- */
  .grid{flex:1 1 auto;min-height:0;display:grid;gap:1px;background:var(--line2);padding:1px;
        grid-template-columns:minmax(0,1fr) 274px}
  .card{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;
        position:relative}
  .ch{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:1px solid var(--line);
      flex:0 0 auto;min-width:0;flex-wrap:nowrap}
  .cl{font-size:7.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;font-weight:600;
      white-space:nowrap}
  .cm{margin-left:auto;font-size:7.5px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cb{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
  .cgrp{display:flex;align-items:center;gap:4px;min-width:0}
  .cgrp .cl2{font-size:6.5px}
  button.kn{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--tx3);background:#0a0a0a;border:1px solid var(--line2);border-radius:2px;
            padding:3px 6px;cursor:pointer;line-height:1.1;white-space:nowrap}
  button.kn:hover{color:var(--tx2);border-color:#3a3a3a}
  button.kn[aria-pressed="true"]{color:#04120c;background:var(--acc);border-color:var(--acc);
                                 font-weight:700}
  button.kn.ft[data-t="customers"][aria-pressed="true"]{background:#33e29a;border-color:#33e29a}
  button.kn.ft[data-t="suppliers"][aria-pressed="true"]{background:#6ea8fe;border-color:#6ea8fe}
  button.kn.ft[data-t="competitors"][aria-pressed="true"]{background:#f87171;border-color:#f87171}
  button.kn.ft[data-t="partners"][aria-pressed="true"]{background:#c08cff;border-color:#c08cff}
  button.kn:focus-visible{outline:1px solid var(--acc)}
  button.kn.z{width:18px;padding:2px 0;text-align:center}
  .zk{font-size:7px;color:var(--tx3);letter-spacing:.04em;min-width:27px;text-align:right}

  /* the Act line: what is chosen, what it does mechanically, what it reaches */
  .actbar{flex:0 0 auto;border-bottom:1px solid var(--line);padding:3px 9px 4px;
          display:flex;flex-direction:column;gap:1px;min-width:0}
  .abrow{display:flex;gap:8px;align-items:baseline;min-width:0}
  .abhead{font-size:8px;letter-spacing:.08em;color:var(--warn);font-weight:700;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .abstat{font-size:6.5px;letter-spacing:.10em;color:var(--tx3);border:1px solid var(--line2);
          padding:0 3px;border-radius:2px;white-space:nowrap;flex:0 0 auto}
  .abmech{font-size:7.5px;color:var(--tx2);line-height:1.3;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;min-width:0}
  .abtr{display:flex;flex-wrap:wrap;gap:7px;font-size:7.5px;letter-spacing:.05em;color:var(--tx3);
        line-height:1.3}
  .abtr b{color:var(--warn);font-weight:700}
  .abtr .no{color:var(--warn);font-weight:700;letter-spacing:.06em}
  .abtr .q{color:var(--tx2)}

  /* the constellation */
  .gwrap{position:absolute;inset:0;overflow:hidden;user-select:none}
  .gwrap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .gwrap svg.drag{cursor:grabbing}
  .gsub{position:absolute;left:0;right:0;bottom:0;padding:2px 9px 4px;font-size:7px;
        letter-spacing:.06em;color:#7a7a7a;text-transform:uppercase;background:rgba(0,0,0,.82);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gsub b{color:var(--down);font-weight:700}
  path.cn{fill:none;stroke:#1d1d1d;stroke-width:1}
  path.cn.hi{stroke:#4a4a4a}
  rect.cb2{fill:#030303;stroke:#1a1a1a;stroke-width:1}
  rect.cb2.promo{stroke:#4a3810}
  rect.cb2.hi{stroke:#3d3d3d}
  text.ct{font-family:var(--mono);font-size:7.6px;letter-spacing:.13em;font-weight:700;fill:#33e29a}
  text.ct.promo{fill:#e0a341}
  text.cc{font-family:var(--mono);font-size:7.2px;letter-spacing:.06em;fill:#6a6a6a}
  line.crule{stroke:#171717;stroke-width:1}
  rect.pbar{fill:#e0a341}
  circle.hub{fill:#1b1b1b;stroke:#3a3a3a;stroke-width:.8}
  line.sp{stroke:#242424;stroke-width:.7}
  g.nd{pointer-events:all;cursor:pointer}
  rect.nb{fill:#080808;stroke:#3a3a3a;stroke-width:1}
  text.nt{font-family:var(--mono);font-size:6.8px;letter-spacing:.03em}
  g.nd.dim{opacity:.24}
  g.nd.hv rect.nb{stroke-width:1.8}
  g.nd.on rect.nb{stroke-width:1.8}
  rect.ar{fill:none;stroke:#f2c14e}
  rect.ar.d{stroke-width:1.7}
  rect.ar.h1{stroke-width:1.2;stroke-dasharray:3 2.2}
  rect.ar.h2{stroke-width:1;stroke-dasharray:1.4 2.2;stroke-opacity:.7}
  /* the centre box */
  rect.cbox{fill:#070707;stroke:#2a2a2a;stroke-width:1}
  rect.chd{fill:#33e29a}
  rect.chd.dn{fill:#f87171}
  text.ctk{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em}
  text.cex{font-family:var(--mono);font-size:7px;letter-spacing:.14em;text-anchor:end}
  text.cnm{font-family:var(--mono);font-size:9px;fill:#e8e8e8}
  text.cpx{font-family:var(--mono);font-size:15px;font-weight:700;fill:#f2f2f2}
  text.ccy{font-family:var(--mono);font-size:6.6px;letter-spacing:.12em;fill:#6a6a6a}
  text.cch{font-family:var(--mono);font-size:8.4px;font-weight:700}
  text.cas{font-family:var(--mono);font-size:6.4px;letter-spacing:.08em;fill:#5c5c5c}
  text.cnh{font-family:var(--mono);font-size:6.4px;letter-spacing:.08em;fill:#5c5c5c}
  polyline.spl{fill:none;stroke-width:1.2}
  /* text clusters */
  text.tl{font-family:var(--mono);font-size:6.9px;fill:#a8a8a8}
  circle.td{stroke:none}
  text.none{font-family:var(--mono);font-size:7px;letter-spacing:.14em;fill:#4a4a4a}
  text.notread{font-family:var(--mono);font-size:6.6px;letter-spacing:.04em;fill:#f87171}
  /* bar cluster */
  rect.br{stroke:none}
  text.bl{font-family:var(--mono);font-size:6.2px;letter-spacing:.05em;fill:#7a7a7a}
  text.bv{font-family:var(--mono);font-size:6.2px;fill:#c8c8c8}

  /* the selected node, short rows, no paragraphs */
  #b_sel{padding:5px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .srow{display:flex;gap:6px;align-items:baseline;min-width:0;line-height:1.25}
  .sk{flex:0 0 52px;font-size:7px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase}
  .sv{flex:1 1 auto;min-width:0;font-size:9px;color:var(--tx);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
  .sv.tk{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .sv.dm{color:var(--tx2)}
  .sv.wr{color:var(--warn)}
  .sv.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--ui);
           font-size:9.5px;color:var(--tx2);line-height:1.25}
  .sk.sk2{flex:0 0 auto;color:var(--tx3)}
  .tag2{flex:0 0 auto;font-size:6.5px;letter-spacing:.08em;color:var(--warn);border:1px solid #4a3810;
        padding:0 2px;border-radius:1px;line-height:1.3}

  /* states */
  .fail{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--down);color:var(--down);
        font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .fail b{font-weight:700}
  .emp{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--line2);color:var(--tx3);
       font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .emp b{color:var(--tx2);font-weight:600}

  /* the claim, permanent and one line */
  .claim{flex:0 0 auto;padding:3px 9px 4px;border-top:1px solid var(--line);font-size:8px;
         letter-spacing:.02em;color:var(--tx3);line-height:1.35}

  /* honest web research bar: a disabled field that says the truth */
  .sbar{display:flex;align-items:center;gap:9px;padding:4px 12px;background:#050505;
        border-top:1px solid var(--line2);flex:0 0 auto;min-width:0}
  .sbar .sl{font-size:7px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap}
  .sbar input.wq{flex:1 1 auto;min-width:0;max-width:520px;background:#0a0a0a;color:var(--tx3);
                 border:1px dashed var(--line2);border-radius:2px;padding:3px 8px;
                 font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;cursor:not-allowed}
  .sbar input.wq::placeholder{color:#5a5a5a}
  .sbar .sn{font-size:7.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;align-items:center;gap:10px;padding:2px 12px;background:var(--bg2);
        border-top:1px solid var(--line2);color:var(--tx3);font-size:7.5px;letter-spacing:.08em;
        flex:0 0 auto;min-width:0}
  .foot .sp{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="panel">

  <div class="controls">
    <span class="cl2">COMPANY</span>
    <input class="qin" id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="centre company: ticker or name" aria-label="centre company: ticker or name">
    <span class="cl2">ACT</span>
    <select class="psel" id="pol" aria-label="Act to trace through the map"></select>
    <span class="hint">PICK THE CENTRE, THEN THE ACT</span>
    <div class="sug" id="sug"></div>
  </div>

  <div class="grid">
    <div class="card" id="c_rel">
      <div class="ch">
        <span class="cl">RELATIONSHIP MAP</span>
        <div class="cgrp" id="c_hop">
          <span class="cl2">DEPTH</span>
          <button class="kn hp" type="button" data-hop="1" aria-pressed="true">1 HOP</button>
          <button class="kn hp" type="button" data-hop="2" aria-pressed="false">2 HOPS</button>
        </div>
        <div class="cgrp" id="c_type">
          <span class="cl2">LINKS</span>
          <button class="kn ft" type="button" data-t="customers" aria-pressed="true">CUST</button>
          <button class="kn ft" type="button" data-t="suppliers" aria-pressed="true">SUPP</button>
          <button class="kn ft" type="button" data-t="competitors" aria-pressed="true">COMP</button>
          <button class="kn ft" type="button" data-t="partners" aria-pressed="true">PART</button>
        </div>
        <div class="cgrp" id="c_view">
          <span class="cl2">VIEW</span>
          <button class="kn z" type="button" id="zout" title="zoom out" aria-label="zoom out">-</button>
          <span class="zk" id="zk">1.0x</span>
          <button class="kn z" type="button" id="zin" title="zoom in" aria-label="zoom in">+</button>
          <button class="kn" type="button" id="zrst" title="reset pan and zoom">RESET</button>
        </div>
        <span class="cm" id="m_rel"></span>
      </div>
      <div class="actbar" id="actbar"></div>
      <div class="cb" id="b_rel"></div>
      <div class="claim" id="claim">This map shows which companies an Act reaches and how far that
        reach travels through recorded links; it is not a price prediction.</div>
    </div>
    <div class="card" id="c_sel">
      <div class="ch"><span class="cl">NODE DETAIL</span><span class="cm" id="m_sel"></span></div>
      <div class="cb" id="b_sel"></div>
    </div>
  </div>

  <!-- Live web research is NOT wired in. The shell publishes window.MUTXRI_API_BASE
       and uses it for auth and quotes only: there is no search or research endpoint
       in financials_api.py, indices_api.py or auth_api.py, and no key is shipped to
       the browser. So this field is a statement, not a control: it is disabled, it
       takes no keystrokes and it calls nothing. -->
  <div class="sbar" id="sbar">
    <span class="sl">WEB RESEARCH</span>
    <input class="wq" id="webq" type="text" disabled aria-disabled="true"
           placeholder="live web research is not wired into the terminal yet"
           title="no search endpoint and no key are shipped to this page; nothing is fetched">
    <span class="sn">this panel shows what is held on disk</span>
  </div>

  <div class="foot">
    <span id="footTk">-</span>
    <span class="sp" id="footNote"></span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var Q = new URLSearchParams(location.search);
  var EXS = ['NSE','JSE','NGX','EGX'];
  var DASH = '-';
  var UP = '#33e29a', DN = '#f87171', BLUE = '#6ea8fe', GREY = '#8a8a8a', ORANGE = '#e08a3c';
  var AMB = '#e0a341';
  var SEC_TITLE = {rel:'RELATIONSHIP MAP', sel:'NODE DETAIL'};

  /* ---------- text, numbers ------------------------------------------ */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* the product prints no em dash and no en dash, including when the dash
     arrives inside a recorded sentence */
  function nd(s){ return String(s == null ? '' : s).replace(/[\u2013\u2014]/g, '-'); }
  function t(s){ return esc(nd(s)); }
  function isNum(v){ return v !== null && v !== undefined && v !== '' && !isNaN(Number(v)); }
  function numv(v){ return isNum(v) ? Number(v) : null; }
  function cut(s, n){
    var x = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    return x.length > n ? x.slice(0, n - 2).replace(/[,\s]+$/, '') + '..' : x;
  }
  function fmtP(v){
    var n = numv(v);
    if(n == null) return DASH;
    if(Math.abs(n) >= 1000){
      return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    return n.toFixed(2);
  }
  function fmtBig(v){
    var n = numv(v);
    if(n == null) return DASH;
    var s = n < 0 ? '-' : '';
    n = Math.abs(n);
    if(n >= 1e9) return s + (n / 1e9).toFixed(1) + 'B';
    if(n >= 1e6) return s + (n / 1e6).toFixed(1) + 'M';
    if(n >= 1e3) return s + (n / 1e3).toFixed(1) + 'K';
    return s + n.toFixed(0);
  }
  function fmtPct(p){
    var n = numv(p);
    if(n == null) return DASH;
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function uniq(a){
    var o = {}, out = [];
    a.forEach(function(x){ if(!o[x]){ o[x] = 1; out.push(x); } });
    return out;
  }

  /* ---------- file reads, with the read state kept -------------------- */
  var FILES = {};
  function getJSON(path){
    if(FILES[path]) return FILES[path].p;
    var rec = {ok:false, data:null, err:''};
    rec.p = fetch(path, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){ rec.ok = true; rec.data = d; return d; })
      .catch(function(e){ rec.err = nd(String((e && e.message) || e)); return null; });
    FILES[path] = rec;
    return rec.p;
  }
  function readState(path){
    var r = FILES[path];
    if(!r) return 'unread';
    return r.ok ? 'ok' : 'failed';
  }
  function readErr(path){
    var r = FILES[path];
    return (r && r.err) ? r.err : 'not loaded';
  }
  /* a quiet probe: one series can sit under more than one key, and a miss is
     not a failure of the panel, so nothing is recorded about it */
  function probeJSON(paths){
    function step(i){
      if(i >= paths.length) return Promise.resolve(null);
      return fetch(paths[i], {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(d){ return {path:paths[i], data:d}; })

  function findRow(tk, exHint){

    var pool = IDX.slice();
    if(e) pool.sort(function(a, b){ return (a.ex === e ? 0 : 1) - (b.ex === e ? 0 : 1); });
    var i;
    for(i = 0; i < pool.length; i++) if(String(pool[i].ticker || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].sym || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].name || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].name || '').toUpperCase().indexOf(q) >= 0) return pool[i];
    }
    return null;
  }

  /* ---------- name normalising --------------------------------------- */
  var SUFFIX = {plc:1, ltd:1, limited:1, group:1, holdings:1, holding:1, company:1, co:1,
                inc:1, corp:1, corporation:1, sa:1, nv:1, ag:1, the:1, public:1, 'and':1};
  function normChars(s){

      .replace(/\s+/g, ' ').trim();

  /* ---------- the search box: one input, ticker first then name ------- */
  var SUG = {rows:[], i:0, on:false};
  function rank(q){
    var s = String(q || '').trim().toUpperCase();
    if(!s) return [];
    function pass(needle){
      var out = [];
      for(var i = 0; i < IDX.length; i++){
        var r = IDX[i];
        var tk = String(r.ticker || '').toUpperCase();
        var sy = String(r.sym || '').toUpperCase();
        var nm = String(r.name || '').toUpperCase();
        var sc = -1;
        if(tk === needle || sy === needle) sc = 0;
        else if(tk.indexOf(needle) === 0) sc = 1;
        else if(sy.indexOf(needle) === 0) sc = 2;
        else if(nm.indexOf(needle) === 0) sc = 3;
        else if(tk.indexOf(needle) > 0) sc = 4;
        else if(nm.indexOf(needle) > 0) sc = 5;
        if(sc >= 0) out.push({r:r, sc:sc, len:tk.length});
      }
      out.sort(function(a, b){
        if(a.sc !== b.sc) return a.sc - b.sc;
        if(a.len !== b.len) return a.len - b.len;
        return String(a.r.ticker).localeCompare(String(b.r.ticker));
      });
      return out;
    }
    var hits = pass(s);
    if(!hits.length && s.indexOf(' ') > 0) hits = pass(s.split(/\s+/)[0]);
    return hits.slice(0, 12).map(function(x){ return x.r; });
  }

  /* ---------- 2. source state ---------------------------------------- */
  var REL = {}, RELF = {}, REL_ST = {}, RECBY = null, CORE2ROW = null;
  var DATA = {idx:[], idxSt:'unread', idxErr:'', sh:{}, shSt:{}, shErr:{},
              ca:[], caSt:'unread', caErr:'', caFile:'',
              news:[], newsSt:'unread', newsErr:'',
              ceos:{}, ceosSt:'unread', ceosErr:'', ceosSrc:{},
              bal:null, balSt:'unread', spark:null, sparkSt:'unread'};
  var G = {hops:1, types:{customers:true, suppliers:true, competitors:true, partners:true},
           cap:60, selKey:'', model:null, row:null, rec:null, law:null, tm:null, geo:null};

  function relTypes(){
    return [
      {k:'competitors', c:DN, n:'PEERS', full:'COMPETITORS'},
      {k:'customers', c:UP, n:'CUSTOMERS', full:'CUSTOMERS'},
      {k:'suppliers', c:BLUE, n:'SUPPLIERS', full:'SUPPLIERS'},
      {k:'partners', c:'#c08cff', n:'PARTNERS', full:'PARTNERS'}
    ];

  function typeOf(k){
    var a = relTypes();
    for(var i = 0; i < a.length; i++){ if(a[i].k === k) return a[i]; }
    return {k:k, c:GREY, n:String(k || '').toUpperCase(), full:String(k || '').toUpperCase()};
  }
  function typeLabel(k){
    var n = typeOf(k).full;

  }
  function activeTypes(){
    return relTypes().filter(function(tp){ return G.types[tp.k]; });
  }
  function rowForTicker(ex, tk){
    var pool = MKT[ex] || [], want = String(tk || '').toUpperCase();
    for(var i = 0; i < pool.length; i++){ if(rowTicker(pool[i]) === want) return pool[i]; }
    return null;
  }
  function buildRelIndex(){
    if(RECBY) return;
    RECBY = {};
    CORE2ROW = {};
    IDX.forEach(function(r){
      var c = coreName(r.name);
      if(c && !CORE2ROW[c]) CORE2ROW[c] = r;
    });
    EXS.forEach(function(ex){
      var secs = REL[ex] || {};
      Object.keys(secs).forEach(function(k){
        var c = coreName((secs[k] && secs[k].name) || k);
        if(!c) return;
        if(!RECBY[c]) RECBY[c] = [];

  function identOf(name){
    var c = coreName(name);
    if(!c) return null;
    var hit = RECBY[c];
    if(hit && hit.length){
      var h = hit[0];
      var rec = (REL[h.ex] || {})[h.key] || null;
      var rr = rowForTicker(h.ex, h.key);
      return {key:'R:' + h.ex + ':' + h.key, ex:h.ex, tk:String(h.key).toUpperCase(),
              name:((rec && rec.name) || name), rec:rec, row:rr, listed:!!rr,
              sector:(rr && rr.sector) || ''};
    }
    var row = CORE2ROW[c];
    if(row){
      var tk = rowTicker(row);
      var own = (REL[row.ex] || {})[tk] || null;
      return {key:'L:' + row.ex + ':' + tk, ex:row.ex, tk:tk, name:(row.name || name),
              rec:own, row:row, listed:true, sector:row.sector || ''};

            listed:false, sector:''};

  function srcLabel(e){

    return '';
  }
  function linkList(rec){
    var out = [];

  }
  function pctOf(r){
    if(!r) return null;
    if(isNum(r.chgPct)) return Number(r.chgPct);
    if(isNum(r.changePct)) return Number(r.changePct);
    var ch = r.change;
    if(typeof ch === 'string'){
      var m = ch.match(/\(([-+]?[0-9.]+)%\)/);
      if(m) return Number(m[1]);
      if(isNum(ch)) return Number(ch);
    } else if(isNum(ch)){
      return Number(ch);
    }
    return null;
  }
  function rowPrice(r){
    if(!r) return null;

  function colourOfRow(r){
    if(!r) return ORANGE;
    if(rowPrice(r) == null) return BLUE;
    var pc = pctOf(r);
    if(pc == null) return GREY;
    if(pc > 0.00001) return UP;
    if(pc < -0.00001) return DN;

  /* ---------- 3. the clusters ---------------------------------------- */
  var CL_SEED = {indices:270, exchanges:300, competitors:330, peers:330, customers:0,
                 suppliers:30, hop2:75, partners:60, holders:90, balance:120, execs:150,
                 laws:180, events:210, news:240};

  function codeOf(label, name){
    var s = String(label || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(s) return s.length > 7 ? s.slice(0, 7) : s;
    var w = String(name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ')
      .split(' ').filter(function(x){ return x && x.length > 1; });
    if(!w.length) return '?';
    if(w.length === 1) return w[0].slice(0, 6);
    return w.map(function(x){ return x.charAt(0); }).join('').slice(0, 5);
  }
  function nameCode(name){
    var w = String(name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ')
      .split(' ').filter(function(x){ return x && x.length > 1; });
    if(!w.length) return '?';
    if(w[0].length <= 2 && w[1]) return (w[0] + w[1]).slice(0, 6);
    return w[0].slice(0, 6);
  }
  function lawCode(id, year){
    var s = String(id || '').toUpperCase().replace(/^KE-/, '');
    var parts = s.split('-').filter(Boolean);
    var words = parts.filter(function(p){ return !/^\d{4}$/.test(p); });
    var yr = String(year || parts[parts.length - 1] || '').slice(-4);
    var ini;
    if(words.length === 1) ini = words[0].slice(0, 2);
    else ini = words.map(function(w){ return w.charAt(0); }).join('').slice(0, 3);
    if(!ini) ini = s.slice(0, 3);
    return (ini + yr).slice(0, 7);
  }
  function newCluster(key, title, kind, opt){
    return {key:key, title:title, kind:kind, items:[], total:0, shown:0, state:'ok', err:'',
            seed:CL_SEED[key] != null ? CL_SEED[key] : 0, tip:'',
            promo:!!(opt && opt.promo), file:(opt && opt.file) || '',
            hub:(opt && opt.hub) || ''};
  }

  function newsHit(title, tk, name){
    var tl = ' ' + String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ') + ' ';
    var t = String(tk || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    if(t.length >= 2 && tl.indexOf(' ' + t + ' ') >= 0) return true;
    var w0 = String(name || '').toLowerCase().split(/\s+/)[0] || '';
    w0 = w0.replace(/[^a-z0-9-]/g, '');
    if(w0.length < 4) return false;
    var alts = [w0, w0.replace(/-/g, ' '), w0.replace(/-/g, '')];
    for(var i = 0; i < alts.length; i++){
      if(!alts[i]) continue;
      if(tl.indexOf(' ' + alts[i] + ' ') >= 0) return true;
      if(alts[i].length >= 6 && tl.indexOf(alts[i]) >= 0) return true;
    }
    return false;
  }
  function buildClusters(row){
    var ex = row.ex, tk = rowTicker(row), out = [], map = {};
    var core = coreName(row.name);
    var sym = String(row.sym || tk || '');

    function add(c){ out.push(c); map[c.key] = c; }

    /* LAWS first: it is the cluster the owner asked for and it must never be
       the one the node cap eats */
    var laws = newCluster('laws', 'LAWS', 'radial', {promo:true, file:'gov_laws_KE.json'});
    if(LAW.st === 'failed'){
      laws.state = 'fail';
      laws.err = LAW.err || 'gov_laws_KE.json not loaded';
    } else {
      var sec = String(row.sector || '').toUpperCase();
      var hits = LAW.list.filter(function(l){
        var lt = (l.tickers || []).map(function(x){ return String(x).toUpperCase(); });
        var ls = (l.sectors || []).map(function(x){ return String(x).toUpperCase(); });
        var lex = String(l.exchange || LAW.ex || 'NSE').toUpperCase();
        if(lt.indexOf(tk) >= 0) return true;
        if(sec && ls.indexOf(sec) >= 0) return true;
        if(lt.indexOf('ALL') >= 0 && lex === String(ex).toUpperCase()) return true;
        return false;
      });
      laws.total = LAW.list.length;
      laws.tip = hits.length + ' of ' + LAW.list.length +
        ' Acts name this security or its sector, in ' + 'gov_laws_KE.json';
      hits.sort(function(a, b){ return (Number(b.year) || 0) - (Number(a.year) || 0); });
      hits.forEach(function(l){
        var st = String(l.status || '').toLowerCase();
        var col = st === 'enacted' ? UP : (st === 'repealed' ? DN : AMB);
        laws.items.push({
          key:'law:' + (l.id || laws.items.length), cluster:'laws',
          label:lawCode(l.id, l.year), name:nd(l.name || l.id || ''),
          code:String(l.id || ''), link:'Act',
          reason:cut(l.mechanism || '', 240),
          src:(l.source && l.source.name) ? nd(String(l.source.name)) +
              (l.source.retrieved ? ' ' + l.source.retrieved : '') : '',
          colour:col, co:false
        });
      });
    }
    add(laws);

    /* the four relationship clusters, then the second link ring */
    relTypes().forEach(function(tp){
      var c = newCluster(tp.k, tp.n, 'radial', {hub:tk});
      c.relType = tp.k;
      c.file = 'relationships_' + ex + '.json';
      if(REL_ST[ex] === 'failed'){
        c.state = 'fail';
        c.err = readErr(sd(c.file));
      } else {
        var list = (G.rec && G.rec[tp.k]) || [];
        c.total = list.length;
        list.forEach(function(e){
          var id = identOf(e && e.name);
          if(!id) return;
          if(id.ex && id.ex === ex && String(id.tk) === String(tk)) return;
          c.items.push({
            key:'rel:' + tp.k + ':' + id.key, cluster:tp.k,
            label:codeOf(id.tk, id.name), name:nd(id.name || (e && e.name) || ''),
            code:String(id.tk || ''), link:typeLabel(tp.k),
            reason:nd(String((e && (e.role || e.note)) || '')), src:srcLabel(e),
            colour:colourOfRow(id.row), co:true, ex:id.ex, tk:id.tk, listed:id.listed,
            sector:id.sector || '', rec:id.rec, hop:1
          });
        });
      }
      add(c);
    });

    var hop2 = newCluster('hop2', '2 LINKS', 'radial', {hub:tk});
    hop2.relType = 'hop2';
    hop2.file = 'relationships_<EX>.json';
    if(G.hops > 1 && G.rec){
      var parents = [], seen = {};
      relTypes().forEach(function(tp){
        (map[tp.k] ? map[tp.k].items : []).forEach(function(it){ if(it.rec) parents.push(it); });
      });
      parents.forEach(function(p){
        linkList(p.rec).forEach(function(link){
          var id = identOf(link.e && link.e.name);
          if(!id) return;
          if(id.ex && id.ex === ex && String(id.tk) === String(tk)) return;
          if(seen[id.key]) return;
          seen[id.key] = 1;
          hop2.items.push({
            key:'h2:' + id.key, cluster:'hop2', label:codeOf(id.tk, id.name),
            name:nd(id.name || ''), code:String(id.tk || ''),
            link:typeLabel(link.type), reason:'one recorded link from ' + nd(p.name),
            src:srcLabel(link.e), colour:colourOfRow(id.row), co:true, ex:id.ex, tk:id.tk,
            listed:id.listed, sector:id.sector || '', rec:id.rec, hop:2, parent:p.key
          });
        });
      });
      hop2.total = hop2.items.length;
    }
    if(hop2.items.length) add(hop2);

    /* INDICES */
    var ins = newCluster('indices', 'INDICES', 'radial', {file:'ex_' + ex + '_indices.json'});
    if(DATA.idxSt === 'failed'){
      ins.state = 'fail'; ins.err = DATA.idxErr;
    } else {
      var arr = DATA.idx || [];
      ins.total = arr.length;
      arr.forEach(function(r){
        var pc = pctOf(r), lvl = numv(r.price);
        var chg = (typeof r.change === 'string') ? r.change : (isNum(r.change) ? String(r.change) : '');
        ins.items.push({
          key:'idx:' + String(r.ticker || ''), cluster:'indices',
          label:codeOf(String(r.ticker || '').replace('^', ''), r.name),
          name:nd(r.name || r.ticker || ''), code:String(r.ticker || ''), link:'Index',
          reason:(lvl == null ? 'no level on file' : 'level ' + fmtP(lvl)) +
                 (chg ? ' | ' + nd(chg) : ''),
          src:nd(String(r.asOf || '')),
          colour:(lvl == null ? BLUE : (pc == null ? GREY : (pc > 0 ? UP : (pc < 0 ? DN : GREY)))),
          co:false
        });
      });
    }
    add(ins);

    /* EXCHANGES: the four boards, the one this security sits on marked */
    var exc = newCluster('exchanges', 'EXCHANGES', 'radial', {file:'market_<EX>.json'});
    exc.total = EXS.length;
    EXS.forEach(function(e2){
      var on = e2 === ex, rows = MKT[e2] || [];
      exc.items.push({
        key:'ex:' + e2, cluster:'exchanges', label:e2, name:e2 + ' board', code:e2,
        link:'Board',
        reason:on ? 'this security is listed here' : 'another board the terminal reads',
        src:rows.length + ' securities on file',
        colour:on ? UP : (rows.length ? GREY : ORANGE), co:false
      });
    });
    add(exc);

    /* HOLDERS */
    var hol = newCluster('holders', 'HOLDERS', 'radial', {file:'shareholders_' + ex + '.json'});
    if(DATA.shSt[ex] === 'failed'){
      hol.state = 'fail'; hol.err = DATA.shErr[ex];
    } else {
      var sh = DATA.sh[ex] || {};
      var srec = sh[tk] || sh[sym] || null;
      if(!srec){
        EXS.forEach(function(e2){
          if(srec || e2 === ex) return;
          var alt = DATA.sh[e2] || {};
          srec = alt[tk] || null;
        });
      }
      var holders = (srec && srec.substantial) || [];
      hol.total = holders.length;
      holders.forEach(function(h){
        var id = identOf(h.name);
        hol.items.push({
          key:'sh:' + coreName(h.name) + ':' + (h.name || ''), cluster:'holders',
          label:nameCode(h.name), name:nd(h.name || ''), code:'', link:'Holder',
          reason:(h.holding != null ? fmtBig(h.holding) + ' shares'
                  : (h.pct != null ? Number(h.pct).toFixed(2) + '% held' : 'holding on file')),
          src:(srec && srec.asOf ? 'as at ' + nd(srec.asOf) : ''),
          colour:id && id.listed ? colourOfRow(id.row) : ORANGE, co:false
        });
      });
    }
    add(hol);

    /* BALANCE SHEET: three real lines, drawn as bars */
    var bal = newCluster('balance', 'BALANCE SHEET', 'bars',
                         {file:'financials/<KEY>__balance.json'});
    if(!DATA.bal){
      bal.state = 'empty';
      bal.err = 'financials/' + sym + '__balance.json not on file';
    } else {
      var b = DATA.bal, per = (b.periods && b.periods[0]) || '';
      function line(want){
        var ws = want.map(function(x){ return x.toLowerCase(); });
        for(var i = 0; i < (b.rows || []).length; i++){
          if(ws.indexOf(String(b.rows[i].label || '').toLowerCase()) >= 0) return b.rows[i];
        }
        return null;
      }
      var a1 = line(['Total assets']);
      var l1 = line(['Total liabilities']);
      var e1 = line(['Total equity', 'Total shareholders equity', 'Shareholders equity']);
      [[a1, 'ASSETS', UP], [l1, 'LIAB', DN], [e1, 'EQUITY', BLUE]].forEach(function(x){
        if(!x[0]) return;
        bal.items.push({
          key:'bal:' + x[1], cluster:'balance', label:x[1],
          name:x[1] + ' ' + (x[0].label || ''), code:'', link:'Balance sheet',
          reason:fmtBig(x[0].values[0]) + ' ' + nd(String(b.currency || '')) +
                 ' at ' + nd(String(per)),
          src:nd(String(b.source || '')), colour:x[2], value:numv(x[0].values[0]), co:false
        });
      });
      bal.total = bal.items.length;
    }
    add(bal);

    /* EXECUTIVES: only what ceos.json names */
    var exe = newCluster('execs', 'EXECUTIVES', 'radial', {file:'ceos.json'});
    if(DATA.ceosSt === 'failed'){
      exe.state = 'fail'; exe.err = DATA.ceosErr || 'ceos.json not loaded';
    } else {
      var nm = (DATA.ceos || {})[tk] || (DATA.ceos || {})[sym] || '';
      exe.total = nm ? 1 : 0;
      if(nm){
        var sr = (DATA.ceosSrc || {})[tk] || (DATA.ceosSrc || {})[sym] || null;
        exe.items.push({
          key:'ex1:' + nm, cluster:'execs', label:codeOf('', nm), name:nd(String(nm)),
          code:'', link:'Executive',
          reason:nd(String((sr && sr.title) || 'chief executive') + ' named on file'),
          src:sr ? nd(String(sr.source || '')) : 'ceos.json', colour:GREY, co:false
        });
      }
    }
    add(exe);

    /* EVENTS */
    var ev = newCluster('events', 'EVENTS', 'text', {file:DATA.caFile || 'corporate actions'});
    if(DATA.caSt === 'failed'){
      ev.state = 'fail'; ev.err = DATA.caErr;
    } else {
      var rows2 = DATA.ca || [];
      ev.total = rows2.length;
      rows2.forEach(function(r){
        var lbl = String(r.text || r.kind || '');
        var when = String(r.date || '');
        var kind = String(r.kind || '').toUpperCase();
        ev.items.push({
          key:'ev:' + when + ':' + lbl.slice(0, 24), cluster:'events',
          label:cut(lbl, 44), name:nd(lbl), code:'', link:'Corporate action',
          reason:nd(kind + ' | ' + when), src:nd(String(r.src || '')),
          colour:(kind.indexOf('DIVIDEND') >= 0 ? UP : (kind.indexOf('AGM') >= 0 ? BLUE : GREY)),
          meta:cut(when, 12), co:false
        });
      });
    }
    add(ev);

    /* NEWS */
    var nw = newCluster('news', 'NEWS', 'text', {file:ex.toLowerCase() + '_news.json'});
    if(DATA.newsSt === 'failed'){
      nw.state = 'fail'; nw.err = DATA.newsErr;
    } else {
      var toks = core.split(' ').filter(function(w){ return w.length >= 4; });
      var news = (DATA.news || []).filter(function(n){
        return newsHit(n.title, tk, row.name);
      });
      news.sort(function(a, b){ return (Number(b.ts) || 0) - (Number(a.ts) || 0); });
      nw.total = news.length;
      news.forEach(function(n){
        nw.items.push({
          key:'nw:' + String(n.id || n.title || '').slice(0, 30), cluster:'news',
          label:cut(n.title, 46), name:nd(n.title || ''), code:'', link:'Headline',
          reason:nd(String(n.publisher || '') + ' | ' + String(n.date || '')),
          src:nd(String(n.url || '')), colour:GREY, meta:cut(String(n.date || ''), 10), co:false
        });
      });
    }
    add(nw);

    /* two nominees can share a six letter code: number the repeats inside a
       cluster so no two boxes carry the same label */
    out.forEach(function(c){
      var seen = {};
      c.items.forEach(function(it){
        var lb = String(it.label || '?');
        if(seen[lb]){
          seen[lb] += 1;
          it.label = (lb + seen[lb]).slice(0, 9);
        } else {
          seen[lb] = 1;
        }
      });
    });

    /* caps: per cluster, then the total, and the total is stated on the map */
    var CAPS = {indices:8, exchanges:4, peers:8, customers:8, suppliers:8, partners:8,
                hop2:8, holders:8, balance:3, execs:2, laws:8, events:4, news:4};
    var used = 0, dropped = 0;
    out.forEach(function(c){
      var lim = CAPS[c.key] != null ? CAPS[c.key] : 6;
      if(c.items.length > lim){
        dropped += c.items.length - lim;
        c.items = c.items.slice(0, lim);
      }
      c.shown = c.items.length;
    });
    out.slice().sort(function(a, b){ return (b.promo ? 1 : 0) - (a.promo ? 1 : 0); })
      .forEach(function(c){
        var room = Math.max(0, G.cap - used);
        if(c.shown > room){
          dropped += c.shown - room;
          c.items = c.items.slice(0, room);
          c.shown = c.items.length;
        }
        used += c.shown;
      });
    out.sort(function(a, b){ return a.seed - b.seed; });

    var centre = {key:'C:' + ex + ':' + tk, name:nd(row.name || tk), tk:tk, ex:ex,
                  price:rowPrice(row), pct:pctOf(row), sector:row.sector || '',
                  asOf:String(row.asOf || ''), currency:String(row.currency || ''),
                  prev:numv(row.prevClose), co:true, listed:true, rec:G.rec};
    return {row:row, ex:ex, tk:tk, centre:centre, clusters:out, dropped:dropped,
            spark:DATA.spark, nodes:[], edges:[], tm:null};
  }

  /* ---------- 4. reach: direct, one link, two links ------------------- */
  function modelNodes(m){
    var n = [m.centre];
    m.clusters.forEach(function(c){ c.items.forEach(function(it){ n.push(it); }); });
    return n;
  }
  function modelEdges(m){
    var e = [];
    m.clusters.forEach(function(c){
      c.items.forEach(function(it){
        if(!it.co) return;
        if(it.hop === 2 && it.parent) e.push({a:it.parent, b:it.key, type:it.link});
        else e.push({a:m.centre.key, b:it.key, type:it.link});
      });
    });
    return e;
  }
  function transMsg(tm){
    if(tm.direct) return '';
    var s = 'THIS ACT NAMES NO SECURITY ON THIS MAP';
    if(!tm.named.length && !tm.all){
      return s + ': ITS RECORD NAMES NO TICKER, ONLY SECTORS ' +
        (tm.sectors.length ? tm.sectors.join(' ') : 'NONE');
    }
    if(tm.all && !tm.named.length){
      return s + ': IT NAMES EVERY ' + tm.ex + ' ISSUER AND NO ' + tm.ex +
        ' ISSUER IS DRAWN HERE';
    }
    var tk = tm.named.slice(0, 4).join(' ') + (tm.named.length > 4 ? ' +' + (tm.named.length - 4) : '');
    var se = tm.sectors.length ? tm.sectors.join(' ') : 'NONE';
    return s + ': ITS TICKERS ' + tk + ' AND ITS SECTORS ' + se + ' ARE NOT DRAWN HERE';
  }
  function trans(m){
    m.tm = null;
    var sc = lawScope();
    var nodes = modelNodes(m), edges = modelEdges(m);
    m.nodes = nodes; m.edges = edges;
    if(!sc){
      nodes.forEach(function(n){ n.st = ''; n.why = ''; });
      return;
    }
    var rank = {};
    nodes.forEach(function(n){
      n.st = ''; n.why = '';
      if(!n.co) return;
      var ex = String(n.ex || '').toUpperCase();
      var tk = String(n.tk || '').toUpperCase();
      var se = String(n.sector || '').toUpperCase();
      if(!n.listed || !tk || ex !== sc.ex) return;
      if(sc.named.indexOf(tk) >= 0){ n.st = 'direct'; n.why = 'named'; rank[n.key] = 1; return; }
      if(sc.all){ n.st = 'direct'; n.why = 'all'; rank[n.key] = 1; return; }
      if(se && sc.secs.indexOf(se) >= 0){ n.st = 'direct'; n.why = 'sector'; rank[n.key] = 1; }
    });
    var H1 = {}, H2 = {};
    edges.forEach(function(e){
      if(rank[e.a] === 1 && rank[e.b] == null) H1[e.b] = 1;
      if(rank[e.b] === 1 && rank[e.a] == null) H1[e.a] = 1;
    });
    Object.keys(H1).forEach(function(k){ rank[k] = 2; });
    edges.forEach(function(e){
      if(rank[e.a] === 2 && rank[e.b] == null) H2[e.b] = 1;
      if(rank[e.b] === 2 && rank[e.a] == null) H2[e.a] = 1;
    });
    Object.keys(H2).forEach(function(k){ rank[k] = 3; });
    var direct = [], h1 = [], h2 = [], off = [], noRec = 0;
    nodes.forEach(function(n){
      if(!n.co) return;
      var r = rank[n.key];
      n.st = r === 1 ? 'direct' : (r === 2 ? 'hop1' : (r === 3 ? 'hop2' : 'off'));
      if(n.st === 'direct'){ direct.push(n); if(!n.rec) noRec++; }
      else if(n.st === 'hop1') h1.push(n);
      else if(n.st === 'hop2') h2.push(n);
      else off.push(n);
    });
    var namedTk = sc.named.filter(function(x){ return x !== 'ALL'; });
    m.tm = {ex:sc.ex, all:sc.all, named:namedTk, sectors:sc.secs,
            direct:direct.length, hop1:h1.length, hop2:h2.length, off:off.length,
            directList:direct.map(function(n){ return n.tk || n.name; }),
            hop1List:h1.map(function(n){ return n.tk || n.name; }),
            hop2List:h2.map(function(n){ return n.tk || n.name; }),
            offList:off.map(function(n){ return n.tk || n.name; }),
            noRec:noRec, edgesAmber:0};
    m.tm.msg = transMsg(m.tm);
    G.tm = m.tm;
  }

  /* ---------- 5. geometry ------------------------------------------- */
  /* Sizes shrink with the viewport so twelve clusters and one centre box fit at
     1280 as well as at 1600. Placement is a rough ring of seeds plus a
     separation pass; if any two boxes still touch, the whole set is scaled down
     and placed again, so an overlap is never shipped. */
  function sizeOf(c, s){
    if(c.kind === 'text'){
      var nt = Math.max(1, c.items.length);
      return {w:Math.round(152 * s), h:Math.round((20 + nt * 12) * s + 6)};
    }
    if(c.kind === 'bars'){
      return {w:Math.round(140 * s), h:Math.round(92 * s)};
    }
    var cnt = Math.max(1, c.items.length);
    var rx = 26 * s + Math.min(8, cnt) * 4.6 * s;
    if(c.promo) rx = Math.max(rx, 40 * s);
    var ry = rx * 0.70;
    var maxLen = 0;
    c.items.forEach(function(it){ maxLen = Math.max(maxLen, String(it.label || '').length); });
    var padX = Math.max(26 * s, maxLen * 6.8 * s * 0.62 + 11 * s);
    var w = Math.round(2 * rx + padX), h = Math.round(2 * ry + 30 * s);
    if(c.promo){ w = Math.max(w, Math.round(172 * s)); h = Math.max(h, Math.round(120 * s)); }
    return {w:w, h:h, rx:rx, ry:ry};
  }
  function aabbHit(a, b, gap){
    return !(a.x + a.w + gap <= b.x || b.x + b.w + gap <= a.x ||
             a.y + a.h + gap <= b.y || b.y + b.h + gap <= a.y);
  }
  function relax(boxes, cbox, W, areaH, topPad, gap){
    var i, j, it, a, b, ox, oy, minY = topPad + 2, maxY = topPad + areaH - 6;
    for(it = 0; it < 320; it++){
      var moved = false;
      for(i = 0; i < boxes.length; i++){
        for(j = i + 1; j < boxes.length; j++){
          a = boxes[i]; b = boxes[j];
          ox = (a.w + b.w) / 2 + gap - Math.abs((a.x + a.w / 2) - (b.x + b.w / 2));
          oy = (a.h + b.h) / 2 + gap - Math.abs((a.y + a.h / 2) - (b.y + b.h / 2));
          if(ox > 0 && oy > 0){
            if(ox < oy){
              var sx = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;
              a.x += sx * Math.ceil(ox / 2); b.x -= sx * Math.ceil(ox / 2);
            } else {
              var sy = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;
              a.y += sy * Math.ceil(oy / 2); b.y -= sy * Math.ceil(oy / 2);
            }
            moved = true;
          }
        }
      }
      boxes.forEach(function(p){
        ox = (p.w + cbox.w) / 2 + gap - Math.abs((p.x + p.w / 2) - (cbox.x + cbox.w / 2));
        oy = (p.h + cbox.h) / 2 + gap - Math.abs((p.y + p.h / 2) - (cbox.y + cbox.h / 2));
        if(ox > 0 && oy > 0){
          if(ox < oy){
            p.x += ((p.x + p.w / 2) < (cbox.x + cbox.w / 2) ? -1 : 1) * Math.ceil(ox);
          } else {
            p.y += ((p.y + p.h / 2) < (cbox.y + cbox.h / 2) ? -1 : 1) * Math.ceil(oy);
          }
          moved = true;
        }
        p.x = Math.max(3, Math.min(W - p.w - 3, p.x));
        p.y = Math.max(minY, Math.min(maxY - p.h, p.y));
      });
      if(!moved) break;
    }
  }
  function overlaps(boxes, cbox){
    var out = [], i, j;
    for(i = 0; i < boxes.length; i++){
      if(aabbHit(boxes[i], cbox, 0)) out.push(boxes[i].key + '|CENTRE');
      for(j = i + 1; j < boxes.length; j++){
        if(aabbHit(boxes[i], boxes[j], 0)) out.push(boxes[i].key + '|' + boxes[j].key);
      }
    }
    return out;
  }
  function gapOf(a, b){
    var gx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w));
    var gy = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h));
    return Math.max(gx, gy);
  }
  function minGap(boxes, cbox){
    var mg = 1e9, i, j;
    for(i = 0; i < boxes.length; i++){
      mg = Math.min(mg, gapOf(boxes[i], cbox));
      for(j = i + 1; j < boxes.length; j++) mg = Math.min(mg, gapOf(boxes[i], boxes[j]));
    }
    return (mg === 1e9 ? 0 : Math.round(mg));
  }
  function layoutMap(m, W, H){
    var s0 = Math.min(W / 1090, (H - 30) / 530);
    s0 = Math.max(0.62, Math.min(1.25, s0));
    var topPad = 8, subH = 20;
    var areaH = Math.max(150, H - subH - topPad);
    var cx = W / 2, cy = topPad + areaH / 2;
    var CW = Math.round(208 * s0), CH = Math.round(106 * s0);
    var cbox = {x:Math.round(cx - CW / 2), y:Math.round(cy - CH / 2), w:CW, h:CH};
    var s = s0, boxes = null, tries = 0;
    for(tries = 0; tries < 14; tries++){
      s = s0 * Math.pow(0.945, tries);
      boxes = m.clusters.map(function(c){
        var z = sizeOf(c, s);
        return {key:c.key, c:c, w:z.w, h:z.h, rx:z.rx, ry:z.ry, s:s};
      });
      var arx = W * 0.335, ary = areaH * 0.325;
      boxes.forEach(function(b){
        var a = (b.c.seed || 0) * Math.PI / 180;
        b.x = Math.round(cx + Math.cos(a) * arx - b.w / 2);
        b.y = Math.round(cy + Math.sin(a) * ary - b.h / 2);
      });
      relax(boxes, cbox, W, areaH, topPad, Math.max(4, 9 * s));
      if(!overlaps(boxes, cbox).length) break;
    }
    m.geo = {w:W, h:H, s:s, cbox:cbox, boxes:boxes, overlaps:overlaps(boxes, cbox),
             areaH:areaH, topPad:topPad, subH:subH, tries:tries + 1};
    m.geo.minGap = minGap(boxes, cbox);
    return m.geo;
  }

  /* ---------- 6. drawing ------------------------------------------- */
  function connPath(a, b){
    var ax = a.x + a.w / 2, ay = a.y + a.h / 2;
    var bx = b.x + b.w / 2, by = b.y + b.h / 2;
    var dx = bx - ax, dy = by - ay;
    var t1 = 0, t2 = 1;
    if(dx !== 0 || dy !== 0){
      var tx = dx === 0 ? 1e9 : (a.w / 2) / Math.abs(dx);
      var ty = dy === 0 ? 1e9 : (a.h / 2) / Math.abs(dy);
      t1 = Math.min(tx, ty);
      var ux = dx === 0 ? 1e9 : (b.w / 2) / Math.abs(dx);
      var uy = dy === 0 ? 1e9 : (b.h / 2) / Math.abs(dy);
      t2 = 1 - Math.min(ux, uy);
    }
    return [ax + dx * t1, ay + dy * t1, ax + dx * t2, ay + dy * t2];
  }
  function nodeHTML(it, x, y, w, h, fs){
    var cls = 'nd' + (it.st ? ' st-' + it.st : '');
    var op = (it.st === 'off') ? .3 : ((it.st === 'hop2') ? .62 : 1);
    var lbl = String(it.label || '?');
    var bw = Math.max(w, Math.round(lbl.length * fs * 0.62 + 7));
    var hh = Math.round(h);
    var out = '<g class="' + cls + '" data-k="' + t(it.key) + '" data-cl="' + t(it.cluster || '') +
      '" data-st="' + t(it.st || '') + '" data-co="' + (it.co ? 1 : 0) + '"' +
      (it.st === 'off' || it.st === 'hop2' ? ' opacity="' + op + '"' : '') + '>' +
      '<title>' + t(it.name + (it.code ? ' ' + it.code : '') +
        (it.reason ? ' | ' + it.reason : '')) + '</title>' +
      '<rect class="nb" x="' + (x - bw / 2).toFixed(1) + '" y="' + (y - hh / 2).toFixed(1) +
      '" width="' + bw + '" height="' + hh + '" rx="1.5" stroke="' + it.colour + '"/>';
    if(it.st === 'direct' || it.st === 'hop1' || it.st === 'hop2'){
      out += '<rect class="ar ' + (it.st === 'direct' ? 'd' : (it.st === 'hop1' ? 'h1' : 'h2')) +
        '" x="' + (x - bw / 2 - 2).toFixed(1) + '" y="' + (y - hh / 2 - 2).toFixed(1) +
        '" width="' + (bw + 4) + '" height="' + (hh + 4) + '" rx="2"/>';
    }
    out += '<text class="nt" x="' + x.toFixed(1) + '" y="' + (y + fs * 0.36).toFixed(1) +
      '" text-anchor="middle" fill="' + it.colour + '">' + t(lbl) + '</text></g>';
    return out;
  }
  function clusterSVG(m, b, s){
    var c = b.c;
    var fs = 6.8 * s;
    var out = '<g class="clgrp" data-cl="' + t(c.key) + '"><title>' +
      t(c.tip || (c.title + ' ' + c.shown + ' of ' + (c.total || 0) + ' drawn from ' + (c.file || 'the record'))) +
      '</title>';
    out += '<rect class="cb2' + (c.promo ? ' promo' : '') + '" x="' + b.x + '" y="' + b.y +
      '" width="' + b.w + '" height="' + b.h + '" rx="2"/>';
    if(c.promo){
      out += '<rect class="pbar" x="' + b.x + '" y="' + b.y + '" width="2" height="' + b.h + '"/>';
    }
    out += '<text class="ct' + (c.promo ? ' promo' : '') + '" x="' + (b.x + 7) + '" y="' +
      (b.y + 12 * s).toFixed(1) + '">' + t(c.title) +
      '<tspan class="cc" dx="3">(' + c.shown + '/' + (c.total || 0) + ')</tspan></text>';
    out += '<line class="crule" x1="' + (b.x + 5) + '" y1="' + (b.y + 16 * s).toFixed(1) +
      '" x2="' + (b.x + b.w - 5) + '" y2="' + (b.y + 16 * s).toFixed(1) + '"/>';

    var top = b.y + 17 * s, bot = b.y + b.h - 5;
    if(c.state === 'fail'){
      out += '<text class="notread" x="' + (b.x + 8) + '" y="' + (top + 14).toFixed(1) +
        '">FILE NOT READ</text>';
      out += '<text class="notread" x="' + (b.x + 8) + '" y="' + (top + 26).toFixed(1) + '">' +
        t(cut(c.err || 'no detail', 30)) + '</text>';
      return out + '</g>';
    }
    if(!c.shown){
      out += '<text class="none" x="' + (b.x + b.w / 2) + '" y="' + ((top + bot) / 2 + 3) +
        '" text-anchor="middle">NONE</text>';
      return out + '</g>';
    }

    if(c.kind === 'text'){
      var y = top + 9 * s;
      var lim = Math.max(10, Math.floor((b.w - 20) / (6.9 * s * 0.60)));
      c.items.forEach(function(it){
        out += '<g class="nd" data-k="' + t(it.key) + '" data-cl="' + t(c.key) + '" data-st="' +
          t(it.st || '') + '" data-co="0"><title>' + t(it.name + ' | ' + it.reason) + '</title>' +
          '<rect x="' + (b.x + 4) + '" y="' + (y - 7 * s).toFixed(1) + '" width="' + (b.w - 8) +
          '" height="' + (11 * s).toFixed(1) + '" fill="transparent"/>' +
          '<circle class="td" cx="' + (b.x + 8) + '" cy="' + (y - 2 * s).toFixed(1) +
          '" r="1.8" fill="' + it.colour + '"/>' +
          '<text class="tl" x="' + (b.x + 13) + '" y="' + y.toFixed(1) + '">' +
          t(cut(it.label, lim)) + '</text></g>';
        y += 12 * s;
      });
      return out + '</g>';
    }
    if(c.kind === 'bars'){
      var bx = b.x + 10, bwid = b.w - 20, nbar = c.items.length;
      var slot = bwid / Math.max(1, nbar);
      var barW = Math.min(22 * s, slot - 8);
      var maxV = 0;
      c.items.forEach(function(it){ maxV = Math.max(maxV, Math.abs(it.value || 0)); });
      var base = bot - 12 * s, hMax = Math.max(16, base - (top + 12));
      c.items.forEach(function(it, i){
        var hgt = maxV > 0 ? Math.max(2, Math.round(Math.abs(it.value || 0) / maxV * hMax)) : 2;
        var x = bx + slot * i + (slot - barW) / 2;
        out += '<g class="nd" data-k="' + t(it.key) + '" data-cl="' + t(c.key) + '" data-co="0">' +
          '<title>' + t(it.name + ' | ' + it.reason) + '</title>' +
          '<rect class="br" x="' + x.toFixed(1) + '" y="' + (base - hgt) + '" width="' +
          barW.toFixed(1) + '" height="' + hgt + '" fill="' + it.colour + '" opacity=".8"/>' +
          '<text class="bv" x="' + (x + barW / 2).toFixed(1) + '" y="' + (base - hgt - 3) +
          '" text-anchor="middle">' + t(fmtBig(it.value)) + '</text>' +
          '<text class="bl" x="' + (x + barW / 2).toFixed(1) + '" y="' + (base + 8 * s).toFixed(1) +
          '" text-anchor="middle">' + t(it.label) + '</text></g>';
      });
      return out + '</g>';
    }
    /* radial: a hub and coloured labelled boxes on a ring around it */
    var hx = b.x + b.w / 2, hy = (top + bot) / 2;
    var nn = c.items.length, placed = [];
    c.items.forEach(function(it, i){
      var ang = nn === 1 ? 0 : (-Math.PI / 2 + (Math.PI * 2 / Math.max(1, nn)) * i);
      placed.push({it:it, x:hx + Math.cos(ang) * b.rx, y:hy + Math.sin(ang) * b.ry});
    });
    placed.forEach(function(p){
      out += '<line class="sp" x1="' + hx.toFixed(1) + '" y1="' + hy.toFixed(1) + '" x2="' +
        p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '"/>';
    });
    out += '<circle class="hub" cx="' + hx.toFixed(1) + '" cy="' + hy.toFixed(1) + '" r="3"/>';
    placed.forEach(function(p){
      out += nodeHTML(p.it, p.x, p.y, 30 * s, 12 * s, fs);
    });
    return out + '</g>';
  }
  function sparkSVG(m, x, y, w, h){
    var d = m.spark;
    var bars = (d && d.bars) || null;
    if(!bars || !bars.length){
      return '<text class="cnh" x="' + x + '" y="' + (y + h / 2 + 3) +
        '">NO PRICE HISTORY ON FILE</text>';
    }
    var closes = bars.slice(-30).map(function(b){
      return numv(b.c != null ? b.c : b.close);
    }).filter(function(v){ return v != null; });
    if(closes.length < 2) return '';
    var lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes);
    var rng = (hi - lo) || 1;
    var pts = closes.map(function(v, i){
      var px = x + (w * i / (closes.length - 1));
      var py = y + h - ((v - lo) / rng) * h;
      return px.toFixed(1) + ',' + py.toFixed(1);
    }).join(' ');
    var up = closes[closes.length - 1] >= closes[0];
    return '<polyline class="spl" points="' + pts + '" stroke="' + (up ? UP : DN) + '"/>';
  }
  function centreSVG(m, s){
    var c = m.centre, g = m.geo.cbox, pc = c.pct;
    var strip = (pc == null || pc >= 0) ? '' : ' dn';
    var hdr = (pc == null || pc >= 0) ? '#04120c' : '#2a0808';
    var out = '<g class="ctr" data-k="' + t(c.key) + '">';
    out += '<rect class="cbox" x="' + g.x + '" y="' + g.y + '" width="' + g.w + '" height="' +
      g.h + '" rx="2"/>';
    out += '<rect class="chd' + strip + '" x="' + g.x + '" y="' + g.y + '" width="' + g.w +
      '" height="' + Math.round(15 * s) + '" rx="2"/>';
    out += '<text class="ctk" x="' + (g.x + 7) + '" y="' + (g.y + 11.2 * s).toFixed(1) +
      '" fill="' + hdr + '">' + t(c.tk) + '</text>';
    out += '<text class="cex" x="' + (g.x + g.w - 7) + '" y="' + (g.y + 10.8 * s).toFixed(1) +
      '" fill="' + hdr + '">' + t(c.ex) + '</text>';
    out += '<text class="cnm" x="' + (g.x + 7) + '" y="' + (g.y + 27 * s).toFixed(1) + '">' +
      t(cut(c.name, 36)) + '</text>';
    var py = g.y + 44 * s;
    out += '<text class="cpx" x="' + (g.x + 7) + '" y="' + py.toFixed(1) + '">' +
      t(fmtP(c.price)) + '</text>';
    out += '<text class="ccy" x="' + (g.x + 9 + String(fmtP(c.price)).length * 8.4 * s).toFixed(1) +
      '" y="' + py.toFixed(1) + '">' + t(c.currency || '') + '</text>';
    out += '<text class="cch" x="' + (g.x + g.w - 7) + '" y="' + (py - 1).toFixed(1) +
      '" text-anchor="end" fill="' +
      (pc == null ? GREY : (pc > 0 ? UP : (pc < 0 ? DN : GREY))) + '">' + t(fmtPct(pc)) +
      '</text>';
    out += sparkSVG(m, g.x + 7, g.y + 50 * s, g.w - 14, 20 * s);
    out += '<text class="cas" x="' + (g.x + 7) + '" y="' + (g.y + g.h - 6) + '">' +
      t((c.prev != null ? 'PREV ' + fmtP(c.prev) + '  ' : '') +
        (c.asOf ? 'AS OF ' + c.asOf : '')) + '</text>';
    out += '</g>';
    return out;
  }
  function svgAll(m, W, H){
    var s = m.geo.s, out = '<g class="gv">';
    m.geo.boxes.forEach(function(b){
      var p = connPath(m.geo.cbox, b);
      out += '<path class="cn" data-cl="' + t(b.key) + '" d="M' + p[0].toFixed(1) + ' ' +
        p[1].toFixed(1) + ' L' + p[2].toFixed(1) + ' ' + p[3].toFixed(1) + '"/>';
    });
    m.geo.boxes.forEach(function(b){ out += clusterSVG(m, b, s); });
    out += centreSVG(m, s);
    return out + '</g>';
  }

  /* ---------- 7. header and footer lines --------------------------- */
  function filesLine(){
    var ok = [], bad = [];
    EXS.forEach(function(ex){ (REL_ST[ex] === 'ok' ? ok : bad).push(ex); });
    return 'FILES ' + (ok.length ? ok.join(' ') : 'NONE') +
      (bad.length ? ' | <b>' + bad.join(' ') + ' NOT READ</b>' : '');
  }
  function nodeCount(m){
    var n = 0;
    m.clusters.forEach(function(c){ n += c.items.length; });
    return n;
  }
  function headerMeta(m){
    return m.clusters.length + ' CLUSTERS | ' + nodeCount(m) + ' NODES | CAP ' + G.cap +
      (m.dropped ? ' | ' + m.dropped + ' DROPPED' : '');

  function subHTML(m){

  /* ---------- 8. pan, zoom, hover, detail -------------------------- */
  var MAP = {k:1, x:0, y:0, drag:false, moved:false, sx:0, sy:0, ox:0, oy:0, svg:null};
  function applyView(svg){
    if(!svg) return;
    var gv = svg.querySelector('.gv');
    if(gv){
      gv.setAttribute('transform', 'translate(' + MAP.x.toFixed(2) + ',' + MAP.y.toFixed(2) +
        ') scale(' + MAP.k.toFixed(3) + ')');
    }
    var zk = document.getElementById('zk');
    if(zk) zk.textContent = MAP.k.toFixed(1) + 'x';
  }
  function zoomAt(svg, mx, my, f){
    var k2 = Math.max(0.5, Math.min(4.5, MAP.k * f));
    if(Math.abs(k2 - MAP.k) < 0.0005) return;
    MAP.x = mx - (mx - MAP.x) * (k2 / MAP.k);
    MAP.y = my - (my - MAP.y) * (k2 / MAP.k);
    MAP.k = k2;
    applyView(svg);
  }
  function zoomBy(f){
    if(!MAP.svg) return;
    var r = MAP.svg.getBoundingClientRect();
    zoomAt(MAP.svg, (r.width || 0) / 2, (r.height || 0) / 2, f);
  }
  function resetView(){
    MAP.k = 1; MAP.x = 0; MAP.y = 0;
    applyView(MAP.svg);
  }
  var PAN_WIRED = false;
  function wirePan(svg){
    if(!PAN_WIRED){
      PAN_WIRED = true;
      document.addEventListener('mousemove', function(ev){
        if(!MAP.drag || !MAP.svg) return;
        var dx = ev.clientX - MAP.sx, dy = ev.clientY - MAP.sy;
        if(Math.abs(dx) > 3 || Math.abs(dy) > 3) MAP.moved = true;
        if(!MAP.moved) return;
        MAP.x = MAP.ox + dx;
        MAP.y = MAP.oy + dy;
        applyView(MAP.svg);
      });
      document.addEventListener('mouseup', function(){
        if(!MAP.drag) return;
        MAP.drag = false;
        if(MAP.svg) MAP.svg.classList.remove('drag');
      });
    }
    if(!svg) return;
    svg.addEventListener('mousedown', function(ev){
      if(ev.button !== 0) return;
      MAP.drag = true;
      MAP.moved = false;
      MAP.sx = ev.clientX;
      MAP.sy = ev.clientY;
      MAP.ox = MAP.x;
      MAP.oy = MAP.y;
      MAP.svg = svg;
      svg.classList.add('drag');
    });
    svg.addEventListener('wheel', function(ev){
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      zoomAt(svg, ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, {passive:false});
  }
  function markNode(svg){
    if(!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.nd'), function(el){
      if(el.getAttribute('data-k') === G.selKey) el.classList.add('on');
      else el.classList.remove('on');
    });
  }
  /* hover lifts the cluster the node belongs to and lets the rest recede */
  function hoverNode(svg, key, cl){
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      var same = el.getAttribute('data-k') === key;
      var sib = cl && el.getAttribute('data-cl') === cl;
      el.classList.toggle('hv', same);
      el.classList.toggle('dim', !same && !sib);
    });
    Array.prototype.forEach.call(svg.querySelectorAll('path.cn'), function(el){
      el.classList.toggle('hi', !!cl && el.getAttribute('data-cl') === cl);
    });
    Array.prototype.forEach.call(svg.querySelectorAll('rect.cb2'), function(el){
      var grp = el.parentNode;
      el.classList.toggle('hi', !!cl && grp && grp.getAttribute('data-cl') === cl);
    });
  }
  function clearHover(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      el.classList.remove('dim');
      el.classList.remove('hv');
    });
    Array.prototype.forEach.call(svg.querySelectorAll('path.cn'), function(el){
      el.classList.remove('hi');
    });
    Array.prototype.forEach.call(svg.querySelectorAll('rect.cb2'), function(el){
      el.classList.remove('hi');
    });
  }
  function wireNodes(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('.nd'), function(el){
      var key = el.getAttribute('data-k') || '';
      var cl = el.getAttribute('data-cl') || '';
      el.addEventListener('mouseenter', function(){ hoverNode(svg, key, cl); });
      el.addEventListener('mouseleave', function(){ clearHover(svg); });
      el.addEventListener('click', function(ev){
        if(MAP.moved) return;
        ev.stopPropagation();
        G.selKey = key;
        markNode(svg);
        paintSel();
      });
    });
  }
  function findNode(key){
    var m = G.model;
    if(!m || !key) return null;
    if(m.centre.key === key) return m.centre;
    for(var i = 0; i < m.clusters.length; i++){
      var c = m.clusters[i];
      for(var j = 0; j < c.items.length; j++) if(c.items[j].key === key) return c.items[j];
    }
    return null;
  }
  function actBasis(n){
    if(!G.law || !n || !n.co) return '';
    if(n.st === 'direct'){
      if(n.why === 'named') return 'DIRECT, NAMED BY ACT';
      if(n.why === 'all') return 'DIRECT, ACT NAMES ALL ' + ((G.tm && G.tm.ex) || '') + ' ISSUERS';
      return 'DIRECT, SECTOR NAMED BY ACT';
    }
    if(n.st === 'hop1') return 'HOP 1, ONE RECORDED LINK FROM A DIRECT COMPANY';
    if(n.st === 'hop2') return 'HOP 2, ONE LINK FURTHER, DIMMER';
    return 'NOT REACHED BY THIS ACT';
  }
  function paintSel(){
    var box = document.getElementById('b_sel');
    if(!box) return;
    var n = findNode(G.selKey);
    if(!n){
      box.innerHTML = '<div class="emp"><b>NO NODE PINNED</b> click a node or a line on the map</div>';
      meta('sel', DASH);
      return;
    }
    var isC = String(n.key || '').indexOf('C:') === 0;
    var h = '';
    h += '<div class="srow"><span class="sk">NAME</span><span class="sv clip" title="' +
      t(n.name) + '">' + t(n.name) + '</span></div>';
    h += '<div class="srow"><span class="sk">CODE</span><span class="sv tk">' +
      t(n.code || n.tk || DASH) + '</span><span class="sk sk2">' + t(n.ex || '') + '</span></div>';
    if(isC){
      h += '<div class="srow"><span class="sk">PRICE</span><span class="sv">' + t(fmtP(n.price)) +
        ' ' + t(n.currency || '') + '</span><span class="sk sk2">' + t(fmtPct(n.pct)) + '</span></div>';
      h += '<div class="srow"><span class="sk">SECTOR</span><span class="sv dm">' +
        t(n.sector || DASH) + '</span></div>';
      h += '<div class="srow"><span class="sk">RECORD</span><span class="sv dm">' +
        recCount(n.rec) + ' LINKS ON FILE</span></div>';
      box.innerHTML = h;
      meta('sel', 'CENTRE | ' + (n.ex || ''));
      return;
    }
    h += '<div class="srow"><span class="sk">CLUSTER</span><span class="sv wr">' +
      t(String(n.cluster || '').toUpperCase()) + '</span><span class="sk sk2">' +
      t(n.link || '') + '</span></div>';
    if(n.co){
      h += '<div class="srow"><span class="sk">HOP</span><span class="sv dm">' +
        (n.hop || 1) + '</span></div>';
      if(G.law){
        h += '<div class="srow"><span class="sk">ACT</span><span class="sv ' +
          (n.st === 'direct' ? 'wr' : 'dm') + '" title="' + t(actBasis(n)) + '">' +
          t(actBasis(n)) + '</span></div>';
      }
    }
    h += '<div class="srow"><span class="sk">NOTE</span><span class="sv clip" title="' +
      t(n.reason || '') + '">' + t(n.reason || 'none recorded') + '</span></div>';
    h += '<div class="srow"><span class="sk">SOURCE</span><span class="sv dm" title="' +
      t(n.src || '') + '">' + t(n.src || DASH) + '</span></div>';
    box.innerHTML = h;
    meta('sel', String(n.cluster || '').toUpperCase() + (n.co ? ' | HOP ' + (n.hop || 1) : ''));
  }

  /* ---------- 9. draw ------------------------------------------- */
  function renderMap(box){
    var m = buildClusters(G.row);
    G.model = m;
    trans(m);
    G.tm = m.tm;
    box.innerHTML = '<div class="gwrap"></div><div class="gsub" id="gsub">' + subHTML(m) +
      '</div>';
    var wrap = box.querySelector('.gwrap');
    function run(){
      var r = wrap.getBoundingClientRect();
      var w = Math.round(r.width || box.clientWidth || 600);
      var hh = Math.round(r.height || box.clientHeight || 300);
      if(w < 80 || hh < 80) return;
      layoutMap(m, w, hh);
      wrap.innerHTML = '<svg class="gsvg" viewBox="0 0 ' + w + ' ' + hh + '" width="' + w +
        '" height="' + hh + '">' + svgAll(m, w, hh) + '</svg>';
      var svg = wrap.querySelector('.gsvg');
      MAP.svg = svg;
      applyView(svg);
      wirePan(svg);
      wireNodes(svg);
      markNode(svg);
      var cm = document.getElementById('m_rel');
      if(cm) cm.textContent = nd(headerMeta(m));
      var gs = document.getElementById('gsub');
      if(gs) gs.innerHTML = subHTML(m);
      G.geo = m.geo;
    }
    run();
    PAINT.rel = run;
    meta('rel', headerMeta(m));
    paintSel();
    paintAct();
  }
  function drawRel(box, row, relFile, rec){
    G.row = row;
    G.rec = rec;
    G.selKey = '';
    G.model = null;
    G.tm = null;
    MAP.k = 1; MAP.x = 0; MAP.y = 0;
    if(REL_ST[row.ex] === 'failed'){
      box.innerHTML = failBox('RELATIONSHIPS', 'relationships_' + row.ex +
        '.json not loaded: ' + readErr(sd('relationships_' + row.ex + '.json')));
      meta('rel', 'FILE NOT READ');
      paintSel();
      paintAct();
      return;
    }
    renderMap(box);
  }
  function setHop(n){
    G.hops = n === 2 ? 2 : 1;
    Array.prototype.forEach.call(document.querySelectorAll('#c_hop .hp'), function(x){
      x.setAttribute('aria-pressed', Number(x.getAttribute('data-hop')) === G.hops ? 'true' : 'false');
    });
  }
  function wireGraphControls(){
    Array.prototype.forEach.call(document.querySelectorAll('#c_hop .hp'), function(b){
      b.addEventListener('click', function(){
        setHop(Number(b.getAttribute('data-hop')));
        redrawGraph();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#c_type .ft'), function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-t');
        var on = G.types[k];
        var live = relTypes().filter(function(tp){ return G.types[tp.k]; }).length;
        if(on && live <= 1) return;
        G.types[k] = !on;
        b.setAttribute('aria-pressed', G.types[k] ? 'true' : 'false');
        redrawGraph();
      });
    });
    var zo = document.getElementById('zout');
    if(zo) zo.addEventListener('click', function(){ zoomBy(1 / 1.3); });
    var zi = document.getElementById('zin');
    if(zi) zi.addEventListener('click', function(){ zoomBy(1.3); });
    var zr = document.getElementById('zrst');
    if(zr) zr.addEventListener('click', function(){ resetView(); });
    var pol = document.getElementById('pol');
    if(pol){
      pol.addEventListener('change', function(){
        G.law = LAW.byId[pol.value] || null;
        /* an Act is traced two hops out, so its reach is visible without a
           second click; the reader can put it back to one hop */
        if(G.law) setHop(2);
