  /* ---------- 3. THESIS ---------------------------------------------- */
  /* The shape of a research answer: what is DIRECT, what reaches a company
     through a MECHANISM, what is NOT THERE, and what was read. Every row comes
     from static_data/research_theses.json and names the source and the date it
     was read at. Rows naming the selected security are marked and sorted first;
     the rest of the theme stays visible, because a theme is read as a whole. */
  var TH = {list:[], theme:'', marked:0, st:'unread'};

  function upperList(a){
    return (a || []).map(function(x){ return String(x).toUpperCase(); });
  }
  function thesisFor(tk){
    for(var i = 0; i < TH.list.length; i++){
      if(upperList(TH.list[i].securities).indexOf(tk) >= 0) return TH.list[i];
    }
    return null;
  }
  function rowHit(o, tk){
    return upperList(o && o.tickers).indexOf(tk) >= 0;
  }
  function tRow(o, tk, kind){
    var hit = rowHit(o, tk);
    var tks = upperList(o.tickers);
    var lead = (kind === 'source') ? '' : (tks.length ? tks.slice(0, 2).join(' ') : 'ALL');
    var cls = 'tr' + (hit ? ' hit' : '') + (kind === 'absent' ? ' abs' : '');
    var tip = [o.text || o.name || '', o.source || '', o.date || '', o.basis || '',
               o.url || ''].filter(Boolean).join(' | ');
    var h = '<div class="' + cls + '" title="' + t(tip) + '">';
    if(lead) h += '<span class="trk">' + t(lead) + '</span>';
    if(kind === 'mech') h += '<span class="tag2">IND</span>';
    h += '<span class="ttx">' + t(nd(o.text || o.name || '')) + '</span>';
    if(o.source && kind !== 'source') h += '<span class="tsrc">' + t(nd(o.source)) + '</span>';
    if(o.date) h += '<span class="tsd">' + t(nd(o.date)) + '</span>';
    h += '</div>';
    return h;
  }
  function tGroup(label, list, tk, kind, cap){
    var arr = (list || []).slice(), n = arr.length;
    var marked = arr.filter(function(o){ return rowHit(o, tk); }).length;
    var h = '<div class="tg"><div class="tgh">' + label + ' <b>' + n + '</b>' +
      (marked ? '<span class="hit">' + marked + ' MARKED</span>' : '') + '</div>';
    /* rows naming this security first, then the rest of the theme */
    arr.sort(function(a, b){ return (rowHit(b, tk) ? 1 : 0) - (rowHit(a, tk) ? 1 : 0); });
    arr.slice(0, cap || 4).forEach(function(o){ h += tRow(o, tk, kind); });
    if(n > (cap || 4)) h += '<div class="tr ab">+' + (n - (cap || 4)) + ' MORE IN RECORD</div>';
    if(!n) h += '<div class="tr ab">NONE RECORDED</div>';
    h += '</div>';
    return h;
  }
  function drawThesis(box, row, file, st){
    var tk = rowTicker(row);
    TH.st = st;
    TH.list = (file && file.theses) || [];
    TH.marked = 0;
    if(st === 'failed' || !file){
      box.innerHTML = failBox('THESIS', 'research_theses.json not loaded');
      meta('thes', 'FILE NOT READ');
      return;
    }
    if(!TH.list.length){
      box.innerHTML = empBox('NO THESIS ON FILE', 'the file carries no theme');
      meta('thes', '0 THEMES');
      return;
    }
    var th = thesisFor(tk);
    if(!th){
      /* the theme does not name this security, so the honest answer is the
         negative plus the securities the theme does reach: a lead, not a blank */
      var named = [];
      TH.list.forEach(function(x){ named = named.concat(x.securities || []); });
      var uniq = [], seen = {};
      named.forEach(function(x){
        var u = String(x).toUpperCase();
        if(!seen[u]){ seen[u] = 1; uniq.push(u); }
      });
      var head = uniq.slice(0, 14).join(' ') + (uniq.length > 14 ? ' +' + (uniq.length - 14) : '');
      box.innerHTML = empBox('NO THESIS NAMES ' + t(tk), TH.list.length + ' THEME' +
        (TH.list.length === 1 ? '' : 'S') + ' ON FILE: ' +
        TH.list.map(function(x){ return nd(x.theme || x.id); }).join(', ') +
        ' | NAMES ' + head);
      meta('thes', '0 MARKED');
      return;
    }
    var marked = 0;
    ['direct', 'mechanisms', 'absent', 'sources'].forEach(function(k){
      marked += (th[k] || []).filter(function(o){ return rowHit(o, tk); }).length;
    });
    TH.theme = nd(th.theme || th.id);
    TH.marked = marked;
    var h = '';
    h += tGroup('DIRECT LINKS', th.direct, tk, 'direct', 4);
    h += tGroup('MECHANISMS / INDIRECT', th.mechanisms, tk, 'mech', 3);
    h += tGroup('WHAT IS NOT THERE', th.absent, tk, 'absent', 3);
    h += tGroup('SOURCES', th.sources, tk, 'source', 4);
    h += '<div class="tnote">THEME ' + t(TH.theme) + ' | ' +
      (marked ? '<b>' + marked + ' MARKED</b> FOR ' + t(tk) : 'NO ROW NAMES ' + t(tk)) +
      '</div>';
    box.innerHTML = h;
    meta('thes', String(th.id || '').toUpperCase() + ' | ' + marked + ' MARKED');
  }

  /* ---------- 4. PRICE CHART ----------------------------------------- */
  var PXSTATE = {mode:'none', points:0, bars:0};
  function histPaths(row){
    var tk = rowTicker(row), sy = String(row.sym || '');
    var c = [];
    if(row.ex === 'NSE' || row.ex === 'NGX') c.push(row.ex + '_' + tk + '.json');
    if(sy){ c.push(sy + '.max.json'); c.push(sy + '.json'); }
    c.push(tk + '.max.json'); c.push(tk + '.json');
    var seen = {}, out = [];
    c.forEach(function(k){ if(k && !seen[k]){ seen[k] = 1; out.push(k); } });
    return out;
  }
  function readHistory(row){
    var keys = histPaths(row);
    return (function step(i){
      if(i >= keys.length) return Promise.resolve({d:null, path:sd('history/' + keys[0])});
      var p = sd('history/' + keys[i]);
      return getJSON(p).then(function(d){
        if(d && (d.bars || []).length) return {d:d, path:p};
        return step(i + 1);
      });
    })(0);
  }
  function engineReady(){
    return new Promise(function(res){
      if(window.LightweightCharts) return res(true);
      var t0 = Date.now();
      var iv = setInterval(function(){
        if(window.LightweightCharts){ clearInterval(iv); res(true); }
        else if(Date.now() - t0 > 3500){ clearInterval(iv); res(false); }
      }, 100);
    });
  }
  function svgLine(w, h, closes){
    if(closes.length < 2) return '';
    var padL = 6, padR = 6, padT = 10, padB = 14;
    var pw = w - padL - padR, ph = h - padT - padB;
    var mn = Math.min.apply(null, closes), mx = Math.max.apply(null, closes);
    var span = (mx - mn) || 1;
    var pts = closes.map(function(v, i){
      var x = padL + (i / (closes.length - 1)) * pw;
      var y = padT + ph - ((v - mn) / span) * ph;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<polyline points="' + pts + '" fill="none" stroke="#33e29a" stroke-width="1.3" ' +
      'vector-effect="non-scaling-stroke"/>' +
      '<text x="' + padL + '" y="' + (h - 4) + '" font-size="8" fill="#6a6a6a" ' +
      'font-family="Oxygen Mono,monospace">' + t(ipx(mn)) + '</text>' +
      '<text x="' + padL + '" y="' + (padT + 8) + '" font-size="8" fill="#6a6a6a" ' +
      'font-family="Oxygen Mono,monospace">' + t(ipx(mx)) + '</text></svg>';
  }
  function drawPrice(box, row, hist, histPath, histSt){
    var bars = (hist && hist.bars) || [];
    if(histSt === 'failed'){
      box.innerHTML = failBox('PRICE HISTORY', (histPath || '').split('/').pop() + ' not loaded');
      meta('px', 'FILE NOT READ');
      return;
    }
    if(!bars.length){
      box.innerHTML = empBox('NO BARS ON FILE', 'no price history for ' + rowTicker(row));
      meta('px', '0 BARS');
      return;
    }
    box.innerHTML = '<div class="pxbox"><div class="pxchart"></div><div class="pxfb"></div></div>';
    var host = box.querySelector('.pxchart');
    var fb = box.querySelector('.pxfb');
    var mapped = bars.map(function(b){
      return {time:String(b.t).slice(0, 10), open:numv(b.o), high:numv(b.h), low:numv(b.l),
              close:numv(b.c)};
    }).filter(function(p){ return p.close != null; });
    var canCandle = mapped.every(function(p){
      return p.open != null && p.high != null && p.low != null;
    });
    PXSTATE.bars = bars.length;

    function fallback(){
      host.style.display = 'none';
      fb.style.display = 'block';
      var run = function(){
        var w = Math.round(fb.clientWidth || 0), h = Math.round(fb.clientHeight || 0);
        if(!w || !h) return;
        var closes = mapped.slice(-160).map(function(p){ return p.close; });
        fb.innerHTML = svgLine(w, h, closes) || '<div class="emp">NO BARS</div>';
      };
      run();
      PAINT.px = run;
      PXSTATE.mode = 'svg';
      PXSTATE.points = Math.min(160, mapped.length);
    }

    engineReady().then(function(ok){
      if(!ok || !window.LightweightCharts){ fallback(); return; }
      try{
        var w = Math.max(120, host.clientWidth || 0), h = Math.max(90, host.clientHeight || 0);
        var chart = LightweightCharts.createChart(host, {
          layout:{background:{color:'transparent'}, textColor:'#6a6a6a',
                  fontFamily:'Oxygen Mono, monospace', fontSize:9},
          grid:{vertLines:{color:'rgba(38,38,38,.45)'}, horzLines:{color:'rgba(38,38,38,.45)'}},
          rightPriceScale:{borderColor:'#262626', scaleMargins:{top:.12, bottom:.12}},
          timeScale:{borderColor:'#262626', timeVisible:false, rightOffset:2},
          crosshair:{mode:1},
          handleScroll:true,
          handleScale:true,
          localization:{priceFormatter:function(p){
            return p >= 1000 ? p.toLocaleString(undefined, {maximumFractionDigits:0}) : p.toFixed(2);
          }},
          width:w, height:h
        });
        var series;
        if(canCandle){
          series = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor:'#33e29a', downColor:'#f87171', borderUpColor:'#33e29a',
            borderDownColor:'#f87171', wickUpColor:'#33e29a', wickDownColor:'#f87171',
            priceLineVisible:true, priceLineColor:'#33e29a', priceLineStyle:2
          });
          series.setData(mapped.map(function(p){
            return {time:p.time, open:p.open, high:p.high, low:p.low, close:p.close};
          }));
          PXSTATE.mode = 'candle';
        } else {
          series = chart.addSeries(LightweightCharts.LineSeries, {
            color:'#33e29a', lineWidth:2, priceLineVisible:true, priceLineColor:'#33e29a'
          });
          series.setData(mapped.map(function(p){ return {time:p.time, value:p.close}; }));
          PXSTATE.mode = 'line';
        }
        PXSTATE.points = mapped.length;
        chart.timeScale().fitContent();
        PAINT.px = function(){
          if(!host.clientWidth) return;
          chart.applyOptions({width:host.clientWidth, height:host.clientHeight});
        };
      }catch(e){
        fallback();
      }
    });

    var last = mapped[mapped.length - 1] || {};
    meta('px', fnum(bars.length, 0) + ' BARS | ' + mapped[0].time + ' > ' + last.time);
  }

  /* ---------- 5. NEWS STRIP ------------------------------------------ */
  var SUFFIX = {plc:1, ltd:1, limited:1, group:1, holdings:1, holding:1, company:1, co:1,
                inc:1, corp:1, corporation:1, sa:1, nv:1, ag:1, the:1, public:1, 'and':1};
  function normChars(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function coreName(s){
    return normChars(s).split(' ').filter(function(w){ return w && !SUFFIX[w]; }).join(' ');
  }
  function keysFor(row){
    var keys = [], seen = {};
    function add(k){
      k = normChars(k);
      if(!k || k.length < 3 || seen[k]) return;
      seen[k] = 1;
      keys.push({k:k, single:(k.indexOf(' ') < 0)});
    }
    add(String(row.ticker || ''));
    var sy = String(row.sym || '');
    if(sy && sy.toUpperCase() !== String(row.ticker || '').toUpperCase()){
      add(sy.replace(/\.(JO|CA)$/i, ''));
    }
    add(row.name);
    add(coreName(row.name));
    return keys;
  }
  function rivalsFor(row){
    var core = coreName(row.name);
    if(!core || core.indexOf(' ') >= 0) return [];
    var out = [];
    (MKT[row.ex] || []).forEach(function(p){
      if(rowTicker(p) === rowTicker(row)) return;
      var c = coreName(p.name);
      if(c && c !== core && c.indexOf(core + ' ') === 0) out.push(c);
    });
    return out;
  }
  function namedIn(text, keys, rivals){
    var hay = normChars(text);
    for(var i = 0; i < keys.length; i++){
      var re = new RegExp('(^| )' + escRe(keys[i].k) + '( |$)');
      if(!re.test(hay)) continue;
      if(keys[i].single && rivals.length){
        var blocked = false;
        for(var j = 0; j < rivals.length; j++){
          if(hay.indexOf(rivals[j]) >= 0){ blocked = true; break; }
        }
        if(blocked) continue;
      }
      return true;
    }
    return false;
  }
  function tsOf(it){
    if(isNum(it.ts)) return Number(it.ts) * 1000;
    if(it.date){ var d = Date.parse(it.date); if(!isNaN(d)) return d; }
    if(isNum(it.year)) return Date.UTC(Number(it.year), 0, 1);
    return 0;
  }
  function dateLabel(it){
    if(it.date) return nd(it.date);
    if(isNum(it.year)) return String(it.year);
    return 'NO DATE';
  }
  function drawNews(box, row){
    var nPath = sd(row.ex.toLowerCase() + '_news.json');
    var aPath = sd(row.ex.toLowerCase() + '_announcements.json');
    var newsFile = FILES[nPath] && FILES[nPath].ok ? FILES[nPath].data : null;
    var annFile = FILES[aPath] && FILES[aPath].ok ? FILES[aPath].data : null;
    var newsSt = readState(nPath), annSt = readState(aPath);
    var keys = keysFor(row), rivals = rivalsFor(row);
    var news = [], ann = [];
    if(newsFile){
      (newsFile.items || newsFile || []).forEach(function(it){
        if(!it) return;
        if(namedIn(String(it.title || '') + ' ' + String(it.summary || ''), keys, rivals)) news.push(it);
      });
    }
    if(annFile){
      (annFile.items || annFile || []).forEach(function(it){
        if(!it) return;
        if(namedIn(String(it.title || '') + ' ' + String(it.company || '') + ' ' +
                   String(it.ticker || ''), keys, rivals)) ann.push(it);
      });
    }
    news.sort(function(a, b){ return tsOf(b) - tsOf(a); });
    ann.sort(function(a, b){ return tsOf(b) - tsOf(a); });
    var all = news.map(function(x){ return {it:x, kind:'NEWS'}; })
                  .concat(ann.map(function(x){ return {it:x, kind:'ANN'}; }));
    if(!all.length){
      if(!newsFile && !annFile){
        var bad = [];
        if(newsSt === 'failed') bad.push('news not loaded');
        if(annSt === 'failed') bad.push('filings not loaded');
        if(bad.length){
          box.innerHTML = failBox('HEADLINE FILES', bad.join(', '));
          meta('news', 'FILES NOT READ');
        } else {
          box.innerHTML = empBox('NO HEADLINE FILE', 'none is shipped for ' + row.ex);
          meta('news', 'NO FILE');
        }
        return;
      }
      box.innerHTML = empBox('NO ITEM NAMES ' + rowTicker(row), 'headline and filing files read');
      meta('news', '0 HEADLINES');
      return;
    }
    var shown = all.slice(0, 6);
    box.innerHTML = shown.map(function(x){
      var it = x.it;
      var title = nd(it.title || '');
      var src = it.publisher || it.source || (x.kind === 'ANN' ? 'FILING' : row.ex);
      var inner = it.url
        ? '<a href="' + t(it.url) + '" target="_blank" rel="noopener">' + t(title) + '</a>'
        : t(title);
      return '<div class="ncard"><div class="nd"><span class="ndd">' + t(dateLabel(it)) + '</span>' +
        '<span class="nds">' + t(src) + '</span></div>' +
        '<div class="nt" title="' + t(title) + '">' + inner + '</div></div>';
    }).join('');
    var extra = all.length - shown.length;
    meta('news', all.length + ' ITEM' + (all.length === 1 ? '' : 'S') +
      (extra > 0 ? ' | ' + extra + ' MORE' : '') +
      ' | ' + news.length + ' HEADLINE' + (news.length === 1 ? '' : 'S'));
  }

  /* ---------- 6. LAWS AND EXPOSURE ----------------------------------- */
  function shortLaw(nm){
    var s = String(nm || '');
    s = s.replace(/\((?:No\.|Legal Notice)[^)]*\)/gi, '');
    s = s.replace(/,\s*(19|20)\d\d\s*$/g, '');
    s = s.replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim();
    return s.length > 26 ? s.slice(0, 25) + '.' : s;
  }
  function exposureHits(file, tkr){
    var hits = [];
    var map = (file && (file.sector_exposure || file.sectors)) || {};
    Object.keys(map).forEach(function(secName){
      var rec = map[secName] || {};
      ['direct','indirect'].forEach(function(kind){
        (rec[kind] || []).forEach(function(r){
          var tk = Array.isArray(r) ? r[0] : r.ticker;
          if(String(tk || '').toUpperCase() !== tkr) return;
          hits.push({sector:secName, code:rec.sector_code || '', kind:kind,
                     reason:(Array.isArray(r) ? r[1] : r.reason) || ''});
        });
      });
    });
    return hits;
  }
  function drawLaws(box, row, lawsFile, govFile, govJur){
    var h = '';
    var n = 0;
    var colours = {enacted:0, repealed:0, withdrawn:0};
    if(row.ex !== 'NSE'){
      h += '<span class="chip other">NO LAW FILE ' + t(row.ex) + '</span>';
      meta('law', 'NO LAW FILE');
    } else if(readState(sd('gov_laws_KE.json')) === 'failed' || !lawsFile){
      h += '<span class="chip other">LAW FILE NOT READ</span>';
      meta('law', 'FILE NOT READ');
    } else {
      var tk = rowTicker(row);
      var laws = (lawsFile.laws || []).filter(function(l){
        var list = (l.tickers || []).map(function(x){ return String(x).toUpperCase(); });
        return list.indexOf(tk) >= 0 || list.indexOf('ALL') >= 0;
      });
      laws.sort(function(a, b){
        var A = (a.tickers || []).map(function(x){ return String(x).toUpperCase(); }).indexOf(tk) >= 0 ? 0 : 1;
        var B = (b.tickers || []).map(function(x){ return String(x).toUpperCase(); }).indexOf(tk) >= 0 ? 0 : 1;
        if(A !== B) return A - B;
        return String(b.year || '').localeCompare(String(a.year || ''));
      });
      if(!laws.length) h += '<span class="chip other">NO ACT NAMES ' + t(tk) + '</span>';
      laws.forEach(function(l){
        var st = String(l.status || '').toLowerCase();
        var cl = (st === 'enacted' || st === 'repealed' || st === 'withdrawn') ? st : 'other';
        if(colours[cl] != null) colours[cl]++;
        var tip = [l.name || l.id || '', st || 'status not stated',
                   l.mechanism || '', l.status_note || ''].filter(Boolean).join(' | ');
        h += '<span class="chip ' + cl + '" title="' + t(tip) + '">' +
          (l.year ? '<i>' + t(l.year) + '</i>' : '') + t(shortLaw(l.name || l.id || '')) + '</span>';
        n++;
      });
      meta('law', n + ' ACTS | ' + colours.enacted + ' ENACTED ' + colours.withdrawn + ' WITHDRAWN ' +
        colours.repealed + ' REPEALED');
    }
    /* the government budget link, or one chip saying there is none */
    if(govJur){
      if(readState(sd('gov_exposure_' + govJur + '.json')) === 'failed' || !govFile){
        h += '<span class="chip other">EXPOSURE FILE NOT READ</span>';
      } else {
        var hits = exposureHits(govFile, rowTicker(row));
        if(!hits.length){
          h += '<span class="chip none">NO BUDGET LINK</span>';
        } else {
          hits.slice(0, 2).forEach(function(x){
            h += '<span class="chip gov' + (x.kind === 'indirect' ? ' ind' : '') +
              '" title="' + t(x.reason) + '">' + t(x.sector.toUpperCase()) + ' <b>' +
              t(x.kind.toUpperCase()) + '</b></span>';
          });
        }
      }
    } else {
      /* no budget file covers this exchange at all: the chip still reads as an
         absent link, and its hover says which file would have carried one */
      h += '<span class="chip none" title="no budget file covers ' + t(row.ex) +
        '; the fiscal link is recorded for NSE and JSE">NO BUDGET LINK</span>';
    }
    box.innerHTML = h;
  }

  /* ---------- the build ---------------------------------------------- */
  var GEN = 0, CUR = null;

  function finPath(row, key, kind){
    var base = '../../static_data/' + (kind === 'analytics' ? 'analytics/' : 'financials/');
    var name = encodeURIComponent(String(key).replace(/\//g, '_'));
    return base + name + (kind === 'analytics' ? '.json' : '__income.json');
  }
  function tryKeys(row){
    var keys = [String(row.ticker || '')];
    if(row.sym && String(row.sym).toUpperCase() !== String(row.ticker).toUpperCase()) keys.push(String(row.sym));
    if(row.ex === 'JSE' && String(row.ticker).indexOf('.') < 0) keys.push(String(row.ticker) + '.JO');
    var seen = {}, out = [];
    keys.forEach(function(k){ if(k && !seen[k]){ seen[k] = 1; out.push(k); } });
    return out;
  }
  function readFirst(row, kind){
    var keys = tryKeys(row);
    return (function step(i){
      if(i >= keys.length) return Promise.resolve(null);
      return getJSON(finPath(row, keys[i], kind)).then(function(d){
        if(d) return {d:d, key:keys[i]};
        return step(i + 1);
      });
    })(0);
  }

  function build(row){
    var gen = ++GEN;
    CUR = row;
    G.row = row;
    G.rec = null;
    G.selKey = '';
    G.last = null;
    RECBY = null;
    PAINT = {};
    PXSTATE = {mode:'none', points:0, bars:0};
    paintHead(row, null);
    document.getElementById('footNote').textContent = '';
    paintSel();

    var ex = row.ex;
    var J = {};
    J.info = getJSON(sd('company_info.json'));
    J.rel = getJSON(sd('relationships_' + ex + '.json'));
    /* all four boards are read, so a chain can cross an exchange board */
    J.rell = EXS.map(function(e2){ return getJSON(sd('relationships_' + e2 + '.json')); });
    J.thes = getJSON(sd('research_theses.json'));
    J.news = NEWS_EX[ex] ? getJSON(sd(ex.toLowerCase() + '_news.json')) : Promise.resolve(null);
    J.ann = ANN_EX[ex] ? getJSON(sd(ex.toLowerCase() + '_announcements.json')) : Promise.resolve(null);
    J.an = readFirst(row, 'analytics');
    J.hist = readHistory(row);
    if(ex === 'NSE'){
      J.gov = getJSON(sd('gov_exposure_KE.json'));
      J.laws = getJSON(sd('gov_laws_KE.json'));
    } else if(ex === 'JSE'){
      J.gov = getJSON(sd('gov_exposure_SA.json'));
    }

    Promise.all([J.info, J.rel, Promise.all(J.rell), J.thes, J.news, J.ann, J.an, J.hist,
                 J.gov || null, J.laws || null])
    .then(function(R){
      if(gen !== GEN) return;
      var info = R[0], relFile = R[1], thesFile = R[3], an = R[6], hist = R[7];
      var govFile = R[8], lawsFile = R[9];
      paintHead(row, info && (info[row.ticker] || info[ex + ':' + row.sym] || info[row.sym] || info[rowTicker(row)]));

      /* what each of the four link files actually returned, kept for the panel
         to print rather than assumed */
      EXS.forEach(function(e2){
        var p = sd('relationships_' + e2 + '.json');
        REL_ST[e2] = readState(p);
        RELF[e2] = (FILES[p] && FILES[p].ok && FILES[p].data) || null;
        REL[e2] = (RELF[e2] && RELF[e2].securities) || {};
      });
      RECBY = null;

      var relRec = null;
      if(relFile && relFile.securities){
        var s = relFile.securities;
        relRec = s[row.ticker] || s[row.sym] || s[rowTicker(row)] || null;
      }
      var histSt = hist ? readState(hist.path) : 'unread';

      guardDraw('strip', function(box){
        drawTiles(box, row, an && an.d, hist && hist.d, histSt);
      });
      guardDraw('rel', function(box){ drawRel(box, row, relFile, relRec); });
      guardDraw('thes', function(box){
        drawThesis(box, row, thesFile, readState(sd('research_theses.json')));
      });
      guardDraw('law', function(box){
        drawLaws(box, row, lawsFile, govFile, ex === 'NSE' ? 'KE' : (ex === 'JSE' ? 'SA' : ''));
      });
      guardDraw('news', function(box){ drawNews(box, row); });
      guardDraw('px', function(box){ drawPrice(box, row, hist && hist.d, hist && hist.path, histSt); });
      paintSel();

      var bits = [];
      if(relFile && relFile.generated) bits.push('LINKS ' + relFile.generated);
      if(thesFile && thesFile.generated) bits.push('THESIS ' + thesFile.generated);
      if(hist && hist.d && hist.d.realigned_at) bits.push('HIST ' + hist.d.realigned_at);
      document.getElementById('footNote').textContent = nd(bits.join('  '));
    }).catch(function(e){
      if(gen !== GEN) return;
      document.getElementById('b_rel').innerHTML =
        '<div class="fail"><b>PANEL FAILED</b> ' + t(String((e && e.message) || e)) + '</div>';
    });
  }

  function pick(row){
    if(!row) return;
    closeSug();
    var inp = document.getElementById('q');
    if(inp){ inp.value = rowTicker(row); }
    build(row);
  }

  /* ---------- wiring -------------------------------------------------- */
  wireGraphControls();
  var inp = document.getElementById('q');
  if(inp){
    inp.addEventListener('input', function(){ drawSug(inp.value); });
    inp.addEventListener('keydown', function(ev){
      var k = ev.key;
      if(k === 'Enter'){
        ev.preventDefault();
        var tok = String(inp.value || '').trim();
        if(!tok) return;
        if(SUG.on && SUG.rows.length){ pick(SUG.rows[SUG.i || 0]); return; }
        var exact = findRow(tok, null);
        if(exact){ pick(exact); return; }
        var first = rank(tok)[0];
        if(first){ pick(first); return; }
        var box = document.getElementById('sug');
        if(box){
          box.innerHTML = '<div class="sg none">NO SECURITY MATCHES "' + t(tok) + '"</div>';
          box.className = 'sug on';
        }
      } else if(k === 'ArrowDown' || k === 'ArrowUp'){
        if(!SUG.on || !SUG.rows.length) return;
        ev.preventDefault();
        var n = SUG.rows.length;
        SUG.i = (SUG.i + (k === 'ArrowDown' ? 1 : n - 1)) % n;
        Array.prototype.forEach.call(document.querySelectorAll('#sug .sg[data-i]'), function(el){
          el.className = 'sg' + (Number(el.getAttribute('data-i')) === SUG.i ? ' sel' : '');
        });
      } else if(k === 'Escape'){
        closeSug();
        inp.blur();
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(closeSug, 120); });
  }
  document.addEventListener('mousedown', function(ev){
    var box = document.getElementById('sug');
    if(box && ev.target !== inp && !box.contains(ev.target) && box.className.indexOf('on') >= 0){
      closeSug();
    }
  });

  /* the shell hands the selection over; adopting it means a panel opened from
     a watchlist click lands on that security, not on a default */
  window.__mtApplySelection = function(sel){
    if(!sel || !(sel.sym || sel.ticker)) return false;
    loadIndex().then(function(){
      var row = findRow(sel.sym || sel.ticker, sel.ex);
      if(row) pick(row);
    });
    return true;
  };
  window.addEventListener('message', function(ev){
    if(!ev || ev.origin !== location.origin) return;
    var d = ev.data;
    if(d && d.__mt === 'selection') window.__mtApplySelection(d);
  });
  function announceReady(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({__mt: 'sel-ready'}, location.origin);
      }
    }catch(e){}
  }

  /* the proof surface: what this panel believes, readable from the DOM */
  function textWords(){
    var txt = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
    return txt ? txt.split(' ').length : 0;
  }
  function selInfo(){
    var g = G.last, n = null, i;
    if(g && G.selKey){
      for(i = 0; i < g.nodes.length; i++){ if(g.nodes[i].key === G.selKey) n = g.nodes[i]; }
    }
    if(!n) return null;
    return {name:n.name, ticker:n.tk || 'UNLISTED', exchange:n.ex || 'NOT IN TERMINAL',
            hop:n.depth, link:(n.depth === 0 ? 'selected security' : typeLabel(n.types[0])),
            reason:n.reason || '', source:n.src || '', carriedRecord:!!n.rec};
  }
  window.__mtPerpState = function(){
    var tiles = Array.prototype.map.call(document.querySelectorAll('#b_strip .tile'), function(el){
      var l = el.querySelector('.tl'), v = el.querySelector('.tv'), s = el.querySelector('.ts');
      return {label: l ? l.textContent : '', value: v ? v.textContent : '', sub: s ? s.textContent : ''};
    });
    var chips = Array.prototype.map.call(document.querySelectorAll('#b_law .chip'), function(el){
      return {text: el.textContent.trim(), cls: el.className.replace('chip', '').trim()};
    });
    var g = G.last, hop1 = 0, hop2 = 0, e1 = 0, e2 = 0, cross = 0, crossEx = [];
    if(g){
      g.nodes.forEach(function(n){
        if(n.depth === 1) hop1++;
        if(n.depth === 2) hop2++;
        if(n.depth > 0 && n.ex && CUR && n.ex !== CUR.ex){
          cross++;
          crossEx.push(n.ex + ':' + (n.tk || '?'));
        }
      });
      g.edges.forEach(function(e){ if(e.depth === 1) e1++; else e2++; });
    }
    var sub = document.getElementById('gsub');
    var wq = document.getElementById('webq');
    return {
      ticker: CUR ? rowTicker(CUR) : '', ex: CUR ? CUR.ex : '', name: CUR ? nd(CUR.name || '') : '',
      tiles: tiles,
      graph: {
        hopMode: G.hops, cap: G.cap, truncated: g ? g.trunc : 0,
        nodes: g ? g.nodes.length : 0, edges: g ? g.edges.length : 0,
        hop1: hop1, hop2: hop2, edgesHop1: e1, edgesHop2: e2,
        crossExchange: cross, crossList: crossEx,
        domNodes: document.querySelectorAll('#b_rel .nd').length,
        /* the map draws bezier paths with an arrowhead, not straight lines */
        domEdges: document.querySelectorAll('#b_rel path.ge').length,
        domPaths: document.querySelectorAll('#b_rel svg path').length,
        bezierEdges: Array.prototype.filter.call(document.querySelectorAll('#b_rel path.ge'),
          function(p){ return String(p.getAttribute('d') || '').indexOf(' Q') > 0; }).length,
        arrowedEdges: Array.prototype.filter.call(document.querySelectorAll('#b_rel path.ge'),
          function(p){ return !!p.getAttribute('marker-end'); }).length,
        arrowheads: document.querySelectorAll('#b_rel svg marker').length,
        rings: g && g.geo ? g.geo.rings : [],
        centreRadius: g && g.geo ? g.geo.rCtr : 0,
        leafRadius: g && g.geo ? g.geo.r1 : 0,
        zoom: {k: Math.round(MAP.k * 1000) / 1000, x: Math.round(MAP.x), y: Math.round(MAP.y)},
        hoverDim: document.querySelectorAll('#b_rel path.ge.dim').length,
        hoverHi: document.querySelectorAll('#b_rel path.ge.hi').length,
        pinned: G.selKey,
        legendRows: Array.prototype.map.call(document.querySelectorAll('#b_rel .gleg .lgr'),
          function(el){ return el.textContent.replace(/\s+/g, ' ').trim(); }),
        legendTotals: Array.prototype.map.call(document.querySelectorAll('#b_rel .gleg .lgf'),
          function(el){ return el.textContent.replace(/\s+/g, ' ').trim(); }),
        mapControls: document.querySelectorAll('#c_rel .kn').length,
        files: EXS.map(function(ex){ return {ex: ex, state: REL_ST[ex] || 'unread'}; }),
        sub: sub ? sub.textContent : '',
        types: relTypes().filter(function(tp){ return G.types[tp.k]; })
                        .map(function(tp){ return tp.k; })
      },
      sel: selInfo(),
      thes: {state: TH.st, theme: TH.theme, marked: TH.marked,
             rows: document.querySelectorAll('#b_thes .tr').length,
             hits: document.querySelectorAll('#b_thes .tr.hit').length,
             text: (document.getElementById('b_thes') || {}).textContent || ''},
      removed: {revenuePanel: !document.getElementById('c_fin'),
                revenueBox: !document.getElementById('b_fin'),
                ownershipPanel: !document.getElementById('c_own'),
                ownershipBox: !document.getElementById('b_own')},
      px: {mode: PXSTATE.mode, points: PXSTATE.points, bars: PXSTATE.bars},
      news: {cards: document.querySelectorAll('#b_news .ncard').length},
      laws: {chips: chips},
      inputs: document.querySelectorAll('input').length,
      enabledInputs: document.querySelectorAll('input:not([disabled])').length,
      buttons: document.querySelectorAll('button').length,
      webq: wq ? {disabled: !!wq.disabled, placeholder: wq.placeholder} : null,
      words: textWords()
    };
  };

  /* boot */
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      /* open on a security of the exchange the shell shows that carries a
         relationship record, so the first screen is a dossier not an empty frame */
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
