<!--
  mx_perplexity.html - PERPLEXITY: one security at the centre of its relationships.

  The map is radial, and it draws on load, before any Act is chosen:

    CENTRE        a disc holding the ticker, with the company name, the board,
                  the last price and the percent change beneath it.
    RING 1        one circle per record that names the centre: customers,
                  suppliers, competitors, partners, substantial holders and the
                  Acts that name the security. Radius 5 against the centre's 24,
                  so the centre reads as five times a leaf.
    RING 2        one circle per company one recorded link past a ring 1 company,
                  radius 4. Only drawn out when DEPTH is set to 2 HOPS.
    LINKS         every link is a quadratic bezier from the edge of one node to
                  the edge of the next, with an arrowhead marker per link type.
                  Ring 1 leaves are fed from the centre; ring 2 leaves are fed
                  from the ring 1 company the record was read from.

  Both rings are faint dashed ellipses, labelled RING 1 and RING 2 at the left
  apex, where a wedge is kept clear so a label can never sit on a node. Nodes are
  spaced by arc length, so the gap between neighbours is even all the way round.

  The chip row (CUST, SUPP, COMP, PART, HOLDERS, LAWS) selects a category. The
  chip names the category and its count at the head of NODE DETAIL, marks that
  category's leaves with a halo, and lets the rest of the map recede - nothing is
  filtered off it, so the header counts always describe everything drawn.
  A category with no record on file says so, plainly, in the same pane.

  What each category reads, and nothing else:

    CUSTOMERS   relationships_<EX>.json, the customers array
    SUPPLIERS   the same file, suppliers
    COMPETITORS the same file, competitors
    PARTNERS    the same file, partners
    HOLDERS     shareholders_<EX>.json, the substantial holder table
    LAWS        gov_laws_KE.json: the Acts whose own ticker list or own sector
                list names this security. Every Act is shown WITH THE EXACT
                CLAUSE that does the thing: the section of the amending Act
                and, where it rewrites another statute, the provision of that
                statute as it now reads. The citations were read from the
                Acts' own text; an instrument with no enacted text to cite
                prints CLAUSE NOT ON FILE and why, never a guessed number.
    2 LINKS     one recorded link past a ring 1 company, only at depth 2

  All four exchange relationship files are read, so a link can cross a board.

  Policy behaviour kept: choose an Act and it marks the companies it names
  directly, the companies one recorded link away, and the companies two links
  away, and dims the rest. The marking is an amber halo around a leaf, and the
  Act line above the map counts what it reached.

  Rules this file keeps:
    * no peer set is generated and nothing is inferred from a sector label on
      the map: a link is drawn only where a record names it;
    * a leaf label that would collide is prevented by spacing, and the geometry
      is measured on every draw;
    * every population the ring cannot hold is counted as dropped on the header,
      never silently;
    * every block draws inside a guard, so one broken read blanks one block;
    * pan, zoom, reset, node detail and hover highlighting stay;
    * one line states what this shows and what it does not claim.

  VIEW: MAP or 3D. The turned view draws the SAME model - the same nodes, the
  same recorded links, the same colours and the same Act marking - on a canvas,
  with each category given its own cone of directions so six clusters that have
  to share one circle on the flat map get a cone each. Depth separates the
  clusters and carries no quantity. The flat ring can only hold the nodes its
  circumference has room for and counts the rest as dropped; the sphere has
  room for all of them, so the 3D pass skips that clipping and the header says
  so. Drag to turn, wheel to zoom, SPIN, RESET, and a click pins a node into
  NODE DETAIL exactly as on the flat map. One projection, painter's algorithm,
  no WebGL and no library. __mtPerpState().view3 reports the angle and where
  every node landed on screen, so the turned view can be checked, not trusted.

  Vanilla JS, single file, no build step. Mint on black, Oxygen Mono.
-->

<meta charset="utf-8">

<style>
  html{color-scheme:dark;scrollbar-width:none;}

  :root{
    --bg:#121212;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;

  }
  *{box-sizing:border-box}
  /* the shell gives every panel a window, so this panel draws no frame */
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:12px;
       padding:0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;
       height:100vh;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;border:0;background:transparent;
        max-width:none;margin:0;border-radius:0}

  /* ---------- search and the Act selector ---------- */
  .controls{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px;
            border-bottom:1px solid var(--line2);flex:0 0 auto;flex-wrap:wrap;min-width:0}
  .controls .cl2{font-size:7px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;
                 white-space:nowrap;flex:0 0 auto}
  input.qin{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
            padding:4px 8px;font-family:var(--mono);font-size:11px;width:210px;
            text-transform:uppercase;min-width:0}
  input.qin:focus{outline:0;border-color:var(--acc)}
  select.psel{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
              padding:4px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
              max-width:400px;min-width:0;cursor:pointer}

  .sug{position:absolute;left:12px;top:100%;width:400px;max-height:250px;overflow:auto;
       background:var(--bg3);border:1px solid var(--line2);border-top:0;z-index:60;display:none}
  .sug.on{display:block}
  .sg{display:flex;align-items:baseline;gap:8px;padding:4px 8px;cursor:pointer;border-top:1px solid var(--line)}
  .sg:first-child{border-top:0}
  .sg.sel{background:var(--bg4)}
  .sg .tk{color:var(--acc);font-weight:700;min-width:62px}
  .sg .nm{color:var(--tx2);font-family:var(--ui);font-size:10.5px;flex:1;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .sg .ex{color:var(--tx3);font-size:8px;letter-spacing:.06em}
  .sg.none{color:var(--tx3);font-size:10px;cursor:default}

  /* ---------- the map and the detail of the node the reader pinned -------- */
  /* THE READER SETS THE PROPORTIONS. The map, the node detail and the law list are
     all useful at different sizes depending on what is being read, so the two
     internal dividers are draggable and the sizes survive a reload. */
  .grid{flex:1 1 auto;min-height:0;display:grid;gap:1px;background:var(--line2);padding:1px;
        grid-template-columns:minmax(0,1fr) 5px var(--perpw,288px);
        grid-template-rows:minmax(0,1fr) 5px var(--perph,224px)}
  #c_rel{grid-column:1;grid-row:1}
  #c_sel{grid-column:3;grid-row:1 / span 3}
  #c_law{grid-column:1;grid-row:3;min-height:0}
  .sp{background:transparent;position:relative;z-index:3}
  .sp:hover,.sp.dragging{background:rgba(51,226,154,.34)}
  .sp::after{content:'';position:absolute;inset:0;background:transparent}
  /* the dividers own the 5px tracks between the panes; without explicit placement
     they auto-flow into the first free cell and land on top of the map */
  #sp_v{grid-column:2;grid-row:1 / span 3;cursor:col-resize}
  #sp_h{grid-column:1;grid-row:2;cursor:row-resize}
  .sp:hover::after{content:'';position:absolute;inset:0;
    box-shadow:0 0 0 1px rgba(51,226,154,.5)}

        position:relative}
  /* THE CONTROL BAR WRAPS. Depth, seven link chips, the view buttons and the
     counts were held on one line that never had room for them, so the LAWS

      flex:0 0 auto;min-width:0;flex-wrap:wrap;row-gap:4px}
  .ch .cm{margin-left:auto}
  .cl{font-size:7.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;font-weight:600;
      white-space:nowrap}

    border-bottom:1px solid rgba(255,255,255,0.05);align-items:baseline}

  .lawrow .lh{display:flex;align-items:baseline;gap:6px;min-width:0}
  .lawrow .lc{font-size:8px;letter-spacing:.1em;color:var(--tx2);white-space:nowrap}
  .lawrow .ly{font-size:7.5px;color:var(--tx3)}
  .lawrow .lm{font-size:7.5px;line-height:1.45;color:var(--tx3);margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lawrow .dir{font-size:7.5px;letter-spacing:.1em;white-space:nowrap;padding:1px 5px;border:1px solid}
  .lawrow .dir.neg{color:#f87171;border-color:rgba(248,113,113,.45)}
  .lawrow .dir.pos{color:#33e29a;border-color:rgba(51,226,154,.45)}
  .lawrow .dir.mix{color:#e0a340;border-color:rgba(224,163,65,.45)}
  .lawrow .dir.uns{color:var(--tx3);border-color:rgba(255,255,255,.18)}
  .lawrow.st-repealed .lc{color:var(--tx3);text-decoration:line-through}
  /* prose off: a map does not explain itself, and a control that calls nothing
     is not a control. Both stay in the markup so nothing that writes to them
     breaks, and neither is drawn. */
  #claim, #sbar{display:none !important}
  .lawrow .lcl{font-size:7.5px;line-height:1.5;color:var(--warn);margin-top:3px;
               border-left:2px solid rgba(224,163,65,.5);padding-left:6px}
  .lawrow .lcl b{color:var(--tx);font-weight:700}
  .lawrow .lcl .nocl{color:var(--tx3)}
  .lawbasis{font-size:7px;letter-spacing:.06em;color:var(--tx3);padding:5px 8px;line-height:1.5;
    border-top:1px solid var(--line);background:var(--bg)}
  .lawempty{font-size:8px;color:var(--tx3);padding:9px 8px;line-height:1.5}
  .cm{margin-left:auto;font-size:7.5px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cb{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
  .cgrp{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap;row-gap:3px}
  .cgrp .cl2{font-size:6.5px}
  button.kn{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--tx3);background:#0a0a0a;border:1px solid var(--line2);border-radius:2px;
            padding:3px 6px;cursor:pointer;line-height:1.1;white-space:nowrap}
  button.kn:hover{color:var(--tx2);border-color:#3a3a3a}
  button.kn[aria-pressed="true"]{color:#04120c;background:var(--acc);border-color:var(--acc);
                                 font-weight:700}
  /* THE CHIP ROW IS THE LEGEND. Each chip carries a dot in its category's own
     colour, which is the colour that category's leaves take on the map, so the
     reader never has to guess which dot is a supplier and which a competitor,
     and the map needs no separate legend taking up its height. */
  button.kn.ft::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
                       margin-right:5px;vertical-align:middle;background:currentColor;opacity:.95}
  button.kn.ft[data-t="customers"]{color:#33e29a}
  button.kn.ft[data-t="suppliers"]{color:#58a6ff}
  button.kn.ft[data-t="competitors"]{color:#f87171}
  button.kn.ft[data-t="partners"]{color:#e0a340}
  button.kn.ft[data-t="peers"]{color:#8a8a8a}
  button.kn.ft[data-t="holders"]{color:#c48bf7}
  button.kn.ft[data-t="laws"]{color:#f5c542}
  button.kn.ft[aria-pressed="true"]{color:#06130d}
  button.kn.ft[data-t="customers"][aria-pressed="true"]{background:#33e29a;border-color:#33e29a}
  button.kn.ft[data-t="suppliers"][aria-pressed="true"]{background:#58a6ff;border-color:#58a6ff}
  button.kn.ft[data-t="competitors"][aria-pressed="true"]{background:#f87171;border-color:#f87171}
  button.kn.ft[data-t="partners"][aria-pressed="true"]{background:#e0a340;border-color:#e0a340}
  button.kn.ft[data-t="peers"][aria-pressed="true"]{background:#8a8a8a;border-color:#8a8a8a}
  button.kn.ft[data-t="holders"][aria-pressed="true"]{background:#c48bf7;border-color:#c48bf7}
  button.kn.ft[data-t="laws"][aria-pressed="true"]{background:#f5c542;border-color:#f5c542}
  button.kn:focus-visible{outline:1px solid var(--acc)}
  button.kn.z{width:18px;padding:2px 0;text-align:center}
  .zk{font-size:7px;color:var(--tx3);letter-spacing:.04em;min-width:27px;text-align:right}

  /* the Act line: what is chosen, what it does mechanically, what it reaches */
  .actbar{flex:0 0 auto;border-bottom:1px solid var(--line);padding:3px 9px 4px;
          display:flex;flex-direction:column;gap:1px;min-width:0}
  .abrow{display:flex;gap:8px;align-items:baseline;min-width:0}
  .abhead{font-size:8px;letter-spacing:.08em;color:var(--warn);font-weight:700;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .abstat{font-size:6.5px;letter-spacing:.10em;color:var(--tx3);border:1px solid var(--line2);
          padding:0 3px;border-radius:2px;white-space:nowrap;flex:0 0 auto}
  .abmech{font-size:7.5px;color:var(--tx2);line-height:1.3;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;min-width:0}
  .abtr{display:flex;flex-wrap:wrap;gap:7px;font-size:7.5px;letter-spacing:.05em;color:var(--tx3);
        line-height:1.3}
  .abtr b{color:var(--warn);font-weight:700}
  .abtr .no{color:var(--warn);font-weight:700;letter-spacing:.06em}
  .abtr .q{color:var(--tx2)}

  /* the radial map: one centre disc, two dashed ellipse rings with their
     labels at the left apex, leaf circles on those rings and one quadratic
     bezier per link, each type with its own arrowhead */
  .gwrap{position:absolute;inset:0;overflow:hidden;user-select:none}
  .gwrap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .gwrap svg.drag{cursor:grabbing}
  .gwrap canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .gwrap canvas.drag{cursor:grabbing}
  .gsub{position:absolute;left:0;right:0;bottom:0;padding:2px 9px 4px;font-size:7px;
        letter-spacing:.06em;color:#7a7a7a;text-transform:uppercase;background:rgba(0,0,0,.82);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gsub b{color:var(--down);font-weight:700}
  ellipse.ring{fill:none;stroke:#3c3c3c;stroke-width:.9;stroke-dasharray:3.4 4.4}
  ellipse.ring.r2{stroke:#2b2b2b}
  text.rl{font-family:var(--mono);font-size:8px;letter-spacing:.15em;fill:#8a8a8a}
  text.rn{font-family:var(--mono);font-size:7.2px;letter-spacing:.04em;fill:#616161}
  path.eg{fill:none;stroke-width:1.05;stroke-opacity:.8}
  path.eg.h2{stroke-opacity:.55;stroke-dasharray:2.6 2.6}
  path.eg.law{stroke-dasharray:3.2 2.4}
  path.eg.hv{stroke-opacity:1;stroke-width:1.5}
  path.eg.dim{stroke-opacity:.09}
  circle.lf{fill:#080808;stroke-width:1.3}
  circle.lf.h2{stroke-width:1.1;fill:#060606}
  g.nd{pointer-events:all;cursor:pointer}
  g.nd text.nl{font-family:var(--mono);font-size:7px;letter-spacing:.03em;fill:#b4b4b4;
               text-anchor:middle}
  /* RADIAL MINT: a label sits beside its node, anchored out on whichever side it
     falls, so the full name is readable instead of a 10-character stub */
  g.nd text.nl.a-l{text-anchor:end}
  g.nd text.nl.a-r{text-anchor:start}
  line.ldr{stroke-width:.7;stroke-opacity:.42}
  g.nd.hv text.nl,g.nd.on text.nl,g.nd.cat-on text.nl{fill:#f0f0f0}
  g.nd.on circle.lf{stroke-width:2.4}
  g.nd.cat-on circle.lf{stroke-width:2.2}
  g.nd.rcd{opacity:.36}
  g.nd.offn{opacity:.42}
  circle.ch{fill:none;stroke-width:1.15;stroke-opacity:.9}
  path.eg.rcd{stroke-opacity:.12}
  circle.hl{fill:none;stroke:#e0a340;stroke-width:1.1}
  circle.hl.hop1{stroke-opacity:.6;stroke-dasharray:2 2}
  circle.hl.hop2{stroke-opacity:.34;stroke-dasharray:1.6 2.4}
  /* the centre disc */
  circle.cdc{fill:#070707;stroke:#33e29a;stroke-width:1.4}
  text.ctk{font-family:var(--mono);font-weight:700;fill:#33e29a;letter-spacing:.06em;
           text-anchor:middle}
  /* the centre's caption sits where the links fan out, so it is given a dark
     outline painted UNDER the glyphs: the name stays readable over a line
     without a box being drawn around it */
  text.cnm,text.cpx{paint-order:stroke;stroke:#0a0a0a;stroke-width:2.6px;stroke-linejoin:round}
  text.cnm{font-family:var(--mono);font-size:8.6px;fill:#e8e8e8;text-anchor:middle}
  text.cpx{font-family:var(--mono);font-size:6.9px;letter-spacing:.06em;fill:#8a8a8a;
           text-anchor:middle}

  text.notread{font-family:var(--mono);font-size:6.6px;letter-spacing:.04em;fill:#f87171}

         border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto}

  .crow .rnm{font-size:9px;font-family:var(--ui);color:var(--tx);flex:1 1 auto;min-width:0;

        border-top:1px solid var(--line2);flex:0 0 auto;min-width:0}
  .sbar .sl{font-size:7px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap}
  .sbar input.wq{flex:1 1 auto;min-width:0;max-width:520px;background:#0a0a0a;color:var(--tx3);
                 border:1px dashed var(--line2);border-radius:2px;padding:3px 8px;
                 font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;cursor:not-allowed}
  .sbar input.wq::placeholder{color:#5a5a5a}
  .sbar .sn{font-size:7.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;align-items:center;gap:10px;padding:2px 12px;background:var(--bg2);
        border-top:1px solid var(--line2);color:var(--tx3);font-size:7.5px;letter-spacing:.08em;
        flex:0 0 auto;min-width:0}
  .foot .sp{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<body>
<div class="wrap" id="panel">

  <div class="controls">
    <span class="cl2">COMPANY</span>
    <input class="qin" id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="centre company: ticker or name" aria-label="centre company: ticker or name">
    <span class="cl2">ACT</span>
    <select class="psel" id="pol" aria-label="Act to trace through the map"></select>
    <span class="hint">PICK THE CENTRE, THEN THE ACT</span>
    <div class="sug" id="sug"></div>
  </div>

  <div class="grid">
    <div class="sp" id="sp_h" role="separator" aria-orientation="horizontal"
         title="drag to resize the map against the law list; double-click to reset"></div>
    <div class="sp" id="sp_v" role="separator" aria-orientation="vertical"
         title="drag to resize the map against node detail; double-click to reset"></div>
    <div class="card" id="c_rel">
      <div class="ch">
        <span class="cl">RELATIONSHIP MAP</span>
        <div class="cgrp" id="c_hop">
          <span class="cl2">DEPTH</span>
          <button class="kn hp" type="button" data-hop="1" aria-pressed="true">1 HOP</button>
          <button class="kn hp" type="button" data-hop="2" aria-pressed="false">2 HOPS</button>
        </div>
        <div class="cgrp" id="c_type">
          <span class="cl2">LINKS</span>
          <button class="kn ft" type="button" data-t="customers" aria-pressed="false">CUST</button>
          <button class="kn ft" type="button" data-t="suppliers" aria-pressed="false">SUPP</button>
          <button class="kn ft" type="button" data-t="competitors" aria-pressed="false">COMP</button>
          <button class="kn ft" type="button" data-t="peers" aria-pressed="false" title="same-sector listings on the same board - peers, not competitors">PEER</button>
          <button class="kn ft" type="button" data-t="partners" aria-pressed="false">PART</button>
          <button class="kn ft" type="button" data-t="holders" aria-pressed="false">HOLDERS</button>
          <button class="kn ft" type="button" data-t="laws" aria-pressed="false">LAWS</button>
        </div>
        <div class="cgrp" id="c_view">
          <span class="cl2">VIEW</span>
          <button class="kn vw" type="button" data-view="map" aria-pressed="true"
                  title="the flat radial map">MAP</button>
          <button class="kn vw" type="button" data-view="3d" aria-pressed="false"
                  title="the same nodes and the same links, turned: drag to rotate, wheel to zoom">3D</button>
          <button class="kn" type="button" id="spin3" style="display:none"
                  title="turn it continuously" aria-pressed="false">SPIN</button>
          <button class="kn z" type="button" id="zout" title="zoom out" aria-label="zoom out">-</button>
          <span class="zk" id="zk">1.0x</span>
          <button class="kn z" type="button" id="zin" title="zoom in" aria-label="zoom in">+</button>
          <button class="kn" type="button" id="zrst" title="reset pan and zoom">RESET</button>
        </div>
        <span class="cm" id="m_rel"></span>
      </div>
      <div class="actbar" id="actbar"></div>
      <div class="cb" id="b_rel"></div>
      <div class="claim" id="claim">This map shows which companies an Act reaches and how far that
        reach travels through recorded links; it is not a price prediction.</div>
    </div>
    <div class="card" id="c_sel">
      <div class="ch"><span class="cl">NODE DETAIL</span><span class="cm" id="m_sel"></span></div>
      <div class="cb" id="b_sel"></div>
    </div>
    <div class="card" id="c_law">
      <div class="ch"><span class="cl">LAWS ON THIS SECURITY</span><span class="cm" id="m_law"></span></div>
      <div class="cb lawbox" id="b_law"></div>
    </div>
  </div>

  <!-- Live web research is NOT wired in. The shell publishes window.MUTXRI_API_BASE
       and uses it for auth and quotes only: there is no search or research endpoint
       in financials_api.py, indices_api.py or auth_api.py, and no key is shipped to
       the browser. So this field is a statement, not a control: it is disabled, it
       takes no keystrokes and it calls nothing. -->
  <div class="sbar" id="sbar">
    <span class="sl">WEB RESEARCH</span>
    <input class="wq" id="webq" type="text" disabled aria-disabled="true"
           placeholder="live web research is not wired into the terminal yet"
           title="no search endpoint and no key are shipped to this page; nothing is fetched">
    <span class="sn">this panel shows what is held on disk</span>
  </div>

  <div class="foot">
    <span id="footTk">-</span>
    <span class="sp" id="footNote"></span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var Q = new URLSearchParams(location.search);
  var EXS = ['NSE','JSE','NGX','EGX'];
  var DASH = '-';
  var UP = '#33e29a', DN = '#f87171', BLUE = '#1ecfb0', GREY = '#8a8a8a', ORANGE = '#e0a340';
  var AMB = '#e0a340';
  var SEC_TITLE = {rel:'RELATIONSHIP MAP', sel:'NODE DETAIL'};

  /* ---------- text, numbers ------------------------------------------ */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* the product prints no em dash and no en dash, including when the dash
     arrives inside a recorded sentence */
  function nd(s){ return String(s == null ? '' : s).replace(/[\u2013\u2014]/g, '-'); }
  function t(s){ return esc(nd(s)); }
  function isNum(v){ return v !== null && v !== undefined && v !== '' && !isNaN(Number(v)); }
  function numv(v){ return isNum(v) ? Number(v) : null; }
  function cut(s, n){
    var x = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    return x.length > n ? x.slice(0, n - 2).replace(/[,\s]+$/, '') + '..' : x;
  }
  function fmtP(v){
    var n = numv(v);
    if(n == null) return DASH;
    if(Math.abs(n) >= 1000){
      return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    return n.toFixed(2);
  }
  function fmtBig(v){
    var n = numv(v);
    if(n == null) return DASH;
    var s = n < 0 ? '-' : '';
    n = Math.abs(n);
    if(n >= 1e9) return s + (n / 1e9).toFixed(1) + 'B';
    if(n >= 1e6) return s + (n / 1e6).toFixed(1) + 'M';
    if(n >= 1e3) return s + (n / 1e3).toFixed(1) + 'K';
    return s + n.toFixed(0);
  }
  function fmtPct(p){
    var n = numv(p);
    if(n == null) return DASH;
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function uniq(a){
    var o = {}, out = [];
    a.forEach(function(x){ if(!o[x]){ o[x] = 1; out.push(x); } });
    return out;
  }

  /* ---------- file reads, with the read state kept -------------------- */
  var FILES = {};
  function getJSON(path){
    if(FILES[path]) return FILES[path].p;
    var rec = {ok:false, data:null, err:''};
    rec.p = fetch(path, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){ rec.ok = true; rec.data = d; return d; })
      .catch(function(e){ rec.err = nd(String((e && e.message) || e)); return null; });
    FILES[path] = rec;
    return rec.p;
  }
  function readState(path){
    var r = FILES[path];
    if(!r) return 'unread';
    return r.ok ? 'ok' : 'failed';
  }
  function readErr(path){
    var r = FILES[path];
    return (r && r.err) ? r.err : 'not loaded';
  }
  /* a quiet probe: one series can sit under more than one key, and a miss is
     not a failure of the panel, so nothing is recorded about it */
  function probeJSON(paths){
    function step(i){
      if(i >= paths.length) return Promise.resolve(null);
      return fetch(paths[i], {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(d){ return {path:paths[i], data:d}; })
        .catch(function(){ return step(i + 1); });
    }
    return step(0);
  }
  function sd(p){ return '../../static_data/' + p; }

  /* ---------- market index: every exchange, one list ------------------ */
  var MKT = {}, IDX = [], IDX_P = null;
  function loadIndex(){
    if(IDX_P) return IDX_P;
    IDX_P = Promise.all(EXS.map(function(ex){
      return getJSON(sd('market_' + ex + '.json')).then(function(d){
        var rows = (d && d.stocks) || [];
        rows.forEach(function(r){ r.ex = ex; });
        MKT[ex] = rows;
        return rows;
      });
    })).then(function(){
      IDX = [];
      EXS.forEach(function(ex){ (MKT[ex] || []).forEach(function(r){ IDX.push(r); }); });
      return IDX;
    });
    return IDX_P;
  }
  function findRow(tk, exHint){
    var q = String(tk == null ? '' : tk).trim().toUpperCase();
    if(!q) return null;
    var e = exHint ? String(exHint).toUpperCase() : '';
    var pool = IDX.slice();
    if(e) pool.sort(function(a, b){ return (a.ex === e ? 0 : 1) - (b.ex === e ? 0 : 1); });
    var i;
    for(i = 0; i < pool.length; i++) if(String(pool[i].ticker || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].sym || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].name || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].name || '').toUpperCase().indexOf(q) >= 0) return pool[i];
    }
    return null;
  }
  function rowTicker(r){ return String((r && (r.ticker || r.sym)) || '').toUpperCase(); }

  /* ---------- name normalising --------------------------------------- */
  var SUFFIX = {plc:1, ltd:1, limited:1, group:1, holdings:1, holding:1, company:1, co:1,
                inc:1, corp:1, corporation:1, sa:1, nv:1, ag:1, the:1, public:1, 'and':1};
  function normChars(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function coreName(s){
    return normChars(s).split(' ').filter(function(w){ return w && !SUFFIX[w]; }).join(' ');
  }

  /* ---------- the search box: one input, ticker first then name ------- */
  var SUG = {rows:[], i:0, on:false};
  function rank(q){
    var s = String(q || '').trim().toUpperCase();
    if(!s) return [];
    function pass(needle){
      var out = [];
      for(var i = 0; i < IDX.length; i++){
        var r = IDX[i];
        var tk = String(r.ticker || '').toUpperCase();
        var sy = String(r.sym || '').toUpperCase();
        var nm = String(r.name || '').toUpperCase();
        var sc = -1;
        if(tk === needle || sy === needle) sc = 0;
        else if(tk.indexOf(needle) === 0) sc = 1;
        else if(sy.indexOf(needle) === 0) sc = 2;
        else if(nm.indexOf(needle) === 0) sc = 3;
        else if(tk.indexOf(needle) > 0) sc = 4;
        else if(nm.indexOf(needle) > 0) sc = 5;
        if(sc >= 0) out.push({r:r, sc:sc, len:tk.length});
      }
      out.sort(function(a, b){
        if(a.sc !== b.sc) return a.sc - b.sc;
        if(a.len !== b.len) return a.len - b.len;
        return String(a.r.ticker).localeCompare(String(b.r.ticker));
      });
      return out;
    }
    var hits = pass(s);
    if(!hits.length && s.indexOf(' ') > 0) hits = pass(s.split(/\s+/)[0]);
    return hits.slice(0, 12).map(function(x){ return x.r; });
  }
  function drawSug(q){
    var box = document.getElementById('sug');
    if(!box) return;
    SUG.rows = rank(q);
    SUG.i = 0;
    if(!String(q || '').trim()){ box.className = 'sug'; box.innerHTML = ''; SUG.on = false; return; }
    var h;
    if(!SUG.rows.length){
      h = '<div class="sg none">NO SECURITY MATCHES "' + t(q) + '"</div>';
      SUG.on = false;
    } else {
      h = SUG.rows.map(function(r, i){
        return '<div class="sg' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' +
               '<span class="tk">' + t(rowTicker(r)) + '</span>' +
               '<span class="nm">' + t(r.name || '') + '</span>' +
               '<span class="ex">' + t(r.ex || '') + '</span></div>';
      }).join('');
      SUG.on = true;
    }
    box.innerHTML = h;
    box.className = 'sug on';
    Array.prototype.forEach.call(box.querySelectorAll('.sg[data-i]'), function(el){
      el.addEventListener('mousedown', function(ev){
        ev.preventDefault();
        var k = Number(el.getAttribute('data-i'));
        if(SUG.rows[k]) pick(SUG.rows[k]);
      });
    });
  }
  function closeSug(){
    var box = document.getElementById('sug');
    if(box){ box.className = 'sug'; box.innerHTML = ''; }
    SUG.on = false;
  }

  /* ---------- guards and meta ----------------------------------------- */
  function guardDraw(key, fn){
    var box = document.getElementById('b_' + key);
    if(!box) return;
    try{
      fn(box);
    }catch(e){
      box.innerHTML = '<div class="fail"><b>' + SEC_TITLE[key] + ' FAILED</b> ' +
        t(String((e && e.message) || e)) + '</div>';
      meta(key, 'FAILED');
    }
  }
  function meta(key, s){
    var m = document.getElementById('m_' + key);
    if(m) m.textContent = nd(s || '');
  }
  function failBox(what, why){
    return '<div class="fail"><b>' + t(what) + ' NOT READ</b> ' + t(why) + '</div>';
  }

  /* ---------- the reader sets the internal proportions ---------------------
     Two dividers inside the panel: one between the map and node detail, one
     between the map and the law list. Sizes are written to a CSS variable on the
     grid, so the map's own ResizeObserver redraws at the new geometry, and they
     are remembered per browser. A double-click on either divider restores the
     shipped proportions without losing anything else the reader has set. */
  (function(){
    var grid = document.querySelector('.grid');
    if(!grid) return;
    var KEY = 'mt_perp_dims_v1';
    var DEF = {w:288, h:224};
    function read(){
      try{
        var o = JSON.parse(localStorage.getItem(KEY) || '{}');
        return {w:(o && isFinite(o.w)) ? Number(o.w) : DEF.w,
                h:(o && isFinite(o.h)) ? Number(o.h) : DEF.h};
      }catch(e){ return {w:DEF.w, h:DEF.h}; }
    }
    function write(d){
      try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
    }
    function apply(d){
      grid.style.setProperty('--perpw', Math.round(d.w) + 'px');
      grid.style.setProperty('--perph', Math.round(d.h) + 'px');
    }
    var D = read();
    apply(D);

    function clampW(v, rect){
      /* never let a divider swallow a pane: the map keeps 240px, the detail 180px */
      return Math.max(180, Math.min(rect.width - 246, v));
    }
    function clampH(v, rect){
      return Math.max(84, Math.min(rect.height - 190, v));
    }
    function attach(el, vertical){
      if(!el) return;
      el.addEventListener('mousedown', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        el.classList.add('dragging');
        document.body.style.userSelect = 'none';
        var rect = grid.getBoundingClientRect();
        function move(e){
          if(vertical){
            D.w = clampW(rect.right - e.clientX - 2, rect);
          }else{
            D.h = clampH(rect.bottom - e.clientY - 2, rect);
          }
          apply(D);
        }
        function up(){
          el.classList.remove('dragging');
          document.body.style.userSelect = '';
          window.removeEventListener('mousemove', move, true);
          window.removeEventListener('mouseup', up, true);
          write(D);
          try{ Object.keys(PAINT).forEach(function(k){ PAINT[k](); }); }catch(e){}
        }
        window.addEventListener('mousemove', move, true);
        window.addEventListener('mouseup', up, true);
      });
      el.addEventListener('dblclick', function(ev){
        ev.preventDefault();
        D = {w:DEF.w, h:DEF.h};
        apply(D); write(D);
        try{ Object.keys(PAINT).forEach(function(k){ PAINT[k](); }); }catch(e){}
      });
    }
    attach(document.getElementById('sp_v'), true);
    attach(document.getElementById('sp_h'), false);
    window.__perpDims = function(){ return {w:D.w, h:D.h}; };
  })();

  var PAINT = {};
  var RT = null;
  window.addEventListener('resize', function(){
    clearTimeout(RT);
    RT = setTimeout(function(){
      Object.keys(PAINT).forEach(function(k){
        try{ PAINT[k](); }catch(e){}
      });
    }, 120);
  });

  /* ---------- 1. THE ACTS -------------------------------------------- */
  var LAW = {list:[], byId:{}, st:'unread', err:'', ex:'NSE'};

  function lawLabel(l){
    var nm = String(l.name || l.id || '');
    nm = nm.replace(/\((?:No\.|Legal Notice|Cap\.)[^)]*\)/gi, '');
    nm = nm.replace(/,\s*(19|20)\d\d\s*$/, '');
    nm = nm.replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim();
    var st = String(l.status || '').toLowerCase();
    var tag = (st && st !== 'enacted') ? ' [' + st.toUpperCase() + ']' : '';
    return (l.year ? String(l.year) + ' ' : '') + nm + tag;
  }
  function loadLaws(){
    var p = sd('gov_laws_KE.json');
    return getJSON(p).then(function(d){
      var sel = document.getElementById('pol');
      LAW.st = readState(p);
      LAW.ex = String((d && d.exchange) || 'NSE').toUpperCase();
      LAW.list = (d && d.laws) || [];
      LAW.byId = {};
      LAW.list.forEach(function(l){ if(l && l.id) LAW.byId[l.id] = l; });
      if(!sel) return;
      sel.innerHTML = '';
      var o0 = document.createElement('option');
      o0.value = '';
      o0.textContent = LAW.st === 'failed' ? 'ACTS NOT READ' : 'NO ACT SELECTED';
      sel.appendChild(o0);
      if(LAW.st === 'failed'){
        sel.disabled = true;
        LAW.err = readErr(p);
        return;
      }
      var sorted = LAW.list.slice().sort(function(a, b){
        var ya = Number(a.year) || 0, yb = Number(b.year) || 0;
        if(ya !== yb) return yb - ya;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
      sorted.forEach(function(l){
        var o = document.createElement('option');
        o.value = l.id;
        o.textContent = lawLabel(l);
        sel.appendChild(o);
      });
      sel.disabled = false;
    });
  }
  function lawScope(){
    var law = G.law;
    if(!law) return null;
    var named = (law.tickers || []).map(function(x){ return String(x).toUpperCase(); });
    var secs = (law.sectors || []).map(function(s){ return String(s).toUpperCase(); })
      .filter(function(s){ return s && s !== 'ALL SECTORS'; });
    return {ex:String(law.exchange || LAW.ex || 'NSE').toUpperCase(), named:named,
            all:named.indexOf('ALL') >= 0, secs:secs};
  }
  function paintAct(){
    var bar = document.getElementById('actbar');
    if(!bar) return;
    var law = G.law;
    if(!law){
      bar.innerHTML = '<div class="abrow"><span class="abhead">NO ACT SELECTED</span>' +
        '<span class="abstat">MAP</span></div>' +
        '<div class="abrow"><span class="abmech">the map shows the links the records state; ' +
        'choose an act to trace how far it reaches</span></div>';
      return;
    }
    var mech = nd(String(law.mechanism || ''));
    var full = mech;
    if(mech.length > 150){
      var cutS = mech.slice(0, 150);
      var sp = cutS.lastIndexOf(' ');
      if(sp > 90) cutS = cutS.slice(0, sp);
      mech = cutS.replace(/[,\s]+$/, '') + '...';
    }
    var tm = G.tm;
    var tr = '';
    if(tm){
      tr = (tm.msg ? '<span class="no">' + t(tm.msg) + '</span>'
                   : '<span>DIRECT <b>' + tm.direct + '</b></span>' +
                     '<span>1 LINK <b>' + tm.hop1 + '</b></span>' +
                     '<span>2 LINKS <b>' + tm.hop2 + '</b></span>' +
                     '<span>DIMMED <b>' + tm.off + '</b></span>' +
                     '<span class="q">2 LINKS SHOWN DIMMER, NOT CUT</span>' +
                     (tm.noRec ? '<span class="q">' + tm.noRec +
                       (tm.noRec === 1 ? ' DIRECT COMPANY CARRIES' : ' DIRECT COMPANIES CARRY') +
                       ' NO LINK RECORD, SO NOTHING PROPAGATES FROM ' +
                       (tm.noRec === 1 ? 'IT' : 'THEM') + '</span>' : ''));
    } else {
      tr = '<span class="q">NO MAP TO TRACE ON THIS SECURITY</span>';
    }
    bar.innerHTML =
      '<div class="abrow"><span class="abhead" title="' + t((law.id || '') + ' ' + (law.name || '')) + '">' +
        t((law.id || '') + '  ' + (law.name || '')) + '</span>' +
      '<span class="abstat">' + t(String(law.status || '').toUpperCase()) + '</span></div>' +
      '<div class="abrow"><span class="abmech" title="' + t(full) + '">' + t(mech) + '</span></div>' +
      '<div class="abrow"><span class="abmech" style="color:var(--warn)" title="' +
        t(lawClauses(law).map(function(x){ return x.cite + ' - ' + x.effect; }).join('  |  ')) + '">' +
        (clauseCite(law) ? 'CLAUSE ' + t(clauseCite(law))
                         : 'CLAUSE NOT ON FILE: ' + t(law.clauses_not_on_file || 'none recorded')) +
      '</span></div>' +
      '<div class="abrow abtr">' + tr + '</div>';
  }

  /* ---------- 2. source state ---------------------------------------- */
  var REL = {}, RELF = {}, REL_ST = {}, RECBY = null, CORE2ROW = null;
  var DATA = {idx:[], idxSt:'unread', idxErr:'', sh:{}, shSt:{}, shErr:{},
              ca:[], caSt:'unread', caErr:'', caFile:'',
              news:[], newsSt:'unread', newsErr:'',
              ceos:{}, ceosSt:'unread', ceosErr:'', ceosSrc:{},
              bal:null, balSt:'unread', spark:null, sparkSt:'unread'};
  var G = {hops:1, types:{customers:true, suppliers:true, competitors:true, peers:true, partners:true,
                          holders:true, laws:true},
           cap:60, selKey:'', cat:'', model:null, row:null, rec:null, law:null, tm:null, geo:null};

  /* THE COLOUR SAYS WHAT THE LINK IS. A leaf used to be coloured by its own
     price direction, which told the reader whether a company was up today and
     nothing at all about why it is on this map. The map is a map of
     relationships, so the colour now carries the relationship: a supplier is
     blue wherever it appears, a competitor red, a customer mint, and the chip
     that selects that category wears the same colour. Price direction has its
     own places to live - the quote, the watchlist, the heatmap - and NODE
     DETAIL still carries everything recorded about the leaf. */
  var CATCOL = {
    customers:'#33e29a', suppliers:'#58a6ff', competitors:'#f87171',
    partners:'#e0a340',  peers:'#8a8a8a',    holders:'#c48bf7',
    laws:'#f5c542',      hop2:'#6b7280',     centre:'#f5c542'
  };
  function catColour(k){ return CATCOL[k] || GREY; }
  function relTypes(){
    return [
      {k:'competitors', c:CATCOL.competitors, n:'COMP', full:'COMPETITORS'},
      {k:'peers', c:CATCOL.peers, n:'PEER', full:'SECTOR PEERS'},
      {k:'customers', c:CATCOL.customers, n:'CUSTOMERS', full:'CUSTOMERS'},
      {k:'suppliers', c:CATCOL.suppliers, n:'SUPPLIERS', full:'SUPPLIERS'},
      {k:'partners', c:CATCOL.partners, n:'PARTNERS', full:'PARTNERS'}
    ];
  }
  function typeOf(k){
    var a = relTypes();
    for(var i = 0; i < a.length; i++){ if(a[i].k === k) return a[i]; }
    return {k:k, c:GREY, n:String(k || '').toUpperCase(), full:String(k || '').toUpperCase()};
  }
  function typeLabel(k){
    var n = typeOf(k).full;
    return n.charAt(0) + n.slice(1).toLowerCase();
  }
  function activeTypes(){
    return relTypes().filter(function(tp){ return G.types[tp.k]; });
  }
  function rowForTicker(ex, tk){
    var pool = MKT[ex] || [], want = String(tk || '').toUpperCase();
    for(var i = 0; i < pool.length; i++){ if(rowTicker(pool[i]) === want) return pool[i]; }
    return null;
  }
  function buildRelIndex(){
    if(RECBY) return;
    RECBY = {};
    CORE2ROW = {};
    IDX.forEach(function(r){
      var c = coreName(r.name);
      if(c && !CORE2ROW[c]) CORE2ROW[c] = r;
    });
    EXS.forEach(function(ex){
      var secs = REL[ex] || {};
      Object.keys(secs).forEach(function(k){
        var c = coreName((secs[k] && secs[k].name) || k);
        if(!c) return;
        if(!RECBY[c]) RECBY[c] = [];
        RECBY[c].push({ex:ex, key:k});
      });
    });
  }
  function identOf(name){
    var c = coreName(name);
    if(!c) return null;
    var hit = RECBY[c];
    if(hit && hit.length){
      var h = hit[0];
      var rec = (REL[h.ex] || {})[h.key] || null;
      var rr = rowForTicker(h.ex, h.key);
      return {key:'R:' + h.ex + ':' + h.key, ex:h.ex, tk:String(h.key).toUpperCase(),
              name:((rec && rec.name) || name), rec:rec, row:rr, listed:!!rr,
              sector:(rr && rr.sector) || ''};
    }
    var row = CORE2ROW[c];
    if(row){
      var tk = rowTicker(row);
      var own = (REL[row.ex] || {})[tk] || null;
      return {key:'L:' + row.ex + ':' + tk, ex:row.ex, tk:tk, name:(row.name || name),
              rec:own, row:row, listed:true, sector:row.sector || ''};
    }
    return {key:'U:' + c, ex:'', tk:'', name:String(name || ''), rec:null, row:null,
            listed:false, sector:''};
  }
  function srcLabel(e){
    var s = (e && e.source) || {};
    if(s.site) return String(s.site) + (s.retrieved ? ' ' + s.retrieved : '');
    if(s.file) return String(s.file).split('/').pop() + (s.page ? ' p' + s.page : '');
    return '';
  }
  function linkList(rec){
    var out = [];
    activeTypes().forEach(function(tp){
      var arr = rec[tp.k] || [];
      // A sector peer is not a competitor. The competitors array carries both, so the
      // split happens here on the peer flag rather than trusting the array name.
      if(tp.k === 'competitors'){ arr = arr.filter(function(e){ return !e.peer; }); }
      if(tp.k === 'peers'){ arr = (rec.competitors || []).filter(function(e){ return !!e.peer; }); }
      arr.forEach(function(e){ out.push({e:e, type:tp.k}); });
    });
    return out;
  }
  function recCount(rec){
    if(!rec) return 0;
    return relTypes().reduce(function(a, tp){ return a + (rec[tp.k] || []).length; }, 0);
  }
  function pctOf(r){
    if(!r) return null;
    if(isNum(r.chgPct)) return Number(r.chgPct);
    if(isNum(r.changePct)) return Number(r.changePct);
    var ch = r.change;
    if(typeof ch === 'string'){
      var m = ch.match(/\(([-+]?[0-9.]+)%\)/);
      if(m) return Number(m[1]);
      if(isNum(ch)) return Number(ch);
    } else if(isNum(ch)){
      return Number(ch);
    }
    return null;
  }
  function rowPrice(r){
    if(!r) return null;
    var v = numv(r.price);
    if(v == null) v = numv(r.ltp);
    if(v == null) v = numv(r.todayClose);
    return v;
  }
  function colourOfRow(r){
    if(!r) return ORANGE;
    if(rowPrice(r) == null) return BLUE;
    var pc = pctOf(r);
    if(pc == null) return GREY;
    if(pc > 0.00001) return UP;
    if(pc < -0.00001) return DN;
    return GREY;
  }

  /* ---------- 3. the six categories the map and the chips read -------- */
  /* Every leaf on this map is one record read from disk: the four relationship
     categories out of relationships_<EX>.json, HOLDERS out of
     shareholders_<EX>.json, LAWS out of gov_laws_KE.json. A category with no
     record still keeps its chip and still says so in NODE DETAIL. */
  var CATS = [
    {k:'customers',  n:'CUSTOMERS',  c:UP,   one:'customer record'},
    {k:'suppliers',  n:'SUPPLIERS',  c:BLUE, one:'supplier record'},
    {k:'competitors',n:'COMPETITORS',c:DN,   one:'competitor record'},
    {k:'peers',      n:'PEERS',      c:GREY, one:'sector peer'},
    {k:'partners',   n:'PARTNERS',   c:AMB,  one:'partner record'},
    {k:'holders',    n:'HOLDERS',    c:GREY, one:'substantial holder record'},
    {k:'laws',       n:'LAWS',       c:AMB,  one:'Act'}
  ];
  var CATCAP = {customers:6, suppliers:6, competitors:6, peers:6, partners:6, holders:6, laws:6, hop2:8};

  function catDef(k){
    for(var i = 0; i < CATS.length; i++){ if(CATS[i].k === k) return CATS[i]; }
    return {k:k, n:String(k || '').toUpperCase(), c:GREY, one:'record'};
  }
  function codeOf(label, name){
    var s = String(label || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(s) return s.length > 7 ? s.slice(0, 7) : s;
    var w = String(name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ')
      .split(' ').filter(function(x){ return x && x.length > 1; });
    if(!w.length) return '?';
    if(w.length === 1) return w[0].slice(0, 6);
    return w.map(function(x){ return x.charAt(0); }).join('').slice(0, 5);
  }
  function nameCode(name){
    var w = String(name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ')
      .split(' ').filter(function(x){ return x && x.length > 1; });
    if(!w.length) return '?';
    if(w[0].length <= 2 && w[1]) return (w[0] + w[1]).slice(0, 6);
    return w[0].slice(0, 6);
  }
  function lawCode(id, year){
    var s = String(id || '').toUpperCase().replace(/^KE-/, '');
    var parts = s.split('-').filter(Boolean);
    var words = parts.filter(function(p){ return !/^\d{4}$/.test(p); });
    var yr = String(year || parts[parts.length - 1] || '').slice(-4);
    var ini;
    if(words.length === 1) ini = words[0].slice(0, 2);
    else ini = words.map(function(w){ return w.charAt(0); }).join('').slice(0, 3);
    if(!ini) ini = s.slice(0, 3);
    return (ini + yr).slice(0, 7);
  }
  /* the Acts whose own ticker list, sector list or ALL marker names this
     security. One function, so the map chip and the LAWS list below can never
     disagree about which Acts apply. */
  function lawHits(row){
    if(!row || LAW.st === 'failed') return [];
    var tk = rowTicker(row), sec = String(row.sector || '').toUpperCase();
    var ex = String(row.ex || '').toUpperCase();
    var hits = (LAW.list || []).filter(function(l){
      var lt = (l.tickers || []).map(function(x){ return String(x).toUpperCase(); });
      var ls = (l.sectors || []).map(function(x){ return String(x).toUpperCase(); });
      var lex = String(l.exchange || LAW.ex || 'NSE').toUpperCase();
      if(lt.indexOf(tk) >= 0) return true;
      if(sec && ls.indexOf(sec) >= 0) return true;
      if(lt.indexOf('ALL') >= 0 && lex === ex) return true;
      return false;
    });
    hits.sort(function(a, b){ return (Number(b.year) || 0) - (Number(a.year) || 0); });
    return hits;
  }

  function buildRadial(row){
    var ex = row.ex, tk = rowTicker(row), sym = String(row.sym || tk || '');
    var nm = nd(String(row.name || tk));
    var cats = [], ring1 = [], ring2 = [], dropped = 0;

    /* the four relationship categories, from this security's own record */
    relTypes().forEach(function(tp){
      var file = 'relationships_' + ex + '.json';
      var c = {k:tp.k, n:tp.full, c:tp.c, file:file, state:'ok', err:'', total:0,
               items:[], drawn:0, capped:0, emptyMsg:''};
      if(REL_ST[ex] === 'failed'){
        c.state = 'fail';
        c.err = readErr(sd(file));
      } else {
        var list = (G.rec && G.rec[tp.k]) || [];
        c.total = list.length;
        list.forEach(function(e){
          var id = identOf(e && e.name);
          if(!id) return;
          if(id.ex && id.ex === ex && String(id.tk) === String(tk)) return;
          c.items.push({
            key:'rel:' + tp.k + ':' + id.key, cat:tp.k, cluster:tp.k, hop:1,
            label:codeOf(id.tk, id.name), name:nd(id.name || (e && e.name) || ''),
            code:String(id.tk || ''), ex:id.ex || '', link:typeLabel(tp.k),
            reason:nd(String((e && (e.role || e.note)) || '')), src:srcLabel(e),
            colour:catColour(tp.k), dirCol:colourOfRow(id.row), co:true, listed:!!id.listed,
            sector:id.sector || '', rec:id.rec, mk:tp.k, x:null
          });
        });
        c.emptyMsg = 'no ' + catDef(tp.k).one + ' for ' + nm + ' in ' + file;
      }
      cats.push(c);
    });

    /* HOLDERS: the substantial holder record for this security */
    var hold = {k:'holders', n:'HOLDERS', c:GREY, file:'shareholders_' + ex + '.json',
                state:'ok', err:'', total:0, items:[], drawn:0, capped:0, emptyMsg:''};
    if(DATA.shSt[ex] === 'failed'){
      hold.state = 'fail';
      hold.err = DATA.shErr[ex];
    } else {
      var sh = DATA.sh[ex] || {};
      var srec = sh[tk] || sh[sym] || null;
      if(!srec){
        EXS.forEach(function(e2){
          if(srec || e2 === ex) return;
          var alt = DATA.sh[e2] || {};
          srec = alt[tk] || null;
        });
      }
      var hs = (srec && srec.substantial) || [];
      hold.total = hs.length;
      hold.emptyMsg = srec
        ? 'the holder record for ' + tk + ' names no substantial holder' +
          (srec.asOf ? ' (as at ' + nd(srec.asOf) + ')' : '')
        : 'no holder record for ' + tk + ' in shareholders_' + ex + '.json';
      hs.forEach(function(h){
        var id = identOf(h.name);
        hold.items.push({
          key:'sh:' + coreName(h.name) + ':' + (h.name || ''), cat:'holders',
          cluster:'holders', hop:1, label:nameCode(h.name), name:nd(h.name || ''),
          code:String((id && id.tk) || ''), ex:(id && id.ex) || '', link:'Holder',
          tag:(h.holding != null ? fmtBig(h.holding) + ' SH'
               : (h.pct != null ? Number(h.pct).toFixed(2) + '%' : '')),
          reason:(h.holding != null ? fmtBig(h.holding) + ' shares'
                  : (h.pct != null ? Number(h.pct).toFixed(2) + '% held' : 'holding on file')),
          src:(srec && srec.asOf ? 'as at ' + nd(srec.asOf) : ''),
          colour:catColour('holders'), dirCol:(id && id.listed ? colourOfRow(id.row) : GREY), co:false,
          listed:!!(id && id.listed), rec:null, sector:(id && id.sector) || '',
          mk:'holders', x:null
        });
      });
    }
    cats.push(hold);

    /* LAWS: only the Acts that name this security, its sector or ALL issuers */
    var laws = {k:'laws', n:'LAWS', c:AMB, file:'gov_laws_KE.json', state:'ok', err:'',
                total:0, items:[], drawn:0, capped:0, emptyMsg:''};
    if(LAW.st === 'failed'){
      laws.state = 'fail';
      laws.err = LAW.err || 'gov_laws_KE.json not loaded';
    } else {
      var hits = lawHits(row);
      var sec = String(row.sector || '').toUpperCase();
      laws.total = hits.length;
      laws.ofTotal = (LAW.list || []).length;
      laws.emptyMsg = 'no Act in gov_laws_KE.json names ' + tk +
        (sec ? ' or the ' + sec + ' sector' : '');
      hits.forEach(function(l){
        var st = String(l.status || '').toLowerCase();
        laws.items.push({
          key:'law:' + (l.id || laws.items.length), cat:'laws', cluster:'laws', hop:1,
          label:lawCode(l.id, l.year), tag:lawCode(l.id, l.year),
          name:nd(l.name || l.id || ''),
          code:String(l.id || ''), ex:String(l.exchange || LAW.ex || 'NSE').toUpperCase(),
          link:'Act', reason:cut(l.mechanism || '', 240),
          clause:clauseCite(l), clauseWhy:(l.clauses_not_on_file || ''),
          clauseList:lawClauses(l),
          src:(l.source && l.source.name) ? nd(String(l.source.name)) +
              (l.source.retrieved ? ' ' + l.source.retrieved : '') : '',
          /* an Act keeps the category gold; its STATUS is still carried, and
             the row in LAWS ON THIS SECURITY prints it in words */
          colour:catColour('laws'), dirCol:(st === 'enacted' ? UP : (st === 'repealed' ? DN : AMB)),
          co:false, listed:false, rec:null, sector:'', mk:'laws', x:null
        });
      });
    }
    cats.push(laws);

    /* every record a category holds is kept, so NODE DETAIL lists all of them;
       the ring takes what it can carry and the pane marks what is not on it */
    cats.forEach(function(c){
      var lim = CATCAP[c.k] != null ? CATCAP[c.k] : 6;
      c.limit = lim;
      c.items.slice(0, lim).forEach(function(it){ ring1.push(it); });
    });

    /* two records can carry the same short label across categories: number the
       repeat so no two leaves on the map read the same */
    var seenLab = {};
    cats.forEach(function(c){
      c.items.forEach(function(it){
        var lb = String(it.label || '?');
        if(seenLab[lb]) it.label = (lb + seenLab[lb]).slice(0, 9);
        seenLab[lb] = (seenLab[lb] || 1) + 1;
      });
    });

    /* ring 2: one recorded link past a first link, only when depth 2 is on */
    if(G.hops > 1){
      var seen = {};
      ring1.forEach(function(it){ seen[it.key] = 1; });
      for(var i = 0; i < ring1.length && ring2.length < CATCAP.hop2; i++){
        var p = ring1[i];
        if(!p.rec) continue;
        var links = linkList(p.rec);
        for(var j = 0; j < links.length && ring2.length < CATCAP.hop2; j++){
          var id = identOf(links[j].e && links[j].e.name);
          if(!id) continue;
          if(id.ex === ex && String(id.tk) === String(tk)) continue;
          if(seen[id.key]) continue;
          seen[id.key] = 1;
          ring2.push({
            key:'h2:' + id.key, cat:'hop2', cluster:'hop2', hop:2, parent:p.key,
            label:codeOf(id.tk, id.name), name:nd(id.name || ''), code:String(id.tk || ''),
            ex:id.ex || '', link:typeLabel(links[j].type),
            reason:'one recorded link from ' + nd(p.name), src:srcLabel(links[j].e),
            colour:catColour('hop2'), dirCol:colourOfRow(id.row), co:true, listed:!!id.listed,
            sector:id.sector || '', rec:id.rec, mk:links[j].type, x:null
          });
        }
      }
    }

    /* the second ring shares the same label space */
    ring2.forEach(function(it){
      var lb = String(it.label || '?');
      if(seenLab[lb]) it.label = (lb + seenLab[lb]).slice(0, 9);
      seenLab[lb] = (seenLab[lb] || 1) + 1;
    });

    var centre = {key:'C:' + ex + ':' + tk, name:nd(row.name || tk), tk:tk, ex:ex,
                  price:rowPrice(row), pct:pctOf(row), sector:row.sector || '',
                  asOf:String(row.asOf || ''), currency:String(row.currency || ''),
                  prev:numv(row.prevClose), co:true, listed:true, rec:G.rec, cat:'centre'};
    return {row:row, ex:ex, tk:tk, centre:centre, cats:cats, ring1:ring1, ring2:ring2,
            dropped:dropped, capped:0, spark:DATA.spark, nodes:[], edges:[], tm:null, geo:null};
  }

  /* ---------- 4. reach: direct, one link, two links ------------------- */
  function modelNodes(m){
    var n = [m.centre];
    m.ring1.forEach(function(it){ n.push(it); });
    m.ring2.forEach(function(it){ n.push(it); });
    return n;
  }
  function modelEdges(m){
    var e = [];
    m.ring1.forEach(function(it){
      e.push({a:m.centre.key, b:it.key, type:it.link, mk:it.mk, hop:1});
    });
    m.ring2.forEach(function(it){
      e.push({a:it.parent || m.centre.key, b:it.key, type:it.link, mk:it.mk, hop:2});
    });
    return e;
  }
  function transMsg(tm){
    if(tm.direct) return '';
    var s = 'THIS ACT NAMES NO SECURITY ON THIS MAP';
    if(!tm.named.length && !tm.all){
      return s + ': ITS RECORD NAMES NO TICKER, ONLY SECTORS ' +
        (tm.sectors.length ? tm.sectors.join(' ') : 'NONE');
    }
    if(tm.all && !tm.named.length){
      return s + ': IT NAMES EVERY ' + tm.ex + ' ISSUER AND NO ' + tm.ex +
        ' ISSUER IS DRAWN HERE';
    }
    var tk = tm.named.slice(0, 4).join(' ') + (tm.named.length > 4 ? ' +' + (tm.named.length - 4) : '');
    var se = tm.sectors.length ? tm.sectors.join(' ') : 'NONE';
    return s + ': ITS TICKERS ' + tk + ' AND ITS SECTORS ' + se + ' ARE NOT DRAWN HERE';
  }
  function trans(m){
    m.tm = null;
    var sc = lawScope();
    var nodes = modelNodes(m), edges = modelEdges(m);
    m.nodes = nodes; m.edges = edges;
    if(!sc){
      nodes.forEach(function(n){ n.st = ''; n.why = ''; });
      return;
    }
    var rank = {};
    nodes.forEach(function(n){
      n.st = ''; n.why = '';
      if(!n.co) return;
      var ex = String(n.ex || '').toUpperCase();
      var tk = String(n.tk || '').toUpperCase();
      var se = String(n.sector || '').toUpperCase();
      if(!n.listed || !tk || ex !== sc.ex) return;
      if(sc.named.indexOf(tk) >= 0){ n.st = 'direct'; n.why = 'named'; rank[n.key] = 1; return; }
      if(sc.all){ n.st = 'direct'; n.why = 'all'; rank[n.key] = 1; return; }
      if(se && sc.secs.indexOf(se) >= 0){ n.st = 'direct'; n.why = 'sector'; rank[n.key] = 1; }
    });
    var H1 = {}, H2 = {};
    edges.forEach(function(e){
      if(rank[e.a] === 1 && rank[e.b] == null) H1[e.b] = 1;
      if(rank[e.b] === 1 && rank[e.a] == null) H1[e.a] = 1;
    });
    Object.keys(H1).forEach(function(k){ rank[k] = 2; });
    edges.forEach(function(e){
      if(rank[e.a] === 2 && rank[e.b] == null) H2[e.b] = 1;
      if(rank[e.b] === 2 && rank[e.a] == null) H2[e.a] = 1;
    });
    Object.keys(H2).forEach(function(k){ rank[k] = 3; });
    var direct = [], h1 = [], h2 = [], off = [], noRec = 0;
    nodes.forEach(function(n){
      if(!n.co) return;
      var r = rank[n.key];
      n.st = r === 1 ? 'direct' : (r === 2 ? 'hop1' : (r === 3 ? 'hop2' : 'off'));
      if(n.st === 'direct'){ direct.push(n); if(!n.rec) noRec++; }
      else if(n.st === 'hop1') h1.push(n);
      else if(n.st === 'hop2') h2.push(n);
      else off.push(n);
    });
    var namedTk = sc.named.filter(function(x){ return x !== 'ALL'; });
    m.tm = {ex:sc.ex, all:sc.all, named:namedTk, sectors:sc.secs,
            direct:direct.length, hop1:h1.length, hop2:h2.length, off:off.length,
            directList:direct.map(function(n){ return n.tk || n.name; }),
            hop1List:h1.map(function(n){ return n.tk || n.name; }),
            hop2List:h2.map(function(n){ return n.tk || n.name; }),
            offList:off.map(function(n){ return n.tk || n.name; }),
            noRec:noRec, edgesAmber:0};
    m.tm.msg = transMsg(m.tm);
    G.tm = m.tm;
  }

  /* ---------- 5. geometry ------------------------------------------- */
  /* One centre disc and two concentric dashed ellipses. A node sits at an equal
     arc length from its neighbours, and a wedge either side of the left apex is
     left empty so the RING 1 / RING 2 labels can never sit on a node. */
  var MIN_GAP = 30, RING_GAP = 0.40;

  function ringTab(rx, ry, gapHalf){
    var N = 720, cum = [0], L = 0, i;
    var a0 = Math.PI + gapHalf, a1 = Math.PI * 3 - gapHalf;
    var px = Math.cos(a0) * rx, py = Math.sin(a0) * ry;
    for(i = 1; i <= N; i++){
      var a = a0 + (a1 - a0) * i / N;
      var x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      L += Math.sqrt((x - px) * (x - px) + (y - py) * (y - py));
      cum.push(L);
      px = x; py = y;
    }
    return {rx:rx, ry:ry, a0:a0, a1:a1, N:N, L:L, cum:cum};
  }
  function tabAngle(tab, s){
    var lo = 1, hi = tab.N, mid;
    s = Math.max(0, Math.min(tab.L, s));
    while(lo < hi){
      mid = (lo + hi) >> 1;
      if(tab.cum[mid] < s) lo = mid + 1; else hi = mid;
    }
    var i0 = Math.max(1, lo - 1);
    var seg = tab.cum[lo] - tab.cum[i0];
    var u = seg > 0 ? (s - tab.cum[i0]) / seg : 0;
    return tab.a0 + (tab.a1 - tab.a0) * (i0 + u) / tab.N;
  }
  function ringSlots(tab, n){
    var out = [], i;
    for(i = 0; i < n; i++) out.push(tabAngle(tab, tab.L * (i + 0.5) / n));
    return out;
  }
  /* THE RING BREATHES BETWEEN CATEGORIES. Evenly spaced leaves ran the
     suppliers into the competitors into the holders with nothing between them,
     which is most of why the map read as congested. The leaves are already in
     category order, so each run of one category is given its own stretch of
     the ring and a gap worth one slot is left between runs: the same nodes,
     the same places, grouped so the eye can see where one kind ends. */
  function ringGroups(items){
    var g = [], last = null;
    (items || []).forEach(function(it){
      var k = it.cat || '';
      if(k !== last){ g.push(0); last = k; }
      g[g.length - 1]++;
    });
    return g;
  }
  function ringSlotsGrouped(tab, groups, gapUnits){
    var n = 0;
    groups.forEach(function(g){ n += g; });
    if(!n) return [];
    var units = n + Math.max(0, groups.length - 1) * gapUnits;
    var out = [], u = 0;
    groups.forEach(function(g){
      for(var i = 0; i < g; i++){ out.push(tabAngle(tab, tab.L * (u + 0.5) / units)); u++; }
      u += gapUnits;
    });
    return out;
  }
  /* RADIAL MINT shows the company name, not its code: a map labelled 'JT' and 'WG'
     tells the reader nothing they can act on. */
  function leafLabel(it){
    if(it && it.dispLabel) return it.dispLabel;
    var nm = String((it && (it.name || it.label)) || '').replace(/\s+/g, ' ').trim();
    return cut(nm, 20);
  }
  function labelW(s){ return String(s || '').length * 3.95 + 2; }

  function layoutRadial(m, W, H){
    var cx = W / 2, cy = H / 2;
    /* the centre reads at 5x the hop 1 leaf, and holds that ratio until the
       window is genuinely too small to carry it */
    var rC = Math.round(Math.min(24, Math.max(13, Math.min(W / 26, H / 13))));
    var lr1 = Math.max(3, rC * 5 / 24), lr2 = Math.max(2.4, rC * 4 / 24);
    /* RADIAL MINT: one true circle per ring. The elliptical version pushed the
       outer ring into the corners of the frame, which left the map visually small
       and the labels crowded under their nodes. A circle of the largest radius the
       frame allows uses the same area honestly on every aspect ratio. */
    /* A strict circle is the cleanest radial shape, but this box is short and wide:
       fitting the circle to the height threw away the width and ring 1 could only
       hold 7 of the 20 links, so the map quietly showed a third of the graph. The
       circle is therefore allowed to stretch horizontally, up to 1.85x, only when
       the frame is short. Capacity is preserved and the shape still reads radial. */
    var rY = Math.max(rC * 3.4, H / 2 - 40);
    var rX = Math.min(W / 2 - 86, rY * 1.85);
    rX = Math.max(rY, rX);
    var rx2 = rX, ry2 = rY;
    var Rmax = rY;

    /* ring 1 grows only as far as its own population needs, and never past the
       inner edge of ring 2 */
    /* WHEN THERE IS NO SECOND RING, THE FIRST ONE TAKES THE ROOM. Ring 1 used
       to sit at 58 per cent of the frame whether or not anything was drawn
       outside it, which left a wide empty band and crowded the leaf labels
       into the middle for no reason. With no hop 2 nodes on file - which is
       most securities at 1 HOP - it opens to 88 per cent instead, and the
       labels get the space back. */
    var inner = (m.ring2 && m.ring2.length) ? 0.58 : 0.88;
    var t1 = ringTab(Rmax * inner, Rmax * inner, RING_GAP);
    if(m.ring1.length){
      /* the gaps between categories take room too, so the ring is sized for
         the leaves AND the gaps, never for the leaves alone */
      var need = (m.ring1.length + Math.max(0, ringGroups(m.ring1).length - 1) * 0.85) * MIN_GAP / t1.L;
      if(need > 1){
        var f = Math.min(0.96 / inner, need * 1.03);
        t1 = ringTab(Rmax * inner * f, Rmax * inner * f, RING_GAP);
      }
    }
    var t2 = ringTab(Rmax, Rmax, RING_GAP);

    /* a ring draws the population it can carry and the rest is counted as
       dropped, on the header, never silently */
    var cap1 = Math.max(1, Math.floor(t1.L / MIN_GAP));
    if(m.ring1.length > cap1){
      m.dropped += m.ring1.length - cap1;
      m.ring1 = m.ring1.slice(0, cap1);
    }
    var cap2 = Math.max(1, Math.floor(t2.L / MIN_GAP));
    if(m.ring2.length > cap2){
      m.dropped += m.ring2.length - cap2;
      m.ring2 = m.ring2.slice(0, cap2);
    }

    var g1 = ringGroups(m.ring1);
    var a1 = ringSlotsGrouped(t1, g1, 0.85), a2 = ringSlots(t2, m.ring2.length);
    function place(it, tab, a, r, ring){
      it.x = cx + Math.cos(a) * tab.rx;
      it.y = cy + Math.sin(a) * tab.ry;
      it.r = r;
      it.ring = ring;
      it.drawn = true;
      it.side = Math.cos(a) < 0 ? 'l' : 'r';
      it.lx = it.x + (it.side === 'l' ? -8 : 8);
      it.ly = it.y + 2.6;
      it.lw = labelW(leafLabel(it));   /* recomputed below if de-duplicated */
    }
    m.ring1.forEach(function(it, i){ place(it, t1, a1[i], lr1, 1); });
    m.ring2.forEach(function(it, i){ place(it, t2, a2[i], lr2, 2); });

    /* labels on the same side stack in reading order: sorted by height and pushed
       apart by a minimum gap, so two long company names can never overlap */
    /* the same company can be recorded under two categories, which is honest but
       renders as two identical labels. Where a name repeats, the category is appended
       so the reader can see it is two records and not a duplicated row. */
    (function(){
      var seen = {}, all = m.ring1.concat(m.ring2);
      all.forEach(function(q){
        var k = leafLabel(q).toLowerCase();
        if(seen[k]){ seen[k]._dup = true; q._dup = true; } else seen[k] = q;
      });
      all.forEach(function(q){
        if(q._dup){
          var c = String(q.cat || '').toUpperCase().slice(0, 4);
          /* truncating to 15 here cut off the very words that tell the two records
             apart, so the fuller name is kept and only the category is appended */
          var full = String((q.name || q.label) || '').replace(/\s+/g, ' ').trim();
          /* the two records often differ only in a trailing account number
             ('... A/C 1019D' against '... A/C 915B'), so the tail is kept and the
             middle is what gets cut */
          var tail = full.length > 26 ? full.slice(-10).trim() : '';
          q.dispLabel = cut(full, 15) + (tail ? ' ' + tail : '') + (c ? '.' + c : '');
        }
      });
    })();

    (m.ring1.concat(m.ring2)).forEach(function(q){ q.lw = labelW(leafLabel(q)); });

    var LBL_GAP = 10.4;
    ['l', 'r'].forEach(function(side){
      var arr = m.ring1.concat(m.ring2).filter(function(q){ return q.side === side; });
      arr.sort(function(x, y){ return x.y - y.y; });
      var prev = null;
      arr.forEach(function(q){
        if(prev != null && q.ly - prev < LBL_GAP) q.ly = prev + LBL_GAP;
        prev = q.ly;
      });
    });
    m.cats.forEach(function(c){
      c.drawn = 0;
      c.items.forEach(function(it){ if(it.x != null) c.drawn++; });
    });

    var g = {w:W, h:H, cx:cx, cy:cy, rC:rC, leaf1:lr1, leaf2:lr2,
             rx1:t1.rx, ry1:t1.ry, rx2:rx2, ry2:ry2, gap:RING_GAP,
             n1:m.ring1.length, n2:m.ring2.length, rings:2,
             clashes:0, outside:0, labelBox:[]};

    /* measure what was drawn: a label may not sit on another label or on
       another node, and nothing may leave the viewBox */
    var labs = [], all = m.ring1.concat(m.ring2), i, j;
    all.forEach(function(it){
      labs.push({k:it.key, x:(it.side === 'l' ? it.lx - it.lw : it.lx),
                 y:it.ly - 6.8, w:it.lw, h:8.4});
    });
    labs.forEach(function(a){
      if(a.x < 0 || a.x + a.w > W || a.y < 0 || a.y + a.h > H) g.outside++;
      for(i = 0; i < all.length; i++){
        var c2 = all[i];
        if(c2.key === a.k) continue;
        var qx = Math.max(a.x, Math.min(a.x + a.w, c2.x));
        var qy = Math.max(a.y, Math.min(a.y + a.h, c2.y));
        if((qx - c2.x) * (qx - c2.x) + (qy - c2.y) * (qy - c2.y) < c2.r * c2.r) g.clashes++;
      }
      for(j = 0; j < labs.length; j++){
        if(labs[j] === a) continue;
        var b = labs[j];
        if(!(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y)){
          if(labs.indexOf(a) < j) g.clashes++;
        }
      }
    });
    g.labelBox = labs;
    m.geo = g;
    return g;
  }

  /* ---------- 6. drawing ------------------------------------------- */
  /* one arrowhead per link type, in the type colour, so a link can be read
     without a legend */
  /* RADIAL MINT palette: mint is reserved for what is filed or owned (holders),
     amber for statutes, and the commercial links stay in their own muted colours */
  var MK = [{k:'customers', c:UP}, {k:'suppliers', c:BLUE}, {k:'competitors', c:DN},
            {k:'partners', c:AMB}, {k:'holders', c:UP}, {k:'laws', c:AMB}];
  function f1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
  function mkOf(k){
    for(var i = 0; i < MK.length; i++){ if(MK[i].k === k) return MK[i]; }
    return MK[0];
  }
  function defsSVG(){
    var out = '<defs>';
    MK.forEach(function(tp){
      out += '<marker id="mk-' + tp.k + '" viewBox="0 0 6 6" refX="5.7" refY="3"' +
        ' markerWidth="6.4" markerHeight="6.4" orient="auto">' +
        '<path d="M0.4 0.5 L5.7 3 L0.4 5.5 z" fill="' + tp.c + '"/></marker>';
    });
    return out + '</defs>';
  }
  function nodePos(m, key){
    if(key === m.centre.key) return {x:m.geo.cx, y:m.geo.cy, r:m.geo.rC + 3};
    var all = m.ring1.concat(m.ring2);
    for(var i = 0; i < all.length; i++){
      if(all[i].key === key) return {x:all[i].x, y:all[i].y, r:all[i].r + 5};
    }
    return null;
  }
  /* a quadratic bezier from the edge of one node to the edge of the next, bowed
     off the straight line so two links never read as one */
  function bez(a, b, bow){
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / d, uy = dy / d;
    var x1 = a.x + ux * a.r, y1 = a.y + uy * a.r;
    var x2 = b.x - ux * b.r, y2 = b.y - uy * b.r;
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    return 'M' + f1(x1) + ' ' + f1(y1) + ' Q' + f1(mx - uy * d * bow) + ' ' +
      f1(my + ux * d * bow) + ' ' + f1(x2) + ' ' + f1(y2);
  }
  function ringsSVG(m){
    var g = m.geo, out = '', has2 = !!(m.ring2 && m.ring2.length);
    /* An empty ring is a circle drawn around nothing. It is not drawn, and it
       does not take a label: the one line under the map says there is no hop 2
       record, which is the fact, and the frame stays quiet. */
    if(has2){
      out += '<ellipse class="ring r2" cx="' + f1(g.cx) + '" cy="' + f1(g.cy) + '" rx="' +
        f1(g.rx2) + '" ry="' + f1(g.ry2) + '"/>';
    }
    out += '<ellipse class="ring r1" cx="' + f1(g.cx) + '" cy="' + f1(g.cy) + '" rx="' +
      f1(g.rx1) + '" ry="' + f1(g.ry1) + '"/>';
    out += '<text class="rl" x="' + f1(g.cx - g.rx1 - 12) + '" y="' + f1(g.cy + 2.6) +
      '" text-anchor="end">RING 1<tspan class="rn" dx="4">(' + m.ring1.length +
      ')</tspan></text>';
    if(has2){
      out += '<text class="rl" x="' + f1(g.cx - g.rx2 - 12) + '" y="' + f1(g.cy + 2.6) +
        '" text-anchor="end">RING 2<tspan class="rn" dx="4">(' + m.ring2.length +
        ')</tspan></text>';
    } else {
      var ny = Math.min(g.cy + g.ry1 + 30, g.h - 6);
      out += '<text class="none" x="' + f1(g.cx) + '" y="' + f1(ny) +
        '" text-anchor="middle">NO 2-LINK NODES ON FILE &middot; 2 HOPS ADDS THEM WHERE A RECORD EXISTS</text>';
    }
    return out;
  }
  function edgesSVG(m){
    var out = '';
    m.edges.forEach(function(e){
      var a = nodePos(m, e.a), b = nodePos(m, e.b);
      if(!a || !b) return;
      var tp = mkOf(e.mk);
      var cls = 'eg' + (e.hop === 2 ? ' h2' : '') + (e.mk === 'laws' ? ' law' : '');
      out += '<path class="' + cls + '" data-t="' + t(e.mk) + '" data-a="' + t(e.a) +
        '" data-b="' + t(e.b) + '" d="' + bez(a, b, e.hop === 2 ? 0.15 : 0.1) +
        '" stroke="' + tp.c + '" marker-end="url(#mk-' + tp.k + ')"/>';
    });
    return out;
  }
  function leavesSVG(m){
    var out = '';
    [m.ring1, m.ring2].forEach(function(arr){
      arr.forEach(function(it){
        var cls = 'nd' + (it.st ? ' st-' + it.st : '') +
          (G.cat && G.cat === it.cat ? ' cat-on' : '') + (it.hop === 2 ? ' h2' : '') +
          (G.law && it.st === 'off' ? ' offn' : '');
        out += '<g class="' + cls + '" data-k="' + t(it.key) + '" data-cl="' + t(it.cat) +
          '" data-st="' + t(it.st || '') + '" data-hop="' + it.hop + '" data-ring="' +
          it.ring + '"><title>' + t(it.name + (it.code ? ' ' + it.code +
          (it.ex ? ' ' + it.ex : '') : '') + ' | ' + it.link + ' | HOP ' + it.hop +
          (it.src ? ' | ' + it.src : '')) + '</title>';
        if(it.st === 'direct' || it.st === 'hop1' || it.st === 'hop2'){
          out += '<circle class="hl ' + it.st + '" cx="' + f1(it.x) + '" cy="' + f1(it.y) +
            '" r="' + f1(it.r + 3.6) + '"/>';
        }
        out += '<circle class="lf' + (it.hop === 2 ? ' h2' : '') + '" cx="' + f1(it.x) +
          '" cy="' + f1(it.y) + '" r="' + f1(it.r) + '" stroke="' + it.colour + '"/>' +
          '<line class="ldr" x1="' + f1(it.x) + '" y1="' + f1(it.y) + '" x2="' +
          f1(it.lx + (it.side === 'l' ? -2 : 2)) + '" y2="' + f1(it.ly - 2.4) +
          '" stroke="' + it.colour + '"/>' +
          '<text class="nl a-' + it.side + '" x="' + f1(it.lx) + '" y="' + f1(it.ly) + '">' +
          t(leafLabel(it)) + '</text></g>';
      });
    });
    return out;
  }
  function centreSVG(m){
    var g = m.geo, c = m.centre, pc = c.pct, out = '';
    var tfs = Math.max(7.4, Math.min(12, 40 / (Math.max(3, String(c.tk).length) * 0.62)));
    var px = fmtP(c.price), bits = [];
    if(c.ex) bits.push(c.ex);
    if(px !== DASH) bits.push(px + (c.currency ? ' ' + c.currency : ''));
    if(pc != null) bits.push(fmtPct(pc));
    out += '<g class="ctr" data-k="' + t(c.key) + '">';
    if(c.st === 'direct' || c.st === 'hop1' || c.st === 'hop2'){
      out += '<circle class="hl ctr' + (c.st === 'direct' ? '' : ' ' + c.st) +
        '" cx="' + f1(g.cx) + '" cy="' + f1(g.cy) + '" r="' + f1(g.rC + 5) + '"/>';
    }
    out += '<circle class="cdc" cx="' + f1(g.cx) + '" cy="' + f1(g.cy) + '" r="' +
      f1(g.rC) + '"/>';
    out += '<text class="ctk" x="' + f1(g.cx) + '" y="' + f1(g.cy + tfs * 0.36) +
      '" style="font-size:' + (Math.round(tfs * 10) / 10) + 'px">' + t(String(c.tk)) +
      '</text>';
    out += '<text class="cnm" x="' + f1(g.cx) + '" y="' + f1(g.cy + g.rC + 13.5) + '">' +
      t(cut(c.name, 44)) + '</text>';
    out += '<text class="cpx" x="' + f1(g.cx) + '" y="' + f1(g.cy + g.rC + 24) + '">' +
      t(bits.join('  ')) + '</text>';
    return out + '</g>';
  }
  function svgAll(m, W, H){
    return defsSVG() + '<g class="gv">' + ringsSVG(m) + edgesSVG(m) + leavesSVG(m) +
      centreSVG(m) + '</g>';
  }

  /* ---------- 7. header and footer lines --------------------------- */
  function filesLine(){
    var ok = [], bad = [];
    EXS.forEach(function(ex){ (REL_ST[ex] === 'ok' ? ok : bad).push(ex); });
    return 'FILES ' + (ok.length ? ok.join(' ') : 'NONE') +
      (bad.length ? ' | <b>' + bad.join(' ') + ' NOT READ</b>' : '');
  }
  function nodeCount(m){
    return (m.ring1 ? m.ring1.length : 0) + (m.ring2 ? m.ring2.length : 0);
  }
  function headerMeta(m){
    return '2 RINGS | ' + nodeCount(m) + ' NODES | ' + (m.edges ? m.edges.length : 0) +
      ' EDGES | RING 1 ' + (m.ring1 ? m.ring1.length : 0) + ' RING 2 ' +
      (m.ring2 ? m.ring2.length : 0) + (m.dropped ? ' | ' + m.dropped + ' DROPPED' : '');
  }
  function subHTML(m){
    /* Emptied on purpose. The node cap and the files read already print in the
       header meta, so this line only repeated them and then explained the box
       colours, which is the panel explaining itself rather than showing data. */
    return '';
  }

  /* ---------- 8. pan, zoom, hover, detail -------------------------- */
  var MAP = {k:1, x:0, y:0, drag:false, moved:false, sx:0, sy:0, ox:0, oy:0, svg:null};
  function applyView(svg){
    if(!svg) return;
    var gv = svg.querySelector('.gv');
    if(gv){
      gv.setAttribute('transform', 'translate(' + MAP.x.toFixed(2) + ',' + MAP.y.toFixed(2) +
        ') scale(' + MAP.k.toFixed(3) + ')');
    }
    var zk = document.getElementById('zk');
    if(zk) zk.textContent = MAP.k.toFixed(1) + 'x';
  }
  function zoomAt(svg, mx, my, f){
    var k2 = Math.max(0.5, Math.min(4.5, MAP.k * f));
    if(Math.abs(k2 - MAP.k) < 0.0005) return;
    MAP.x = mx - (mx - MAP.x) * (k2 / MAP.k);
    MAP.y = my - (my - MAP.y) * (k2 / MAP.k);
    MAP.k = k2;
    applyView(svg);
  }
  function zoomBy(f){
    /* one pair of buttons for both views: in the turned view they move the
       same zoom the wheel moves, so the reading on the key is never stale */
    if(V3.on){
      V3.zoom = Math.max(0.5, Math.min(4.5, V3.zoom * f));
      var zk3 = document.getElementById('zk');
      if(zk3) zk3.textContent = V3.zoom.toFixed(1) + 'x';
      draw3();
      return;
    }
    if(!MAP.svg) return;
    var r = MAP.svg.getBoundingClientRect();
    zoomAt(MAP.svg, (r.width || 0) / 2, (r.height || 0) / 2, f);
  }
  function resetView(){
    if(V3.on){
      V3.yaw = -0.62; V3.pitch = 0.42; V3.zoom = 1; V3.spin = 0;
      paintSpin();
      var zk4 = document.getElementById('zk');
      if(zk4) zk4.textContent = '1.0x';
      draw3();
      return;
    }
    MAP.k = 1; MAP.x = 0; MAP.y = 0;
    applyView(MAP.svg);
  }
  var PAN_WIRED = false;
  function wirePan(svg){
    if(!PAN_WIRED){
      PAN_WIRED = true;
      document.addEventListener('mousemove', function(ev){
        if(!MAP.drag || !MAP.svg) return;
        var dx = ev.clientX - MAP.sx, dy = ev.clientY - MAP.sy;
        if(Math.abs(dx) > 3 || Math.abs(dy) > 3) MAP.moved = true;
        if(!MAP.moved) return;
        MAP.x = MAP.ox + dx;
        MAP.y = MAP.oy + dy;
        applyView(MAP.svg);
      });
      document.addEventListener('mouseup', function(){
        if(!MAP.drag) return;
        MAP.drag = false;
        if(MAP.svg) MAP.svg.classList.remove('drag');
      });
    }
    if(!svg) return;
    svg.addEventListener('mousedown', function(ev){
      if(ev.button !== 0) return;
      MAP.drag = true;
      MAP.moved = false;
      MAP.sx = ev.clientX;
      MAP.sy = ev.clientY;
      MAP.ox = MAP.x;
      MAP.oy = MAP.y;
      MAP.svg = svg;
      svg.classList.add('drag');
    });
    svg.addEventListener('wheel', function(ev){
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      zoomAt(svg, ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, {passive:false});
  }
  function markNode(svg){
    if(!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      if(G.selKey && el.getAttribute('data-k') === G.selKey) el.classList.add('on');
      else el.classList.remove('on');
    });
  }
  /* hover lifts the node and the link it sits on, and lets the rest recede */
  function hoverNode(svg, key){
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      if(el.getAttribute('data-k') === key) el.classList.add('hv');
      else el.classList.add('dim');
    });
    Array.prototype.forEach.call(svg.querySelectorAll('path.eg'), function(el){
