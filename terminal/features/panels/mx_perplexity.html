<!--
  mx_perplexity.html - PERPLEXITY: policy transmission on one relationship map.

  One job. The map answers one question: when a government Act changes the
  terms an industry works under, which listed companies does it reach, and how
  far does that reach travel through links the records actually state.

  Everything else that used to live here is gone on the owner's correction:
  the eight figure tiles and their sparklines, the price and candlestick card,
  the news strip, the law chip list and the thesis block. The panel is the map.

  What the map reads, and nothing else:

    LINKS     static_data/relationships_NSE.json, _JSE.json, _NGX.json,
              _EGX.json (all four, so a link can cross an exchange)
    ACTS      static_data/gov_laws_KE.json: name, year, status, mechanism,
              sectors and tickers for each Act
    LISTING   static_data/market_<EX>.json for the ticker, name and sector of
              each security
    INFO      static_data/company_info.json for a name the market file lacks

  How a chosen Act is drawn:
    * DIRECT: a security the Act's ticker list names, or a security on the
      Act's own exchange whose sector the Act names. Solid amber ring, full
      opacity. The record's own sector list decides, never a guess.
    * HOP 1: a company one recorded link away from a direct company, because a
      cost change at one party reaches the party it buys from or sells to.
      Dashed amber ring, reduced opacity.
    * HOP 2: one recorded link past that. Dotted amber ring, dimmer again, and
      the panel says so rather than cutting it silently.
    * UNAFFECTED: low opacity and a desaturated ring, so the reach stands out.
    * EDGES on the reach turn amber and thicken; the rest dim.

  Rules this file keeps:
    * a link is drawn only when a recorded relationship names it: no peer set,
      no sector inference on the map, no chain invented to fill the frame;
    * an Act that names no security on the map is said plainly, not drawn as an
      unmarked map;
    * a company with no link record cannot propagate, and the panel says so;
    * the 25 node cap and the four exchange files read are printed on the map;
    * an empty record is told apart from a failed read, and a failed read
      prints the failure where its content belongs;
    * every block draws inside a guard, so one broken read blanks one block;
    * one line states what the map shows and what it does not claim.

  Vanilla JS, single file, no build step. Mint on black, Oxygen Mono.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perplexity</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;
    --warn:#e0a341;--blue:#6ea8fe;--violet:#c08cff;
    --mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  /* The shell gives every panel a window, so this panel draws no frame of its
     own: no border, no radius, no max-width, no padding, no margin. */
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:12px;
       padding:0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;
       height:100vh;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;border:0;background:transparent;
        max-width:none;margin:0;border-radius:0}

  /* ---------- search and the Act selector, both above the map ---------- */
  .controls{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px;
            border-bottom:1px solid var(--line2);flex:0 0 auto;flex-wrap:wrap;min-width:0}
  .controls .cl2{font-size:7px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;
                 white-space:nowrap;flex:0 0 auto}
  input.qin{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
            padding:4px 8px;font-family:var(--mono);font-size:11px;width:210px;
            text-transform:uppercase;min-width:0}
  input.qin:focus{outline:0;border-color:var(--acc)}
  select.psel{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;
              padding:4px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
              max-width:400px;min-width:0;cursor:pointer}
  select.psel:focus{outline:0;border-color:var(--acc)}
  select.psel option{background:#0a0a0a;color:#f0f0f0}
  .hint{color:var(--tx3);font-size:7.5px;letter-spacing:.09em;white-space:nowrap}
  .sug{position:absolute;left:12px;top:100%;width:400px;max-height:250px;overflow:auto;
       background:var(--bg3);border:1px solid var(--line2);border-top:0;z-index:60;display:none}
  .sug.on{display:block}
  .sg{display:flex;align-items:baseline;gap:8px;padding:4px 8px;cursor:pointer;border-top:1px solid var(--line)}
  .sg:first-child{border-top:0}
  .sg.sel{background:var(--bg4)}
  .sg .tk{color:var(--acc);font-weight:700;min-width:62px}
  .sg .nm{color:var(--tx2);font-family:var(--ui);font-size:10.5px;flex:1;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .sg .ex{color:var(--tx3);font-size:8px;letter-spacing:.06em}
  .sg.none{color:var(--tx3);font-size:10px;cursor:default}

  /* ---------- the map, and the detail of the node the reader pinned ---------- */
  .grid{flex:1 1 auto;min-height:0;display:grid;gap:1px;background:var(--line2);padding:1px;
        grid-template-columns:minmax(0,1fr) 282px}
  .card{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;
        position:relative}
  .ch{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:1px solid var(--line);
      flex:0 0 auto;min-width:0;flex-wrap:nowrap}
  .cl{font-size:7.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;font-weight:600;
      white-space:nowrap}
  .cm{margin-left:auto;font-size:7.5px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cb{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
  .cgrp{display:flex;align-items:center;gap:4px;min-width:0}
  .cgrp .cl2{font-size:6.5px}
  button.kn{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--tx3);background:#0a0a0a;border:1px solid var(--line2);border-radius:2px;
            padding:3px 6px;cursor:pointer;line-height:1.1;white-space:nowrap}
  button.kn:hover{color:var(--tx2);border-color:#3a3a3a}
  button.kn[aria-pressed="true"]{color:#04120c;background:var(--acc);border-color:var(--acc);
                                 font-weight:700}
  button.kn.ft[data-t="customers"][aria-pressed="true"]{background:#33e29a;border-color:#33e29a}
  button.kn.ft[data-t="suppliers"][aria-pressed="true"]{background:#6ea8fe;border-color:#6ea8fe}
  button.kn.ft[data-t="competitors"][aria-pressed="true"]{background:#f87171;border-color:#f87171}
  button.kn.ft[data-t="partners"][aria-pressed="true"]{background:#c08cff;border-color:#c08cff}
  button.kn:focus-visible{outline:1px solid var(--acc)}
  button.kn.z{width:18px;padding:2px 0;text-align:center}
  .zk{font-size:7px;color:var(--tx3);letter-spacing:.04em;min-width:27px;text-align:right}

  /* the Act line: what is chosen, what it does mechanically, what it reaches */
  .actbar{flex:0 0 auto;border-bottom:1px solid var(--line);padding:3px 9px 4px;
          display:flex;flex-direction:column;gap:1px;min-width:0}
  .abrow{display:flex;gap:8px;align-items:baseline;min-width:0}
  .abhead{font-size:8px;letter-spacing:.08em;color:var(--warn);font-weight:700;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .abstat{font-size:6.5px;letter-spacing:.10em;color:var(--tx3);border:1px solid var(--line2);
          padding:0 3px;border-radius:2px;white-space:nowrap;flex:0 0 auto}
  .abmech{font-size:7.5px;color:var(--tx2);line-height:1.3;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;min-width:0}
  .abtr{display:flex;flex-wrap:wrap;gap:7px;font-size:7.5px;letter-spacing:.05em;color:var(--tx3);
        line-height:1.3}
  .abtr b{color:var(--warn);font-weight:700}
  .abtr .no{color:var(--warn);font-weight:700;letter-spacing:.06em}
  .abtr .q{color:var(--tx2)}

  /* relationship map: one focal node, counterparties on hop rings, curved
     arrowed links, a boxed legend and a tight toolbar. Dark and quiet. */
  .gwrap{position:absolute;inset:0;overflow:hidden;user-select:none}
  .gwrap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .gwrap svg.drag{cursor:grabbing}
  .gsub{position:absolute;left:0;right:0;bottom:0;padding:2px 9px 4px;font-size:7.5px;
        letter-spacing:.07em;color:#8a8a8a;text-transform:uppercase;background:rgba(0,0,0,.72);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gsub b{color:var(--warn);font-weight:700}
  .gsub i{font-style:normal;color:var(--acc)}
  .rg{fill:none;stroke:#1b1b1b;stroke-width:1;stroke-dasharray:2 7}
  .rl{font-size:6.8px;letter-spacing:.13em;fill:#585858}
  .ge{fill:none;stroke-linecap:round;stroke-opacity:.55;transition:stroke-opacity .09s linear}
  .ge.off{stroke-opacity:.10}
  .ge.am{stroke-opacity:.95}
  .ge.dim{stroke-opacity:.10}
  .ge.hi{stroke-opacity:.95}
  .nd{pointer-events:all;cursor:pointer}
  .nd text{font-family:var(--mono);letter-spacing:.02em}
  .nd .nl{transition:stroke-width .08s linear}
  .nd.dim{opacity:.3}
  .nd:hover .nl,.nd.hv .nl,.nd.on .nl{stroke-width:2.2}
  /* the legend, boxed in a rail of its own, so no node or label is drawn under it */
  .gleg{position:absolute;right:0;top:0;bottom:0;width:138px;border-left:1px solid var(--line2);
        background:rgba(3,3,3,.94);padding:5px 7px 4px;z-index:5}
  .gleg .lgh{font-size:6.5px;letter-spacing:.16em;color:var(--tx3);border-bottom:1px solid var(--line);
             padding-bottom:2px;margin-bottom:3px}
  .gleg .lgr{display:flex;align-items:center;gap:5px;font-size:7.5px;letter-spacing:.05em;
             color:var(--tx2);line-height:1.5;white-space:nowrap}
  .gleg .lgr i{width:6px;height:6px;flex:0 0 6px;display:block}
  .gleg .lgr i.sw{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:transparent;
                  border:1.5px solid var(--warn)}
  .gleg .lgr i.sw.d{border-style:dashed;border-width:1.4px}
  .gleg .lgr i.sw.p{border-style:dotted;border-width:1.2px;opacity:.62}
  .gleg .lgr i.sw.g{border-color:#2c2c2c;border-width:1px}
  .gleg .lgr span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
  .gleg .lgr b{color:var(--tx);font-weight:700}
  .gleg .lgr.off{opacity:.42}
  .gleg .lgr b.a{color:var(--warn)}
  .gleg .lgf{display:flex;justify-content:space-between;font-size:6.5px;letter-spacing:.14em;
             color:var(--tx3);border-top:1px solid var(--line);margin-top:3px;padding-top:2px}
  .gleg .lgf b{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .gleg .lgf.w b{color:var(--warn)}
  .gleg .lgrg{display:flex;justify-content:space-between;font-size:7.5px;letter-spacing:.05em;
              color:var(--tx3);line-height:1.5}
  .gleg .lgrg b{color:var(--tx);font-weight:700}

  /* the selected node, seven short rows, no paragraphs */
  #b_sel{padding:5px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .srow{display:flex;gap:6px;align-items:baseline;min-width:0;line-height:1.25}
  .sk{flex:0 0 52px;font-size:7px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase}
  .sv{flex:1 1 auto;min-width:0;font-size:9px;color:var(--tx);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
  .sv.tk{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .sv.dm{color:var(--tx2)}
  .sv.wr{color:var(--warn)}
  .sv.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--ui);
           font-size:9.5px;color:var(--tx2);line-height:1.25}
  .sk.sk2{flex:0 0 auto;color:var(--tx3)}
  .tag2{flex:0 0 auto;font-size:6.5px;letter-spacing:.08em;color:var(--warn);border:1px solid #4a3810;
        padding:0 2px;border-radius:1px;line-height:1.3}

  /* states */
  .fail{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--down);color:var(--down);
        font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .fail b{font-weight:700}
  .emp{margin:5px 8px;padding:4px 6px;border-left:2px solid var(--line2);color:var(--tx3);
       font-size:8.5px;line-height:1.4;letter-spacing:.03em;text-transform:uppercase}
  .emp b{color:var(--tx2);font-weight:600}

  /* the claim, permanent and one line */
  .claim{flex:0 0 auto;padding:3px 9px 4px;border-top:1px solid var(--line);font-size:8px;
         letter-spacing:.02em;color:var(--tx3);line-height:1.35}

  /* honest web research bar: a disabled field, styled to match, that says the truth */
  .sbar{display:flex;align-items:center;gap:9px;padding:4px 12px;background:#050505;
        border-top:1px solid var(--line2);flex:0 0 auto;min-width:0}
  .sbar .sl{font-size:7px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap}
  .sbar input.wq{flex:1 1 auto;min-width:0;max-width:520px;background:#0a0a0a;color:var(--tx3);
                 border:1px dashed var(--line2);border-radius:2px;padding:3px 8px;
                 font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;cursor:not-allowed}
  .sbar input.wq::placeholder{color:#5a5a5a}
  .sbar .sn{font-size:7.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;align-items:center;gap:10px;padding:2px 12px;background:var(--bg2);
        border-top:1px solid var(--line2);color:var(--tx3);font-size:7.5px;letter-spacing:.08em;
        flex:0 0 auto;min-width:0}
  .foot .sp{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="panel">

  <div class="controls">
    <span class="cl2">COMPANY</span>
    <input class="qin" id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="centre company: ticker or name" aria-label="centre company: ticker or name">
    <span class="cl2">ACT</span>
    <select class="psel" id="pol" aria-label="Act to trace through the map"></select>
    <span class="hint">PICK THE CENTRE, THEN THE ACT</span>
    <div class="sug" id="sug"></div>
  </div>

  <div class="grid">
    <div class="card" id="c_rel">
      <div class="ch">
        <span class="cl">RELATIONSHIP MAP</span>
        <div class="cgrp" id="c_hop">
          <span class="cl2">DEPTH</span>
          <button class="kn hp" type="button" data-hop="1" aria-pressed="true">1 HOP</button>
          <button class="kn hp" type="button" data-hop="2" aria-pressed="false">2 HOPS</button>
        </div>
        <div class="cgrp" id="c_type">
          <span class="cl2">LINKS</span>
          <button class="kn ft" type="button" data-t="customers" aria-pressed="true">CUST</button>
          <button class="kn ft" type="button" data-t="suppliers" aria-pressed="true">SUPP</button>
          <button class="kn ft" type="button" data-t="competitors" aria-pressed="true">COMP</button>
          <button class="kn ft" type="button" data-t="partners" aria-pressed="true">PART</button>
        </div>
        <div class="cgrp" id="c_view">
          <span class="cl2">VIEW</span>
          <button class="kn z" type="button" id="zout" title="zoom out" aria-label="zoom out">-</button>
          <span class="zk" id="zk">1.0x</span>
          <button class="kn z" type="button" id="zin" title="zoom in" aria-label="zoom in">+</button>
          <button class="kn" type="button" id="zrst" title="reset pan and zoom">RESET</button>
        </div>
        <span class="cm" id="m_rel"></span>
      </div>
      <div class="actbar" id="actbar"></div>
      <div class="cb" id="b_rel"></div>
      <div class="claim" id="claim">This map shows which companies an Act reaches and how far that reach travels
        through recorded links; it is not a price prediction.</div>
    </div>
    <div class="card" id="c_sel">
      <div class="ch"><span class="cl">LINK DETAIL</span><span class="cm" id="m_sel"></span></div>
      <div class="cb" id="b_sel"></div>
    </div>
  </div>

  <!-- Live web research is NOT wired in. The shell publishes window.MUTXRI_API_BASE
       and uses it for auth and quotes only: there is no search or research endpoint
       in financials_api.py, indices_api.py or auth_api.py, and no key is shipped to
       the browser. So this field is a statement, not a control: it is disabled, it
       takes no keystrokes and it calls nothing. The panel answers from the files
       named in this file's header. -->
  <div class="sbar" id="sbar">
    <span class="sl">WEB RESEARCH</span>
    <input class="wq" id="webq" type="text" disabled aria-disabled="true"
           placeholder="live web research is not wired into the terminal yet"
           title="no search endpoint and no key are shipped to this page; nothing is fetched">
    <span class="sn">this panel shows what is held on disk</span>
  </div>

  <div class="foot">
    <span id="footTk">-</span>
    <span class="sp" id="footNote"></span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var Q = new URLSearchParams(location.search);
  var EXS = ['NSE','JSE','NGX','EGX'];
  var SEC_TITLE = {rel:'RELATIONSHIP MAP', sel:'LINK DETAIL'};
  var DASH = '-';
  var AMB = '#e0a341';

  /* ---------- text, numbers ------------------------------------------ */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* the product prints no em dash and no en dash, including when the dash
     arrives inside a recorded sentence */
  function nd(s){ return String(s == null ? '' : s).replace(/[\u2013\u2014]/g, '-'); }
  function t(s){ return esc(nd(s)); }
  function isNum(v){ return v !== null && v !== undefined && v !== '' && !isNaN(Number(v)); }
  function numv(v){ return isNum(v) ? Number(v) : null; }

  /* ---------- file reads, with the read state kept -------------------- */
  var FILES = {};
  function getJSON(path){
    if(FILES[path]) return FILES[path].p;
    var rec = {ok:false, data:null, err:''};
    rec.p = fetch(path, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){ rec.ok = true; rec.data = d; return d; })
      .catch(function(e){ rec.err = nd(String((e && e.message) || e)); return null; });
    FILES[path] = rec;
    return rec.p;
  }
  function readState(path){
    var r = FILES[path];
    if(!r) return 'unread';
    return r.ok ? 'ok' : 'failed';
  }
  function sd(p){ return '../../static_data/' + p; }

  /* ---------- market index: every exchange, one list ------------------ */
  var MKT = {}, IDX = [], IDX_P = null;
  function loadIndex(){
    if(IDX_P) return IDX_P;
    IDX_P = Promise.all(EXS.map(function(ex){
      return getJSON(sd('market_' + ex + '.json')).then(function(d){
        var rows = (d && d.stocks) || [];
        rows.forEach(function(r){ r.ex = ex; });
        MKT[ex] = rows;
        return rows;
      });
    })).then(function(){
      IDX = [];
      EXS.forEach(function(ex){ (MKT[ex] || []).forEach(function(r){ IDX.push(r); }); });
      return IDX;
    });
    return IDX_P;
  }
  function findRow(tk, exHint){
    var q = String(tk == null ? '' : tk).trim().toUpperCase();
    if(!q) return null;
    var e = exHint ? String(exHint).toUpperCase() : '';
    var pool = IDX.slice();
    if(e) pool.sort(function(a, b){ return (a.ex === e ? 0 : 1) - (b.ex === e ? 0 : 1); });
    var i;
    for(i = 0; i < pool.length; i++) if(String(pool[i].ticker || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].sym || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++) if(String(pool[i].name || '').toUpperCase() === q) return pool[i];
    for(i = 0; i < pool.length; i++){
      if(String(pool[i].name || '').toUpperCase().indexOf(q) >= 0) return pool[i];
    }
    return null;
  }
  function rowTicker(r){ return String((r && (r.ticker || r.sym)) || '').toUpperCase(); }

  /* ---------- name normalising: one security per normalised name ------ */
  var SUFFIX = {plc:1, ltd:1, limited:1, group:1, holdings:1, holding:1, company:1, co:1,
                inc:1, corp:1, corporation:1, sa:1, nv:1, ag:1, the:1, public:1, 'and':1};
  function normChars(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function coreName(s){
    return normChars(s).split(' ').filter(function(w){ return w && !SUFFIX[w]; }).join(' ');
  }

  /* ---------- the search box: one input, ticker first then name ------- */
  var SUG = {rows:[], i:0, on:false};
  function rank(q){
    var s = String(q || '').trim().toUpperCase();
    if(!s) return [];
    function pass(needle){
      var out = [];
      for(var i = 0; i < IDX.length; i++){
        var r = IDX[i];
        var tk = String(r.ticker || '').toUpperCase();
        var sy = String(r.sym || '').toUpperCase();
        var nm = String(r.name || '').toUpperCase();
        var sc = -1;
        if(tk === needle || sy === needle) sc = 0;
        else if(tk.indexOf(needle) === 0) sc = 1;
        else if(sy.indexOf(needle) === 0) sc = 2;
        else if(nm.indexOf(needle) === 0) sc = 3;
        else if(tk.indexOf(needle) > 0) sc = 4;
        else if(nm.indexOf(needle) > 0) sc = 5;
        if(sc >= 0) out.push({r:r, sc:sc, len:tk.length});
      }
      out.sort(function(a, b){
        if(a.sc !== b.sc) return a.sc - b.sc;
        if(a.len !== b.len) return a.len - b.len;
        return String(a.r.ticker).localeCompare(String(b.r.ticker));
      });
      return out;
    }
    var hits = pass(s);
    if(!hits.length && s.indexOf(' ') > 0) hits = pass(s.split(/\s+/)[0]);
    return hits.slice(0, 12).map(function(x){ return x.r; });
  }

  /* ---------- 1. THE ACTS: the policy side of the panel ---------------- */
  /* The file is the only source for which companies an Act names: its own

  var LAW = {list:[], byId:{}, st:'unread', err:'', ex:'NSE'};

  /* the scope the Act itself states: its exchange, its tickers, its sectors */
  function lawScope(){
    var law = G.law;
    if(!law) return null;
    var named = (law.tickers || []).map(function(x){ return String(x).toUpperCase(); });
    var secs = (law.sectors || []).map(function(s){ return String(s).toUpperCase(); })
      .filter(function(s){ return s && s !== 'ALL SECTORS'; });
    return {ex:String(law.exchange || LAW.ex || 'NSE').toUpperCase(), named:named,
            all:named.indexOf('ALL') >= 0, secs:secs};
  }
  /* The transmission walk. Direct comes from the Act record alone: a named
     ticker on the Act's exchange, every issuer on that exchange when the
     record says ALL, or a security whose recorded sector the Act names. Hop 1
     and hop 2 come only from edges the relationship files actually carry, so a
     company with no record cannot pass anything on. */
  function trans(g){
    g.tm = null;
    var sc = lawScope();
    if(!sc) return;
    var rank = {};
    g.nodes.forEach(function(n){
      n.st = 'off'; n.why = '';
      var ex = String(n.ex || '').toUpperCase();
      var tk = String(n.tk || '').toUpperCase();
      var se = String(n.sector || '').toUpperCase();
      if(!n.listed || !tk || ex !== sc.ex) return;
      if(sc.named.indexOf(tk) >= 0){ n.st = 'direct'; n.why = 'named'; rank[n.key] = 1; return; }
      if(sc.all){ n.st = 'direct'; n.why = 'all'; rank[n.key] = 1; return; }
      if(se && sc.secs.indexOf(se) >= 0){ n.st = 'direct'; n.why = 'sector'; rank[n.key] = 1; }
    });
    var H1 = {}, H2 = {};
    g.edges.forEach(function(e){
      if(rank[e.a] === 1 && rank[e.b] == null) H1[e.b] = 1;
      if(rank[e.b] === 1 && rank[e.a] == null) H1[e.a] = 1;
    });
    Object.keys(H1).forEach(function(k){ rank[k] = 2; });
    g.edges.forEach(function(e){
      if(rank[e.a] === 2 && rank[e.b] == null) H2[e.b] = 1;
      if(rank[e.b] === 2 && rank[e.a] == null) H2[e.a] = 1;
    });
    Object.keys(H2).forEach(function(k){ rank[k] = 3; });
    var direct = [], h1 = [], h2 = [], off = [], noRec = 0;
    g.nodes.forEach(function(n){
      var r = rank[n.key];
      n.st = r === 1 ? 'direct' : (r === 2 ? 'hop1' : (r === 3 ? 'hop2' : 'off'));
      if(n.st === 'direct'){ direct.push(n); if(!n.rec) noRec++; }
      else if(n.st === 'hop1') h1.push(n);
      else if(n.st === 'hop2') h2.push(n);
      else off.push(n);
    });
    g.edges.forEach(function(e){
      var A = rank[e.a] || 9, B = rank[e.b] || 9;
      e.am = (A <= 3 && B <= 3 && Math.abs(A - B) <= 1);
    });
    var namedTk = sc.named.filter(function(x){ return x !== 'ALL'; });
    g.tm = {ex:sc.ex, all:sc.all, named:namedTk, sectors:sc.secs,
            direct:direct.length, hop1:h1.length, hop2:h2.length, off:off.length,
            directList:direct.map(function(n){ return n.tk || n.name; }),
            hop1List:h1.map(function(n){ return n.tk || n.name; }),
            hop2List:h2.map(function(n){ return n.tk || n.name; }),
            offList:off.map(function(n){ return n.tk || n.name; }),
            noRec:noRec, edgesAmber:g.edges.filter(function(e){ return e.am; }).length};
    g.tm.msg = transMsg(g.tm);
  }
  function transMsg(tm){
    if(tm.direct) return '';
    var s = 'THIS ACT NAMES NO SECURITY ON THIS MAP';
    if(!tm.named.length && !tm.all){
      return s + ': ITS RECORD NAMES NO TICKER, ONLY SECTORS ' +
        (tm.sectors.length ? tm.sectors.join(' ') : 'NONE');
    }
    if(tm.all && !tm.named.length){
      return s + ': IT NAMES EVERY ' + tm.ex + ' ISSUER AND NO ' + tm.ex +
        ' ISSUER IS DRAWN HERE';
    }
    var tk = tm.named.slice(0, 4).join(' ') + (tm.named.length > 4 ? ' +' + (tm.named.length - 4) : '');
    var se = tm.sectors.length ? tm.sectors.join(' ') : 'NONE';
    return s + ': ITS TICKERS ' + tk + ' AND ITS SECTORS ' + se + ' ARE NOT DRAWN HERE';

  /* ---------- 2. THE MAP --------------------------------------------- */
  /* A link is drawn only where a relationship file records one. All four
     exchange files are read, so a chain can cross boards. The walk is the
     selected security, then the companies its record names (hop 1), then at two
     hops the links those companies carry themselves (hop 2). No peer set is
     generated and nothing is read off a sector label. */
  var REL = {}, RELF = {}, REL_ST = {}, RECBY = null, CORE2ROW = null;
  var G = {hops:1, types:{customers:true, suppliers:true, competitors:true, partners:true},
           cap:25, selKey:'', last:null, row:null, rec:null, law:null, tm:null};

  function relTypes(){
    return [
      {k:'customers', c:'#33e29a', n:'CUSTOMERS'},
      {k:'suppliers', c:'#6ea8fe', n:'SUPPLIERS'},
      {k:'competitors', c:'#f87171', n:'COMPETITORS'},
      {k:'partners', c:'#c08cff', n:'PARTNERS'}
    ];
  }
  function typeOf(k){
    var a = relTypes();
    for(var i = 0; i < a.length; i++){ if(a[i].k === k) return a[i]; }
    return {k:k, c:'#6a6a6a', n:String(k || '').toUpperCase()};
  }
  function typeLabel(k){
    var n = typeOf(k).n;
    return n.charAt(0) + n.slice(1).toLowerCase();
  }
  function typeOrder(k){
    var a = relTypes();
    for(var i = 0; i < a.length; i++){ if(a[i].k === k) return i; }
    return 9;
  }
  function activeTypes(){
    return relTypes().filter(function(tp){ return G.types[tp.k]; });
  }
  function rowForTicker(ex, tk){
    var pool = MKT[ex] || [], want = String(tk || '').toUpperCase();
    for(var i = 0; i < pool.length; i++){ if(rowTicker(pool[i]) === want) return pool[i]; }
    return null;
  }
  function buildRelIndex(){
    if(RECBY) return;
    RECBY = {};
    CORE2ROW = {};
    IDX.forEach(function(r){
      var c = coreName(r.name);
      if(c && !CORE2ROW[c]) CORE2ROW[c] = r;
    });
    EXS.forEach(function(ex){
      var secs = REL[ex] || {};
      Object.keys(secs).forEach(function(k){
        var c = coreName((secs[k] && secs[k].name) || k);
        if(!c) return;
        if(!RECBY[c]) RECBY[c] = [];
        RECBY[c].push({ex:ex, key:k});
      });
    });
  }
  function identOf(name){
    var c = coreName(name);
    if(!c) return null;
    var hit = RECBY[c];
    if(hit && hit.length){
      var h = hit[0];
      var rec = (REL[h.ex] || {})[h.key] || null;
      var rr = rowForTicker(h.ex, h.key);
      return {key:'R:' + h.ex + ':' + h.key, ex:h.ex, tk:String(h.key).toUpperCase(),
              name:((rec && rec.name) || name), rec:rec, row:rr, listed:!!rr,
              sector:(rr && rr.sector) || ''};
    }
    var row = CORE2ROW[c];
    if(row){
      var tk = rowTicker(row);
      var own = (REL[row.ex] || {})[tk] || null;
      return {key:'L:' + row.ex + ':' + tk, ex:row.ex, tk:tk, name:(row.name || name),
              rec:own, row:row, listed:true, sector:row.sector || ''};
    }
    return {key:'U:' + c, ex:'', tk:'', name:String(name || ''), rec:null, row:null,
            listed:false, sector:''};
  }
  function srcLabel(e){
    var s = (e && e.source) || {};
    if(s.site) return String(s.site) + (s.retrieved ? ' ' + s.retrieved : '');
    if(s.file) return String(s.file).split('/').pop() + (s.page ? ' p' + s.page : '');
    return '';
  }
  function linkList(rec){
    var out = [];
    activeTypes().forEach(function(tp){
      (rec[tp.k] || []).forEach(function(e){ out.push({e:e, type:tp.k}); });
    });
    return out;
  }
  function buildGraph(row, rec){
    var nodes = [], byKey = {}, edges = [], trunc = 0;
    var centre = {key:'C:' + row.ex + ':' + rowTicker(row), depth:0, name:row.name || rowTicker(row),
                  ex:row.ex, tk:rowTicker(row), listed:true, rec:rec, types:[],
                  sector:row.sector || '', reason:'selected security', src:''};
    nodes.push(centre);
    byKey[centre.key] = centre;

    function add(name, depth, type, parent){
      var id = identOf(name);
      if(!id) return null;
      if(id.ex && id.ex === centre.ex && String(id.tk) === String(centre.tk)) return null;
      var have = byKey[id.key];
      if(have){
        if(type && have.types.indexOf(type) < 0) have.types.push(type);
        return have;
      }
      if(nodes.length - 1 >= G.cap){ trunc++; return null; }
      var n = {key:id.key, depth:depth, name:id.name, ex:id.ex, tk:id.tk, listed:id.listed,
               rec:id.rec, types:(type ? [type] : []), parent:parent || null,
               sector:id.sector || '', reason:'', src:''};
      nodes.push(n);
      byKey[n.key] = n;
      return n;
    }

    if(rec){
      linkList(rec).forEach(function(link){
        var n = add(link.e && link.e.name, 1, link.type, centre);
        if(!n || n.depth !== 1) return;
        if(!n.reason){
          n.reason = String((link.e && (link.e.role || link.e.note)) || '');
          n.src = srcLabel(link.e);
        }
        edges.push({a:centre.key, b:n.key, type:link.type, depth:1});
      });
    }
    var hop1 = nodes.filter(function(n){ return n.depth === 1; });
    if(G.hops > 1){
      hop1.forEach(function(p){
        if(!p.rec) return;
        linkList(p.rec).forEach(function(link){
          var n = add(link.e && link.e.name, 2, link.type, p);
          if(!n || n.depth !== 2) return;
          if(!n.reason){
            n.reason = String((link.e && (link.e.role || link.e.note)) || '');
            n.src = srcLabel(link.e);
          }
          edges.push({a:p.key, b:n.key, type:link.type, depth:2});
        });
      });
    }
    return {nodes:nodes, edges:edges, centre:centre, trunc:trunc, tm:null};
  }
  /* The map is read the way the Bloomberg relationship map is read: one focal
     node, counterparties on concentric rings by hop, curved links with an
     arrowhead at the target end. Radii, arrow direction and the hop of every
     node come from the graph build above, so a link is still drawn only where a
     record names it. */
  var R_CTR = 24, R_L1 = 4.8, R_L2 = 3.8;
  var MAP = {k:1, x:0, y:0, drag:false, moved:false, sx:0, sy:0, ox:0, oy:0, svg:null};

  function mapGeo(w, h){
    var legW = w >= 460 ? 138 : 0;
    var mapW = Math.max(180, w - legW);
    var padT = 14, padB = 30;
    return {cx: mapW / 2, cy: padT + Math.max(48, h - padT - padB) / 2, legW: legW, mapW: mapW,
            maxRx: Math.max(56, Math.min(mapW / 2 - 22, w / 2 - 22)),
            maxRy: Math.max(38, (h - padT - padB) / 2)};
  }
  function layoutRings(g, w, h){
    var geo = mapGeo(w, h), cx = geo.cx, cy = geo.cy;
    g.centre.tx = cx;
    g.centre.ty = cy;
    g.centre.ang = -Math.PI / 2;
    var hop1 = g.nodes.filter(function(n){ return n.depth === 1; });
    var hop2 = g.nodes.filter(function(n){ return n.depth === 2; });
    hop1.sort(function(a, b){
      var d = typeOrder(a.types[0]) - typeOrder(b.types[0]);
      return d || String(a.code || '').localeCompare(String(b.code || ''));
    });
    var ryCap = geo.maxRy * 0.95;
    var rx1, ry1, rx2 = 0, ry2 = 0, aspect = 0.55;
    if(hop2.length){
      rx2 = Math.min(geo.maxRx, Math.max(200, hop2.length * 15, hop1.length * 20));
      ry2 = Math.max(50, Math.min(ryCap, rx2 * 0.55));
      aspect = ry2 / rx2;
      rx1 = Math.min(rx2 * 0.58, Math.max(150, hop1.length * 18));
      ry1 = Math.max(64, Math.min(ry2 * 0.74, rx1 * aspect));
    } else {
      rx1 = Math.min(geo.maxRx, Math.max(150, hop1.length * 14, geo.maxRx * 0.74));
      ry1 = Math.max(52, Math.min(ryCap, rx1 * 0.55));
    }
    /* angles run from the left apex, which is kept clear so RING n can be
       printed on it, and each node sits in the middle of its own slot */
    var GAP = 40 * Math.PI / 180;
    function placeRing(arr, rx, ry){
      var start = Math.PI + GAP / 2;
      var step = (Math.PI * 2 - GAP) / Math.max(1, arr.length);
      arr.forEach(function(n, i){
        var ang = start + step * (i + 0.5);
        n.tx = cx + Math.cos(ang) * rx;
        n.ty = cy + Math.sin(ang) * ry;
        n.ang = ang;
      });
    }
    placeRing(hop1, rx1, ry1);
    var rings = [{i:1, rx:rx1, ry:ry1, n:hop1.length}];
    if(hop2.length){
      var pa = {};
      hop1.forEach(function(n){ pa[n.key] = n.ang; });
      hop2.sort(function(a, b){
        var x = (a.parent && pa[a.parent.key] != null) ? pa[a.parent.key] : 0;
        var y = (b.parent && pa[b.parent.key] != null) ? pa[b.parent.key] : 0;
        if(Math.abs(x - y) > 1e-9) return x - y;
        return typeOrder(a.types[0]) - typeOrder(b.types[0]);
      });
      var step = (Math.PI * 2 - GAP) / hop2.length;
      var start2 = Math.PI + GAP / 2;
      hop2.forEach(function(n, i){
        var ang = start2 + step * (i + 0.5);
        n.tx = cx + Math.cos(ang) * rx2;
        n.ty = cy + Math.sin(ang) * ry2;
        n.ang = ang;
      });
      rings.push({i:2, rx:rx2, ry:ry2, n:hop2.length});
    }
    /* a label sits outside its ring, horizontally readable, on the side of the
       node it belongs to */
    g.nodes.forEach(function(n){
      if(n.depth === 0) return;
      var c = Math.cos(n.ang || 0), s = Math.sin(n.ang || 0);
      var r = n.depth === 1 ? R_L1 : R_L2;
      n.la = 'middle';
      n.lx = n.tx;
      n.ly = n.ty - r - 5;
      if(c > 0.32){ n.la = 'start'; n.lx = n.tx + r + 4; n.ly = n.ty + 2.6; }
      else if(c < -0.32){ n.la = 'end'; n.lx = n.tx - r - 4; n.ly = n.ty + 2.6; }
      else if(s > 0){ n.ly = n.ty + r + 8.5; }
    });
    /* no two labels on the same side may stack: the label moves, the node does not */
    ['start', 'end'].forEach(function(side){
      var arr = g.nodes.filter(function(n){ return n.depth > 0 && n.la === side; });
      arr.sort(function(a, b){ return a.ly - b.ly; });
      var i;
      for(i = 1; i < arr.length; i++){
        if(arr[i].ly - arr[i - 1].ly < 8.4) arr[i].ly = arr[i - 1].ly + 8.4;
      }
      var over = arr.length ? arr[arr.length - 1].ly - (h - 15) : 0;
      if(over > 0){ for(i = 0; i < arr.length; i++) arr[i].ly -= over; }
      var under = arr.length ? (11 - arr[0].ly) : 0;
      if(under > 0){ for(i = 0; i < arr.length; i++) arr[i].ly += under; }
    });
    g.geo = {cx:cx, cy:cy, rings:rings, rCtr:R_CTR, r1:R_L1, r2:R_L2};
  }
  function radiusOf(n){
    return n.depth === 0 ? R_CTR : (n.depth === 1 ? R_L1 : R_L2);
  }
  /* the state of one node under the chosen Act: the ring it wears and how far
     the page lets it recede */
  function nodePaint(n){
    if(!G.law) return null;
    if(n.st === 'direct') return {stroke:AMB, w:2.1, dash:'', op:1, tx:'#f2f2f2'};
    if(n.st === 'hop1') return {stroke:AMB, w:1.5, dash:'3 2.4', op:.66, tx:'#c2c2c2'};
    if(n.st === 'hop2') return {stroke:'#c08a3a', w:1.1, dash:'1.4 2.4', op:.34, tx:'#888888'};
    return {stroke:'#2c2c2c', w:.9, dash:'', op:.34, tx:'#5a5a5a'};
  }
  function markersHTML(){
    var h = '<defs>';
    relTypes().forEach(function(tp){
      h += '<marker id="ar_' + tp.k + '" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" ' +
        'markerHeight="7" orient="auto"><path d="M0 0.7 L7.2 4 L0 7.3 Z" fill="' + tp.c +
        '"/></marker>';
    });
    if(G.law){
      h += '<marker id="ar_amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" ' +
        'markerHeight="7" orient="auto"><path d="M0 0.7 L7.2 4 L0 7.3 Z" fill="' + AMB +
        '"/></marker>';
    }
    return h + '</defs>';
  }
  /* a curved bezier per link, bowed so parallel links never sit on each other,
     trimmed to the rims so the arrowhead lands on the disc */
  function edgesHTML(g){
    var pos = {};
    g.nodes.forEach(function(n){ pos[n.key] = n; });
    var pairCount = {}, pairIdx = {}, out = '';
    g.edges.forEach(function(e){
      var k = e.a < e.b ? e.a + '|' + e.b : e.b + '|' + e.a;
      e.pk = k;
      pairCount[k] = (pairCount[k] || 0) + 1;
    });
    g.edges.forEach(function(e){
      var a = pos[e.a], b = pos[e.b];
      if(!a || !b || a.tx == null || b.tx == null) return;
      var ra = radiusOf(a), rb = radiusOf(b);
      var dx = b.tx - a.tx, dy = b.ty - a.ty;
      var L = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / L, ny = dx / L;
      var idx = pairIdx[e.pk] = (pairIdx[e.pk] == null ? 0 : pairIdx[e.pk] + 1);
      var sign = idx % 2 ? -1 : 1;
      var bend = Math.min(96, Math.max(14, L * 0.24)) * sign * (1 + Math.floor(idx / 2) * 0.55);
      var mx = (a.tx + b.tx) / 2 + nx * bend;
      var my = (a.ty + b.ty) / 2 + ny * bend;
      var d1 = Math.sqrt((mx - a.tx) * (mx - a.tx) + (my - a.ty) * (my - a.ty)) || 1;
      var x1 = a.tx + (mx - a.tx) / d1 * (ra + 2);
      var y1 = a.ty + (my - a.ty) / d1 * (ra + 2);
      var d2 = Math.sqrt((mx - b.tx) * (mx - b.tx) + (my - b.ty) * (my - b.ty)) || 1;
      var x2 = b.tx + (mx - b.tx) / d2 * (rb + 4.5);
      var y2 = b.ty + (my - b.ty) / d2 * (rb + 4.5);
      var cnt = pairCount[e.pk];
      var wd = Math.min(2.3, 0.9 + 0.3 * (cnt - 1));
      var stroke = typeOf(e.type).c, mk = 'url(#ar_' + t(e.type) + ')';
      var cls = 'ge';
      if(G.law){
        if(e.am){
          stroke = AMB;
          wd = Math.max(1.6, wd * 1.55);
          mk = 'url(#ar_amber)';
          cls += ' am';
        } else {
          cls += ' off';
        }
      }
      out += '<path class="' + cls + '" data-a="' + t(e.a) + '" data-b="' + t(e.b) + '" d="M' +
        x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' +
        x2.toFixed(1) + ' ' + y2.toFixed(1) + '" fill="none" stroke="' + stroke +
        '" stroke-width="' + wd.toFixed(2) + '" marker-end="' + mk + '"/>';
    });
    return out;
  }
  function nodesHTML(g){
    var out = '';
    g.nodes.forEach(function(n){
      if(n.depth === 0) return;
      var p = nodePaint(n);
      var st = (G.law && n.st) ? n.st : 'free';
      var col = p ? p.stroke : typeOf(n.types[0]).c;
      var sw = p ? p.w : 1;
      var dash = (p && p.dash) ? ' stroke-dasharray="' + p.dash + '"' : '';
      var tcol = p ? p.tx : (n.depth === 1 ? '#a8a8a8' : '#7a7a7a');
      var lbl = String(n.code || n.tk || '');
      var r = n.depth === 1 ? R_L1 : R_L2;
      var title = n.name + (n.ex ? ' ' + n.ex : '') + (n.tk ? ' ' + n.tk : '') +
        (n.reason ? ' | ' + n.reason : '') + (n.src ? ' | ' + n.src : '');
      out += '<g class="nd st-' + st + '" data-k="' + t(n.key) + '" data-d="' + n.depth +
        '" data-st="' + st + '"' + (p ? ' opacity="' + p.op + '"' : '') + '>' +
        '<title>' + t(title) + '</title>' +
        '<circle cx="' + n.tx.toFixed(1) + '" cy="' + n.ty.toFixed(1) + '" r="' +
        (r + 5).toFixed(1) + '" fill="transparent" stroke="none"/>' +
        '<circle class="nl" cx="' + n.tx.toFixed(1) + '" cy="' + n.ty.toFixed(1) + '" r="' + r +
        '" fill="#050505" stroke="' + col + '" stroke-width="' + sw + '"' + dash + '/>' +
        '<text x="' + n.lx.toFixed(1) + '" y="' + n.ly.toFixed(1) + '" text-anchor="' + n.la +
        '" font-size="' + (n.depth === 1 ? 7.6 : 7) + '" fill="' + tcol + '">' + t(lbl) +
        '</text></g>';
    });
    /* the focal node: a filled disc with a coloured ring, big enough to carry
       the ticker inside and the company name under it */
    var c = g.centre;
    var cp = nodePaint(c);
    var cst = (G.law && c.st) ? c.st : 'free';
    var cCol = cp ? cp.stroke : '#33e29a';
    var cW = cp ? (cp.w + 0.2) : 1.6;
    var cDash = (cp && cp.dash) ? ' stroke-dasharray="' + cp.dash + '"' : '';
    var cTxt = cp ? cp.tx : '#33e29a';
    var cFill = (cp && c.st === 'off') ? '#0a0a0a' : '#071710';
    var lbl = String(c.tk || '');
    var fs = lbl.length <= 5 ? 10.5 : (lbl.length <= 8 ? 8.6 : 7.2);
    var nm = String(c.name || '');
    var nmS = nm.length > 30 ? nm.slice(0, 29) + '.' : nm;
    out += '<g class="nd ct st-' + cst + '" data-k="' + t(c.key) + '" data-d="0" data-st="' +
      cst + '"' + (cp ? ' opacity="' + cp.op + '"' : '') + '>' +
      '<title>' + t(nm + ' ' + c.ex + ' ' + lbl) + '</title>' +
      '<circle cx="' + c.tx.toFixed(1) + '" cy="' + c.ty.toFixed(1) + '" r="' + (R_CTR + 6) +
      '" fill="none" stroke="' + ((cp && c.st === 'off') ? '#222' : '#1f4f3c') +
      '" stroke-width="1" stroke-dasharray="2 3"/>' +
      '<circle class="nl" cx="' + c.tx.toFixed(1) + '" cy="' + c.ty.toFixed(1) + '" r="' + R_CTR +
      '" fill="' + cFill + '" stroke="' + cCol + '" stroke-width="' + cW + '"' + cDash + '/>' +
      '<text x="' + c.tx.toFixed(1) + '" y="' + (c.ty + 3.6).toFixed(1) +
      '" text-anchor="middle" font-size="' + fs + '" font-weight="700" fill="' + cTxt + '">' +
      t(lbl) + '</text>' +
      '<text x="' + c.tx.toFixed(1) + '" y="' + (c.ty + R_CTR + 13).toFixed(1) +
      '" text-anchor="middle" font-size="7.4" fill="' + (cp && c.st === 'off' ? '#5a5a5a' : '#8a8a8a') +
      '">' + t(nmS) + '</text></g>';
    return out;
  }
  function legendHTML(g){
    var counts = {};
    g.nodes.forEach(function(n){
      if(n.depth === 0) return;
      var k = n.types[0] || '';
      counts[k] = (counts[k] || 0) + 1;
    });
    var h = '<div class="lgh">LEGEND</div>';
    relTypes().forEach(function(tp){
      h += '<div class="lgr' + (G.types[tp.k] ? '' : ' off') + '"><i style="background:' + tp.c +
        '"></i><span>' + tp.n + '</span><b>' + (counts[tp.k] || 0) + '</b></div>';
    });
    h += '<div class="lgf"><span>NODES</span><b>' + g.nodes.length + '</b></div>' +
      '<div class="lgf"><span>EDGES</span><b>' + g.edges.length + '</b></div>';
    if(G.law && g.tm){
      h += '<div class="lgh" style="margin-top:5px">TRANSMISSION</div>' +
        '<div class="lgr"><i class="sw"></i><span>DIRECT</span><b class="a">' + g.tm.direct + '</b></div>' +
        '<div class="lgr"><i class="sw d"></i><span>1 LINK</span><b class="a">' + g.tm.hop1 + '</b></div>' +
        '<div class="lgr"><i class="sw p"></i><span>2 LINKS</span><b class="a">' + g.tm.hop2 + '</b></div>' +
        '<div class="lgr"><i class="sw g"></i><span>UNAFFECTED</span><b>' + g.tm.off + '</b></div>' +
        '<div class="lgf w"><span>SCOPE</span><b>' + t(g.tm.ex) + '</b></div>';
      if(g.tm.noRec){
        h += '<div class="lgf w"><span>NO RECORD</span><b>' + g.tm.noRec + ' DIRECT</b></div>';
      }
    }
    if(g.geo && g.geo.rings && g.geo.rings.length){
      h += '<div class="lgh" style="margin-top:6px">RINGS</div>';
      g.geo.rings.forEach(function(r){
        h += '<div class="lgrg"><span>RING ' + r.i + '</span><b>' + r.n + '</b></div>';
      });
    }
    return h;
  }
  function graphSVG(g, w, h){
    layoutRings(g, w, h);
    var geo = g.geo;
    var out = markersHTML() + '<g class="gv">';
    geo.rings.forEach(function(r){
      out += '<ellipse class="rg" cx="' + geo.cx.toFixed(1) + '" cy="' + geo.cy.toFixed(1) +
        '" rx="' + r.rx.toFixed(1) + '" ry="' + r.ry.toFixed(1) + '"/>' +
        '<text class="rl" x="' + (geo.cx - r.rx - 4).toFixed(1) + '" y="' +
        (geo.cy + 2.5).toFixed(1) + '" text-anchor="end">RING ' + r.i + '</text>';
    });
    out += edgesHTML(g);
    out += nodesHTML(g);
    return out + '</g>';
  }
  function codeFor(g){
    var used = {};
    g.nodes.forEach(function(n){
      if(n.depth === 0){ n.code = n.tk; return; }
      var c = n.tk;
      if(!c){
        var words = String(n.name || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').split(' ')
          .filter(function(w){ return w && w.length > 1; });
        if(!words.length) c = '?';
        else if(words.length === 1) c = words[0].slice(0, 6);
        else {
          var ini = words.map(function(w){ return w.charAt(0); }).join('');
          c = ini.length >= 2 ? ini.slice(0, 5) : words[0].slice(0, 6);
        }
      }
      if(used[c]){ used[c]++; c = c + used[c]; }
      else used[c] = 1;
      n.code = c;
    });
  }
  function filesLine(){
    var ok = [], bad = [];
    EXS.forEach(function(ex){ (REL_ST[ex] === 'ok' ? ok : bad).push(ex); });
    return 'FILES ' + (ok.length ? ok.join(' ') : 'NONE') +
      (bad.length ? ' | <b>' + bad.join(' ') + ' NOT READ</b>' : '');
  }
  function graphSub(g){
    var n1 = 0, n2 = 0;
    g.nodes.forEach(function(n){ if(n.depth === 1) n1++; else if(n.depth === 2) n2++; });
    var s = 'HOP ' + G.hops + ' | ' + n1 + ' FIRST' + (G.hops > 1 ? ' + ' + n2 + ' SECOND' : '') +
      ' | CAP ' + G.cap + ' NODES';
    if(g.trunc) s += ' | <b>' + g.trunc + ' DROPPED AT CAP</b>';
    return s + ' | ' + filesLine();
  }
  function markNode(svg){
    if(!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.nd'), function(el){
      if(el.getAttribute('data-k') === G.selKey) el.classList.add('on');
      else el.classList.remove('on');
    });
  }
  function linkedSet(g, key){
    var out = {};
    if(!g) return out;
    g.edges.forEach(function(e){
      if(e.a === key) out[e.b] = 1;
      if(e.b === key) out[e.a] = 1;
    });
    return out;
  }
  /* hover marks the edges a node actually carries and dulls the rest; the Act
     colouring is a separate class, so a hover never rewrites it */
  function hoverNode(svg, key){
    var near = linkedSet(G.last, key);
    Array.prototype.forEach.call(svg.querySelectorAll('path.ge'), function(el){
      var on = el.getAttribute('data-a') === key || el.getAttribute('data-b') === key;
      el.classList.toggle('hi', on);
      el.classList.toggle('dim', !on);
    });
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      var k = el.getAttribute('data-k');
      var on = k === key || !!near[k];
      el.classList.toggle('dim', !on);
      el.classList.toggle('hv', k === key);
    });
  }
  function clearHover(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('path.ge'), function(el){
      el.classList.remove('hi');
      el.classList.remove('dim');
    });
    Array.prototype.forEach.call(svg.querySelectorAll('g.nd'), function(el){
      el.classList.remove('dim');
      el.classList.remove('hv');
    });
  }
  function wireNodes(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('.nd'), function(el){
      var key = el.getAttribute('data-k') || '';
      el.addEventListener('mouseenter', function(){ hoverNode(svg, key); });
      el.addEventListener('mouseleave', function(){ clearHover(svg); });
      el.addEventListener('click', function(ev){
        if(MAP.moved) return;
        ev.stopPropagation();
        G.selKey = key;
        markNode(svg);
        paintSel();
      });
    });
  }
  function applyView(svg){
    if(!svg) return;
    var gv = svg.querySelector('.gv');
    if(gv){
      gv.setAttribute('transform', 'translate(' + MAP.x.toFixed(2) + ',' + MAP.y.toFixed(2) +
        ') scale(' + MAP.k.toFixed(3) + ')');
    }
    var zk = document.getElementById('zk');
    if(zk) zk.textContent = MAP.k.toFixed(1) + 'x';
  }
  function zoomAt(svg, mx, my, f){
    var k2 = Math.max(0.5, Math.min(4.5, MAP.k * f));
    if(Math.abs(k2 - MAP.k) < 0.0005) return;
    MAP.x = mx - (mx - MAP.x) * (k2 / MAP.k);
    MAP.y = my - (my - MAP.y) * (k2 / MAP.k);
    MAP.k = k2;
    applyView(svg);
  }
  function zoomBy(f){
    if(!MAP.svg) return;
    var r = MAP.svg.getBoundingClientRect();
    zoomAt(MAP.svg, (r.width || 0) / 2, (r.height || 0) / 2, f);
  }
  function resetView(){
    MAP.k = 1;
    MAP.x = 0;
    MAP.y = 0;
    applyView(MAP.svg);
  }
  var PAN_WIRED = false;
  function wirePan(svg){
    if(!PAN_WIRED){
      PAN_WIRED = true;
      document.addEventListener('mousemove', function(ev){
        if(!MAP.drag || !MAP.svg) return;
        var dx = ev.clientX - MAP.sx, dy = ev.clientY - MAP.sy;
        if(Math.abs(dx) > 3 || Math.abs(dy) > 3) MAP.moved = true;
        if(!MAP.moved) return;
        MAP.x = MAP.ox + dx;
        MAP.y = MAP.oy + dy;
        applyView(MAP.svg);
      });
      document.addEventListener('mouseup', function(){
        if(!MAP.drag) return;
        MAP.drag = false;
        if(MAP.svg) MAP.svg.classList.remove('drag');
      });
    }
    if(!svg) return;
    svg.addEventListener('mousedown', function(ev){
      if(ev.button !== 0) return;
      MAP.drag = true;
      MAP.moved = false;
      MAP.sx = ev.clientX;
      MAP.sy = ev.clientY;
      MAP.ox = MAP.x;
      MAP.oy = MAP.y;
      MAP.svg = svg;
      svg.classList.add('drag');
    });
    svg.addEventListener('wheel', function(ev){
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      zoomAt(svg, ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, {passive:false});
  }

  /* ---------- 3. THE NODE THE READER PINNED -------------------------- */
  function actBasis(n){
    if(!G.law || !n || !n.st) return '';
    if(n.st === 'direct'){
      if(n.why === 'named') return 'DIRECT, NAMED BY ACT';
      if(n.why === 'all') return 'DIRECT, ACT NAMES ALL ' + ((G.tm && G.tm.ex) || '') + ' ISSUERS';
      return 'DIRECT, SECTOR NAMED BY ACT';
    }
    if(n.st === 'hop1') return 'HOP 1, ONE RECORDED LINK FROM A DIRECT COMPANY';
    if(n.st === 'hop2') return 'HOP 2, ONE LINK FURTHER, DIMMER';
    return 'NOT REACHED BY THIS ACT';
  }
  function paintSel(){
    var box = document.getElementById('b_sel');
    if(!box) return;
    var g = G.last, n = null, i;
    if(g && G.selKey){
      for(i = 0; i < g.nodes.length; i++){ if(g.nodes[i].key === G.selKey){ n = g.nodes[i]; break; } }
    }
    if(!n){
      box.innerHTML = '<div class="emp"><b>NO NODE PINNED</b> click a node on the map</div>';
      meta('sel', DASH);
      return;
    }
    var tk = n.tk || 'UNLISTED';
    var ex = n.ex || 'NOT IN TERMINAL';
    var link = n.depth === 0 ? 'SELECTED SECURITY'
      : (typeLabel(n.types[0]) + (n.types.length > 1 ? ' +' + (n.types.length - 1) : ''));
    var h = '';
    h += '<div class="srow"><span class="sk">NAME</span><span class="sv clip" title="' +
      t(n.name) + '">' + t(n.name) + '</span></div>';
    h += '<div class="srow"><span class="sk">TICKER</span><span class="sv tk">' + t(tk) + '</span>' +
      '<span class="sk sk2">' + t(ex) + '</span></div>';
    h += '<div class="srow"><span class="sk">LINK</span><span class="sv ' +
      (n.depth === 0 ? 'dm' : 'wr') + '">' + t(link) + '</span>' +
      '<span class="sk sk2">HOP ' + n.depth + '</span></div>';
    if(G.law){
      h += '<div class="srow"><span class="sk">ACT</span><span class="sv ' +
        (n.st === 'direct' ? 'wr' : 'dm') + '" title="' + t(actBasis(n)) + '">' +
        t(actBasis(n)) + '</span></div>';
    }
    h += '<div class="srow"><span class="sk">REASON</span><span class="sv clip" title="' +
      t(n.reason || '') + '">' + t(n.reason || 'none recorded') + '</span></div>';
    h += '<div class="srow"><span class="sk">SOURCE</span><span class="sv dm" title="' +
      t(n.src || '') + '">' + t(n.src || DASH) + '</span></div>';
    if(n.rec){
      var cnt = 0;
      ['customers', 'suppliers', 'competitors', 'partners'].forEach(function(k){
        cnt += (n.rec[k] || []).length;
      });
      h += '<div class="srow"><span class="sk">RECORD</span><span class="sv dm">' + cnt +
        ' LINKS ON FILE</span></div>';
    } else if(G.law && (n.st === 'direct' || n.st === 'hop1' || n.st === 'hop2')){
      h += '<div class="srow"><span class="sk">RECORD</span><span class="sv wr">' +
        'NONE ON FILE, SO NOTHING PROPAGATES FROM IT</span></div>';
    }
    box.innerHTML = h;
    meta('sel', 'HOP ' + n.depth + ' | ' + (n.ex || 'UNLISTED'));
  }

  /* ---------- 4. DRAW ------------------------------------------------ */
  function renderGraph(box, row){
    var g = buildGraph(row, G.rec);
    codeFor(g);
    trans(g);
    G.tm = g.tm;
    box.innerHTML = '<div class="gwrap"></div>' +
      '<div class="gsub" id="gsub">' + graphSub(g) + '</div>';
    var wrap = box.querySelector('.gwrap');
    var run = function(){
      var r = wrap.getBoundingClientRect();
      var w = Math.round(r.width || box.clientWidth || 600);
      var hh = Math.round(r.height || box.clientHeight || 260);
      if(w < 60 || hh < 60) return;
      layoutRings(g, w, hh);
      wrap.innerHTML = '<svg class="gsvg" viewBox="0 0 ' + w + ' ' + hh + '" width="' + w +
        '" height="' + hh + '">' + graphSVG(g, w, hh) + '</svg>';
      var svg = wrap.querySelector('.gsvg');
      var leg = document.createElement('div');
      leg.className = 'gleg';
      leg.id = 'gleg';
      leg.innerHTML = legendHTML(g);
      wrap.appendChild(leg);
      MAP.svg = svg;
      applyView(svg);
      wirePan(svg);
      wireNodes(svg);
      markNode(svg);
      G.last = g;
    };
    run();
    PAINT.rel = run;
    G.last = g;
    meta('rel', g.nodes.length + ' NODES | ' + g.edges.length + ' LINKS' +
      (G.law && g.tm ? ' | ' + g.tm.direct + ' DIRECT' : ''));
    paintSel();
    paintAct();
  }
  function drawRel(box, row, relFile, rec){
    G.row = row;
    G.rec = rec;
    G.selKey = '';
    G.last = null;
    G.tm = null;
    /* a new security opens at the whole map, not at the last zoom */
    MAP.k = 1;
    MAP.x = 0;
    MAP.y = 0;
    var path = sd('relationships_' + row.ex + '.json');
    if(readState(path) === 'failed' || !relFile){
      box.innerHTML = failBox('RELATIONSHIPS', 'relationships_' + row.ex + '.json not loaded');
      meta('rel', 'FILE NOT READ');
      paintSel();
      paintAct();
      return;
    }
    buildRelIndex();
    if(!rec){
      var cov = relFile.coverage || {};
      var secs = relFile.securities || {};
      var withOne = isNum(cov.securitiesWithSourcedEntity) ? Number(cov.securitiesWithSourcedEntity)
                                                          : Object.keys(secs).length;
      var listed = isNum(cov.securitiesListed) ? Number(cov.securitiesListed) : null;
      box.innerHTML = '<div class="gwrap"><svg class="gsvg"></svg></div>' +
        '<div class="gsub" id="gsub"><b>NO RECORD</b> | ' + withOne + (listed != null ? ' OF ' + listed : '') +
        ' ' + t(row.ex) + ' SECURITIES CARRY A SOURCED RECORD | ' + filesLine() + '</div>';
      var svg0 = box.querySelector('.gsvg');
      var run0 = function(){
        var r = svg0.getBoundingClientRect();
        var w = Math.round(r.width || box.clientWidth || 600);
        var hh = Math.round(r.height || (box.clientHeight - 18) || 220);
        svg0.setAttribute('viewBox', '0 0 ' + w + ' ' + hh);
        svg0.innerHTML = '<circle cx="' + (w / 2) + '" cy="' + (hh / 2) + '" r="24" fill="#0a1c15" ' +
          'stroke="#33e29a" stroke-width="1.5"/><text x="' + (w / 2) + '" y="' + (hh / 2 + 4) +
          '" text-anchor="middle" font-size="11" font-weight="700" fill="#33e29a">' +
          t(rowTicker(row)) + '</text>';
      };
      run0();
      PAINT.rel = run0;
      meta('rel', '0 NODES | 0 LINKS');
      paintSel();
      paintAct();
      return;
    }
    var count = activeTypes().reduce(function(a, tp){ return a + (rec[tp.k] || []).length; }, 0);
    var total = relTypes().reduce(function(a, tp){ return a + (rec[tp.k] || []).length; }, 0);
    if(!total){
      box.innerHTML = empBox('EMPTY RECORD', 'the file carries ' + rowTicker(row) +
        ' but names nothing') + '<div class="gsub" id="gsub">' + filesLine() + '</div>';
      meta('rel', '0 NODES | 0 LINKS');
      paintSel();
      paintAct();
      return;
    }
    if(!count){
      box.innerHTML = empBox('FILTER HIDES EVERY LINK', 'the record carries ' + total +
        ' links, none of an active type') + '<div class="gsub" id="gsub">' + filesLine() + '</div>';
      meta('rel', '0 NODES | 0 LINKS');
      paintSel();
      paintAct();
      return;
    }
    renderGraph(box, row);
  }
  /* the controls in the map header, and the Act selector above it, are the only
     things that change the graph */
  function setHop(n){
    G.hops = n === 2 ? 2 : 1;
    var ctl = document.querySelectorAll('#c_hop .hp');
    Array.prototype.forEach.call(ctl, function(x){
      x.setAttribute('aria-pressed', Number(x.getAttribute('data-hop')) === G.hops ? 'true' : 'false');
    });
  }
  function wireGraphControls(){
    var ctl = document.querySelectorAll('#c_hop .hp');
    Array.prototype.forEach.call(ctl, function(b){
      b.addEventListener('click', function(){
        setHop(Number(b.getAttribute('data-hop')));
        redrawGraph();
      });
    });
    var flt = document.querySelectorAll('#c_type .ft');
    Array.prototype.forEach.call(flt, function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-t');
        var on = G.types[k];
        var live = relTypes().filter(function(tp){ return G.types[tp.k]; }).length;
        if(on && live <= 1) return;
        G.types[k] = !on;
        b.setAttribute('aria-pressed', G.types[k] ? 'true' : 'false');
        redrawGraph();
      });
    });
    var zo = document.getElementById('zout');
    if(zo) zo.addEventListener('click', function(){ zoomBy(1 / 1.3); });
    var zi = document.getElementById('zin');
    if(zi) zi.addEventListener('click', function(){ zoomBy(1.3); });
    var zr = document.getElementById('zrst');
    if(zr) zr.addEventListener('click', function(){ resetView(); });
    var pol = document.getElementById('pol');
    if(pol){
      pol.addEventListener('change', function(){
        G.law = LAW.byId[pol.value] || null;
        /* an Act is traced two hops out, so its reach is visible without a
           second click; the reader can put it back to one hop */
        if(G.law) setHop(2);
        redrawGraph();
        if(!G.row) paintAct();
      });
    }
  }
  function redrawGraph(){
    if(!G.row){ paintAct(); return; }
    var box = document.getElementById('b_rel');
    if(!box) return;
    guardDraw('rel', function(b){
      drawRel(b, G.row, (REL_ST[G.row.ex] === 'ok' ? RELF[G.row.ex] : null), G.rec);
    });
  }

  /* ---------- the build ---------------------------------------------- */
  var GEN = 0, CUR = null;

  function build(row){
    var gen = ++GEN;
    CUR = row;
    G.row = row;
    G.rec = null;
    G.selKey = '';
    G.last = null;
    G.tm = null;
    RECBY = null;
    PAINT = {};
    document.getElementById('footTk').textContent = rowTicker(row) + (row.ex ? '  ' + row.ex : '');
    document.getElementById('footNote').textContent = '';
    paintSel();
    paintAct();

    var ex = row.ex;
    var J = {};
    J.info = getJSON(sd('company_info.json'));
    J.rel = getJSON(sd('relationships_' + ex + '.json'));
    /* all four boards are read, so a chain can cross an exchange board */
    J.rell = EXS.map(function(e2){ return getJSON(sd('relationships_' + e2 + '.json')); });

    Promise.all([J.info, J.rel, Promise.all(J.rell)])
    .then(function(R){
      if(gen !== GEN) return;
      var relFile = R[1];

      /* what each of the four link files actually returned, kept for the panel
         to print rather than assumed */
      EXS.forEach(function(e2){
        var p = sd('relationships_' + e2 + '.json');
        REL_ST[e2] = readState(p);
        RELF[e2] = (FILES[p] && FILES[p].ok && FILES[p].data) || null;
        REL[e2] = (RELF[e2] && RELF[e2].securities) || {};
      });
      RECBY = null;

      var relRec = null;
      if(relFile && relFile.securities){
        var s = relFile.securities;
        relRec = s[row.ticker] || s[row.sym] || s[rowTicker(row)] || null;
      }

      guardDraw('rel', function(box){ drawRel(box, row, relFile, relRec); });

      var bits = [];
      if(relFile && relFile.generated) bits.push('LINKS ' + relFile.generated);
      if(LAW.list.length) bits.push('ACTS ' + LAW.list.length);
      document.getElementById('footNote').textContent = nd(bits.join('  '));
    }).catch(function(e){
      if(gen !== GEN) return;
      document.getElementById('b_rel').innerHTML =
        '<div class="fail"><b>PANEL FAILED</b> ' + t(String((e && e.message) || e)) + '</div>';
    });
  }

  function pick(row){
    if(!row) return;
    closeSug();
    var inp = document.getElementById('q');
    if(inp){ inp.value = rowTicker(row); }
    build(row);
  }

  /* ---------- wiring -------------------------------------------------- */
  wireGraphControls();
  var inp = document.getElementById('q');
  if(inp){
    inp.addEventListener('input', function(){ drawSug(inp.value); });
    inp.addEventListener('keydown', function(ev){
      var k = ev.key;
      if(k === 'Enter'){
        ev.preventDefault();
        var tok = String(inp.value || '').trim();
        if(!tok) return;
        if(SUG.on && SUG.rows.length){ pick(SUG.rows[SUG.i || 0]); return; }
        var exact = findRow(tok, null);
        if(exact){ pick(exact); return; }
        var first = rank(tok)[0];
        if(first){ pick(first); return; }
        var box = document.getElementById('sug');
        if(box){
          box.innerHTML = '<div class="sg none">NO SECURITY MATCHES "' + t(tok) + '"</div>';
          box.className = 'sug on';
        }
      } else if(k === 'ArrowDown' || k === 'ArrowUp'){
        if(!SUG.on || !SUG.rows.length) return;
        ev.preventDefault();
        var n = SUG.rows.length;
        SUG.i = (SUG.i + (k === 'ArrowDown' ? 1 : n - 1)) % n;
        Array.prototype.forEach.call(document.querySelectorAll('#sug .sg[data-i]'), function(el){
          el.className = 'sg' + (Number(el.getAttribute('data-i')) === SUG.i ? ' sel' : '');
        });
      } else if(k === 'Escape'){
        closeSug();
        inp.blur();
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(closeSug, 120); });
  }
  document.addEventListener('mousedown', function(ev){
    var box = document.getElementById('sug');
    if(box && ev.target !== inp && !box.contains(ev.target) && box.className.indexOf('on') >= 0){
      closeSug();
    }
  });

  /* the shell hands the selection over; adopting it means a panel opened from
     a watchlist click lands on that security, not on a default */
  window.__mtApplySelection = function(sel){
    if(!sel || !(sel.sym || sel.ticker)) return false;
    loadIndex().then(function(){
      var row = findRow(sel.sym || sel.ticker, sel.ex);
      if(row) pick(row);
    });
    return true;
  };
  window.addEventListener('message', function(ev){
    if(!ev || ev.origin !== location.origin) return;
    var d = ev.data;
    if(d && d.__mt === 'selection') window.__mtApplySelection(d);
  });
  function announceReady(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({__mt: 'sel-ready'}, location.origin);
      }
    }catch(e){}
  }

  /* the proof surface: what this panel believes, readable from the DOM */
  function textWords(){
    var txt = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
    return txt ? txt.split(' ').length : 0;
  }
  function selInfo(){
    var g = G.last, n = null, i;
    if(g && G.selKey){
      for(i = 0; i < g.nodes.length; i++){ if(g.nodes[i].key === G.selKey) n = g.nodes[i]; }
    }
    if(!n) return null;
    return {name:n.name, ticker:n.tk || 'UNLISTED', exchange:n.ex || 'NOT IN TERMINAL',
            hop:n.depth, link:(n.depth === 0 ? 'selected security' : typeLabel(n.types[0])),
            reason:n.reason || '', source:n.src || '', carriedRecord:!!n.rec,
            actState:n.st || '', actBasis:actBasis(n)};
  }
  window.__mtPerpState = function(){
    var g = G.last, hop1 = 0, hop2 = 0, e1 = 0, e2 = 0, cross = 0, crossEx = [];
    if(g){
      g.nodes.forEach(function(n){
        if(n.depth === 1) hop1++;
        if(n.depth === 2) hop2++;
        if(n.depth > 0 && n.ex && CUR && n.ex !== CUR.ex){
          cross++;
          crossEx.push(n.ex + ':' + (n.tk || '?'));
        }
      });
      g.edges.forEach(function(e){ if(e.depth === 1) e1++; else e2++; });
    }
    var sub = document.getElementById('gsub'), wq = document.getElementById('webq');
    var pol = document.getElementById('pol');
    var opts = pol ? Array.prototype.map.call(pol.options, function(o){
      return {value:o.value, label:o.textContent};
    }) : [];
    var law = G.law, tm = g ? g.tm : null;
    var claim = document.getElementById('claim');
    var ab = document.getElementById('actbar');
    return {
      ticker: CUR ? rowTicker(CUR) : '', ex: CUR ? CUR.ex : '', name: CUR ? nd(CUR.name || '') : '',
      policy: {
        id: law ? law.id : '', name: law ? nd(law.name || '') : '',
        year: law ? law.year : '', status: law ? law.status : '',
        mechanism: law ? nd(law.mechanism || '') : '',
        sectors: law ? (law.sectors || []) : [], tickers: law ? (law.tickers || []) : [],
        exchange: law ? String(law.exchange || LAW.ex || '') : '',
        optionCount: opts.length, options: opts,
        selected: pol ? pol.value : '',
        fileState: LAW.st
      },
      transmission: tm ? {
        ex: tm.ex, all: tm.all, named: tm.named, sectors: tm.sectors,
        direct: tm.direct, hop1: tm.hop1, hop2: tm.hop2, off: tm.off,
        directList: tm.directList, hop1List: tm.hop1List, hop2List: tm.hop2List,
        offList: tm.offList, noRec: tm.noRec, amberEdges: tm.edgesAmber, message: tm.msg,
        domDirect: document.querySelectorAll('#b_rel g.nd.st-direct').length,
        domHop1: document.querySelectorAll('#b_rel g.nd.st-hop1').length,
        domHop2: document.querySelectorAll('#b_rel g.nd.st-hop2').length,
        domOff: document.querySelectorAll('#b_rel g.nd.st-off').length,
        domAmberEdges: document.querySelectorAll('#b_rel path.ge.am').length,
        domOffEdges: document.querySelectorAll('#b_rel path.ge.off').length
      } : null,
      graph: {
        hopMode: G.hops, cap: G.cap, truncated: g ? g.trunc : 0,
        nodes: g ? g.nodes.length : 0, edges: g ? g.edges.length : 0,
        hop1: hop1, hop2: hop2, edgesHop1: e1, edgesHop2: e2,
        crossExchange: cross, crossList: crossEx,
        domNodes: document.querySelectorAll('#b_rel .nd').length,
        domEdges: document.querySelectorAll('#b_rel path.ge').length,
        bezierEdges: Array.prototype.filter.call(document.querySelectorAll('#b_rel path.ge'),
          function(p){ return String(p.getAttribute('d') || '').indexOf(' Q') > 0; }).length,
        arrowedEdges: Array.prototype.filter.call(document.querySelectorAll('#b_rel path.ge'),
          function(p){ return !!p.getAttribute('marker-end'); }).length,
        arrowheads: document.querySelectorAll('#b_rel svg marker').length,
        rings: g && g.geo ? g.geo.rings : [],
        centreRadius: g && g.geo ? g.geo.rCtr : 0,
        leafRadius: g && g.geo ? g.geo.r1 : 0,
        zoom: {k: Math.round(MAP.k * 1000) / 1000, x: Math.round(MAP.x), y: Math.round(MAP.y)},
        pinned: G.selKey,
        legendRows: Array.prototype.map.call(document.querySelectorAll('#b_rel .gleg .lgr'),
          function(el){ return el.textContent.replace(/\s+/g, ' ').trim(); }),
        legendTotals: Array.prototype.map.call(document.querySelectorAll('#b_rel .gleg .lgf'),
          function(el){ return el.textContent.replace(/\s+/g, ' ').trim(); }),
        mapControls: document.querySelectorAll('#c_rel .kn').length,
        files: EXS.map(function(ex){ return {ex: ex, state: REL_ST[ex] || 'unread'}; }),
        sub: sub ? sub.textContent : '',
        types: relTypes().filter(function(tp){ return G.types[tp.k]; }).map(function(tp){ return tp.k; })
      },
      sel: selInfo(),
      removed: {
        head: !document.getElementById('head'),
        tiles: !document.getElementById('b_strip') && document.querySelectorAll('.tile').length === 0,
        price: !document.getElementById('c_px') && !document.getElementById('b_px'),
        charts: document.querySelectorAll('.pxchart,.pxfb').length === 0 &&
                document.querySelectorAll('script[src*="unpkg"]').length === 0,
        news: !document.getElementById('c_news') && document.querySelectorAll('.ncard').length === 0,
        lawChips: !document.getElementById('c_law') && !document.getElementById('b_law') &&
                  document.querySelectorAll('.chip').length === 0,
        thesis: !document.getElementById('c_thes') && !document.getElementById('b_thes'),
        financial: !document.getElementById('c_fin') && !document.getElementById('b_fin')
      },
      actbar: ab ? ab.textContent.replace(/\s+/g, ' ').trim() : '',
      claim: claim ? claim.textContent.replace(/\s+/g, ' ').trim() : '',
      inputs: document.querySelectorAll('input').length,
      selects: document.querySelectorAll('select').length,
      enabledInputs: document.querySelectorAll('input:not([disabled])').length,
      buttons: document.querySelectorAll('button').length,
      webq: wq ? {disabled: !!wq.disabled, placeholder: wq.placeholder} : null,
      words: textWords()
    };
  };

  /* boot */
  loadLaws();
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      /* open on a security of the exchange the shell shows that carries a
         relationship record, so the first screen is a map with links */
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('KCB', 'NSE') || findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
</body>
</html>
