        if(!G.row) paintAct();
      });
    }
  }
  function redrawGraph(){
    if(!G.row){ paintAct(); return; }
    var box = document.getElementById('b_rel');
    if(!box) return;
    guardDraw('rel', function(b){
      drawRel(b, G.row, (REL_ST[G.row.ex] === 'ok' ? RELF[G.row.ex] : null), G.rec);
    });
  }

  /* ---------- 10. the build ------------------------------------ */
  var GEN = 0, CUR = null;
  function caFileFor(ex){
    if(ex === 'NSE') return 'nse_corporate_actions.json';
    if(ex === 'NGX') return 'ngx_corporate_actions.json';
    if(ex === 'JSE') return 'jse_announcements.json';
    if(ex === 'EGX') return 'egx_announcements.json';
    return ex.toLowerCase() + '_corporate_actions.json';
  }
  function histPaths(row){
    var tk = rowTicker(row), sym = String(row.sym || ''), ex = row.ex, out = [];
    if(ex === 'NSE' || ex === 'NGX') out.push(ex + '_' + tk + '.json');
    if(sym && sym !== tk) out.push(sym + '.json');
    out.push(tk + '.json');
    if(sym) out.push(sym.replace(/\./g, '_') + '.json');
    return uniq(out).map(function(f){ return sd('history/' + f); });
  }
  function balPaths(row){
    var tk = rowTicker(row), sym = String(row.sym || '');
    return uniq([tk, sym].filter(Boolean)).map(function(k){
      return sd('financials/' + k + '__balance.json');
    });
  }
  function setSourceStates(row){
    var ex = row.ex;
    DATA.idxSt = readState(sd('ex_' + ex + '_indices.json'));
    DATA.idxErr = readErr(sd('ex_' + ex + '_indices.json'));
    DATA.newsSt = readState(sd(ex.toLowerCase() + '_news.json'));
    DATA.newsErr = readErr(sd(ex.toLowerCase() + '_news.json'));
    DATA.caFile = caFileFor(ex);
    DATA.caSt = readState(sd(DATA.caFile));
    DATA.caErr = readErr(sd(DATA.caFile));
    EXS.forEach(function(e2){
      DATA.shSt[e2] = readState(sd('shareholders_' + e2 + '.json'));
      DATA.shErr[e2] = readErr(sd('shareholders_' + e2 + '.json'));
    });
    DATA.ceosSt = readState(sd('ceos.json'));
    DATA.ceosErr = readErr(sd('ceos.json'));
  }
  function normEvents(ex, raw, row){
    var tk = rowTicker(row), core = coreName(row.name);
    var div = String(row.sym || '').split('.')[0];
    var out = [];
    (raw || []).forEach(function(r){
      if(!r) return;
      var rt = String(r.ticker || '').toUpperCase();
      var nm = String(r.company || r.name || '').toLowerCase();
      var tt = String(r.title || '').toLowerCase();
      var ok;
      if(ex === 'NSE' || ex === 'NGX'){
        ok = rt === tk;
      } else {
        ok = (rt === tk) || (!!div && rt.split('.')[0] === div) ||
             (!!core && nm.indexOf(core) >= 0) || (!!core && tt.indexOf(core) >= 0);
      }
      if(!ok) return;
      out.push({date:String(r.date || r.year || ''),
                kind:String(r.kind || ((ex === 'NSE' || ex === 'NGX') ? 'EVENT' : 'ANNOUNCEMENT')),
                text:String(r.text || r.title || ''), src:String(r.src || r.url || '')});
    });
    return out;
  }
  function build(row){
    var gen = ++GEN;
    CUR = row;
    G.row = row;
    G.rec = null;
    G.selKey = '';
    G.model = null;
    G.tm = null;
    RECBY = null;
    PAINT = {};
    document.getElementById('footTk').textContent = rowTicker(row) + (row.ex ? '  ' + row.ex : '');
    document.getElementById('footNote').textContent = '';
    paintSel();
    paintAct();

    var ex = row.ex;
    var J = {};
    J.rel = getJSON(sd('relationships_' + ex + '.json'));
    J.rell = Promise.all(EXS.map(function(e2){ return getJSON(sd('relationships_' + e2 + '.json')); }));
    J.sh = Promise.all(EXS.map(function(e2){ return getJSON(sd('shareholders_' + e2 + '.json')); }));
    J.idx = getJSON(sd('ex_' + ex + '_indices.json'));
    J.news = getJSON(sd(ex.toLowerCase() + '_news.json'));
    J.ca = getJSON(sd(caFileFor(ex)));
    J.ceos = getJSON(sd('ceos.json'));
    J.ceosSrc = probeJSON([sd('ceos_sources.json')]);
    J.bal = probeJSON(balPaths(row));
    J.spark = probeJSON(histPaths(row));

    Promise.all([J.rel, J.rell, J.sh, J.idx, J.news, J.ca, J.ceos, J.ceosSrc, J.bal, J.spark])
    .then(function(R){
      if(gen !== GEN) return;
      EXS.forEach(function(e2){
        var p = sd('relationships_' + e2 + '.json');
        REL_ST[e2] = readState(p);
        RELF[e2] = (FILES[p] && FILES[p].ok && FILES[p].data) || null;
        REL[e2] = (RELF[e2] && RELF[e2].securities) || {};
      });
      RECBY = null;
      buildRelIndex();

      var relFile = R[0];
      var relRec = null;
      if(relFile && relFile.securities){
        var s = relFile.securities;
        relRec = s[row.ticker] || s[row.sym] || s[rowTicker(row)] || null;
      }

      setSourceStates(row);
      DATA.idx = (Array.isArray(R[3]) ? R[3] : []).filter(function(x){ return x && x.ticker; });
      DATA.news = (Array.isArray(R[4]) ? R[4] : []);
      DATA.ca = normEvents(ex, R[5], row);
      DATA.ceos = (R[6] && typeof R[6] === 'object' && !Array.isArray(R[6])) ? R[6] : {};
      DATA.ceosSrc = (R[7] && R[7].data) || {};
      DATA.bal = (R[8] && R[8].data) || null;
      DATA.balSt = DATA.bal ? 'ok' : 'empty';
      DATA.spark = (R[9] && R[9].data) || null;
      DATA.sparkSt = DATA.spark ? 'ok' : 'empty';
      EXS.forEach(function(e2, i){
        var d = R[2] && R[2][i];
        DATA.sh[e2] = (d && d.securities) || {};
      });

      guardDraw('rel', function(box){ drawRel(box, row, relFile, relRec); });

      var bits = [];
      if(relFile && relFile.generated) bits.push('LINKS ' + relFile.generated);
      if(LAW.list.length) bits.push('ACTS ' + LAW.list.length);
      document.getElementById('footNote').textContent = nd(bits.join('  '));
    }).catch(function(e){
      if(gen !== GEN) return;
      document.getElementById('b_rel').innerHTML =
        '<div class="fail"><b>PANEL FAILED</b> ' + t(String((e && e.message) || e)) + '</div>';
    });
  }

  function pick(row){
    if(!row) return;
    closeSug();
    var inp = document.getElementById('q');
    if(inp){ inp.value = rowTicker(row); }
    build(row);
  }

  /* ---------- 11. wiring --------------------------------------- */
  wireGraphControls();
  var inp = document.getElementById('q');
  if(inp){
    inp.addEventListener('input', function(){ drawSug(inp.value); });
    inp.addEventListener('keydown', function(ev){
      var k = ev.key;
      if(k === 'Enter'){
        ev.preventDefault();
        var tok = String(inp.value || '').trim();
        if(!tok) return;
        if(SUG.on && SUG.rows.length){ pick(SUG.rows[SUG.i || 0]); return; }
        var exact = findRow(tok, null);
        if(exact){ pick(exact); return; }
        var first = rank(tok)[0];
        if(first){ pick(first); return; }
        var box = document.getElementById('sug');
        if(box){
          box.innerHTML = '<div class="sg none">NO SECURITY MATCHES "' + t(tok) + '"</div>';
          box.className = 'sug on';
        }
      } else if(k === 'ArrowDown' || k === 'ArrowUp'){
        if(!SUG.on || !SUG.rows.length) return;
        ev.preventDefault();
        var n = SUG.rows.length;
        SUG.i = (SUG.i + (k === 'ArrowDown' ? 1 : n - 1)) % n;
        Array.prototype.forEach.call(document.querySelectorAll('#sug .sg[data-i]'), function(el){
          el.className = 'sg' + (Number(el.getAttribute('data-i')) === SUG.i ? ' sel' : '');
        });
      } else if(k === 'Escape'){
        closeSug();
        inp.blur();
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(closeSug, 120); });
  }
  document.addEventListener('mousedown', function(ev){
    var box = document.getElementById('sug');
    if(box && ev.target !== inp && !box.contains(ev.target) && box.className.indexOf('on') >= 0){
      closeSug();
    }
  });

  window.__mtApplySelection = function(sel){
    if(!sel || !(sel.sym || sel.ticker)) return false;
    loadIndex().then(function(){
      var row = findRow(sel.sym || sel.ticker, sel.ex);
      if(row) pick(row);
    });
    return true;
  };
  window.addEventListener('message', function(ev){
    if(!ev || ev.origin !== location.origin) return;
    var d = ev.data;
    if(d && d.__mt === 'selection') window.__mtApplySelection(d);
  });
  function announceReady(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({__mt: 'sel-ready'}, location.origin);
      }
    }catch(e){}
  }

  /* ---------- 12. the proof surface ---------------------------- */
  function textWords(){
    var txt = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
    return txt ? txt.split(' ').length : 0;
  }
  function clusterDump(m){
    if(!m) return [];
    return m.clusters.map(function(c){
      return {key:c.key, title:c.title, kind:c.kind, state:c.state,
              shown:c.shown, total:(c.total || 0),
              nodes:c.items.map(function(it){
                return {label:it.label, code:it.code || '', name:it.name,
                        colour:it.colour, st:it.st || '', hop:it.hop || 0, co:!!it.co};
              })};
    });
  }
  function selInfo(){
    var n = findNode(G.selKey);
    if(!n) return null;
    return {name:n.name, code:n.code || n.tk || '', exchange:n.ex || '',
            cluster:n.cluster || 'centre', hop:n.hop || 0, colour:n.colour || '',
            link:n.link || 'selected security', reason:n.reason || '', source:n.src || '',
            carriedRecord:!!n.rec, actState:n.st || '', actBasis:actBasis(n)};
  }
  window.__mtPerpState = function(){
    var m = G.model, pol = document.getElementById('pol');
    var opts = pol ? Array.prototype.map.call(pol.options, function(o){
      return {value:o.value, label:o.textContent};
    }) : [];
    var law = G.law, tm = m ? m.tm : null;
    var sub = document.getElementById('gsub'), wq = document.getElementById('webq');
    var claim = document.getElementById('claim'), ab = document.getElementById('actbar');
    var geo = (m && m.geo) ? {
      w:m.geo.w, h:m.geo.h, scale:Math.round(m.geo.s * 1000) / 1000, tries:m.geo.tries,
      overlaps:m.geo.overlaps, minGap:m.geo.minGap, centre:m.geo.cbox,
      boxes:m.geo.boxes.map(function(b){
        return {key:b.key, title:b.c.title, x:b.x, y:b.y, w:b.w, h:b.h};
      })
    } : null;
    return {
      ticker: CUR ? rowTicker(CUR) : '', ex: CUR ? CUR.ex : '',
      name: CUR ? nd(CUR.name || '') : '',
      centre: m ? {
        ticker:m.centre.tk, exchange:m.centre.ex, name:m.centre.name,
        price:m.centre.price, priceText:fmtP(m.centre.price), currency:m.centre.currency,
        pct:m.centre.pct, pctText:fmtPct(m.centre.pct), prev:m.centre.prev,
        asOf:m.centre.asOf, sector:m.centre.sector,
        sparkBars:(m.spark && (m.spark.bars || []).length) || 0,
        sparkValues:(m.spark && (m.spark.bars || []).slice(-30).map(function(b){
          return b.c != null ? b.c : b.close;
        })) || []
      } : null,
      clusters: clusterDump(m),
      policy: {
        id: law ? law.id : '', name: law ? nd(law.name || '') : '',
        year: law ? law.year : '', status: law ? law.status : '',
        mechanism: law ? nd(law.mechanism || '') : '',
        sectors: law ? (law.sectors || []) : [], tickers: law ? (law.tickers || []) : [],
        exchange: law ? String(law.exchange || LAW.ex || '') : '',
        optionCount: opts.length, options: opts,
        selected: pol ? pol.value : '', fileState: LAW.st
      },
      transmission: tm ? {
        ex:tm.ex, all:tm.all, named:tm.named, sectors:tm.sectors,
        direct:tm.direct, hop1:tm.hop1, hop2:tm.hop2, off:tm.off,
        directList:tm.directList, hop1List:tm.hop1List, hop2List:tm.hop2List,
        offList:tm.offList, noRec:tm.noRec, message:tm.msg,
        domDirect: document.querySelectorAll('#b_rel g.nd.st-direct').length,
        domHop1: document.querySelectorAll('#b_rel g.nd.st-hop1').length,
        domHop2: document.querySelectorAll('#b_rel g.nd.st-hop2').length,
        domOff: document.querySelectorAll('#b_rel g.nd[data-st="off"]').length,
        domRings: document.querySelectorAll('#b_rel rect.ar').length
      } : null,
      graph: {
        hopMode:G.hops, cap:G.cap, truncated:m ? m.dropped : 0,
        clusters:m ? m.clusters.length : 0, nodes:m ? nodeCount(m) : 0,
        edges:m ? m.edges.length : 0,
        domNodes: document.querySelectorAll('#b_rel g.nd').length,
        domClusters: document.querySelectorAll('#b_rel .clgrp').length,
        domConnectors: document.querySelectorAll('#b_rel path.cn').length,
        domHubs: document.querySelectorAll('#b_rel circle.hub').length,
        zoom:{k:Math.round(MAP.k * 1000) / 1000, x:Math.round(MAP.x), y:Math.round(MAP.y)},
        pinned:G.selKey,
        files:EXS.map(function(ex){ return {ex:ex, state:REL_ST[ex] || 'unread'}; }),
        sub: sub ? sub.textContent : '',
        types: relTypes().filter(function(tp){ return G.types[tp.k]; })
          .map(function(tp){ return tp.k; })
      },
      geo: geo,
      sel: selInfo(),
      actbar: ab ? ab.textContent.replace(/\s+/g, ' ').trim() : '',
      claim: claim ? claim.textContent.replace(/\s+/g, ' ').trim() : '',
      inputs: document.querySelectorAll('input').length,
      selects: document.querySelectorAll('select').length,
      enabledInputs: document.querySelectorAll('input:not([disabled])').length,
      buttons: document.querySelectorAll('button').length,
      webq: wq ? {disabled: !!wq.disabled, placeholder: wq.placeholder} : null,
      words:textWords()
    };
  };

  /* boot */
  loadLaws();
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
