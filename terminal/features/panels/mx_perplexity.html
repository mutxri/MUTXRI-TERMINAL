      if(relFile && relFile.generated) bits.push('LINKS ' + relFile.generated);
      if(LAW.list.length) bits.push('ACTS ' + LAW.list.length);
      document.getElementById('footNote').textContent = nd(bits.join('  '));
    }).catch(function(e){
      if(gen !== GEN) return;
      document.getElementById('b_rel').innerHTML =
        '<div class="fail"><b>PANEL FAILED</b> ' + t(String((e && e.message) || e)) + '</div>';
    });
  }

  function pick(row){
    if(!row) return;
    closeSug();
    var inp = document.getElementById('q');
    if(inp){ inp.value = rowTicker(row); }
    build(row);
  }

  /* ---------- 11. wiring --------------------------------------- */
  wireGraphControls();
  var inp = document.getElementById('q');
  if(inp){
    inp.addEventListener('input', function(){ drawSug(inp.value); });
    inp.addEventListener('keydown', function(ev){
      var k = ev.key;
      if(k === 'Enter'){
        ev.preventDefault();
        var tok = String(inp.value || '').trim();
        if(!tok) return;
        if(SUG.on && SUG.rows.length){ pick(SUG.rows[SUG.i || 0]); return; }
        var exact = findRow(tok, null);
        if(exact){ pick(exact); return; }
        var first = rank(tok)[0];
        if(first){ pick(first); return; }
        var box = document.getElementById('sug');
        if(box){
          box.innerHTML = '<div class="sg none">NO SECURITY MATCHES "' + t(tok) + '"</div>';
          box.className = 'sug on';
        }
      } else if(k === 'ArrowDown' || k === 'ArrowUp'){
        if(!SUG.on || !SUG.rows.length) return;
        ev.preventDefault();
        var n = SUG.rows.length;
        SUG.i = (SUG.i + (k === 'ArrowDown' ? 1 : n - 1)) % n;
        Array.prototype.forEach.call(document.querySelectorAll('#sug .sg[data-i]'), function(el){
          el.className = 'sg' + (Number(el.getAttribute('data-i')) === SUG.i ? ' sel' : '');
        });
      } else if(k === 'Escape'){
        closeSug();
        inp.blur();
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(closeSug, 120); });
  }
  document.addEventListener('mousedown', function(ev){
    var box = document.getElementById('sug');
    if(box && ev.target !== inp && !box.contains(ev.target) && box.className.indexOf('on') >= 0){
      closeSug();
    }
  });

  window.__mtApplySelection = function(sel){
    if(!sel || !(sel.sym || sel.ticker)) return false;
    loadIndex().then(function(){
      var row = findRow(sel.sym || sel.ticker, sel.ex);
      if(row) pick(row);
    });
    return true;
  };
  window.addEventListener('message', function(ev){
    if(!ev || ev.origin !== location.origin) return;
    var d = ev.data;
    if(d && d.__mt === 'selection') window.__mtApplySelection(d);
  });
  function announceReady(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({__mt: 'sel-ready'}, location.origin);
      }
    }catch(e){}
  }

  /* ---------- 12. the proof surface ---------------------------- */
  function textWords(){
    var txt = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
    return txt ? txt.split(' ').length : 0;
  }
  function clusterDump(m){
    if(!m) return [];
    return m.cats.map(function(c){
      return {key:c.k, title:c.n, state:c.state, shown:c.drawn, total:(c.total || 0),
              nodes:c.items.map(function(it){
                return {label:it.label, code:it.code || '', name:it.name,
                        colour:it.colour, st:it.st || '', hop:it.hop || 0, co:!!it.co};
              })};
    });
  }
  function selInfo(){
    var n = findNode(G.selKey);
    if(!n) return null;
    return {name:n.name, code:n.code || n.tk || '', exchange:n.ex || '',
            cluster:n.cluster || 'centre', hop:n.hop || 0, colour:n.colour || '',
            link:n.link || 'selected security', reason:n.reason || '', source:n.src || '',
            carriedRecord:!!n.rec, actState:n.st || '', actBasis:actBasis(n)};
  }
  window.__mtPerpState = function(){
    var m = G.model, pol = document.getElementById('pol');
    var opts = pol ? Array.prototype.map.call(pol.options, function(o){
      return {value:o.value, label:o.textContent};
    }) : [];
    var law = G.law, tm = m ? m.tm : null;
    var sub = document.getElementById('gsub'), wq = document.getElementById('webq');
    var claim = document.getElementById('claim'), ab = document.getElementById('actbar');
    var geo = (m && m.geo) ? {
      w:m.geo.w, h:m.geo.h, rings:m.geo.rings,
      centre:{x:Math.round(m.geo.cx * 10) / 10, y:Math.round(m.geo.cy * 10) / 10,
              r:m.geo.rC},
      ring1:{rx:Math.round(m.geo.rx1 * 10) / 10, ry:Math.round(m.geo.ry1 * 10) / 10,
             nodes:m.geo.n1, leaf:Math.round(m.geo.leaf1 * 10) / 10},
      ring2:{rx:Math.round(m.geo.rx2 * 10) / 10, ry:Math.round(m.geo.ry2 * 10) / 10,
             nodes:m.geo.n2, leaf:Math.round(m.geo.leaf2 * 10) / 10},
      labelClashes:m.geo.clashes, outside:m.geo.outside,
      apexGap:Math.round(m.geo.gap * 1000) / 1000
    } : null;
    return {
      ticker: CUR ? rowTicker(CUR) : '', ex: CUR ? CUR.ex : '',
      name: CUR ? nd(CUR.name || '') : '',
      centre: m ? {
        ticker:m.centre.tk, exchange:m.centre.ex, name:m.centre.name,
        price:m.centre.price, priceText:fmtP(m.centre.price), currency:m.centre.currency,
        pct:m.centre.pct, pctText:fmtPct(m.centre.pct), prev:m.centre.prev,
        asOf:m.centre.asOf, sector:m.centre.sector,
        sparkBars:(m.spark && (m.spark.bars || []).length) || 0,
        sparkValues:(m.spark && (m.spark.bars || []).slice(-30).map(function(b){
          return b.c != null ? b.c : b.close;
        })) || []
      } : null,
      clusters: clusterDump(m),
      policy: {
        id: law ? law.id : '', name: law ? nd(law.name || '') : '',
        year: law ? law.year : '', status: law ? law.status : '',
        mechanism: law ? nd(law.mechanism || '') : '',
        sectors: law ? (law.sectors || []) : [], tickers: law ? (law.tickers || []) : [],
        exchange: law ? String(law.exchange || LAW.ex || '') : '',
        optionCount: opts.length, options: opts,
        selected: pol ? pol.value : '', fileState: LAW.st
      },
      transmission: tm ? {
        ex:tm.ex, all:tm.all, named:tm.named, sectors:tm.sectors,
        direct:tm.direct, hop1:tm.hop1, hop2:tm.hop2, off:tm.off,
        directList:tm.directList, hop1List:tm.hop1List, hop2List:tm.hop2List,
        offList:tm.offList, noRec:tm.noRec, message:tm.msg,
        domDirect: document.querySelectorAll('#b_rel g.nd.st-direct').length,
        domHop1: document.querySelectorAll('#b_rel g.nd.st-hop1').length,
        domHop2: document.querySelectorAll('#b_rel g.nd.st-hop2').length,
        domOff: document.querySelectorAll('#b_rel g.nd[data-st="off"]').length,
        domRings: document.querySelectorAll('#b_rel circle.hl').length
      } : null,
      graph: {
        hopMode:G.hops, cap:G.cap, truncated:m ? m.dropped : 0, rings:2,
        ring1:m ? m.ring1.length : 0, ring2:m ? m.ring2.length : 0,
        nodes:m ? nodeCount(m) : 0, edges:m && m.edges ? m.edges.length : 0,
        domNodes: document.querySelectorAll('#b_rel g.nd').length,
        domLeaves: document.querySelectorAll('#b_rel circle.lf').length,
        domEdges: document.querySelectorAll('#b_rel path.eg').length,
        domArrows: document.querySelectorAll('#b_rel path.eg[marker-end]').length,
        domRings: document.querySelectorAll('#b_rel ellipse.ring').length,
        domRingLabels: document.querySelectorAll('#b_rel text.rl').length,
        domCentre: document.querySelectorAll('#b_rel circle.cdc').length,
        domMarkers: document.querySelectorAll('#b_rel marker').length,
        domLeafLabels: document.querySelectorAll('#b_rel text.nl').length,
        category:G.cat,
        zoom:{k:Math.round(MAP.k * 1000) / 1000, x:Math.round(MAP.x), y:Math.round(MAP.y)},
        pinned:G.selKey,
        files:EXS.map(function(ex){ return {ex:ex, state:REL_ST[ex] || 'unread'}; }),
        sub: sub ? sub.textContent : '',
        types: CATS.map(function(c){ return c.k; })
      },
      geo: geo,
      sel: selInfo(),
      actbar: ab ? ab.textContent.replace(/\s+/g, ' ').trim() : '',
      claim: claim ? claim.textContent.replace(/\s+/g, ' ').trim() : '',
      inputs: document.querySelectorAll('input').length,
      selects: document.querySelectorAll('select').length,
      enabledInputs: document.querySelectorAll('input:not([disabled])').length,
      buttons: document.querySelectorAll('button').length,
      webq: wq ? {disabled: !!wq.disabled, placeholder: wq.placeholder} : null,
      words:textWords()
    };
  };

  /* boot */
  loadLaws();
  loadIndex().then(function(){
    var tk = Q.get('sym') || Q.get('ticker') || '';
    var ex = (Q.get('ex') || '').toUpperCase();
    var row = tk ? findRow(tk, ex) : null;
    function firstOf(exCode){
      for(var i = 0; i < IDX.length; i++){
        if(!exCode || IDX[i].ex === exCode) return IDX[i];
      }
      return null;
    }
    if(row){ pick(row); announceReady(); return; }
    if(!tk && ex){
      getJSON(sd('relationships_' + ex + '.json')).then(function(rel){
        var secs = (rel && rel.securities) || {};
        var sel = null;
        for(var i = 0; i < IDX.length; i++){
          var r = IDX[i];
          if(r.ex !== ex) continue;
          if(secs[r.ticker] || secs[r.sym]){ sel = r; break; }
        }
        sel = sel || firstOf(ex) || findRow('SCOM', 'NSE') || IDX[0];
        if(sel) pick(sel);
        announceReady();
      });
      return;
    }
    var def = findRow('SCOM', 'NSE') || IDX[0];
    if(def) pick(def);
    announceReady();
  });
})();
</script>
</body>
