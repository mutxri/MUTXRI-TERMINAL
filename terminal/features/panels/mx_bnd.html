<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - BND (Bonds) panel.

  Per-EXCHANGE bond board: NSE (Nairobi, KES), NGX (Lagos, NGN),
  JSE (Johannesburg, ZAR), EGX (Cairo, EGP). Shows, for the selected
  exchange and in its own currency, each instrument's identity, type
  (sovereign or corporate), coupon, maturity, and its yield OR price,
  each row carrying its own as-of date and source.

  HONESTY DESIGN: this is a CURATED / snapshot board, never a live feed -
  no free real-time sovereign-yield feed exists for these markets. A value
  the source does not publish renders as a dash that carries the reason
  (the cell is titled with why it is blank). A missing data file renders an
  explicit not-available state naming the file; nothing is invented, and no
  sample or placeholder row is ever shown.

  DATA INTERFACE. Reads static_data/bonds.json (or the file named by the
  ?bonds= override, a local-verification hook only). Two row shapes are
  accepted so the board never breaks as the feed matures:

    NEW (preferred): {"rows":[{ "exchange","currency","instrument",
      "type","coupon","maturity","yield","price","asOf","source" }, ...]}
      A bare top-level array of such rows is also accepted.

    OLD (legacy, still shipped): {"countries":[{ "iso","country",
      "source","source_url","instruments":[{ "name","tenor","yield",
      "as_of","freshness","stale" }] }]}

  Vanilla JS, exact terminal tokens, no build step.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - BND</title>
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --down:#f87171; --acc:#33e29a; --warn:#e0a340;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .bnd-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:780px; margin:24px auto; }
  .bnd-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .bnd-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .bnd-title b { color:var(--acc); font-weight:700; }
  .bnd-refresh { background:transparent; border:1px solid var(--line2); border-radius:2px; color:var(--tx2); font-family:var(--mono); font-size:11px; padding:4px 10px; cursor:pointer; }
  .bnd-refresh:hover { border-color:var(--acc); color:var(--acc); }
  .bnd-ex { display:flex; gap:0; border-bottom:1px solid var(--line2); }
  .bnd-ex button { flex:1; background:var(--bg3); color:var(--tx3); border:0; border-right:1px solid var(--line2);
                   padding:8px 10px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; cursor:pointer; }
  .bnd-ex button:last-child { border-right:0; }
  .bnd-ex button.on { background:var(--bg4); color:var(--acc); }
  .bnd-ex button:hover { color:var(--acc); }
  .bnd-note { padding:8px 14px; border-bottom:1px solid var(--line); color:var(--tx3); font-size:10px; font-family:var(--mono); line-height:1.5; }
  .bnd-cols, .bnd-inst { display:grid; grid-template-columns:1.7fr 0.9fr 0.7fr 1fr 1fr 0.5fr; gap:8px; padding:6px 14px; }
  .bnd-cols { color:var(--tx3); font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
              border-bottom:1px solid var(--line2); }
  .bnd-cols span:not(:first-child), .bnd-inst > span:not(:first-child) { text-align:right; }
  .bnd-inst { border-bottom:1px solid var(--line); align-items:center; }
  .bnd-inst:hover { background:var(--bg3); }
  .bnd-inm { font-family:var(--mono); font-size:12px; color:var(--tx); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bnd-inm .sy { color:var(--tx3); font-size:10px; }
  .bnd-typ { font-family:var(--mono); font-size:10px; color:var(--tx2); text-align:left !important; }
  .bnd-num { font-family:var(--mono); font-size:12px; color:var(--tx); font-variant-numeric:tabular-nums; }
  .bnd-lvl { font-family:var(--mono); font-size:12px; color:var(--acc); font-variant-numeric:tabular-nums; }
  .bnd-lvl .k { color:var(--tx3); font-size:9px; }
  .bnd-ccy { font-family:var(--mono); font-size:10px; color:var(--tx2); }
  .bnd-dash { color:var(--tx3); cursor:help; }
  .bnd-empty { padding:28px 16px; text-align:center; color:var(--tx3); font-family:var(--mono); font-size:12px; line-height:1.7; }
  .bnd-empty b { color:var(--warn); font-weight:600; }
  .bnd-foot { padding:8px 14px; border-top:1px solid var(--line); color:var(--tx3); font-family:var(--mono); font-size:10px; line-height:1.5; }
  .bnd-news { border-top:1px solid var(--line2); padding:10px 14px 12px; }
  .bnd-news h5 { margin:0 0 7px; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
                 text-transform:uppercase; color:var(--tx3); font-weight:600; }
  .bnd-nrow { padding:6px 0; border-top:1px solid var(--line); }
  .bnd-nrow:first-of-type { border-top:0; }
  .bnd-nrow a { color:var(--tx); text-decoration:none; font-size:12px; line-height:1.45; display:block; }
  .bnd-nrow a:hover { color:var(--acc); }
  .bnd-nmeta { font-family:var(--mono); font-size:9px; color:var(--tx3); margin-top:4px;
               display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bnd-ntag { border:1px solid var(--line2); border-radius:2px; padding:1px 5px; color:var(--acc); }
</style>
</head>
<body>

<div class="bnd-wrap" id="bnd">
  <div class="bnd-head">
    <div class="bnd-title"><b>BND</b> - Bonds &amp; T-Bills</div>
    <button class="bnd-refresh" id="bndRefresh">Refresh</button>
  </div>
  <div class="bnd-ex" id="bndEx"></div>
  <div class="bnd-note" id="bndNote">-</div>
  <div class="bnd-cols">
    <span>Instrument</span><span>Type</span><span>Cpn</span><span>Maturity</span><span>Yld / Px</span><span>Ccy</span>
  </div>
  <div id="bndBody"></div>
  <div class="bnd-foot" id="bndFoot">-</div>
  <div class="bnd-news" id="bndNews" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var EXES = ['NSE', 'NGX', 'JSE', 'EGX'];
  var CUR = {NSE: 'KES', NGX: 'NGN', JSE: 'ZAR', EGX: 'EGP'};
  var ISO2EX = {KE: 'NSE', NG: 'NGX', ZA: 'JSE', EG: 'EGX'};

  var ex = (Q.get("ex") || "").toUpperCase();
  if (EXES.indexOf(ex) < 0) ex = "NSE";

  // The served site is static: /api/bonds does not exist on Pages (it 404s, and
  // the fetch was pointless before falling back here). Read the published
  // snapshot the build ships directly. ?bonds= is a verification hook only;
  // with no override the panel reads the real build output and nothing else.
  var OVERRIDE = Q.get("bonds") || "";
  var BND_ENDPOINT = OVERRIDE || "../../static_data/bonds.json";
  var rawData = null, loaded = false;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function numOrNull(v){ var n = parseFloat(v); return isFinite(n) ? n : null; }
  function dateOf(v){ var s = String(v == null ? "" : v).slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ""; }
  function pick(o, keys){
    for (var i = 0; i < keys.length; i++){
      var v = o[keys[i]];
      if (v !== undefined && v !== null && v !== "") return v;
    }
    return null;
  }
  function typeOf(t){
    t = String(t == null ? "" : t).toLowerCase();
    if (t.indexOf("corp") >= 0) return "corporate";
    if (t.indexOf("sovereign") >= 0 || t.indexOf("gov") >= 0 || t.indexOf("treasur") >= 0) return "sovereign";
    return t || "sovereign";
  }
  // A row is normalised once, whatever shape it arrived in.
  function normRow(r){
    var exRaw = String(pick(r, ["exchange", "ex", "market", "board"]) || "").toUpperCase();
    var rEx = EXES.indexOf(exRaw) >= 0 ? exRaw : (ISO2EX[exRaw] || null);
    var ccy = String(pick(r, ["currency", "ccy", "cur"]) || "").toUpperCase();
    if (!ccy && rEx) ccy = CUR[rEx];
    var yld = numOrNull(pick(r, ["yield", "yieldPct", "yield_pct", "ytm", "yieldToMaturity"]));
    var px = numOrNull(pick(r, ["price", "cleanPrice", "clean_price", "last", "close", "bid", "px"]));
    var level = (px != null) ? { v: px, kind: "px" } : ((yld != null) ? { v: yld, kind: "yld" } : null);
    return {
      ex: rEx, ccy: ccy,
      instrument: String(pick(r, ["instrument", "name", "security", "isin", "symbol", "ticker", "code"]) || ""),
      symbol: String(pick(r, ["symbol", "ticker", "code", "isin"]) || ""),
      type: typeOf(pick(r, ["type", "instrument_type", "kind", "category"])),
      coupon: numOrNull(pick(r, ["coupon", "couponPct", "coupon_pct", "couponRate", "coupon_pct_y"])),
      maturity: dateOf(pick(r, ["maturity", "maturityDate", "maturity_date", "matures", "redemption"])),
      tenor: String(pick(r, ["tenor"]) || ""),
      level: level,
      asOf: dateOf(pick(r, ["asOf", "as_of", "date", "auctionDate", "updated"])),
      source: String(pick(r, ["source", "src", "provider"]) || "")
    };
  }
  function rowsFrom(data){
    if (!data) return null;
    if (Array.isArray(data)) return data.map(normRow);
    if (Array.isArray(data.rows)) return data.rows.map(normRow);
    if (Array.isArray(data.countries)){
      var out = [];
      data.countries.forEach(function(c){
        var rEx = ISO2EX[String(c.iso || "").toUpperCase()] || null;
        (c.instruments || []).forEach(function(i){
          out.push(normRow({
            exchange: rEx, currency: rEx ? CUR[rEx] : "",
            instrument: i.name, type: "sovereign",
            coupon: i.coupon, maturity: i.maturity, tenor: i.tenor,
            yield: i.yield, price: i.price, asOf: i.as_of,
            source: c.source
          }));
        });
      });
      return out;
    }
    return null;
  }

  function levelText(lv){
    if (!lv) return null;
    var dp = lv.kind === "yld" ? 2 : 3;
    return Number(lv.v).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:dp}) +
           (lv.kind === "yld" ? "%" : "");
  }
  function dash(reason){ return '<span class="bnd-dash" title="' + esc(reason) + '">-</span>'; }

  function renderExSwitch(){
    $("bndEx").innerHTML = EXES.map(function(e){
      return '<button type="button" data-ex="' + e + '"' + (e === ex ? ' class="on"' : '') + '>' + e + '</button>';
    }).join("");
  }

  function renderEx(){
    if (!loaded){ $("bndBody").innerHTML = ""; return; }
    var rows = (rowsFrom(rawData) || []).filter(function(r){ return r.ex === ex; });
    // Order: sovereign first, then by maturity (undated last), then name.
    rows.sort(function(a, b){
      var ta = a.type === "sovereign" ? 0 : 1, tb = b.type === "sovereign" ? 0 : 1;
      if (ta !== tb) return ta - tb;
      var ma = a.maturity || "9999-99-99", mb = b.maturity || "9999-99-99";
      if (ma !== mb) return ma < mb ? -1 : 1;
      return String(a.instrument).localeCompare(String(b.instrument));
    });
    if (!rows.length){
      var src = OVERRIDE || "static_data/bonds.json";
      var why = (rawData === null)
        ? "the data file was not found or could not be read"
        : "the file carried no bond rows for " + ex;
      $("bndBody").innerHTML = '<div class="bnd-empty"><b>Bond data not available for ' + esc(ex) + '</b><br>' +
        esc(src) + " - " + esc(why) + '.<br>No sample or placeholder rows are shown.</div>';
      $("bndFoot").textContent = "no bond source for " + ex;
      $("bndNote").textContent = "";
      return;
    }
    $("bndNote").textContent = (rawData && rawData.note) ? rawData.note : "";
    $("bndBody").innerHTML = rows.map(function(r){
      var cpn = r.coupon == null
        ? dash("the source for this row does not publish a coupon")
        : '<span class="bnd-num">' + esc(Number(r.coupon).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:3})) + "%</span>";
      var mat = r.maturity
        ? '<span class="bnd-num">' + esc(r.maturity) + "</span>"
        : dash(r.tenor ? ("the source publishes a tenor (" + r.tenor + "), not a maturity date") : "the source does not publish a maturity for this row");
      var lt = levelText(r.level);
      var lvl = lt == null
        ? dash("the source publishes neither a price nor a yield for this row, so it cannot be paper-traded")
        : '<span class="bnd-lvl">' + esc(lt) + ' <span class="k">' + (r.level.kind === "yld" ? "yld" : "px") + "</span></span>";
      var sy = (r.symbol && r.symbol !== r.instrument) ? ' <span class="sy">' + esc(r.symbol) + "</span>" : "";
      return '<div class="bnd-inst" title="' + esc(r.source || "source not stated") + '">' +
        '<span class="bnd-inm">' + esc(r.instrument) + sy + "</span>" +
        '<span class="bnd-typ">' + esc(r.type) + "</span>" +
        "<span>" + cpn + "</span>" +
        "<span>" + mat + "</span>" +
        "<span>" + lvl + "</span>" +
        '<span class="bnd-ccy">' + (r.ccy ? esc(r.ccy) : dash("the row names no currency")) + "</span>" +
      "</div>";
    }).join("");
    var srcs = {};
    rows.forEach(function(r){ if (r.source) srcs[r.source] = 1; });
    var srcList = Object.keys(srcs).length ? Object.keys(srcs).join("; ") : "source not stated on file";
    $("bndFoot").textContent = rows.length + " instrument" + (rows.length === 1 ? "" : "s") + " on " + ex +
      " - as shown, not a live feed. Source: " + srcList + ".";
  }

  function load(){
    $("bndFoot").textContent = "loading...";
    // The served site is static; read the published snapshot directly and say so
    // if it is missing rather than inventing a yield.
    fetch(BND_ENDPOINT + (BND_ENDPOINT.indexOf("?") < 0 ? "?t=" : "&t=") + Date.now())
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(data){ rawData = data; loaded = true; renderEx(); })
      .catch(function(){ rawData = null; loaded = true; renderEx(); });
    loadBondNews();
  }

  function loadBondNews(){
    fetch("../../static_data/bot_news_bonds.json")
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(rows){
        if (!rows || !rows.length) return;
        var el = $("bndNews");
        el.innerHTML = "<h5>Fixed income - latest</h5>" +
          rows.slice(0, 12).map(function(n){
            var tag = n.exchange ? '<span class="bnd-ntag">' + esc(n.exchange) + "</span>" : "";
            return '<div class="bnd-nrow"><a href="' + esc(n.url || "#") +
              '" target="_blank" rel="nofollow noopener">' + esc(n.title) + "</a>" +
              '<div class="bnd-nmeta"><span>' + esc(n.publisher || "") + "</span><span>" +
              esc(n.date || "") + "</span>" + tag + "</div></div>";
          }).join("");
        el.hidden = false;
      })
      .catch(function(){ /* no scan yet - the board still renders */ });
  }

  $("bndEx").addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("button[data-ex]");
    if (!b) return;
    ex = b.getAttribute("data-ex");
    renderExSwitch();
    renderEx();
  });
  $("bndRefresh").addEventListener("click", load);

  window.showBnd = function(){ var el = $("bnd"); if (el) el.scrollIntoView({ behavior:"smooth" }); };

  function init(){ renderExSwitch(); load(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
