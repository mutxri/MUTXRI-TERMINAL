<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - FOCUS panel: the quote card for ONE security.

  A Bloomberg-style FOCUS card drawn in this terminal's own language: header with
  the panel name and the selected security, the ticker large, the price huge, then
  the change percent and the change in levels, both coloured by sign.

  DATA (the same sources the rest of the terminal reads):
    ../../static_data/market_<EX>.json        the published quote for the security
    ../../static_data/history/<KEY>.json      the real exchange bars, used to date a
                                             security whose quote is absent or stale,
                                             and drawn as the price history block
    ../../static_data/shareholders_<EX>.json the sourced holder rows, read for the
                                             top holders block (the same record the
                                             HOLDERS panel renders in full)
    ../../static_data/analytics/<KEY>.json    valuation.pe / pb / ps / peg with each
                                             metric's own withheld flag and reason

  THE CARD EARNS THE WINDOW. The quote alone left the body nearly empty, so three
  compact blocks follow it, all read from the files above and none of them a
  restatement of the quote: top holders, the valuation multiples, and a 90 session
  price line from the bar history. A block with no data is left out entirely rather
  than drawn empty. A withheld multiple is printed as withheld with the record's own
  reason, never as a blank and never as a zero.

  HONESTY RULES this panel enforces:
    - the as-of date of the quote is always shown; a price with no date is not
      presented as current.
    - a security with no published quote shows "no current quote" and NO price,
      NO percent and NO change. The last published bar, if any, is shown as a
      bar with its own date, never as the current price.
    - a quote whose as-of sits behind the exchange's own session (more than 5
      days) is marked STALE and the lag is stated on the card.
    - the change in levels is price - prevClose and is printed ONLY when the
      row's own chgPct agrees with that arithmetic (tolerance 0.02pt). A row
      whose prevClose does not belong to the quoted session would disagree, and
      then no level change is printed rather than a cross-session number.
    - the NSE board writes `chg` as a duplicate of chgPct (percent, not a level),
      so that field is never used as an absolute change.

  Vanilla JS, exact Godel tokens (mint #33e29a on black, Oxygen Mono, uppercase
  labels), no provider credits, no injected LIVE/EOD badges, no build step.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - FOCUS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* each panel is its own document, so the shell's scrollbar CSS cannot reach in */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;
    --line:#1a1a1a;--line2:#262626;--tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;
    --up:#33e29a;--down:#f87171;--acc:#33e29a;--warn:#e0a340;
    --mono:'Oxygen Mono',ui-monospace,monospace;--ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--ui);font-size:13px;padding:0;}

  /* the shell already draws this panel's window chrome and border, so the panel
     itself must NOT draw a second frame inside it - that reads as one panel
     nested inside another. Fill the shell's window instead. */
  .fx{max-width:none;margin:0;border:0;background:transparent;}
  .fx-bar{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);gap:12px;flex-wrap:wrap;}
  .fx-t2{font-size:12px;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase;flex:0 0 auto;}
  .fx-t2 b{color:var(--acc);font-weight:700;}
  .fx-sw{position:relative;flex:1 1 190px;min-width:150px;}
  .fx-sw input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line2);
    color:var(--tx);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:6px 9px;
    border-radius:3px;outline:none;}
  .fx-sw input:focus{border-color:var(--acc);}
  .fx-sw input::placeholder{color:var(--tx3);}
  .fx-sug{display:none;position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:40;
    background:var(--bg3);border:1px solid var(--line2);border-radius:3px;max-height:260px;overflow-y:auto;}
  .fx-sug.on{display:block;}
  .fx-sug .r{font-family:var(--mono);font-size:11px;color:var(--tx2);padding:6px 9px;cursor:pointer;
    display:flex;gap:8px;align-items:baseline;}
  .fx-sug .r:hover,.fx-sug .r.sel{background:var(--bg4);color:var(--acc);}
  .fx-sug .r b{color:var(--acc);min-width:62px;display:inline-block;}
  .fx-sug .r span{color:var(--tx3);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fx-sug .none{padding:8px 9px;color:var(--tx3);font-family:var(--mono);font-size:10px;}
  /* the selected-security field: the shell owns selection, so this field reports
     the security it was handed rather than pretending to be an input */
  .fx-sec{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--bg);
    padding:5px 12px;border-radius:2px;font-family:var(--mono);font-size:12px;color:var(--acc);}
  .fx-sec .pin{width:11px;height:11px;flex:0 0 auto;opacity:.85;}
  .fx-sec.empty{color:var(--tx3);}
  .fx-body{padding:26px 20px 20px;background:#000;}
  .fx-tkr{font-family:var(--mono);font-weight:700;color:var(--tx);font-size:52px;line-height:1;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-nm{font-size:12px;color:var(--tx3);padding-top:6px;letter-spacing:.02em;}
  .fx-px{font-family:var(--mono);font-weight:700;font-size:78px;line-height:1.02;padding-top:10px;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-cur{font-family:var(--mono);font-size:13px;color:var(--tx3);letter-spacing:.06em;padding-left:6px;}
  .fx-chg{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.1;padding-top:2px;font-variant-numeric:tabular-nums;}
  .fx-abs{font-family:var(--mono);font-weight:700;font-size:24px;line-height:1.1;padding-top:5px;font-variant-numeric:tabular-nums;}
  .fx-pct-unit{font-size:20px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--tx2);} .nofig{color:var(--tx3);} .warn{color:var(--warn);}
  .fx-foot{border-top:1px solid var(--line);padding:9px 16px;font-family:var(--mono);font-size:10px;color:var(--tx3);
    line-height:1.75;letter-spacing:.03em;}
  .fx-foot b{color:var(--tx2);font-weight:400;}
  /* the honest empty state: no price, no percent, no change is shown */
  .fx-np{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1.1;color:var(--warn);padding-top:14px;letter-spacing:.02em;}
  .fx-why{font-family:var(--mono);font-size:11px;color:var(--tx2);padding-top:12px;line-height:1.8;}
  .fx-bar{font-family:var(--mono);font-size:11px;color:var(--tx2);padding-top:10px;line-height:1.8;}

  /* ---- the blocks that make the card an at-a-glance page ---- */
  .fx-blocks{background:transparent;}
  .fx-blk{border-top:1px solid var(--line2);padding:11px 20px 13px;}
  .fx-blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);}
  .fx-blk-h i{font-style:normal;letter-spacing:.05em;color:var(--tx3);}
  .fx-hrow{display:flex;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px solid var(--line);}
  .fx-hrow:last-child{border-bottom:0;}
  .fx-hn{flex:1 1 auto;min-width:0;font-family:var(--ui);font-size:12px;color:var(--tx);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fx-hp{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--acc);font-variant-numeric:tabular-nums;}
  .fx-hs{flex:0 0 auto;min-width:84px;text-align:right;font-family:var(--mono);font-size:11px;
    color:var(--tx3);font-variant-numeric:tabular-nums;}
  .fx-ks{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:9px;}
  .fx-kc{background:var(--bg2);padding:8px 11px;}
  .fx-kk{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);}
  .fx-kv2{font-family:var(--mono);font-size:17px;color:var(--tx);padding-top:4px;font-variant-numeric:tabular-nums;}
  .fx-ww{font-family:var(--mono);font-size:12px;color:var(--warn);}
  .fx-msg{font-family:var(--mono);font-size:10px;color:var(--tx2);line-height:1.8;padding-top:9px;}
  .fx-src{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.03em;padding-top:8px;}
  .fx-spark{display:block;width:100%;height:66px;margin-top:9px;}
  @media (max-width:560px){
    .fx-tkr{font-size:36px;} .fx-px{font-size:52px;} .fx-chg{font-size:22px;} .fx-abs{font-size:18px;}
    .fx-np{font-size:24px;}
    .fx-ks{grid-template-columns:repeat(2,1fr);} .fx-blk{padding:10px 14px 12px;}
  }
</style>
</head>
<body>

<div class="fx" id="fx">
  <div class="fx-bar">
    <span class="fx-t2"><b id="fxTkr">FOCUS</b> &middot; <span id="fxEx">-</span></span>
    <div class="fx-sw">
      <input id="fxQ" type="text" autocomplete="off" spellcheck="false"
             placeholder="SEARCH A SECURITY" aria-label="Search a security">
      <div class="fx-sug" id="fxSug"></div>
    </div>
    <div class="fx-sec empty" id="fxSec" style="display:none">
      <span id="fxSecTxt">no security</span>
    </div>
  </div>

  <div class="fx-body" id="fxBody"></div>

  <div class="fx-blocks" id="fxBlocks"></div>

  <div class="fx-foot" id="fxFoot">-</div>
</div>

<script>
(function () {
  "use strict";
  var BASE = "../../static_data/";
  var Q = new URLSearchParams(location.search);
  var EX = (Q.get("ex") || "JSE").toUpperCase();
  var REQ = (Q.get("sym") || Q.get("symbol") || "").trim();
  var STALE_DAYS = 5;          // the same threshold the chart uses for a stale history
  var PCT_TOL = 0.02;          // chgPct must agree with price/prevClose within this

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function num(v){ if(v === null || v === undefined || v === "") return null; var n = Number(v); return isNaN(n) ? null : n; }
  function fmtPx(a){ return Number(a).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function get(u){ return fetch(u, {cache:"default"}).then(function(r){
    if(!r.ok) throw new Error(String(r.status)); return r.json(); }); }

  // A session date out of either shape the tree uses: "2026-10-09" (NGX/JSE/EGX)
  // or "NSE 12/10/2026 17:04 GMT+3 (closed)" (the NSE live board's stamp).
  function asDate(s){
    if(s == null) return null;
    var t = String(s).trim();
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
    if(m) return {iso: t, ms: Date.parse(t + "T00:00:00Z")};
    m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(t);
    if(m){ var iso = m[3] + "-" + m[2] + "-" + m[1]; return {iso: iso, ms: Date.parse(iso + "T00:00:00Z")}; }
    return null;
  }
  function daysBetween(a, b){ return (a && b && isFinite(a.ms) && isFinite(b.ms)) ? Math.round((b.ms - a.ms) / 86400000) : null; }
  function todayUTC(){ var d = new Date(); return Date.parse(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())).toISOString()); }

  // The history archive is keyed several ways: NSE/NGX use EX_<bare ticker>, the
  // JSE uses <bare>.JO, the EGX uses either the bare ticker or the ISIN. The
  // market row's own `sym` IS a file key on the JSE/EGX, so it is tried first.
  function histKeys(row, sym){
    var given = String(sym == null ? "" : sym).toUpperCase(), bare = given.split(".")[0], out = [];
    function push(k){ if(k && out.indexOf(k) < 0) out.push(k); }
    if(EX === "NSE" || EX === "NGX"){ push(EX + "_" + bare); return out; }
    if(row && row.sym) push(String(row.sym).toUpperCase());
    if(/^\S+\.[A-Za-z]{2}$/.test(given)) push(given);
    var sfx = EX === "JSE" ? ".JO" : (EX === "EGX" ? ".CA" : "");
    if(sfx) push(bare + sfx);
    push(bare);
    return out;
  }
  function getHist(row, sym){
    var keys = histKeys(row, sym), i = 0;
    function next(){
      if(i >= keys.length) return Promise.resolve(null);
      var k = keys[i++];
      return get(BASE + "history/" + encodeURIComponent(k) + ".json")
        .then(function(d){ return (d && d.bars && d.bars.length) ? d : next(); })
        .catch(next);
    }
    return next();
  }
  function lastBar(hist){
    if(!hist || !hist.bars || !hist.bars.length) return null;
    var b = hist.bars[hist.bars.length - 1];
    return { t: b && b.t != null ? String(b.t).slice(0, 10) : null, c: b ? num(b.c) : null };
  }

  // ---- the sources behind the blocks -------------------------------------
  // The market row's own `sym` is the key every other file uses on the JSE and the
  // EGX, and the NSE/NGX key is EX_<ticker>. The candidates are tried in that order
  // so the first request is the one that answers, and a miss simply leaves the block
  // out. The analytics archive keys the same security several ways (MTN.JO and MTN,
  // an EGX ISIN or its ticker), which is why more than one spelling is offered.
  function firstOk(urls){
    var i = 0;
    function next(){
      if(i >= urls.length) return Promise.resolve(null);
      return get(BASE + urls[i++]).catch(next);
    }
    return next();
  }
  // Which spelling of the analytics key to ask for. Measured against the market rows
  // of all four exchanges: on the JSE, NGX and NSE every row that has a record answers
  // on the market row's own `sym`, so only that one is asked for and a security with no
  // record costs a single unanswered request rather than a string of them. On the EGX
  // the ticker answers for 292 of 342 rows and the row's own sym answers for the rest.
  function anaKeys(row, sym){
    var tk = String((row && row.ticker) || sym || "").toUpperCase();
    var rs = String((row && row.sym) || sym || "").toUpperCase();
    var out = [];
    function push(k){
      k = String(k || "").toUpperCase();
      if(k && out.indexOf("analytics/" + k + ".json") < 0) out.push("analytics/" + k + ".json");
    }
    if(EX === "EGX"){ push(tk); push(rs); }
    else { push(rs); }
    return out;
  }
  var ANA_MEM = {};
  function getAna(row, sym){
    var urls = anaKeys(row, sym), i = 0;
    function next(){
      if(i >= urls.length) return Promise.resolve(null);
      var u = urls[i++];
      if(Object.prototype.hasOwnProperty.call(ANA_MEM, u)){
        return ANA_MEM[u] ? Promise.resolve(ANA_MEM[u]) : next();
      }
      return get(BASE + u).then(function(d){
        ANA_MEM[u] = d || null; return ANA_MEM[u];
      }).catch(function(){ ANA_MEM[u] = null; return next(); });
    }
    return next();
  }
  // everything the blocks need, fetched once for the security being shown
  function loadExtras(board, sym){
    var row = board ? matchRow(board.stocks || [], sym) : null;
    var out = { row: row, hist: null, hold: null, ana: null };
    return getHist(row, sym).then(function(h){
      out.hist = h;
      return get(BASE + "shareholders_" + encodeURIComponent(EX) + ".json")
        .then(function(f){ out.hold = f; }).catch(function(){ out.hold = null; });
    }).then(function(){
      return getAna(row, sym).then(function(a){ out.ana = a; });
    }).then(function(){ return out; });
  }

  function matchRow(rows, sym){
    var s = String(sym).toUpperCase(), bare = s.split(".")[0];
    function exact(r){ return String(r.sym || "").toUpperCase() === s || String(r.ticker || "").toUpperCase() === s; }
    function bareSame(r){
      return String(r.sym || "").toUpperCase().split(".")[0] === bare ||
             String(r.ticker || "").toUpperCase().split(".")[0] === bare;
    }
    for(var i = 0; i < rows.length; i++){ if(exact(rows[i])) return rows[i]; }
    for(var j = 0; j < rows.length; j++){ if(bareSame(rows[j])) return rows[j]; }
    return null;
  }
  // the display ticker: the exchange's own ticker, never a fixed one
  function tickerOf(r, fallback){
    var t = String(r && (r.ticker || r.sym) || fallback || "").toUpperCase();
    return t;
  }

  // ---- states -------------------------------------------------------------
  // Every state that is not a current quote says so in words and shows no figure.
  function renderNoSecurity(){
    $("fxSec").className = "fx-sec empty";
    $("fxSecTxt").textContent = "no security";
    $("fxBody").innerHTML =
      '<div class="fx-tkr nofig">NO SECURITY</div>' +
      '<div class="fx-np">NO SECURITY SELECTED</div>';
    $("fxFoot").innerHTML = "<b>" + esc(EX) + "</b> &middot; no security selected";
    renderBlocks(null, null, null, null, null);
  }
  function renderNoMarket(reason){
    $("fxSec").className = "fx-sec";
    $("fxSecTxt").textContent = String(REQ || "").toUpperCase() + " " + EX;
    $("fxBody").innerHTML =
      '<div class="fx-tkr nofig">' + esc(tickerOf(null, REQ) || "NO MARKET") + '</div>' +
      '<div class="fx-np">NO CURRENT QUOTE</div>' +
      '<div class="fx-why">' + esc(EX) + ' market data unavailable.</div>';
    $("fxFoot").innerHTML = "<b>" + esc(EX) + "</b> &middot; no quote source";
    renderBlocks(null, null, null, null, null);
  }
  function renderNoQuote(sym, board, row, hist, hold, ana){
    var last = lastBar(hist);
    var parts = [];
    parts.push("<div class='fx-tkr'>" + esc(tickerOf(row, sym)) + "</div>");
    if(row && row.name) parts.push("<div class='fx-nm'>" + esc(row.name) + "</div>");
    // A WITHHELD price is its own fact, not a missing one: the exchange snapshot
    // carries the reason it held the price back, and the archive's stored value
    // for such a security IS the value the snapshot declined to call a session
    // price, so it is not printed here either.
    var withheld = !!(row && (row.priceWithheld || row.asOfWithheld || row.withhold_reason));
    var reason = row && (row.withhold_reason || row.priceNote) ? String(row.withhold_reason || row.priceNote) : "";
    $("fxSec").className = "fx-sec";
    $("fxSecTxt").textContent = tickerOf(row, sym) + " " + EX;
    parts.push("<div class='fx-np'>" + (withheld ? "PRICE WITHHELD" : "NO CURRENT QUOTE") + "</div>");
    var why;
    if(withheld){
      why = reason ? esc(reason) : "Price withheld for this session.";
      if(last && last.t){
        why += "<div class='fx-bar'>Last bar <b>" + esc(last.t) + "</b>.</div>";
      }
    } else {
      why = "No published price for the " + esc(board && board.asOf ? board.asOf : "current") + " " + esc(EX) + " session.";
      if(last && last.t){
        var age = daysBetween(asDate(last.t), {ms: todayUTC()});
        why += "<div class='fx-bar'>LAST PUBLISHED BAR <b>" + esc(last.t) + "</b>" +
          (last.c != null ? " close " + esc(fmtPx(last.c)) + (row && row.currency ? " " + esc(row.currency) : "") : "") +
          (age != null ? " &middot; " + age + " days old" : "") +
          " &middot; a historical bar, not the current price.</div>";
      } else {
        why += "<div class='fx-bar'>The price history holds no bars for this security either, so there is " +
          "no last close to date.</div>";
      }
    }
    parts.push("<div class='fx-why'>" + why + "</div>");
    $("fxBody").innerHTML = parts.join("");
    $("fxFoot").innerHTML = "<b>" + tickerOf(row, sym) + " " + esc(EX) + "</b> &middot; " +
      (row && row.asOf ? "as of " + esc(row.asOf) : "as-of not stated") +
      " &middot; " + (withheld ? "price withheld, " : "") + "no current quote" +
      " &middot; no change is shown without a dated current price";
    renderBlocks(row, sym, hist, hold, ana);
  }
  function renderAbsent(sym, board, hist, hold, ana){
    var last = lastBar(hist);
    $("fxSec").className = "fx-sec";
    $("fxSecTxt").textContent = String(sym || "").toUpperCase() + " " + EX;
    var parts = [];
    parts.push("<div class='fx-tkr nofig'>" + esc(String(sym || "").toUpperCase()) + "</div>");
    parts.push("<div class='fx-np'>NOT IN THE SNAPSHOT</div>");
    var why = "Not carried by the " + esc(EX) + " market snapshot.";
    if(last && last.t){
      var age = daysBetween(asDate(last.t), {ms: todayUTC()});
      why += "<div class='fx-bar'>LAST PUBLISHED BAR <b>" + esc(last.t) + "</b>" +
        (last.c != null ? " close " + esc(fmtPx(last.c)) : "") +
        (age != null ? " &middot; " + age + " days old" : "") +
        " &middot; history is not a quote.</div>";
    }
    parts.push("<div class='fx-why'>" + why + "</div>");
    $("fxBody").innerHTML = parts.join("");
    $("fxFoot").innerHTML = "<b>" + esc(String(sym || "").toUpperCase()) + " " + esc(EX) +
      "</b> &middot; not carried by this exchange snapshot" +
      (board && board.asOf ? " &middot; snapshot as of " + esc(board.asOf) : "");
    renderBlocks(null, sym, hist, hold, ana);
  }

  // ---- the blocks ---------------------------------------------------------
  // A section label of an issuer's own holder table is not a holder, and a row with
  // no holder shape must never be painted. The HOLDERS panel carries the same guards,
  // so this panel cannot show a heading or a placeholder as a holder either.
  var HEAD_RE = /^(total\s+)?(directors?'? shareholdings?|other influential shareholdings?|other influential holdings?|free floats? .*|total directors? holdings?|substantial shareholdings?|promoters? and their close relatives|public shareholders?|non-public shareholders?|total substantial shareholdings?|\[name\(s\) of .*)\s*$/i;
  function plausibleHolder(r){
    if(!r || typeof r.name !== "string") return false;
    var n = r.name.replace(/\s+/g, " ").trim();
    if(n.length < 2 || HEAD_RE.test(n) || n.charAt(0) === "[") return false;
    if(r.holding == null && r.pct == null) return false;
    if(n.replace(/[^\p{L}]/gu, "").length < 2) return false;
    return true;
  }
  function fmtInt(v){ return num(v) == null ? null : Number(v).toLocaleString("en-US"); }
  function fmtPct(v){ return num(v) == null ? null :
    num(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:4}); }
  // the document the holder rows were read from, named in the fewest words that stay
  // true: the issuer's own annual report where that is what the record names, and the
  // host of the page otherwise. No path is printed.
  function holderDoc(rec){
    var s = (rec && rec.source) || {};
    if(s.file) return "Issuer annual report";
    var u = String(s.url || "");
    var m = /^https?:\/\/([^\/]+)/i.exec(u);
    if(m) return m[1].replace(/^www\./i, "");
    if(s.note) return "Issuer or exchange document";
    return "sourced holder record";
  }

  // the record the HOLDERS panel would render, found the same way it finds it
  function holderRec(file, row, sym){
    var sec = (file && file.securities) || null;
    if(!sec) return null;
    var tk = String((row && row.ticker) || sym || "").toUpperCase();
    var rs = String((row && row.sym) || sym || "").toUpperCase();
    var bare = tk.split(".")[0];
    var sfx = EX === "JSE" ? ".JO" : (EX === "EGX" ? ".CA" : "");
    var cands = [];
    [rs, tk, bare + sfx, bare, EX + "_" + bare].forEach(function(k){
      k = String(k || "").toUpperCase();
      if(k && cands.indexOf(k) < 0) cands.push(k);
    });
    for(var i = 0; i < cands.length; i++){ if(sec[cands[i]]) return sec[cands[i]]; }
    var hit = null;
    Object.keys(sec).forEach(function(k){
      if(hit) return;
      var r = sec[k] || {}, rk = String(k).toUpperCase(), rt = String(r.ticker || "").toUpperCase();
      if((tk && (rk === tk || rt === tk)) || (rs && (rk === rs || rt === rs)) ||
         (bare && rk.split(".")[0] === bare)) hit = r;
    });
    return hit;
  }

  function holderRows(rec){
    var out = [], seen = {};
    ["substantial", "promoters", "other", "directors"].forEach(function(b){
      (rec[b] || []).forEach(function(r){
        if(!plausibleHolder(r)) return;
        var n = String(r.name).replace(/\s+/g, " ").trim();
        if(seen[n]) return;
        seen[n] = 1;
        out.push({ name: n, pct: num(r.pct), holding: num(r.holding) });
      });
    });
    out.sort(function(a, b){
      var ap = a.pct == null ? -1 : a.pct, bp = b.pct == null ? -1 : b.pct;
      return bp - ap;
    });
    return out;
  }

  function blockHolders(rec){
    if(!rec) return "";
    var all = holderRows(rec), rows = all.slice(0, 4);
    if(!rows.length) return "";
    // only the columns the record actually prints are drawn: an issuer that prints
    // shares and no percentage column gets a shares list, not a column of blanks
    var hasPct = rows.some(function(r){ return r.pct != null; });
    var hasShares = rows.some(function(r){ return r.holding != null; });
    var h = '<div class="fx-blk"><div class="fx-blk-h"><span>Top holders</span><i>' +
      (all.length > rows.length ? esc("largest of " + all.length + " printed") : "") +
      "</i></div>";
    rows.forEach(function(r){
      h += '<div class="fx-hrow"><div class="fx-hn">' + esc(r.name) + "</div>";
      if(hasPct) h += '<div class="fx-hp">' +
        (r.pct == null ? '<span class="nofig">not stated</span>' : esc(fmtPct(r.pct)) + "%") + "</div>";
      if(hasShares) h += '<div class="fx-hs">' +
        (r.holding == null ? '<span class="nofig">not stated</span>' : esc(fmtInt(r.holding))) + "</div>";
      h += "</div>";
    });
    h += '<div class="fx-src">' + esc(holderDoc(rec)) + " &middot; " +
      (rec.asOf ? esc(String(rec.asOf)) : "date not stated") + "</div></div>";
    return h;
  }

  // The four multiples this card shows. A metric whose record withholds it is printed
  // as withheld and carries the record's own reason verbatim; reasons that are the same
  // sentence are stated once for the metrics they cover. Nothing is trimmed, reworded
  // or dropped, and a withheld metric is never drawn as a blank or as a zero.
  function blockMultiples(ana){
    var v = (ana && ana.valuation) || null;
    if(!v) return "";
    var MET = [["pe", "P/E"], ["pb", "P/B"], ["ps", "P/S"], ["peg", "PEG"]];
    var cells = "", reasons = [], byReason = {};
    MET.forEach(function(m){
      var val = num(v[m[0]]);
      if(val != null){
        cells += '<div class="fx-kc"><div class="fx-kk">' + esc(m[1]) + '</div><div class="fx-kv2">' +
          esc(val.toFixed(2)) + "</div></div>";
        return;
      }
      var wd = !!v[m[0] + "_withheld"];
      cells += '<div class="fx-kc"><div class="fx-kk">' + esc(m[1]) + '</div><div class="fx-kv2">' +
        (wd ? '<span class="fx-ww">withheld</span>' : '<span class="nofig">not stated</span>') + "</div></div>";
      if(wd){
        var r = String(v[m[0] + "_withheld_reason"] || "").trim() || "withheld by the record, which states no reason";
        if(!byReason[r]){ byReason[r] = []; reasons.push(r); }
        byReason[r].push(m[1]);
      }
    });
    var msg = reasons.map(function(r){
      return '<div class="fx-msg">' + esc(byReason[r].join(", ")) + ": " + esc(r) + "</div>";
    }).join("");
    return '<div class="fx-blk"><div class="fx-blk-h"><span>Multiples</span><i>' +
      esc(v.pePeriod || v.asOfPeriod || "") + "</i></div>" +
      '<div class="fx-ks">' + cells + "</div>" + msg + "</div>";
  }

  // 90 sessions of the security's own bars, drawn inline. No second request, no frame,
  // no interpolation: the line joins the closes the history file prints. A security
  // whose price the exchange withheld is not given a price line at all, because the
  // stored series for such a security holds the value the snapshot declined to call a
  // session price, and a line across it would read as a price that does not exist.
  function blockHistory(hist, withheld){
    if(withheld) return "";
    if(!hist || !hist.bars || !hist.bars.length) return "";
    var win = hist.bars.slice(Math.max(0, hist.bars.length - 90));
    var pts = [], lo = null, hi = null;
    win.forEach(function(b){
      var c = num(b.c);
      if(c == null) return;
      pts.push(c);
      if(lo == null || c < lo) lo = c;
      if(hi == null || c > hi) hi = c;
    });
    if(pts.length < 2) return "";
    var W = 600, H = 66, n = pts.length, span = (hi - lo) || 1;
    var d = pts.map(function(c, i){
      var x = (i / (n - 1)) * W;
      var y = H - 4 - ((c - lo) / span) * (H - 8);
      return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ");
    var t0 = win[0] && win[0].t ? String(win[0].t).slice(0, 10) : null;
    var t1 = win[win.length - 1] && win[win.length - 1].t ? String(win[win.length - 1].t).slice(0, 10) : null;
    var line = "Last " + n + " sessions" + (t0 && t1 ? ", " + t0 + " to " + t1 : "") +
      ", low " + fmtPx(lo) + " high " + fmtPx(hi);
    return '<div class="fx-blk"><div class="fx-blk-h"><span>Price history</span><i>' +
      esc(hist.currency || "") + "</i></div>" +
      '<svg class="fx-spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + '" fill="none" stroke="#33e29a" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>' +
      '<div class="fx-src">' + esc(line) + "</div></div>";
  }

  function renderBlocks(row, sym, hist, hold, ana){
    var box = $("fxBlocks");
    if(!box) return;
    if(!sym){ box.innerHTML = ""; return; }
    var withheld = !!(row && (row.priceWithheld || row.asOfWithheld || row.withhold_reason));
    box.innerHTML = blockHolders(holderRec(hold, row, sym)) +
      blockMultiples(ana) + blockHistory(hist, withheld);
  }

  // THE QUOTE GRID STAYS REMOVED (owner, 2026-10-13). It restated what the quote header
  // and the exchange board already show and printed the date twice on every security,
  // and it is not restored here: no cell, no container and no builder for it remains.

  function renderQuote(sym, board, row, hist, hold, ana){
    var px = num(row.price);
    var asOf = asDate(row.asOf);
    var pct = num(row.chgPct);
    var prev = num(row.prevClose);
    var boardDate = asDate(board && board.asOf);
    var lag = daysBetween(asOf, boardDate);
    // "behind the board's own session" is measured against the session the
    // exchange's snapshot is priced at, so a stale security is named without
    // relying on the reader's clock.
    var stale = (lag != null && lag > STALE_DAYS);
    var behindToday = daysBetween(asOf, {ms: todayUTC()});

    // The level change is only printed when the row's own chgPct agrees with
    // price - prevClose. If prevClose belonged to a different session the two
    // would disagree, and then no level change is printed.
    var level = null, agree = null;
    if(px != null && prev != null && pct != null && prev !== 0){
      var calc = (px - prev) / prev * 100.0;
      agree = Math.abs(calc - pct) <= PCT_TOL;
      level = Math.round((px - prev) * 100) / 100;
    } else if(px != null && prev != null && pct == null){
      // no percent in the source: the level change cannot be checked against
      // anything, so it is not printed as a change
      agree = false;
    }
    var dir = pct == null ? "nofig" : (pct > 0 ? "up" : (pct < 0 ? "down" : "flat"));
    var pxCls = pct == null ? "" : (pct >= 0 ? " up" : " down");

    $("fxSec").className = "fx-sec";
    $("fxSecTxt").textContent = tickerOf(row, sym) + " " + EX;

    var h = [];
    h.push("<div class='fx-tkr'>" + esc(tickerOf(row, sym)) + "</div>");
    if(row.name) h.push("<div class='fx-nm'>" + esc(row.name) + "</div>");
    h.push("<div class='fx-px" + pxCls + "'>" + esc(fmtPx(px)) +
      (row.currency ? "<span class='fx-cur'>" + esc(row.currency) + "</span>" : "") + "</div>");
    if(pct != null){
      h.push("<div class='fx-chg " + dir + "'>" + (pct >= 0 ? "+" : "") + pct.toFixed(2) +
        "<span class='fx-pct-unit'>%</span></div>");
    } else {
      h.push("<div class='fx-chg nofig'>change percent not stated</div>");
    }
    if(level != null && agree){
      h.push("<div class='fx-abs " + dir + "'>" + (level >= 0 ? "+" : "") + fmtPx(level) + "</div>");
    } else {
      h.push("<div class='fx-abs nofig'>change in levels not stated</div>");
    }
    $("fxBody").innerHTML = h.join("");

    // ---- footer: the as-of stamp first, then anything that qualifies it ----
    var foot = [];
    // The dated stamp was the first thing in this footer and printed on every
    // security. The quote header already carries the date, so it is not repeated
    // here. The footer now renders only when it holds a caveat worth stating
    // (a stale quote, a lag, a disagreement between fields), and stays empty
    // otherwise.
    if(lag != null){
      if(stale){
        foot.push("<span class='warn'>STALE: " + lag + " days behind the " + esc(boardDate ? boardDate.iso : "") + " board session</span>");
      } else if(lag === 0){
        // A zero lag means the quote is current for this board session. The dated
        // stamp at the head of this footer already says as much, and repeating the
        // date here was redundant on every row. Nothing is pushed.
      } else {
        foot.push(lag + " day" + (lag === 1 ? "" : "s") + " behind the " + esc(boardDate ? boardDate.iso : "") + " board session");
      }
      // a lag against the reader's own clock is stated separately, and only when
      // it says something the session lag does not
      if(behindToday != null && behindToday > STALE_DAYS && behindToday !== lag){
        foot.push("<span class='warn'>" + behindToday + " days before today</span>");
      }
    } else {
      foot.push("<span class='warn'>as-of date not stated, so it is not treated as current</span>");
    }
    if(agree === false && px != null && prev != null){
      foot.push("<span class='warn'>chgPct disagrees with price - prevClose, so no level change is shown</span>");
    }
    var lb = lastBar(hist);
    if(lb && lb.t && asOf){
      // the bars date the quote independently: say so when they disagree
      if(lb.t > asOf.iso){
        foot.push("later bar <b>" + esc(lb.t) + "</b>");
      } else if(lb.t < asOf.iso){
        foot.push("history ends <b>" + esc(lb.t) + "</b>");
      }
    }
    $("fxFoot").innerHTML = foot.join(" &middot; ");
    renderBlocks(row, sym, hist, hold, ana);
  }

  function render(sym, board, hist, marketError, hold, ana){
    // THE PANEL'S OWN NAME IS THE TICKER. The owner asked for the header to name the
    // security rather than the word FOCUS, so every render path sets it here - this is
    // the single entry point all of them pass through, so one line covers them all.
    try{
      var _tk = $("fxTkr");
      if(_tk) _tk.textContent = (tickerOf(null, sym) || String(sym || "").replace(/\.JO$/, "") || "FOCUS");
    }catch(e){}
    if(!sym){ renderNoSecurity(); return; }
    if(!board){ renderNoMarket(marketError); return; }
    var row = matchRow(board.stocks || [], sym);
    if(!row){ renderAbsent(sym, board, hist, hold, ana); return; }
    if(num(row.price) == null){ renderNoQuote(sym, board, row, hist, hold, ana); return; }
    renderQuote(sym, board, row, hist, hold, ana);
  }

  function init(){
    $("fxEx").textContent = EX;
    if(!REQ){
      renderNoSecurity();
      return;
    }
    $("fxSecTxt").textContent = String(REQ).toUpperCase();
    get(BASE + "market_" + encodeURIComponent(EX) + ".json")
      .then(function(board){
        // the board is read first so the row's own `sym` can key the history, the
        // holder record and the valuation archive, which is the spelling those files
        // use on the JSE and the EGX
        return loadExtras(board, REQ).then(function(x){
          render(REQ, board, x.hist, null, x.hold, x.ana);
        });
      })
      .catch(function(e){ render(REQ, null, null, e && e.message ? e.message : "unreadable"); });
  }

  // SEARCH: type a ticker or a company name, pick a row, and the panel re-renders
  // for that security. It reads the SAME market file the rest of the panel reads,
  // so a suggestion is always a security this exchange actually lists - a name
  // that matches nothing shows 'no match' rather than a guess.
  var ALL_ROWS = null, SUG_AT = -1;
  function loadRows(){
    if(ALL_ROWS) return Promise.resolve(ALL_ROWS);
    return get(BASE + "market_" + encodeURIComponent(EX) + ".json").then(function(b){
      var rows = (b && (b.stocks || b.rows || b.securities || b.listings)) || [];
      ALL_ROWS = rows.filter(function(r){ return r && (r.sym || r.ticker); });
      return ALL_ROWS;
    }).catch(function(){ ALL_ROWS = []; return ALL_ROWS; });
  }
  function sugClose(){ var s = $("fxSug"); if(s){ s.className = "fx-sug"; s.innerHTML = ""; } SUG_AT = -1; }
  function showFor(sym){
    var s = String(sym || "").trim().toUpperCase();
    if(!s){ renderNoSecurity(); return; }
    REQ = s;
    get(BASE + "market_" + encodeURIComponent(EX) + ".json")
      .then(function(b){
        return loadExtras(b, s).then(function(x){ render(s, b, x.hist, null, x.hold, x.ana); });
      })
      .catch(function(e){ render(s, null, null, (e && e.message) || "unreadable"); });
  }
  function sugPaint(list, q){
    var box = $("fxSug");
    if(!box) return;
    if(!list.length){
      box.innerHTML = '<div class="none">NO ' + esc(EX) + ' SECURITY MATCHES "' + esc(q) + '"</div>';
      box.className = "fx-sug on"; return;
    }
    box.innerHTML = list.slice(0, 12).map(function(r, i){
      var t = String(r.ticker || r.sym || "").replace(/\.JO$/, "");
      return '<div class="r' + (i === SUG_AT ? " sel" : "") + '" data-sym="' + esc(r.sym || r.ticker) + '">' +
        '<b>' + esc(t) + '</b><span>' + esc(r.name || "") + '</span></div>';
    }).join("");
    box.className = "fx-sug on";
    Array.prototype.forEach.call(box.querySelectorAll(".r"), function(el){
      el.addEventListener("mousedown", function(ev){
        ev.preventDefault();
        showFor(el.getAttribute("data-sym"));
        $("fxQ").value = String(el.getAttribute("data-sym") || "").replace(/\.JO$/, "");
        sugClose();
      });
    });
  }
  function searchFilter(q){
    if(!ALL_ROWS) return [];
    var s = q.trim().toUpperCase();
    if(!s) return [];
    var starts = [], has = [];
    ALL_ROWS.forEach(function(r){
      var t = String(r.ticker || r.sym || "").toUpperCase().replace(/\.JO$/, "");
      var n = String(r.name || "").toUpperCase();
      if(t.indexOf(s) === 0) starts.push(r);
      else if(t.indexOf(s) >= 0 || n.indexOf(s) >= 0) has.push(r);
    });
    return starts.concat(has);
  }
  function wireSearch(){
    var q = $("fxQ");
    if(!q) return;
    loadRows();
    q.addEventListener("input", function(){
      var v = q.value;
      SUG_AT = -1;
      if(!v.trim()){ sugClose(); return; }
      if(!ALL_ROWS){ loadRows().then(function(){ sugPaint(searchFilter(v), v); }); return; }
      sugPaint(searchFilter(v), v);
    });
    q.addEventListener("focus", function(){ loadRows(); });
    q.addEventListener("keydown", function(ev){
      var box = $("fxSug"), items = box ? box.querySelectorAll(".r") : [];
      if(ev.key === "Escape"){ q.value = ""; sugClose(); return; }
      if(ev.key === "ArrowDown" && items.length){
        SUG_AT = Math.min(SUG_AT + 1, items.length - 1);
        sugPaint(searchFilter(q.value), q.value); ev.preventDefault(); return;
      }
      if(ev.key === "ArrowUp" && items.length){
        SUG_AT = Math.max(SUG_AT - 1, 0);
        sugPaint(searchFilter(q.value), q.value); ev.preventDefault(); return;
      }
      if(ev.key === "Enter"){
        if(SUG_AT >= 0 && items[SUG_AT]){ items[SUG_AT].dispatchEvent(new Event("mousedown")); return; }
        var list = searchFilter(q.value);
        if(list.length){ showFor(list[0].sym || list[0].ticker); q.value = String(list[0].ticker || list[0].sym || "").replace(/\.JO$/, ""); sugClose(); }
        else if(q.value.trim()){ showFor(q.value.trim()); sugClose(); }
      }
    });
    document.addEventListener("click", function(ev){
      var box = $("fxSug");
      if(box && box.className.indexOf("on") >= 0 && !box.contains(ev.target) && ev.target !== q) sugClose();
    });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", wireSearch);
  else wireSearch();
})();
</script>
</body>
</html>
