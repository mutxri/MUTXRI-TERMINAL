<!--
  afri_compare.html - side-by-side stock comparison panel.
  Compares two securities: normalized price chart over the common window
  (since listing where the .max history exists, otherwise the available
  window), plus a metrics table (price, YTD, ROE, ROA, margins, debt/equity,
  P/E, total return) and a one-line verdict.
  Usage: afri_compare.html?a=SCOM&b=EABL  (or ?a=SCOM to pick a peer)
  Vanilla JS, single file, no build step. Godel palette, mint accent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://mutxriterminal.com/">
<style>
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;--acc2:#1ecfb0;
    --amber:#e0a341;--mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px}
  .wrap{border:1px solid var(--line2);background:var(--bg);max-width:960px}
  .head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--bg2)}
  .head .code{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .head .vs{color:var(--tx3)}
  .head .bcode{color:var(--amber);font-weight:700;letter-spacing:.04em}
  .head .name{color:var(--tx2);font-family:var(--ui)}
  .controls{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  input.tk{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;padding:6px 8px;font-family:var(--mono);font-size:11px;width:90px;text-transform:uppercase}
  button.go{background:var(--acc);color:#00160e;border:0;padding:6px 14px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;border-radius:2px}
  button.go:hover{background:var(--acc2)}
  .hint{color:var(--tx3);font-size:10px}
  .peers{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .peers .pl{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .peers a{color:var(--tx2);text-decoration:none;border:1px solid var(--line2);padding:3px 8px;border-radius:2px;font-size:11px;cursor:pointer}
  .peers a:hover{color:var(--acc);border-color:var(--acc)}
  .chartbox{padding:12px 14px;border-bottom:1px solid var(--line2)}
  .chartbox .window{color:var(--tx3);font-size:10px;padding:0 0 8px}
  svg{display:block;width:100%;height:260px}
  .legend{display:flex;gap:16px;padding:6px 0 0}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
  .legend .sw{width:10px;height:10px;border-radius:1px;display:inline-block}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 14px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);font-weight:400}
  tbody td{border-bottom:1px solid var(--line);color:var(--tx)}
  td.item{color:var(--tx2);font-family:var(--ui)}
  td.win{color:var(--acc);font-weight:700}
  td.win.b{color:var(--amber);font-weight:700}
  .verdict{padding:12px 14px;border-top:1px solid var(--line2);background:var(--bg2);font-family:var(--ui);font-size:12px;line-height:1.55}
  .verdict b{font-family:var(--mono)}
  .status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--bg2);color:var(--tx3);font-size:10px}
  .err{padding:24px 14px;color:var(--tx2);font-family:var(--ui);line-height:1.6}
  .err b{color:var(--down);font-family:var(--mono)}
  .dim{color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head">
    <span class="code" id="codeA">--</span>
    <span class="name" id="nameA"></span>
    <span class="vs">vs</span>
    <span class="bcode" id="codeB">--</span>
    <span class="name" id="nameB"></span>
  </div>
  <div class="controls">
    <input class="tk" id="inA" placeholder="TICKER" maxlength="12">
    <span class="hint">vs</span>
    <input class="tk" id="inB" placeholder="TICKER" maxlength="12">
    <button class="go" id="goBtn">COMPARE</button>
    <span class="hint">same sector, or any two tickers</span>
  </div>
  <div class="peers" id="peers" style="display:none"></div>
  <div id="body">
    <div class="err">Type two tickers and hit COMPARE, e.g. <b>EQTY</b> vs <b>KCB</b>.</div>
  </div>
  <div class="status" id="status">loading&hellip;</div>
</div>
<script>
'use strict';
var Q = new URLSearchParams(location.search);
var EXS = ['NSE','NGX','JSE','EGX'];
var listingCache = {};
var CUR = { a:null, b:null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function DASH(){ return '\u2014'; }
function fmtMoney(v, cur){
  if(v===null||v===undefined||isNaN(v)) return DASH();
  var f=+v, s=f<0?'-':'', a=Math.abs(f), o;
  if(a>=1e12) o=(a/1e12).toFixed(2)+'T';
  else if(a>=1e9) o=(a/1e9).toFixed(2)+'B';
  else if(a>=1e6) o=(a/1e6).toFixed(2)+'M';
  else if(a>=1e3) o=(a/1e3).toFixed(2)+'K';
  else o=a.toFixed(2);
  return s+o+(cur?' '+cur:'');
}
function fmtPct(v){ return (v===null||v===undefined||isNaN(v)) ? DASH() : (+v).toFixed(2)+'%'; }
function fmtX(v){ return (v===null||v===undefined||isNaN(v)) ? DASH() : (+v).toFixed(2)+'x'; }
function fmtNum(v, dp){ return (v===null||v===undefined||isNaN(v)) ? DASH() : (+v).toFixed(dp==null?2:dp); }

async function loadJSON(path){
  try{ var r = await fetch(path, {cache:'no-store'}); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
function matchRow(s, tok){
  var st = String(s.ticker||s.sym||'').toUpperCase();
  var base = st.split('.')[0];
  var t = String(tok||'').trim().toUpperCase();
  if(!t) return false;
  return st===t || base===t || String(s.name||'').toUpperCase()===t;
}
async function resolveStock(tok){
  var prefer = (Q.get('ex')||'').toUpperCase();
  var order = prefer ? [prefer].concat(EXS.filter(function(e){return e!==prefer;})) : EXS.slice();
  for(var i=0;i<order.length;i++){
    var ex = order[i];
    if(!listingCache[ex]){
      var d = await loadJSON('../../static_data/listing_'+ex+'.json');
      listingCache[ex] = d ? (d.stocks||[]) : [];
    }
    var row = listingCache[ex].find(function(s){ return matchRow(s, tok); });
    if(row) return Object.assign({ ex: ex }, row);
  }
  return null;
}
function histKey(s, maxFirst){
  var ex = s.ex, sym = s.sym || s.ticker;
  if(ex==='NSE') return 'NSE_'+s.ticker;
  if(ex==='NGX') return 'NGX_'+s.ticker;
  return sym; // JSE/EGX: sym is 4SI.JO / AALR.CA
}
async function loadHistory(s){
  var ex = s.ex, sym = s.sym || s.ticker;
  var paths = [];
  if(ex==='NSE') paths = ['NSE_'+s.ticker+'.json'];
  else if(ex==='NGX') paths = ['NGX_'+s.ticker+'.json'];
  else paths = [sym+'.max.json', sym+'.json'];
  for(var i=0;i<paths.length;i++){
    var d = await loadJSON('../../static_data/history/'+paths[i]);
    if(d && d.bars && d.bars.length) return d;
  }
  return null;
}
function latestVal(rows, aliases){
  var norm = {};
  (rows||[]).forEach(function(r){ var l=String(r.label||'').trim().toLowerCase(); if(l && !(l in norm)) norm[l]=r.values||[]; });
  for(var i=0;i<aliases.length;i++){
    if(norm[aliases[i]]){
      for(var j=0;j<norm[aliases[i]].length;j++){
        var v = norm[aliases[i]][j];
        if(v!==null && v!==undefined && !isNaN(v)) return v;
      }
    }
  }
  return null;
}
var EPS_ALS=['eps','earnings per share','basic earnings per share (shs)','basic and diluted earnings per share (kshs)','earnings per share (kshs)','loss per share (ksh)','basic eps','diluted eps'];
var ROE_ALS=['roe (%)','roe'];
var ROA_ALS=['roa (%)','roa'];
var NM_ALS=['net margin (%)','net margin'];
var NP_ALS=['net profit','net income','profit for the year','profit after tax','profit attributable to owners of the company','profit attributable to equity holders','total profit/loss','profit/loss'];
var TE_ALS=['total equity',"total shareholders' equity",'total shareholders equity',"shareholders' equity","total stockholders' equity",'capital and reserves'];
var TL_ALS=['total liabilities'];
var DE_ALS=['debt to equity'];

function barDate(b){
  var t = b.t;
  if(typeof t === 'string') return t.slice(0,10);
  if(typeof t === 'number') return new Date(t*1000).toISOString().slice(0,10);
  return null;
}
function buildMetrics(s, inc, bal){
  var m = { name: s.name, ex: s.ex, cur: s.currency||'', price: num(s.price), chgPct: num(s.chgPct), ytd: parseYtd(s.ytd) };
  if(inc && inc.rows){
    m.eps = latestVal(inc.rows, EPS_ALS);
    m.roe = latestVal(inc.rows, ROE_ALS);
    m.roa = latestVal(inc.rows, ROA_ALS);
    m.netMargin = latestVal(inc.rows, NM_ALS);
    m.netProfit = latestVal(inc.rows, NP_ALS);
  }
  if(bal && bal.rows){
    m.totalEquity = latestVal(bal.rows, TE_ALS);
    m.totalLiab = latestVal(bal.rows, TL_ALS);
    var de = latestVal(bal.rows, DE_ALS);
    if(de==null && m.totalLiab!=null && m.totalEquity!=null && m.totalEquity!==0) de = m.totalLiab/m.totalEquity;
    m.debtEquity = de;
  }
  if(m.price!=null && m.eps!=null && m.eps>0) m.pe = m.price/m.eps;
  return m;
}
function num(v){ return (v===null||v===undefined||v==='') ? null : Number(v); }
function parseYtd(v){
  if(v===null||v===undefined||v==='') return null;
  var s = String(v).replace(/[%+\s]/g,'');
  var n = Number(s);
  return isNaN(n) ? null : n;
}
function align(a, b){
  var ma = new Map(), mb = new Map();
  a.forEach(function(x){ ma.set(x.date, x.c); });
  b.forEach(function(x){ mb.set(x.date, x.c); });
  var dates = [];
  ma.forEach(function(_, d){ if(mb.has(d)) dates.push(d); });
  dates.sort();
  return dates.map(function(d){ return { d: d, a: ma.get(d), b: mb.get(d) }; });
}
function downsample(rows, n){
  if(rows.length <= n) return rows;
  var out = [], step = (rows.length-1)/(n-1);
  for(var i=0;i<n;i++) out.push(rows[Math.round(i*step)]);
  return out;
}
function renderChart(rows, mA, mB){
  if(!rows || rows.length < 2){
    return { html: '<div class="window">No common price history for these two securities.</div>', ret: null };
  }
  var baseA = rows[0].a, baseB = rows[0].b;
  if(!baseA || !baseB){ return { html: '<div class="window">No common price history for these two securities.</div>', ret: null }; }
  var pts = downsample(rows, 90);
  var seriesA = pts.map(function(r){ return (r.a/baseA-1)*100; });
  var seriesB = pts.map(function(r){ return (r.b/baseB-1)*100; });
  var all = seriesA.concat(seriesB);
  var lo = Math.min(0, Math.min.apply(null, all)), hi = Math.max(0, Math.max.apply(null, all));
  var pad = (hi-lo)*0.08 || 1; lo -= pad; hi += pad;
  var W = 900, H = 240, L = 46, R = 12, T = 10, B = 22;
  var iw = W - L - R, ih = H - T - B;
  function X(i){ return L + (i/(pts.length-1))*iw; }
  function Y(v){ return T + (1-(v-lo)/(hi-lo))*ih; }
  function line(series){
    var d = '';
    for(var i=0;i<series.length;i++){ d += (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(series[i]).toFixed(1); }
    return d;
  }
  var grid = '';
  var steps = 5;
  for(var g=0; g<=steps; g++){
    var v = lo + (hi-lo)*g/steps;
    var y = Y(v);
    grid += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#1a1a1a"/>';
    grid += '<text x="'+(L-6)+'" y="'+(y+3)+'" fill="#6a6a6a" font-size="9" text-anchor="end">'+v.toFixed(0)+'%</text>';
  }
  function xlabel(i, anchor){
    var d = pts[i].d;
    return '<text x="'+X(i)+'" y="'+(H-6)+'" fill="#6a6a6a" font-size="9" text-anchor="'+anchor+'">'+d+'</text>';
  }
  var zeroY = Y(0);
  var zero = '<line x1="'+L+'" y1="'+zeroY+'" x2="'+(W-R)+'" y2="'+zeroY+'" stroke="#3a3a3a" stroke-dasharray="3 3"/>';
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + grid + zero
    + '<path d="'+line(seriesB)+'" fill="none" stroke="#e0a341" stroke-width="1.6" vector-effect="non-scaling-stroke"/>'
    + '<path d="'+line(seriesA)+'" fill="none" stroke="#33e29a" stroke-width="1.6" vector-effect="non-scaling-stroke"/>'
    + xlabel(0,'start') + xlabel(Math.floor((pts.length-1)/2),'middle') + xlabel(pts.length-1,'end')
    + '</svg>';
  var windowTxt = 'common window: '+rows[0].d+' to '+rows[rows.length-1].d+' ('+pts.length+' points), rebased to 100 at start';
  var html = '<div class="window">'+windowTxt+'</div>' + svg
    + '<div class="legend">'
    + '<span class="li"><span class="sw" style="background:#33e29a"></span>'+esc(mA.ticker||mA.sym)+' '+(seriesA[seriesA.length-1]>=0?'+':'')+seriesA[seriesA.length-1].toFixed(1)+'%</span>'
    + '<span class="li"><span class="sw" style="background:#e0a341"></span>'+esc(mB.ticker||mB.sym)+' '+(seriesB[seriesB.length-1]>=0?'+':'')+seriesB[seriesB.length-1].toFixed(1)+'%</span>'
    + '</div>';
  return { html: html, ret: { a: seriesA[seriesA.length-1], b: seriesB[seriesB.length-1] } };
}

function row(label, av, bv, fmt, winner){
  var aWin = winner==='a', bWin = winner==='b';
  return '<tr><td class="item">'+esc(label)+'</td>'
    + '<td class="'+(aWin?'win':'')+'">'+fmt(av)+'</td>'
    + '<td class="'+(bWin?'win b':'')+'">'+fmt(bv)+'</td></tr>';
}
function renderTable(mA, mB){
  var curA = mA.cur || 'KES', curB = mB.cur || 'KES';
  var rows = '';
  rows += row('Price', mA.price!=null ? mA.price.toLocaleString(undefined,{maximumFractionDigits:2}) : DASH(),
                     mB.price!=null ? mB.price.toLocaleString(undefined,{maximumFractionDigits:2}) : DASH(),
                     function(v){return v;}, null);
  rows += row('Day change', fmtPct(mA.chgPct), fmtPct(mB.chgPct), function(v){return v;}, null);
  rows += row('YTD return', fmtPct(mA.ytd), fmtPct(mB.ytd), function(v){return v;},
              (mA.ytd!=null && mB.ytd!=null) ? (mA.ytd>mB.ytd?'a':mA.ytd<mB.ytd?'b':null) : null);
  rows += row('EPS (latest)', fmtNum(mA.eps), fmtNum(mB.eps), function(v){return v;}, null);
  rows += row('P/E', fmtNum(mA.pe), fmtNum(mB.pe), function(v){return v;},
              (mA.pe!=null && mB.pe!=null) ? (mA.pe<mB.pe?'a':mA.pe>mB.pe?'b':null) : null);
  rows += row('ROE', fmtPct(mA.roe), fmtPct(mB.roe), function(v){return v;},
              (mA.roe!=null && mB.roe!=null) ? (mA.roe>mB.roe?'a':mA.roe<mB.roe?'b':null) : null);
  rows += row('ROA', fmtPct(mA.roa), fmtPct(mB.roa), function(v){return v;},
              (mA.roa!=null && mB.roa!=null) ? (mA.roa>mB.roa?'a':mA.roa<mB.roa?'b':null) : null);
  rows += row('Net margin', fmtPct(mA.netMargin), fmtPct(mB.netMargin), function(v){return v;}, null);
  rows += row('Debt / equity', fmtX(mA.debtEquity), fmtX(mB.debtEquity), function(v){return v;},
              (mA.debtEquity!=null && mB.debtEquity!=null) ? (mA.debtEquity<mB.debtEquity?'a':mA.debtEquity>mB.debtEquity?'b':null) : null);
  rows += row('Net profit', fmtMoney(mA.netProfit, curA), fmtMoney(mB.netProfit, curB), function(v){return v;}, null);
  return '<table><thead><tr><th>Metric</th><th style="color:#33e29a">'+esc(mA.ticker||mA.sym)+'</th><th style="color:#e0a341">'+esc(mB.ticker||mB.sym)+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function verdict(mA, mB, ret){
  var p = [];
  if(ret){
    var ra = ret.a, rb = ret.b;
    if(ra === rb){
      p.push('Both returned <b>'+ra.toFixed(1)+'%</b> over the common window.');
    } else {
      var w = ra > rb ? mA : mB, l = ra > rb ? mB : mA;
      var best = Math.max(ra, rb), worst = Math.min(ra, rb);
      p.push('<b>'+esc(w.ticker||w.sym)+'</b> returned <b>'+best.toFixed(1)+'%</b> over the common window vs <b>'+worst.toFixed(1)+'%</b> for '+esc(l.ticker||l.sym)+'.');
    }
  }
  if(mA.roe!=null && mB.roe!=null){
    var rw = mA.roe>mB.roe?mA:mB;
    p.push('<b>'+esc(rw.ticker||rw.sym)+'</b> has the higher return on equity (<b>'+rw.roe.toFixed(1)+'%</b> vs '+(rw===mA?mB:mA).roe.toFixed(1)+'%).');
  }
  if(mA.pe!=null && mB.pe!=null){
    var cw = mA.pe<mB.pe?mA:mB;
    p.push('<b>'+esc(cw.ticker||cw.sym)+'</b> trades on the lower P/E (<b>'+cw.pe.toFixed(1)+'x</b> vs '+(cw===mA?mB:mA).pe.toFixed(1)+'x).');
  }
  if(mA.debtEquity!=null && mB.debtEquity!=null){
    var lw = mA.debtEquity<mB.debtEquity?mA:mB;
    p.push('<b>'+esc(lw.ticker||lw.sym)+'</b> carries less leverage (D/E <b>'+lw.debtEquity.toFixed(2)+'x</b> vs '+(lw===mA?mB:mA).debtEquity.toFixed(2)+'x).');
  }
  if(!p.length) return 'Not enough data to compare.';
  return p.join(' ');
}

async function load(stockA, stockB){
  $('status').textContent = 'loading '+esc(stockA.ticker||stockA.sym)+' vs '+esc(stockB.ticker||stockB.sym)+'&hellip;';
  var symA = stockA.sym || stockA.ticker, symB = stockB.sym || stockB.ticker;
  var [incA, balA, hisA, incB, balB, hisB] = await Promise.all([
    loadJSON('../../static_data/financials/'+symA+'__income.json'),
    loadJSON('../../static_data/financials/'+symA+'__balance.json'),
    loadHistory(stockA),
    loadJSON('../../static_data/financials/'+symB+'__income.json'),
    loadJSON('../../static_data/financials/'+symB+'__balance.json'),
    loadHistory(stockB)
  ]);
  var mA = buildMetrics(stockA, incA, balA);
  var mB = buildMetrics(stockB, incB, balB);
  var rows = (hisA && hisB) ? align(
    (hisA.bars||[]).map(function(b){return {date:barDate(b), c:b.c};}).filter(function(x){return x.date && x.c!=null;}),
    (hisB.bars||[]).map(function(b){return {date:barDate(b), c:b.c};}).filter(function(x){return x.date && x.c!=null;})
  ) : null;
  var chart = renderChart(rows, mA, mB);
  var table = renderTable(mA, mB);
  var ver = verdict(mA, mB, chart.ret);
  $('body').innerHTML = '<div class="chartbox">' + chart.html + '</div>' + table + '<div class="verdict">'+ver+'</div>';
  $('head').innerHTML = '<span class="code">'+esc(mA.ticker||mA.sym)+'</span><span class="name">'+esc(mA.name)+'</span>'
    + '<span class="vs">vs</span><span class="bcode">'+esc(mB.ticker||mB.sym)+'</span><span class="name">'+esc(mB.name)+'</span>';
  $('status').textContent = 'data as filed; chart is price return rebased to 100 over the common window';
}

async function compare(tokA, tokB){
  var a = await resolveStock(tokA);
  var b = await resolveStock(tokB);
  if(!a || !b){
    var missing = !a ? tokA : (!b ? tokB : '');
    $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(missing)+'</b>. Check the ticker and try again.</div>';
    $('status').textContent = 'not found';
    return;
  }
  CUR.a = a; CUR.b = b;
  renderPeers(a, b);
  await load(a, b);
}
function renderPeers(a, b){
  var box = $('peers');
  if(!a || !a.sector){ box.style.display='none'; box.innerHTML=''; return; }
  var peers = [];
  EXS.forEach(function(ex){
    (listingCache[ex]||[]).forEach(function(s){
      if((s.sector||'').toLowerCase()===(a.sector||'').toLowerCase()
         && (s.ticker||s.sym)!==(a.ticker||a.sym) && (s.ticker||s.sym)!==(b ? (b.ticker||b.sym) : '') && (s.ticker||s.sym)) peers.push(s);
    });
  });
  if(!peers.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  var html = '<span class="pl">'+esc(a.sector)+' peers:</span>';
  peers.slice(0,14).forEach(function(s){
    var t = s.ticker||s.sym;
    html += '<a data-tk="'+esc(t)+'">'+esc(t)+'</a>';
  });
  box.innerHTML = html;
  box.querySelectorAll('a[data-tk]').forEach(function(el){
    el.addEventListener('click', function(){ compare(a.ticker||a.sym, el.getAttribute('data-tk')); });
  });
}
$('goBtn').addEventListener('click', function(){
  var a = $('inA').value.trim(), b = $('inB').value.trim();
  if(a && b) compare(a, b);
  else if(a){
    resolveStock(a).then(function(one){
      if(!one){ $('body').innerHTML = '<div class="err">Could not resolve <b>'+esc(a)+'</b>.</div>'; return; }
      CUR.a = one;
      renderPeers(one, null);
      $('head').innerHTML = '<span class="code">'+esc(one.ticker||one.sym)+'</span><span class="name">'+esc(one.name)+'</span><span class="vs">vs</span><span class="bcode">--</span>';
      $('body').innerHTML = '<div class="err">Pick a peer from above, or type a second ticker.</div>';
    });
  }
});
['inA','inB'].forEach(function(id){
  $(id).addEventListener('keydown', function(e){ if(e.key==='Enter') $('goBtn').click(); });
});

// boot
(async function(){
  var a = Q.get('a'), b = Q.get('b');
  if(a){ $('inA').value = a.toUpperCase(); }
  if(b){ $('inB').value = b.toUpperCase(); }
  if(a && b){ await compare(a, b); }
  else if(a){ var one = await resolveStock(a); if(one){ CUR.a=one; renderPeers(one, null); $('body').innerHTML='<div class="err">Pick a peer from above, or type a second ticker.</div>'; $('head').innerHTML='<span class="code">'+esc(one.ticker||one.sym)+'</span><span class="name">'+esc(one.name)+'</span><span class="vs">vs</span><span class="bcode">--</span>'; } }
  else { $('status').textContent = 'ready'; }
})();
</script>
</body>
</html>
