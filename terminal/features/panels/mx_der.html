<!DOCTYPE html>
<!--
  MUTXRI TERMINAL - DER (Derivatives) panel.

  Per-EXCHANGE listed-derivatives board: NSE (Nairobi, KES), NGX (Lagos,
  NGN), JSE (Johannesburg, ZAR), EGX (Cairo, EGP). For the selected
  exchange it lists each contract's underlying, contract type, expiry and
  the price or settlement where the source publishes it, in the contract's
  own currency, each row carrying its own as-of date and source.

  EXPIRY IS MARKED: the expiry date is shown, a contract already past its
  expiry is tagged EXPIRED, and the days to expiry are computed from the
  real expiry date against today - never guessed. When a row carries no
  usable expiry date, the day count renders as a dash that states why.

  HONESTY DESIGN: this is a snapshot board, not a live feed. A missing data
  file renders an explicit not-available state naming the file; a value the
  source does not publish renders as a dash carrying the reason. Nothing is
  invented and no sample or placeholder contract is ever shown.

  DATA INTERFACE. Reads static_data/derivatives.json (or the file named by
  the ?deriv= override, a local-verification hook only):

    {"contracts":[{ "underlying","kind"|"type","expiry","exchange",
      "currency","price","settlement","asOf","source" }, ...]}

  A bare top-level array of such contracts is also accepted. Fields are
  matched case-insensitively across the common spellings (type / kind /
  contractType; price / settlement / last).

  Vanilla JS, exact terminal tokens, no build step.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUTXRI TERMINAL - DER</title>
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* the terminal is black; the OS scrollbar is not. Thin, dark, no arrows -
     each panel is its own document, so the app's scrollbar CSS cannot reach in
     here and every panel has to say this for itself. */
  html{color-scheme:dark;scrollbar-width:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --down:#f87171; --acc:#33e29a; --warn:#e0a340;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .der-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:780px; margin:24px auto; }
  .der-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .der-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .der-title b { color:var(--acc); font-weight:700; }
  .der-refresh { background:transparent; border:1px solid var(--line2); border-radius:2px; color:var(--tx2); font-family:var(--mono); font-size:11px; padding:4px 10px; cursor:pointer; }
  .der-refresh:hover { border-color:var(--acc); color:var(--acc); }
  .der-ex { display:flex; gap:0; border-bottom:1px solid var(--line2); }
  .der-ex button { flex:1; background:var(--bg3); color:var(--tx3); border:0; border-right:1px solid var(--line2);
                   padding:8px 10px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; cursor:pointer; }
  .der-ex button:last-child { border-right:0; }
  .der-ex button.on { background:var(--bg4); color:var(--acc); }
  .der-ex button:hover { color:var(--acc); }
  .der-note { padding:8px 14px; border-bottom:1px solid var(--line); color:var(--tx3); font-size:10px; font-family:var(--mono); line-height:1.5; }
  .der-cols, .der-inst { display:grid; grid-template-columns:1.5fr 0.9fr 1fr 0.7fr 1fr 0.5fr 1fr; gap:8px; padding:6px 14px; }
  .der-cols { color:var(--tx3); font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
              border-bottom:1px solid var(--line2); }
  .der-cols span:not(:first-child), .der-inst > span:not(:first-child) { text-align:right; }
  .der-inst { border-bottom:1px solid var(--line); align-items:center; }
  .der-inst:hover { background:var(--bg3); }
  .der-und { font-family:var(--mono); font-size:12px; color:var(--tx); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .der-typ { font-family:var(--mono); font-size:10px; color:var(--tx2); text-align:left !important; }
  .der-num { font-family:var(--mono); font-size:12px; color:var(--tx); font-variant-numeric:tabular-nums; }
  .der-lvl { font-family:var(--mono); font-size:12px; color:var(--acc); font-variant-numeric:tabular-nums; }
  .der-lvl .k { color:var(--tx3); font-size:9px; }
  .der-dte { font-family:var(--mono); font-size:11px; color:var(--tx2); }
  .der-ccy { font-family:var(--mono); font-size:10px; color:var(--tx2); }
  .der-dash { color:var(--tx3); cursor:help; }
  .der-tag { display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
             padding:0 5px; border-radius:2px; border:1px solid var(--line2); color:var(--tx3); margin-left:6px; }
  .der-tag.EXPIRED { border-color:var(--down); color:var(--down); }
  .der-empty { padding:28px 16px; text-align:center; color:var(--tx3); font-family:var(--mono); font-size:12px; line-height:1.7; }
  .der-empty b { color:var(--warn); font-weight:600; }
  .der-foot { padding:8px 14px; border-top:1px solid var(--line); color:var(--tx3); font-family:var(--mono); font-size:10px; line-height:1.5; }
</style>
</head>
<body>

<div class="der-wrap" id="der">
  <div class="der-head">
    <div class="der-title"><b>DER</b> - Derivatives</div>
    <button class="der-refresh" id="derRefresh">Refresh</button>
  </div>
  <div class="der-ex" id="derEx"></div>
  <div class="der-note" id="derNote">-</div>
  <div class="der-cols">
    <span>Underlying</span><span>Type</span><span>Expiry</span><span>DTE</span><span>Px / Settle</span><span>Ccy</span><span>As of</span>
  </div>
  <div id="derBody"></div>
  <div class="der-foot" id="derFoot">-</div>
</div>

<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var EXES = ['NSE', 'NGX', 'JSE', 'EGX'];
  var CUR = {NSE: 'KES', NGX: 'NGN', JSE: 'ZAR', EGX: 'EGP'};
  var ISO2EX = {KE: 'NSE', NG: 'NGX', ZA: 'JSE', EG: 'EGX'};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var ex = (Q.get("ex") || "").toUpperCase();
  if (EXES.indexOf(ex) < 0) ex = "NSE";

  // ?deriv= is a verification hook only; with no override the panel reads the
  // real build output (static_data/derivatives.json) and nothing else.
  var OVERRIDE = Q.get("deriv") || "";
  var DER_ENDPOINT = OVERRIDE || "../../static_data/derivatives.json";
  var rawData = null, loaded = false;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function numOrNull(v){ if (typeof v === "number") return isFinite(v) ? v : null; var n = parseFloat(v); return isFinite(n) ? n : null; }
  function dateOf(v){
    var s = String(v == null ? "" : v).slice(0, 10);
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "";
  }
  function pick(o, keys){
    for (var i = 0; i < keys.length; i++){
      var v = o[keys[i]];
      if (v !== undefined && v !== null && v !== "") return v;
    }
    return null;
  }
  function norm(r){
    var exRaw = String(pick(r, ["exchange", "ex", "market", "board"]) || "").toUpperCase();
    var rEx = EXES.indexOf(exRaw) >= 0 ? exRaw : (ISO2EX[exRaw] || null);
    var ccy = String(pick(r, ["currency", "ccy", "cur"]) || "").toUpperCase();
    if (!ccy && rEx) ccy = CUR[rEx];
    var px = numOrNull(pick(r, ["price", "last", "close", "close_price", "last_price", "base_price", "open_price", "px"]));
    var st = numOrNull(pick(r, ["settlement", "settlementPrice", "settle", "settlement_price"]));
    var level = (px != null) ? { v: px, kind: "px" } : ((st != null) ? { v: st, kind: "settle" } : null);
    return {
      ex: rEx, ccy: ccy,
      underlying: String(pick(r, ["underlying", "instrument", "name", "asset", "symbol", "ticker", "code"]) || ""),
      symbol: String(pick(r, ["symbol", "ticker", "code", "contract", "id"]) || ""),
      kind: String(pick(r, ["contract_type", "contractType", "type", "category", "kind"]) || ""),
      expiry: dateOf(pick(r, ["expiry", "expiryDate", "expiry_date", "expiration", "maturity", "matures"])),
      level: level,
      asOf: dateOf(pick(r, ["asOf", "as_of", "date", "updated"])),
      source: String(pick(r, ["source", "src", "provider"]) || "")
    };
  }
  function rowsFrom(data){
    if (!data) return null;
    if (Array.isArray(data)) return data.map(norm);
    if (Array.isArray(data.contracts)) return data.contracts.map(norm);
    if (Array.isArray(data.rows)) return data.rows.map(norm);
    return null;
  }

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" +
           (d.getDate() < 10 ? "0" : "") + d.getDate();
  }
  function dte(expiry){
    if (!expiry) return null;
    var t = Date.parse(expiry + "T00:00:00Z"), n = Date.parse(todayISO() + "T00:00:00Z");
    if (isNaN(t) || isNaN(n)) return null;
    return Math.round((t - n) / 86400000);
  }
  function niceDate(iso){
    if (!iso) return "";
    var p = iso.split("-");
    if (p.length !== 3) return iso;
    return p[2] + " " + (MON[parseInt(p[1], 10) - 1] || p[1]) + " " + p[0];
  }

  function dash(reason){ return '<span class="der-dash" title="' + esc(reason) + '">-</span>'; }
  function levelText(lv){
    if (!lv) return null;
    var dp = lv.kind === "px" ? 3 : 4;
    return Number(lv.v).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:dp});
  }

  function renderExSwitch(){
    $("derEx").innerHTML = EXES.map(function(e){
      return '<button type="button" data-ex="' + e + '"' + (e === ex ? ' class="on"' : '') + '>' + e + '</button>';
    }).join("");
  }

  function renderEx(){
    if (!loaded){ $("derBody").innerHTML = ""; return; }
    var rows = (rowsFrom(rawData) || []).filter(function(r){ return r.ex === ex; });
    // Order: nearest expiry first (undated last), then underlying.
    rows.sort(function(a, b){
      var ea = a.expiry || "9999-99-99", eb = b.expiry || "9999-99-99";
      if (ea !== eb) return ea < eb ? -1 : 1;
      return String(a.underlying).localeCompare(String(b.underlying));
    });
    if (!rows.length){
      var src = OVERRIDE || "static_data/derivatives.json";
      var why = (rawData === null)
        ? "the data file was not found or could not be read"
        : "the file carried no derivative contracts for " + ex;
      $("derBody").innerHTML = '<div class="der-empty"><b>Derivative data not available for ' + esc(ex) + '</b><br>' +
        esc(src) + " - " + esc(why) + '.<br>No sample or placeholder contracts are shown.</div>';
      $("derFoot").textContent = "no derivatives source for " + ex;
      $("derNote").textContent = "";
      return;
    }
    $("derNote").textContent = (rawData && rawData.note) ? rawData.note : "";
    var today = todayISO();
    $("derBody").innerHTML = rows.map(function(r){
      var d = dte(r.expiry);
      var exp = r.expiry
        ? '<span class="der-num">' + esc(r.expiry) + (r.expiry < today ? '<span class="der-tag EXPIRED">EXPIRED</span>' : "") + "</span>"
        : dash("the source does not publish an expiry date for this contract");
      var dteCell = (d == null)
        ? dash(r.expiry ? "the expiry date could not be parsed" : "no expiry date on file, so days to expiry cannot be computed")
        : '<span class="der-dte">' + (d >= 0 ? d + "d" : "past") + "</span>";
      var lt = levelText(r.level);
      var lvl = lt == null
        ? dash("the source publishes neither a price nor a settlement for this contract")
        : '<span class="der-lvl">' + esc(lt) + ' <span class="k">' + (r.level.kind === "px" ? "px" : "settle") + "</span></span>";
      var sy = (r.symbol && r.symbol !== r.underlying) ? ' <span class="der-dte">' + esc(r.symbol) + "</span>" : "";
      return '<div class="der-inst" title="' + esc(r.source || "source not stated") + '">' +
        '<span class="der-und">' + esc(r.underlying) + sy + "</span>" +
        '<span class="der-typ">' + (r.kind ? esc(r.kind) : dash("contract type not stated")) + "</span>" +
        "<span>" + exp + "</span>" +
        "<span>" + dteCell + "</span>" +
        "<span>" + lvl + "</span>" +
        '<span class="der-ccy">' + (r.ccy ? esc(r.ccy) : dash("the row names no currency")) + "</span>" +
        '<span class="der-ccy">' + (r.asOf ? esc(r.asOf) : dash("the row carries no as-of date")) + "</span>" +
      "</div>";
    }).join("");
    var srcs = {};
    rows.forEach(function(r){ if (r.source) srcs[r.source] = 1; });
    var srcList = Object.keys(srcs).length ? Object.keys(srcs).join("; ") : "source not stated on file";
    $("derFoot").textContent = rows.length + " contract" + (rows.length === 1 ? "" : "s") + " on " + ex +
      " - as shown, not a live feed. Source: " + srcList + ".";
  }

  function load(){
    $("derFoot").textContent = "loading...";
    fetch(DER_ENDPOINT + (DER_ENDPOINT.indexOf("?") < 0 ? "?t=" : "&t=") + Date.now())
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(data){ rawData = data; loaded = true; renderEx(); })
      .catch(function(){ rawData = null; loaded = true; renderEx(); });
  }

  $("derEx").addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("button[data-ex]");
    if (!b) return;
    ex = b.getAttribute("data-ex");
    renderExSwitch();
    renderEx();
  });
  $("derRefresh").addEventListener("click", load);

  window.showDer = function(){ var el = $("der"); if (el) el.scrollIntoView({ behavior:"smooth" }); };

  function init(){ renderExSwitch(); load(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
