<!--
  afri_financials.html  -  Financials tab panel (Income / Balance / Cash Flow)
  Standalone: shows verified real filing links + a dash scaffold (NO made-up
  numbers). Wired: fetches GET /api/financials and shows real filed statements.
  Always links each company's investor-relations / filing PDFs as primary source.
  Exposes window.showFinancials(ticker) for the command bar.
  Vanilla JS, single file, no build step. Godel palette, mint accent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financials</title>
<style>
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1f1f1f;--line:#1a1a1a;--line2:#262626;
    --tx:#f0f0f0;--tx2:#9a9a9a;--tx3:#6a6a6a;--up:#33e29a;--acc:#33e29a;--down:#f87171;--acc2:#1ecfb0;
    --mono:'Oxygen Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px}
  .wrap{border:1px solid var(--line2);background:var(--bg);max-width:900px}
  .head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--bg2)}
  .code{color:var(--acc);font-weight:700;letter-spacing:.04em}
  .name{color:var(--tx2);font-family:var(--ui)}
  .spacer{margin-left:auto}
  .filing{color:var(--acc);text-decoration:none;font-size:11px;border:1px solid rgba(51,226,154,.35);padding:3px 9px;border-radius:2px}
  .filing:hover{background:rgba(51,226,154,.08)}
  .filing[aria-disabled="true"]{color:var(--tx3);border-color:var(--line2);pointer-events:none}
  .controls{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
  .seg button{background:var(--bg2);color:var(--tx2);border:0;padding:6px 12px;font-family:var(--mono);font-size:11px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button[aria-pressed="true"]{background:var(--acc);color:#00160e;font-weight:700}
  select{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:2px;padding:6px 8px;font-family:var(--mono);font-size:11px}
  label.lbl{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 14px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);font-weight:400}
  tbody td{border-bottom:1px solid var(--line);color:var(--tx)}
  tbody tr:hover td{background:var(--bg2)}
  td.item{color:var(--tx2);font-family:var(--ui)}
  tr.total td{color:var(--tx);font-weight:700;border-top:1px solid var(--line2)}
  tr.total td.item{color:var(--tx)}
  .neg{color:var(--down)}
  .status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--bg2);color:var(--tx3);font-size:10px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--tx3)}
  .dot.live{background:var(--acc)}
  .dot.sample{background:#e0a340}
  .badge{border:1px solid var(--line2);border-radius:2px;padding:1px 6px;color:var(--tx2)}
  .empty{padding:34px 14px;text-align:center;color:var(--tx3)}
  .empty a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="panel">
  <div class="head">
    <span class="code">FA</span>
    <span id="tkr" style="font-weight:700">SCOM</span>
    <span class="name" id="coName">Safaricom Plc</span>
    <span class="spacer"></span>
    <a class="filing" id="filing" href="#" target="_blank" rel="noopener">open filing &#8599;</a>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="statement">
      <button data-st="income"  aria-pressed="true">Income Statement</button>
      <button data-st="balance" aria-pressed="false">Balance Sheet</button>
      <button data-st="cashflow" aria-pressed="false">Cash Flow</button>
    </div>
    <span class="spacer"></span>
    <label class="lbl" for="period">Period</label>
    <select id="period">
      <option value="annual">Annual</option>
      <option value="interim">Interim</option>
    </select>
  </div>

  <div id="body"></div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="srcLabel">loading</span>
    <span class="spacer"></span>
    <span class="badge" id="curBadge">&mdash;</span>
    <span id="asOf"></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var state={ticker:"SCOM",statement:"income",period:"annual"};

  // ---- VERIFIED REAL FILINGS (links only, no fabricated numbers) ----------
  // Each URL was confirmed against the issuer's own domain. This panel shows
  // NO made-up financial statements: statement values render as dashes until a
  // real filings loader populates them; users open the primary-source PDF here.
    var FILINGS={
    SCOM:{name:"Safaricom Plc",exchange:"NSE",currency:"KES",ir:"https://www.safaricom.co.ke/investor-relations",reports:[{label:"Annual Report 2026",url:"https://www.safaricom.co.ke/images/Downloads/2026_Safaricom_Annual_Report_Updated.pdf"},{label:"Annual Report 2025",url:"https://www.safaricom.co.ke/images/Downloads/annual-2025-report.pdf"},{label:"Annual Report 2024",url:"https://www.safaricom.co.ke/annualreport_2024/wp-content/uploads/2024/07/safaricom-annual-report.pdf"}]},
    EQTY:{name:"Equity Group Holdings Plc",exchange:"NSE",currency:"KES",ir:"https://equitygroupholdings.com/investor-relations/",reports:[{label:"Integrated Report & Financial Statements 2025",url:"https://equitygroupholdings.com/wp-content/uploads/2026/06/Equity-Group-Holdings-PLC-2025-Integrated-Report-and-Financial-Statements.pdf"},{label:"Integrated Report & Financial Statements 2024",url:"https://equitygroupholdings.com/wp-content/uploads/2025/06/Equity-Group-Holdings-PLC-2024-Integrated-Report-and-Financial-Statements.pdf"},{label:"Audited Financial Statements FY2024",url:"https://equitygroupholdings.com/wp-content/uploads/2025/03/Equity-Group-Holdings-PLC-Audited-Financial-Statements-for-the-Year-Ended-31st-December-2024.pdf"}]},
    DANGCEM:{name:"Dangote Cement Plc",exchange:"NGX",currency:"NGN",ir:"https://cement.dangote.com/annual-report-2024/",reports:[{label:"Annual Report FY2024",url:"https://www.dangotecement.com/wp-content/uploads/2025/05/Dangote-Cement-FY-2024-Annual-Report.pdf"},{label:"Full Year 2024 Account (Audited)",url:"https://cement.dangote.com/wp-content/uploads/2025/03/Dangote-Cement-Full-Year-2024-Account.pdf"}]},
    MTNN:{name:"MTN Nigeria Communications Plc",exchange:"NGX",currency:"NGN",ir:"https://www.mtn.ng/investors/annual-report/",reports:[{label:"Financial Reporting Library (FY2025 audited, FY2024, ...)",url:"https://www.mtn.ng/investors/financial-reporting/"}]},
    COMI:{name:"Commercial International Bank (Egypt)",exchange:"EGX",currency:"EGP",ir:"https://www.cibeg.com/en/investor-relations",reports:[{label:"Annual Report 2025",url:"https://www.cibeg.com/-/media/project/downloads/investor-relations/ir-library/annual-reports/2025/cib-ar-2025-final.pdf"},{label:"Annual Report 2024",url:"https://www.cibeg.com/-/media/project/downloads/investor-relations/ir-library/annual-reports/2024/cib-ar-2024-final.pdf"},{label:"Financial Statements 2024",url:"https://annualreport24.cibeg.com/documents/CIB-AR24-Financial-Statements.pdf"}]},
    SBK:{name:"Standard Bank Group Ltd",exchange:"JSE",currency:"ZAR",ir:"https://www.standardbank.com/sbg/standard-bank-group/investor-relations/results-and-reports",reports:[{label:"Annual Integrated Report 2025",url:"https://www.standardbank.com/static_file/StandardBankGroup/filedownloads/RTS/2025/SBG_AnnualIntegratedReport2025.pdf"},{label:"Annual Financial Statements 2024",url:"https://www.standardbank.com/static_file/Investor%20Relations/Documents/Financial-results/Annual-Results/SBG_2024_Annual-Financial-Statements.pdf"}]},
    SOL:{name:"Sasol Limited",exchange:"JSE",currency:"ZAR",ir:"https://www.sasol.com/investor-centre",reports:[{label:"Integrated Report 2024",url:"https://www.sasol.com/sites/default/files/2024-09/SASOL-Integrated-Report-2024.pdf"}]},
    EABL:{name:"East African Breweries Plc",exchange:"NSE",currency:"KES",ir:"https://www.eabl.com/investors/annual-reports",reports:[{label:"Integrated Annual Report 2024",url:"https://www.eabl.com/~/media/Files/E/eabl/documents/investor/annual-reports/2024/eabl-2024-annual-report-interactive-version.pdf"}]},
    KCB:{name:"KCB Group Plc",exchange:"NSE",currency:"KES",ir:"https://africanfinancials.com/document/ke-kcb-2024-ar-00/",reports:[{label:"Annual Report 2024 (via AfricanFinancials)",url:"https://africanfinancials.com/document/ke-kcb-2024-ar-00/"}]},
    GTCO:{name:"Guaranty Trust Holding Company Plc",exchange:"NGX",currency:"NGN",ir:"https://www.gtcoplc.com/investor-relations/annual-reports",reports:[{label:"Annual Report FY2024",url:"https://gtbank-plc.files.svdcdn.com/production/annual-reports/2024-annual-report/GTCO-FY-2024-Annual-Report.pdf"}]},
    NESTLE:{name:"Nestle Nigeria Plc",exchange:"NGX",currency:"NGN",ir:"https://africanfinancials.com/document/ng-nestle-2024-ar-00/",reports:[{label:"Annual Report 2024",url:"https://www.nestle-cwa.com/sites/g/files/pydnoa346/files/2025-05/2024-Annual-Report-of-Nestle-Nigeria-PLC.pdf"}]},
    ETEL:{name:"Telecom Egypt",exchange:"EGX",currency:"EGP",ir:"https://ir.te.eg/en/FinancialInformation/AnnualReports",reports:[{label:"Annual Reports (IR library)",url:"https://ir.te.eg/en/FinancialInformation/AnnualReports"}]},
    HRHO:{name:"EFG Holding",exchange:"EGX",currency:"EGP",ir:"https://efgholding.com/en/investor-relations/annual-reports",reports:[{label:"FY2024 Earnings Release",url:"https://efgholding.com/uploads/EFG_Holding_FY_24_Earnings_Release_325e534d9b.pdf"}]},
  };

  var SCHEMA={
    income:[["revenue","Revenue"],["costOfSales","Cost of Sales"],["grossProfit","Gross Profit"],
      ["operatingExpenses","Operating Expenses"],["operatingProfit","Operating Profit (EBIT)"],
      ["netFinanceCosts","Net Finance Costs"],["profitBeforeTax","Profit Before Tax"],
      ["taxExpense","Income Tax"],["netProfit","Net Profit"],["eps","EPS"]],
    balance:[["nonCurrentAssets","Non-current Assets"],["currentAssets","Current Assets"],
      ["cashAndEquivalents","Cash & Equivalents"],["totalAssets","Total Assets"],
      ["nonCurrentLiabilities","Non-current Liabilities"],["currentLiabilities","Current Liabilities"],
      ["totalLiabilities","Total Liabilities"],["totalEquity","Total Equity"]],
    cashflow:[["operatingCashFlow","Operating Cash Flow"],["capex","Capital Expenditure"],
      ["freeCashFlow","Free Cash Flow"],["investingCashFlow","Investing Cash Flow"],
      ["financingCashFlow","Financing Cash Flow"],["netChangeInCash","Net Change in Cash"]]
  };
  var TOTAL_KEYS={grossProfit:1,operatingProfit:1,netProfit:1,totalAssets:1,totalLiabilities:1,
    totalEquity:1,freeCashFlow:1,netChangeInCash:1};

  var DASH="\u2014";
  function fmtMoney(v,cur){
    if(v===null||v===undefined||isNaN(v))return DASH;
    var f=+v,s=f<0?"-":"",a=Math.abs(f),o;
    if(a>=1e12)o=(a/1e12).toFixed(1)+"T";
    else if(a>=1e9)o=(a/1e9).toFixed(1)+"B";
    else if(a>=1e6)o=(a/1e6).toFixed(1)+"M";
    else if(a>=1e3)o=(a/1e3).toFixed(1)+"K";
    else o=a.toFixed(1);
    return s+o+(cur?" "+cur:"");
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

  function filingsFor(t){return FILINGS[t]||null;}

  function renderScaffold(rec){
    // Always renders the statement scaffold with dashes (no fabricated numbers)
    // plus a real filings list. `rec.values` is used only if a real server
    // supplied FILED numbers; otherwise everything is a dash.
    var body=document.getElementById("body");
    var cur=rec&&rec.currency?rec.currency:null;
    document.getElementById("curBadge").textContent=cur||DASH;
    document.getElementById("coName").textContent=(rec&&rec.name)||"";
    document.getElementById("tkr").textContent=state.ticker;
    var filing=document.getElementById("filing");
    if(rec&&rec.ir){filing.href=rec.ir;filing.setAttribute("aria-disabled","false");}
    else{filing.href="#";filing.setAttribute("aria-disabled","true");}

    var sch=SCHEMA[state.statement];
    var per=(rec&&rec.periods&&rec.periods.length)?rec.periods:["Latest"];
    var vals=(rec&&rec.values)||{};
    var h='<table><thead><tr><th>'+STMT_TITLE()+'</th>';
    for(var i=0;i<per.length;i++)h+='<th>'+esc(per[i])+'</th>';
    h+='</tr></thead><tbody>';
    for(var r=0;r<sch.length;r++){
      var key=sch[r][0],lbl=sch[r][1],series=vals[key]||[],isTot=TOTAL_KEYS[key];
      h+='<tr class="'+(isTot?'total':'')+'"><td class="item">'+esc(lbl)+'</td>';
      for(var c=0;c<per.length;c++){
        var v=series[c];
        var disp=(key==="eps")?(v==null||isNaN(v)?DASH:(+v).toFixed(2)):fmtMoney(v,cur);
        var neg=(typeof v==="number"&&v<0)?' class="neg"':'';
        h+='<td'+neg+'>'+esc(disp)+'</td>';
      }
      h+='</tr>';
    }
    h+='</tbody></table>';

    // real filings list (primary-source PDFs)
    var reps=(rec&&rec.reports)||[];
    if(reps.length){
      h+='<div style="padding:10px 14px;border-top:1px solid var(--line2)">'+
         '<div style="color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Filings (primary source)</div>';
      for(var k=0;k<reps.length;k++){
        h+='<a href="'+esc(reps[k].url)+'" target="_blank" rel="noopener" '+
           'style="display:inline-block;margin:0 8px 8px 0;color:var(--acc);font-size:11px;'+
           'border:1px solid rgba(51,226,154,.35);padding:4px 10px;border-radius:2px;text-decoration:none">'+
           esc(reps[k].label)+' &#8599;</a>';
      }
      h+='</div>';
    } else {
      h+='<div class="empty">No verified filing links on file for '+esc(state.ticker)+
         '.'+(rec&&rec.ir?' Open the <a href="'+esc(rec.ir)+'" target="_blank" rel="noopener">investor-relations page</a>.':'')+'</div>';
    }
    body.innerHTML=h;
  }

  function render(rec){renderScaffold(rec);}
  function STMT_TITLE(){return {income:"Income Statement",balance:"Balance Sheet",
    cashflow:"Cash Flow Statement"}[state.statement];}

  function setStatus(source,asOf){
    var dot=document.getElementById("dot"),lab=document.getElementById("srcLabel");
    dot.className="dot";
    if(source==="FILED"){dot.classList.add("live");lab.textContent="FILED - from company disclosure";}
    else if(source==="LINKS"){lab.textContent="verified filing links - open PDF for full statements";}
    else if(source==="NONE"){lab.textContent="no filings on file";}
    else{dot.classList.add("live");lab.textContent=esc(source);}
    document.getElementById("asOf").textContent=asOf?("as of "+asOf):"";
  }

  function load(){
    // try the real endpoint; offline, show verified filing links + dash scaffold
    // (NEVER fabricated statement numbers)
    var url="/api/financials?ticker="+encodeURIComponent(state.ticker)+
            "&statement="+state.statement+"&period="+state.period;
    fetch(url).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      var fil=filingsFor(state.ticker)||{};
      if(!d||d.available===false){
        render({periods:[],name:d&&d.name||fil.name,currency:d&&d.currency||fil.currency,
                ir:(d&&d.ir_url)||fil.ir,reports:fil.reports||[]});
        setStatus(fil.reports&&fil.reports.length?"LINKS":"NONE",null);
        return;
      }
      var vals={};(d.rows||[]).forEach(function(row){vals[row.key]=row.values;});
      render({periods:d.periods,currency:d.currency,values:vals,
              ir:d.source_url||d.ir_url||fil.ir,name:d.name,reports:fil.reports||[]});
      setStatus(d.source||"FILED",d.filedAsOf);
    }).catch(function(){
      var fil=filingsFor(state.ticker);
      render(fil?{name:fil.name,currency:fil.currency,ir:fil.ir,reports:fil.reports,periods:[]}:{periods:[]});
      setStatus(fil?"LINKS":"NONE",null);
    });
  }

  // ---- controls ----
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(x){
        x.setAttribute("aria-pressed", x===b ? "true":"false");});
      state.statement=b.getAttribute("data-st");load();
    });
  });
  document.getElementById("period").addEventListener("change",function(e){
    state.period=e.target.value;load();});

  // command-bar hook
  window.showFinancials=function(ticker){
    if(ticker)state.ticker=String(ticker).toUpperCase();
    load();
  };

  load();
})();
</script>
</body>
</html>
