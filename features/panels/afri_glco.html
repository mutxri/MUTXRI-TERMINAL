<!DOCTYPE html>
<!--
  AFRI Terminal — GLCO (Global Commodities) panel. Spec section 9.1 (P2).
  Board of commodities with an African angle: gold/platinum (SA), cocoa
  (GH/CI), coffee/tea (KE/ET/UG). Each row: commodity, price, day %, and
  a mini area sparkline, plus the African-relevance note the spec asks for.

  Standalone-viewable on SAMPLE data; auto-uses /api/commodities when live.
  Vanilla JS, exact Godel tokens, no build step.

  INTEGRATE: lift the .glco-* markup into a right-panel tab (GLCO) and the
  <script> into your bundle. Wire the GLCO command to window.showGlco().
  Delete SAMPLE_ROWS once /api/commodities is live.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AFRI Terminal — GLCO</title>
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --down:#f87171; --acc:#33e29a;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .glco-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:620px; margin:24px auto; }
  .glco-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .glco-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .glco-title b { color:var(--acc); font-weight:700; }
  .glco-refresh { background:transparent; border:1px solid var(--line2); border-radius:2px; color:var(--tx2); font-family:var(--mono); font-size:11px; padding:4px 10px; cursor:pointer; }
  .glco-refresh:hover { border-color:var(--acc); color:var(--acc); }
  .glco-row { display:grid; grid-template-columns:1.3fr 1fr 0.8fr 76px; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .glco-row:hover { background:var(--bg3); }
  .glco-name { display:flex; flex-direction:column; gap:2px; }
  .glco-name .nm { font-family:var(--mono); font-size:13px; color:var(--tx); }
  .glco-name .af { font-size:10px; color:var(--tx3); font-family:var(--ui); line-height:1.3; }
  .glco-price { text-align:right; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; }
  .glco-unit { font-size:9px; color:var(--tx3); }
  .glco-chg { text-align:right; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); } .muted { color:var(--tx3); }
  .glco-spark { height:26px; }
  .glco-foot { padding:8px 14px; border-top:1px solid var(--line); color:var(--tx3); font-family:var(--mono); font-size:10px; }
</style>
</head>
<body>

<div class="glco-wrap" id="glco">
  <div class="glco-head">
    <div class="glco-title"><b>GLCO</b> · Global Commodities</div>
    <button class="glco-refresh" id="glcoRefresh">Refresh</button>
  </div>
  <div id="glcoRows"></div>
  <div class="glco-foot" id="glcoFoot">—</div>
</div>

<script>
(function () {
  "use strict";
  var GLCO_ENDPOINT = "/api/commodities";

  // Clearly-labeled sample; deleted once the endpoint is live.
  var SAMPLE_ROWS = [
    { name:"Gold", unit:"USD/oz", africa:"South Africa — major producer/exporter", price:2412.5, chgPct:0.62, spark:[2380,2388,2375,2402,2395,2412] },
    { name:"Platinum", unit:"USD/oz", africa:"South Africa — ~70% of world supply", price:1012.0, chgPct:-1.14, spark:[1040,1035,1028,1020,1018,1012] },
    { name:"Brent", unit:"USD/bbl", africa:"Nigeria/Angola crude benchmark", price:82.4, chgPct:1.05, spark:[80,80.5,81.2,81.0,81.9,82.4] },
    { name:"Cocoa", unit:"USD/t", africa:"Ghana & Cote d'Ivoire — ~60% of world supply", price:7850, chgPct:2.31, spark:[7600,7680,7720,7700,7790,7850] },
    { name:"Coffee", unit:"USd/lb", africa:"Ethiopia, Kenya, Uganda — key exporters", price:238.5, chgPct:-0.44, spark:[242,240,239,240.5,239,238.5] },
    { name:"Wheat", unit:"USd/bu", africa:"Major African import — food-security signal", price:548.0, chgPct:null, spark:[] }
  ];

  function $(id){ return document.getElementById(id); }

  function sparkline(vals, up) {
    if (!vals || vals.length < 2) return '<span class="muted" style="font-family:var(--mono);font-size:10px;">—</span>';
    var w = 76, h = 26, pad = 2;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 1;
    var stroke = up ? "var(--up)" : "var(--down)";
    var pts = vals.map(function (v, i) {
      var x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
      var y = pad + (1 - (v - min) / range) * (h - 2 * pad);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var area = "M" + pts[0] + " L" + pts.slice(1).join(" L") +
               " L" + (w - pad) + "," + (h - pad) + " L" + pad + "," + (h - pad) + " Z";
    return '<svg class="glco-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + area + '" fill="' + stroke + '" opacity="0.10"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + stroke + '" stroke-width="1.25"/></svg>';
  }

  function fmtPrice(v) {
    if (v == null) return '<span class="muted">—</span>';
    return Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function render(rows) {
    $("glcoRows").innerHTML = rows.map(function (r) {
      var up = r.chgPct == null ? true : r.chgPct >= 0;
      var chgCls = r.chgPct == null ? "muted" : (r.chgPct >= 0 ? "up" : "down");
      var chgTxt = r.chgPct == null ? "—" : (r.chgPct >= 0 ? "+" : "") + Number(r.chgPct).toFixed(2) + "%";
      return '<div class="glco-row">' +
        '<div class="glco-name"><span class="nm">' + r.name + '</span><span class="af">' + (r.africa || "") + '</span></div>' +
        '<div class="glco-price">' + fmtPrice(r.price) + ' <span class="glco-unit">' + (r.unit || "") + '</span></div>' +
        '<div class="glco-chg ' + chgCls + '">' + chgTxt + '</div>' +
        '<div>' + sparkline(r.spark, up) + '</div>' +
      '</div>';
    }).join("");
  }

  function load() {
    $("glcoFoot").textContent = "loading…";
    fetch(GLCO_ENDPOINT)
      .then(function (r) { if (!r.ok) throw new Error("no endpoint"); return r.json(); })
      .then(function (data) {
        render(data.commodities || []);
        $("glcoFoot").textContent = data.freshness || "live";
      })
      .catch(function () {
        render(SAMPLE_ROWS);
        $("glcoFoot").textContent = "SAMPLE DATA (server /api/commodities not reachable)";
      });
  }

  window.showGlco = function () { var el = $("glco"); if (el) el.scrollIntoView({ behavior:"smooth" }); };

  function init() {
    $("glcoRefresh").addEventListener("click", load);
    load();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
