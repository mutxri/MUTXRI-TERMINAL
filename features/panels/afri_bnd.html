<!DOCTYPE html>
<!--
  AFRI Terminal — BND (Bonds & T-Bills) panel. Spec section 9.2 (P2).
  Per-country sovereign yield board: KE, NG, ZA, EG.

  IMPORTANT honesty design: this is a CURATED board, not a live feed
  (no free real-time African sovereign-yield API exists — the spec says
  so). Every instrument shows its own auction date, and figures past the
  staleness threshold are visually flagged. Never presented as live.

  Standalone-viewable on SAMPLE data; auto-uses /api/bonds when live.
  Vanilla JS, exact Godel tokens, no build step.

  INTEGRATE: lift .bnd-* markup into a right-panel tab (BND), lift the
  <script>, wire the BND command to window.showBnd(). Delete SAMPLE_DATA
  once /api/bonds is live.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AFRI Terminal — BND</title>
<link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#000; --bg2:#0a0a0a; --bg3:#141414; --bg4:#1f1f1f;
    --line:#1a1a1a; --line2:#262626;
    --tx:#f0f0f0; --tx2:#9a9a9a; --tx3:#6a6a6a;
    --up:#33e29a; --down:#f87171; --acc:#33e29a; --warn:#e0a340;
    --mono:'Oxygen Mono', ui-monospace, monospace; --ui:'Inter', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--ui); font-size:13px; }
  .bnd-wrap { border:1px solid var(--line2); border-radius:2px; background:var(--bg2); max-width:600px; margin:24px auto; }
  .bnd-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .bnd-title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); }
  .bnd-title b { color:var(--acc); font-weight:700; }
  .bnd-refresh { background:transparent; border:1px solid var(--line2); border-radius:2px; color:var(--tx2); font-family:var(--mono); font-size:11px; padding:4px 10px; cursor:pointer; }
  .bnd-refresh:hover { border-color:var(--acc); color:var(--acc); }
  .bnd-note { padding:8px 14px; border-bottom:1px solid var(--line); color:var(--tx3); font-size:10px; font-family:var(--mono); line-height:1.4; }
  .bnd-country { border-bottom:1px solid var(--line2); }
  .bnd-cty-head { display:flex; align-items:baseline; gap:8px; padding:9px 14px 5px; }
  .bnd-cty-name { font-family:var(--ui); font-size:12px; font-weight:600; color:var(--tx); }
  .bnd-cty-src { font-family:var(--mono); font-size:9px; color:var(--tx3); }
  .bnd-cty-src a { color:var(--tx3); text-decoration:none; }
  .bnd-cty-src a:hover { color:var(--acc); }
  .bnd-inst { display:grid; grid-template-columns:1.4fr 0.6fr 0.7fr 1fr; align-items:center; gap:8px; padding:6px 14px; }
  .bnd-inst:hover { background:var(--bg3); }
  .bnd-inm { font-family:var(--mono); font-size:12px; color:var(--tx); }
  .bnd-tenor { font-family:var(--mono); font-size:10px; color:var(--tx3); }
  .bnd-yield { text-align:right; font-family:var(--mono); font-size:13px; color:var(--acc); font-variant-numeric:tabular-nums; }
  .bnd-fresh { text-align:right; font-family:var(--mono); font-size:9px; color:var(--tx3); }
  .bnd-fresh.stale { color:var(--warn); }
  .bnd-foot { padding:8px 14px; color:var(--tx3); font-family:var(--mono); font-size:10px; }
</style>
</head>
<body>

<div class="bnd-wrap" id="bnd">
  <div class="bnd-head">
    <div class="bnd-title"><b>BND</b> · Bonds &amp; T-Bills</div>
    <button class="bnd-refresh" id="bndRefresh">Refresh</button>
  </div>
  <div class="bnd-note" id="bndNote">—</div>
  <div id="bndBody"></div>
  <div class="bnd-foot" id="bndFoot">—</div>
</div>

<script>
(function () {
  "use strict";
  var BND_ENDPOINT = "/api/bonds";

  // Clearly-labeled sample; mirrors the /api/bonds shape. Delete once live.
  var SAMPLE_DATA = {
    note: "Curated from central-bank auction results — not a live feed.",
    countries: [
      { iso:"KE", country:"Kenya", source:"Central Bank of Kenya", source_url:"#", instruments:[
        { name:"91-day T-bill", tenor:"91d", "yield":15.98, freshness:"3 days ago", stale:false },
        { name:"182-day T-bill", tenor:"182d", "yield":16.22, freshness:"3 days ago", stale:false },
        { name:"364-day T-bill", tenor:"364d", "yield":16.75, freshness:"3 days ago", stale:false }
      ]},
      { iso:"NG", country:"Nigeria", source:"CBN / DMO", source_url:"#", instruments:[
        { name:"364-day NTB", tenor:"364d", "yield":22.05, freshness:"7 days ago", stale:false },
        { name:"FGN 2033 bond", tenor:"10y", "yield":20.10, freshness:"21 days ago — may be out of date", stale:true }
      ]},
      { iso:"ZA", country:"South Africa", source:"National Treasury / JSE", source_url:"#", instruments:[
        { name:"R2032", tenor:"10y", "yield":10.85, freshness:"2 days ago", stale:false }
      ]},
      { iso:"EG", country:"Egypt", source:"Central Bank of Egypt", source_url:"#", instruments:[
        { name:"91-day T-bill", tenor:"91d", "yield":27.50, freshness:"4 days ago", stale:false }
      ]}
    ]
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function render(data) {
    $("bndNote").textContent = data.note || "";
    $("bndBody").innerHTML = (data.countries || []).map(function (c) {
      var src = c.source_url && c.source_url !== "#"
        ? '<a href="' + esc(c.source_url) + '" target="_blank" rel="noopener">' + esc(c.source) + "</a>"
        : esc(c.source || "");
      var rows = (c.instruments || []).map(function (i) {
        var y = (i["yield"] == null) ? "—" : Number(i["yield"]).toFixed(2) + "%";
        return '<div class="bnd-inst">' +
          '<span class="bnd-inm">' + esc(i.name) + "</span>" +
          '<span class="bnd-tenor">' + esc(i.tenor) + "</span>" +
          '<span class="bnd-yield">' + y + "</span>" +
          '<span class="bnd-fresh' + (i.stale ? " stale" : "") + '">' + esc(i.freshness) + "</span>" +
        "</div>";
      }).join("");
      return '<div class="bnd-country">' +
        '<div class="bnd-cty-head"><span class="bnd-cty-name">' + esc(c.country) +
          '</span><span class="bnd-cty-src">' + src + "</span></div>" +
        rows +
      "</div>";
    }).join("");
  }

  function load() {
    $("bndFoot").textContent = "loading…";
    fetch(BND_ENDPOINT)
      .then(function (r) { if (!r.ok) throw new Error("no endpoint"); return r.json(); })
      .then(function (data) {
        render(data);
        var warn = data.oldest_days != null && data.oldest_days >= 14
          ? " · some figures may be stale" : "";
        $("bndFoot").textContent = data.count + " instruments · curated" + warn;
      })
      .catch(function () {
        render(SAMPLE_DATA);
        $("bndFoot").textContent = "SAMPLE DATA (server /api/bonds not reachable)";
      });
  }

  window.showBnd = function () { var el = $("bnd"); if (el) el.scrollIntoView({ behavior:"smooth" }); };

  function init() {
    $("bndRefresh").addEventListener("click", load);
    load();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
